접합 방법을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수번식학: 접목","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":[]},{"id":"3-72","round":3,"year":2017,"number":72,"subject":"재배학·원예작물학","topic":"플러그묘 생산의 장단점","stem":"화훼작물의 플러그묘 생산에 관한 옳은 설명을 모두 고른 것은?\nㄱ. 좁은 면적에서 대량육묘가 가능하다.\nㄴ. 최적의 생육조건으로 다양한 규격묘 생산이 가능하다.\nㄷ. 노동집약적이며 관리가 용이하다.\nㄹ. 정밀기술이 요구된다.","options":[{"n":"1","text":"ㄱ, ㄴ, ㄷ"},{"n":"2","text":"ㄱ, ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄷ, ㄹ"},{"n":"4","text":"ㄴ, ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n좁은 면적에서 대량 생산, 규격묘 생산, 정밀기술 요구라는 ㄱ·ㄴ·ㄹ이 맞아 ②이다.\n\n오답 확인\n플러그육묘는 자동화·분업과 노동절감을 추구한다. ㄷ의 '노동집약적'은 이 장점을 반대로 쓴 부분이다. 작은 셀의 수분·양분·환경은 세밀하게 관리해야 한다.\n\n근거·학습주제\n원예육묘학: 플러그육묘","explanationSections":[{"label":"정답 근거","text":"좁은 면적에서 대량 생산, 규격묘 생산, 정밀기술 요구라는 ㄱ·ㄴ·ㄹ이 맞아 ②이다.","kind":"reason"},{"label":"오답 확인","text":"플러그육묘는 자동화·분업과 노동절감을 추구한다. ㄷ의 '노동집약적'은 이 장점을 반대로 쓴 부분이다. 작은 셀의 수분·양분·환경은 세밀하게 관리해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예육묘학: 플러그육묘","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":[]},{"id":"3-73","round":3,"year":2017,"number":73,"subject":"재배학·원예작물학","topic":"세균병과 진균병","stem":"화훼작물의 진균병이 아닌 것은?","options":[{"n":"1","text":"Fusarium에 의한 시들음병"},{"n":"2","text":"Botrytis에 의한 잿빛곰팡이병"},{"n":"3","text":"Xanthomonas에 의한 잎반점병"},{"n":"4","text":"Colletotrichum에 의한 탄저병"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nXanthomonas는 세균이므로 이에 의한 잎반점병은 진균병이 아니며 ③이다.\n\n오답 확인\nFusarium·Botrytis·Colletotrichum은 진균 속으로 각각 시들음·잿빛곰팡이·탄저병과 관련된다. 병 이름뿐 아니라 병원체의 생물학적 분류로 판단한다.\n\n근거·학습주제\n식물병리학: 병원체 분류","explanationSections":[{"label":"정답 근거","text":"Xanthomonas는 세균이므로 이에 의한 잎반점병은 진균병이 아니며 ③이다.","kind":"reason"},{"label":"오답 확인","text":"Fusarium·Botrytis·Colletotrichum은 진균 속으로 각각 시들음·잿빛곰팡이·탄저병과 관련된다. 병 이름뿐 아니라 병원체의 생물학적 분류로 판단한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"식물병리학: 병원체 분류","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":[]},{"id":"3-74","round":3,"year":2017,"number":74,"subject":"재배학·원예작물학","topic":"팬 앤드 포그 냉방","stem":"시설내의 온도를 낮추기 위해 시설의 벽면 위 또는 아래에서 실내로 세무(細霧)를 분\n사시켜 시설 상부에 설치된 풍량형 환풍기로 공기를 뽑아내는 냉각방법은?","options":[{"n":"1","text":"팬 앤드 포그"},{"n":"2","text":"팬 앤드 패드"},{"n":"3","text":"팬 앤드 덕트"},{"n":"4","text":"팬 앤드 팬"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n세무를 온실 내부에 분사하고 환풍기로 공기를 배출하며 증발잠열을 이용하는 방식은 팬 앤드 포그이므로 ①이다.\n\n오답 확인\n팬 앤드 패드는 젖은 패드를 통과하는 공기를 냉각한다. 덕트는 공기 분배·순환용이며, 단순 송풍과 물의 증발에 의한 냉방을 구분한다.\n\n근거·학습주제\n시설원예학: 기화냉방","explanationSections":[{"label":"정답 근거","text":"세무를 온실 내부에 분사하고 환풍기로 공기를 배출하며 증발잠열을 이용하는 방식은 팬 앤드 포그이므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"팬 앤드 패드는 젖은 패드를 통과하는 공기를 냉각한다. 덕트는 공기 분배·순환용이며, 단순 송풍과 물의 증발에 의한 냉방을 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예학: 기화냉방","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":37,"similarIds":[]},{"id":"3-75","round":3,"year":2017,"number":75,"subject":"재배학·원예작물학","topic":"PE 필름의 특성","stem":"다음이 설명하는 시설재배용 플라스틱 피복재는?\n○ 보온성이 떨어진다.\n○ 광투과율이 높고 연질피복재이다.\n○ 표면에 먼지가 잘 부착되지 않는다.\n○ 약품에 대한 내성이 크고 가격이 싸다.","options":[{"n":"1","text":"폴리에틸렌(PE) 필름"},{"n":"2","text":"염화비닐(PVC) 필름"},{"n":"3","text":"에틸렌아세트산(EVA) 필름"},{"n":"4","text":"폴리에스터(PET) 필름"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n폴리에틸렌 필름은 저렴한 연질재로 광투과성과 내약품성이 좋지만 장파복사 차단에 의한 보온성이 상대적으로 낮으므로 ①이다.\n\n오답 확인\nPVC·EVA와 비교할 때 보온·먼지 부착·가격 등의 조합이 단서이다. '플라스틱 필름'이라는 공통점만으로 모든 재질의 특성을 같다고 판단하지 않는다.\n\n근거·학습주제\n시설원예학: 피복재의 재질별 특성","explanationSections":[{"label":"정답 근거","text":"폴리에틸렌 필름은 저렴한 연질재로 광투과성과 내약품성이 좋지만 장파복사 차단에 의한 보온성이 상대적으로 낮으므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"PVC·EVA와 비교할 때 보온·먼지 부착·가격 등의 조합이 단서이다. '플라스틱 필름'이라는 공통점만으로 모든 재질의 특성을 같다고 판단하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예학: 피복재의 재질별 특성","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":37,"similarIds":["4-75","7-74","5-75","1-74"]},{"id":"4-1","round":4,"year":2018,"number":1,"subject":"상법(보험편)","topic":"보험계약의 성립","stem":"보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 보험자의 청약에 대하여 보험계약자가 승낙함으로써 이루어진다."},{"n":"2","text":"보험계약은 보험자의 보험금 지급책임이 우연한 사고의 발생에 달려 있으므로 사행계약의\n성질을 갖는다."},{"n":"3","text":"보험계약의 효력발생에 특별한 요식행위를 요하지 않는다."},{"n":"4","text":"상법 보험편의 보험계약에 관한 규정은 그 성질에 반하지 아니하는 범위에서 상호보험에\n준용한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험계약은 통상 보험계약자가 청약하고 보험자가 승낙하여 성립하는 낙성계약이다. ①은 청약자와 승낙자의 지위를 뒤바꾼 설명이다.\n\n오답 확인\n②의 우연성과 사행성, ③의 불요식성은 계약의 일반적 성질이다. ④의 상호보험 준용은 상법 제664조에 따른다.\n\n근거·학습주제\n상법 제638조·제664조","explanationSections":[{"label":"정답 근거","text":"보험계약은 통상 보험계약자가 청약하고 보험자가 승낙하여 성립하는 낙성계약이다. ①은 청약자와 승낙자의 지위를 뒤바꾼 설명이다.","kind":"reason"},{"label":"오답 확인","text":"②의 우연성과 사행성, ③의 불요식성은 계약의 일반적 성질이다. ④의 상호보험 준용은 상법 제664조에 따른다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조·제664조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["7-1"]},{"id":"4-2","round":4,"year":2018,"number":2,"subject":"상법(보험편)","topic":"약관 설명의 예외","stem":"보험약관의 교부ㆍ설명의무에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면\n판례에 따름)\nㄱ. 고객이 약관의 내용을 충분히 잘 알고 있는 경우에는 보험자가 고객에게 그 약관\n의 내용을 따로 설명하지 않아도 되나, 그러한 따로 설명할 필요가 없는 특별한\n사정은 이를 주장하는 보험자가 입증하여야 한다.\nㄴ. 약관에 정하여진 중요한 사항이라면 설사 거래상 일반적이고 공통된 것이어서\n보험계약자가 별도의 설명 없이도 충분히 예상할 수 있었던 사항이라 할지라도\n보험자는 설명의무를 부담한다.\nㄷ. 약관의 내용이 이미 법령에 의하여 정하여진 것을 되풀이 하는 것에 불과한 경우\n에는 고객에게 이를 따로 설명하지 않아도 된다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄱ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nㄱ과 ㄷ이 옳다. 고객이 이미 충분히 아는 사항이나 법령 내용을 단순히 되풀이한 약관은 별도 설명이 불필요하다. 설명 면제의 특별한 사정은 이를 주장하는 보험자가 입증한다.\n\n오답 확인\nㄴ처럼 거래상 일반적이고 공통되어 별도 설명 없이 예상할 수 있는 사항까지 반드시 설명해야 하는 것은 아니다. 따라서 ㄴ을 포함한 조합은 제외한다.\n\n근거·학습주제\n상법 제638조의3·약관 설명의무 판례 법리","explanationSections":[{"label":"정답 근거","text":"ㄱ과 ㄷ이 옳다. 고객이 이미 충분히 아는 사항이나 법령 내용을 단순히 되풀이한 약관은 별도 설명이 불필요하다. 설명 면제의 특별한 사정은 이를 주장하는 보험자가 입증한다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ처럼 거래상 일반적이고 공통되어 별도 설명 없이 예상할 수 있는 사항까지 반드시 설명해야 하는 것은 아니다. 따라서 ㄴ을 포함한 조합은 제외한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·약관 설명의무 판례 법리","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["2-1","7-8"]},{"id":"4-3","round":4,"year":2018,"number":3,"subject":"상법(보험편)","topic":"보험증권","stem":"보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험기간을 정한 때에는 그 시기와 종기는 상법상 손해보험증권의 기재사항에 해당하지 않는다."},{"n":"2","text":"기존의 보험계약을 연장하는 경우에 보험자는 그 보험증권에 그 사실을 기재함으로써 보험\n증권의 교부에 갈음할 수 있다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날로부터 2주간내에 한하여 그 증권내용의\n정부에 관한 이의를 할 수 있음을 약정할 수 있다."},{"n":"4","text":"보험증권을 현저하게 훼손한 때에는 보험계약자는 보험자에 대하여 증권의 재교부를 청구\n할 수 있는데 그 증권작성의 비용은 보험자의 부담으로 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n계약 연장·변경 시 기존 보험증권에 그 사실을 기재하면 새 증권 교부에 갈음할 수 있으므로 ②가 옳다.\n\n오답 확인\n① 보험기간의 시기·종기도 기재사항이다. ③ 증권내용에 관한 이의기간은 1월 미만으로 약정하지 못한다. ④ 재교부 작성비용은 보험계약자가 부담한다.\n\n근거·학습주제\n상법 제640조·제641조·제642조·제666조","explanationSections":[{"label":"정답 근거","text":"계약 연장·변경 시 기존 보험증권에 그 사실을 기재하면 새 증권 교부에 갈음할 수 있으므로 ②가 옳다.","kind":"reason"},{"label":"오답 확인","text":"① 보험기간의 시기·종기도 기재사항이다. ③ 증권내용에 관한 이의기간은 1월 미만으로 약정하지 못한다. ④ 재교부 작성비용은 보험계약자가 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제641조·제642조·제666조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["12-1","5-4","2-2","11-3","9-3","10-3","6-13","8-3","7-3","10-2","3-5"]},{"id":"4-4","round":4,"year":2018,"number":4,"subject":"상법(보험편)","topic":"객관적 확정과 대리","stem":"보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 당사자 쌍방과 피보험자가 보험계약 당시 보험사고가 발행할 수 없는 것임을 알고\n있었던 때에는 그 계약은 무효로 한다."},{"n":"2","text":"대리인에 의하여 보험계약을 체결한 경우에 대리인이 안 사유는 그 본인이 안 것과 동일\n한 것으로 한다."},{"n":"3","text":"보험계약은 그 계약전의 어느 시기를 보험기간의 시기로 할 수 있다."},{"n":"4","text":"보험계약당시에 보험사고가 이미 발생한 때에는 당사자 쌍방과 피보험자가 이를 알지 못한\n때에도 그 계약은 무효이다."}],"answers":["1","4"],"answerLabel":"1·4번 (복수정답)","explanation":"정답 근거\n공식 최종정답은 ①과 ④ 모두이다. ④는 사고가 이미 발생했더라도 계약 당사자 쌍방과 피보험자가 모두 몰랐으면 유효할 수 있다는 예외를 누락하였다. ①은 객관적 확정 시 무효라는 조문 내용과 대조할 때 문구상 논점이 있으나, 공식 복수정답을 그대로 적용한다.\n\n오답 확인\n② 대리인이 안 사유는 본인이 안 것과 동일하게 취급한다. ③ 계약 전 시점으로 보험기간을 소급하는 소급보험은 허용된다. ①의 '발행' 표기 등 원문의 문언을 임의로 고쳐 단일정답으로 만들지 않는다.\n\n기준·변경 메모\n복수정답 문항이다. 2026년 법령 해석으로 과거의 공식 인정정답 ①·④를 축소하지 않는다.\n\n근거·학습주제\n상법 제643조·제644조·제646조","explanationSections":[{"label":"정답 근거","text":"공식 최종정답은 ①과 ④ 모두이다. ④는 사고가 이미 발생했더라도 계약 당사자 쌍방과 피보험자가 모두 몰랐으면 유효할 수 있다는 예외를 누락하였다. ①은 객관적 확정 시 무효라는 조문 내용과 대조할 때 문구상 논점이 있으나, 공식 복수정답을 그대로 적용한다.","kind":"reason"},{"label":"오답 확인","text":"② 대리인이 안 사유는 본인이 안 것과 동일하게 취급한다. ③ 계약 전 시점으로 보험기간을 소급하는 소급보험은 허용된다. ①의 '발행' 표기 등 원문의 문언을 임의로 고쳐 단일정답으로 만들지 않는다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"복수정답 문항이다. 2026년 법령 해석으로 과거의 공식 인정정답 ①·④를 축소하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"상법 제643조·제644조·제646조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["5-5","11-4","2-24","10-7","9-4","6-14","12-3","3-5","9-17","8-4","7-3"]},{"id":"4-5","round":4,"year":2018,"number":5,"subject":"상법(보험편)","topic":"보험대리상 권한","stem":"보험대리상 등의 권한에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자로부터 청약, 고지, 통지, 해지, 취소 등 보험계약에 관한 의사표시를 수령할 수\n있는 보험대리상의 권한을 보험자가 제한한 경우 보험자는 그 제한을 이유로 선의의 보험\n계약자에게 대항하지 못한다."},{"n":"2","text":"보험자는 보험계약자로부터 보험료를 수령할 수 있는 보험대리상의 권한을 제한할 수 없다."},{"n":"3","text":"특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하는 자라 할지라도 보험대리\n상이 아니면 보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한이 없다."},{"n":"4","text":"보험대리상은 보험계약자에게 보험계약의 체결, 변경, 해지 등 보험계약에 관한 의사표시\n를 할 수 있는 권한이 없다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험대리상의 의사표시 수령권한 등을 제한하더라도 보험자는 그 제한으로 선의의 보험계약자에게 대항하지 못하므로 ①이 옳다.\n\n오답 확인\n② 권한 제한 자체가 불가능한 것은 아니다. ③ 계속적 중개자도 보험증권 교부권한 등이 있다. ④ 보험대리상은 체결·변경·해지 등에 관한 의사표시 권한도 가진다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"보험대리상의 의사표시 수령권한 등을 제한하더라도 보험자는 그 제한으로 선의의 보험계약자에게 대항하지 못하므로 ①이 옳다.","kind":"reason"},{"label":"오답 확인","text":"② 권한 제한 자체가 불가능한 것은 아니다. ③ 계속적 중개자도 보험증권 교부권한 등이 있다. ④ 보험대리상은 체결·변경·해지 등에 관한 의사표시 권한도 가진다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["12-4","5-6","11-5","7-4","8-5","2-3","6-15","9-5","12-5","2-21","8-6","10-4","1-4"]},{"id":"4-6","round":4,"year":2018,"number":6,"subject":"상법(보험편)","topic":"보험료와 위험 통지","stem":"상법(보험편)에 관한 설명이다. 옳지 않은 것은 몇 개인가?\n○ 계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 다른 절차 없이\n바로 그 계약을 해지할 수 있다.\n○ 보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에 보험기\n간 중 그 예기한 위험이 소멸한 때에는 보험계약자는 그 후의 보험료의 감액을\n청구할 수 있다.\n○ 보험기간 중에 보험계약자 또는 피보험자가 사고발생의 위험이 현저하게 변경\n또는 증가된 사실을 안 때에는 지체없이 보험자에게 통지하여야 한다.","options":[{"n":"1","text":"0개"},{"n":"2","text":"1개"},{"n":"3","text":"2개"},{"n":"4","text":"3개"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n첫 문장만 틀리다. 계속보험료 연체 시에는 상당한 기간을 정하여 최고한 뒤 미납이면 해지할 수 있다. 틀린 문장은 1개이므로 ②이다.\n\n오답 확인\n예기한 특별위험이 소멸하면 장래 보험료 감액을 청구할 수 있고, 위험의 현저한 변경·증가를 알면 지체 없이 통지해야 한다.\n\n근거·학습주제\n상법 제647조·제650조·제652조","explanationSections":[{"label":"정답 근거","text":"첫 문장만 틀리다. 계속보험료 연체 시에는 상당한 기간을 정하여 최고한 뒤 미납이면 해지할 수 있다. 틀린 문장은 1개이므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"예기한 특별위험이 소멸하면 장래 보험료 감액을 청구할 수 있고, 위험의 현저한 변경·증가를 알면 지체 없이 통지해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제647조·제650조·제652조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["10-5","12-5","5-7","2-4","7-9","3-10","11-6","11-10","9-15","2-14","4-10","10-9","7-6","9-6","12-7","2-5","7-10","11-7","8-10"]},{"id":"4-7","round":4,"year":2018,"number":7,"subject":"상법(보험편)","topic":"고지의무 해지기간","stem":"고지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약당시에 보험계약자 또는 피보험자가 고의 또는 중대한 과실로 인하여 중요한 사항을\n부실의 고지를 한 때에는 보험자는 그 사실을 안 날로부터 3년내에 계약을 해지할 수 있다."},{"n":"2","text":"보험자가 서면으로 질문한 사항은 중요한 사항으로 추정한다."},{"n":"3","text":"손해보험의 피보험자는 고지의무자에 해당한다."},{"n":"4","text":"보험자가 계약당시에 고지의무 위반의 사실을 알았거나 중대한 과실로 인하여 알지 못한\n때에는 보험자는 그 계약을 해지할 수 없다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n고지의무 위반에 의한 해지는 위반을 안 날부터 1월, 계약체결일부터 3년 안에 행사해야 한다. ①은 '안 날부터 3년'으로 잘못 연결하였다.\n\n오답 확인\n② 서면질문 사항의 중요성은 추정된다. ③ 손해보험 피보험자도 고지의무자이며, ④ 보험자의 악의·중과실은 해지를 막는다.\n\n근거·학습주제\n상법 제651조·제651조의2","explanationSections":[{"label":"정답 근거","text":"고지의무 위반에 의한 해지는 위반을 안 날부터 1월, 계약체결일부터 3년 안에 행사해야 한다. ①은 '안 날부터 3년'으로 잘못 연결하였다.","kind":"reason"},{"label":"오답 확인","text":"② 서면질문 사항의 중요성은 추정된다. ③ 손해보험 피보험자도 고지의무자이며, ④ 보험자의 악의·중과실은 해지를 막는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제651조·제651조의2","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["11-9","12-8","3-9","8-9","5-8","1-13","7-7","9-8","2-13","10-6"]},{"id":"4-8","round":4,"year":2018,"number":8,"subject":"상법(보험편)","topic":"타인을 위한 보험","stem":"B 는 A 의 위임을 받아 A 를 위하여 자신의 명의로 보험자 C 와 손해보험계약을 체결\n하였다. (단, B 는 C 에게 A 를 위한 계약임을 명시하였고, A 에게는 피보험이익이 존\n재함) 다음 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"A 는 당연히 보험계약의 이익을 받는 자이므로, 특별한 사정이 없는 한 B 의 동의 없이\n보험금지급청구권을 행사할 수 있다."},{"n":"2","text":"B 가 파산선고를 받은 경우 A 가 그 권리를 포기하지 아니하는 한 A도 보험료를 지급할\n의무가 있다."},{"n":"3","text":"만일 A 의 위임이 없었다면 B는 이를 C에게 고지하여야 한다."},{"n":"4","text":"A 는 위험변경증가의 통지의무를 부담하지 않는다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\nA는 피보험자로서 위험변경·증가의 통지의무를 부담한다. 타인을 위한 계약이라는 이유만으로 이 의무가 면제되지 않으므로 ④가 틀리다.\n\n오답 확인\n① 타인은 수익 의사표시 없이 계약의 이익을 받고 보험금을 청구할 수 있다. ② 계약자 파산 시 권리를 포기하지 않은 타인에게 보험료 의무가 생긴다. ③ 무위임 사실은 고지해야 한다.\n\n근거·학습주제\n상법 제639조·제650조·제652조","explanationSections":[{"label":"정답 근거","text":"A는 피보험자로서 위험변경·증가의 통지의무를 부담한다. 타인을 위한 계약이라는 이유만으로 이 의무가 면제되지 않으므로 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 타인은 수익 의사표시 없이 계약의 이익을 받고 보험금을 청구할 수 있다. ② 계약자 파산 시 권리를 포기하지 않은 타인에게 보험료 의무가 생긴다. ③ 무위임 사실은 고지해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조·제650조·제652조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":[]},{"id":"4-9","round":4,"year":2018,"number":9,"subject":"상법(보험편)","topic":"최초보험료 미지급","stem":"상법(보험편)에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험사고가 발생하기 전에 보험계약의 전부 또는 일부를 해지하는 경우에 보험계약자는\n당사자간에 다른 약정이 없으면 미경과보험료의 반환을 청구할 수 없다."},{"n":"2","text":"보험계약자는 계약체결후 지체없이 보험료의 전부 또는 제1회 보험료를 지급하여야 하며,\n보험계약자가 이를 지급하지 아니하는 경우에는 다른 약정이 없는 한 계약성립후 2월이\n경과하면 그 계약은 해제된 것으로 본다."},{"n":"3","text":"고지의무위반으로 인하여 보험계약이 해지되고 해지환급금이 지급되지 아니한 경우에 보험\n계약자는 일정한 기간내에 연체보험료에 약정이자를 붙여 보험자에게 지급하고 그 계약의\n부활을 청구할 수 있다."},{"n":"4","text":"보험계약의 일부가 무효인 경우에는 보험계약자와 피보험자에게 중대한 과실이 있어도\n보험자에 대하여 보험료 일부의 반환을 청구할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n별도 약정이 없으면 계약성립 후 2월 동안 최초보험료를 지급하지 않은 계약은 해제된 것으로 본다. ②가 조문과 일치한다.\n\n오답 확인\n① 임의해지 시 다른 약정이 없으면 미경과보험료 반환을 청구할 수 있다. ③ 부활은 계속보험료 연체해지의 제도이다. ④ 무효계약 보험료 반환에는 선의·무중과실이 요구된다.\n\n근거·학습주제\n상법 제648조·제649조·제650조·제650조의2","explanationSections":[{"label":"정답 근거","text":"별도 약정이 없으면 계약성립 후 2월 동안 최초보험료를 지급하지 않은 계약은 해제된 것으로 본다. ②가 조문과 일치한다.","kind":"reason"},{"label":"오답 확인","text":"① 임의해지 시 다른 약정이 없으면 미경과보험료 반환을 청구할 수 있다. ③ 부활은 계속보험료 연체해지의 제도이다. ④ 무효계약 보험료 반환에는 선의·무중과실이 요구된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제648조·제649조·제650조·제650조의2","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["10-5","11-6","11-8","2-6","7-6","9-6","2-4","5-7","11-7","8-8","2-5","3-7","12-5","12-7","12-6","1-6","6-16","8-6","1-7","7-5","10-7","6-18","9-11","12-3","8-1","3-8"]},{"id":"4-10","round":4,"year":2018,"number":10,"subject":"상법(보험편)","topic":"위험통지 해태와 반환","stem":"위험변경증가의 통지와 보험계약해지에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험기간 중에 보험계약자 또는 피보험자가 사고발생의 위험이 현저하게 변경 또는 증가된\n사실을 안 때에는 지체없이 보험자에게 통지하여야 한다."},{"n":"2","text":"보험자가 위험변경증가의 통지를 받은 때에는 1월내에 보험료의 증액을 청구하거나 계약을\n해지할 수 있다."},{"n":"3","text":"위험변경증가의 통지를 해태한 때에는 보험자는 그 사실을 안 날로부터 1월내에 한하여\n계약을 해지할 수 있다."},{"n":"4","text":"보험사고가 발생한 후라도 보험자가 위험변경통지의 해태로 계약을 해지하였을 때에는\n보험금을 지급할 책임이 없고, 이미 지급한 보험금의 반환도 청구할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n위험통지 해태로 적법하게 해지하면 원칙적으로 보험금 지급책임이 없고 이미 지급한 보험금의 반환도 청구할 수 있다. ④의 반환청구 불가가 틀리다.\n\n오답 확인\n①의 지체 없는 통지, ② 통지 수령 후 1월 내 증액청구 또는 해지, ③ 해태를 안 날부터 1월 내 해지는 각각 조문 내용이다. 다만 위험변경과 사고의 무인과성이 증명되면 보험금 책임이 남는다.\n\n근거·학습주제\n상법 제652조·제655조","explanationSections":[{"label":"정답 근거","text":"위험통지 해태로 적법하게 해지하면 원칙적으로 보험금 지급책임이 없고 이미 지급한 보험금의 반환도 청구할 수 있다. ④의 반환청구 불가가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"①의 지체 없는 통지, ② 통지 수령 후 1월 내 증액청구 또는 해지, ③ 해태를 안 날부터 1월 내 해지는 각각 조문 내용이다. 다만 위험변경과 사고의 무인과성이 증명되면 보험금 책임이 남는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조·제655조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["7-9","2-14","6-19","11-10","10-9","9-15","3-10","1-9","3-11","10-10","8-10","12-9","7-10","4-6","5-9","8-11","9-16","7-12"]},{"id":"4-11","round":4,"year":2018,"number":11,"subject":"상법(보험편)","topic":"사고통지 해태","stem":"보험사고발생의 통지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험사고발생의 통지의무자가 보험사고의 발생을 안 때에는 지체없이 보험자에게 그 통지\n를 발송하여야 한다."},{"n":"2","text":"보험사고발생의 통지의무자는 보험계약자 또는 피보험자나 보험수익자이다."},{"n":"3","text":"통지의 방법으로는 구두, 서면 등이 가능하다."},{"n":"4","text":"보험자는 보험계약자가 보험사고발생의 통지의무를 해태하여 증가된 손해라도 이를 포함\n하여 보상할 책임이 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n사고발생 통지의무를 게을리하여 증가한 손해는 보험자가 보상하지 않아도 된다. ④는 증가손해까지 보상한다고 하므로 틀리다.\n\n오답 확인\n① 사고를 알면 지체 없이 통지를 발송한다. ② 계약자·피보험자·수익자가 의무자이고, ③ 조문은 통지를 특정 서면방식에 한정하지 않는다.\n\n근거·학습주제\n상법 제657조","explanationSections":[{"label":"정답 근거","text":"사고발생 통지의무를 게을리하여 증가한 손해는 보험자가 보상하지 않아도 된다. ④는 증가손해까지 보상한다고 하므로 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 사고를 알면 지체 없이 통지를 발송한다. ② 계약자·피보험자·수익자가 의무자이고, ③ 조문은 통지를 특정 서면방식에 한정하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제657조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["7-12","11-11","2-14","9-16","9-15","10-10","2-18","12-10"]},{"id":"4-12","round":4,"year":2018,"number":12,"subject":"상법(보험편)","topic":"전쟁위험의 특약","stem":"보험자의 보험금액 지급과 면책에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"약정기간이 없는 경우에는 보험자는 보험사고발생의 통지를 받은 후 지체없이 지급할\n보험금액을 정하여야 한다."},{"n":"2","text":"보험자가 보험금액을 정하면 정하여진 날부터 10일내에 보험금액을 지급하여야 한다."},{"n":"3","text":"보험사고가 전쟁 기타의 변란으로 인하여 생긴 때에는 보험자의 보험금액 지급 책임에 대\n하여 당사자간에 다른 약정을 할 수 없다."},{"n":"4","text":"보험사고가 보험계약자의 고의 또는 중대한 과실로 인하여 생긴 때에는 보험자는 보험금액\n을 지급할 책임이 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n전쟁 기타 변란에 의한 사고는 원칙적 면책이지만 당사자 사이에 다른 약정을 할 수 있다. 이를 금지한 ③이 틀리다.\n\n오답 확인\n약정기간이 없으면 통지 후 지체 없이 지급액을 정하고 정한 날부터 10일 내 지급한다. 계약자의 고의·중과실 사고는 원칙적 면책에 해당한다.\n\n근거·학습주제\n상법 제658조·제659조·제660조","explanationSections":[{"label":"정답 근거","text":"전쟁 기타 변란에 의한 사고는 원칙적 면책이지만 당사자 사이에 다른 약정을 할 수 있다. 이를 금지한 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"약정기간이 없으면 통지 후 지체 없이 지급액을 정하고 정한 날부터 10일 내 지급한다. 계약자의 고의·중과실 사고는 원칙적 면책에 해당한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제658조·제659조·제660조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["3-12","12-10","9-13","2-18","10-11","11-12","8-12","7-14","1-11","12-18","5-9","2-11"]},{"id":"4-13","round":4,"year":2018,"number":13,"subject":"상법(보험편)","topic":"소멸시효","stem":"상법 제662조(소멸시효)에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험료의 반환청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다."},{"n":"2","text":"적립금의 반환청구권은 3년간 행사하지 아니하면 시효의 완성으로 소멸한다."},{"n":"3","text":"보험금청구권은 3년간 행사하지 아니하면 시효의 완성으로 소멸한다."},{"n":"4","text":"보험료청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험료 반환청구권의 소멸시효는 3년이다. ①의 2년이 틀리다.\n\n오답 확인\n보험금청구권·적립금반환청구권은 3년이고 보험자가 행사하는 보험료청구권은 2년이다. 돈의 명칭이 아니라 청구권자를 함께 구별한다.\n\n근거·학습주제\n상법 제662조","explanationSections":[{"label":"정답 근거","text":"보험료 반환청구권의 소멸시효는 3년이다. ①의 2년이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"보험금청구권·적립금반환청구권은 3년이고 보험자가 행사하는 보험료청구권은 2년이다. 돈의 명칭이 아니라 청구권자를 함께 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제662조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["7-15","3-14","11-13","5-10","8-17"]},{"id":"4-14","round":4,"year":2018,"number":14,"subject":"상법(보험편)","topic":"불이익변경금지","stem":"상법 제663조(보험계약자 등의 불이익변경금지)에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"상법 보험편의 규정은 가계보험에서 당사자간의 특약으로 피보험자의 불이익으로 변경하지\n못한다."},{"n":"2","text":"상법 보험편의 규정은 재보험에서 당사자간의 특약으로 피보험자의 불이익으로 변경하지\n못한다."},{"n":"3","text":"상법 보험편의 규정은 가계보험에서 당사자간의 특약으로 보험계약자의 불이익으로 변경\n하지 못한다."},{"n":"4","text":"상법 보험편의 규정은 해상보험에서 당사자간의 특약으로 피보험자의 불이익으로 변경할\n수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n재보험·해상보험 및 이와 유사한 보험에는 불이익변경금지의 예외가 적용된다. 재보험에도 항상 금지된다고 한 ②가 틀리다.\n\n오답 확인\n가계보험에서 보험계약자·피보험자·수익자에게 불리한 특약은 제한된다. 해상보험에 관한 ④는 예외에 해당한다.\n\n근거·학습주제\n상법 제663조","explanationSections":[{"label":"정답 근거","text":"재보험·해상보험 및 이와 유사한 보험에는 불이익변경금지의 예외가 적용된다. 재보험에도 항상 금지된다고 한 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"가계보험에서 보험계약자·피보험자·수익자에게 불리한 특약은 제한된다. 해상보험에 관한 ④는 예외에 해당한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제663조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["3-15","7-16","8-13","12-12","9-14"]},{"id":"4-15","round":4,"year":2018,"number":15,"subject":"상법(보험편)","topic":"손해보험증권 기재사항","stem":"상법 제666조(손해보험증권)의 기재사항으로 옳은 것을 모두 고른 것은?\nㄱ. 보험사고의 성질 ㄴ. 무효와 실권의 사유\nㄷ. 보험증권의 작성지와 그 작성년월일 ㄹ. 보험계약자의 주민등록번호","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄴ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험사고의 성질, 무효·실권 사유, 증권 작성지와 작성연월일은 법정기재사항이다. ㄱ·ㄴ·ㄷ을 묶은 ③이 옳다.\n\n오답 확인\n계약자의 주소·성명 또는 상호는 법정기재사항이지만 주민등록번호를 별도로 법정기재사항으로 열거하지는 않는다. ㄹ을 포함한 선택지를 제외한다.\n\n근거·학습주제\n상법 제666조","explanationSections":[{"label":"정답 근거","text":"보험사고의 성질, 무효·실권 사유, 증권 작성지와 작성연월일은 법정기재사항이다. ㄱ·ㄴ·ㄷ을 묶은 ③이 옳다.","kind":"reason"},{"label":"오답 확인","text":"계약자의 주소·성명 또는 상호는 법정기재사항이지만 주민등록번호를 별도로 법정기재사항으로 열거하지는 않는다. ㄹ을 포함한 선택지를 제외한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":[]},{"id":"4-16","round":4,"year":2018,"number":16,"subject":"상법(보험편)","topic":"사기에 의한 초과보험","stem":"초과보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"초과보험은 보험계약 목적의 가액이 보험금액을 현저하게 초과한 보험이다."},{"n":"2","text":"보험계약자의 사기로 인하여 체결된 때의 초과보험은 무효로 한다."},{"n":"3","text":"초과보험에서 보험료의 감액은 소급하여 그 효력이 있다."},{"n":"4","text":"보험가액이 보험기간 중에 현저하게 감소된 때에는 초과보험에 관한 규정이 적용되지 않는다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험계약자의 사기로 체결된 초과보험은 무효이다. 보험자는 사기 사실을 안 때까지의 보험료를 청구할 수 있다.\n\n오답 확인\n① 초과보험은 보험금액이 보험가액을 현저히 초과하는 경우이다. ③ 보험료 감액은 장래효이다. ④ 보험기간 중 보험가액의 현저한 감소에도 초과보험 규정을 적용한다.\n\n근거·학습주제\n상법 제669조","explanationSections":[{"label":"정답 근거","text":"보험계약자의 사기로 체결된 초과보험은 무효이다. 보험자는 사기 사실을 안 때까지의 보험료를 청구할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"① 초과보험은 보험금액이 보험가액을 현저히 초과하는 경우이다. ③ 보험료 감액은 장래효이다. ④ 보험기간 중 보험가액의 현저한 감소에도 초과보험 규정을 적용한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["3-22","6-24","8-16","11-15","9-11","5-14","12-14","10-16"]},{"id":"4-17","round":4,"year":2018,"number":17,"subject":"상법(보험편)","topic":"미평가보험","stem":"기평가보험과 미평가보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"당사자간에 보험계약체결 시 보험가액을 미리 약정하는 보험은 기평가보험이다."},{"n":"2","text":"기평가보험에서 보험가액은 사고발생시의 가액으로 정한 것으로 추정한다. 그러나 그 가액이\n사고발생시의 가액을 현저하게 초과할 때에는 사고발생시의 가액을 보험가액으로 한다."},{"n":"3","text":"미평가보험이란 보험사고의 발생 이전에는 보험가액을 산정하지 않고, 그 이후에 산정하는\n보험을 말한다."},{"n":"4","text":"미평가보험은 보험계약체결 당시의 가액을 보험가액으로 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n미평가보험의 보험가액은 사고발생시 가액이다. ④는 계약체결시 가액이라고 하여 틀리다.\n\n오답 확인\n① 기평가보험은 가액을 미리 약정한 보험이다. ② 약정가액은 사고발생시 가액으로 추정하되 현저한 초과 시 실제 사고시 가액을 적용한다. ③은 미평가보험의 개념이다.\n\n근거·학습주제\n상법 제670조·제671조","explanationSections":[{"label":"정답 근거","text":"미평가보험의 보험가액은 사고발생시 가액이다. ④는 계약체결시 가액이라고 하여 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 기평가보험은 가액을 미리 약정한 보험이다. ② 약정가액은 사고발생시 가액으로 추정하되 현저한 초과 시 실제 사고시 가액을 적용한다. ③은 미평가보험의 개념이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제670조·제671조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["1-16","3-20","11-16","5-15","9-12","2-9","12-15","6-25","10-15","8-16"]},{"id":"4-18","round":4,"year":2018,"number":18,"subject":"상법(보험편)","topic":"재보험의 독립성","stem":"재보험에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"재보험에 대하여도 제3자에 대한 보험자대위가 적용된다."},{"n":"2","text":"재보험은 원보험자가 인수한 위험의 전부 또는 일부를 분산시키는 기능을 한다."},{"n":"3","text":"재보험계약은 원보험계약의 효력에 영향을 미친다."},{"n":"4","text":"재보험자는 손해보험의 원보험자와 재보험계약을 체결할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n재보험계약은 원보험계약의 효력에 영향을 미치지 않는다. ③은 두 계약의 독립성을 부정하여 틀리다.\n\n오답 확인\n재보험은 위험 분산 기능을 하고 손해보험 원보험자도 가입할 수 있다. 재보험에서도 요건을 갖추면 제3자 대위가 적용된다.\n\n근거·학습주제\n상법 제661조·제682조·재보험","explanationSections":[{"label":"정답 근거","text":"재보험계약은 원보험계약의 효력에 영향을 미치지 않는다. ③은 두 계약의 독립성을 부정하여 틀리다.","kind":"reason"},{"label":"오답 확인","text":"재보험은 위험 분산 기능을 하고 손해보험 원보험자도 가입할 수 있다. 재보험에서도 요건을 갖추면 제3자 대위가 적용된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제661조·제682조·재보험","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["3-13","12-16","1-12"]},{"id":"4-19","round":4,"year":2018,"number":19,"subject":"상법(보험편)","topic":"중복보험의 금액관계","stem":"중복보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이 동시에 또는 순차로\n체결된 경우에 그 보험가액의 총액이 보험금액을 초과한 때에는 보험자는 각자의 보험금\n액의 한도에서 연대책임을 진다."},{"n":"2","text":"중복보험의 경우 보험자 1인에 대한 피보험자의 권리의 포기는 다른 보험자의 권리의무에\n영향을 미치지 않는다."},{"n":"3","text":"중복보험의 경우에는 보험계약자는 각 보험자에 대하여 각 보험계약의 내용을 통지하여야\n한다."},{"n":"4","text":"사기에 의한 중복보험계약은 무효이나 보험자는 그 사실을 안 때까지의 보험료를 청구할\n수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n중복보험은 여러 계약의 보험금액 총액이 보험가액을 초과하는 경우이다. ①은 보험금액과 보험가액의 관계를 거꾸로 썼다.\n\n오답 확인\n② 한 보험자에 대한 권리포기는 다른 보험자에게 영향을 미치지 않는다. ③ 각 보험자에게 다른 계약을 통지한다. ④ 사기 중복보험은 무효이나 사기 인지 때까지 보험료를 청구할 수 있다.\n\n근거·학습주제\n상법 제672조·제673조","explanationSections":[{"label":"정답 근거","text":"중복보험은 여러 계약의 보험금액 총액이 보험가액을 초과하는 경우이다. ①은 보험금액과 보험가액의 관계를 거꾸로 썼다.","kind":"reason"},{"label":"오답 확인","text":"② 한 보험자에 대한 권리포기는 다른 보험자에게 영향을 미치지 않는다. ③ 각 보험자에게 다른 계약을 통지한다. ④ 사기 중복보험은 무효이나 사기 인지 때까지 보험료를 청구할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조·제673조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["5-18","9-18","7-17","8-18","1-17","3-19","2-11","6-20","6-22","11-15","10-16","8-16","5-14"]},{"id":"4-20","round":4,"year":2018,"number":20,"subject":"상법(보험편)","topic":"일부보험 특약","stem":"일부보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"일부보험이란 보험금액이 보험가액에 미달하는 보험을 말한다."},{"n":"2","text":"일부보험은 계약체결 당시부터 의식적으로 약정하는 경우도 있고, 계약 성립 후 물가의 인상\n으로 인하여 자연적으로 발생하는 경우도 있다."},{"n":"3","text":"일부보험에서는 보험자의 보상책임에 관하여 당사자간에 다른 약정을 할 수 없다."},{"n":"4","text":"의식적 일부보험의 여부는 계약체결시의 보험가액을 기준으로 판단한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일부보험은 원칙적으로 비례보상하지만 다른 약정으로 보험금액 한도 내 실손보상을 정할 수 있다. 특약 불가라는 ③이 틀리다.\n\n오답 확인\n보험금액이 보험가액보다 적다는 정의와 물가변동에 의한 무의식적 일부보험은 옳다. 의식적 일부보험인지는 체결시 가액을 기준으로 한다.\n\n근거·학습주제\n상법 제674조","explanationSections":[{"label":"정답 근거","text":"일부보험은 원칙적으로 비례보상하지만 다른 약정으로 보험금액 한도 내 실손보상을 정할 수 있다. 특약 불가라는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"보험금액이 보험가액보다 적다는 정의와 물가변동에 의한 무의식적 일부보험은 옳다. 의식적 일부보험인지는 체결시 가액을 기준으로 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제674조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["6-3","9-19","3-23","11-18"]},{"id":"4-21","round":4,"year":2018,"number":21,"subject":"상법(보험편)","topic":"미납보험료 공제","stem":"손해보험에서 손해액 산정에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액은 그 손해가 발생한 때와 곳의 가액에 의하여 산정한다. 그러나\n당사자간에 다른 약정이 있는 때에는 그 신품가액에 의하여 손해액을 산정할 수 있다."},{"n":"2","text":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있어도 보상할 금액\n에서 이를 공제할 수 없다."},{"n":"3","text":"손해보상은 원칙적으로 금전으로 하지만 당사자의 합의로 손해의 전부 또는 일부를 현물로\n보상할 수 있다."},{"n":"4","text":"손해액의 산정에 관한 비용은 보험자의 부담으로 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험자는 지급기일이 오지 않은 미납보험료도 보상액에서 공제할 수 있다. ②의 공제 불가는 조문에 반한다.\n\n오답 확인\n① 사고 발생 시·장소의 가액이 원칙이며 신품가액 특약도 허용된다. ③ 현물보상 합의가 가능하고, ④ 손해액 산정비용은 보험자 부담이다.\n\n근거·학습주제\n상법 제676조·제677조","explanationSections":[{"label":"정답 근거","text":"보험자는 지급기일이 오지 않은 미납보험료도 보상액에서 공제할 수 있다. ②의 공제 불가는 조문에 반한다.","kind":"reason"},{"label":"오답 확인","text":"① 사고 발생 시·장소의 가액이 원칙이며 신품가액 특약도 허용된다. ③ 현물보상 합의가 가능하고, ④ 손해액 산정비용은 보험자 부담이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조·제677조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["8-21","7-20","10-19","3-25","12-19","9-20","1-19","6-4","2-22","5-20","7-21","8-15"]},{"id":"4-22","round":4,"year":2018,"number":22,"subject":"상법(보험편)","topic":"집합화재보험","stem":"화재보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"화재보험계약의 보험자는 화재로 인하여 생긴 손해를 보상할 책임이 있다."},{"n":"2","text":"화재보험자는 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해를 보상할\n책임이 있다."},{"n":"3","text":"화재보험증권에는 동산을 보험의 목적으로 한 때에는 그 존치한 장소의 상태와 용도를\n기재하여야 한다."},{"n":"4","text":"집합된 물건을 일괄하여 화재보험의 목적으로 하여도 피보험자의 사용인의 물건은 보험의\n목적에 포함되지 않는다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n집합보험에는 피보험자의 가족과 사용인의 물건도 포함한다. 따라서 사용인 물건을 제외한 ④가 틀리다.\n\n오답 확인\n① 화재손해 및 ② 소방·손해감소조치 손해는 담보 대상이다. ③ 동산 소재장소의 상태·용도는 화재보험증권 기재사항이다.\n\n근거·학습주제\n상법 제683조·제684조·제685조·제686조","explanationSections":[{"label":"정답 근거","text":"집합보험에는 피보험자의 가족과 사용인의 물건도 포함한다. 따라서 사용인 물건을 제외한 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 화재손해 및 ② 소방·손해감소조치 손해는 담보 대상이다. ③ 동산 소재장소의 상태·용도는 화재보험증권 기재사항이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제683조·제684조·제685조·제686조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["2-25","4-25","3-16","6-8","12-23","5-25","8-15","10-24","9-24","6-9","1-25","3-18","5-13"]},{"id":"4-23","round":4,"year":2018,"number":23,"subject":"상법(보험편)","topic":"손해방지비용","stem":"손해보험에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험의 목적의 성질, 하자 또는 자연소모로 인한 손해는 보험자가 이를 보상할\n책임이 없다.\nㄴ. 피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리와 의무를\n승계한 것으로 추정한다.\nㄷ. 보험의 목적의 양도인 또는 양수인은 보험자에 대하여 지체없이 보험목적의\n양도 사실을 통지하여야 한다.\nㄹ. 손해의 방지와 경감을 위하여 보험계약자와 피보험자의 필요 또는 유익하였던\n비용과 보상액이 보험금액을 초과한 경우에는 보험자가 이를 부담하지 아니한다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄴ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nㄱ·ㄴ·ㄷ은 옳다. 자연소모 등은 원칙적 면책이고 목적 양수인의 권리·의무 승계는 추정되며 양도인 또는 양수인이 통지한다.\n\n오답 확인\nㄹ은 틀리다. 필요 또는 유익한 손해방지비용은 보상액과 합쳐 보험금액을 넘더라도 보험자가 부담한다.\n\n근거·학습주제\n상법 제678조·제679조·제680조","explanationSections":[{"label":"정답 근거","text":"ㄱ·ㄴ·ㄷ은 옳다. 자연소모 등은 원칙적 면책이고 목적 양수인의 권리·의무 승계는 추정되며 양도인 또는 양수인이 통지한다.","kind":"reason"},{"label":"오답 확인","text":"ㄹ은 틀리다. 필요 또는 유익한 손해방지비용은 보상액과 합쳐 보험금액을 넘더라도 보험자가 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제678조·제679조·제680조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["6-6","12-20","11-19","10-18","2-10","5-21","7-21","12-18","8-22"]},{"id":"4-24","round":4,"year":2018,"number":24,"subject":"상법(보험편)","topic":"잔존물대위 요건","stem":"보험목적에 관한 보험대위에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"약관에 보험자의 대위권 포기를 정할 수 있다."},{"n":"2","text":"보험금액의 일부를 지급한 보험자도 그 목적에 대한 피보험자의 권리를 취득한다."},{"n":"3","text":"보험가액의 일부를 보험에 붙인 경우에는 보험자가 취득할 권리는 보험금액의 보험가액에\n대한 비율에 따라 이를 정한다."},{"n":"4","text":"사고를 당한 보험목적에 대하여 피보험자가 가지고 있던 권리는 법률 규정에 의하여 보험자\n에게 이전되는 것으로 물권변동의 절차를 요하지 않는다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험목적 전부가 멸실하고 보험금액 전부를 지급해야 잔존물에 대한 권리가 이전된다. 보험금액 일부 지급만으로 대위한다는 ②가 틀리다.\n\n오답 확인\n① 대위권 포기 특약은 가능하다. ③ 일부보험이면 보험금액의 보험가액에 대한 비율로 권리를 취득한다. ④ 대위는 법률상 이전이므로 별도 물권변동 절차가 필요 없다.\n\n근거·학습주제\n상법 제681조","explanationSections":[{"label":"정답 근거","text":"보험목적 전부가 멸실하고 보험금액 전부를 지급해야 잔존물에 대한 권리가 이전된다. 보험금액 일부 지급만으로 대위한다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 대위권 포기 특약은 가능하다. ③ 일부보험이면 보험금액의 보험가액에 대한 비율로 권리를 취득한다. ④ 대위는 법률상 이전이므로 별도 물권변동 절차가 필요 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제681조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["12-22","11-21","8-24","8-25","2-23"]},{"id":"4-25","round":4,"year":2018,"number":25,"subject":"상법(보험편)","topic":"가족 물건과 집합보험","stem":"화재보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"집합된 물건을 일괄하여 화재보험의 목적으로 하여도 피보험자의 가족의 물건은 화재보험\n의 목적에 포함되지 않는다."},{"n":"2","text":"집합된 물건을 일괄하여 화재보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간\n중에 수시로 교체된 경우에도 보험사고의 발생 시에 현존하는 물건은 화재보험의 목적에\n포함된 것으로 한다."},{"n":"3","text":"건물을 화재보험의 목적으로 한 때에는 그 소재지, 구조와 용도는 화재보험증권의 기재\n사항이다."},{"n":"4","text":"유가증권은 화재보험증권에 기재하여 화재보험의 목적으로 할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n집합보험에는 가족과 사용인의 물건도 포함하므로 가족 물건을 배제한 ①이 틀리다.\n\n오답 확인\n② 교체되는 물건은 사고발생시 현존하는 물건을 기준으로 한다. ③ 건물의 소재지·구조·용도는 기재사항이다. ④ 유가증권도 증권에 기재하면 담보할 수 있다.\n\n근거·학습주제\n상법 제685조·제686조","explanationSections":[{"label":"정답 근거","text":"집합보험에는 가족과 사용인의 물건도 포함하므로 가족 물건을 배제한 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"② 교체되는 물건은 사고발생시 현존하는 물건을 기준으로 한다. ③ 건물의 소재지·구조·용도는 기재사항이다. ④ 유가증권도 증권에 기재하면 담보할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제685조·제686조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["4-22","3-18","11-23","9-25","12-25","10-25","6-9","7-25","5-25","2-25","5-13","6-10","10-24","2-17"]},{"id":"4-26","round":4,"year":2018,"number":26,"subject":"농어업재해보험법령","topic":"시범사업의 정의","stem":"농어업재해보험법상 용어에 관한 설명이다. ( )에 들어갈 내용은?\n“시범사업”이란 농어업재해보험사업을 전국적으로 실시하기 전에 보험의 효용성 및\n보험 실시 가능성 등을 검증하기 위하여 일정기간 ( )에서 실시하는 보험사업을\n말한다.","options":[{"n":"1","text":"보험대상 지역"},{"n":"2","text":"재해 지역"},{"n":"3","text":"담당 지역"},{"n":"4","text":"제한된 지역"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n시범사업은 전국 실시 전 효용성과 실시 가능성을 검증하려고 일정기간 제한된 지역에서 시행하는 보험사업이다. 정답은 ④이다.\n\n오답 확인\n보험대상 지역이나 재해 지역이라는 일반 표현보다 법 제2조가 사용하는 '제한된 지역'이라는 문언을 고른다.\n\n근거·학습주제\n농어업재해보험법 제2조","explanationSections":[{"label":"정답 근거","text":"시범사업은 전국 실시 전 효용성과 실시 가능성을 검증하려고 일정기간 제한된 지역에서 시행하는 보험사업이다. 정답은 ④이다.","kind":"reason"},{"label":"오답 확인","text":"보험대상 지역이나 재해 지역이라는 일반 표현보다 법 제2조가 사용하는 '제한된 지역'이라는 문언을 고른다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제2조","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":15,"similarIds":[]},{"id":"4-27","round":4,"year":2018,"number":27,"subject":"농어업재해보험법령","topic":"심의회 위원 해촉","stem":"농어업재해보험법령상 농업재해보험심의회 위원을 해촉할 수 있는 사유로 명시된 것이\n아닌 것은?","options":[{"n":"1","text":"심신장애로 인하여 직무를 수행할 수 없게 된 경우"},{"n":"2","text":"직무와 관련 없는 비위사실이 있는 경우"},{"n":"3","text":"품위손상으로 인하여 위원으로 적합하지 아니하다고 인정되는 경우"},{"n":"4","text":"위원 스스로 직무를 수행하는 것이 곤란하다고 의사를 밝히는 경우"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n해촉사유는 직무와 관련된 비위사실 등이다. 직무와 관련 없는 비위사실을 그 자체로 열거한 ②는 출제 당시 명시사유가 아니다.\n\n오답 확인\n심신장애, 품위손상 등 위원 부적합, 본인의 직무수행 곤란 의사는 규정상 해촉사유이다. 열거 조문의 문구를 구별한다.\n\n기준·변경 메모\n2026년 현재의 심의기구 체계와 구분하여 출제 당시 조문으로 학습한다.\n\n근거·학습주제\n출제 당시 농어업재해보험법 시행령 심의회 위원 해촉 규정","explanationSections":[{"label":"정답 근거","text":"해촉사유는 직무와 관련된 비위사실 등이다. 직무와 관련 없는 비위사실을 그 자체로 열거한 ②는 출제 당시 명시사유가 아니다.","kind":"reason"},{"label":"오답 확인","text":"심신장애, 품위손상 등 위원 부적합, 본인의 직무수행 곤란 의사는 규정상 해촉사유이다. 열거 조문의 문구를 구별한다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"2026년 현재의 심의기구 체계와 구분하여 출제 당시 조문으로 학습한다.","kind":"note"},{"label":"근거·학습주제","text":"출제 당시 농어업재해보험법 시행령 심의회 위원 해촉 규정","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":15,"similarIds":[]},{"id":"4-28","round":4,"year":2018,"number":28,"subject":"농어업재해보험법령","topic":"자격 취소와 능력 부족","stem":"농어업재해보험법상 손해평가사의 자격 취소사유에 해당하지 않는 것은?","options":[{"n":"1","text":"손해평가사의 자격을 거짓 또는 부정한 방법으로 취득한 사람"},{"n":"2","text":"거짓으로 손해평가를 한 사람"},{"n":"3","text":"다른 사람에게 손해평가사 자격증을 빌려준 사람"},{"n":"4","text":"업무수행 능력과 자질이 부족한 사람"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n출제 당시 자격취소사유에는 부정취득, 거짓평가, 자격증 대여 등이 열거된다. 단순한 능력·자질 부족을 별도 취소사유로 정한 것은 아니므로 ④이다.\n\n오답 확인\n①·②·③은 법정 자격취소사유에 해당한다. 업무상 부적절 행위에 대한 업무정지와 자격취소를 혼동하지 않는다.\n\n근거·학습주제\n농어업재해보험법 제11조의5·제11조의6","explanationSections":[{"label":"정답 근거","text":"출제 당시 자격취소사유에는 부정취득, 거짓평가, 자격증 대여 등이 열거된다. 단순한 능력·자질 부족을 별도 취소사유로 정한 것은 아니므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"①·②·③은 법정 자격취소사유에 해당한다. 업무상 부적절 행위에 대한 업무정지와 자격취소를 혼동하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의5·제11조의6","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["6-33","2-31","1-33","3-31","10-30","11-31","9-32","7-31","8-30"]},{"id":"4-29","round":4,"year":2018,"number":29,"subject":"농어업재해보험법령","topic":"보험목적물 고시권자","stem":"농어업재해보험법령상 재해보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험의 종류는 농작물재해보험, 임산물재해보험, 가축재해보험 및 양식수산물재해보험\n으로 한다."},{"n":"2","text":"재해보험에서 보상하는 재해의 범위는 해당 재해의 발생 빈도, 피해 정도 및 객관적인 손해\n평가방법 등을 고려하여 재해보험의 종류별로 대통령령으로 정한다."},{"n":"3","text":"보험목적물의 구체적인 범위는 농업재해보험심의회 또는 어업재해보험심의회를 거치지\n않고 농업정책보험금융원장이 고시한다."},{"n":"4","text":"자연재해, 조수해(鳥獸害), 화재 및 보험목적물별로 농림축산식품부장관이 정하여 고시하는\n병충해는 농작물ㆍ임산물 재해보험이 보상하는 재해의 범위에 해당한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험목적물의 구체적 범위는 심의 절차를 거쳐 소관 장관이 고시한다. 금융원장이 심의 없이 고시한다는 ③이 틀리다.\n\n오답 확인\n①의 네 보험종류와 ② 대통령령 위임은 옳다. ④ 농작물·임산물은 자연재해·조수해·화재 및 고시한 병충해가 대상이 될 수 있다.\n\n기준·변경 메모\n2026년 현재 어업 측 심의기구는 중앙 수산업·어촌정책심의회이다. 당시 A형 정답은 유지한다.\n\n근거·학습주제\n농어업재해보험법 제4조·제5조·제6조","explanationSections":[{"label":"정답 근거","text":"보험목적물의 구체적 범위는 심의 절차를 거쳐 소관 장관이 고시한다. 금융원장이 심의 없이 고시한다는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"①의 네 보험종류와 ② 대통령령 위임은 옳다. ④ 농작물·임산물은 자연재해·조수해·화재 및 고시한 병충해가 대상이 될 수 있다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"2026년 현재 어업 측 심의기구는 중앙 수산업·어촌정책심의회이다. 당시 A형 정답은 유지한다.","kin \n경작불능피해는 사고접수 후 지체 없이 조사하여 추가 생육·피해변화 전에 피해를 파악한다. 따라서 ③이다.\n\n오답 확인\n나무피해·이앙불능·재이앙 등은 각 조사목적과 품목의 한계일이 별도로 정해진다. 결실완료·수정완료를 모든 조사에 일괄 적용하면 안 된다.\n\n기준·변경 메모\n상품별 조사표는 개정된다. 2026 기본서의 현행 상품별 조사절차와 구분한다.\n\n근거·학습주제\n출제 당시 손해평가요령 별표 조사내용·시기","explanationSections":[{"label":"정답 근거","text":"경작불능피해는 사고접수 후 지체 없이 조사하여 추가 생육·피해변화 전에 피해를 파악한다. 따라서 ③이다.","kind":"reason"},{"label":"오답 확인","text":"나무피해·이앙불능·재이앙 등은 각 조사목적과 품목의 한계일이 별도로 정해진다. 결실완료·수정완료를 모든 조사에 일괄 적용하면 안 된다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"상품별 조사표는 개정된다. 2026 기본서의 현행 상품별 조사절차와 구분한다.","kind":"note"},{"label":"근거·학습주제","text":"출제 당시 손해평가요령 별표 조사내용·시기","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":22,"similarIds":["3-48","6-45"]},{"id":"4-41","round":4,"year":2018,"number":41,"subject":"농어업재해보험법령","topic":"단감의 시기별 재해","stem":"농업재해보험 손해평가요령에 따른 손해수량 조사방법과 관련하여 특정위험방식 상품\n“단감”의 「발아기 ~ 적과 전」생육시기에 해당되는 재해를 모두 고른 것은?\nㄱ. 우박 ㄴ. 지진\nㄷ. 가을동상해 ㄹ. 집중호우","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄱ, ㄴ, ㄹ"},{"n":"4","text":"ㄱ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n당시 특정위험방식 단감의 발아기부터 적과 전까지는 우박·지진·집중호우에 대한 제시항목이 해당하므로 ㄱ·ㄴ·ㄹ, ③이다.\n\n오답 확인\n가을동상해는 이 시기와 맞지 않는다. '단감의 모든 보험기간'이 아니라 발아기~적과 전이라는 조건을 먼저 적용한다.\n\n기준·변경 메모\n2026 기본서는 적과전종합위험 등 상품체계로 설명한다. 과거 특정위험방식 표를 현재 담보표로 사용하지 않는다.\n\n근거·학습주제\n출제 당시 손해평가요령 특정위험방식 조사표","explanationSections":[{"label":"정답 근거","text":"당시 특정위험방식 단감의 발아기부터 적과 전까지는 우박·지진·집중호우에 대한 제시항목이 해당하므로 ㄱ·ㄴ·ㄹ, ③이다.","kind":"reason"},{"label":"오답 확인","text":"가을동상해는 이 시기와 맞지 않는다. '단감의 모든 보험기간'이 아니라 발아기~적과 전이라는 조건을 먼저 적용한다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"2026 기본서는 적과전종합위험 등 상품체계로 설명한다. 과거 특정위험방식 표를 현재 담보표로 사용하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"출제 당시 손해평가요령 특정위험방식 조사표","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":22,"similarIds":["1-44"]},{"id":"4-42","round":4,"year":2018,"number":42,"subject":"농어업재해보험법령","topic":"농업재해보험 종류" ":"4-44","round":4,"year":2018,"number":44,"subject":"농어업재해보험법령","topic":"교차손해평가 구성","stem":"농어업재해보험법 및 농업재해보험 손해평가요령에 따른 교차손해평가에 관한 내용으로\n옳지 않은 것은?","options":[{"n":"1","text":"교차손해평가를 위해 손해평가반을 구성할 경우 손해평가사 2인 이상이 포함되어야 한다."},{"n":"2","text":"교차손해평가의 절차ㆍ방법 등에 필요한 사항은 농림축산식품부장관 또는 해양수산부장관이\n정한다."},{"n":"3","text":"재해보험사업자는 교차손해평가가 필요한 경우 재해보험 가입규모, 가입분포 등을 고려하여\n교차손해평가 대상 시ㆍ군ㆍ구(자치구를 말한다)를 선정하여야 한다."},{"n":"4","text":"재해보험사업자는 교차손해평가 대상지로 선정한 시ㆍ군ㆍ구(자치구를 말한다) 내에서 손해\n평가 경력, 타 지역 조사 가능여부 등을 고려하여 교차손해평가를 담당할 지역손해평가인을\n선발하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n교차손해평가반에는 선발된 지역손해평가인 1인 이상을 포함하는 것이 원칙이다. 손해평가사만 2인 이상이어야 한다는 ①은 틀리다.\n\n오답 확인\n교차평가 절차는 소관 장관이 정하고 사업자는 가입규모·분포로 대상지역을 선정하며 경력·타지역 조사 가능성을 고려해 지역평가인을 선발한다. 거대재해·평가인력 부족 등 신속한 평가가 불가피하면 지역평가인 포함의 예외가 가능하다.\n\n근거·학습주제\n농어업재해보험법 제11조·손해평가요령 제8조의2","explanationSections":[{"label":"정답 근거","text":"교차손해평가반에는 선발된 지역손해평가인 1인 이상을 포함하는 것이 원칙이다. 손해평가사만 2인 이상이어야 한다는 ①은 틀리다.","kind":"reason"},{"label":"오답 확인","text":"교차평가 절차는 소관 장관이 정하고 사업자는 가입규모·분포로 대상지역을 선정하며 경력·타지역 조사 가능성을 고려해 지역평가인을 선발한다. 거대재해·평가인력 부족 등 신속한 평가가 불가피하면 지역평가인 포함의 예외가 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조·손해평가요령 제8조의2","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":24,"similarIds":["9-43","12-50","11-43","10-43","7-43","9-39","10-42"]},{"id":"4-45","round":4,"year":2018,"number":45,"subject":"농어업재해보험법령","topic":"평가 단위","stem":"농업재해보험 손해평가요령에 따른 보험목적물별 손해평가 단위를 바르게 연결한 것은?\nㄱ. 소: 개별가축별 ㄴ. 벌: 개체별\nㄷ. 농작물: 농지별 ㄹ. 농업시설물: 보험가입 농가별","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n소는 개별가축, 농작물은 농지별이므로 ㄱ·ㄷ, ②가 옳다.\n\n오답 확인\n벌은 개체가 아닌 벌통 단위이다. 농업시설물도 농가 전체 단위가 아니라 개별 시설물 단위를 적용한다.\n\n근거·학습주제\n손해평가요령 제12조","explanationSections":[{"label":"정답 근거","text":"소는 개별가축, 농작물은 농지별이므로 ㄱ·ㄷ, ②가 옳다.","kind":"reason"},{"label":"오답 확인","text":"벌은 개체가 아닌 벌통 단위이다. 농업시설물도 농가 단한 종피로 흡수가 막힐 때 종피에 상처를 내어 수분·산소 투과를 돕는 종피파상 처리가 해당한다. ④이다.\n\n오답 확인\n콜히친은 배수체 유도, 토마토톤은 착과 등 생장조절에 쓰인다. 훈증은 이 상황의 종피 불투수성 해소법이 아니다.\n\n기준·변경 메모\n실제 발아불량은 종자활력·병해 등도 확인해야 하며 모든 콩 발아불량을 경실 탓으로 단정하지 않는다.\n\n근거·학습주제\n종자 휴면·경실종자","explanationSections":[{"label":"정답 근거","text":"콩과 종자의 단단한 종피로 흡수가 막힐 때 종피에 상처를 내어 수분·산소 투과를 돕는 종피파상 처리가 해당한다. ④이다.","kind":"reason"},{"label":"오답 확인","text":"콜히친은 배수체 유도, 토마토톤은 착과 등 생장조절에 쓰인다. 훈증은 이 상황의 종피 불투수성 해소법이 아니다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"실제 발아불량은 종자활력·병해 등도 확인해야 하며 모든 콩 발아불량을 경실 탓으로 단정하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"종자 휴면·경실종자","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":[]},{"id":"4-54","round":4,"year":2018,"number":54,"subject":"재배학·원예작물학","topic":"생물적 방제","stem":"병해충의 물리적 방제 방법이 아닌 것은?","options":[{"n":"1","text":"천적곤충"},{"n":"2","text":"토양가열"},{"n":"3","text":"증기소독"},{"n":"4","text":"유인포살"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n천적곤충을 이용하는 방법은 생물적 방제이므로 물리적 방법이 아닌 ①이 정답이다.\n\n오답 확인\n토양가열·증기소독은 열을 이용하고 유인포살은 빛·물리적 포획 등을 이용하는 방제법으로 묶는다.\n\n근거·학습주제\n작물보호학 방제법 분류","explanationSections":[{"label":"정답 근거","text":"천적곤충을 이용하는 방법은 생물적 방제이므로 물리적 방법이 아닌 ①이 정답이다.","kind":"reason"},{"label":"오답 확인","text":"토양가열·증기소독은 열을 이용하고 유인포살은 빛·물리적 포획 등을 이용하는 방제법으로 묶는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"작물보호학 방제법 분류","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":[]},{"id":"4-55","round":4,"year":2018,"number":55,"subject":"재배학·원예작물학","topic":"새싹채소","stem":"다음이 설명하는 채소는?\n○ 무, 치커리, 브로콜리 종자를 주로 이용한다.\n○ 재배기간이 짧고 무공해로 키울 수 있다.\n○ 이식 또는 정식과정 없이 재배할 수 있다.","options":[{"n":"1","text":"조미채소"},{"n":"2","text":"뿌리채소"},{"n":"3","text":"새싹채소"},{"n":"4","text":"과일채소"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n종자를 발아시켜 어린 싹을 짧은 기간 재배·수확하는 것은 새싹채소이다. 이식 없이 생산하는 특성과 일치하므로 ③이다.\n\n오답 확인\n조미채소·뿌리채소·과일채소는 이용목적·부위에 따른 분류로 이 설명의 핵심인 어린 싹 수확과 다르다.\n\n기준·변경 메모\n무공해라는 원문 표현이 위생관리 불필요를 의미하지는 않는다.\n\n근거·학습주제\n원예작물학 새싹채소","explanationSections":[{"label":"정답 근거","text":"종자를 발아시켜 어린 싹을 짧은 기간 재배·수확하는 것은 새싹채소이다. 이식 없이 생산하는 특성과 일치하므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"조미채소·뿌리채소·과일채소는 이용목적·부위에 따른 분류로 이 설명의 핵심인 어린 싹 수확과 다르다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"무공해라는 원문 표현이 위생관리 불필요를 의미하지는 않는다.","kind":"note"},{"label":"근거·학습주제","text":"원예작물학 새싹채소","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":[]},{"id":"4-56","round":4,"year":2018,"number":56,"subject":"재배학·원예작물학","topic":"오이 암꽃 분화","stem":"A농가가 오이의 성 결정시기에 받은 영농지도는?\n지난해 처음으로 오이를 재배했던 A농가에서 오이의 암꽃 수가 적어 주변 농가보다\n생산량이 적었다. 올해 지역 농업기술센터의 영농지도를 받은 후 오이의 암꽃 수가\n지난해 보다 많아져 생산량이 증가되었다.","options":[{"n":"1","text":"고온 및 단일 환경으로 관리"},{"n":"2","text":"저온 및 장일 환경으로 관리"},{"n":"3","text":"저온 및 단일 환경으로 관리"},{"n":"4","text":"고온 및 장일 환경으로 관리"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n오이는 성결정 시기 저온·단일 조건에서 암꽃 분화가 촉진되는 경향이 있다. ③이다.\n\n오답 확인\n고온·장일은 수꽃 발생을 촉진하는 방향이다. 저온과 장일 또는 고온과 단일을 섞은 조건은 제시된 암꽃 증가에 가장 적합하지 않다.\n\n근거·학습주제\n농촌진흥청 오이 육묘·성발현 자료","explanationSections":[{"label":"정답 근거","text":"오이는 성결정 시기 저온·단일 조건에서 암꽃 분화가 촉진되는 경향이 있다. ③이다.","kind":"reason"},{"label":"오답 확인","text":"고온·장일은 수꽃 발생을 촉진하는 방향이다. 저온과 장일 또는 고온과 단일을 섞은 조건은 제시된 암꽃 증가에 가장 적합하지 않다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농촌진흥청 오이 육묘·성발현 자료","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"4-57","round":4,"year":2018,"number":57,"subject":"재배학·원예작물학","topic":"배꼽썩음과","stem":"토마토의 생리장해에 관한 설명이다. 생리장해와 처방방법을 옳게 묶은 것은?\n칼슘의 결핍으로 과실의 선단이 수침상(水浸狀)으로 썩게 된다.","options":[{"n":"1","text":"공동과 - 엽면 시비"},{"n":"2","text":"기형과 - 약제 살포"},{"n":"3","text":"배꼽썩음과 - 엽면 시비"},{"n":"4","text":"줄썩음과 - 약제 살포"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n과실 선단의 수침상 부패는 칼슘 공급 부족과 관련한 배꼽썩음과이다. 엽면시비를 연결한 ③이 정답이다.\n\n오답 확인\n공동과는 과실 내부 공동, 기형과는 형태이상이다. 병원균성 부패와 달리 칼슘 흡수·수분불균형을 바로잡는 관리가 중심이다.\n\n기준·변경 메모\n칼슘 살포만으로 해결된다고 보지 말고 관수·근권환경·과다 질소도 함께 조절한다.\n\n근거·학습주제\n농촌진흥청 토마토 생리장해","explanationSections":[{"label":"정답 근거","text":"과실 선단의 수침상 부패는 칼슘 공급 부족과 관련한 배꼽썩음과이다. 엽면시비를 연결한 ③이 정답이다.","kind":"reason"},{"label":"오답 확인","text":"공동과는 과실 내부 공동, 기형과는 형태이상이다. 병원균성 부패와 달리 칼슘 흡수·수분불균형을 바로잡는 관리가 중심이다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"칼슘 살포만으로 해결된다고 보지 말고 관수·근권환경·과다 질소도 함께 조절한다.","kind":"note"},{"label":"근거·학습주제","text":"농촌진흥청 토마토 생리장해","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"4-58","round":4,"year":2018,"number":58,"subject":"재배학·원예작물학","topic":"수발아","stem":"다음이 설명하는 것은?\n○ 벼의 결실기에 종실이 이삭에 달린 채로 싹이 트는 것을 말한다.\n○ 태풍으로 벼가 도복이 되었을 때 고온·다습 조건에서 자주 발생한다.","options":[{"n":"1","text":"출수(出穗)"},{"n":"2","text":"수발아(穗發芽)"},{"n":"3","text":"맹아(萌芽)"},{"n":"4","text":"최아(催芽)"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n이삭에 붙어 있는 종자가 수확 전에 발아하는 것은 수발아이다. 고온다습과 도복은 이를 조장하므로 ②이다.\n\n오답 확인\n출수는 이삭이 잎집 밖으로 나오는 과정, 최아는 파종 전 발아를 인위적으로 유도하는 처리이며 일반 맹아와 구분한다.\n\n근거·학습주제\n벼 수발아·수확기 재해","explanationSections":[{"label":"정답 근거","text":"이삭에 붙어 있는 종자가 수확 전에 발아하는 것은 수발아이다. 고온다습과 도복은 이를 조장하므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"출수는 이삭이 잎집 밖으로 나오는 과정, 최아는 파종 전 발아를 인위적으로 유도하는 처리이며 일반 맹아와 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"벼 수발아·수확기 재해","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":["7-61"]},{"id":"4-59","round":4,"year":2018,"number":59,"subject":"재배학·원예작물학","topic":"석회의 목적","stem":"토양에 석회를 시용하는 주요 목적은?","options":[{"n":"1","text":"토양 피복"},{"n":"2","text":"토양 수분 증가"},{"n":"3","text":"산성토양 개량"},{"n":"4","text":"토양생물 활성 증진"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n석회는 토양산도를 교정하여 산성토양을 개량하는 것이 주요 목적이다. ③이다.\n\n오답 확인\n물리적 피복이나 관수가 주목적이 아니다. 미생물 활성 변화는 적정 산도 회복에 따른 부수효과로 볼 수 있다.\n\n근거·학습주제\n토양학 산성토양 교정","explanationSections":[{"label":"정답 근거","text":"석회는 토양산도를 교정하여 산성토양을 개량하는 것이 주요 목적이다. ③이다.","kind":"reason"},{"label":"오답 확인","text":"물리적 피복이나 관수가 주목적이 아니다. 미생물 활성 변화는 적정 산도 회복에 따른 부수효과로 볼 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"토양학 산성토양 교정","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"4-60","round":4,"year":2018,"number":60,"subject":"재배학·원예작물학","topic":"온도장해 구분","stem":"다음 설명이 틀린 것은?","options":[{"n":"1","text":"동해는 물의 빙점보다 낮은 온도에서 발생한다."},{"n":"2","text":"일소현상, 결구장해, 조기추대는 저온장해 증상이다."},{"n":"3","text":"온대과수는 내동성이 강한 편이나, 열대과수는 내동성이 약하다."},{"n":"4","text":"서리피해 방지로 톱밥 및 왕겨 태우기가 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n일소와 결구불량 등은 대표적인 고온 관련 장해이다. 이를 모두 저온장해로 묶은 ②가 틀리다.\n\n오답 확인\n동해는 동결온도 이하의 피해이며 온대과수가 열대과수보다 일반적으로 내동성이 강하다. 연소법은 서리피해 경감에 이용되던 방법이다.\n\n기준·변경 메모\n연소법은 효과와 현장 여건을 확인하며 실제 방상은 살수·송풍 등 적합한 방법을 선택한다.\n\n근거·학습주제\n작물 기상재해·고온장해","explanationSections":[{"label":"정답 근거","text":"일소와 결구불량 등은 대표적인 고온 관련 장해이다. 이를 모두 저온장해로 묶은 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"동해는 동결온도 이하의 피해이며 온대과수가 열대과수보다 일반적으로 내동성이 강하다. 연소법은 서리피해 경감에 이용되던 방법이다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"연소법은 효과와 현장 여건을 확인하며 실제 방상은 살수·송풍 등 적합한 방법을 선택한다.","kind":"note"},{"label":"근거·학습주제","text":"작물 기상재해·고온장해","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"4-61","round":4,"year":2018,"number":61,"subject":"재배학·원예작물학","topic":"광중단","stem":"다음과 관련되는 현상은?\nA농가는 지난해 노지에 국화를 심고 가을에 절화를 수확하여 출하하였다. 재배지\n주변의 가로등이 밤에 켜져 있어 주변 국화의 꽃눈분화가 억제되어 개화가 되지 않\n아 경제적 손실을 입었다.","options":[{"n":"1","text":"도장 현상"},{"n":"2","text":"광중단 현상"},{"n":"3","text":"순멎이 현상"},{"n":"4","text":"블라스팅 현상"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n밤중의 가로등 빛이 암기를 끊으면 단일식물 국화의 꽃눈분화가 억제된다. 광중단 현상이므로 ②이다.\n\n오답 확인\n도장은 줄기가 웃자라는 생육현상, 순멎이는 생장점 정지, 블라스팅은 꽃봉오리 발육정지 현상이다.\n\n근거·학습주제\n화훼학 광주기·광중단","explanationSections":[{"label":"정답 근거","text":"밤중의 가로등 빛이 암기를 끊으면 단일식물 국화의 꽃눈분화가 억제된다. 광중단 현상이므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"도장은 줄기가 웃자라는 생육현상, 순멎이는 생장점 정지, 블라스팅은 꽃봉오리 발육정지 현상이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학 광주기·광중단","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"4-62","round":4,"year":2018,"number":62,"subject":"재배학·원예작물학","topic":"열대 절화 저온장해","stem":"B씨가 저장한 화훼는?\nB씨가 화훼류를 수확하여 4℃ 저장고에 2주간 저장한 후 출하ㆍ유통하려 하였더니\n저장전과 달리 저온장해가 발생하였다.","options":[{"n":"1","text":"장미"},{"n":"2","text":"금어초"},{"n":"3","text":"카네이션"},{"n":"4","text":"안스리움"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n안스리움은 열대성 화훼로 낮은 저장온도에 민감하다. 4℃ 장기저장 시 저온장해가 문제되므로 ④이다.\n\n오답 확인\n장미·금어초·카네이션은 일반적으로 저온 유통을 활용하는 절화이다. 절화마다 적정 저장온도가 같지 않다.\n\n근거·학습주제\n절화 수확후관리·저온장해","explanationSections":[{"label":"정답 근거","text":"안스리움은 열대성 화훼로 낮은 저장온도에 민감하다. 4℃ 장기저장 시 저온장해가 문제되므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"장미·금어초·카네이션은 일반적으로 저온 유통을 활용하는 절화이다. 절화마다 적정 저장온도가 같지 않다.","kind":"incorrect"},{"label":"근거·학습주제","text":"절화 수확후관리·저온장해","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"4-63","round":4,"year":2018,"number":63,"subject":"재배학·원예작물학","topic":"피복자재 보온","stem":"시설원예 자재에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"피복자재는 열전도율이 높아야 한다."},{"n":"2","text":"피복자재는 외부 충격에 강해야 한다."},{"n":"3","text":"골격자재는 내부식성이 강해야 한다."},{"n":"4","text":"골격자재는 철재 및 경합금재가 사용된다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n피복재는 열손실을 줄이는 특성이 유리하다. 열전도율이 높아야 한다는 ①이 부적절하다.\n\n오답 확인\n충격 저항성, 골격의 내식성, 철재·경합금재 사용은 시설자재의 요구특성 또는 사용 예이다.\n\n근거·학습주제\n시설원예 피복·골격자재","explanationSections":[{"label":"정답 근거","text":"피복재는 열손실을 줄이는 특성이 유리하다. 열전도율이 높아야 한다는 ①이 부적절하다.","kind":"reason"},{"label":"오답 확인","text":"충격 저항성, 골격의 내식성, 철재·경합금재 사용은 시설자재의 요구특성 또는 사용 예이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 피복·골격자재","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"4-64","round":4,"year":2018,"number":64,"subject":"재배학·원예작물학","topic":"습해 방지","stem":"작물재배 시 습해 방지대책으로 옳지 않은 것은?","options":[{"n":"1","text":"배수"},{"n":"2","text":"토양개량"},{"n":"3","text":"증발억제제 살포"},{"n":"4","text":"내습성 작물 선택"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n습해는 근권 과습과 산소 부족이 원인이므로 수분의 배출과 통기를 개선한다. 증발억제제 살포는 이를 해결하는 일반대책이 아니므로 ③이다.\n\n오답 확인\n배수·토양개량·내습성 작물 선택은 과습 노출이나 피해를 줄인다. 한해대책과 습해대책을 바꾸지 않는다.\n\n근거·학습주제\n토양 습해 대책","explanationSections":[{"label":"정답 근거","text":"습해는 근권 과습과 산소 부족이 원인이므로 수분의 배출과 통기를 개선한다. 증발억제제 살포는 이를 해결하는 일반대책이 아니므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"배수·토양개량·내습성 작물 선택은 과습 노출이나 피해를 줄인다. 한해대책과 습해대책을 바꾸지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"토양 습해 대책","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":["3-55"]},{"id":"4-65","round":4,"year":2018,"number":65,"subject":"재배학·원예작물학","topic":"춘화","stem":"다음이 설명하는 현상은?\n○ 온도자극에 의해 화아분화가 촉진되는 것을 말한다.\n○ 추파성 밀 종자를 저온에 일정기간 둔 후 파종하면 정상적으로 출수할 수 있다.","options":[{"n":"1","text":"춘화 현상"},{"n":"2","text":"경화 현상"},{"n":"3","text":"추대 현상"},{"n":"4","text":"하고 현상"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n일정기간 저온을 경험하여 화아분화·출수 능력이 생기는 것은 춘화이다. 추파성 밀의 저온처리가 대표적이므로 ①이다.\n\n오답 확인\n경화는 내한성 증가, 추대는 꽃대 신장, 하고는 여름철 생육쇠퇴로 춘화와 다르다.\n\n근거·학습주제\n작물 생리·춘화","explanationSections":[{"label":"정답 근거","text":"일정기간 저온을 경험하여 화아분화·출수 능력이 생기는 것은 춘화이다. 추파성 밀의 저온처리가 대표적이므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"경화는 내한성 증가, 추대는 꽃대 신장, 하고는 여름철 생육쇠퇴로 춘화와 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"작물 생리·춘화","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"4-66","round":4,"year":2018,"number":66,"subject":"재배학·원예작물학","topic":"입단 파괴","stem":"토양 입단 파괴요인을 모두 고른 것은?\nㄱ. 유기물 시용 ㄴ. 피복 작물 재배\nㄷ. 비와 바람 ㄹ. 경운","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["4"],"answerLabel":"4번","expl  횡축생장이 충분하면 편원형 경향이 나타나므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"초기·후기 생장축을 뒤바꾸거나 따뜻한 곳의 과형을 장원형으로 연결한 선택지는 틀리다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과실 발육·온도와 과형","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"4-69","round":4,"year":2018,"number":69,"subject":"재배학·원예작물학","topic":"우박의 국지성","stem":"우리나라의 우박 피해에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"사과, 배의 착과기와 성숙기에 많이 발생한다."},{"n":"2","text":"돌발적이고 단기간에 큰 피해가 발생한다."},{"n":"3","text":"지리적 조건과 관계없이 광범위하게 분포한다."},{"n":"4","text":"수관 상부에 그물을 씌워 피해를 경감시킬 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n우박은 국지적 대류·지형 등의 영향을 받으며 피해지역이 좁고 띠 모양으로 나타나기 쉽다. 지리적 조건과 무관하게 광범위하다는 ③이 틀리다.\n\n오답 확인\n착과·성숙기 피해, 돌발적인 단시간 피해, 방상망 등 망 피복에 의한 경감은 타당하다.\n\n근거·학습주제\n농촌진흥청 과수 우박피해 관리","explanationSections":[{"label":"정답 근거","text":"우박은 국지적 대류·지형 등의 영향을 받으며 피해지역이 좁고 띠 모양으로 나타나기 쉽다. 지리적 조건과 무관하게 광범위하다는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"착과·성숙기 피해, 돌발적인 단시간 피해, 방상망 등 망 피복에 의한 경감은 타당하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농촌진흥청 과수 우박피해 관리","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":["12-59"]},{"id":"4-70","round":4,"year":2018,"number":70,"subject":"재배학·원예작물학","topic":"배토","stem":"다음이 설명하는 것은?\n○ 경작지 표면의 흙을 그루 주변에 모아 주는 것을 말한다.\n○ 일반적으로 잡초 방지, 도복 방지, 맹아 억제 등의 목적으로 실시한다.","options":[{"n":"1","text":"멀칭"},{"n":"2","text":"배토"},{"n":"3","text":"중경"},{"n":"4","text":"쇄토"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n그루 주위로 흙을 모아주는 작업은 배토이다. 잡초·도복·맹아를 억제하는 목적과 일치하므로 ②이다.\n\n오답 확인\n멀칭은 피복, 중경은 생육 중 얕은 경운, 쇄토는 흙덩이를 부수는 작업이다.\n\n근거·학습주제\n재배관리 배토·중경","explanationSections":[{"label":"정답 근거","text":"그루 주위로 흙을 모아주는 작업은 배토이다. 잡초·도복·맹아를 억제하는 목적과 일치하므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"멀칭은 피복, 중경은 생육 중 얕은 경운, 쇄토는 흙덩이를 부수는 작업이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배관리 배토·중경","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"4-71","round":4,"year":2018,"number":71,"subject":"재배학·원예작물학","topic":"고두병","stem":"과수작물에서 무기양분의 불균형으로 발생하는 생리장해는?","options":[{"n":"1","text":"일소"},{"n":"2","text":"동록"},{"n":"3","text":"열과"},{"n":"4","text":"고두병"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n고두병은 사과 과실의 칼슘 부족·불균형과 관련한 생리장해이므로 ④이다.\n\n오답 확인\n일소는 강광·고온, 열과는 과피와 과육의 생장차·수분변동, 동록은 과피 손상 등과 관련한다. 제시항목 중 무기양분 불균형의 대표는 고두병이다.\n\n근거·학습주제\n과수 칼슘·고두병","explanationSections":[{"label":"정답 근거","text":"고두병은 사과 과실의 칼슘 부족·불균형과 관련한 생리장해이므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"일소는 강광·고온, 열과는 과피와 과육의 생장차·수분변동, 동록은 과피 손상 등과 관련한다. 제시항목 중 무기양분 불균형의 대표는 고두병이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 칼슘·고두병","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":35,"similarIds":[]},{"id":"4-72","round":4,"year":2018,"number":72,"subject":"재배학·원예작물학","topic":"진딧물과 진디벌","stem":"다음이 설명하는 해충과 천적의 연결이 옳은 것은?\n○ 즙액을 빨아 먹고, 표면에 배설물을 부착시켜 그을음병을 유발시킨다.\n○ 고추의 전 생육기간에 걸쳐 발생하며 CMV 등 바이러스를 옮기는 매개충이다.","options":[{"n":"1","text":"진딧물 - 진디벌"},{"n":"2","text":"잎응애류 - 칠레이리응애"},{"n":"3","text":"잎굴파리 - 굴파리좀벌"},{"n":"4","text":"총채벌레 - 애꽃노린재"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n흡즙하고 감로를 배출하여 그을음병을 유발하며 CMV를 매개하는 해충은 진딧물이다. 천적인 진디벌을 연결한 ①이다.\n\n오답 확인\n다른 선택지의 천적 조합이 성립하더라도 문제의 해충 특징과는 맞지 않는다. 응애·잎굴파리·총채벌레와 구별한다.\n\n근거·학습주제\n작물보호 천적·바이러스 매개","explanationSections":[{"label":"정답 근거","text":"흡즙하고 감로를 배출하여 그을음병을 유발하며 CMV를 매개하는 해충은 진딧물이다. 천적인 진디벌을 연결한 ①이다.","kind":"reason"},{"label":"오답 확인","text":"다른 선택지의 천적 조합이 성립하더라도 문제의 해충 특징과는 맞지 않는다. 응애·잎굴파리·총채벌레와 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"작물보호 천적·바이러스 매개","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":35,"similarIds":["2-58"]},{"id":"4-73","round":4,"year":2018,"number":73,"subject":"재배학·원예작물학","topic":"로제트 타파","stem":"작물의 로제트(rosette)현상을 타파하기 위한 생장조절물질은?","options":[{"n":"1","text":"옥신"},{"n":"2","text":"지베렐린"},{"n":"3","text":"에틸렌"},{"n":"4","text":"아브시스산"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n지베렐린은 줄기 신장을 촉진하여 로제트 상태를 타파하는 데 이용하므로 ②이다.\n\n오답 확인\n옥신은 발근·정아우세 등에, 에틸렌은 성숙·노화 등에, ABA는 휴면·기공폐쇄 등에 관여한다.\n\n근거·학습주제\n식물생장조절물질","explanationSections":[{"label":"정답 근거","text":"지베렐린은 줄기 신장을 촉진하여 로제트 상태를 타파하는 데 이용하므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"옥신은 발근·정아우세 등에, 에틸렌은 성숙·노화 등에, ABA는 휴면·기공폐쇄 등에 관여한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"식물생장조절물질","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":35,"similarIds":[]},{"id":"4-74","round":4,"year":2018,"number":74,"subject":"재배학·원예작물학","topic":"일조 부족","stem":"과수재배 시 일조(日照) 부족 현상은?","options":[{"n":"1","text":"신초 웃자람"},{"n":"2","text":"꽃눈 형성 촉진"},{"n":"3","text":"과실 비대 촉진"},{"n":"4","text":"사과 착색 촉진"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n일조 부족에서는 신초가 가늘고 길게 웃자라는 도장 경향이 나타나므로 ①이다.\n\n오답 확인\n꽃눈형성·과실 비대·사과 착색에는 충분한 동화산물과 광이 필요하므로 일조 부족이 이를 일반적으로 촉진하지 않는다.\n\n근거·학습주제\n과수 광환경","explanationSections":[{"label":"정답 근거","text":"일조 부족에서는 신초가 가늘고 길게 웃자라는 도장 경향이 나타나므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"꽃눈형성·과실 비대·사과 착색에는 충분한 동화산물과 광이 필요하므로 일조 부족이 이를 일반적으로 촉진하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 광환경","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":[]},{"id":"4-75","round":4,"year":2018,"number":75,"subject":"재배학·원예작물학","topic":"필름 보온성","stem":"다음 피복재 중 보온성이 가장 높은 연질 필름은?","options":[{"n":"1","text":"폴리에틸렌(PE) 필름"},{"n":"2","text":"염화비닐(PVC) 필름"},{"n":"3","text":"불소계 수지(ETFE) 필름"},{"n":"4","text":"에틸렌 아세트산비닐(EVA) 필름"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n제시된 일반 연질필름 중 PVC는 장파 복사열 차단성이 좋아 보온성이 높은 것으로 분류한다. 정답은 ②이다.\n\n오답 확인\nPE는 상대적으로 야간 복사열 손실이 크다. EVA·ETFE 등은 광투과·내후성과 보온성을 함께 비교해야 하며 이름만으로 PVC보다 보온성이 높다고 보지 않는다.\n\n기준·변경 메모\n현대 제품은 첨가제·다층구조에 따라 성능이 달라지므로 실제 자재 선택은 제품 성능표로 판단한다.\n\n근거·학습주제\n시설원예 연질 피복필름","explanationSections":[{"label":"정답 근거","text":"제시된 일반 연질필름 중 PVC는 장파 복사열 차단성이 좋아 보온성이 높은 것으로 분류한다. 정답은 ②이다.","kind":"reason"},{"label":"오답 확인","text":"PE는 상대적으로 야간 복사열 손실이 크다. EVA·ETFE 등은 광투과·내후성과 보온성을 함께 비교해야 하며 이름만으로 PVC보다 보온성이 높다고 보지 않는다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"현대 제품은 첨가제·다층구조에 따라 성능이 달라지므로 실제 자재 선택은 제품 성능표로 판단한다.","kind":"note"},{"label":"근거·학습주제","text":"시설원예 연질 피복필름","kind":"reference"}],"sourcePdf":"2018년 제4회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":["7-74","5-75","3-75","10-75","1-74"]},{"id":"5-1","round":5,"year":2019,"number":1,"subject":"상법(보험편)","topic":"보험계약의 성질","stem":"보험계약에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험계약은 당사자 일방이 약정한 보험료를 지급하고, 상대방은 일정한 보험금이나 그 밖\n의 급여를 지급할 것을 약정함으로써 효력이 발생한다."},{"n":"2","text":"보험계약은 당사자 사이의 청약과 승낙의 의사합치에 의하여 성립한다."},{"n":"3","text":"보험계약은 요물계약이다."},{"n":"4","text":"보험계약은 부합계약의 일종이다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험계약은 청약과 승낙의 합의로 성립하는 낙성계약이다. 보험료 등의 현실적 인도가 성립요건인 요물계약이라는 ③이 틀리다.\n\n오답 확인\n① 약정으로 효력이 발생한다는 설명, ② 의사합치, ④ 정형 약관에 의한 부합계약적 성격은 타당하다.\n\n근거·학습주제\n상법 제638조·보험계약의 성질","explanationSections":[{"label":"정답 근거","text":"보험계약은 청약과 승낙의 합의로 성립하는 낙성계약이다. 보험료 등의 현실적 인도가 성립요건인 요물계약이라는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 약정으로 효력이 발생한다는 설명, ② 의사합치, ④ 정형 약관에 의한 부합계약적 성격은 타당하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조·보험계약의 성질","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["7-1"]},{"id":"5-2","round":5,"year":2019,"number":2,"subject":"상법(보험편)","topic":"약관의 구속력","stem":"상법상 보험약관의 교부ㆍ설명의무에 관한 내용으로 옳은 것은? (다툼이 있으면 판례\n에 따름)","options":[{"n":"1","text":"보험약관이 계약당사자에 대하여 구속력을 갖는 것은 계약당사자 사이에서 계약내용에 포\n함시키기로 합의하였기 때문이다."},{"n":"2","text":"보험계약이 성립한 후 3월 이내에 보험계약자는 보험자의 보험약관 교부ㆍ설명의무 위반\n을 이유로 그 계약을 철회할 수 있다."},{"n":"3","text":"보험자의 보험약관 교부ㆍ설명의무 위반시 보험계약자는 해당 계약을 소급해서 무효로 할\n수 있는데, 그 권리의 행사시점은 보험사고 발생시부터이다."},{"n":"4","text":"보험자는 보험계약을 체결한 후에 보험계약자에게 중요한 사항을 설명하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n약관은 계약당사자가 이를 계약내용으로 편입하기로 합의했기 때문에 구속력을 갖는다. ①이 옳다.\n\n오답 확인\n② 상법상 효과는 계약성립 후 3월 내 취소이며 '철회'와 구별한다. ③ 사고시부터 행사한다는 내용은 없다. ④ 중요한 사항은 계약체결할 때 설명해야 한다.\n\n근거·학습주제\n상법 제638조의3·약관 편입 법리","explanationSections":[{"label":"정답 근거","text":"약관은 계약당사자가 이를 계약내용으로 편입하기로 합의했기 때문에 구속력을 갖는다. ①이 옳다.","kind":"reason"},{"label":"오답 확인","text":"② 상법상 효과는 계약성립 후 3월 내 취소이며 '철회'와 구별한다. ③ 사고시부터 행사한다는 내용은 없다. ④ 중요한 사항은 계약체결할 때 설명해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·약관 편입 법리","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["7-8","2-16","3-3","8-2"]},{"id":"5-3","round":5,"year":2019,"number":3,"subject":"상법(보험편)","topic":"타인을 위한 보험의 이익","stem":"타인을 위한 보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 위임을 받아 특정의 타인을 위하여 보험계약을 체결할 수 있다."},{"n":"2","text":"보험계약자는 위임을 받지 아니하고 불특정의 타인을 위하여 보험계약을 체결할 수 있다."},{"n":"3","text":"타인을 위한 손해보험계약의 경우에 그 타인의 위임이 없는 때에는 이를 보험자에게 고지\n하여야 한다."},{"n":"4","text":"타인을 위한 보험계약의 경우에 그 타인은 수익의 의사표시를 하여야 그 계약의 이익을\n받게 된다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n타인은 수익의 의사표시 없이 당연히 계약의 이익을 받는다. 별도 수익 의사표시가 필요하다는 ④가 틀리다.\n\n오답 확인\n위임 유무나 특정·불특정 여부에 관계없이 타인을 위한 보험체결은 가능하다. 다만 무위임 손해보험에서는 그 사실을 보험자에게 고지해야 한다.\n\n근거·학습주제\n상법 제639조","explanationSections":[{"label":"정답 근거","text":"타인은 수익의 의사표시 없이 당연히 계약의 이익을 받는다. 별도 수익 의사표시가 필요하다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"위임 유무나 특정·불특정 여부에 관계없이 타인을 위한 보험체결은 가능하다. 다만 무위임 손해보험에서는 그 사실을 보험자에게 고지해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["7-2","6-12","3-4","9-2","11-2","7-5","12-3","2-17"]},{"id":"5-4","round":5,"year":2019,"number":4,"subject":"상법(보험편)","topic":"보험증권 교부","stem":"보험증권에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 보험계약이 성립한 때에는 지체없이 보험증권을 작성하여 보험계약자에게 교부\n하여야 한다. 그러나 보험계약자가 보험료의 전부 또는 최초의 보험료를 지급하지 아니한\n때에는 그러하지 아니하다."},{"n":"2","text":"기존의 보험계약을 연장하거나 변경한 경우에 보험자는 그 보험증권에 그 사실을 기재함\n으로써 보험증권의 교부에 갈음할 수 없다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날로부터 일정한 기간내에 한하여 그 증권내\n용의 정부에 관한 이의를 할 수 있음을 약정할 수 있다. 이 기간은 1월을 내리지 못한다."},{"n":"4","text":"보험증권을 멸실 또는 현저하게 훼손한 때에는 보험계약자는 보험자에 대하여 증권의 재\n교부를 청구할 수 있다. 그 증권작성의 비용은 보험계약자의 부담으로 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n기존 계약을 연장·변경한 경우 기존 증권에 그 사실을 기재하면 교부에 갈음할 수 있다. ②의 갈음할 수 없다는 표현이 틀리다.\n\n오답 확인\n① 최초보험료 미지급 시 교부의 예외, ③ 이의기간 최소 1월, ④ 재교부 비용의 계약자 부담은 조문에 맞는다.\n\n근거·학습주제\n상법 제640조·제641조·제642조","explanationSections":[{"label":"정답 근거","text":"기존 계약을 연장·변경한 경우 기존 증권에 그 사실을 기재하면 교부에 갈음할 수 있다. ②의 갈음할 수 없다는 표현이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 최초보험료 미지급 시 교부의 예외, ③ 이의기간 최소 1월, ④ 재교부 비용의 계약자 부담은 조문에 맞는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제641조·제642조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["10-3","11-3","2-2","12-1","4-3","9-3","8-3","6-13","7-3","10-2","3-5","12-3","5-7"]},{"id":"5-5","round":5,"year":2019,"number":5,"subject":"상법(보험편)","topic":"보험계약 부활","stem":"보험계약 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 그 계약전의 어느 시기를 보험기간의 시기로 할 수 있다."},{"n":"2","text":"보험계약당시에 보험사고가 이미 발생하였거나 또는 발생할 수 없는 것인 때에는 그 계약\n은 무효로 한다. 그러나 당사자 쌍방과 피보험자가 이를 알지 못한 때에는 그러하지 아니\n하다."},{"n":"3","text":"대리인에 의하여 보험계약을 체결한 경우에 대리인이 안 사유는 그 본인이 안 것과 동일\n한 것으로 한다."},{"n":"4","text":"최초보험료 지급지체에 따라 보험계약이 해지된 경우 보험계약자는 그 계약의 부활을 청\n구할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n부활은 계속보험료 연체에 따른 해지와 해지환급금 미지급 등을 전제로 한다. 최초보험료 지급지체 계약에 부활청구권이 있다고 한 ④는 틀리다.\n\n오답 확인\n① 소급보험은 가능하고, ② 사고 객관적 확정의 경우에도 모두 선의이면 예외가 있다. ③ 대리인의 지식은 본인의 지식과 같이 취급한다.\n\n근거·학습주제\n상법 제643조·제644조·제646조·제650조의2","explanationSections":[{"label":"정답 근거","text":"부활은 계속보험료 연체에 따른 해지와 해지환급금 미지급 등을 전제로 한다. 최초보험료 지급지체 계약에 부활청구권이 있다고 한 ④는 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 소급보험은 가능  ③은 허용될 수 있다.\n\n오답 확인\n① 취소권 3월을 1월로 축소하고 ② 증권 이의기간 1월을 2주로 줄이며 ④ 무인과성 입증에도 면책시키는 것은 가계보험 계약자에게 불리하다.\n\n근거·학습주제\n상법 제638조의3·제641조·제650조의2·제655조·제663조","explanationSections":[{"label":"정답 근거","text":"해지환급금을 이미 반환한 경우까지 부활청구를 허용하는 약관은 계약자에게 유리한 확대이므로 ③은 허용될 수 있다.","kind":"reason"},{"label":"오답 확인","text":"① 취소권 3월을 1월로 축소하고 ② 증권 이의기간 1월을 2주로 줄이며 ④ 무인과성 입증에도 면책시키는 것은 가계보험 계약자에게 불리하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·제641조·제650조의2·제655조·제663조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["1-3"]},{"id":"5-13","round":5,"year":2019,"number":13,"subject":"상법(보험편)","topic":"수시교체 집합보험","stem":"다음 설명 중 옳지 않은 것은?","options":[{"n":"1","text":"손해보험계약의 보험자는 보험사고로 인하여 생길 피보험자의 재산상의 손해를 보상할 책\n임이 있다."},{"n":"2","text":"손해보험증권에는 보험증권의 작성지와 그 작성년월일을 기재하여야 한다."},{"n":"3","text":"보험사고로 인하여 상실된 피보험자가 얻을 이익이나 보수는 당사자간에 다른 약정이 없\n으면 보험자가 보상할 손해액에 산입하지 아니한다."},{"n":"4","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간중에\n수시로 교체된 경우에도 보험계약의 체결시에 현존한 물건은 보험의 목적에 포함된 것으\n로 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n수시로 교체되는 집합목적물은 사고발생시에 현존하는 물건을 기준으로 한다. 계약체결시 현존 물건으로 고정한 ④가 틀리다.\n\n오답 확인\n① 피보험자의 재산손해 보상, ② 증권 작성지·일자 기재, ③ 이익·보수의 원칙적 불산입은 조문 내용이다.\n\n근거·학습주제\n상법 제665조·제666조·제676조·제686조","explanationSections":[{"label":"정답 근거","text":"수시로 교체되는 집합목적물은 사고발생시에 현존하는 물건을 기준으로 한다. 계약체결시 현존 물건으로 고정한 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 피보험자의 재산손해 보상, ② 증권 작성지·일자 기재, ③ 이익·보수의 원칙적 불산입은 조문 내용이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제665조·제666조·제676조·제686조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["12-25","10-25","3-18","11-23","9-25","7-25","4-25","9-17","2-17","6-10","1-14","7-13","10-19","3-21","8-15","12-18","4-22"]},{"id":"5-14","round":5,"year":2019,"number":14,"subject":"상법(보험편)","topic":"초과보험 감액효","stem":"초과보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험금액이 보험계약당시의 보험계약의 목적의 가액을 현저히 초과 ,"11-16","6-25","12-15","10-15","3-20","1-16","2-9","4-17","8-15","7-13"]},{"id":"5-16","round":5,"year":2019,"number":16,"subject":"상법(보험편)","topic":"피보험이익","stem":"피보험이익에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"우리 상법은 손해보험뿐만 아니라 인보험에서도 피보험이익이 있을 것을 요구한다."},{"n":"2","text":"상법은 피보험이익을 보험계약의 목적이라고 표현하며 보험의 목적과는 다르다."},{"n":"3","text":"밀수선이 압류되어 입을 경제적 손실은 피보험이익이 될 수 없다."},{"n":"4","text":"보험계약의 동일성을 판단하는 표준이 된다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n금전평가 가능한 피보험이익은 손해보험의 요건이다. 인보험에도 같은 요건을 요구한다는 ①이 틀리다.\n\n오답 확인\n보험계약의 목적이라는 표현은 대상 물건과 구별된다. 위법한 밀수이익은 보호대상이 아니며 피보험이익은 계약 동일성의 판단기준이다.\n\n근거·학습주제\n상법 제668조·피보험이익","explanationSections":[{"label":"정답 근거","text":"금전평가 가능한 피보험이익은 손해보험의 요건이다. 인보험에도 같은 요건을 요구한다는 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"보험계약의 목적이라는 표현은 대상 물건과 구별된다. 위법한 밀수이익은 보호대상이 아니며 피보험이익은 계약 동일성의 판단기준이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제668조·피보험이익","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":[]},{"id":"5-17","round":5,"year":2019,"number":17,"subject":"상법(보험편)","topic":"특약의 허용범위","stem":"상법상 당사자간에 다른 약정이 있으면 허용되는 것을 모두 고른 것은?\nㄱ. 보험사고가 전쟁 기타 변란으로 인하여 생긴 때의 위험을 담보하는 것\nㄴ. 최초의 보험료의 지급이 없는 때에도 보험자의 책임이 개시되도록 하는 것\nㄷ. 사고발생전 임의해지시 미경과보험료의 반환을 청구하지 않기로 하는 것\nㄹ. 특정한 타인을 위한 보험의 경우에 보험계약자가 보험료의 지급을 지체한 때에\n는 보험자가 보험계약자에게만 최고하고 그의 지급이 없는 경우 그 계약을 해지\n하기로 하는 것","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n전쟁위험 담보, 최초보험료 지급 전 책임개시, 사고 전 해지의 미경과보험료 반환 제한은 조문상 다른 약정을 허용한다. ㄱ·ㄴ·ㄷ, ③이다.\n\n오답 확인\nㄹ 특정 타인을 위한 보험은 연체 시 그 타인에게도 최고해야 하는 보호규정을 불리하게 배제한 것이므로 허용되는 조합에서 제외한다.\n\n근거·학습주제\n상법 제649조·제650조·제656조·제660조·제663조","explanationSections":[{"label":"정답 근거","text":"전쟁위험 담보, 최초보험료 지급 전 책임개시, 사고 전 해지의 미경과보험료 반환 제한은 조문상 다른 약정을 허용한다. ㄱ·ㄴ·ㄷ, ③이다.","kind":"reason"},{"label":"오답 확인","text":"ㄹ 특정 타인을 위한 보험은 연체 시 그 타인에게도 최고해야 하는 보호규정을 불리하게 배제한 것이므로 허용되는 조합에서 제외한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제649조·제650조·제656조·제660조·제663조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["2-5","9-6"]},{"id":"5-18","round":5,"year":2019,"number":18,"subject":"상법(보험편)","topic":"중복보험 통지","stem":"중복보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이 동시에 또는 순차로\n체결된 경우에 그 보험금액의 총액이 보험가액을 현저히 초과한 경우에만 상법상 중복보\n험에 해당한다."},{"n":"2","text":"동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약을 체결하는 경우에는\n보험계약자는 각 보험자에 대하여 각 보험계약의 내용을 통지하여야 한다."},{"n":"3","text":"중복보험의 경우 보험자 1인에 대한 피보험자의 권리의 포기는 다른 보험자의 권리의무에\n영향을 미친다."},{"n":"4","text":"보험자는 보험가액의 한도에서 연대책임을 진다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n동일 목적·사고에 여러 보험계약을 체결하면 계약자는 각 보험자에게 다른 계약의 내용을 통지해야 하므로 ②이다.\n\n오답 확인\n① '현저히' 초과할 필요는 없다. ③ 한 보험자에 대한 권리포기는 다른 보험자에게 영향을 주지 않는다. ④ 각 보험자는 각자의 보험금액 한도에서 연대책임을 진다.\n\n근거·학습주제\n상법 제672조·제673조","explanationSections":[{"label":"정답 근거","text":"동일 목적·사고에 여러 보험계약을 체결하면 계약자는 각 보험자에게 다른 계약의 내용을 통지해야 하므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"① '현저히' 초과할 필요는 없다. ③ 한 보험자에 대한 권리포기는 다른 보험자에게 영향을 주지 않는다. ④ 각 보험자는 각자의 보험금액 한도에서 연대책임을 진다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조·제673조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["4-19","9-18","8-18","7-17","3-19","1-17","6-20","2-11","6-22"]},{"id":"5-19","round":5,"year":2019,"number":19,"subject":"상법(보험편)","topic":"일부보험 산식","stem":"다음 ( )에 들어갈 용어로 옳은 것은?\n( ㄱ )의 일부를 보험에 붙인 경우에는 보험자는 ( ㄴ )의 ( ㄷ )에 대한 비율에 따라\n보상할 책임을 진다. 그러나 당사자간에 다른 약정이 있는 때에는 보험자는 ( ㄹ )의\n한도 내에서 그 손해를 보상할 책임을 진다.","options":[{"n":"1","text":"ㄱ: 보험금액 ㄴ: 보험가액 ㄷ: 보험금액 ㄹ: 보험금액"},{"n":"2","text":"ㄱ: 보험금액 ㄴ: 보험금액 ㄷ: 보험가액 ㄹ: 보험가액"},{"n":"3","text":"ㄱ: 보험가액 ㄴ: 보험가액 ㄷ: 보험금액 ㄹ: 보험가액"},{"n":"4","text":"ㄱ: 보험가액 ㄴ: 보험금액 ㄷ: 보험가액 ㄹ: 보험금액"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험가액 일부를 보험에 붙이면 보험금액/보험가액의 비율로 비례보상한다. 특약 시 보험금액 한도에서 실손을 보상할 수 있다. ④이다.\n\n오답 확인\n보험가액은 이익의 평가액, 보험금액은 계약상 보상한도이다. 두 값을 역전시키면 일부보험 비율이 1보다 커지는 잘못이 생긴다.\n\n근거·학습주제\n상법 제674조","explanationSections":[{"label":"정답 근거","text":"보험가액 일부를 보험에 붙이면 보험금액/보험가액의 비율로 비례보상한다. 특약 시 보험금액 한도에서 실손을 보상할 수 있다. ④이다.","kind":"reason"},{"label":"오답 확인","text":"보험가액은 이익의 평가액, 보험금액은 계약상 보상한도이다. 두 값을 역전시키면 일부보험 비율이 1보다 커지는 잘못이 생긴다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제674조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["6-20","8-24"]},{"id":"5-20","round":5,"year":2019,"number":20,"subject":"상법(보험편)","topic":"후발 면책사고","stem":"손해액의 산정기준 등에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험의 목적에 관하여 보험자가 부담할 손해가 생긴 경우에는 그 후 그 목적이 보험자가\n부담하지 아니하는 보험사고의 발생으로 인하여 멸실된 때에도 보험자는 이미 생긴 손해\n를 보상할 책임을 면하지 못한다."},{"n":"2","text":"당사자간에 다른 약정이 있는 때에도 이득금지의 원칙상 신품가액에 의하여 손해액을 산\n정할 수는 없다."},{"n":"3","text":"보험자가 보상할 손해액은 보험계약이 체결된 때와 곳의 가액에 의하여 산정한다."},{"n":"4","text":"손해액의 산정에 관한 비용은 보험계약자의 부담으로 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n이미 담보사고 손해가 생겼다면 뒤에 면책사고로 목적물이 멸실되어도 그 앞선 손해의 보상책임은 남는다. ①이다.\n\n오답 확인\n② 신품가액 특약은 가능하다. ③ 손해액은 사고발생 때·곳의 가액이 원칙이다. ④ 산정비용은 보험자가 부담한다.\n\n근거·학습주제\n상법 제675조·제676조","explanationSections":[{"label":"정답 근거","text":"이미 담보사고 손해가 생겼다면 뒤에 면책사고로 목적물이 멸실되어도 그 앞선 손해의 보상책임은 남는다. ①이다.","kind":"reason"},{"label":"오답 확인","text":"② 신품가액 특약은 가능하다. ③ 손해액은 사고발생 때·곳의 가액이 원칙이다. ④ 산정비용은 보험자가 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제675조·제676조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["10-19","9-20","3-25","12-19","6-4","8-21","1-19","4-21","10-18","2-22","12-18","7-21","7-20","8-20","8-15"]},{"id":"5-21","round":5,"year":2019,"number":21,"subject":"상법(보험편)","topic":"양도 통지의무자","stem":"다음 ( )에 들어갈 상법 규정으로 옳은 것은?\n상법 제679조(보험목적의 양도)\n① 피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리와 의무를\n승계한 것으로 추정한다.\n② 제1항의 경우에 보험의 목적의 ( )은 보험자에 대하여 지체없이 그 사실을 통\n지하여야 한다.","options":[{"n":"1","text":"양도인"},{"n":"2","text":"양수인"},{"n":"3","text":"양도인과 양수인"},{"n":"4","text":"양도인 또는 양수인"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험목적 양도 사실은 양도인 또는 양수인이 지체 없이 통지한다. ④이다.\n\n오답 확인\n두 사람이 모두 통지해야 한다는 연대적 의무가 아니며 어느 한쪽만 배타적 의무자도 아니다. 권리·의무 승계는 '추정'이라는 점도 확인한다.\n\n근거·학습주제\n상법 제679조","explanationSections":[{"label":"정답 근거","text":"보험목적 양도 사실은 양도인 또는 양수인이 지체 없이 통지한다. ④이다.","kind":"reason"},{"label":"오답 확인","text":"두 사람이 모두 통지해야 한다는 연대적 의무가 아니며 어느 한쪽만 배타적 의무자도 아니다. 권리·의무 승계는 '추정'이라는 점도 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제679조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["11-19","12-20","6-6","4-23"]},{"id":"5-22","round":5,"year":2019,"number":22,"subject":"상법(보험편)","topic":"손해방지 의무","stem":"손해방지의무 등에 관한 상법 규정의 설명으로 옳은 것은?","options":[{"n":"1","text":"피보험자뿐만 아니라 보험계약자도 손해방지의무를 부담한다."},{"n":"2","text":"손해방지비용과 보상액의 합계액이 보험금액을 초과한 때에는 보험자의 지시에 의한 경우\n에만 보험자가 이를 부담한다."},{"n":"3","text":"상법은 피보험자는 보험자에 대하여 손해방지비용의 선급을 청구할 수 있다고 규정한다."},{"n":"4","text":"손해의 방지와 경감을 위하여 유익하였던 비용은 보험자가 이를 부담하지 않는다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n피보험자와 보험계약자 모두 손해의 방지·경감에 노력해야 한다. ①이 옳다.\n\n오답 확인\n② 필요·유익한 비용은 보험자의 지시가 없어도 보험금액을 넘겨 부담할 수 있다. ③ 상법 제680조는 일반적인 선급청구를 명시하지 않는다. ④ 유익한 비용도 보험자 부담이다.\n\n근거·학습주제\n상법 제680조","explanationSections":[{"label":"정답 근거","text":"피보험자와 보험계약자 모두 손해의 방지·경감에 노력해야 한다. ①이 옳다.","kind":"reason"},{"label":"오답 확인","text":"② 필요·유익한 비용은 보험자의 지시가 없어도 보험금액을 넘겨 부담할 수 있다. ③ 상법 제680조는 일반적인 선급청구를 명시하지 않는다. ④ 유익한 비용도 보험자 부담이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제680조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["12-21","1-21","8-23","10-21","2-10","11-20","7-21"]},{"id":"5-23","round":5,"year":2019,"number":23,"subject":"상법(보험편)","topic":"가족에 대한 대위","stem":"제3자에 대한 보험자대위에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해가 제3자의 행위로 인하여 발생한 경우에 보험금을 지급한 보험자는 그 지급한 금액\n의 한도에서 그 제3자에 대한 보험계약자 또는 피보험자의 권리를 취득한다."},{"n":"2","text":"보험자가 보상할 보험금의 일부를 지급한 경우에는 피보험자의 권리를 침해하지 아니하는\n범위에서 그 권리를 행사할 수 있다."},{"n":"3","text":"보험계약자나 피보험자의 제3자에 대한 권리가 그와 생계를 같이 하는 가족에 대한 것인\n경우 보험자는 그 권리를 취득하지 못한다. 다만, 손해가 그 가족의 과실로 인하여 발생한\n경우에는 그러하지 아니하다."},{"n":"4","text":"보험계약에서 담보하지 아니하는 손해에 해당하여 보험금지급의무가 없음에도 보험자가\n피보험자에게 보험금을 지급한 경우라면, 보험자대위가 인정되지 않는다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n생계를 같이하는 가족에 대한 권리는 원칙적으로 대위하지 않지만 가족의 '고의'로 생긴 손해는 예외이다. '과실'로 바꾼 ③이 틀리다.\n\n오답 확인\n① 지급금액 범위의 권리취득, ② 일부지급 시 피보험자 권리 보호는 조문에 맞는다. ④ 지급의무 없는 임의급여만으로 법정 보험자대위가 생기지 않는다.\n\n근거·학습주제\n상법 제682조","explanationSections":[{"label":"정답 근거","text":"생계를 같이하는 가족에 대한 권리는 원칙적으로 대위하지 않지만 가족의 '고의'로 생긴 손해는 예외이다. '과실'로 바꾼 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 지급금액 범위의 권리취득, ② 일부지급 시 피보험자 권리 보호는 조문에 맞는다. ④ 지급의무 없는 임의급여만으로 법정 보험자대위가 생기지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제682조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["11-22","12-22","8-25","7-22","2-17","11-21"]},{"id":"5-24","round":5,"year":2019,"number":24,"subject":"상법(보험편)","topic":"보험료 공제","stem":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있는 경우, 상법\n규정으로 옳은 것은?","options":[{"n":"1","text":"보상할 금액을 전액 지급한 후 그 지급기일이 도래한 때 보험자는 잔액의 상환을 청구할\n수 있다."},{"n":"2","text":"그 지급기일이 도래하지 아니한 때라도 보상할 금액에서 이를 공제할 수 있다."},{"n":"3","text":"그 지급기일이 도래하지 아니한 때라면 보상할 금액에서 이를 공제할 수 없다."},{"n":"4","text":"상법은 보험소비자의 보호를 위하여 어떠한 경우에도 보상할 금액에서 이를 공제할 수 없\n다고 규정한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험자는 미납보험료 잔액의 지급기일이 도래하지 않았어도 보상액에서 공제할 수 있다. ②이다.\n\n오답 확인\n나머지는 기일 전 공제권을 부정하거나 전액 지급 후 별도 상환만 가능하다고 하여 제677조의 특칙과 다르다.\n\n근거·학습주제\n상법 제677조","explanationSections":[{"label":"정답 근거","text":"보험자는 미납보험료 잔액의 지급기일이 도래하지 않았어도 보상액에서 공제할 수 있다. ②이다.","kind":"reason"},{"label":"오답 확인","text":"나머지는 기일 전 공제권을 부정하거나 전액 지급 후 별도 상환만 가능하다고 하여 제677조의 특칙과 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제677조","kind":"reference"}],"sou
