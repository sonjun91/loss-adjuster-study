년간 행사하지 아니하면 시효의 완성으로 소멸한다.","options":[{"n":"1","text":"ㄱ: 2, ㄴ: 3, ㄷ: 2"},{"n":"2","text":"ㄱ: 2, ㄴ: 3, ㄷ: 3"},{"n":"3","text":"ㄱ: 3, ㄴ: 2, ㄷ: 3"},{"n":"4","text":"ㄱ: 3, ㄴ: 3, ㄷ: 2"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험금청구권 3년, 보험료청구권 2년, 적립금 반환청구권 3년이다.\n\n오답 확인\n보험자가 받을 보험료와 계약자 등이 받을 보험금·환급금의 시효를 구분한다. ①②④는 적어도 한 기간이 틀렸다.\n\n근거·학습주제\n상법 제662조","explanationSections":[{"label":"정답 근거","text":"보험금청구권 3년, 보험료청구권 2년, 적립금 반환청구권 3년이다.","kind":"reason"},{"label":"오답 확인","text":"보험자가 받을 보험료와 계약자 등이 받을 보험금·환급금의 시효를 구분한다. ①②④는 적어도 한 기간이 틀렸다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제662조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["7-15","4-13","3-14","11-13"]},{"id":"8-18","round":8,"year":2022,"number":18,"subject":"상법(보험편)","topic":"중복보험 통지","stem":"상법상 중복보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자가 중복보험의 체결사실을 보험자에게 통지하지 아니한 경우 보험자는\n보험계약을 취소할 수 있다."},{"n":"2","text":"중복보험을 체결한 경우 보험계약자는 각 보험자에 대하여 각 보험계약의 내용을\n통지하여야 한다."},{"n":"3","text":"중복보험이라 함은 동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이\n동시에 또는 순차로 체결된 경우를 말한다."},{"n":"4","text":"중복보험은 하나의 보험계약을 수인의 보험자와 체결한 공동보험과 구별된다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n중복보험 체결사실을 통지하지 않았다는 이유만으로 법정 취소권이 당연히 생기지는 않는다.\n\n오답 확인\n각 보험계약 내용의 통지는 의무다. 복수 계약인 중복보험과 하나의 계약에 보험자가 여럿인 공동보험은 구별한다.\n\n근거·학습주제\n상법 제672조","explanationSections":[{"label":"정답 근거","text":"중복보험 체결사실을 통지하지 않았다는 이유만으로 법정 취소권이 당연히 생기지는 않는다.","kind":"reason"},{"label":"오답 확인","text":"각 보험계약 내용의 통지는 의무다. 복수 계약인 중복보험과 하나의 계약에 보험자가 여럿인 공동보험은 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["4-19","5-18","9-18","7-17","3-19","1-17"]},{"id":"8-19","round":8,"year":2022,"number":19,"subject":"상법(보험편)","topic":"중복보험과 일부보험","stem":"다음 사례에 관한 설명으로 옳은 것은? (단, 다른 약정이 없고, 보험사고 당시\n보험가액은 보험계약 당시와 동일한 것으로 전제함)\n<사례 1> 甲은 보험가액이 3억원인 자신의 아파트를 보험목적으로 하여 A보\n험회사 및 B보험회사와 보험금액을 3억원으로 하는 화재보험계약\n을 각각 체결하였다.\n<사례 2> 乙은 보험가액이 10억원인 자신의 건물을 보험목적으로 하여 C보\n험회사와 보험금액을 5억원으로 하는 화재보험계약을 체결하였다.","options":[{"n":"1","text":"화재로 인하여 甲의 아파트가 전부 소실된 경우 甲은 A와 B로부터 각각 3억원의\n보험금을 수령할 수 있다."},{"n":"2","text":"화재로 인하여 甲의 아파트가 전부 소실된 경우 甲이 A에 대한 보험금 청구를 포기\n하였다면 甲에게 보험금 3억원을 지급한 B는 A에 대해 구상금을 청구할 수 없다."},{"n":"3","text":"화재로 인하여 乙의 건물에 5억원의 손해가 발생한 경우 C는 乙에게 5억원을 보험금\n으로 지급하여야 한다."},{"n":"4","text":"화재로 인하여 甲의 아파트가 전부 소실된 경우 A는 甲에 대하여 3억원의 한도에서\nB와 연대책임을 부담한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n갑의 손해 3억원에 대해 A·B는 각 보험금액 3억원 한도에서 연대책임을 진다.\n\n오답 확인\n총 보상은 3억원을 넘지 않는다. 한 보험자에 대한 청구 포기로 다른 보험자의 구상권이 사라지지 않는다. 을의 5억원 손해는 5억/10억 비례로 2억5천만원 보상한다.\n\n근거·학습주제\n상법 제672조~제674조","explanationSections":[{"label":"정답 근거","text":"갑의 손해 3억원에 대해 A·B는 각 보험금액 3억원 한도에서 연대책임을 진다.","kind":"reason"},{"label":"오답 확인","text":"총 보상은 3억원을 넘지 않는다. 한 보험자에 대한 청구 포기로 다른 보험자의 구상권이 사라지지 않는다. 을의 5억원 손해는 5억/10억 비례로 2억5천만원 보상한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조~제674조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["12-17","11-17","10-17"]},{"id":"8-20","round":8,"year":2022,"number":20,"subject":"상법(보험편)","topic":"사후 목적멸실","stem":"화재보험에 있어서 보험자의 보상의무에 관한 설명으로 옳지 않은 것은? (다툼이\n있으면 판례에 따름)","options":[{"n":"1","text":"보험사고의 발생은 보험금 지급을 청구하는 보험계약자 등이 입증해야 한다."},{"n":"2","text":"보험자의 보험금지급의무는 보험기간 내에 보험사고가 발생하고 그 보험사고의 발생\n으로 인하여 피보험자의 피보험이익에 손해가 생기면 성립된다."},{"n":"3","text":"손해란 피보험이익의 전부 또는 일부가 멸실됐거나 감손된 것을 말한다."},{"n":"4","text":"보험의 목적에 관하여 보험자가 부담할 손해가 생긴 경우에는 그 후 그 목적이 보험\n자가 부담하지 아니하는 보험사고의 발생으로 인하여 멸실된 때에는 보험자는 이미\n생긴 손해를 보상할 책임을 면한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n담보사고로 손해가 이미 발생하면 그 뒤 비담보사고로 목적물이 멸실해도 기존 보상책임은 존속한다.\n\n오답 확인\n① 사고발생 입증, ② 보험기간 중 사고와 피보험이익 손해, ③ 멸실·감손이라는 손해 개념은 타당하다.\n\n근거·학습주제\n상법 제675조","explanationSections":[{"label":"정답 근거","text":"담보사고로 손해가 이미 발생하면 그 뒤 비담보사고로 목적물이 멸실해도 기존 보상책임은 존속한다.","kind":"reason"},{"label":"오답 확인","text":"① 사고발생 입증, ② 보험기간 중 사고와 피보험이익 손해, ③ 멸실·감손이라는 손해 개념은 타당하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제675조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["12-18","10-18","7-21","5-20","2-18","10-11","12-10"]},{"id":"8-21","round":8,"year":2022,"number":21,"subject":"상법(보험편)","topic":"손해액 산정","stem":"상법상 손해보험에서 손해액의 산정기준 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액은 그 손해가 발생한 때와 곳의 가액에 의하여 산정하는 것이\n원칙이다."},{"n":"2","text":"손해액의 산정에 관한 비용은 보험계약자의 부담으로 한다."},{"n":"3","text":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있으면 그 지급\n기일이 도래하지 아니한 때라도 보상할 금액에서 이를 공제할 수 있다."},{"n":"4","text":"보험자는 약정에 따라 신품가액에 의하여 손해액을 산정할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n손해액 산정비용은 보험자가 부담한다. 계약자 부담이라는 ②가 틀렸다.\n\n오답 확인\n손해 발생시·장소 가액 기준, 미지급 보험료 공제, 약정에 따른 신품가액 보상은 허용된다.\n\n근거·학습주제\n상법 제676조·제677조","explanationSections":[{"label":"정답 근거","text":"손해액 산정비용은 보험자가 부담한다. 계약자 부담이라는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"손해 발생시·장소 가액 기준, 미지급 보험료 공제, 약정에 따른 신품가액 보상은 허용된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조·제677조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["4-21","10-19","3-25","9-20","1-19","12-19","6-4","5-20","2-22","5-24","10-20","7-21","7-20","6-5"]},{"id":"8-22","round":8,"year":2022,"number":22,"subject":"상법(보험편)","topic":"면책사유","stem":"상법상 손해보험에 있어 보험자의 면책 사유로 옳은 것을 모두 고른 것은?\nㄱ. 보험의 목적의 성질로 인한 손해\nㄴ. 보험의 목적의 하자로 인한 손해\nㄷ. 보험의 목적의 자연소모로 인한 손해\nㄹ. 보험사고가 보험계약자의 고의 또는 중대한 과실로 인하여 생긴 경우","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄷ, ㄹ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n목적의 성질·하자·자연소모에 따른 손해와 계약자의 고의·중과실 사고는 모두 법정 면책사유다.\n\n오답 확인\nㄱ~ㄹ 모두 해당하므로 일부 항목만 고른 ①②③은 불완전하다.\n\n근거·학습주제\n상법 제659조·제678조","explanationSections":[{"label":"정답 근거","text":"목적의 성질·하자·자연소모에 따른 손해와 계약자의 고의·중과실 사고는 모두 법정 면책사유다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ~ㄹ 모두 해당하므로 일부 항목만 고른 ①②③은 불완전하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제659조·제678조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["4-23"]},{"id":"8-23","round":8,"year":2022,"number":23,"subject":"상법(보험편)","topic":"손해방지비용","stem":"상법상 손해보험에서 손해방지의무에 관한 설명으로 옳지 않은 것은? (다툼이 있\n으면 판례에 따름)","options":[{"n":"1","text":"손해방지의무의 주체는 보험계약자와 피보험자이다."},{"n":"2","text":"손해방지를 위하여 필요 또는 유익하였던 비용은 보험자가 부담한다."},{"n":"3","text":"손해방지를 위하여 필요 또는 유익하였던 비용과 보상액이 보험금액을 초과한 경우에는\n보험금액의 한도에서만 보험자가 이를 부담한다."},{"n":"4","text":"피보험자가 손해방지의무를 고의 또는 중과실로 위반한 경우 보험자는 손해방지의무\n위반과 상당인과관계가 있는 손해에 대하여 배상을 청구할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n필요·유익한 손해방지비용은 보상액과 합하여 보험금액을 초과해도 보험자가 부담한다.\n\n오답 확인\n의무자는 계약자·피보험자다. 고의·중과실 위반과 상당인과관계 있는 손해에 대한 책임과 비용의 초과부담을 구별한다.\n\n근거·학습주제\n상법 제680조","explanationSections":[{"label":"정답 근거","text":"필요·유익한 손해방지비용은 보상액과 합하여 보험금액을 초과해도 보험자가 부담한다.","kind":"reason"},{"label":"오답 확인","text":"의무자는 계약자·피보험자다. 고의·중과실 위반과 상당인과관계 있는 손해에 대한 책임과 비용의 초과부담을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제680조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["10-21","12-21","5-22","1-21","11-20","2-10"]},{"id":"8-24","round":8,"year":2022,"number":24,"subject":"상법(보험편)","topic":"잔존물대위 요건","stem":"보험목적에 관한 보험대위에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?\n보험의 목적의 전부가 멸실한 경우에 ( ㄱ )의 ( ㄴ )를 지급한 보험자는 그\n목적에 대한 ( ㄷ )의 권리를 취득한다. 그러나 ( ㄹ )의 일부를 보험에 붙인\n경우에는 보험자가 취득할 권리는 보험금액의 보험가액에 대한 비율에 따라\n이를 정한다.","options":[{"n":"1","text":"ㄱ: 보험금액, ㄴ: 전부, ㄷ: 피보험자, ㄹ: 보험가액"},{"n":"2","text":"ㄱ: 보험금액, ㄴ: 일부, ㄷ: 보험계약자, ㄹ: 보험금액"},{"n":"3","text":"ㄱ: 보험가액, ㄴ: 일부, ㄷ: 피보험자, ㄹ: 보험가액"},{"n":"4","text":"ㄱ: 보험가액, ㄴ: 전부, ㄷ: 피보험자, ㄹ: 보험가액"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험금액 전부를 지급한 보험자가 피보험자의 목적물 권리를 취득한다. 일부보험이면 보험금액/보험가액의 비율로 취득한다.\n\n오답 확인\n지급 기준은 보험가액 전부가 아니라 약정 보험금액 ,"round":8,"year":2022,"number":36,"subject":"농어업재해보험법령","topic":"기금 관리","stem":"농어업재해보험법령상 농어업재해재보험기금(이하 “기금”이라 한다)에 관한 설명\n으로 옳은 것은?","options":[{"n":"1","text":"농림축산식품부장관은 행정안전부장관과 협의를 거쳐 기금의 관리ㆍ운용에 관한 사무\n의 일부를 농업정책보험금융원에 위탁할 수 있다."},{"n":"2","text":"농림축산식품부장관은 기금의 수입과 지출을 명확히 하기 위하여 농업정책보험금융원\n에 기금계정을 설치하여야 한다."},{"n":"3","text":"기금의 관리ㆍ운용에 필요한 경비의 지출은 기금의 용도에 해당한다."},{"n":"4","text":"기금은 농림축산식품부장관이 환경부장관과 협의하여 관리ㆍ운용한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n기금 관리·운용 경비는 기금 사용용도에 포함된다.\n\n오답 확인\n협의 상대방은 해양수산부장관이다. 기금계정은 한국은행에 설치한다. 행안부·환경부·금융원 계정이라는 문구가 틀렸다.\n\n근거·학습주제\n농어업재해보험법 제23조~제25조","explanationSections":[{"label":"정답 근거","text":"기금 관리·운용 경비는 기금 사용용도에 포함된다.","kind":"reason"},{"label":"오답 확인","text":"협의 상대방은 해양수산부장관이다. 기금계정은 한국은행에 설치한다. 행안부·환경부·금융원 계정이라는 문구가 틀렸다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제23조~제25조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["11-36","4-35","7-36","3-38","7-35","10-36","10-34","9-36","6-39","5-27","12-35"]},{"id":"8-37","round":8,"year":2022,"number":37,"subject":"농어업재해보험법령","topic":"청문","stem":"농어업재해보험법상 보험사업의 관리에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"농림축산식품부장관 또는 해양수산부장관은 재해보험사업을 효율적으로 추진하기 위\n하여 손해평가인력의 육성 업무를 수행한다."},{"n":"2","text":"농림축산식품부장관은 손해평가사의 업무 정지 처분을 하는 경우 청문을 하지 않아도 된다."},{"n":"3","text":"농림축산식품부장관은 손해평가사 자격시험의 실시 및 관리에 관한 업무를 「한국산업\n인력공단법」에 따른 한국산업인력공단에 위탁할 수 있다."},{"n":"4","text":"정부는 농어업인의 재해대비의식을 고양하고 재해보험의 가입을 촉진하기 위하여 교\n육ㆍ홍보 및 보험가입자에 대한 정책자금 지원, 신용보증 지원 등을 할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n손해평가사 자격취소 또는 업무정지 처분 시에는 청문을 해야 한다.\n\n오답 확인\n인력 육성, 산업인력공단에 시험 위탁, 교육·홍보·정책자금·신용보증 지원은 법정 추진수단이다.\n\n근거·학습주제\n농어업재해보험법 보험사업 관리·청문","explanationSections":[{"label":"정답 근거","text":"손해평가사 자격취소 또는 업무정지 처분 시에는 청문을 해야 한다.","kind":"reason"},{"label":"오답 확인","text":"인력 육성, 산업인력공단에 시험 위탁, 교육·홍보·정책자금·신용보증 지원은 법정 추진수단이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 보험사업 관리· 는 용탈작용으로 토양의 ( ㄱ )가 촉진되고,\n이 토양에서는 아연과 망간의 흡수율이 ( ㄴ )진다. 반면, 탄질비가 높은 유기물\n토양에서는 미생물 밀도가 높아져 부숙 시 토양 질소함량이 ( ㄷ )하게 된다.","options":[{"n":"1","text":"ㄱ: 산성화, ㄴ: 높아, ㄷ: 감소"},{"n":"2","text":"ㄱ: 염기화, ㄴ: 낮아, ㄷ: 증가"},{"n":"3","text":"ㄱ: 염기화, ㄴ: 높아, ㄷ: 감소"},{"n":"4","text":"ㄱ: 산성화, ㄴ: 낮아, ㄷ: 증가"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n많은 물은 염기 용탈로 산성화를 촉진한다. 산성에서는 Zn·Mn 용해도와 흡수가 높아질 수 있으며 높은 C/N 유기물 분해는 미생물의 질소 고정화로 가용질소를 감소시킨다.\n\n오답 확인\n염기화·흡수율 감소·질소 증가로 연결한 조합은 해당 토양반응의 방향과 다르다.\n\n근거·학습주제\n재배학 토양반응·질소기아","explanationSections":[{"label":"정답 근거","text":"많은 물은 염기 용탈로 산성화를 촉진한다. 산성에서는 Zn·Mn 용해도와 흡수가 높아질 수 있으며 높은 C/N 유기물 분해는 미생물의 질소 고정화로 가용질소를 감소시킨다.","kind":"reason"},{"label":"오답 확인","text":"염기화·흡수율 감소·질소 증가로 연결한 조합은 해당 토양반응의 방향과 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 토양반응·질소기아","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":25,"similarIds":[]},{"id":"8-54","round":8,"year":2022,"number":54,"subject":"재배학·원예작물학","topic":"수분스트레스 완화","stem":"토양수분 스트레스를 줄이기 위한 재배방법으로 옳지 않은 것은?","options":[{"n":"1","text":"요수량이 낮은 품종을 재배한다."},{"n":"2","text":"칼륨결핍이 발생하지 않도록 재배한다."},{"n":"3","text":"질소과용이 발생하지 않도록 한다."},{"n":"4","text":"밭재배 시 재식밀도를 높여 준다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n밀식을 하면 개체 간 수분경쟁과 군락 증산이 증가하므로 가뭄 완화법으로 부적절하다.\n\n오답 확인\n요수량이 낮은 품종, 적절한 칼륨 영양, 질소 과용 방지는 수분 이용과 내건성에 도움이 된다.\n\n근거·학습주제\n재배학 한해","explanationSections":[{"label":"정답 근거","text":"밀식을 하면 개체 간 수분경쟁과 군락 증산이 증가하므로 가뭄 완화법으로 부적절하다.","kind":"reason"},{"label":"오답 확인","text":"요수량이 낮은 품종, 적절한 칼륨 영양, 질소 과용 방지는 수분 이용과 내건성에 도움이 된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 한해","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":[]},{"id":"8-55","round":8,"year":2022,"number":55,"subject":"재배학·원예작물학","topic":"내건성 특징","stem":"내건성 작물의 생육특성을 모두 고른 것은?\nㄱ. 기공 크기의 증가\nㄴ. 지상부보다 근권부 발달\nㄷ. 낮은 호흡에 따른 저장물질의 소실 감소","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, 은 수꽃 형성 촉진에 이용되는 조건이다. 품종 차이는 있으나 문항의 기본 경향을 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 오이 성발현","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"8-70","round":8,"year":2022,"number":70,"subject":"재배학·원예작물학","topic":"천연물의 화학적 방제","stem":"다음의 해충 방제법은?\n친환경농산물을 생산하는 농가가 최근 엽채류에 해충이 발생하여 제충국에서\n살충성분(‘피레트린’)을 추출 및 살포하여 진딧물 해충을 방제하였다.","options":[{"n":"1","text":"화학적 방제법"},{"n":"2","text":"물리적 방제법"},{"n":"3","text":"페로몬 방제법"},{"n":"4","text":"생물적 방제법"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n식물에서 추출한 피레트린을 살포하여 해충을 죽이는 방식은 화학물질의 작용을 이용하는 화학적 방제다.\n\n오답 확인\n천연 유래라고 생물적 방제로 분류하지 않는다. 천적 이용, 물리적 포획·가열, 페로몬 행동조절과 구별한다.\n\n근거·학습주제\n재배학 방제법 분류","explanationSections":[{"label":"정답 근거","text":"식물에서 추출한 피레트린을 살포하여 해충을 죽이는 방식은 화학물질의 작용을 이용하는 화학적 방제다.","kind":"reason"},{"label":"오답 확인","text":"천연 유래라고 생물적 방제로 분류하지 않는다. 천적 이용, 물리적 포획·가열, 페로몬 행동조절과 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 방제법 분류","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"8-71","round":8,"year":2022,"number":71,"subject":"재배학·원예작물학","topic":"진균성 과수병","stem":"다음이 설명하는 과수의 병은?\n○ 기공이나 상처 및 표피를 뚫고 작물 내 침입\n○ 일정 기간 또는 일생을 기생하면서 병 유발\n○ 시들음, 부패 등의 병징 발견","options":[{"n":"1","text":"포도 근두암종병"},{"n":"2","text":"사과 탄저병"},{"n":"3","text":"감귤 궤양병"},{"n":"4","text":"대추나무 빗자루병"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n기공·상처 또는 표피를 통한 침입과 기생에 따른 부패 설명에 해당하는 보기의 진균성 병은 사과 탄저병이다.\n\n오답 확인\n근두암종병·감귤 궤양병은 세균, 대추나무 빗자루병은 파이토플라스마와 관련된다.\n\n근거·학습주제\n과수학 병원체","explanationSections":[{"label":"정답 근거","text":"기공·상처 또는 표피를 통한 침입과 기생에 따른 부패 설명에 해당하는 보기의 진균성 병은 사과 탄저병이다.","kind":"reason"},{"label":"오답 확인","text":"근두암종병·감귤 궤양병은 세균, 대추나무 빗자루병은 파이토플라스마와 관련된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수학 병원체","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"8-72","round":8,"year":2022,"number":72,"subject":"재배학·원예작물학","topic":"꽃가루관과 온도","stem":"과수의 결실에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"타가수분을 위해 수분수는 20% 내외로 혼식한다."},{"n":"2","text":"탄질비(C/N ratio)가 높을수록 결실률이 높아진다."},{"n":"3","text":"꽃가루관의 신장은 저온조건에서 빨라지므로 착과율이 높아진다."},{"n":"4","text":"엽과비(leaf/fruit ratio)가 높을수록 과실의 크기가 커진다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n지나치게 낮은 온도는 꽃가루 발아·꽃가루관 신장을 늦춰 수정을 방해한다. 저온에서 빨라진다는 ③이 틀렸다.\n\n오답 확인\n수분수 혼식, 적절한 C/N 균형, 엽과비 확보는 결실과 과실생장에 중요하다. 수분수 비율·C/N 효과는 품종·수세별 조건을 전제한다.\n\n근거·학습주제\n과수학 수분·수정","explanationSections":[{"label":"정답 근거","text":"지나치게 낮은 온도는 꽃가루 발아·꽃가루관 신장을 늦춰 수정을 방해한다. 저온에서 빨라진다는 ③이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"수분수 혼식, 적절한 C/N 균형, 엽과비 확보는 결실과 과실생장에 중요하다. 수분수 비율·C/N 효과는 품종·수세별 조건을 전제한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수학 수분·수정","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"8-73","round":8,"year":2022,"number":73,"subject":"재배학·원예작물학","topic":"종자춘화형","stem":"종자춘화형에 속하는 작물은?","options":[{"n":"1","text":"양파, 당근"},{"n":"2","text":"당근, 배추"},{"n":"3","text":"양파, 무"},{"n":"4","text":"배추, 무"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n배추·무는 발아 종자 단계에서 저온감응을 받을 수 있는 종자춘화형이다.\n\n오답 확인\n양파·당근은 일정 크기 이상 생육한 뒤 저온에 감응하는 녹체춘화형으로 분류한다.\n\n근거·학습주제\n채소학 춘화형","explanationSections":[{"label":"정답 근거","text":"배추·무는 발아 종자 단계에서 저온감응을 받을 수 있는 종자춘화형이다.","kind":"reason"},{"label":"오답 확인","text":"양파·당근은 일정 크기 이상 생육한 뒤 저온에 감응하는 녹체춘화형으로 분류한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 춘화형","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"8-74","round":8,"year":2022,"number":74,"subject":"재배학·원예작물학","topic":"무적 필름","stem":"A농가가 선택한 피복재는?\nA농가는 재배시설의 피복재에 물방울이 맺혀 광투과율의 저하와 병해 발생이\n증가하였다. 그래서 계면활성제가 처리된 필름을 선택하여 필름의 표면장력을\n낮춤으로써 물방울의 맺힘 문제를 해결하였다.","options":[{"n":"1","text":"광파장변환 필름"},{"n":"2","text":"폴리에틸렌 필름"},{"n":"3","text":"해충기피 필름"},{"n":"4","text":"무적 필름"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계면활성제로 물이 방울을 이루지 않고 막처럼 흘러내리도록 한 것이 무적 필름이다.\n\n오답 확인\n광파장변환·해충기피는 다른 기능이다. PE라는 재질명 자체가 무적처리의 존재를 뜻하지 않는다.\n\n근거·학습주제\n시설원예 피복재","explanationSections":[{"label":"정답 근거","text":"계면활성제로 물이 방울을 이루지 않고 막처럼 흘러내리도록 한 것이 무적 필름이다.","kind":"reason"},{"label":"오답 확인","text":"광파장변환·해충기피는 다른 기능이다. PE라는 재질명 자체가 무적처리의 존재를 뜻하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 피복재","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"8-75","round":8,"year":2022,"number":75,"subject":"재배학·원예작물학","topic":"고설 재배","stem":"다음이 설명하는 재배법은?\n○ 양액재배 베드를 허리높이까지 설치\n○ 딸기 ‘설향’ 재배에 널리 활용\n○ 재배 농가의 노동환경 개선 및 청정재배사 관리","options":[{"n":"1","text":"고설 재배"},{"n":"2","text":"토경 재배"},{"n":"3","text":"고랭지 재배"},{"n":"4","text":"NFT 재배"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n베드를 작업하기 좋은 허리 높이로 올리는 재배는 고설 재배다.\n\n오답 확인\n토경은 토양 이용, 고랭지는 재배지역, NFT는 양액의 얇은 흐름을 이용한 수경방식이다. 높이와 양액방식은 별도 분류기준이다.\n\n근거·학습주제\n시설원예 딸기 고설재배","explanationSections":[{"label":"정답 근거","text":"베드를 작업하기 좋은 허리 높이로 올리는 재배는 고설 재배다.","kind":"reason"},{"label":"오답 확인","text":"토경은 토양 이용, 고랭지는 재배지역, NFT는 양액의 얇은 흐름을 이용한 수경방식이다. 높이와 양액방식은 별도 분류기준이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 딸기 고설재배","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"9-1","round":9,"year":2023,"number":1,"subject":"상법(보험편)","topic":"청약 승낙 전 사고","stem":"상법상 보험자가 보험계약자로부터 손해보험계약의 청약과 함께 보험료 상당액의\n전부 또는 일부를 받은 경우 이 보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 낙성계약이므로 보험자가 승낙하면 성립한다."},{"n":"2","text":"다른 약정이 없으면 보험자는 30일내에 보험계약자에 대하여 낙부의 통지를 발송하여야\n한다."},{"n":"3","text":"보험자가 상법이 정하는 낙부의 통지기간내에 그 통지를 해태한 때에는 승낙한 것으로\n본다."},{"n":"4","text":"승낙하기 전에 발생한 보험사고에 대해서 청약을 거절할 사유가 있더라도 보험자는\n보험계약상의 책임을 진다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n승낙 전 사고라도 보험자가 책임지는 잠정적 보호에는 청약을 거절할 사유가 없는 경우라는 요건이 있다. 거절사유가 있어도 책임진다는 ④가 틀렸다.\n\n오답 확인\n낙성계약의 성립, 30일 내 낙부통지, 기간 내 통지 해태시 승낙간주는 맞다.\n\n근거·학습주제\n상법 제638조의2","explanationSections":[{"label":"정답 근거","text":"승낙 전 사고라도 보험자가 책임지는 잠정적 보호에는 청약을 거절할 사유가 없는 경우라는 요건이 있다. 거절사유가 있어도 책임진다는 ④가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"낙성계약의 성립, 30일 내 낙부통지, 기간 내 통지 해태시 승낙간주는 맞다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의2","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["3-2","5-11","6-11","8-1","10-2","2-8"]},{"id":"9-2","round":9,"year":2023,"number":2,"subject":"상법(보험편)","topic":"타인을 위한 보험","stem":"상법상 타인을 위한 보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 보험자에 대하여 보험료를 지급할 의무가 있다."},{"n":"2","text":"보험계약자는 위임을 받지 아니하고 타인을 위하여 보험계약을 체결할 수 있다."},{"n":"3","text":"타인은 계약 성립 시 특정되어야 한다."},{"n":"4","text":"보험계약자가 파산선고를 받은 때에는 그 타인이 그 권리를 포기하지 아니하는 한 그\n타인도 보험료를 지급할 의무가 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n불특정 타인을 위한 보험도 가능하므로 성립시에 타인이 반드시 특정되어야 한다는 ③은 틀렸다.\n\n오답 확인\n위임 없는 계약도 가능하다. 계약자가 원칙적 보험료 지급의무를 지고 지급지체·파산시 타인의 보충적 의무가 발생할 수 있다.\n\n근거·학습주제\n상법 제639조","explanationSections":[{"label":"정답 근거","text":"불특정 타인을 위한 보험도 가능하므로 성립시에 타인이 반드시 특정되어야 한다는 ③은 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"위임 없는 계약도 가능하다. 계약자가 원칙적 보험료 지급의무를 지고 지급지체·파산시 타인의 보충적 의무가 발생할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["11-2","7-2","6-12","5-3","3-4","2-17","12-3"]},{"id":"9-3","round":9,"year":2023,"number":3,"subject":"상법(보험편)","topic":"보험증권 변경","stem":"상법상 보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"기존의 보험계약을 변경한 경우 보험자는 그 보험증권에 그 사실을 기재함으로써\n보험증권의 교부에 갈음할 수 있다."},{"n":"2","text":"보험자는 보험계약자의 청약이 있는 경우 보험료의 지급 여부와 상관없이 지체없이\n보험증권을 작성하여 보험계약자에게 교부하여야 한다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날부터 14일내에 한하여 그 증권내용의\n정부(正否)에 관한 이의를 할 수 있음을 약정할 수 있다."},{"n":"4","text":"보험계약자가 보험증권을 멸실한 경우 보험계약자는 보험자에게 증권의 재교부를\n청구할 수 있으며, 그 증권작성의 비용은 보험자의 부담으로 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n기존 계약을 변경하면 보험증권에 변경사실을 기재하여 새 증권 교부를 대신할 수 있다.\n\n오답 확인\n② 청약만으로 성립한 것은 아니며 최초보험료 미지급 예외도 있다. ③ 이의기간 특약은 1개월 이상이어야 한다. ④ 재교부 비용은 계약자 부담이다.\n\n근거·학습주제\n상법 제640조~제642조","explanationSections":[{"label":"정답 근거","text":"기존 계약을 변경하면 보험증권에 변경사실을 기재하여 새 증권 교부를 대신할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"② 청약만으로 성립한 것은 아니며 최초보험료 미지급 예외도 있다. ③ 이의기간 특약은 1개월 이상이어야 한다. ④ 재교부 비용은 계약자 부담이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조~제642조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["11-3","2-2","12-1","5-4","8-3","4-3","10-3","6-13","7-3","10-2"]},{"id":"9-4","round":9,"year":2023,"number":4,"subject":"상법(보험편)","topic":"객관적 확정의 예외","stem":"상법상 보험사고 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 그 계약전의 어느 시기를 보험기간의 시기(始期)로 할 수 있다."},{"n":"2","text":"보험계약 당시에 보험사고가 발생할 수 없음이 객관적으로 확정된 경우 당사자 쌍방과\n피보험자가 이를 알았는지 여부에 관계없이 그 계약은 무효로 한다."},{"n":"3","text":"자기를 위한 보험계약에서 보험사고가 발생하기 전에는 언제든지 보험계약자는 계약의\n전부 또는 일부를 해지할 수 있다."},{"n":"4","text":"피보험자는 보험사고의 발생을 안 때에는 지체없이 보험자에게 그 통지를 발송하여야\n한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n사고 발생불능이 확정되었더라도 당사자 쌍방과 피보험자 모두 몰랐다면 유효할 수 있다. 인식 여부와 무관하게 무효라는 ②가 틀렸다.\n\n오답 확인\n소급보험, 자기를 위한 보험의 사고 전 임의해지, 사고인지 후 지체 없는 통지는 인정된다.\n\n근거·학습주제\n상법 제643조·제644조·제649조·제657조","explanationSections":[{"label":"정답 근거","text":"사고 발생불능이 확정되었더라도 당사자 쌍방과 피보험자 모두 몰랐다면 유효할 수 있다. 인식 여부와 무관하게 무효라는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"소급보험, 자기를 위한 보험의 사고 전 임의해지, 사고인지 후 지체 없는 통지는 인정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제643조·제644조·제649조·제657조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["11-4","4-4","10-7","12-3","5-5","6-16","6-14","3-7","7-5","11-11","3-5","2-4","10-10","12-6","9-16","5-7"]},{"id":"9-5","round":9,"year":2023,"number":5,"subject":"상법(보험편)","topic":"보험중개자 수령권","stem":"甲은 보험대리상이 아니면서 특정한 보험자 乙을 위하여 계속적으로 보험계약의\n체결을 중개하는 자로서 丙이 乙과 보험계약을 체결하도록 중개하였다. 甲의 권한\n에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"甲은 자신이 작성한 영수증을 丙에게 교부하는 경우 丙으로부터 보험료를 수령할\n권한이 있다."},{"n":"2","text":"甲은 乙이 작성한 보험증권을 丙에게 교부할 수 있는 권한이 있다."},{"n":"3","text":"甲은 丙으로부터 청약, 고지, 통지, 해지, 취소 등 보험계약에 관한 의사표시를 수령할\n수 있는 권한이 없다."},{"n":"4","text":"甲은 丙에게 보험계약의 체결, 변경, 해지 등 보험계약에 관한 의사표시를 할 수 있는\n권한이 없다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n중개자는 보험자가 작성한 영수증을 교부하는 경우에 한하여 보험료 수령의 법정 권한을 가진다. 스스로 작성한 영수증은 해당하지 않는다.\n\n오답 확인\n보험자 작성 증권 교부권은 인정되지만 계약상 의사표시를 수령하거나 체결·변경·해지 의사표시를 할 권한은 원칙적으로 없다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"중개자는 보험자가 작성한 영수증을 교부하는 경우에 한하여 보험료 수령의 법정 권한을 가진다. 스스로 작성한 영수증은 해당하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"보험자 작성 증권 교부권은 인정되지만 계약상 의사표시를 수령하거나 체결·변경·해지 의사표시를 할 권한은 원칙적으로 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["2-3","6-15","4-5","11-5","5-6","2-21","10-4","12-4","8-5","7-4","12-5","8-6"]},{"id":"9-6","round":9,"year":2023,"number":6,"subject":"상법(보험편)","topic":"특정 타인 보험료 최고","stem":"상법상 보험료의 지급 및 반환 등에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험사고가 발생하기 전에 보험계약자가 계약을 해지한 경우 당사자간에 약정을 한\n경우에 한해 보험계약자는 미경과보험료의 반환을 청구할 수 있다."},{"n":"2","text":"보험계약자가 계약체결후 제1회 보험료를 지급하지 아니하는 경우 다른 약정이 없는\n한 보험자가 계약성립후 2월이내에 그 계약을 해제하지 않으면 그 계약은 존속한다."},{"n":"3","text":"계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 보험계약자에 대하여\n최고 없이 그 계약을 해지할 수 있다."},{"n":"4","text":"특정한 타인을 위한 보험의 경우에 보험계약자가 보험료의 지급을 지체한 때에는\n보험자는 그 타인에게 상당한 기간을 정하여 보험료의 지급을 최고한 후가 아니면\n그 계약을 해제 또는 해지하지 못한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계약자 지체시 특정 타인에게도 상당 기간을 정하여 보험료 지급을 최고한 뒤에야 해제·해지가 가능하다.\n\n오답 확인\n미경과보험료 반환은 다른 약정 없는 경우의 원칙이다. 최초보험료 미납 2개월 후 해제간주, 계속보험료 미납시 최고가 필요하다.\n\n근거·학습주제\n상법 제649조·제650조","explanationSections":[{"label":"정답 근거","text":"계약자 지체시 특정 타인에게도 상당 기간을 정하  수 있다."},{"n":"2","text":"보험수익자는 보험사고의 발생을 안 때에는 지체없이 보험계약자에게 그 통지를 발송\n하여야 한다."},{"n":"3","text":"보험계약자가 사고발생의 통지의무를 해태함으로 인하여 손해가 증가된 때에는 보험자는\n그 증가된 손해를 보상할 책임이 없다."},{"n":"4","text":"보험자의 파산선고에도 불구하고 보험계약자가 해지하지 아니한 보험계약은 파산선고\n후 3월을 경과한 때에는 그 효력을 잃는다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n사고발생 통지는 보험자에게 해야 한다. 보험계약자에게 발송한다는 ②는 상대방이 틀렸다.\n\n오답 확인\n통지 해태로 늘어난 손해는 면책된다. 보험자 파산시 해지권과 파산선고 후 3개월의 실효는 별도 규정이다.\n\n근거·학습주제\n상법 제654조·제657조","explanationSections":[{"label":"정답 근거","text":"사고발생 통지는 보험자에게 해야 한다. 보험계약자에게 발송한다는 ②는 상대방이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"통지 해태로 늘어난 손해는 면책된다. 보험자 파산시 해지권과 파산선고 후 3개월의 실효는 별도 규정이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제654조·제657조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["11-11","8-11","7-12","6-2","5-9","12-6","4-11","10-10","10-11","2-18","12-9","3-7","4-10","10-7","9-4","2-14","8-12","6-16"]},{"id":"9-17","round":9,"year":2023,"number":17,"subject":"상법(보험편)","topic":"피보험이익","stem":"상법상 손해보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자는 보험사고로 인하여 생길 보험수익자의 재산상의 손해를 보상할 책임이 있다."},{"n":"2","text":"보험사고로 인하여 상실된 피보험자가 얻을 이익이나 보수는 보험자가 보상할 손해액에\n산입한다."},{"n":"3","text":"대리인에 의하여 손해보험계약을 체결한 경우에 대리인이 안 사유는 그 본인이 안 것과\n동일한 것으로 할 수 없다."},{"n":"4","text":"보험계약은 금전으로 산정할 수 있는 이익에 한하여 보험계약의 목적으로 할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n손해보험계약은 금전으로 산정할 수 있는 이익에 한하여 목적으로 할 수 있다.\n\n오답 확인\n손해보상 대상자는 피보험자이며 상실이익·보수는 원칙적으로 제외된다. 대리인이 안 사유는 본인의 인식과 동일하게 취급한다.\n\n근거·학습주제\n상법 제646조·제665조·제667조·제668조","explanationSections":[{"label":"정답 근거","text":"손해보험계약은 금전으로 산정할 수 있는 이익에 한하여 목적으로 할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"손해보상 대상자는 피보험자이며 상실이익·보수는 원칙적으로 제외된다. 대리인이 안 사유는 본인의 인식과 동일하게 취급한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조·제665조·제667조·제668조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["2-24","8-15","7-13","10-19","5-13","6-22","4-4","5-5","11-24","1-14","2-12","8-5","10-18","7-20"]},{"id":"9-18","round":9,"year":2023,"number":18,"subject":"상법(보험편)","topic":"사기 중복보험","stem":"상법상 손해보험에서 중복보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"중복보험은 동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이 동시에\n또는 순차로 체결되는 방식으로 성립할 수 있다."},{"n":"2","text":"중복보험에서 그 보험금액의 총액이 보험가액을 초과한 때에는 보험자는 각자의 보험\n금액의 한도에서 연대책임을 지며 이 경우 각 보험자의 보상책임은 각자의 보험금액의\n비율에 따른다."},{"n":"3","text":"보험계약자의 사기로 인하여 중복보험 계약이 체결된 경우 보험자는 그 사실을 안 때\n까지의 보험료를 청구할 수 없다."},{"n":"4","text":"보험자 1인에 대한 권리의 포기는 다른 보험자의 권리의무에 영향을 미치지 아니한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n사기로 체결된 중복보험은 무효지만 보험자는 사기를 안 때까지의 보험료를 청구할 수 있다. 청구할 수 없다는 ③이 틀렸다.\n\n오답 확인\n동시·순차 체결 모두 가능하다. 보험금액 한도의 연대책임과 내부 비례분담, 한 보험자 권리포기의 상대적 효력을 구별한다.\n\n근거·학습주제\n상법 제669조·제672조·제673조","explanationSections":[{"label":"정답 근거","text":"사기로 체결된 중복보험은 무효지만 보험자는 사기를 안 때까지의 보험료를 청구할 수 있다. 청구할 수 없다는 ③이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"동시·순차 체결 모두 가능하다. 보험금액 한도의 연대책임과 내부 비례분담, 한 보험자 권리포기의 상대적 효력을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조·제672조·제673조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["4-19","5-18","7-17","3-19","1-17","2-11","8-18","6-20","6-22","11-15","10-16","8-16"]},{"id":"9-19","round":9,"year":2023,"number":19,"subject":"상법(보험편)","topic":"일부보험 특약","stem":"상법상 손해보험에서 일부보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"일부보험이란 보험가액이 보험금액에 미달되는 경우를 말한다."},{"n":"2","text":"당사자간에 다른 약정이 없는한 보험자는 보험가액의 보험금액에 대한 비율에 따라\n보상할 책임을 진다."},{"n":"3","text":"보험자는 보험금액의 한도내에서 그 손해를 전부 보상할 책임을 지는 내용의 약정을\n할 수 있다."},{"n":"4","text":"전부보험계약 체결후 물가등귀로 인하여 보험가액이 현저히 인상되더라도 일부보험은\n발생하지 아니한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일부보험도 당사자가 보험금액 한도에서 손해 전부를 보상하는 제1위험 방식으로 약정할 수 있다.\n\n오답 확인\n보험금액이 보험가액보다 작아야 일부보험이다. 기본 비례는 보험금액/보험가액이다. 물가 상승으로 사후 일부보험이 생길 수도 있다.\n\n근거·학습주제\n상법 제674조","explanationSections":[{"label":"정답 근거","text":"일부보험도 당사자가 보험금액 한도에서 손해 전부를 보상하는 제1위험 방식으로 약정할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"보험금액이 보험가액보다 작아야 일부보험이다. 기본 비례는 보험금액/보험가액이다. 물가 상승으로 사후 일부보험이 생길 수도 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제674조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["6-3","3-23","11-18","4-20","2-11","1-24","12-18"]},{"id":"9-20","round":9,"year":2023,"number":20,"subject":"상법(보험편)","topic":"손해 산정 장소","stem":"상법상 손해보험에서 손해액의 산정기준 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액의 산정에 관한 비용은 보험자의 부담으로 한다."},{"n":"2","text":"당사자간에 다른 약정이 없는 경우 보험자가 보상할 손해액은 그 손해가 발생한 때의\n보험계약 체결지의 가액에 의하여 산정한다."},{"n":"3","text":"당사자간의 약정에 의하여 보험의 목적의 신품가액에 의하여 손해액을 산정할 수 있다."},{"n":"4","text":"보험의 목적의 성질, 하자 또는 자연소모로 인한 손해는 보험자가 이를 보상할 책임이\n없다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n원칙적으로 손해가 발생한 때와 곳의 가액을 기준으로 한다. 계약체결지 가액이라는 ②가 틀렸다.\n\n오답 확인\n산정비용은 보험자 부담이고 신품가액 특약은 가능하다. 목적의 성질·하자·자연소모는 법정 면책사유다.\n\n근거·학습주제\n상법 제676조·제678조","explanationSections":[{"label":"정답 근거","text":"원칙적으로 손해가 발생한 때와 곳의 가액을 기준으로 한다. 계약체결지 가액이라는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"산정비용은 보험자 부담이고 신품가액 특약은 가능하다. 목적의 성질·하자·자연소모는 법정 면책사유다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조·제678조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["10-19","12-19","3-25","5-20","8-21","1-19","4-21","6-4","2-22","7-20","12-18","8-15","10-18"]},{"id":"9-21","round":9,"year":2023,"number":21,"subject":"상법(보험편)","topic":"미지급 보험료 공제","stem":"甲이 자기 소유 건물에 대하여 A보험회사와 화재보험을 체결한 경우에 관한 설명으로\n옳지 않은 것은?","options":[{"n":"1","text":"A보험회사가 甲으로부터 보험료의 지급을 받지 아니한 잔액이 있더라도 그 지급기일이\n아직 도래하지 아니한 때에는, A보험회사는 甲에게 손해를 보상할 경우에 보상할 금액\n에서 그 잔액을 공제하여서는 아니된다."},{"n":"2","text":"A보험회사는 보험사고로 인하여 부담할 책임에 대하여 다른 보험자와 재보험계약을\n체결할 수 있다."},{"n":"3","text":"甲이 보험의 목적인 건물을 乙에게 양도한 때에는 乙은 보험계약상의 권리와 의무를\n승계한 것으로 추정한다."},{"n":"4","text":"甲이 보험의 목적인 건물을 乙에게 양도한 경우 甲 또는 乙은 A보험회사에 대하여\n지체없이 그 사실을 통지하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n손해보상시 지급기일이 아직 오지 않은 미지급 보험료도 보상액에서 공제할 수 있다.\n\n오답 확인\n재보험 체결 가능, 목적물 양수인의 권리의무 승계 추정, 양도사실의 지체 없는 통지는 맞다.\n\n근거·학습주제\n상법 제661조·제677조·제679조","explanationSections":[{"label":"정답 근거","text":"손해보상시 지급기일이 아직 오지 않은 미지급 보험료도 보상액에서 공제할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"재보험 체결 가능, 목적물 양수인의 권리의무 승계 추정, 양도사실의 지체 없는 통지는 맞다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제661조·제677조·제679조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["10-12","10-6"]},{"id":"9-22","round":9,"year":2023,"number":22,"subject":"상법(보험편)","topic":"손해방지비용 계산","stem":"다음 사례와 관련하여 손해방지의무 등에 관한 설명으로 옳지 않은 것은?\n甲은 乙이 소유한 창고(시가 1억원)에 대하여 A보험회사와 화재보험계약(보험\n금액 1억원)을 체결하였다. 이후 보험기간 중 해당 창고에 화재가 발생하였는데\n화재사고 당시 甲은 창고의 연소로 인한 손해방지를 위한 비용을 1천만원 지출\n하였고, 乙은 창고의 연소로 인한 손해의 경감을 위하여 비용을 3천만원 지출\n하였다.","options":[{"n":"1","text":"甲과 乙 모두 손해의 방지와 경감을 위하여 노력하여야 한다."},{"n":"2","text":"甲이 지출한 1천만원이 손해방지를 위하여 필요하였던 비용일 경우 A보험회사는 甲이\n지출한 1천만원의 비용을 부담한다."},{"n":"3","text":"乙이 지출한 3천만원이 손해경감을 위하여 유익하였던 비용일 경우 A보험회사는 乙이\n지출한 3천만원의 비용을 부담한다."},{"n":"4","text":"위 사고로 인하여 乙에 대한 보상액이 8천만원으로 책정될 경우 A보험회사는 甲 및\n乙이 지출한 비용과 보상액을 합쳐서 1억원의 한도에서 부담한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n필요·유익한 비용은 보험금액을 넘더라도 보험자가 부담한다. 8천만원+1천만원+3천만원=1억2천만원도 1억원으로 제한하지 않는다.\n\n오답 확인\n계약자 갑과 피보험자 을 모두 손해방지·경감 의무자다. 각 지출액은 필요성·유익성을 충족해야 한다.\n\n근거·학습주제\n상법 제680조","explanationSections":[{"label":"정답 근거","text":"필요·유익한 비용은 보험금액을 넘더라도 보험자가 부담한다. 8천만원+1천만원+3천만원=1억2천만원도 1억원으로 제한하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"계약자 갑과 피보험자 을 모두 손해방지·경감 의무자다. 각 지출액은 필요성·유익성을 충족해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제680조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":[]},{"id":"9-23","round":9,"year":2023,"number":23,"subject":"상법(보험편)","topic":"제3자 대위와 가족","stem":"다음 사례와 관련하여 보험자대위에 관한 설명으로 옳은 것은?\n보리 농사를 대규모로 영위하는 甲은 금년에 수확하여 팔고남은 보리를 자신의\n창고에 보관하면서, 해당 보리 재고를 보험목적으로 하고 자신을 피보험자로\n하는 화재보험계약을 A보험회사와 체결하였다. 그런데 甲의 창고를 방문한 乙\n이 화재를 일으켰고 그 결과 위 보리 재고가 전소되었다. 이에 A보험회사는 甲\n에게 보험금을 전액 지급하였다.","options":[{"n":"1","text":"중과실로 화재를 일으킨 乙이 甲의 이웃집 친구일 경우, A보험회사는 乙에게 보험금\n지급사실의 통지를 발송하는 시점에 乙에 대한 甲의 권리를 취득한다."},{"n":"2","text":"경과실로 화재를 일으킨 乙이 甲의 거래처 지인일 경우, A보험회사는 그 지급한 금액의\n한도에서 乙에 대한 甲의 권리를 취득한다."},{"n":"3","text":"중과실로 화재를 일으킨 乙이 甲과 생계를 달리 하는 자녀일 경우, A보험회사는 乙에\n대한 甲의 권리를 취득하지 못한다."},{"n":"4","text":"고의로 방화한 乙이 甲과 생계를 같이 하는 배우자일 경우, A보험회사는 乙에 대한\n甲의 권리를 취득하지 못한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n경과실의 거래처 지인은 제3자로서 보험금 지급액 한도에서 대위가 가능하다.\n\n오답 확인\n권리취득은 통지시가 아니라 지급시다. 가족 예외는 생계를 같이하는 가족이며 생계를 달리하는 자녀는 다르다. 생계공동 배우자라도 고의면 대위가 가능하다.\n\n근거·학습주제\n상법 제682조","explanationSections":[{"label":"정답 근거","text":"경과실의 거래처 지인은 제3자로서 보험금 지급액 한도에서 대위가 가능하다.","kind":"reason"},{"label":"오답 확인","text":"권리취득은 통지시가 아니라 지급시다. 가족 예외는 생계를 같이하는 가족이며 생계를 달리하는 자녀는 다르다. 생계공동 배우자라도 고의면 대위가 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제682조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":[]},{"id":"9-24","round":9,"year":2023,"number":24,"subject":"상법(보험편)","topic":"소유자와 담보권자 이익","stem":"상법상 화재보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 화재와 상당인과관계에 있는 손해를 보상하여야 한다."},{"n":"2","text":"보험자는 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해를 보상할\n책임이 있다."},{"n":"3","text":"동일한 건물에 관한 화재보험계약일 경우 그 소유자와 담보권자가 갖는 피보험이익은\n같다."},{"n":"4","text":"연소 작용이 아닌 열의 작용으로 발생한 손해는 보험자가 보상하지 아니한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n같은 건물이라도 소유이익과 담보권자의 담보이익은 서로 다른 피보험이익이다.\n\n오답 확인\n화재와 상당인과관계 있는 손해·소방손해는 보상한다. 연소를 수반하지 않는 단순 열손해를 화재와 동일하게 보지 않는다.\n\n근거·학습주제\n상법 제683조·제684조·피보험이익","explanationSections":[{"label":"정답 근거","text":"같은 건물이라도 소유이익과 담보권자의 담보이익은 서로 다른 피보험이익이다.","kind":"reason"},{"label":"오답 확인","text":"화재와 상당인과관계 있는 손해·소방손해는 보상한다. 연소를 수반하지 않는 단순 열손해를 화재와 동일하게 보지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제683조·제684조·피보험이익","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["3-16","12-23","1-25","6-8","2-25","4-22","8-15"]},{"id":"9-25","round":9,"year":2023,"number":25,"subject":"상법(보험편)","topic":"집합보험","stem":"상법상 집합된 물건을 일괄하여 화재보험의 목적으로 한 경우 해당 화재보험에\n관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집합된 물건에 피보험자의 가족의 물건이 있는 경우 해당 물건도 보험의 목\n적에 포함된 것으로 한다.\nㄴ. 집합된 물건에 피보험자의 사용인의 물건이 있는 경우 그 보험은 그 사용인\n을 위하여서도 체결한 것으로 본다.\nㄷ. 보험의 목적에 속한 물건이 보험기간중에 수시로 교체된 경우 보험계약의\n체결 시에 현존한 물건은 그 보험의 목적에 포함된 것으로 한다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n가족·사용인 물건도 집합보험 목적에 포함되고 해당자를 위한 보험으로 본다. ㄱ·ㄴ이 맞다.\n\n오답 확인\nㄷ은 계약체결시가 아니라 보험사고 발생시에 현존한 물건을 기준으로 해야 한다.\n\n근거·학습주제\n상법 제686조·제687조","explanationSections":[{"label":"정답 근거","text":"가족·사용인 물건도 집합보험 목적에 포함되고 해당자를 위한 보험으로 본다. ㄱ·ㄴ이 맞다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ은 계약체결시가 아니라 보험사고 발생시에 현존한 물건을 기준으로 해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제686조·제687조","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["10-25","12-25","3-18","11-23","7-25","4-25","6-10","5-13","2-17"]},{"id":"9-26","round":9,"year":2023,"number":26,"subject":"농어업재해보험법령","topic":"보험금·보험료","stem":"농어업재해보험법상 용어의 정의로 옳지 않은 것은?","options":[{"n":"1","text":"“농업재해”란 농작물ㆍ임산물ㆍ가축 및 농업용 시설물에 발생하는 자연재해ㆍ병충해\nㆍ조수해(鳥獸害)ㆍ질병 또는 화재를 말한다."},{"n":"2","text":"“농어업재해보험”이란 농어업재해로 발생하는 재산 피해에 따른 손해를 보상하기 위한\n보험을 말한다."},{"n":"3","text":"“보험금”이란 보험가입자와 보험사업자 간의 약정에 따라 보험가입자가 보험사업자에게\n내야 하는 금액을 말한다."},{"n":"4","text":"“보험가입금액”이란 보험가입자의 재산 피해에 따른 손해가 발생한 경우 보험에서\n최대로 보상할 수 있는 한도액으로서 보험가입자와 보험사업자 간에 약정한 금액을\n말한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n가입자가 사업자에게 낼 돈은 보험료다. 이를 보험금이라고 한 ③이 틀렸다.\n\n오답 확인\n보험금은 보장사고 발생시 사업자가 가입자에게 지급하는 돈이다. 농업재해·재해보험·보험가입금액 정의는 타당하다.\n\n근거·학습주제\n농어업재해보험법 제2조","explanationSections":[{"la :"재해보험사업자가 교차손해평가를 담당할 지역손해평가인을 선발할 때 타지역 조사\n가능여부는 고려사항이다."},{"n":"4","text":"재해보험사업자는 교차손해평가가 필요한 경우 재해보험 가입규모, 가입분포 등을\n고려하여 교차손해평가 대상 시ㆍ군ㆍ구를 선정하여야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n당시 규정은 선발된 지역손해평가인 1명 이상을 포함하는 기준이다. 2명 이상 의무라는 ②가 틀렸다.\n\n오답 확인\n긴급·인력부족시 예외, 타지역 조사 가능여부 고려, 가입규모·분포에 따른 지역 선정은 인정된다.\n\n근거·학습주제\n농업재해보험 손해평가요령 교차손해평가","explanationSections":[{"label":"정답 근거","text":"당시 규정은 선발된 지역손해평가인 1명 이상을 포함하는 기준이다. 2명 이상 의무라는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"긴급·인력부족시 예외, 타지역 조사 가능여부 고려, 가입규모·분포에 따른 지역 선정은 인정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 교차손해평가","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":21,"similarIds":["4-44","11-43","12-50","10-43","7-43","10-42","6-44","9-38","8-43","11-38","5-34","10-40","9-39","8-44"]},{"id":"9-44","round":9,"year":2023,"number":44,"subject":"농어업재해보험법령","topic":"검증거부 절차","stem":"농업재해보험 손해평가요령상 손해평가결과 검증에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"농림축산식품부장관은 재해보험사업자로 하여금 검증조사를 하게 할 수 있으며, 재해\n보험사업자는 특별한 사유가 없는 한 이에 응하여야 한다."},{"n":"2","text":"보험가입자가 정당한 사유없이 검증조사를 거부하는 경우 검증조사반은 검증조사가\n불가능하여 손해평가 결과를 확인할 수 없다는 사실을 지체없이 농림축산식품부장관\n에게 보고하여야 한다."},{"n":"3","text":"검증조사결과 현저한 차이가 발생되어 재조사가 불가피하다고 판단될 경우에는 해당\n손해평가반이 조사한 전체 보험목적물에 대하여 재조사를 할 수 있다."},{"n":"4","text":"재해보험사업자 및 재해보험사업의 재보험사업자는 손해평가반이 실시한 손해평가\n결과를 확인하기 위하여 손해평가를 실시한 보험목적물 중에서 일정수를 임의 추\n출하여 검증조사를 할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n정당한 이유 없는 거부시 가입자에게 확인불가를 알리고 결과를 작성하여 사업자에게 제출한다. 장관에게 즉시 보고한다는 ②가 틀렸다.\n\n오답 확인\n장관 검증요구, 현저한 차이에 따른 전체 재조사 가능, 일정 수 임의추출은 당시 규정에 부합한다.\n\n기준·해석 메모\n2024년 이후 검증 주체에 사업관리 위탁기관이 반영되었다. 과거 재보험사업자라는 표현과 구별한다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제11조","explanationSections":[{"label":"정답 근거","text":"정당한 이유 없는 거부시 가입자에게 확인불가를 알리고 결과를 작성하여 사업자에게 제출한다. 장관에게 즉시 보고한다는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"장관 검증요구, 현저한 차이에 따른 전체 재조사 가능, 일정 수 임의추출은 당시 규정에 부합한다.","kind":"incorrect"},{"label":"기준·해석 nSections":[{"label":"정답 근거","text":"산성화는 칼슘 등 염기의 용탈, 근류균 활성 저하, 망간 용해도 증가와 과잉장해를 일으킬 수 있다.","kind":"reason"},{"label":"오답 확인","text":"고온·질소부족·일조부족 하나로 세 증상을 함께 설명하기 어렵다. 토양 pH와 교환성 염기·망간 상태를 연계한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 산성토양","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":[]},{"id":"9-53","round":9,"year":2023,"number":53,"subject":"재배학·원예작물학","topic":"질소 영양","stem":"작물의 질소에 관한 내용이다. ( )에 들어갈 내용을 순서대로 옳게 나열한 것은?\n작물재배에서 ( )작물에 비해 ( )작물은 질소 시비량을 늘려 주는 것이 좋으\n며, 잎의 질소 결핍 증상은 ( )보다 ( )에서 먼저 나타난다.","options":[{"n":"1","text":"콩과, 벼과, 유엽, 성엽"},{"n":"2","text":"벼과, 콩과, 유엽, 성엽"},{"n":"3","text":"콩과, 벼과, 성엽, 유엽"},{"n":"4","text":"벼과, 콩과, 성엽, 유엽"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n질소고정을 하는 콩과에 비해 벼과는 질소비료 요구가 크다. 질소는 재이동하므로 결핍이 성엽에서 유엽보다 먼저 나타난다.\n\n오답 확인\n콩과·벼과 순서를 뒤집거나 유엽에서 먼저 결핍된다고 하면 틀린다.\n\n근거·학습주제\n재배학 질소·원소 이동성","explanationSections":[{"label":"정답 근거","text":"질소고정을 하는 콩과에 비해 벼과는 질소비료 요구가 크다. 질소는 재이동하므로 결핍이 성엽에서 유엽보다 먼저 나타난다.","kind":"reason"},{"label":"오답 확인","text":"콩과·벼과 순서를 뒤집거나 유엽에서 먼저 결핍된다고 하면 틀린다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 질소·원소 이동성","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":[]},{"id":"9-54","round":9,"year":2023,"number":54,"subject":"재배학·원예작물학","topic":"물의 역할","stem":"한해피해 조사를 마친 A손해평가사가 농가에 설명한 작물 내 물의 역할로 옳은\n것은 몇 개인가?\n○ 물질 합성과정의 매개\n○ 양분 흡수의 용매\n○ 세포의 팽압 유지\n○ 체내의 항상성 유지","options":[{"n":"1","text":"1개"},{"n":"2","text":"2개"},{"n":"3","text":"3개"},{"n":"4","text":"4개"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n물은 합성반응의 매개, 양분 용매, 팽압 유지, 체내 환경 항상성에 모두 관여하므로 4개다.\n\n오답 확인\n수분은 단순 구성물질에 그치지 않고 수송·형태유지·온도조절 등 여러 기능을 한다.\n\n근거·학습주제\n재배학 수분생리","explanationSections":[{"label":"정답 근거","text":"물은 합성반응의 매개, 양분 용매, 팽압 유지, 체내 환경 항상성에 모두 관여하므로 4개다.","kind":"reason"},{"label":"오답 확인","text":"수분은 단순 구성물질에 그치지 않고 수송·형태유지·온도조절 등 여러 기능을 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 수분생리","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":["5-54"]},{"id":"9-55","round":9,"year":2023,"number":55,"subject":"재배학·원예작물학","topic":"서리 피해와 송풍","stem":"과수작물의 서리피해에 관한 내용이다. 밑줄 친 부분이 옳은 것을 모두 고른 것은?\n최근 지구온난화에 따른 기상이변으로 개화기가 빠른 (ㄱ)핵과류에서 피해가 빈\n번하게 발생한다. 특히, 과수원이 (ㄴ)강이나 저수지 옆에 있을 때 발생률이 높\n다. 따라서 일부 농가에서는 상층의 더운 공기를 아래로 불어내려 과수원의 기온\n저하를 막아주는 (ㄷ)송풍법을 사용하고 있다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n공식 판정에서 ㄱ·ㄴ·ㄷ 모두 맞다. 개화가 빠른 핵과류는 꽃의 저온 민감기에 노출되며 냉기 정체 지형과 수변 입지를 살피고 송풍으로 역전층 공기를 혼합한다.\n\n오답 확인\n송풍은 복사냉각·기온역전 조건에서 효과가 있으며 모든 서리나 모든 수변에서 동일하게 작용하지 않는다. 수변 여부만으로 피해율을 단정하지 않는다.\n\n근거·학습주제\n과수학 늦서리 대책","explanationSections":[{"label":"정답 근거","text":"공식 판정에서 ㄱ·ㄴ·ㄷ 모두 맞다. 개화가 빠른 핵과류는 꽃의 저온 민감기에 노출되며 냉기 정체 지형과 수변 입지를 살피고 송풍으로 역전층 공기를 혼합한다.","kind":"reason"},{"label":"오답 확인","text":"송풍은 복사냉각·기온역전 조건에서 효과가 있으며 모든 서리나 모든 수변에서 동일하게 작용하지 않는다. 수변 여부만으로 피해율을 단정하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수학 늦서리 대책","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":[]},{"id":"9-56","round":9,"year":2023,"number":56,"subject":"재배학·원예작물학","topic":"적색광과 원적색광","stem":"작물의 생장에 영향을 주는 광질에 관한 내용이다. ( )에 들어갈 내용을 순서대로\n옳게 나열한 것은?\n가시광선 중에서 ( )은 광합성·광주기성·광발아성 종자의 발아를 주도하는\n중요한 광선이다. 근적외선은 식물의 신장을 촉진하여 적색광과 근적외선의 비가\n( ) 절간신장이 촉진되어 초장이 커진다.","options":[{"n":"1","text":"청색광, 작으면"},{"n":"2","text":"적색광, 크면"},{"n":"3","text":"적색광, 작으면"},{"n":"4","text":"청색광, 크면"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n적색광은 광합성과 피토크롬 반응에 중요하다. 적색광/원적색광 비가 작으면 음지회피 반응으로 절간신장이 촉진된다.\n\n오답 확인\n청색광도 생육에 중요하지만 문항의 광주기·광발아와 비율에 따른 신장반응은 적색광 계열을 묻는다.\n\n기준·해석 메모\n문항의 근적외선은 식물 광형태형성에서 다루는 원적색광 영역을 가리키는 표현으로 읽는다.\n\n근거·학습주제\n재배학 광질·피토크롬","explanationSections":[{"label":"정답 근거","text":"적색광은 광합성과 피토크롬 반응에 중요하다. 적색광/원적색광 비가 작으면 음지회피 반응으로 절간신장이 촉진된다.","kind":"reason"},{"label":"오답 확인","text":"청색광도 생육에 중요하지만 문항의 광주기·광발아와 비율에 따른 신장반응은 적색광 계열을 묻는다.","kind":"incorrect"},{"label":"기준·해석 메모","text":"문항의 근적외선은 식물 광형태형성에서 다루는 원적색광 영역을 가리키는 표현으로 읽는다.","kind":"note"},{"label":"근거·학습주제","text":"재배학 광질·피토크롬","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":[]},{"id":"9-57","round":9,"year":2023,"number":57,"subject":"재배학·원예작물학","topic":"생육적온","stem":"생육적온이 달라 동일 재배사에서 함께 재배할 경우 재배효율이 떨어지는 조합은?","options":[{"n":"1","text":"상추, 고추"},{"n":"2","text":"당근, 시금치"},{"n":"3","text":"가지, 호박"},{"n":"4","text":"오이, 토마토"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n상추는 서늘한 조건, 고추는 따뜻한 조건을 좋아해 동일 시설 관리가 불리한 조합이다.\n\n오답 확인\n당근·시금치는 호냉성, 가지·호박 및 오이·토마토는 호온성끼리 묶였다.\n\n근거·학습주제\n채소학 온도 적응성","explanationSections":[{"label":"정답 근거","text":"상추는 서늘한 조건, 고추는 따뜻한 조건을 좋아해 동일 시설 관리가 불리한 조합이다.","kind":"reason"},{"label":"오답 확인","text":"당근·시금치는 호냉성, 가지·호박 및 오이·토마토는 호온성끼리 묶였다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 온도 적응성","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"9-58","round":9,"year":2023,"number":58,"subject":"재배학·원예작물학","topic":"포도 지베렐린","stem":"소비자의 기호 변화로 씨가 없는 샤인머스캣 포도가 인기를 모으고 있다. 샤인\n머스캣을 무핵화하고 과립 비대를 위해 처리하는 생장조절물질은?","options":[{"n":"1","text":"아브시스산"},{"n":"2","text":"지베렐린"},{"n":"3","text":"옥신"},{"n":"4","text":"에틸렌"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n지베렐린은 샤인머스캣의 무핵화와 과립 비대 처리에 쓰인다.\n\n오답 확인\nABA는 휴면·스트레스, 옥신은 발근·생장, 에틸렌은 성숙·노화와 관련된다. 실제 처리는 품종·생육단계·등록기준을 따른다.\n\n근거·학습주제\n과수학 포도 생장조절","explanationSections":[{"label":"정답 근거","text":"지베렐린은 샤인머스캣의 무핵화와 과립 비대 처리에 쓰인다.","kind":"reason"},{"label":"오답 확인","text":"ABA는 휴면·스트레스, 옥신은 발근·생장, 에틸렌은 성숙·노화와 관련된다. 실제 처리는 품종·생육단계·등록기준을 따른다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수학 포도 생장조절","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"9-59","round":9,"year":2023,"number":59,"subject":"재배학·원예작물학","topic":"춘화 요구","stem":"저온자극을 통해 화아분화가 촉진되는 작물이 아닌 것은?","options":[{"n":"1","text":"양파"},{"n":"2","text":"상추"},{"n":"3","text":"배추"},{"n":"4","text":"무"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n상추는 일반적으로 고온·장일이 추대·개화를 촉진하므로 보기의 춘화형 작물과 다르다.\n\n오답 확인\n양파는 녹체춘화, 배추·무는 종자춘화형의 대표 예다.\n\n근거·학습주제\n채소학 춘화·추대","explanationSections":[{"label":"정답 근거","text":"상추는 일반적으로 고온·장일이 추대·개화를 촉진하므로 보기의 춘화형 작물과 다르다.","kind":"reason"},{"label":"오답 확인","text":"양파는 녹체춘화, 배추·무는 종자춘화형의 대표 예다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 춘화·추대","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"9-60","round":9,"year":2023,"number":60,"subject":"재배학·원예작물학","topic":"강풍과 생리","stem":"식물의 생육과정에서 강풍의 외부환경에 따른 영향으로 옳지 않은 것은?","options":[{"n":"1","text":"화분매개곤충의 활동을 억제한다."},{"n":"2","text":"상처를 유발하여 호흡량을 증가시킨다."},{"n":"3","text":"증산작용은 억제되나 광합성은 촉진된다."},{"n":"4","text":"상처를 통한 병해충의 발생을 촉진한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n강풍은 증산·수분스트레스를 늘리고 광합성을 저하시킬 수 있다. 증산 억제와 광합성 촉진을 짝지은 ③이 틀렸다.\n\n오답 확인\n매개곤충 활동 저하, 상처와 호흡 증가, 상처를 통한 감염 증가는 강풍 피해에 해당한다.\n\n근거·학습주제\n재배학 바람","explanationSections":[{"label":"정답 근거","text":"강풍은 증산·수분스트레스를 늘리고 광합성을 저하시킬 수 있다. 증산 억제와 광합성 촉진을 짝지은 ③이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"매개곤충 활동 저하, 상처와 호흡 증가, 상처를 통한 감염 증가는 강풍 피해에 해당한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 바람","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"9-61","round":9,"year":2023,"number":61,"subject":"재배학·원예작물학","topic":"ABA와 휴면","stem":"식물의 종자 또는 눈이 휴면에 들어가면서 증가하는 것은?","options":[{"n":"1","text":"호흡량"},{"n":"2","text":"옥신"},{"n":"3","text":"지베렐린"},{"n":"4","text":"아브시스산"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n휴면 진입과 유지에는 아브시스산 증가가 관련된다.\n\n오답 확인\n호흡량은 휴면기에 대체로 감소하고 지베렐린은 휴면타파·발아 방향에 작용한다. 옥신을 휴면 유도의 대표 호르몬으로 답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":[]},{"id":"9-64","round":9,"year":2023,"number":64,"subject":"재배학·원예작물학","topic":"우박 후 관리","stem":"최종 적과 후 우박피해를 입은 사과농가의 대처로 옳은 것을 모두 고른 것은?\nA농가 - 피해 정도가 심한 가지에는 도포제를 발라준다.\nB농가 - 수세가 강한 피해 나무에 질소 엽면시비를 한다.\nC농가 - 90 % 이상의 과실이 피해를 입은 나무의 과실은 모두 제거한다.\nD농가 - 병해충 방제를 위해 살균제를 살포한다.","options":[{"n":"1","text":"A, C"},{"n":"2","text":"A, D"},{"n":"3","text":"B, C"},{"n":"4","text":"B, D"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n가지 상처의 도포제 처리와 병원균 침입 방지를 위한 살균제 처리가 적절하여 A·D다.\n\n오답 확인\n수세가 이미 강한 나무에 질소를 더 주면 도장할 수 있다. 피해과를 모두 제거하면 수세 불균형을 초래하므로 피해정도와 잔존과를 평가해 관리한다.\n\n근거·학습주제\n과수학 우박피해 사후관리","explanationSections":[{"label":"정답 근거","text":"가지 상처의 도포제 처리와 병원균 침입 방지를 위한 살균제 처리가 적절하여 A·D다.","kind":"reason"},{"label":"오답 확인","text":"수세가 이미 강한 나무에 질소를 더 주면 도장할 수 있다. 피해과를 모두 제거하면 수세 불균형을 초래하므로 피해정도와 잔존과를 평가해 관리한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수학 우박피해 사후관리","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"9-65","round":9,"year":2023,"number":65,"subject":"재배학·원예작물학","topic":"수발아","stem":"다음은 벼의 수발아에 관한 내용이다. ( )에 들어갈 내용을 순서대로 옳게 나열\n한 것은?\n수발아는 ( )에 종실이 이삭에 달린 채로 싹이 트는 것을 말하며, 벼가 우기에\n도복이 되었을 때 자주 발생한다. 또한 ( )이 ( )보다 수발아가 잘 발생한다.","options":[{"n":"1","text":"수잉기, 조생종, 만생종"},{"n":"2","text":"결실기, 조생종, 만생종"},{"n":"3","text":"수잉기, 만생종, 조생종"},{"n":"4","text":"결실기, 만생종, 조생종"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n수발아는 결실기에 이삭의 종자가 싹트는 현상이며 일반적으로 조생종이 만생종보다 발생하기 쉽다.\n\n오답 확인\n수잉기는 아직 이삭이 형성·발달하는 단계로 수발아의 성숙 종자 단계와 다르다. 품종 휴면성·날씨에 따른 차이도 중요하다.\n\n근거·학습주제\n재배학 종자휴면·수발아","explanationSections":[{"label":"정답 근거","text":"수발아는 결실기에 이삭의 종자가 싹트는 현상이며 일반적으로 조생종이 만생종보다 발생하기 쉽다.","kind":"reason"},{"label":"오답 확인","text":"수잉기는 아직 이삭이 형성·발달하는 단계로 수발아의 성숙 종자 단계와 다르다. 품종 휴면성·날씨에 따른 차이도 중요하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 종자휴면·수발아","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sou f":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"9-71","round":9,"year":2023,"number":71,"subject":"재배학·원예작물학","topic":"장미 블라인드","stem":"장미의 블라인드 현상의 직접적인 원인은?","options":[{"n":"1","text":"수분 부족"},{"n":"2","text":"칼슘 부족"},{"n":"3","text":"일조량 부족"},{"n":"4","text":"근권부 산소 부족"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일조량 부족은 꽃눈 발달을 멈추게 하여 개화하지 않는 블라인드 가지를 발생시키는 직접 요인이다.\n\n오답 확인\n수분·칼슘·근권산소 부족도 생육에 해롭지만 문항이 묻는 대표적 직접 원인은 광 부족이다.\n\n근거·학습주제\n화훼학 장미 개화장해","explanationSections":[{"label":"정답 근거","text":"일조량 부족은 꽃눈 발달을 멈추게 하여 개화하지 않는 블라인드 가지를 발생시키는 직접 요인이다.","kind":"reason"},{"label":"오답 확인","text":"수분·칼슘·근권산소 부족도 생육에 해롭지만 문항이 묻는 대표적 직접 원인은 광 부족이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학 장미 개화장해","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"9-72","round":9,"year":2023,"number":72,"subject":"재배학·원예작물학","topic":"근경 번식","stem":"근경으로 영양번식을 하는 화훼작물은?","options":[{"n":"1","text":"칸나, 독일붓꽃"},{"n":"2","text":"시클라멘, 다알리아"},{"n":"3","text":"튤립, 글라디올러스"},{"n":"4","text":"백합, 라넌큘러스"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n칸나·독일붓꽃은 땅속을 가로로 자라는 줄기인 근경으로 번식한다.\n\n오답 확인\n시클라멘은 괴경, 다알리아·라넌큘러스는 괴근, 튤립·백합은 인경, 글라디올러스는 구경으로 분류한다.\n\n근거·학습주제\n화훼학 지하저장기관","explanationSections":[{"label":"정답 근거","text":"칸나·독일붓꽃은 땅속을 가로로 자라는 줄기인 근경으로 번식한다.","kind":"reason"},{"label":"오답 확인","text":"시클라멘은 괴경, 다알리아·라넌큘러스는 괴근, 튤립·백합은 인경, 글라디올러스는 구경으로 분류한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학 지하저장기관","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"9-73","round":9,"year":2023,"number":73,"subject":"재배학·원예작물학","topic":"온실 동고","stem":"유리온실 내 지면으로부터 용마루까지의 길이를 나타내는 용어는?","options":[{"n":"1","text":"간고"},{"n":"2","text":"동고"},{"n":"3","text":"측고"},{"n":"4","text":"헌고"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n지면에서 용마루까지의 높이는 동고다.\n\n오답 확인\n측고·헌고는 처마 부근 높이와 관련된다. 용마루 최고점까지의 높이와 구별한다.\n\n근거·학습주제\n시설원예 온실 치수","explanationSections":[{"label":"정답 근거","text":"지면에서 용마루까지의 높이는 동고다.","kind":"reason"},{"label":"오답 확인","text":"측고·헌고는 처마 부근 높이와 관련된다. 용마루 최고점까지의 높이와 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 온실 치수","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"9-74","round":9,"year":2023,"number":74,"subject":"재배학·원예작물학","topic":"NFT","stem":"베드의 바닥에 일정한 크기의 기울기로 얇은 막상의 양액이 흘러 순환하도록 하고\n그 위에 작물의 뿌리 일부가 닿게 하여 재배하는 방식은?","options":[{"n":"1","text":"매트재배"},{"n":"2","text":"심지재배"},{"n":"3","text":"NFT재배"},{"n":"4","text":"담액재배"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n경사진 베드를 따라 얇은 양액막을 흐르게 하여 뿌리 일부를 닿게 하는 것은 박막수경 NFT다.\n\n오답 확인\n매트·심지는 모세관 급수, 담액은 상대적으로 깊은 양액에 뿌리를 담그는 방식이다.\n\n근거·학습주제\n시설원예 수경재배","explanationSections":[{"label":"정답 근거","text":"경사진 베드를 따라 얇은 양액막을 흐르게 하여 뿌리 일부를 닿게 하는 것은 박막수경 NFT다.","kind":"reason"},{"label":"오답 확인","text":"매트·심지는 모세관 급수, 담액은 상대적으로 깊은 양액에 뿌리를 담그는 방식이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 수경재배","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"9-75","round":9,"year":2023,"number":75,"subject":"재배학·원예작물학","topic":"피복재 전원정답","stem":"시설재배에서 필름의 가시광선 투과율이 큰 것부터 작은 것 순으로 옳게 나타낸\n것은?","options":[{"n":"1","text":"PE > EVA > PVC"},{"n":"2","text":"EVA > PE > PVC"},{"n":"3","text":"PE > PVC > EVA"},{"n":"4","text":"PVC > PE > EVA"}],"answers":["1","2","3","4"],"answerLabel":"전항 정답","explanation":"정답 근거\n공식 최종정답은 ①②③④ 전원정답이다. PE·EVA·PVC의 가시광선 투과율을 이 보기 중 단일 순서로 고정하지 않는다.\n\n오답 확인\n투과율은 두께·첨가제·파장·노화·결로 등에 따라 달라진다. 재질명만으로 제품 전체의 광투과 성능을 단정할 수 없다.\n\n기준·해석 메모\n전원정답을 그대로 보존했다. 7회 74번의 PE 정답 역시 모든 조건의 광투과율 서열로 확장하지 않는다.\n\n근거·학습주제\n시설원예 피복재·공식 최종정답","explanationSections":[{"label":"정답 근거","text":"공식 최종정답은 ①②③④ 전원정답이다. PE·EVA·PVC의 가시광선 투과율을 이 보기 중 단일 순서로 고정하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"투과율은 두께·첨가제·파장·노화·결로 등에 따라 달라진다. 재질명만으로 제품 전체의 광투과 성능을 단정할 수 없다.","kind":"incorrect"},{"label":"기준·해석 메모","text":"전원정답을 그대로 보존했다. 7회 74번의 PE 정답 역시 모든 조건의 광투과율 서열로 확장하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"시설원예 피복재·공식 최종정답","kind":"reference"}],"sourcePdf":"2023년 제9회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"10-1","round":10,"year":2024,"number":1,"subject":"상법(보험편)","topic":"보험계약관계자","stem":"상법상 보험계약관계자에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해보험의 보험자는 보험사고가 발생한 경우 보험금 지급의무를 지는 자이다."},{"n":"2","text":"손해보험의 보험계약자는 자기명의로 보험계약을 체결하고 보험료 지급의무를 지는\n자이다."},{"n":"3","text":"손해보험의 피보험자는 피보험이익의 주체로서 보험사고가 발생한 때에 보험금을 받을\n자이다."},{"n":"4","text":"손해보험의 보험수익자는 보험사고가 발생한 때에 보험금을 지급받을 자로 지정된 자이다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n손해보험은 피보험이익의 주체인 피보험자가 보험금을 받는다. 보험수익자를 지정해 급부를 받게 하는 구조는 인보험에서 구별하는 개념이므로 ④의 일반화가 틀리다.\n\n오답 확인\n① 보험자는 급부의무자, ② 보험계약자는 계약체결·보험료 지급의무자, ③ 피보험자는 피보험이익의 주체이다.\n\n근거·학습주제\n상법 제638조·제639조, 손해보험의 당사자","explanationSections":[{"label":"정답 근거","text":"손해보험은 피보험이익의 주체인 피보험자가 보험금을 받는다. 보험수익자를 지정해 급부를 받게 하는 구조는 인보험에서 구별하는 개념이므로 ④의 일반화가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 보험자는 급부의무자, ② 보험계약자는 계약체결·보험료 지급의무자, ③ 피보험자는 피보험이익의 주체이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조·제639조, 손해보험의 당사자","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":[]},{"id":"10-2","round":10,"year":2024,"number":2,"subject":"상법(보험편)","topic":"계약의 성립과 증권","stem":"상법상 보험계약의 체결에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약은 청약과 승낙에 의한 합의와 보험증권의 교부로 성립한다."},{"n":"2","text":"기존의 보험계약을 연장하거나 변경한 경우에는 보험자는 그 보험증권에 그 사실을\n기재함으로써 보험증권의 교부에 갈음할 수 있다."},{"n":"3","text":"보험자는 보험계약이 성립된 후 보험계약자에게 보험약관을 교부하고 그 약관의 중요\n한 내용을 설명하여야 한다."},{"n":"4","text":"보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의 전부 또는 일부의\n지급을 받은 때에는 계약이 성립한 것으로 본다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n기존 계약을 연장·변경하면 증권에 그 사실을 기재해 교부에 갈음할 수 있다.\n\n오답 확인\n① 보험증권 교부는 성립요건이 아니다. ③ 약관은 계약 체결할 때 교부·설명한다. ④ 보험료 수령만으로 즉시 성립하는 것이 아니라 승낙·승낙의제 요건을 보아야 한다.\n\n근거·학습주제\n상법 제638조의2·제638조의3·제640조","explanationSections":[{"label":"정답 근거","text":"기존 계약을 연장·변경하면 증권에 그 사실을 기재해 교부에 갈음할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"① 보험증권 교부는 성립요건이 아니다. ③ 약관은 계약 체결할 때 교부·설명한다. ④ 보험료 수령만으로 즉시 성립하는 것이 아니라 승낙·승낙의제 요건을 보아야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의2·제638조의3·제640조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["8-3","5-4","11-3","2-2","9-3","6-13","12-1","3-2","4-3","10-3","2-16","6-11","3-3","9-1","5-11","8-1"]},{"id":"10-3","round":10,"year":2024,"number":3,"subject":"상법(보험편)","topic":"타인을 위한 보험증권","stem":"상법상 보험증권에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"타인을 위한 보험계약이 성립된 경우에는 보험자는 그 타인에게 보험증권을 교부해야 한다."},{"n":"2","text":"보험계약의 당사자는 보험증권의 교부가 있은 날로부터 일정한 기간내에 한하여 그\n증권내용의 정부(正否)에 관한 이의를 할 수 있음을 약정할 수 있다. 이 기간은 1월을\n내리지 못한다."},{"n":"3","text":"보험증권을 멸실 또는 현저하게 훼손한 때에는 보험계약자는 보험자에 대하여 증권의\n재교부를 청구할 수 있고, 그 증권작성의 비용은 보험계약자의 부담으로 한다."},{"n":"4","text":"보험자는 보험계약이 성립한 때에는 지체없이 보험증권을 작성하여 보험계약자에게\n교부하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험증권의 교부 상대방은 보험계약자이다. 타인을 위한 보험이라고 피보험자에게 교부하는 것으로 바뀌지 않는다.\n\n오답 확인\n② 증권 이의기간은 1개월 이상이어야 한다. ③ 재교부 비용은 보험계약자 부담, ④ 계약 성립 후 지체 없는 교부가 원칙이다.\n\n근거·학습주제\n상법 제640조·제641조·제642조","explanationSections":[{"label":"정답 근거","text":"보험증권의 교부 상대방은 보험계약자이다. 타인을 위한 보험이라고 피보험자에게 교부하는 것으로 바뀌지 않는다.","kind":"reason"},{"label":"오답 확인","text":"② 증권 이의기간은 1개월 이상이어야 한다. ③ 재교부 비용은 보험계약자 부담, ④ 계약 성립 후 지체 없는 교부가 원칙이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제641조·제642조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["5-4","8-3","11-3","9-3","12-1","4-3","2-2","6-13","7-3","10-2","3-5","12-3"]},{"id":"10-4","round":10,"year":2024,"number":4,"subject":"상법(보험편)","topic":"보험설계사의 권한","stem":"보험설계사가 가진 상법상 권한으로 옳은 것은?","options":[{"n":"1","text":"보험계약자로부터 고지에 관한 의사표시를 수령할 수 있는 권한"},{"n":"2","text":"보험계약자에게 영수증을 교부하지 않고 보험료를 수령할 수 있는 권한"},{"n":"3","text":"보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한"},{"n":"4","text":"보험계약자로부터 통지에 관한 의사표시를 수령할 수 있는 권한"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n계속적으로 보험계약 체결을 중개하는 자에게는 보험자가 작성한 보험증권을 교부할 권한이 있다.\n\n오답 확인\n고지·통지 수령권은 보험대리상의 권한과 구별한다. 보험료는 보험자가 작성한 영수증을 교부하는 경우에 한해 수령할 수 있다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"계속적으로 보험계약 체결을 중개하는 자에게는 보험자가 작성한 보험증권을 교부할 권한이 있다.","kind":"reason"},{"label":"오답 확인","text":"고지·통지 수령권은 보험대리상의 권한과 구별한다. 보험료는 보험자가 작성한 영수증을 교부하는 경우에 한해 수령할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["2-3","2-21","6-15","11-5","9-5","4-5","12-4","8-5","5-6","7-4","12-5"]},{"id":"10-5","round":10,"year":2024,"number":5,"subject":"상법(보험편)","topic":"보험료의 감액·반환","stem":"상법상 보험료에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에\n보험기간중 그 예기한 위험이 소멸한 때에는 보험계약자는 그 후의 보험료\n의 감액을 청구할 수 있다.\nㄴ. 보험계약의 전부 또는 일부가 무효인 경우에 보험계약자와 피보험자가 선\n의이며 중대한 과실이 없는 때에는 보험자에 대하여 보험료의 전부 또는\n일부의 반환을 청구할 수 있다.\nㄷ. 보험계약자는 계약체결후 지체없이 보험료의 전부 또는 제1회 보험료를 지\n급하여야 하며, 이를 지급하지 아니하는 경우에는 보험자는 다른 약정이 없\n는 한 계약성립후 2월이 경과하면 그 계약을 해제할 수 있다.\nㄹ. 계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 상당한 기\n간을 정하여 보험계약자에게 최고하고 그 기간내에 지급되지 아니한 때에\n는 그 계약은 해지된 것으로 본다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\nㄱ 특별위험이 소멸하면 이후 보험료 감액청구가 가능하다. ㄴ 계약 무효 시 계약자와 피보험자의 선의·무중과실 요건을 충족하면 반환을 청구한다.\n\n오답 확인\nㄷ 최초보험료 미지급 후 2개월이면 원칙적으로 해제된 것으로 본다. ㄹ 계속보험료는 최고 후 미지급 시 해지할 수 있으며 자동해지로 표현하면 틀린다.\n\n근거·학습주제\n상법 제647조·제648조·제650조","explanationSections":[{"label":"정답 근거","text":"ㄱ 특별위험이 소멸하면 이후 보험료 감액청구가 가능하다. ㄴ 계약 무효 시 계약자와 피보험자의 선의·무중과실 요건을 충족하면 반환을 청구한다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ 최초보험료 미지급 후 2개월이면 원칙적으로 해제된 것으로 본다. ㄹ 계속보험료는 최고 후 미지급 시 해지할 수 있으며 자동해지로 표현하면 틀린다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제647조·제648조·제650조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["5-7","7-6","4-9","11-6","2-5","12-5","12-7","9-6","4-6","2-4","11-7","1-6","3-8","1-5","3-7","8-6","9-11","12-3","10-16","8-16","6-16","12-6","2-6"]},{"id":"10-6","round":10,"year":2024,"number":6,"subject":"상법(보험편)","topic":"타인을 위한 보험의 해지","stem":"甲이 乙 소유의 농장에 대해 乙의 허락 없이 乙을 피보험자로 하여 A보험회사와\n화재보험계약을 체결한 경우, 그 법률관계에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 체결시 A보험회사가 서면으로 질문한 사항은 중요한 사항으로 추정한다."},{"n":"2","text":"보험사고가 발생하기 전에는 甲은 언제든지 계약의 전부 또는 일부를 해지할 수 있다."},{"n":"3","text":"甲이 乙의 위임이 없음을 A보험회사에게 고지하지 않은 때에는 乙이 그 보험계약이\n체결된 사실을 알지 못하였다는 사유로 A보험회사에게 대항하지 못한다."},{"n":"4","text":"보험계약당시에 甲 또는 乙이 고의 또는 중대한 과실로 인하여 중요한 사항을 고지\n하지 아니하거나 부실의 고지를 한 때에는 A보험회사는 그 사실을 안 날로부터 1월\n내에, 계약을 체결한 날로부터 3년내에 한하여 계약을 해지할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n타인을 위한 계약을 임의해지하려면 그 타인의 동의를 얻거나 보험증권을 소지해야 한다. 언제든 무조건 해지한다는 ②가 틀리다.\n\n오답 확인\n① 서면질문은 중요사항 추정, ③ 무위임 사실 불고지의 대항제한, ④ 고지의무위반 해지는 안 날 1개월·체결 후 3년 제한이다.\n\n근거·학습주제\n상법 제639조·제649조·제651조·제651조의2","explanationSections":[{"label":"정답 근거","text":"타인을 위한 계약을 임의해지하려면 그 타인의 동의를 얻거나 보험증권을 소지해야 한다. 언제든 무조건 해지한다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 서면질문은 중요사항 추정, ③ 무위임 사실 불고지의 대항제한, ④ 고지의무위반 해지는 안 날 1개월·체결 후 3년 제한이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조·제649조·제651조·제651조의2","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["10-12","4-7","9-21","12-8"]},{"id":"10-7","round":10,"year":2024,"number":7,"subject":"상법(보험편)","topic":"사고 전 해지와 보험료","stem":"상법상 보험사고에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약당시에 보험사고가 이미 발생하였거나 또는 발생할 수 없는 것인 때에는 그\n계약은 무효로 한다."},{"n":"2","text":"보험계약당시에 보험사고가 발생할 수 없는 것이었지만 당사자 쌍방과 피보험자가 이를\n알지 못한 때에는 그 계약은 유효하다."},{"n":"3","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니\n하는 보험의 경우에는 보험계약자는 그 사고발생후에도 보험계약을 해지할 수 있다."},{"n":"4","text":"보험사고가 발생하기 전에 보험계약을 해지한 보험계약자는 미경과보험료의 반환을\n청구할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n사고 전에 임의해지하면 다른 약정이 없는 한 미경과보험료 반환을 청구할 수 있으므로 ④가 틀리다.\n\n오답 확인\n이미 발생하거나 발생불능인 사고는 무효가 원칙이나 당사자 쌍방과 피보험자 모두가 모르면 예외이다. 보험금 지급 후에도 금액이 감액되지 않는 보험은 사고 후 해지도 가능하다.\n\n근거·학습주제\n상법 제644조·제649조","explanationSections":[{"label":"정답 근거","text":"사고 전에 임의해지하면 다른 약정이 없는 한 미경과보험료 반환을 청구할 수 있으므로 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"이미 발생하거나 발생불능인 사고는 무효가 원칙이나 당사자 쌍방과 피보험자 모두가 모르면 예외이다. 보험금 지급 후에도 금액이 감액되지 않는 보험은 사고 후 해지도 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제644조·제649조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["11-4","3-7","6-14","6-16","2-4","7-5","5-5","4-4","9-4","8-4","12-6","12-3","9-6","11-6","5-7","4-9","10-11","9-11","3-11","9-16","8-16","11-9","12-5"]},{"id":"10-8","round":10,"year":2024,"number":8,"subject":"상법(보험편)","topic":"보험대리상의 권한","stem":"상법상 보험대리상의 권한을 모두 고른 것은?\nㄱ. 보험료수령권한 ㄴ. 고지수령권한\nㄷ. 보험계약의 해지권한 ㄹ. 보험금수령권한","options":[{"n":"1","text":"ㄱ, ㄴ, ㄷ"},{"n":"2","text":"ㄱ, ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄷ, ㄹ"},{"n":"4","text":"ㄴ, ㄷ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험대리상은 보험료 수령, 고지 등 의사표시 수령, 계약 체결·변경·해지 의사표시의 권한을 갖는다. ㄱ·ㄴ·ㄷ이 해당한다.\n\n오답 확인\n보험금 수령권은 법정 열거 권한이 아니다. 보험료를 받는 권한과 사고 후 보험금을 받는 권한을 바꾸지 않는다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"보험대리상은 보험료 수령, 고지 등 의사표시 수령, 계약 체결·변경·해지 의사표시의 권한을 갖는다. ㄱ·ㄴ·ㄷ이 해당한다.","kind":"reason"},{"label":"오답 확인","text":"보험금 수령권은 법정 열거 권한이 아니다. 보험료를 받는 권한과 사고 후 보험금을 받는 권한을 바꾸지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["6-15"]},{"id":"10-9","round":10,"year":2024,"number":9,"subject":"상법(보험편)","topic":"위험변경증가 통지","stem":"보험기간 중에 보험사고의 발생 위험이 현저하게 변경 또는 증가된 경우의 법률\n관계에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험수익자의 고의로 인하여 사고 발생의 위험이 현저하게 증가된 때에는 보험자는\n그 사실을 안 날로부터 1월내에 보험계약을 해지할 수 있을 뿐이고, 보험료의 증액을\n청구할 수는 없다."},{"n":"2","text":"보험계약자가 지체없이 위험변경증가의 통지를 한 때에는 보험자는 1월내에 보험료\n증액을 청구할 수 있을 뿐이고 보험계약을 해지할 수는 없다."},{"n":"3","text":"보험계약자가 위험변경증가의 통지를 해태한 때에는 보험자는 그 사실을 안 날로부터\n1월내에 한하여 계약을 해지할 수 있다."},{"n":"4","text":"타인을 위한 손해보험의 타인이 사고발생 위험이 현저하게 변경 또는 증가된 사실을\n알게된 경우 이를 보험자에게 통지할 의무는 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n위험변경증가 통지를 해태한 경우 보험자는 그 사실을 안 날부터 1개월 내에 계약을 해지할 수 있다.\n\n오답 확인\n① 고의·중과실에 의한 위험증가도 증액 또는 해지 대상이다. ② 통지받은 경우에도 해지가 가능하다. ④ 타인을 위한 보험의 피보험자도 통지의무를 부담한다.\n\n근거·학습주제\n상법 제652조·제653조","explanationSections":[{"label":"정답 근거","text":"위험변경증가 통지를 해태한 경우 보험자는 그 사실을 안 날부터 1개월 내에 계약을 해지할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"① 고의·중과실에 의한 위험증가도 증액 또는 해지 대상이다. ② 통지받은 경우에도 해지가 가능하다. ④ 타인을 위한 보험의 피보험자도 통지의무를 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조·제653조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["11-10","3-10","9-15","4-10","6-19","7-9","7-10","12-9","2-14","8-10","1-9","10-10","4-6","5-9"]},{"id":"10-10","round":10,"year":2024,"number":10,"subject":"상법(보험편)","topic":"보험사고 통지의 효과","stem":"보험사고가 발생한 경우 그 법률관계에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험수익자가 보험사고의 발생을 안 때에는 지체없이 보험자에게 그 통지를 발송하여야 한다."},{"n":"2","text":"보험계약자가 보험사고의 발생을 알았음에도 지체없이 보험자에게 그 통지를 발송하지\n않은 경우 보험자는 계약을 해지할 수 있다."},{"n":"3","text":"보험계약 당사자간에 다른 약정이 없으면 최초보험료를 보험자가 지급받은 때로부터\n보험자의 책임이 개시된다."},{"n":"4","text":"위험이 현저하게 변경 또는 증가된 사실이 보험사고 발생에 영향을 미친 경우, 보험\n자가 위험변경증가의 통지를 못 받았음을 이유로 유효하게 계약을 해지하면 보험금을\n지급할 책임이 없다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n사고발생 통지를 지체했다고 곧 계약해지권이 생기지는 않는다. 그 지체로 증가한 손해에 대한 면책을 구별해야 한다.\n\n오답 확인\n① 통지의무자에 보험수익자가 포함된다. ③ 최초보험료 수령시 책임개시가 원칙이다. ④ 위험증가 해지와 사고 사이 인과관계가 있으면 보험금 면책이 문제된다.\n\n근거·학습주제\n상법 제656조·제657조·제655조","explanationSections":[{"label":"정답 근거","text":"사고발생 통지를 지체했다고 곧 계약해지권이 생기지는 않는다. 그 지체로 증가한 손해에 대한 면책을 구별해야 한다.","kind":"reason"},{"label":"오답 확인","text":"① 통지의무자에 보험수익자가 포함된다. ③ 최초보험료 수령시 책임개시가 원칙이다. ④ 위험증가 해지와 사고 사이 인과관계가 있으면 보험금 면책이 문제된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제656조·제657조·제655조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["11-11","2-18","4-10","8-12","3-11","2-14","7-9","9-16","12-10","10-9","7-12","4-11","3-10","9-15","9-4","11-10","8-10","6-19","7-11","10-11"]},{"id":"10-11","round":10,"year":2024,"number":11,"subject":"상법(보험편)","topic":"보험자의 파산","stem":"보험자의 보험금액의 지급에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험수익자의 중과실로 인하여 보험사고가 생긴 때에는 보험자는 보험금액을 지급할\n책임이 없다."},{"n":"2","text":"보험계약자의 고의로 보험사고가 생긴 때에는 보험자는 보험금액을 지급할 책임이 없다."},{"n":"3","text":"보험금액의 지급에 관하여 약정기간이 없는 경우에는 보험자는 보험사고 발생의 통지를\n받은 후 지체없이 지급할 보험금액을 정해야 한다."},{"n":"4","text":"보험자가 파산선고를 받았으나 보험계약자가 계약을 해지하지 않은 채 3월이 경과한\n후에 보험사고가 발생하여도 보험자는 보험금액 지급 책임이 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험자가 파산선고를 받으면 보험계약자는 해지할 수 있고, 해지하지 않아도 파산선고 후 3개월 경과 시 계약이 효력을 잃는다.\n\n오답 확인\n①·② 고의·중과실 면책이 원칙이며, ③ 지급기간 약정이 없으면 지체 없이 금액을 정하고 정한 날부터 10일 내 지급한다.\n\n근거·학습주제\n상법 제654조·제658조·제659조","explanationSections":[{"label":"정답 근거","text":"보험자가 파산선고를 받으면 보험계약자는 해지할 수 있고, 해지하지 않아도 파산선고 후 3개월 경과 시 계약이 효력을 잃는다.","kind":"reason"},{"label":"오답 확인","text":"①·② 고의·중과실 면책이 원칙이며, ③ 지급기간 약정이 없으면 지체 없이 금액을 정하고 정한 날부터 10일 내 지급한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제654조·제658조·제659조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["9-13","3-12","12-10","2-18","4-12","11-12","8-12","7-14","5-9","12-18","3-11","7-11","9-16","10-7","2-11","1-11","11-11","8-20","10-10","12-7","6-16"]},{"id":"10-12","round":10,"year":2024,"number":12,"subject":"상법(보험편)","topic":"재보험의 책임범위","stem":"甲은 자기 소유의 건물에 대해 A보험회사와 화재보험계약을 체결하였고, A보험\n회사는 이 화재보험계약으로 인하여 부담할 책임에 대하여 B보험회사와 재보험계\n약을 체결한 경우 그 법률관계에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"화재보험계약의 6","7-13","8-15"]},{"id":"10-16","round":10,"year":2024,"number":16,"subject":"상법(보험편)","topic":"초과보험의 효과","stem":"상법상 초과보험에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험계약자의 사기에 의하여 보험금액이 보험가액을 현저하게 초과하는\n보험계약이 체결된 경우 보험기간 중에 보험사고가 발생하면 보험자는\n보험가액의 한도 내에서 보험금 지급의무가 있다.\nㄴ. 보험계약 체결 이후 보험기간 중에 보험가액이 보험금액에 비해 현저하게\n감소된 때에는 보험자 또는 보험계약자는 보험료와 보험금액의 감액을\n청구할 수 있다.\nㄷ. 보험계약 체결 이후 보험기간 중에 보험가액이 보험금액에 비해 현저하게\n감소된 때에는 보험자 또는 보험계약자는 보험계약을 취소할 수 있다.\nㄹ. 보험계약자의 사기에 의하여 보험금액이 보험가액을 현저하게 초과하는\n계약이 체결된 경우 보험자는 그 사실을 안 때까지의 보험료를 청구할 수\n있다.","options":[{"n":"1","text":"ㄱ, ㄷ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄴ, ㄹ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\nㄴ 보험기간 중 가액이 현저히 감소해도 보험료·보험금액 감액청구가 가능하다. ㄹ 사기 초과보험은 무효이나 보험자는 안 때까지 보험료를 청구한다.\n\n오답 확인\nㄱ 사기 초과보험은 가액 한도 보상이 아니라 계약 무효이다. ㄷ 가액감소 자체를 이유로 취소하는 규정이 아니다.\n\n근거·학습주제\n상법 제669조","explanationSections":[{"label":"정답 근거","text":"ㄴ 보험기간 중 가액이 현저히 감소해도 보험료·보험금액 감액청구가 가능하다. ㄹ 사기 초과보험은 무효이나 보험자는 안 때까지 보험료를 청구한다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ 사기 초과보험은 가액 한도 보상이 아니라 계약 무효이다. ㄷ 가액감소 자체를 이유로 취소하는 규정이 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["11-15","8-16","12-14","6-24","9-11","3-22","5-14","4-16","2-11","5-9","5-7","12-5","10-5","4-19","9-18","2-4"]},{"id":"10-17","round":10,"year":2024,"number":17,"subject":"상법(보험편)","topic":"중복보험의 대외적 책임","stem":"甲이 가액이 10억원인 자기 소유의 재산에 대해 A, B보험회사와 보험기간이\n동일하고, 보험금액 10억원인 화재보험계약을 순차적으로 각각 체결한 경우 그\n법률관계에 관한 설명으로 옳지 않은 것은? (甲의 사기는 없었음)","options":[{"n":"1","text":"만약 甲이 사기에 의하여 두 개의 화재보험계약을 체결하였다면 보험계약은 무효이다."},{"n":"2","text":"보험기간 중 화재가 발생하여 甲의 재산이 전소되어 10억원의 손해를 입은 경우 甲은\nA, B보험회사에게 각각 5억원까지 보험금청구권을 행사할 수 있다."},{"n":"3","text":"甲은 B보험회사와 화재보험계약을 체결할 때 A보험회사와의 화재보험계약의 내용을\n통지할 의무가 있다."},{"n":"4","text":"甲이 A보험회사에 대한 권리를 포기하더라도 B보험회사의 권리의무에 영향을 미치지\n않는다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n중복보험자는 각 보험금액 한도에서 연대책임을 진다. 甲이 각 보험자에게 5억원까지만 청구한다는 ②는 내부 분담과 혼동했다.\n\n오답 확인\n① 사기 중복보험은 무효, ③ 후계약 체결 시 통지의무가 있다. ④ 한 보험자에 대한 권리포기는 다른 보험자의 권리의무에 영향이 없다.\n\n근거·학습주제\n상법 제672조·제673조","explanationSections":[{"label":"정답 근거","text":"중복보험자는 각 보험금액 한도에서 연대책임을 진다. 甲이 각 보험자에게 5억원까지만 청구한다는 ②는 내부 분담과 혼동했다.","kind":"reason"},{"label":"오답 확인","text":"① 사기 중복보험은 무효, ③ 후계약 체결 시 통지의무가 있다. ④ 한 보험자에 대한 권리포기는 다른 보험자의 권리의무에 영향이 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조·제673조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["10-12","12-17","8-19","11-17"]},{"id":"10-18","round":10,"year":2024,"number":18,"subject":"상법(보험편)","topic":"보험사고 후 목적의 멸실","stem":"손해보험의 목적에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리와 의무를 승계한\n것으로 본다."},{"n":"2","text":"금전으로 산정할 수 있는 이익에 한하여 보험의 목적으로 할 수 있다."},{"n":"3","text":"보험의 목적에 관하여 보험자가 부담할 손해가 생긴 경우에는 그 후 그 목적이 보험\n자가 부담하지 아니하는 보험사고의 발생으로 인하여 멸실된 때에도 보험자는 이미\n생긴 손해를 보상할 책임을 면하지 못한다."},{"n":"4","text":"보험의 목적의 성질, 하자 또는 자연소모로 인한 손해는 보험자가 이를 보상할 책임\n이 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험자가 부담할 손해가 먼저 생겼다면 뒤에 면책사고로 목적물이 멸실해도 이미 생긴 손해에 대한 책임은 남는다.\n\n오답 확인\n① 양수인의 권리·의무 승계는 간주가 아니라 추정이다. ② 금전으로 산정 가능한 이익은 보험계약의 목적이며 물건인 보험목적과 구별한다. ④ 자연소모·성질·하자 손해는 면책이 원칙이다.\n\n근거·학습주제\n상법 제668조·제675조·제678조·제679조","explanationSections":[{"label":"정답 근거","text":"보험자가 부담할 손해가 먼저 생겼다면 뒤에 면책사고로 목적물이 멸실해도 이미 생긴 손해에 대한 책임은 남는다.","kind":"reason"},{"label":"오답 확인","text":"① 양수인의 권리·의무 승계는 간주가 아니라 추정이다. ② 금전으로 산정 가능한 이익은 보험계약의 목적이며 물건인 보험목적과 구별한다. ④ 자연소모·성질·하자 손해는 면책이 원칙이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제668조·제675조·제678조·제679조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["12-18","7-21","6-6","4-23","5-20","8-20","11-19","8-15","9-20","12-20","6-22","9-17"]},{"id":"10-19","round":10,"year":2024,"number":19,"subject":"상법(보험편)","topic":"손해액의 산정","stem":"손해보험에서 손해액의 산정에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액은 보험계약을 체결한 때와 곳의 가액에 의하여 산정한다."},{"n":"2","text":"보험사고로 인하여 상실된 피보험자가 얻을 이익이나 보수는 보험자가 보상할 손해액에\n산입하여야 한다."},{"n":"3","text":"손해액의 산정에 관한 비용은 보험계약자의 부담으로 한다."},{"n":"4","text":"당사자간에 다른 약정이 있는 때에는 그 신품가액에 의하여 손해액을 산정할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n특약으로 신품가액을 기준으로 손해액을 산정할 수 있다. 실손보상 원칙의 법정 예외이다.\n\n오답 확인\n① 사고 발생 당시와 장소의 가액이 원칙이다. ② 일실이익·보수는 다른 약정 없으면 산입하지 않는다. ③ 손해액 산정비용은 보험자가 부담한다.\n\n근거·학습주제\n상법 제676조","explanationSections":[{"label":"정답 근거","text":"특약으로 신품가액을 기준으로 손해액을 산정할 수 있다. 실손보상 원칙의 법정 예외이다.","kind":"reason"},{"label":"오답 확인","text":"① 사고 발생 당시와 장소의 가액이 원칙이다. ② 일실이익·보수는 다른 약정 없으면 산입하지 않는다. ③ 손해액 산정비용은 보험자가 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["6-4","12-19","1-19","3-25","2-22","9-20","5-20","7-20","4-21","8-21","8-15","9-17","7-13","5-13","2-12"]},{"id":"10-20","round":10,"year":2024,"number":20,"subject":"상법(보험편)","topic":"미지급 보험료 공제","stem":"보험자가 손해를 보상할 때에 보험료의 지급을 받지 아니한 잔액이 있는 경우에\n관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자는 보험료의 지급을 받지 아니한 잔액이 있으면 보험계약을 즉시 해지할 수 있다."},{"n":"2","text":"보험자는 지급기일이 도래하였으나 지급받지 않은 보험료 잔액을 보상할 금액에서\n공제하여야 한다."},{"n":"3","text":"보험자는 지급받지 않은 보험료 잔액이 있으면 그 지급기일이 도래하지 아니한 때라도\n보상할 금액에서 이를 공제할 수 있다."},{"n":"4","text":"보험자는 지급기일이 도래한 보험료 잔액의 지급이 있을 때까지 그 손해보상을 전부\n거절할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n손해보상 시 보험료 잔액은 지급기일이 아직 오지 않아도 보험금에서 공제할 수 있다.\n\n오답 확인\n즉시해지나 보상 전부 거절과 구별한다. 법문은 공제할 수 있다고 정하므로 ②의 공제하여야 한다는 표현도 틀리다.\n\n근거·학습주제\n상법 제677조","explanationSections":[{"label":"정답 근거","text":"손해보상 시 보험료 잔액은 지급기일이 아직 오지 않아도 보험금에서 공제할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"즉시해지나 보상 전부 거절과 구별한다. 법문은 공제할 수 있다고 정하므로 ②의 공제하여야 한다는 표현도 틀리다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제677조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["5-24","6-5","8-21","7-21","2-24"]},{"id":"10-21","round":10,"year":2024,"number":21,"subject":"상법(보험편)","topic":"손해방지비용","stem":"상법상 손해방지의무에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"손해방지의무는 보험계약자는 부담하지 않고 피보험자만 부담하는 의무이다."},{"n":"2","text":"손해방지의무의 이행을 위하여 필요 또는 유익하였던 비용과 보상액이 보험금액을\n초과한 경우라도 보험자가 이를 부담한다."},{"n":"3","text":"손해방지의무는 보험사고가 발생하기 이전에 부담하는 의무이다."},{"n":"4","text":"손해방지의무의 이행을 위하여 필요 또는 유익하였던 비용은 실제로 손해의 방지와\n경감에 유효하게 영향을 준 경우에만 보험자가 이를 부담한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n손해방지·경감에 필요하거나 유익한 비용은 보상액과 합쳐 보험금액을 초과해도 보험자 부담이다.\n\n오답 확인\n계약자와 피보험자 모두 의무자이다. 사고 후 손해확대 방지를 중심으로 하며 실제 성공이라는 결과까지 요구하지 않는다.\n\n근거·학습주제\n상법 제680조","explanationSections":[{"label":"정답 근거","text":"손해방지·경감에 필요하거나 유익한 비용은 보상액과 합쳐 보험금액을 초과해도 보험자 부담이다.","kind":"reason"},{"label":"오답 확인","text":"계약자와 피보험자 모두 의무자이다. 사고 후 손해확대 방지를 중심으로 하며 실제 성공이라는 결과까지 요구하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제680조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["12-21","8-23","1-21","5-22","2-10","11-20"]},{"id":"10-22","round":10,"year":2024,"number":22,"subject":"상법(보험편)","topic":"잔존물대위와 일부보험","stem":"보험목적에 관한 보험대위(잔존물대위)의 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험의 목적의 전부가 멸실한 경우에 보험대위가 인정된다."},{"n":"2","text":"피보험자가 보험자로부터 보험금액의 전부를 지급받은 후에는 잔존물을 임의로 처분할\n수 없다."},{"n":"3","text":"일부보험의 경우에는 잔존물대위가 인정되지 않는다."},{"n":"4","text":"보험자가 보험금액의 전부를 지급한 때 잔존물에 대한 권리는 물권변동절차 없이\n보험자에게 이전된다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일부보험에서도 목적 전부 멸실 후 보험금액 전부를 지급하면 보험금액/보험가액 비율로 권리를 취득한다.\n\n오답 확인\n전부 멸실·전액 지급이 요건이다. 요건 충족 시 법률상 이전하므로 피보험자는 잔존물을 자유 처분할 수 없고 별도 물권변동 절차도 필요 없다.\n\n근거·학습주제\n상법 제681조","explanationSections":[{"label":"정답 근거","text":"일부보험에서도 목적 전부 멸실 후 보험금액 전부를 지급하면 보험금액/보험가액 비율로 권리를 취득한다.","kind":"reason"},{"label":"오답 확인","text":"전부 멸실·전액 지급이 요건이다. 요건 충족 시 법률상 이전하므로 피보험자는 잔존물을 자유 처분할 수 없고 별도 물권변동 절차도 필요 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제681조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["6-7","1-23","11-21","3-24","7-22"]},{"id":"10-23","round":10,"year":2024,"number":23,"subject":"상법(보험편)","topic":"화재손해의 범위","stem":"화재보험자가 보상할 손해에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 화재가 발생한 건물의 철거비와 폐기물처리비\nㄴ. 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해\nㄷ. 화재로 인하여 다른 곳에 옮겨놓은 물건의 도난으로 인한 손해","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n화재와 상당인과관계가 있는 철거비·폐기물처리비는 수리손해에 포함될 수 있고, 소방·손해감소 조치에 의한 손해도 보상한다.\n\n오답 확인\nㄷ 피난시킨 물건의 도난은 화재에 따른 직접 손해 또는 소방손해와 구별하며 제시된 일반규정만으로 당연 보상되지 않는다.\n\n근거·학습주제\n상법 제683조·제684조, 화재 수리비 판례","explanationSections":[{"label":"정답 근거","text":"화재와 상당인과관계가 있는 철거비·폐기물처리비는 수리손해에 포함될 수 있고, 소방·손해감소 조치에 의한 손해도 보상한다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ 피난시킨 물건의 도난은 화재에 따른 직접 손해 또는 소방손해와 구별하며 제시된 일반규정만으로 당연 보상되지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제683조·제684조, 화재 수리비 판례","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["6-8","12-23","3-16"]},{"id":"10-24","round":10,"year":2024,"number":24,"subject":"상법(보험편)","topic":"화재보험과 일부보험","stem":"화재보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"건물을 보험의 목적으로 한 때에는 그 소재지, 구조와 용도를 화재보험증권에 기재\n하여야 한다."},{"n":"2","text":"동산을 보험의 목적으로 한 때에는 그 존치한 장소의 상태와 용도를 화재보험증권에\n기재하여야 한다."},{"n":"3","text":"동일한 건물에 대하여 소유권자와 저당권자는 각각 다른 피보험이익을 가지므로,\n각자는 독립한 화재보험계약을 체결할 수 있다."},{"n":"4","text":"건물을 보험의 목적으로 한 때 그 보험가액의 일부를 보험에 붙인 경우, 당사자간에\n다른 약정이 없다면 보험자는 보험금액의 한도내에서 그 손해를 보상할 책임을 진다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n일부보험은 원칙적으로 보험금액/보험가액 비례보상이다. ④처럼 별도 약정 없이 보험금액 한도 실손보상으로 설명하면 틀리다.\n\n오답 확인\n건물 소재지·구조·용도 및 동산 존치장소의 상태·용도는 증권 기재사항이다. 소유권·저당권은 서로 다른 피보험이익을 이룬다.\n\n근거·학습주제\n상법 제674조·제685조","explanationSections":[{"label":"정답 근거","text":"일부보험은 원칙적으로 보험금액/보험가액 비례보상이다. ④처럼 별도 약정 없이 보험금액 한도 실손보상으로 설명하면 틀리다.","kind":"reason"},{"label":"오답 확인","text":"건물 소재지·구조·용도 및 동산 존치장소의 상태·용도는 증권 기재사항이다. 소유권·저당권은 서로 다른 피보험이익을 이룬다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제674조·제685조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["5-25","2-25","12-24","4-22","6-9","4-25","11-24"]},{"id":"10-25","round":10,"year":2024,"number":25,"subject":"상법(보험편)","topic":"집합보험 목적의 확정","stem":"집합보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"집합보험은 집합된 물건을 일괄하여 보험의 목적으로 한다."},{"n":"2","text":"보험의 목적에 속한 물건이 보험기간중에 수시로 교체된 경우에도 보험계약의 체결\n시에 현존한 물건은 보험의 목적에 포함된 것으로 한다."},{"n":"3","text":"피보험자의 가족과 사용인의 물건도 보험의 목적에 포함된 것으로 한다."},{"n":"4","text":"보험의 목적에 피보험자의 가족의 물건이 포함된 경우, 그 보험은 피보험자의 가족을\n위하여서도 체결한 것으로 본다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험기간 중 구성물이 교체되면 사고 발생 시 현존하는 물건을 포함한다. 체결 시 현존을 기준으로 고정하지 않는다.\n\n오답 확인\n피보험자 가족·사용인 물건도 포함하고, 그 부분은 그들을 위한 보험으로 본다.\n\n근거·학습주제\n상법 제686조·제687조","explanationSections":[{"label":"정답 근거","text":"보험기간 중 구성물이 교체되면 사고 발생 시 현존하는 물건을 포함한다. 체결 시 현존을 기준으로 고정하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"피보험자 가족·사용인 물건도 포함하고, 그 부분은 그들을 위한 보험으로 본다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제686조·제687조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["12-25","3-18","9-25","7-25","11-23","6-10","4-25","5-13","2-17"]},{"id":"10-26","round":10,"year":2024,"number":26,"subject":"농어업재해보험법령","topic":"농업재해보험심의회","stem":"농어업재해보험법령상 농업재해보험심의회(이하 ‘심의회’)에 관한 설명으로 옳지\n않은 것은?","options":[{"n":"1","text":"심의회의 위원장은 농림축산식품부차관으로 하고, 부위원장은 위원 중에서 농림축산\n식품부차관이 지명한다."},{"n":"2","text":"심의회의 회의는 재적위원 과반수의 출석으로 개의(開議)하고, 출석위원 과반수의\n찬성으로 의결한다."},{"n":"3","text":"심의회는 위원장 및 부위원장 각 1명을 포함한 21명 이내의 위원으로 구성한다."},{"n":"4","text":"심의회의 회의는 재적위원 3분의 1 이상의 요구가 있을 때 또는 위원장이 필요하다고\n인정할 때에 소집한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n위원장은 농림축산식품부차관이나 부위원장은 위원 중 호선한다. 차관이 지명한다는 부
