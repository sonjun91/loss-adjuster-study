<script type="application/json" id="question-data">[{"id":"1-1","round":1,"year":2015,"number":1,"subject":"상법(보험편)","topic":"보험계약의 선의성","stem":"보험계약의 선의성을 유지하기 위한 제도로 옳지 않은 것은?","options":[{"n":"1","text":"보험자의 보험약관설명의무"},{"n":"2","text":"보험계약자의 손해방지의무"},{"n":"3","text":"보험계약자의 중요사항 고지의무"},{"n":"4","text":"인위적 보험사고에 대한 보험자면책"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n약관설명의무는 보험자가 계약자에게 약관의 중요한 내용을 설명하게 하여 계약 내용에 관한 정보 격차를 줄이는 제도이다. 보험계약자의 도덕적 위험을 억제하여 선의성을 확보하는 의무들과 그 직접적인 목적이 다르므로 이 문항에서는 ①을 고른다.\n\n오답 확인\n② 손해방지의무는 사고 후 손해 확대를 억제한다. ③ 고지의무는 보험자가 위험을 정확히 판단하게 하며, ④ 고의로 일으킨 사고의 면책은 보험을 이용한 부정한 이익 취득을 막는다.\n\n근거·학습주제\n상법 제638조의3·제651조·제659조·제680조","explanationSections":[{"label":"정답 근거","text":"약관설명의무는 보험자가 계약자에게 약관의 중요한 내용을 설명하게 하여 계약 내용에 관한 정보 격차를 줄이는 제도이다. 보험계약자의 도덕적 위험을 억제하여 선의성을 확보하는 의무들과 그 직접적인 목적이 다르므로 이 문항에서는 ①을 고른다.","kind":"reason"},{"label":"오답 확인","text":"② 손해방지의무는 사고 후 손해 확대를 억제한다. ③ 고지의무는 보험자가 위험을 정확히 판단하게 하며, ④ 고의로 일으킨 사고의 면책은 보험을 이용한 부정한 이익 취득을 막는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·제651조·제659조·제680조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":[]},{"id":"1-2","round":1,"year":2015,"number":2,"subject":"상법(보험편)","topic":"타인을 위한 보험의 임의해지","stem":"타인을 위한 보험계약의 보험계약자가 피보험자의 동의를 얻어야 할 수 있는 것은?","options":[{"n":"1","text":"보험증권교부청구권"},{"n":"2","text":"보험사고 발생 전 보험계약해지권"},{"n":"3","text":"특별위험 소멸에 따른 보험료감액청구권"},{"n":"4","text":"보험계약 무효에 따른 보험료반환청구권"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n타인을 위한 보험계약에서 사고 발생 전에 보험계약자가 임의로 해지하려면 그 타인의 동의를 얻거나 보험증권을 소지해야 한다. 피보험자의 보험보호를 계약자가 일방적으로 없애지 못하도록 제한하는 취지이다.\n\n오답 확인\n① 증권교부청구, ③ 특별위험 소멸에 따른 감액청구, ④ 무효에 따른 보험료반환청구는 이 문항에서 묻는 타인의 동의 제한과 구분한다. 동의만이 유일한 해지 요건인 것은 아니며 증권 소지도 대체 요건이다.\n\n근거·학습주제\n상법 제649조","explanationSections":[{"label":"정답 근거","text":"타인을 위한 보험계약에서 사고 발생 전에 보험계약자가 임의로 해지하려면 그 타인의 동의를 얻거나 보험증권을 소지해야 한다. 피보험자의 보험보호를 계약자가 일방적으로 없애지 못하도록 제한하는 취지이다.","kind":"reason"},{"label":"오답 확인","text":"① 증권교부청구, ③ 특별위험 소멸에 따른 감액청구, ④ 무효에 따른 보험료반환청구는 이 문항에서 묻는 타인의 동의 제한과 구분한다. 동의만이 유일한 해지 요건인 것은 아니며 증권 소지도 대체 요건이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제649조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["2-15"]},{"id":"1-3","round":1,"year":2015,"number":3,"subject":"상법(보험편)","topic":"약관설명의무 위반과 불이익변경","stem":"보험약관의 조항 중 그 효력이 인정되지 않는 것은?","options":[{"n":"1","text":"보험계약체결일 기준 1월 전부터 보험기간이 시작되기로 하는 조항"},{"n":"2","text":"보험증권교부일로부터 2월 이내에 증권내용에 이의를 할 수 있도록 하는 조항"},{"n":"3","text":"약관설명의무 위반 시 보험계약자가 1월 이내에 계약을 취소할 수 있도록 하는 조항"},{"n":"4","text":"보험계약자의 보험료 반환청구권의 소멸시효기간을 3년으로 하는 조항"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n중요 약관을 설명하지 않은 경우 계약자는 계약 성립일부터 3개월 이내에 계약을 취소할 수 있다. 이를 1개월로 줄이는 조항은 계약자에게 불리하게 법정 권리를 제한하므로 효력이 인정되지 않는다.\n\n오답 확인\n① 소급보험은 일정 요건에서 가능하다. ② 증권 이의기간을 2개월로 정하는 것은 1개월보다 계약자에게 유리하다. ④ 보험료반환청구권 3년은 법정 시효와 맞는다.\n\n근거·학습주제\n상법 제638조의3·제640조·제643조·제662조·제663조","explanationSections":[{"label":"정답 근거","text":"중요 약관을 설명하지 않은 경우 계약자는 계약 성립일부터 3개월 이내에 계약을 취소할 수 있다. 이를 1개월로 줄이는 조항은 계약자에게 불리하게 법정 권리를 제한하므로 효력이 인정되지 않는다.","kind":"reason"},{"label":"오답 확인","text":"① 소급보험은 일정 요건에서 가능하다. ② 증권 이의기간을 2개월로 정하는 것은 1개월보다 계약자에게 유리하다. ④ 보험료반환청구권 3년은 법정 시효와 맞는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·제640조·제643조·제662조·제663조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["5-12","10-13"]},{"id":"1-4","round":1,"year":2015,"number":4,"subject":"상법(보험편)","topic":"보험대리상의 권한","stem":"보험대리상이 갖는 권한으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자 명의의 보험계약체결권"},{"n":"2","text":"보험계약자에 대한 위험변경증가권"},{"n":"3","text":"보험계약자에 대한 보험증권교부권"},{"n":"4","text":"보험계약자로부터의 보험료수령권"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험대리상은 권한 범위에서 보험계약 체결, 보험증권 교부, 보험료 수령 등의 행위를 할 수 있다. 그러나 보험계약의 위험 자체를 임의로 변경하거나 증가시킬 권한이 있다는 ②는 옳지 않다.\n\n오답 확인\n위험변경·증가 사실을 통지받을 권한과 위험을 변경·증가시키는 권한은 다르다. 보기 ②의 표현을 고지·통지수령권으로 바꾸어 읽으면 오답이 되므로 원문을 구별해야 한다.\n\n근거·학습주제\n상법 보험대리상의 권한 및 대리 법리","explanationSections":[{"label":"정답 근거","text":"보험대리상은 권한 범위에서 보험계약 체결, 보험증권 교부, 보험료 수령 등의 행위를 할 수 있다. 그러나 보험계약의 위험 자체를 임의로 변경하거나 증가시킬 권한이 있다는 ②는 옳지 않다.","kind":"reason"},{"label":"오답 확인","text":"위험변경·증가 사실을 통지받을 권한과 위험을 변경·증가시키는 권한은 다르다. 보기 ②의 표현을 고지·통지수령권으로 바꾸어 읽으면 오답이 되므로 원문을 구별해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 보험대리상의 권한 및 대리 법리","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["12-5","2-3","4-5","12-4","5-6"]},{"id":"1-5","round":1,"year":2015,"number":5,"subject":"상법(보험편)","topic":"특별위험의 소멸과 보험료감액","stem":"보험계약자가 보험료의 감액을 청구할 수 있는 경우에 해당하는 것은?","options":[{"n":"1","text":"보험계약 무효 시 보험계약자와 피보험자가 선의이며 중대한 과실이 없는 경우"},{"n":"2","text":"보험계약 무효 시 보험계약자와 보험수익자가 선의이며 중대한 과실이 없는 경우"},{"n":"3","text":"특별한 위험의 예기로 보험료를 정한 때에 그 위험이 보험기간 중 소멸한 경우"},{"n":"4","text":"보험사고 발생 전의 임의해지 시 미경과보험료에 대해 다른 약정이 없는 경우"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n특별한 위험이 생길 것으로 예상하여 보험료를 정했는데 그 위험이 보험기간 중 소멸하면 그 이후의 위험 수준이 낮아지므로 보험계약자는 보험료 감액을 청구할 수 있다.\n\n오답 확인\n①·②는 무효 계약에서의 보험료 반환 요건을 설명한다. ④는 사고 전 해지에 따른 미경과보험료 반환 문제이다. 감액·반환·해지를 서로 구분한다.\n\n근거·학습주제\n상법 제647조·제648조·제649조","explanationSections":[{"label":"정답 근거","text":"특별한 위험이 생길 것으로 예상하여 보험료를 정했는데 그 위험이 보험기간 중 소멸하면 그 이후의 위험 수준이 낮아지므로 보험계약자는 보험료 감액을 청구할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"①·②는 무효 계약에서의 보험료 반환 요건을 설명한다. ④는 사고 전 해지에 따른 미경과보험료 반환 문제이다. 감액·반환·해지를 서로 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제647조·제648조·제649조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["11-6","12-5","5-7","10-5","2-4"]},{"id":"1-6","round":1,"year":2015,"number":6,"subject":"상법(보험편)","topic":"타인을 위한 보험의 보험료 최고","stem":"보험료에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 계약체결 후 지체없이 보험료의 전부 또는 최초보험료를 지급하여야 한다."},{"n":"2","text":"보험계약자의 최초보험료 미지급시 다른 약정이 없는 한 계약성립 후 2월의 경과로 그\n계약은 해제된 것으로 본다."},{"n":"3","text":"계속보험료 미지급으로 보험자가 계약을 해지하기 위해서는 보험계약자에게 상당기간을\n정하여 그 기간 내에 지급할 것을 최고하여야 한다."},{"n":"4","text":"타인을 위한 보험의 경우 보험계약자의 보험료지급 지체시 보험자는 그 타인에게 보험료\n지급을 최고하지 않아도 계약을 해지할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n특정한 타인을 위한 보험에서 계약자가 보험료 지급을 지체하면 보험자는 그 타인에게도 상당한 기간을 정하여 지급을 최고해야 해제·해지할 수 있다. 따라서 타인에게 최고할 필요가 없다는 ④가 틀리다.\n\n오답 확인\n① 최초보험료는 계약 성립 후 지체 없이 지급한다. ② 다른 약정이 없으면 최초보험료 미지급 계약은 성립 후 2개월에 해제된 것으로 본다. ③ 계속보험료는 상당한 기간의 최고가 선행되어야 한다.\n\n근거·학습주제\n상법 제650조","explanationSections":[{"label":"정답 근거","text":"특정한 타인을 위한 보험에서 계약자가 보험료 지급을 지체하면 보험자는 그 타인에게도 상당한 기간을 정하여 지급을 최고해야 해제·해지할 수 있다. 따라서 타인에게 최고할 필요가 없다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 최초보험료는 계약 성립 후 지체 없이 지급한다. ② 다른 약정이 없으면 최초보험료 미지급 계약은 성립 후 2개월에 해제된 것으로 본다. ③ 계속보험료는 상당한 기간의 최고가 선행되어야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["11-7","7-6","12-7","2-5","9-6","10-5","1-7","3-8","4-9","8-7","8-6","3-7"]},{"id":"1-7","round":1,"year":2015,"number":7,"subject":"상법(보험편)","topic":"보험계약의 부활","stem":"보험계약 부활에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자의 고지의무위반으로 보험자가 보험계약을 해지하여야 한다."},{"n":"2","text":"보험계약자의 최초보험료 미지급으로 보험자가 보험계약을 해지하여야 한다."},{"n":"3","text":"보험계약자가 연체보험료에 법정이자를 더하여 보험자에게 지급하여야 한다."},{"n":"4","text":"보험자가 보험계약을 해지하고 해지환급금을 지급하지 않았어야 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계속보험료 미지급으로 계약이 해지되고 해지환급금이 아직 지급되지 않았을 때 보험계약자는 부활을 청구할 수 있다. 이미 환급금을 지급해 계약관계가 정산된 경우와 구별한다.\n\n오답 확인\n① 고지의무 위반 해지는 법정 부활 대상이 아니다. ② 최초보험료가 아니라 계속보험료 연체 해지이다. ③ 부활 청구 시 붙이는 이자는 법정이자가 아니라 약정이자이다. 청구만으로 당연히 부활하는 것도 아니다.\n\n근거·학습주제\n상법 제650조의2","explanationSections":[{"label":"정답 근거","text":"계속보험료 미지급으로 계약이 해지되고 해지환급금이 아직 지급되지 않았을 때 보험계약자는 부활을 청구할 수 있다. 이미 환급금을 지급해 계약관계가 정산된 경우와 구별한다.","kind":"reason"},{"label":"오답 확인","text":"① 고지의무 위반 해지는 법정 부활 대상이 아니다. ② 최초보험료가 아니라 계속보험료 연체 해지이다. ③ 부활 청구 시 붙이는 이자는 법정이자가 아니라 약정이자이다. 청구만으로 당연히 부활하는 것도 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조의2","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["11-8","1-6","2-6","4-9","11-9","8-8","5-8","3-11","9-6","3-7","8-7","9-7"]},{"id":"1-8","round":1,"year":2015,"number":8,"subject":"상법(보험편)","topic":"고지의무 위반 해지와 사고의 인과관계","stem":"보험계약자의 고지의무위반으로 인한 보험자의 계약해지권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"고지의무위반 사실이 보험사고의 발생에 영향을 미치지 않은 경우 보험자는 계약을 해지\n하더라도 보험금을 지급할 책임이 있다."},{"n":"2","text":"보험자는 보험사고 발생 전에 한하여 해지권을 행사할 수 있다."},{"n":"3","text":"보험자가 계약을 해지한 경우 보험금을 지급할 책임이 없으며 이미 지급한 보험금에 대해\n서는 반환을 청구할 수 없다."},{"n":"4","text":"보험자는 고지의무위반사실을 안 날로부터 3월내에 해지권을 행사할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n고지의무 위반 사실이 보험사고 발생에 영향을 미치지 않았음이 증명되면 보험자가 계약을 해지했더라도 해당 사고의 보험금을 지급해야 한다. 계약해지 가능성과 사고에 대한 면책 여부를 나누어 판단한다.\n\n오답 확인\n② 사고 발생 후에도 해지할 수 있다. ③ 면책 요건이 충족되면 이미 지급한 보험금 반환을 청구할 수 있다. ④ 해지권은 위반 사실을 안 날부터 1개월, 계약 체결일부터 3년이라는 제한을 받는다.\n\n근거·학습주제\n상법 제651조·제655조","explanationSections":[{"label":"정답 근거","text":"고지의무 위반 사실이 보험사고 발생에 영향을 미치지 않았음이 증명되면 보험자가 계약을 해지했더라도 해당 사고의 보험금을 지급해야 한다. 계약해지 가능성과 사고에 대한 면책 여부를 나누어 판단한다.","kind":"reason"},{"label":"오답 확인","text":"② 사고 발생 후에도 해지할 수 있다. ③ 면책 요건이 충족되면 이미 지급한 보험금 반환을 청구할 수 있다. ④ 해지권은 위반 사실을 안 날부터 1개월, 계약 체결일부터 3년이라는 제한을 받는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제651조·제655조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["3-11","5-8","6-17","11-9","9-8","7-11","12-8","2-13","7-7"]},{"id":"1-9","round":1,"year":2015,"number":9,"subject":"상법(보험편)","topic":"위험변경·증가의 통지","stem":"위험의 변경증가에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 위험변경증가통지의무는 보험계약자 또는 피보험자가 부담한다.\nㄴ. 보험계약자의 위험변경증가통지의무는 피보험자의 행위로 인한 위험변경의\n경우에 한한다.\nㄷ. 보험자는 위험변경증가통지를 받은 때로부터 1월 이내에 보험료의 증액을\n청구할 수 있다.\nㄹ. 보험자는 위험변경증가의 사실을 안 날로부터 6월 이내에 한하여 계약을\n해지할 수 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\nㄱ과 ㄷ이 옳다. 보험기간 중 사고 위험이 현저하게 변경·증가한 사실을 알게 된 계약자 또는 피보험자는 지체 없이 통지해야 하고, 보험자는 통지를 받은 때부터 1개월 이내에 증액청구 또는 해지를 할 수 있다.\n\n오답 확인\nㄴ은 잘못이다. 통지 대상 위험은 피보험자의 행위로 생긴 경우에만 한정되지 않는다. ㄹ의 6개월도 틀리며 법정 기간은 1개월이다.\n\n근거·학습주제\n상법 제652조","explanationSections":[{"label":"정답 근거","text":"ㄱ과 ㄷ이 옳다. 보험기간 중 사고 위험이 현저하게 변경·증가한 사실을 알게 된 계약자 또는 피보험자는 지체 없이 통지해야 하고, 보험자는 통지를 받은 때부터 1개월 이내에 증액청구 또는 해지를 할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ은 잘못이다. 통지 대상 위험은 피보험자의 행위로 생긴 경우에만 한정되지 않는다. ㄹ의 6개월도 틀리며 법정 기간은 1개월이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["4-10","2-14","7-9","6-19","11-10","10-9","8-10"]},{"id":"1-10","round":1,"year":2015,"number":10,"subject":"상법(보험편)","topic":"보험료 지급방법과 책임개시","stem":"보험료의 지급과 보험자의 책임개시에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험설계사는 보험자가 작성한 영수증을 보험계약자에게 교부하는 경우에만 보험료수령권이\n있다."},{"n":"2","text":"보험자의 책임은 당사자 간에 다른 약정이 없으면 최초 보험료를 지급 받은 때로부터 개시\n한다."},{"n":"3","text":"보험료불가분의 원칙에 의해 보험계약자는 다른 약정이 있더라도 일시에 보험료를 지급\n하여야 한다."},{"n":"4","text":"보험자의 보험료청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험료를 반드시 한꺼번에 내야 한다는 ③이 틀리다. 보험료 분납 약정은 가능하며, 보험료불가분이라는 용어를 일시납 의무와 동일시해서는 안 된다.\n\n오답 확인\n① 보험자가 작성한 영수증을 교부하는 설계사의 수령권과, 일반적으로 설계사에게 포괄적 대리권이 없다는 점을 구별한다. ② 다른 약정이 없으면 최초보험료를 받은 때 책임이 시작된다. ④ 보험료청구권의 시효는 2년이다.\n\n근거·학습주제\n상법 제650조·제656조·제662조","explanationSections":[{"label":"정답 근거","text":"보험료를 반드시 한꺼번에 내야 한다는 ③이 틀리다. 보험료 분납 약정은 가능하며, 보험료불가분이라는 용어를 일시납 의무와 동일시해서는 안 된다.","kind":"reason"},{"label":"오답 확인","text":"① 보험자가 작성한 영수증을 교부하는 설계사의 수령권과, 일반적으로 설계사에게 포괄적 대리권이 없다는 점을 구별한다. ② 다른 약정이 없으면 최초보험료를 받은 때 책임이 시작된다. ④ 보험료청구권의 시효는 2년이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조·제656조·제662조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["2-5","11-7","3-6","8-12"]},{"id":"1-11","round":1,"year":2015,"number":11,"subject":"상법(보험편)","topic":"보험자의 보상위험과 면책","stem":"보험자의 보험금 지급과 면책사유에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험금은 당사자 간에 특약이 있는 경우라도 금전이외의 현물로 지급할 수 없다."},{"n":"2","text":"보험자의 보험금 지급은 보험사고발생의 통지를 받은 후 10일 이내에 지급할 보험금액을\n정하고 10일 이후에 이를 지급하여야 한다."},{"n":"3","text":"보험의 목적인 과일의 자연 부패로 인하여 발생한 손해에 대해서 보험자는 보험금을 지급\n하여야 한다."},{"n":"4","text":"건물을 특약 없는 화재보험에 가입한 보험계약에서 홍수로 건물이 멸실된 경우 보험자는\n보험금을 지급하지 않아도 된다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n특약 없는 화재보험은 화재 위험을 담보하는 계약이므로 홍수라는 별도의 비담보 위험만으로 건물이 멸실된 때에는 보험자가 보상하지 않을 수 있다. 따라서 ④가 옳다.\n\n오답 확인\n① 당사자 약정에 따른 현물보상이 가능하다. ② 지급기간 약정이 없으면 지급보험금을 지체 없이 정하고 결정 후 10일 이내에 지급한다. ③ 자연부패 같은 보험목적의 성질·하자에 의한 손해는 원칙적 면책이다.\n\n근거·학습주제\n상법 제658조·제665조·제678조","explanationSections":[{"label":"정답 근거","text":"특약 없는 화재보험은 화재 위험을 담보하는 계약이므로 홍수라는 별도의 비담보 위험만으로 건물이 멸실된 때에는 보험자가 보상하지 않을 수 있다. 따라서 ④가 옳다.","kind":"reason"},{"label":"오답 확인","text":"① 당사자 약정에 따른 현물보상이 가능하다. ② 지급기간 약정이 없으면 지급보험금을 지체 없이 정하고 결정 후 10일 이내에 지급한다. ③ 자연부패 같은 보험목적의 성질·하자에 의한 손해는 원칙적 면책이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제658조·제665조·제678조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["3-12","4-12","9-13","12-10","2-18","10-11","11-12","7-14"]},{"id":"1-12","round":1,"year":2015,"number":12,"subject":"상법(보험편)","topic":"재보험의 성질","stem":"재보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"재보험계약은 원보험계약의 효력에 영향을 미치지 않는다."},{"n":"2","text":"화재보험에 관한 규정을 준용한다."},{"n":"3","text":"재보험자의 제3자에 대한 대위권행사가 인정된다."},{"n":"4","text":"보험계약자의 불이익변경금지원칙은 적용되지 않는다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n재보험은 보험자가 부담하는 책임을 다시 보험에 붙이는 계약이다. 재보험에 화재보험 규정을 일반적으로 준용한다는 ②는 틀리다. 원보험이 화재보험이라는 이유만으로 재보험 자체가 화재보험이 되는 것은 아니다.\n\n오답 확인\n① 원보험계약의 효력은 재보험 가입 여부의 영향을 받지 않는다. ③ 재보험금 지급에 따른 권리대위가 인정될 수 있다. ④ 재보험에는 보험계약자 등의 불이익변경금지에 대한 법정 예외가 적용된다.\n\n근거·학습주제\n상법 제661조·제663조","explanationSections":[{"label":"정답 근거","text":"재보험은 보험자가 부담하는 책임을 다시 보험에 붙이는 계약이다. 재보험에 화재보험 규정을 일반적으로 준용한다는 ②는 틀리다. 원보험이 화재보험이라는 이유만으로 재보험 자체가 화재보험이 되는 것은 아니다.","kind":"reason"},{"label":"오답 확인","text":"① 원보험계약의 효력은 재보험 가입 여부의 영향을 받지 않는다. ③ 재보험금 지급에 따른 권리대위가 인정될 수 있다. ④ 재보험에는 보험계약자 등의 불이익변경금지에 대한 법정 예외가 적용된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제661조·제663조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["4-18","3-13","12-16"]},{"id":"1-13","round":1,"year":2015,"number":13,"subject":"상법(보험편)","topic":"고지의무와 고지수령권","stem":"고지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험설계사는 고지수령권을 가진다."},{"n":"2","text":"보험자가 서면으로 질문한 사항은 중요한 사항으로 추정한다."},{"n":"3","text":"고지의무를 부담하는 자는 보험계약자와 피보험자이다."},{"n":"4","text":"고지의무자의 고의 또는 중대한 과실로 부실의 고지를 한 경우 고지의무 위반이 된다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험설계사는 통상 보험계약 체결을 중개하는 지위로서 보험자의 고지수령권을 당연히 갖지 않는다. 설계사에게 구두로 말했다는 사실만으로 보험자에게 적법하게 고지했다고 단정할 수 없다.\n\n오답 확인\n② 보험자의 서면 질문사항은 중요한 사항으로 추정된다. ③ 고지의무자는 계약자와 피보험자이다. ④ 중요한 사항의 불고지·부실고지에 고의 또는 중대한 과실이 있어야 법정 해지 요건을 충족한다.\n\n근거·학습주제\n상법 제651조·제651조의2","explanationSections":[{"label":"정답 근거","text":"보험설계사는 통상 보험계약 체결을 중개하는 지위로서 보험자의 고지수령권을 당연히 갖지 않는다. 설계사에게 구두로 말했다는 사실만으로 보험자에게 적법하게 고지했다고 단정할 수 없다.","kind":"reason"},{"label":"오답 확인","text":"② 보험자의 서면 질문사항은 중요한 사항으로 추정된다. ③ 고지의무자는 계약자와 피보험자이다. ④ 중요한 사항의 불고지·부실고지에 고의 또는 중대한 과실이 있어야 법정 해지 요건을 충족한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제651조·제651조의2","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["9-8","2-13","4-7","8-9","12-8","3-9","7-7","11-9","5-8"]},{"id":"1-14","round":1,"year":2015,"number":14,"subject":"상법(보험편)","topic":"보험금청구권의 소멸시효","stem":"보험자의 손해보상의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해보험계약의 보험자는 보험사고로 인하여 생길 피보험자의 재산상의 손해를 보상할\n책임이 있다."},{"n":"2","text":"보험자의 보험금 지급의무는 2년의 단기시효로 소멸한다."},{"n":"3","text":"화재보험계약의 목적을 건물의 소유권으로 한 경우 보험사고로 인하여 피보험자가 얻을\n임대료수입은 특약이 없는 한 보험자가 보상할 손해액에 산입하지 않는다."},{"n":"4","text":"신가보험은 손해보험의 이득금지원칙에도 불구하고 인정된다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험금청구권의 소멸시효를 2년이라고 한 ②가 틀리다. 2014년 개정 상법은 2015년 3월 12일부터 해당 시효를 3년으로 정했으므로 2015년 제1회 시험에서도 3년을 기준으로 풀이한다.\n\n오답 확인\n① 손해보험의 기본 급부는 피보험자의 재산상 손해 보상이다. ③ 특별한 약정이 없으면 일실이익은 손해액에 넣지 않는다. ④ 신가보험은 법이 인정하는 특약에 따라 신품가액으로 평가할 수 있다.\n\n기준 변경 메모\n현재도 보험금청구권 3년, 보험료·적립금 반환청구권 3년, 보험료청구권 2년을 구별한다.\n\n근거·학습주제\n상법 제662조·제665조·제676조 및 2014년 개정 부칙","explanationSections":[{"label":"정답 근거","text":"보험금청구권의 소멸시효를 2년이라고 한 ②가 틀리다. 2014년 개정 상법은 2015년 3월 12일부터 해당 시효를 3년으로 정했으므로 2015년 제1회 시험에서도 3년을 기준으로 풀이한다.","kind":"reason"},{"label":"오답 확인","text":"① 손해보험의 기본 급부는 피보험자의 재산상 손해 보상이다. ③ 특별한 약정이 없으면 일실이익은 손해액에 넣지 않는다. ④ 신가보험은 법이 인정하는 특약에 따라 신품가액으로 평가할 수 있다.","kind":"incorrect"},{"label":"기준 변경 메모","text":"현재도 보험금청구권 3년, 보험료·적립금 반환청구권 3년, 보험료청구권 2년을 구별한다.","kind":"note"},{"label":"근거·학습주제","text":"상법 제662조·제665조·제676조 및 2014년 개정 부칙","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["3-21","5-13","9-17"]},{"id":"1-15","round":1,"year":2015,"number":15,"subject":"상법(보험편)","topic":"피보험이익의 독립성","stem":"손해보험계약에서의 피보험이익에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"피보험이익은 보험의 도박화를 방지하는 기능이 있다."},{"n":"2","text":"피보험이익은 적법한 것이어야 한다."},{"n":"3","text":"피보험이익은 보험자의 책임범위를 정하는 표준이 된다."},{"n":"4","text":"동일한 건물에 대하여 소유권자와 저당권자는 각자 독립한 보험계약을 체결할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n소유자와 저당권자는 동일한 건물에 대해 서로 다른 경제적 이해관계를 갖는다. 각자의 피보험이익을 대상으로 독립한 보험계약을 체결할 수 있으므로 불가능하다는 ④가 틀리다.\n\n오답 확인\n① 피보험이익은 도박보험을 막는다. ② 적법한 이익이어야 한다. ③ 보험자가 보상할 손해의 범위를 정하는 기준이다. 같은 목적물이라는 사정만으로 같은 피보험이익이나 중복보험이 되는 것은 아니다.\n\n근거·학습주제\n상법 제668조 및 피보험이익 법리","explanationSections":[{"label":"정답 근거","text":"소유자와 저당권자는 동일한 건물에 대해 서로 다른 경제적 이해관계를 갖는다. 각자의 피보험이익을 대상으로 독립한 보험계약을 체결할 수 있으므로 불가능하다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 피보험이익은 도박보험을 막는다. ② 적법한 이익이어야 한다. ③ 보험자가 보상할 손해의 범위를 정하는 기준이다. 같은 목적물이라는 사정만으로 같은 피보험이익이나 중복보험이 되는 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제668조 및 피보험이익 법리","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":[]},{"id":"1-16","round":1,"year":2015,"number":16,"subject":"상법(보험편)","topic":"협정보험가액의 한계","stem":"기평가보험과 미평가보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"기평가보험이란 보험계약 체결시 당사자간에 피보험이익의 평가에 관하여 미리 합의한\n보험을 말한다."},{"n":"2","text":"기평가보험의 경우 당사자간에 보험가액을 정한 때에는 그 가액은 사고발생시의 가액으로\n정한 것으로 추정한다."},{"n":"3","text":"기평가보험의 경우 협정보험가액이 사고발생시의 가액을 현저하게 초과할 때에는 협정\n보험가액을 보험가액으로 한다."},{"n":"4","text":"보험계약체결시 당사자간에 보험가액을 정하지 아니한 경우에는 사고발생시의 가액을\n보험가액으로 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n기평가보험의 협정보험가액이 사고 시 실제 가액을 현저하게 초과하면 실제 사고 시 가액을 보험가액으로 한다. 현저한 초과에도 합의한 가액을 그대로 쓴다는 ③이 틀리다.\n\n오답 확인\n① 체결 시 평가액을 정한 것이 기평가보험이다. ② 협정액은 사고 시 가액으로 정한 것으로 추정된다. ④ 미평가보험은 사고발생 시 가액을 보험가액으로 삼는다. 협정액과 무조건 지급액이 같은 것은 아니다.\n\n근거·학습주제\n상법 제670조·제671조","explanationSections":[{"label":"정답 근거","text":"기평가보험의 협정보험가액이 사고 시 실제 가액을 현저하게 초과하면 실제 사고 시 가액을 보험가액으로 한다. 현저한 초과에도 합의한 가액을 그대로 쓴다는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 체결 시 평가액을 정한 것이 기평가보험이다. ② 협정액은 사고 시 가액으로 정한 것으로 추정된다. ④ 미평가보험은 사고발생 시 가액을 보험가액으로 삼는다. 협정액과 무조건 지급액이 같은 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제670조·제671조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["11-16","4-17","5-15","9-12","12-15","3-20","10-15","2-9","6-25"]},{"id":"1-17","round":1,"year":2015,"number":17,"subject":"상법(보험편)","topic":"중복보험의 연대책임","stem":"중복보험에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 중복보험계약이 동시에 체결된 경우든 다른 때에 체결된 경우든 각 보험\n자는 각자의 보험금액의 한도에서 연대책임을 진다.\nㄴ. 중복보험의 경우 보험자 1인에 대한 권리의 포기는 다른 보험자의 권리\n의무에 영향을 미치지 않는다.\nㄷ. 중복보험계약이 보험계약자의 사기로 인하여 체결된 때에는 그 계약은\n무효가 되므로 보험자는 그 사실을 안 때까지의 보험료를 청구할 수 없다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\nㄱ과 ㄴ이 옳다. 동시·이시 체결을 불문하고 동일 사고의 중복보험에서는 각 보험자가 각 보험금액 한도에서 연대책임을 진다. 보험자 한 사람에 대한 권리 포기는 다른 보험자의 권리·의무에 영향을 주지 않는다.\n\n오답 확인\nㄷ은 사기로 인한 중복보험의 무효와 보험료 청구의 효과를 혼동했다. 사기 계약은 무효이지만 보험자는 사기 사실을 안 때까지의 보험료를 청구할 수 있다.\n\n근거·학습주제\n상법 제669조·제672조·제673조","explanationSections":[{"label":"정답 근거","text":"ㄱ과 ㄴ이 옳다. 동시·이시 체결을 불문하고 동일 사고의 중복보험에서는 각 보험자가 각 보험금액 한도에서 연대책임을 진다. 보험자 한 사람에 대한 권리 포기는 다른 보험자의 권리·의무에 영향을 주지 않는다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ은 사기로 인한 중복보험의 무효와 보험료 청구의 효과를 혼동했다. 사기 계약은 무효이지만 보험자는 사기 사실을 안 때까지의 보험료를 청구할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조·제672조·제673조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["7-17","4-19","9-18","3-19","5-18","8-18","2-11"]},{"id":"1-18","round":1,"year":2015,"number":18,"subject":"상법(보험편)","topic":"보험가액과 보험금액의 구별","stem":"보험가액에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자의 계약상의 최고보상한도로서의 의미를 가진다."},{"n":"2","text":"일부보험은 어느 경우에도 보험자가 보험가액을 한도로 실제손해를 보상할 책임을 진다."},{"n":"3","text":"피보험이익을 금전으로 평가한 가액을 의미한다."},{"n":"4","text":"보험가액은 보험금액과 항상 일치한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험가액은 피보험이익을 금전으로 평가한 가액이다. 보험금액은 계약에서 정한 지급책임의 최고한도라는 점에서 두 개념을 구별해야 하므로 ③이 옳다.\n\n오답 확인\n①은 보험금액에 가까운 설명이다. ② 일부보험은 특약이 없으면 비례보상한다. ④ 보험금액과 보험가액은 전부보험에서는 같을 수 있지만 일부보험·초과보험에서는 다르다.\n\n근거·학습주제\n상법 제668조·제669조·제674조","explanationSections":[{"label":"정답 근거","text":"보험가액은 피보험이익을 금전으로 평가한 가액이다. 보험금액은 계약에서 정한 지급책임의 최고한도라는 점에서 두 개념을 구별해야 하므로 ③이 옳다.","kind":"reason"},{"label":"오답 확인","text":"①은 보험금액에 가까운 설명이다. ② 일부보험은 특약이 없으면 비례보상한다. ④ 보험금액과 보험가액은 전부보험에서는 같을 수 있지만 일부보험·초과보험에서는 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제668조·제669조·제674조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":[]},{"id":"1-19","round":1,"year":2015,"number":19,"subject":"상법(보험편)","topic":"손해액 산정비용의 부담","stem":"손해보험에서 손해액을 산정하는 기준으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액은 그 손해가 발생한 때와 곳의 가액에 의하여 산정한다."},{"n":"2","text":"다른 약정이 있으면 신품가액에 의하여 손해액을 산정할 수 있다."},{"n":"3","text":"손해액 산정 비용은 보험계약자의 부담으로 한다."},{"n":"4","text":"다른 약정이 없으면 보험자가 보상할 손해액에는 피보험자가 얻을 이익을 산입하지 않는다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보상손해액을 산정하는 데 필요한 비용은 보험자가 부담한다. 보험계약자가 부담한다는 ③이 틀리다. 사고 자체의 복구비와 평가·산정에 필요한 비용을 구별한다.\n\n오답 확인\n① 사고가 난 때와 장소의 가액이 원칙이다. ② 신가보상 특약은 신품가액 기준을 허용한다. ④ 별도 약정이 없으면 얻을 이익은 산입하지 않는다.\n\n근거·학습주제\n상법 제676조","explanationSections":[{"label":"정답 근거","text":"보상손해액을 산정하는 데 필요한 비용은 보험자가 부담한다. 보험계약자가 부담한다는 ③이 틀리다. 사고 자체의 복구비와 평가·산정에 필요한 비용을 구별한다.","kind":"reason"},{"label":"오답 확인","text":"① 사고가 난 때와 장소의 가액이 원칙이다. ② 신가보상 특약은 신품가액 기준을 허용한다. ④ 별도 약정이 없으면 얻을 이익은 산입하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["10-19","2-22","6-4","3-25","12-19","8-21","9-20","4-21","7-20","5-20"]},{"id":"1-20","round":1,"year":2015,"number":20,"subject":"상법(보험편)","topic":"담보사고 후 비담보사고의 발생","stem":"보험의 목적에 보험자의 담보 위험으로 인한 손해가 발생한 후 그 목적이 보험자의\n비담보 위험으로 멸실된 경우 보험자의 보상책임은?","options":[{"n":"1","text":"보험자는 모든 책임에서 면책된다."},{"n":"2","text":"보험자의 담보 위험으로 인한 손해만 보상한다."},{"n":"3","text":"보험자의 비담보 위험으로 인한 손해만 보상한다."},{"n":"4","text":"보험자는 멸실된 손해 전체를 보상한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n먼저 담보위험으로 생긴 손해에 대한 보험자의 책임은 뒤에 비담보위험으로 목적물이 멸실되었다고 소급하여 없어지지 않는다. 따라서 처음의 담보위험 손해를 보상하는 ②가 옳다.\n\n오답 확인\n①처럼 전부 면책되지는 않으며, ③·④처럼 뒤의 비담보사고로 생긴 손해까지 보상하는 것도 아니다. 사고별 발생 원인과 손해 범위를 분리해 평가한다.\n\n근거·학습주제\n상법 제675조","explanationSections":[{"label":"정답 근거","text":"먼저 담보위험으로 생긴 손해에 대한 보험자의 책임은 뒤에 비담보위험으로 목적물이 멸실되었다고 소급하여 없어지지 않는다. 따라서 처음의 담보위험 손해를 보상하는 ②가 옳다.","kind":"reason"},{"label":"오답 확인","text":"①처럼 전부 면책되지는 않으며, ③·④처럼 뒤의 비담보사고로 생긴 손해까지 보상하는 것도 아니다. 사고별 발생 원인과 손해 범위를 분리해 평가한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제675조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":[]},{"id":"1-21","round":1,"year":2015,"number":21,"subject":"상법(보험편)","topic":"손해방지의무의 대상","stem":"보험계약자 및 피보험자의 손해방지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해의 방지와 경감을 위하여 노력하여야 한다."},{"n":"2","text":"손해방지와 경감을 위하여 필요 또는 유익하였던 비용과 보상액이 보험금액을 초과한 경우\n보험자가 이를 부담한다."},{"n":"3","text":"보험사고 발생을 전제로 하므로 보험사고가 발생하면 생기는 것이다."},{"n":"4","text":"보험자가 책임을 지지 않는 손해에 대해서도 손해방지의무를 부담한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n손해방지의무는 해당 보험계약에서 보험자가 보상할 손해의 발생·확대를 방지하기 위한 의무이다. 보험자가 책임지지 않는 손해까지 당연히 포함한다는 ④가 틀리다.\n\n오답 확인\n① 손해 방지·경감에 노력해야 한다. ② 필요·유익한 비용은 보상액과 합해 보험금액을 초과해도 보험자 부담이 될 수 있다. ③은 보험사고 발생에 따른 손해 확대 방지 의무라는 취지이며, 사고 방지에 관한 일반적 안전관리와 구별한다.\n\n근거·학습주제\n상법 제680조","explanationSections":[{"label":"정답 근거","text":"손해방지의무는 해당 보험계약에서 보험자가 보상할 손해의 발생·확대를 방지하기 위한 의무이다. 보험자가 책임지지 않는 손해까지 당연히 포함한다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 손해 방지·경감에 노력해야 한다. ② 필요·유익한 비용은 보상액과 합해 보험금액을 초과해도 보험자 부담이 될 수 있다. ③은 보험사고 발생에 따른 손해 확대 방지 의무라는 취지이며, 사고 방지에 관한 일반적 안전관리와 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제680조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["12-21","10-21","5-22","8-23","2-10","11-20","7-21"]},{"id":"1-22","round":1,"year":2015,"number":22,"subject":"상법(보험편)","topic":"보험목적의 성질과 하자","stem":"손해보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험의 목적의 성질 및 하자로 인한 손해는 보험자가 보상할 책임이 있다."},{"n":"2","text":"피보험이익은 적어도 사고발생시까지 확정할 수 있는 것이어야 한다."},{"n":"3","text":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 않은 잔액이 있으면 이를 공제할\n수 있다."},{"n":"4","text":"경제적 가치를 평가할 수 있는 이익은 피보험이익이 된다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험목적 자체의 성질, 하자 또는 자연소모로 인한 손해는 보험자의 원칙적 면책사유이다. 보상책임이 있다고 일반화한 ①이 틀리다.\n\n오답 확인\n② 피보험이익은 적어도 사고 시 확정 가능해야 한다. ③ 보험금 지급 시 미수 보험료 잔액을 공제할 수 있다. ④ 금전으로 평가할 수 있는 적법한 경제적 이익이 손해보험의 대상이다.\n\n근거·학습주제\n상법 제668조·제677조·제678조","explanationSections":[{"label":"정답 근거","text":"보험목적 자체의 성질, 하자 또는 자연소모로 인한 손해는 보험자의 원칙적 면책사유이다. 보상책임이 있다고 일반화한 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"② 피보험이익은 적어도 사고 시 확정 가능해야 한다. ③ 보험금 지급 시 미수 보험료 잔액을 공제할 수 있다. ④ 금전으로 평가할 수 있는 적법한 경제적 이익이 손해보험의 대상이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제668조·제677조·제678조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":[]},{"id":"1-23","round":1,"year":2015,"number":23,"subject":"상법(보험편)","topic":"잔존물대위의 성립","stem":"잔존물 대위에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험의 목적 일부가 멸실한 경우 발생한다."},{"n":"2","text":"보험금액의 전부를 지급하여야 보험자가 잔존물 대위권을 취득할 수 있다."},{"n":"3","text":"일부보험의 경우에는 잔존물 대위가 인정되지 않는다."},{"n":"4","text":"보험자는 잔존물에 대한 물권변동의 절차를 밟아야 대위권을 취득할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험목적 전부가 멸실하고 보험자가 보험금액 전부를 지급한 경우 잔존물에 관한 피보험자의 권리를 법률상 취득한다. 따라서 보험금액 전부의 지급을 요구하는 ②가 옳다.\n\n오답 확인\n① 일부 멸실만으로 당연히 성립하지 않는다. ③ 일부보험에서도 보험금액의 보험가액에 대한 비율에 따라 권리를 취득할 수 있다. ④ 별도의 물권변동 행위가 있어야만 성립하는 것이 아니라 법정대위이다.\n\n근거·학습주제\n상법 제681조","explanationSections":[{"label":"정답 근거","text":"보험목적 전부가 멸실하고 보험자가 보험금액 전부를 지급한 경우 잔존물에 관한 피보험자의 권리를 법률상 취득한다. 따라서 보험금액 전부의 지급을 요구하는 ②가 옳다.","kind":"reason"},{"label":"오답 확인","text":"① 일부 멸실만으로 당연히 성립하지 않는다. ③ 일부보험에서도 보험금액의 보험가액에 대한 비율에 따라 권리를 취득할 수 있다. ④ 별도의 물권변동 행위가 있어야만 성립하는 것이 아니라 법정대위이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제681조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["10-22","6-7","3-24","11-21","7-22"]},{"id":"1-24","round":1,"year":2015,"number":24,"subject":"상법(보험편)","topic":"보험가액 상승과 일부보험","stem":"일부보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험금액이 보험가액보다 작아야 한다."},{"n":"2","text":"다른 약정이 없으면 보험자는 보험금액의 보험가액에 대한 비율에 따라 보상책임을 진다."},{"n":"3","text":"특약이 없는 경우 보험기간 중에 물가 상승으로 보험가액이 증가한 때에는 일부보험으로\n판단하지 않는다."},{"n":"4","text":"다른 약정이 없으면 손해방지비용에 대해서도 비례보상주의를 따른다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일부보험 여부는 보험금액과 보험가액을 비교해 판단한다. 계약 후 물가 상승으로 사고 시 보험가액이 보험금액보다 커졌다면 일부보험이 될 수 있으므로 이를 무조건 부정한 ③이 틀리다.\n\n오답 확인\n① 보험금액＜보험가액이다. ② 별도 약정이 없으면 손해액에 보험금액/보험가액을 곱한다. ④ 일부보험의 손해방지비용 역시 이다. 농기계재해보험은 이 문항의 농어업재해보험법상 종류에 들어 있지 않으므로 ①이 옳다.\n\n오답 확인\n농업과 관련한 보험이라고 해서 모두 이 법의 재해보험이 되는 것은 아니다. 농기계종합보험 등 다른 정책보험과 법정 재해보험의 분류를 구별한다.\n\n근거·학습주제\n농어업재해보험법 제4조","explanationSections":[{"label":"정답 근거","text":"법이 정한 보험은 농작물·임산물·가축·양식수산물재해보험이다. 농기계재해보험은 이 문항의 농어업재해보험법상 종류에 들어 있지 않으므로 ①이 옳다.","kind":"reason"},{"label":"오답 확인","text":"농업과 관련한 보험이라고 해서 모두 이 법의 재해보험이 되는 것은 아니다. 농기계종합보험 등 다른 정책보험과 법정 재해보험의 분류를 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제4조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":15,"similarIds":["9-40","10-27","12-38","4-42","5-37","4-29","2-28","6-31","12-27","11-39"]},{"id":"1-29","round":1,"year":2015,"number":29,"subject":"농어업재해보험법령","topic":"출제 당시의 보험목적물","stem":"현행 농어업재해보험법령상 재해보험의 보험목적물이 아닌 것은?","options":[{"n":"1","text":"옥수수"},{"n":"2","text":"밀"},{"n":"3","text":"국화"},{"n":"4","text":"복분자"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n2015년 최종정답은 밀을 고르는 ②이다. 당시 시행되는 목적물 범위에서 밀은 보험대상이 아니었고, 옥수수·국화·복분자는 해당했다. 이 문항은 보험대상 품목이 시기별로 확대되는 제도임을 전제로 풀어야 한다.\n\n오답 확인\n2026년 기본서에는 밀이 논작물의 보험대상으로 수록되어 있다. 따라서 현재 품목 목록만으로 보기 ②를 오답 처리하거나, 현재도 밀이 보험목적물이 아니라고 외우면 안 된다.\n\n기준 변경 메모\n2026년 기준 밀은 보험대상이다. 현재 기준으로는 기존 보기의 단일정답 구조가 유지되지 않는 역사적 문항이다.\n\n근거·학습주제\n2015년 최종정답 및 출제 당시 보험목적물 범위","explanationSections":[{"label":"정답 근거","text":"2015년 최종정답은 밀을 고르는 ②이다. 당시 시행되는 목적물 범위에서 밀은 보험대상이 아니었고, 옥수수·국화·복분자는 해당했다. 이 문항은 보험대상 품목이 시기별로 확대되는 제도임을 전제로 풀어야 한다.","kind":"reason"},{"label":"오답 확인","text":"2026년 기본서에는 밀이 논작물의 보험대상으로 수록되어 있다. 따라서 현재 품목 목록만으로 보기 ②를 오답 처리하거나, 현재도 밀이 보험목적물이 아니라고 외우면 안 된다.","kind":"incorrect"},{"label":"기준 변경 메모","text":"2026년 기준 밀은 보험대상이다. 현재 기준으로는 기존 보기의 단일정답 구조가 유지되지 않는 역사적 문항이다.","kind":"note"},{"label":"근거·학습주제","text":"2015년 최종정답 및 출제 당시 보험목적물 범위","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":[]},{"id":"1-30","round":1,"year":2015,"number":30,"subject":"농어업재해보험법령","topic":"벼의 보상 병충해","stem":"재해보험에서 보상하는 재해의 범위 중 보험목적물 “벼”에서 보상하는 병충해가 아닌\n것은?","options":[{"n":"1","text":"흰잎마름병"},{"n":"2","text":"잎집무늬마름병"},{"n":"3","text":"줄무늬잎마름병"},{"n":"4","text":"벼멸구"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n잎집무늬마름병은 문제에서 제시한 벼의 보상 병충해에 해당하지 않는다. 병명에 '마름병'이 포함되어 비슷해 보여도 흰잎마름병·줄무늬잎마름병과 별개의 병이다.\n\n오답 확인\n흰잎마름병, 줄무늬잎마름병, 벼멸구는 보상대상에 포함된다. 병충해 보장특약 가입 여부와 약관이 열거한 병·해충명을 함께 확인해야 한다.\n\n기준 변경 메모\n2026 기본서는 보상 병충해를 7종으로 설명하며 잎집무늬마름병은 포함하지 않는다.\n\n근거·학습주제\n보상하는 병충해 규정 및 2026 기본서 논작물 상품","explanationSections":[{"label":"정답 근거","text":"잎집무늬마름병은 문제에서 제시한 벼의 보상 병충해에 해당하지 않는다. 병명에 '마름병'이 포함되어 비슷해 보여도 흰잎마름병·줄무늬잎마름병과 별개의 병이다.","kind":"reason"},{"label":"오답 확인","text":"흰잎마름병, 줄무늬잎마름병, 벼멸구는 보상대상에 포함된다. 병충해 보장특약 가입 여부와 약관이 열거한 병·해충명을 함께 확인해야 한다.","kind":"incorrect"},{"label":"기준 변경 메모","text":"2026 기본서는 보상 병충해를 7종으로 설명하며 잎집무늬마름병은 포함하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"보상하는 병충해 규정 및 2026 기본서 논작물 상품","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":[]},{"id":"1-31","round":1,"year":2015,"number":31,"subject":"농어업재해보험법령","topic":"요율 산정단위","stem":"농어업재해보험법령상 재해보험 요율산정에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험사업자가 산정한다."},{"n":"2","text":"보험목적물별 또는 보상방식별로 산정한다."},{"n":"3","text":"객관적이고 합리적인 통계자료를 기초로 산정한다."},{"n":"4","text":"시ㆍ군ㆍ자치구 또는 읍ㆍ면ㆍ동 행정구역 단위까지 산정한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n출제 당시 요율은 보험목적물별 또는 보상방식별로 사업자가 객관적이고 합리적인 통계에 따라 산정하며 행정구역 단위에서 통계자료가 있는 최소단위까지 세분할 수 있었다. 이를 읍·면·동까지만이라고 제한한 ④가 틀리다.\n\n오답 확인\n① 산정주체, ② 목적물·보상방식별 구분, ③ 통계자료의 객관성·합리성은 옳다. 행정구역 명칭을 외우는 것보다 마지막 세분화 범위가 제한인지 여부를 확인한다.\n\n근거·학습주제\n농어업재해보험법 제9조 및 당시 시행령","explanationSections":[{"label":"정답 근거","text":"출제 당시 요율은 보험목적물별 또는 보상방식별로 사업자가 객관적이고 합리적인 통계에 따라 산정하며 행정구역 단위에서 통계자료가 있는 최소단위까지 세분할 수 있었다. 이를 읍·면·동까지만이라고 제한한 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 산정주체, ② 목적물·보상방식별 구분, ③ 통계자료의 객관성·합리성은 옳다. 행정구역 명칭을 외우는 것보다 마지막 세분화 범위가 제한인지 여부를 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제9조 및 당시 시행령","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["4-30","5-39"]},{"id":"1-32","round":1,"year":2015,"number":32,"subject":"농어업재해보험법령","topic":"손해평가인의 경작경력 요건","stem":"농어업재해보험법령상 농작물재해보험 손해평가인으로 위촉될 수 있는 자의 자격요건이\n아닌 것은?","options":[{"n":"1","text":"「농수산물 품질관리법」에 따른 농산물품질관리사"},{"n":"2","text":"재해보험 대상 농작물을 3년 이상 경작한 경력이 있는 농업인"},{"n":"3","text":"재해보험 대상 농작물 분야에서 「국가기술자격법」에 따른 기사 이상의 자격을 소지한 사람"},{"n":"4","text":"공무원으로 지방자치단체에서 농작물재배 분야에 관한 연구ㆍ지도 업무를 3년 이상 담당\n한 경력이 있는 사람"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n대상 농작물을 경작한 농업인이 손해평가인으로 위촉될 때 요구되는 경작경력은 5년 이상이다. 3년이라고 한 ②는 이 기준에 미달한다.\n\n오답 확인\n① 농산물품질관리사, ③ 관련 분야 기사 이상 자격자, ④ 농작물 재배 분야 연구·지도업무를 3년 이상 맡은 공무원은 출제 당시 자격요건에 해당한다. 농업인 경작 5년과 공무원 연구·지도 3년을 구별한다.\n\n근거·학습주제\n농어업재해보험법 시행령 제12조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"대상 농작물을 경작한 농업인이 손해평가인으로 위촉될 때 요구되는 경작경력은 5년 이상이다. 3년이라고 한 ②는 이 기준에 미달한다.","kind":"reason"},{"label":"오답 확인","text":"① 농산물품질관리사, ③ 관련 분야 기사 이상 자격자, ④ 농작물 재배 분야 연구·지도업무를 3년 이상 맡은 공무원은 출제 당시 자격요건에 해당한다. 농업인 경작 5년과 공무원 연구·지도 3년을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 시행령 제12조(출제 당시)","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["2-30","6-30","4-31"]},{"id":"1-33","round":1,"year":2015,"number":33,"subject":"농어업재해보험법령","topic":"손해평가사의 자격취소 사유","stem":"농어업재해보험법상 손해평가사의 자격 취소에 해당되는 자만을 모두 고른 것은?\nㄱ. 손해평가사의 직무를 게을리하였다고 인정되는 사람\nㄴ. 손해평가사의 자격을 거짓 또는 부정한 방법으로 취득한 사람\nㄷ. 거짓으로 손해평가를 한 사람\nㄹ. 다른 사람에게 손해평가사의 업무를 수행하게 한 사람","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ, ㄹ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nㄴ 부정한 자격취득, ㄷ 거짓 손해평가, ㄹ 타인에게 업무를 하게 한 경우가 자격취소 사유이므로 ③이다. 특히 부정취득은 의무적 취소사유라는 점도 구별한다.\n\n오답 확인\nㄱ의 단순한 직무 태만이라는 추상적 사정만으로 열거된 자격취소 사유를 추가할 수 없다. 손해평가인 위촉 해지와 국가자격인 손해평가사 자격취소도 구분한다.\n\n근거·학습주제\n농어업재해보험법 제11조의5(출제 당시)","explanationSections":[{"label":"정답 근거","text":"ㄴ 부정한 자격취득, ㄷ 거짓 손해평가, ㄹ 타인에게 업무를 하게 한 경우가 자격취소 사유이므로 ③이다. 특히 부정취득은 의무적 취소사유라는 점도 구별한다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ의 단순한 직무 태만이라는 추상적 사정만으로 열거된 자격취소 사유를 추가할 수 없다. 손해평가인 위촉 해지와 국가자격인 손해평가사 자격취소도 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의5(출제 당시)","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["2-31","6-33","4-28","7-31","3-31","10-30","9-32","11-31","8-30"]},{"id":"1-34","round":1,"year":2015,"number":34,"subject":"농어업재해보험법령","topic":"손해평가사의 법정 업무","stem":"농어업재해보험법상 손해평가사의 업무가 아닌 것은?","options":[{"n":"1","text":"피해발생의 통지"},{"n":"2","text":"피해사실의 확인"},{"n":"3","text":"손해액의 평가"},{"n":"4","text":"보험가액의 평가"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n손해평가사의 업무는 피해사실 확인, 보험가액·손해액 평가, 그 밖의 필요한 손해평가 사항이다. 사고 발생을 보험자에게 알리는 피해발생 통지는 주로 보험가입자 등이 부담하므로 ①이다.\n\n오답 확인\n②·③·④는 법정 평가 업무에 속한다. 피해를 통지하는 단계와 위탁을 받아 그 피해를 객관적으로 평가하는 단계를 구별한다.\n\n근거·학습주제\n농어업재해보험법 제11조의3","explanationSections":[{"label":"정답 근거","text":"손해평가사의 업무는 피해사실 확인, 보험가액·손해액 평가, 그 밖의 필요한 손해평가 사항이다. 사고 발생을 보험자에게 알리는 피해발생 통지는 주로 보험가입자 등이 부담하므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"②·③·④는 법정 평가 업무에 속한다. 피해를 통지하는 단계와 위탁을 받아 그 피해를 객관적으로 평가하는 단계를 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의3","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["5-31"]},{"id":"1-35","round":1,"year":2015,"number":35,"subject":"농어업재해보험법령","topic":"재해보험 업무 위탁 대상","stem":"농어업재해보험법령상 재해보험사업자가 재해보험사업을 원활히 수행하기 위하여\n필요한 경우로서 보험모집 및 손해평가 등 재해보험 업무의 일부를 위탁할 수 있는\n대상이 아닌 자는?","options":[{"n":"1","text":"「산림조합법」에 따라 설립된 품목별 산림조합"},{"n":"2","text":"「농업협동조합법」에 따라 설립된 농업협동조합중앙회"},{"n":"3","text":"「보험업법」제187조에 따라 손해사정을 업으로 하는 자"},{"n":"4","text":"「농업협동조합법」에 따라 설립된 지역축산업협동조합"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n출제 당시 법령이 정한 위탁 대상에서 농업협동조합중앙회를 제시한 ②가 해당하지 않는다. 법령에 열거된 지역조합과 중앙회를 명칭이 비슷하다고 같게 취급해서는 안 된다.\n\n오답 확인\n① 품목별 산림조합, ③ 손해사정업자, ④ 지역축산업협동조합은 각 근거법에 따라 위탁대상에 포함된다. 손해평가업무 위탁과 보험모집업무 위탁도 업무별 조건을 확인한다.\n\n근거·학습주제\n농어업재해보험법 제14조 및 당시 시행령 위탁대상","explanationSections":[{"label":"정답 근거","text":"출제 당시 법령이 정한 위탁 대상에서 농업협동조합중앙회를 제시한 ②가 해당하지 않는다. 법령에 열거된 지역조합과 중앙회를 명칭이 비슷하다고 같게 취급해서는 안 된다.","kind":"reason"},{"label":"오답 확인","text":"① 품목별 산림조합, ③ 손해사정업자, ④ 지역축산업협동조합은 각 근거법에 따라 위탁대상에 포함된다. 손해평가업무 위탁과 보험모집업무 위탁도 업무별 조건을 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제14조 및 당시 시행령 위탁대상","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["8-32","7-33","10-32","4-32","6-43","7-27","5-40","12-30","5-38","10-28","8-28","12-28"]},{"id":"1-36","round":1,"year":2015,"number":36,"subject":"농어업재해보험법령","topic":"정부의 재정지원","stem":"농어업재해보험법상 재해보험 가입자 또는 사업자에 대한 정부의 재정지원에 관한\n설명으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험가입자가 부담하는 보험료의 일부를 지원할 수 있다."},{"n":"2","text":"재해보험사업자가 재해보험가입자에게 지급하는 보험금의 일부를 지원할 수 있다."},{"n":"3","text":"재해보험사업자의 재해보험의 운영 및 관리에 필요한 비용의 전부 또는 일부를 지원할 수 있다."},{"n":"4","text":"「풍수해보험법」에 따른 풍수해보험에 가입한 자가 동일한 보험목적물을 대상으로 재해\n보험에 가입한 경우는 보험료를 지원하지 아니한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n정부가 지원할 수 있는 항목은 가입자의 보험료 및 사업자의 보험 운영·관리에 필요한 비용 등이다. 개별 가입자에게 지급하는 보험금의 일부를 이 항목의 직접지원 대상으로 표현한 ②가 틀리다.\n\n오답 확인\n재보험을 통해 국가가 위험을 분담하는 제도와 가입자 보험금의 직접지원은 다른 법적 구조이다. ④ 같은 목적물을 풍수해보험으로 보장받는 경우 보험료 이중지원 제한도 구별한다.\n\n근거·학습주제\n농어업재해보험법 제19조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"정부가 지원할 수 있는 항목은 가입자의 보험료 및 사업자의 보험 운영·관리에 필요한 비용 등이다. 개별 가입자에게 지급하는 보험금의 일부를 이 항목의 직접지원 대상으로 표현한 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"재보험을 통해 국가가 위험을 분담하는 제도와 가입자 보험금의 직접지원은 다른 법적 구조이다. ④ 같은 목적물을 풍수해보험으로 보장받는 경우 보험료 이중지원 제한도 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제19조(출제 당시)","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["11-33","7-34","12-32","8-33","5-43","3-40","10-33","6-34","2-33"]},{"id":"1-37","round":1,"year":2015,"number":37,"subject":"농어업재해보험법령","topic":"사업의 효율적 추진 업무","stem":"농어업재해보험법상 재해보험사업을 효율적으로 추진하기 위한 농림축산식품부의 업무\n(업무를 위탁한 경우를 포함한다)로 볼 수 없는 것은?","options":[{"n":"1","text":"재해보험 요율의 승인"},{"n":"2","text":"재해보험 상품의 연구 및 보급"},{"n":"3","text":"손해평가인력의 육성"},{"n":"4","text":"손해평가기법의 연구ㆍ개발 및 보급"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n재해보험 상품 연구·보급, 손해평가인력 육성, 평가기법 연구·개발·보급은 사업 추진을 위한 업무이다. 재해보험 요율을 장관이 승인하는 업무라는 ①은 해당 열거내용과 다르다.\n\n오답 확인\n요율은 재해보험사업자가 법정 기준에 맞춰 산정한다. 산정주체, 감독행정, 정책 연구·보급을 같은 개념으로 취급하지 않는다.\n\n근거·학습주제\n농어업재해보험법 제25조의2 및 제9조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"재해보험 상품 연구·보급, 손해평가인력 육성, 평가기법 연구·개발·보급은 사업 추진을 위한 업무이다. 재해보험 요율을 장관이 승인하는 업무라는 ①은 해당 열거내용과 다르다.","kind":"reason"},{"label":"오답 확인","text":"요율은 재해보험사업자가 법정 기준에 맞춰 산정한다. 산정주체, 감독행정, 정책 연구·보급을 같은 개념으로 취급하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제25조의2 및 제9조(출제 당시)","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["3-39","2-50"]},{"id":"1-38","round":1,"year":2015,"number":38,"subject":"농어업재해보험법령","topic":"과태료와 형사벌의 구별","stem":"농어업재해보험법상 과태료의 부과대상이 아닌 것은?","options":[{"n":"1","text":"재해보험사업자가 「보험업법」을 위반하여 보험안내를 한 경우"},{"n":"2","text":"재해보험사업자가 아닌 자가 「보험업법」을 위반하여 보험안내를 한 경우"},{"n":"3","text":"손해평가사가 고의로 진실을 숨기거나 거짓으로 손해평가를 한 경우"},{"n":"4","text":"재해보험사업자가 농림축산식품부에 관계서류 제출을 거짓으로 한 경우"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n손해평가사가 고의로 진실을 숨기거나 거짓으로 손해평가한 행위는 형사벌 규정의 대상으로, 이 문항의 과태료 부과대상이 아니다. 행정질서벌인 과태료와 벌금·징역 같은 형사처벌을 구별한다.\n\n오답 확인\n①·② 보험안내 관련 위반과 ④ 요구받은 서류를 거짓으로 제출한 행위는 해당 과태료 조항에서 검토한다. 벌칙이 무겁다는 사정으로 과태료 대상에도 당연히 포함된다고 판단하면 안 된다.\n\n근거·학습주제\n농어업재해보험법 벌칙·과태료 규정(출제 당시)","explanationSections":[{"label":"정답 근거","text":"손해평가사가 고의로 진실을 숨기거나 거짓으로 손해평가한 행위는 형사벌 규정의 대상으로, 이 문항의 과태료 부과대상이 아니다. 행정질서벌인 과태료와 벌금·징역 같은 형사처벌을 구별한다.","kind":"reason"},{"label":"오답 확인","text":"①·② 보험안내 관련 위반과 ④ 요구받은 서류를 거짓으로 제출한 행위는 해당 과태료 조항에서 검토한다. 벌칙이 무겁다는 사정으로 imilarIds":["7-47","8-48","4-48"]},{"id":"1-44","round":1,"year":2015,"number":44,"subject":"농어업재해보험법령","topic":"생육시기와 보상재해","stem":"농업재해보험 손해평가요령에 따른 특정위험방식 상품 “사과”의 「발아기～적과전」\n생육시기에 해당되는 재해로 옳지 않은 것은?","options":[{"n":"1","text":"태풍(강풍)ㆍ집중호우"},{"n":"2","text":"우박"},{"n":"3","text":"봄동상해"},{"n":"4","text":"가을동상해"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n발아기부터 적과 전까지의 사과 생육시기에 가을동상해를 제시한 ④가 옳지 않다. 가을동상해는 수확기 무렵 기온 저하로 생기는 피해로 조사·보장시기가 다르다.\n\n오답 확인\n① 태풍·집중호우, ② 우박, ③ 봄동상해는 이 시기 발생 가능한 보상재해로 제시되어 있다. '봄동상해'와 '가을동상해'의 시기 구별이 핵심이다.\n\n기준 변경 메모\n2015년 사과 특정위험방식에 관한 문제이다. 2026년 사과 상품의 적과전종합위험·종합위험 체계와 동일한 상품표로 외우지 않는다.\n\n근거·학습주제\n당시 손해평가요령 특정위험방식 조사표","explanationSections":[{"label":"정답 근거","text":"발아기부터 적과 전까지의 사과 생육시기에 가을동상해를 제시한 ④가 옳지 않다. 가을동상해는 수확기 무렵 기온 저하로 생기는 피해로 조사·보장시기가 다르다.","kind":"reason"},{"label":"오답 확인","text":"① 태풍·집중호우, ② 우박, ③ 봄동상해는 이 시기 발생 가능한 보상재해로 제시되어 있다. '봄동상해'와 '가을동상해'의 시기 구별이 핵심이다.","kind":"incorrect"},{"label":"기준 변경 메모","text":"2015년 사과 특정위험방식에 관한 문제이다. 2026년 사과 상품의 적과전종합위험·종합위험 체계와 동일한 상품표로 외우지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"당시 손해평가요령 특정위험방식 조사표","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":21,"similarIds":["4-41"]},{"id":"1-45","round":1,"year":2015,"number":45,"subject":"농어업재해보험법령","topic":"배 특정위험방식 보험금 계산","stem":"특정위험방식 과실손해보장 중 “배”의 경우 다음 조건에 해당되는 보험금은?\n보험가입금액 800만원 자기부담비율 20% 가입수확량 8,000 kg\n기준수확량 10,000 kg 누적감수량 4,000 kg","options":[{"n":"1","text":"160만원"},{"n":"2","text":"240만원"},{"n":"3","text":"320만원"},{"n":"4","text":"400만원"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n당시 산식은 보험가입금액×(피해율-자기부담비율)이다. 피해율의 분모는 가입수확량이 아니라 기준수확량이므로 4,000÷10,000=40%. 보험금=800만원×(40%-20%)=160만원이다.\n\n오답 확인\n가입수확량 8,000kg을 분모로 넣으면 피해율 50%와 보험금 240만원이 나와 ②로 잘못 고르게 된다. 문제는 2015년 특정위험방식의 계약금액·피해율 산식을 묻는다.\n\n기준 변경 메모\n2026년 적과전종합위험 상품의 감수량×가입가격 산식에 이 수치를 임의로 바꾸어 대입하지 않는다.\n\n근거·학습주제\n2015년 최종정답 및 당시 특정위험방식 과실손해 산식","explanationSections":[{"label":"정답 근거","text":"당시
