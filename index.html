거·학습주제\n상법 제638조 및 보험계약의 성질","explanationSections":[{"label":"정답 근거","text":"선의성·유상성·사행성이 옳고 요식성은 틀려 3개이다. 보험은 보험료라는 대가를 내고 우연한 사고위험을 이전하며 고지의무 등 높은 선의가 요구된다.","kind":"reason"},{"label":"오답 확인","text":"증권 작성이 계약성립의 필수 요건이 아니므로 불요식계약이다. 사행성은 급부가 사고의 우연성에 좌우된다는 법적 성질이며 불법 도박이라는 뜻은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조 및 보험계약의 성질","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["11-1"]},{"id":"3-2","round":3,"year":2017,"number":2,"subject":"상법(보험편)","topic":"계약성립과 책임개시","stem":"보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해보험계약의 경우 보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의\n전부를 지급 받은 때에는 다른 약정이 없으면 30일내에 그 상대방에 대하여 낙부의 통지를\n발송하여야 한다."},{"n":"2","text":"보험계약은 청약과 승낙뿐만 아니라 보험료 지급이 이루어진 때에 성립한다."},{"n":"3","text":"손해보험계약의 경우 보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의\n전부를 지급 받은 경우에 그 청약을 승낙하기 전에 보험계약에서 정한 보험사고가 생긴 때에\n는 그 청약을 거절할 사유가 없는 한 보험자는 보험계약상의 책임을 진다."},{"n":"4","text":"보험자가 낙부의 통지 기간내에 낙부의 통지를 해태한 때에는 승낙한 것으로 본다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험은 청약·승낙의 합치로 성립하는 낙성계약이므로 보험료 지급까지 있어야 성립한다는 ②가 틀리다. 최초보험료 지급은 원칙적 책임개시 시점과 관련된다.\n\n오답 확인\n청약과 함께 보험료 상당액을 받은 경우 원칙적 낙부통지 기간은 30일이다. 그 기간 중 승낙 전 사고의 책임과 통지 해태 시 승낙 간주도 계약성립과 구분하여 검토한다.\n\n근거·학습주제\n상법 제638조의2·제656조","explanationSections":[{"label":"정답 근거","text":"보험은 청약·승낙의 합치로 성립하는 낙성계약이므로 보험료 지급까지 있어야 성립한다는 ②가 틀리다. 최초보험료 지급은 원칙적 책임개시 시점과 관련된다.","kind":"reason"},{"label":"오답 확인","text":"청약과 함께 보험료 상당액을 받은 경우 원칙적 낙부통지 기간은 30일이다. 그 기간 중 승낙 전 사고의 책임과 통지 해태 시 승낙 간주도 계약성립과 구분하여 검토한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의2·제656조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["5-11","9-1","6-11","8-1","10-2","2-8"]},{"id":"3-3","round":3,"year":2017,"number":3,"subject":"상법(보험편)","topic":"약관과 보험증권의 교부","stem":"상법상 보험약관의 교부ㆍ설명의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"상법에 따르면 약관에 없는 사항은 비록 보험계약상 중요한 내용일지라도 설명할 의무가\n없다."},{"n":"2","text":"보험자가 해당 보험계약 약관의 중요사항을 충분히 설명한 경우에도 해당 보험계약의 약\n관을 교부하여야 한다."},{"n":"3","text":"보험자가 보험증권을 교부한 경우에는 따로 보험약관을 교부하지 않아도 된다."},{"n":"4","text":"보험자가 보험약관의 교부ㆍ설명의무를 위반한 경우 보험계약자는 보험계약이 성립한 날\n부터 3개월 이내에 그 계약을 취소할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험증권을 교부했다고 약관 교부의무까지 이행한 것으로 되는 것은 아니다. 증권과 약관은 목적이 다른 문서이므로 ③이 틀리다.\n\n오답 확인\n설명과 문서 교부는 각각 이행해야 한다. 약관의무 위반 취소기간은 계약 성립일부터 3개월이다. ①은 상법상 '약관의 중요한 내용'에 관한 설명범위를 묻는 보기이며 다른 법령상 정보제공의무까지 부정하는 뜻은 아니다.\n\n근거·학습주제\n상법 제638조의3·제640조","explanationSections":[{"label":"정답 근거","text":"보험증권을 교부했다고 약관 교부의무까지 이행한 것으로 되는 것은 아니다. 증권과 약관은 목적이 다른 문서이므로 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"설명과 문서 교부는 각각 이행해야 한다. 약관의무 위반 취소기간은 계약 성립일부터 3개월이다. ①은 상법상 '약관의 중요한 내용'에 관한 설명범위를 묻는 보기이며 다른 법령상 정보제공의무까지 부정하는 뜻은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·제640조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["2-16","5-2","10-2","7-8"]},{"id":"3-4","round":3,"year":2017,"number":4,"subject":"상법(보험편)","topic":"타인을 위한 보험의 수익","stem":"타인을 위한 보험계약에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"타인을 위한 보험계약의 타인은 따로 수익의 의사표시를 하지 않은 경우에도 그 이익을\n받는다."},{"n":"2","text":"타인을 위한 보험계약에서 그 타인은 불특정 다수이어야 한다."},{"n":"3","text":"손해보험계약의 경우에 그 타인의 위임이 없는 때에는 보험계약자는 이를 보험자에게 고지하\n여야 하나, 그 고지가 없는 때에도 타인이 그 보험계약이 체결된 사실을 알지 못하였다는 사\n유로 보험자에게 대항할 수 있다."},{"n":"4","text":"타인은 어떠한 경우에도 보험료를 지급하고 보험계약을 유지할 수 없다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n타인은 별도의 수익 의사표시를 하지 않아도 보험계약의 이익을 받으므로 ①이다. 민법의 일반적인 제3자를 위한 계약과 구별되는 보험의 특칙이다.\n\n오답 확인\n타인은 특정·불특정 모두 가능하다. 위임 없는 손해보험의 고지 및 보험료 연체 시 타인의 최고·지급과 관련한 보호장치도 있으므로 ②·③·④처럼 일률적으로 제한할 수 없다.\n\n근거·학습주제\n상법 제639조·제650조","explanationSections":[{"label":"정답 근거","text":"타인은 별도의 수익 의사표시를 하지 않아도 보험계약의 이익을 받으므로 ①이다. 민법의 일반적인 제3자를 위한 계약과 구별되는 보험의 특칙이다.","kind":"reason"},{"label":"오답 확인","text":"타인은 특정·불특정 모두 가능하다. 위임 없는 손해보험의 고지 및 보험료 연체 시 타인의 최고·지급과 관련한 보호장치도 있으므로 ②·③·④처럼 일률적으로 제한할 수 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조·제650조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["7-2","5-3","6-12","9-2","11-2","7-5","2-17"]},{"id":"3-5","round":3,"year":2017,"number":5,"subject":"상법(보험편)","topic":"증권내용의 이의기간","stem":"다음 설명 중 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 그 계약전의 어느 시기를 보험기간의 시기로 할 수 있다."},{"n":"2","text":"건물에 대한 화재보험계약 체결시에 이미 건물이 화재로 전소하는 사고가 발생한 경우 당\n사자 쌍방과 피보험자가 이를 알지 못한 때에는 그 계약은 무효가 아니다."},{"n":"3","text":"보험증권을 멸실 또는 현저하게 훼손한 때에는 보험계약자는 보험자에 대하여 증권의 재교부\n를 청구할 수 있다."},{"n":"4","text":"보험증권내용의 정부에 관한 이의기간은 약관에서 15일 이내로 정해야 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험증권 내용에 대한 이의기간을 약정하는 경우 1개월보다 짧게 정하지 못한다. 15일로 정해야 한다는 ④가 틀리다.\n\n오답 확인\n소급보험은 허용되며 계약 당시 사고가 이미 발생했어도 당사자 쌍방과 피보험자가 몰랐다면 무효로 하지 않는 예외가 있다. 증권 멸실·현저한 훼손 시 재교부를 청구할 수 있다.\n\n근거·학습주제\n상법 제640조·제642조·제643조·제644조","explanationSections":[{"label":"정답 근거","text":"보험증권 내용에 대한 이의기간을 약정하는 경우 1개월보다 짧게 정하지 못한다. 15일로 정해야 한다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"소급보험은 허용되며 계약 당시 사고가 이미 발생했어도 당사자 쌍방과 피보험자가 몰랐다면 무효로 하지 않는 예외가 있다. 증권 멸실·현저한 훼손 시 재교부를 청구할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제642조·제643조·제644조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["12-3","7-3","4-4","10-3","5-4","9-4","5-5","12-1","4-3","11-3"]},{"id":"3-6","round":3,"year":2017,"number":6,"subject":"상법(보험편)","topic":"보험자의 책임개시","stem":"보험계약의 당사자 간에 다른 약정이 없는 경우 보험자의 책임개시 시기는?","options":[{"n":"1","text":"최초의 보험료의 지급을 받은 때로부터 개시한다."},{"n":"2","text":"보험계약자의 청약에 대하여 보험자가 승낙하여 계약이 성립한 때로부터 개시한다."},{"n":"3","text":"보험사고 발생사실이 통지된 때로부터 개시한다."},{"n":"4","text":"보험자가 재보험에 가입하여 보험자의 보험금지급위험에 대한 보장이 확보된 때로부터 개\n시한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n다른 약정이 없으면 최초보험료를 지급받은 때부터 보험자의 책임이 개시되므로 ①이다. 성립 시점과 책임개시 시점을 구분해야 한다.\n\n오답 확인\n청약·승낙, 사고통지, 재보험 가입은 원칙적 책임개시 시점이 아니다. 특히 원보험자의 책임은 재보험 가입 여부에 의해 좌우되지 않는다.\n\n근거·학습주제\n상법 제656조·제661조","explanationSections":[{"label":"정답 근거","text":"다른 약정이 없으면 최초보험료를 지급받은 때부터 보험자의 책임이 개시되므로 ①이다. 성립 시점과 책임개시 시점을 구분해야 한다.","kind":"reason"},{"label":"오답 확인","text":"청약·승낙, 사고통지, 재보험 가입은 원칙적 책임개시 시점이 아니다. 특히 원보험자의 책임은 재보험 가입 여부에 의해 좌우되지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제656조·제661조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["8-12","1-10"]},{"id":"3-7","round":3,"year":2017,"number":7,"subject":"상법(보험편)","topic":"임의해지권의 주체","stem":"다음 설명 중 옳지 않은 것은?","options":[{"n":"1","text":"타인을 위한 보험계약의 경우에는 보험계약자는 그 타인의 동의를 얻지 아니하거나 보험증권\n을 소지하지 아니하면 그 계약을 해지하지 못한다."},{"n":"2","text":"자기를 위한 보험계약의 경우 보험사고가 발생하기 전 보험계약의 당사자는 언제든지 계\n약의 전부 또는 일부를 해지할 수 있다."},{"n":"3","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니하는 보\n험의 경우에는 보험계약자는 그 사고발생후에도 보험계약을 해지할 수 있다."},{"n":"4","text":"보험사고 발생 전에 보험계약을 해지한 보험계약자는 당사자간에 다른 약정이 없으면 미경\n과보험료의 반환을 청구할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험사고 전 언제든 임의해지할 수 있는 법정 권리자는 보험계약자이지 계약 당사자 쌍방이 아니다. 보험자까지 무제한 임의해지할 수 있다는 ②가 틀리다.\n\n오답 확인\n타인을 위한 보험의 동의·증권 소지 요건, 보험금 지급 후에도 금액이 줄지 않는 보험의 사고 후 해지, 사고 전 해지에 따른 미경과보험료 반환은 법정 특칙이다.\n\n근거·학습주제\n상법 제649조","explanationSections":[{"label":"정답 근거","text":"보험사고 전 언제든 임의해지할 수 있는 법정 권리자는 보험계약자이지 계약 당사자 쌍방이 아니다. 보험자까지 무제한 임의해지할 수 있다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"타인을 위한 보험의 동의·증권 소지 요건, 보험금 지급 후에도 금액이 줄지 않는 보험의 사고 후 해지, 사고 전 해지에 따른 미경과보험료 반환은 법정 특칙이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제649조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["6-16","2-4","7-5","12-6","5-7","10-7","9-6","4-9","11-6","11-4","3-11","8-7","2-5","9-4","10-5","12-3","11-7","9-11","6-12","12-5","12-7","11-2","7-2","7-6","9-16","5-9","1-7","8-3","1-6"]},{"id":"3-8","round":3,"year":2017,"number":8,"subject":"상법(보험편)","topic":"자동실효약관과 최고","stem":"보험료 불지급에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"계약성립후 2월 이내에 제1회 보험료를 지급하지 아니하는 경우에는 다른 약정이 없는 한\n그 계약은 해제된 것으로 본다."},{"n":"2","text":"보험계약자가 계속보험료의 지급을 지체한 경우에 보험자는 상당한 기간을 정하여 이행을\n최고하여야 하고 그 최고기간 내에 지급되지 아니한 때에는 그 계약을 해지할 수 있다."},{"n":"3","text":"특정한 타인을 위한 보험의 경우에 보험계약자가 계속보험료의 지급을 지체한 때에는 보험자\n는 그 타인에게도 상당한 기간을 정하여 보험료의 지급을 최고한 후가 아니면 그 계약을 해\n지하지 못한다."},{"n":"4","text":"대법원 전원합의체 판결에 의하면 약관에서 제2회 분납보험료가 그 지급유예기간까지 납\n입되지 아니하였음을 이유로 상법 소정의 최고절차를 거치지 않고, 막바로 보험계약이 실\n효됨을 규정한 이른바 실효약관은 유효하다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계속보험료 연체에 대해 법정 최고절차를 배제하고 유예기간 경과만으로 계약을 자동실효시키는 약관은 계약자에게 불리한 변경으로 효력을 인정하지 않는다. 유효하다는 ④가 틀리다.\n\n오답 확인\n최초보험료 미지급의 2개월 해제 간주와 계속보험료 연체의 최고 후 해지를 나누어야 한다. 특정한 타인을 위한 보험에서는 그 타인에게도 최고해야 한다.\n\n근거·학습주제\n상법 제650조·제663조 및 실효약관 판례","explanationSections":[{"label":"정답 근거","text":"계속보험료 연체에 대해 법정 최고절차를 배제하고 유예기간 경과만으로 계약을 자동실효시키는 약관은 계약자에게 불리한 변경으로 효력을 인정하지 않는다. 유효하다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"최초보험료 미지급의 2개월 해제 간주와 계속보험료 연체의 최고 후 해지를 나누어야 한다. 특정한 타인을 위한 보험에서는 그 타인에게도 최고해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조·제663조 및 실효약관 판례","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["12-7","9-6","2-5","7-6","11-7","1-6","10-5","4-9"]},{"id":"3-9","round":3,"year":2017,"number":9,"subject":"상법(보험편)","topic":"고지의무의 요건","stem":"다음 설명 중 옳은 것을 모두 고른 것은?\nㄱ. 보험자가 서면으로 질문한 사항은 중요한 사항으로 간주하므로 보험계약\n자는 그 중요성을 다툴 수 없다.\nㄴ. 보험계약자뿐만 아니라 피보험자도 고지의무를 진다.\nㄷ. 고지의무 위반의 요건으로 보험계약자 또는 피보험자의 고의 또는 중대한\n과실은 필요 없다.\nㄹ. 보험자가 계약당시에 고지의무 위반 사실을 알았거나 중대한 과실로 인하여\n알지 못한 때에는 고지의무 위반을 이유로 계약을 해지할 수 없다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nㄴ과 ㄹ이 옳아 ③이다. 계약자와 피보험자는 중요한 사항을 고지해야 하며, 보험자가 이미 알았거나 중과실로 몰랐다면 위반을 이유로 해지하지 못한다.\n\n오답 확인\n서면질문 사항은 중요사항으로 '추정'되므로 반증이 가능하다. 고지의무 위반 해지에는 고의 또는 중대한 과실이 요구되므로 ㄱ·ㄷ이 틀리다.\n\n근거·학습주제\n상법 제651조·제651조의2","explanationSections":[{"label":"정답 근거","text":"ㄴ과 ㄹ이 옳아 ③이다. 계약자와 피보험자는 중요한 사항을 고지해야 하며, 보험자가 이미 알았거나 중과실로 몰랐다면 위반을 이유로 해지하지 못한다.","kind":"reason"},{"label":"오답 확인","text":"서면질문 사항은 중요사항으로 '추정'되므로 반증이 가능하다. 고지의무 위반 해지에는 고의 또는 중대한 과실이 요구되므로 ㄱ·ㄷ이 틀리다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제651조·제651조의2","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["4-7","11-9","1-13","9-8","2-13","5-8","12-8","8-9","7-7"]},{"id":"3-10","round":3,"year":2017,"number":10,"subject":"상법(보험편)","topic":"고의·중과실에 의한 위험증가","stem":"위험변경증가시의 통지와 보험계약해지에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험기간 중에 피보험자가 사고발생의 위험이 현저하게 변경 또는 증가된 사실을 안 때에\n는 지체없이 보험자에게 통지하여야 한다."},{"n":"2","text":"보험기간 중에 보험계약자의 고의로 사고발생의 위험이 현저하게 변경 또는 증가된 때에\n는 보험자는 그 사실을 안 날로부터 1월내에 계약을 해지할 수 있다."},{"n":"3","text":"보험기간 중에 피보험자의 중대한 과실로 인하여 사고발생의 위험이 현저하게 변경 또는\n증가된 때에는 보험자는 그 사실을 안 날부터 1월내에 계약을 해지할 수 있다."},{"n":"4","text":"보험기간 중에 피보험자의 고의로 인하여 사고발생의 위험이 현저하게 변경 또는 증가된\n경우에는 보험자는 계약을 해지할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n피보험자의 고의로 사고위험이 현저하게 증가한 경우에도 보험자는 안 날부터 1개월 내 증액청구 또는 해지를 할 수 있다. 해지할 수 없다는 ④가 틀리다.\n\n오답 확인\n계약자·피보험자·보험수익자의 고의·중과실에 의한 위험증가와, 현저한 위험변경을 안 자의 통지의무를 구분한다.\n\n근거·학습주제\n상법 제652조·제653조","explanationSections":[{"label":"정답 근거","text":"피보험자의 고의로 사고위험이 현저하게 증가한 경우에도 보험자는 안 날부터 1개월 내 증액청구 또는 해지를 할 수 있다. 해지할 수 없다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"계약자·피보험자·보험수익자의 고의·중과실에 의한 위험증가와, 현저한 위험변경을 안 자의 통지의무를 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조·제653조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["9-15","11-10","7-10","7-9","10-9","4-10","12-9","8-10","2-14","6-19","4-6","5-9","8-11","3-11","10-10"]},{"id":"3-11","round":3,"year":2017,"number":11,"subject":"상법(보험편)","topic":"고지위반과 사고의 인과관계","stem":"보험계약해지 등에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험사고가 발생한 후라도 보험자가 계속보험료의 지급지체를 이유로 보험계약을 해지하였을\n때에는 보험자는 보험금을 지급할 책임이 있다."},{"n":"2","text":"고지의무를 위반한 사실이 보험사고 발생에 영향을 미치지 아니하였음이 증명된 경우, 보\n험자는 보험금을 지급할 책임이 있다."},{"n":"3","text":"보험계약자의 중대한 과실로 인하여 사고발생의 위험이 현저하게 변경 또는 증가되어 계\n약을 해지한 경우, 보험자는 언제나 보험금을 지급할 책임이 있다."},{"n":"4","text":"보험계약자가 위험변경증가시의 통지의무를 위반하여 보험자가 보험계약을 해지한 경우,\n보험자는 언제나 이미 지급한 보험금의 반환을 청구할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n고지위반 사실이 사고 발생에 영향을 미치지 않았음이 증명되면 계약을 해지했어도 보험금을 지급해야 하므로 ②이다. 해지권과 보험금 면책을 별도로 판단한다.\n\n오답 확인\n① 계속보험료 연체 해지에서 지급책임을 무조건 인정하지 않는다. ③·④의 '언제나'도 틀리다. 위험변경·고지위반과 사고 사이의 인과관계에 관한 단서가 있다.\n\n근거·학습주제\n상법 제655조","explanationSections":[{"label":"정답 근거","text":"고지위반 사실이 사고 발생에 영향을 미치지 않았음이 증명되면 계약을 해지했어도 보험금을 지급해야 하므로 ②이다. 해지권과 보험금 면책을 별도로 판단한다.","kind":"reason"},{"label":"오답 확인","text":"① 계속보험료 연체 해지에서 지급책임을 무조건 인정하지 않는다. ③·④의 '언제나'도 틀리다. 위험변경·고지위반과 사고 사이의 인과관계에 관한 단서가 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제655조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["7-11","6-19","1-8","4-10","10-11","12-8","10-10","3-7","9-8","3-12","12-10","2-18","11-12","3-10","12-7","1-7","8-11","7-5","6-16","9-13","9-7","9-6","12-6","2-14","10-7","2-4","11-10","5-9","8-12","5-7"]},{"id":"3-12","round":3,"year":2017,"number":12,"subject":"상법(보험편)","topic":"중과실 사고의 면책","stem":"손해보험에서 보험자의 보험금액 지급과 면책사유에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 보험금액의 지급에 관하여 약정기간이 있는 경우에는 그 기간내에 피보험자에게\n보험금액을 지급하여야 한다."},{"n":"2","text":"보험자는 보험금액의 지급에 관하여 약정기간이 없는 경우에는 보험사고발생의 통지를 받\n은 후 지체없이 지급할 보험금액을 정하고, 그 정하여진 날부터 10일내에 피보험자에게 보\n험금액을 지급하여야 한다."},{"n":"3","text":"보험사고가 보험계약자 또는 피보험자의 중대한 과실로 인하여 생긴 때에는 보험자는 언\n제나 보험금액을 지급할 책임이 있다."},{"n":"4","text":"보험사고가 전쟁 기타의 변란으로 인하여 생긴 때에는 당사자간에 다른 약정이 없으면 보\n험자는 보험금액을 지급할 책임이 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n손해보험에서 계약자 또는 피보험자의 고의·중대한 과실로 발생한 사고는 원칙적 면책이다. 언제나 지급책임이 있다는 ③은 반대이다.\n\n오답 확인\n약정한 지급기간이 있으면 그 기간, 없으면 지급보험금을 지체 없이 정한 뒤 결정일부터 10일 내 지급한다. 전쟁·변란도 다른 약정 없는 원칙적 면책이다.\n\n근거·학습주제\n상법 제658조·제659조·제660조","explanationSections":[{"label":"정답 근거","text":"손해보험에서 계약자 또는 피보험자의 고의·중대한 과실로 발생한 사고는 원칙적 면책이다. 언제나 지급책임이 있다는 ③은 반대이다.","kind":"reason"},{"label":"오답 확인","text":"약정한 지급기간이 있으면 그 기간, 없으면 지급보험금을 지체 없이 정한 뒤 결정일부터 10일 내 지급한다. 전쟁·변란도 다른 약정 없는 원칙적 면책이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제658조·제659조·제660조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["9-13","12-10","4-12","2-18","10-11","11-12","7-14","8-12","1-11","5-9","12-18","3-11","2-11"]},{"id":"3-13","round":3,"year":2017,"number":13,"subject":"상법(보험편)","topic":"원보험과 재보험의 독립","stem":"재보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 보험사고로 인하여 부담할 책임에 대하여 다른 보험자와 재보험계약을 체결할\n수 있다."},{"n":"2","text":"재보험은 원보험자가 인수한 위험의 전부 또는 일부를 분산시키는 기능을 한다."},{"n":"3","text":"재보험계약의 전제가 되는 최초로 체결된 보험계약을 원보험계약 또는 원수보험계약이라\n한다."},{"n":"4","text":"재보험계약은 원보험계약의 효력에 영향을 미친다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n재보험계약은 원보험계약의 효력에 영향을 미치지 않으므로 ④가 틀리다. 재보험자가 원보험자의 책임 전부·일부를 인수하는 것은 보험자 사이 위험분산이다.\n\n오답 확인\n재보험의 전제가 되는 계약을 원보험·원수보험이라고 한다. 재보험 가입·불이행을 원보험자의 가입자에 대한 지급책임과 혼동하지 않는다.\n\n근거·학습주제\n상법 제661조","explanationSections":[{"label":"정답 근거","text":"재보험계약은 원보험계약의 효력에 영향을 미치지 않으므로 ④가 틀리다. 재보험자가 원보험자의 책임 전부·일부를 인수하는 것은 보험자 사이 위험분산이다.","kind":"reason"},{"label":"오답 확인","text":"재보험의 전제가 되는 계약을 원보험·원수보험이라고 한다. 재보험 가입·불이행을 원보험자의 가입자에 대한 지급책임과 혼동하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제661조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["4-18","12-16","1-12"]},{"id":"3-14","round":3,"year":2017,"number":14,"subject":"상법(보험편)","topic":"청구권별 소멸시효","stem":"상법 제662조(소멸시효)에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험금청구권은 3년간 행사하지 아니하면 시효의 완성으로 소멸한다.\nㄴ. 보험료반환청구권은 3년간 행사하지 아니하면 시효의 완성으로 소멸한다.\nㄷ. 적립금의 반환청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸\n한다.\nㄹ. 보험료청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다.","options":[{"n":"1","text":"ㄱ, ㄴ, ㄷ"},{"n":"2","text":"ㄱ, ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄷ, ㄹ"},{"n":"4","text":"ㄴ, ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험금청구권과 보험료·적립금 반환청구권은 3년이고 보험료청구권은 2년이다. ㄱ·ㄴ·ㄹ이 맞아 ②이다.\n\n오답 확인\nㄷ은 적립금 반환을 2년으로 잘못 썼다. 보험료를 내라는 보험자의 청구와 보험료를 돌려달라는 계약자의 청구는 방향뿐 아니라 시효도 다르다.\n\n근거·학습주제\n상법 제662조","explanationSections":[{"label":"정답 근거","text":"보험금청구권과 보험료·적립금 반환청구권은 3년이고 보험료청구권은 2년이다. ㄱ·ㄴ·ㄹ이 맞아 ②이다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ은 적립금 반환을 2년으로 잘못 썼다. 보험료를 내라는 보험자의 청구와 보험료를 돌려달라는 계약자의 청구는 방향뿐 아니라 시효도 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제662조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["4-13","7-15","11-13","5-10","8-17"]},{"id":"3-15","round":3,"year":2017,"number":15,"subject":"상법(보험편)","topic":"재보험과 불이익변경금지","stem":"보험계약자 등의 불이익변경금지에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"불이익변경금지는 보험자와 보험계약자의 관계에서 계약의 교섭력이 부족한 보험계약자 등을\n보호하기 위한 것이다."},{"n":"2","text":"상법 보험편의 규정은 가계보험에서 당사자간의 특약으로 보험계약자의 불이익으로 변경\n하지 못한다."},{"n":"3","text":"상법 보험편의 규정은 가계보험에서 당사자간의 특약으로 피보험자의 불이익으로 변경하\n지 못한다."},{"n":"4","text":"재보험은 당사자의 특약으로 보험계약자의 불이익으로 변경할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n상법 보험편의 불이익변경금지는 재보험·해상보험 등에서 예외가 인정된다. 재보험에도 예외 없이 금지된다는 ④가 틀리다.\n\n오답 확인\n가계보험에서 계약자·피보험자·수익자의 보호를 위해 법정 보장을 축소하지 못하는 원칙과 전문 보험자 사이의 재보험 특칙을 구분한다.\n\n근거·학습주제\n상법 제663조","explanationSections":[{"label":"정답 근거","text":"상법 보험편의 불이익변경금지는 재보험·해상보험 등에서 예외가 인정된다. 재보험에도 예외 없이 금지된다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"가계보험에서 계약자·피보험자·수익자의 보호를 위해 법정 보장을 축소하지 못하는 원칙과 전문 보험자 사이의 재보험 특칙을 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제663조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["4-14","7-16","8-13","12-12","9-14"]},{"id":"3-16","round":3,"year":2017,"number":16,"subject":"상법(보험편)","topic":"화재와 손해의 인과관계","stem":"화재보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 손해를 보상함에 있어서 화재와 손해 간에 상당인과관계는 필요하지 않다."},{"n":"2","text":"보험자는 화재의 소방에 필요한 조치로 인하여 생긴 손해를 보상할 책임이 있다."},{"n":"3","text":"보험자는 화재발생시 손해의 감소에 필요한 조치로 인하여 생긴 손해를 보상할 책임이 있다."},{"n":"4","text":"화재보험계약은 화재로 인하여 생긴 손해를 보상할 것을 목적으로 하는 손해보험계약이다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보상손해는 담보위험인 화재와 상당인과관계가 있어야 한다. 인과관계가 필요 없다는 ①이 틀리다.\n\n오답 확인\n소방에 필요한 조치나 화재손해 감소조치로 생긴 손해도 화재보험에서 보상한다. 불이 직접 닿은 소실손해만 보상하는 것은 아니다.\n\n근거·학습주제\n상법 제684조","explanationSections":[{"label":"정답 근거","text":"보상손해는 담보위험인 화재와 상당인과관계가 있어야 한다. 인과관계가 필요 없다는 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"소방에 필요한 조치나 화재손해 감소조치로 생긴 손해도 화재보험에서 보상한다. 불이 직접 닿은 소실손해만 보상하는 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제684조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["12-23","4-22","6-8","2-25","9-24","1-25","8-15","10-23","12-18"]},{"id":"3-17","round":3,"year":2017,"number":17,"subject":"상법(보험편)","topic":"화재보험증권 기재사항","stem":"화재보험증권에 기재하여야 할 사항으로 옳은 것을 모두 고른 것은?\nㄱ. 보험의 목적\nㄴ. 보험계약체결 장소\nㄷ. 동산을 보험의 목적으로 한 때에는 그 존치한 장소의 상태와 용도\nㄹ. 피보험자의 주소, 성명 또는 상호\nㅁ. 보험계약자의 주민등록번호","options":[{"n":"1","text":"ㄱ, ㄴ, ㄷ"},{"n":"2","text":"ㄱ, ㄷ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ, ㅁ"},{"n":"4","text":"ㄴ, ㄹ, ㅁ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험목적, 동산이 있는 장소의 상태·용도, 피보험자의 주소·성명·상호인 ㄱ·ㄷ·ㄹ이 맞아 ②이다. 일반 손해보험증권 사항에 화재보험의 추가사항을 더한다.\n\n오답 확인\n계약체결 '장소'와 체결 '연월일'을 구별한다. 계약자의 주민등록번호는 이 조문의 필수 기재사항으로 열거되어 있지 않다.\n\n근거·학습주제\n상법 제666조·제685조","explanationSections":[{"label":"정답 근거","text":"보험목적, 동산이 있는 장소의 상태·용도, 피보험자의 주소·성명·상호인 ㄱ·ㄷ·ㄹ이 맞아 ②이다. 일반 손해보험증권 사항에 화재보험의 추가사항을 더한다.","kind":"reason"},{"label":"오답 확인","text":"계약체결 '장소'와 체결 '연월일'을 구별한다. 계약자의 주민등록번호는 이 조문의 필수 기재사항으로 열거되어 있지 않다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조·제685조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["12-24","5-25","11-25"]},{"id":"3-18","round":3,"year":2017,"number":18,"subject":"상법(보험편)","topic":"집합보험의 시간적 기준","stem":"집합보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"집합보험이란 경제적으로 독립한 여러 물건의 집합물을 보험의 목적으로 한 보험을 말한다."},{"n":"2","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 피보험자의 사용인의 물건도 보험의\n목적에 포함된 것으로 본다."},{"n":"3","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간 중\n에 수시로 교체된 경우에도 보험계약체결시에 존재한 물건은 보험의 목적에 포함된 것으\n로 한다."},{"n":"4","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 피보험자의 가족의 물건도 보험의 목\n적에 포함된 것으로 본다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n구성품이 수시로 교체되는 집합보험은 사고발생 시 현존하는 물건이 기준이다. 체결 시 존재한 물건을 기준으로 한 ③이 틀리다.\n\n오답 확인\n집합물에 속하는 가족·사용인의 물건도 포함하는 특칙이 있다. 재고의 교체를 고려한 보험이므로 이미 반출된 물건을 계속 담보한다고 해석하지 않는다.\n\n근거·학습주제\n상법 제686조","explanationSections":[{"label":"정답 근거","text":"구성품이 수시로 교체되는 집합보험은 사고발생 시 현존하는 물건이 기준이다. 체결 시 존재한 물건을 기준으로 한 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"집합물에 속하는 가족·사용인의 물건도 포함하는 특칙이 있다. 재고의 교체를 고려한 보험이므로 이미 반출된 물건을 계속 담보한다고 해석하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제686조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["11-23","10-25","12-25","7-25","9-25","6-10","4-25","5-13","2-17","4-22"]},{"id":"3-19","round":3,"year":2017,"number":19,"subject":"상법(보험편)","topic":"중복보험의 연대책임","stem":"중복보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"중복보험에서 보험금액의 총액이 보험가액을 초과한 경우 보험자는 각자의 보험금액의 한\n도에서 연대책임을 진다."},{"n":"2","text":"피보험이익이 다를 경우에도 중복보험이 성립할 수 있다."},{"n":"3","text":"중복보험에서 수인의 보험자 중 1인에 대한 권리의 포기는 다른 보험자의 권리의무에 영\n향을 미친다."},{"n":"4","text":"중복보험이 성립하기 위해서는 보험계약자가 동일하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n동일한 목적·이익·사고를 여러 보험으로 보장하여 금액합계가 가액을 넘는 경우 각 보험자는 자기 금액 한도에서 연대책임을 지므로 ①이다.\n\n오답 확인\n피보험이익이 다르면 같은 건물이라도 중복보험이 아닐 수 있다. 한 보험자에 대한 권리포기는 다른 보험자에 영향이 없으며 계약자가 반드시 동일할 필요도 없다.\n\n근거·학습주제\n상법 제672조·제673조","explanationSections":[{"label":"정답 근거","text":"동일한 목적·이익·사고를 여러 보험으로 보장하여 금액합계가 가액을 넘는 경우 각 보험자는 자기 금액 한도에서 연대책임을 지므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"피보험이익이 다르면 같은 건물이라도 중복보험이 아닐 수 있다. 한 보험자에 대한 권리포기는 다른 보험자에 영향이 없으며 계약자가 반드시 동일할 필요도 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조· 다.","kind":"reason"},{"label":"오답 확인","text":"손해의 발생과 재산상 손해 보상은 기본 요소이다. 사고의 성질은 증권 필수 기재사항이다. 특약상 평가방식을 실손보상 원칙 자체와 혼동하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제665조·제666조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["1-14","5-13"]},{"id":"3-22","round":3,"year":2017,"number":22,"subject":"상법(보험편)","topic":"초과보험 감액의 장래효","stem":"초과보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"초과보험이 성립하기 위해서는 보험금액이 보험계약의 목적의 가액을 현저하게 초과하여\n야 한다."},{"n":"2","text":"보험가액이 보험기간 중에 현저하게 감소한 경우에 보험자 또는 보험계약자는 보험료와\n보험금액의 감액을 청구할 수 있다."},{"n":"3","text":"보험계약자의 사기로 인하여 체결된 초과보험계약은 무효로 한다."},{"n":"4","text":"초과보험의 효과로서 보험료 감액 청구에 따른 보험료의 감액은 소급효가 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n초과보험의 보험료·보험금액 감액은 장래에 대하여 효력이 있으므로 소급효가 있다는 ④가 틀리다.\n\n오답 확인\n보험금액의 현저한 초과가 필요하며 기간 중 가액의 현저한 감소에도 감액을 청구할 수 있다. 사기로 체결한 초과보험은 무효이다.\n\n근거·학습주제\n상법 제669조","explanationSections":[{"label":"정답 근거","text":"초과보험의 보험료·보험금액 감액은 장래에 대하여 효력이 있으므로 소급효가 있다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"보험금액의 현저한 초과가 필요하며 기간 중 가액의 현저한 감소에도 감액을 청구할 수 있다. 사기로 체결한 초과보험은 무효이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["11-15","4-16","8-16","9-11","6-24","12-14","5-14","10-16","2-11"]},{"id":"3-23","round":3,"year":2017,"number":23,"subject":"상법(보험편)","topic":"일부보험의 임의규정","stem":"일부보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"일부보험에 관한 상법의 규정은 강행규정으로 당사자간 다른 약정으로 손해보상액을 보험\n금액의 한도로 변경할 수 없다."},{"n":"2","text":"일부보험의 경우 당사자간에 다른 약정이 없는 때에는 보험자는 보험금액의 보험가액에 대\n한 비율에 따라 보상할 책임을 진다."},{"n":"3","text":"일부보험은 보험계약자가 보험료를 절약할 목적 등으로 활용된다."},{"n":"4","text":"일부보험은 보험가액의 일부를 보험에 붙인 보험이다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n일부보험의 비례보상은 다른 약정으로 보험금액 한도 실손보상 등으로 정할 수 있다. 강행규정이라 변경할 수 없다는 ①이 틀리다.\n\n오답 확인\n특약이 없으면 손해액×보험금액/보험가액이 원칙이다. 가액의 일부만 가입하면 보험료를 줄일 수 있으나 보상비율도 낮아질 수 있다 stem":"농어업재해보험법령의 내용으로 옳지 않은 것은?","options":[{"n":"1","text":"보험가입자는 재해로 인한 사고의 예방을 위하여 노력하여야 한다."},{"n":"2","text":"보험목적물이 담보로 제공된 경우에도 재해보험의 보험금을 지급받을 권리는 압류할 수\n없다."},{"n":"3","text":"재해보험가입자가 재해보험에 가입된 보험목적물을 양도하는 경우 그 양수인은 재해보험\n계약에 관한 양도인의 권리 및 의무를 승계한 것으로 추정한다."},{"n":"4","text":"재해보험사업자는 손해평가인으로 위촉된 사람에 대하여 보험에 관한 기초지식, 보험약관\n및 손해평가요령 등에 관한 실무교육을 하여야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n재해보험금 수급권은 원칙적으로 압류를 제한하지만 목적물이 담보로 제공된 때에는 예외가 있다. 담보제공 때도 절대 압류할 수 없다는 ②가 틀리다.\n\n오답 확인\n사고예방 노력, 양도 때 권리·의무 승계 추정, 평가인 기초 실무교육은 법령이 정한 내용이다. 수급권 보호의 원칙과 단서를 함께 확인한다.\n\n근거·학습주제\n농어업재해보험법 수급권 보호·목적물 양도 조항","explanationSections":[{"label":"정답 근거","text":"재해보험금 수급권은 원칙적으로 압류를 제한하지만 목적물이 담보로 제공된 때에는 예외가 있다. 담보제공 때도 절대 압류할 수 없다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"사고예방 노력, 양도 때 권리·의무 승계 추정, 평가인 기초 실무교육은 법령이 정한 내용이다. 수급권 보호의 원칙과 단서를 함께 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 수급권 보호·목적물 양도 조항","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["2-32","10-31","7-32","9-33","11-29"]},{"id":"3-34","round":3,"year":2017,"number":34,"subject":"농어업재해보험법령","topic":"손해평가반 구성 주체","stem":"농업재해보험 손해평가요령에 따른 손해평가반 구성에 포함될 수 있는 자를 모두 고른 것은?\nㄱ. 손해평가인 ㄴ. 손해평가사\nㄷ. 재물손해사정사 ㄹ. 신체손해사정사","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n요령은 손해평가인·손해평가사·손해사정사 중 1인 이상을 포함하도록 정한다. 이 문제의 최종정답은 ㄱ·ㄴ·ㄷ·ㄹ을 포함한 ④이다.\n\n오답 확인\n이 조문 자체가 재물손해사정사만이라고 한정하지 않았다는 것이 출제 기준이다. 이를 다른 보험업 법령상 업무범위를 무시해 어떤 평가도 무제한 수행할 수 있다는 뜻으로 확대하지 않는다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제8조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"요령은 손해평가인·손해평가사·손해사정사 중 1인 이상을 포함하도록 정한다. 이 문제의 최종정답은 ㄱ·ㄴ·ㄷ·ㄹ을 포함한 ④이다.","kind":"reason"},{"label":"오답 확인","text":"이 조문 자체가 재물손해사정사만이라고 한정하지 않았다는 것이 출제 기준이다. 이를 다른 보험업 법령상 업무범위를 무시해 어떤 평가도 무제한 수행할 수 있다는 뜻으로 확대하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제8조(출제 당시)","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":20,"similarIds":["9-38"]},{"id":"3-35","round":3,"year":2017,"number":35,"subject":"농어업재해보험법령","topic":"보험금의 지급주체","stem":"농어업재해보험법에서 사용하는 용어의 정의로 옳지 않은 것은?","options":[{"n":"1","text":"\"농어업재해보험\"이란 농어업재해로 발생하는 재산 피해에 따른 손해를 보상하기 위한 보험\n을 말한다."},{"n":"2","text":"\"보험료\"란 보험가입자와 보험사업자 간의 약정에 따라 보험가입자가 보험사업자에게 내야\n하는 금액을 말한다."},{"n":"3","text":"\"보험가입금액\"이란 보험가입자의 재산 피해에 따른 손해가 발생한 경우 보험에서 최대로\n보상할 수 있는 한도액으로서 보험가입자와 보험사업자 간에 약정한 금액을 말한다."},{"n":"4","text":"\"보험금\"이란 보험가입자에게 재해로 인한 재산 피해에 따른 손해가 발생한 경우 그 정도\n에 따라 정부가 보험가입자에게 지급하는 금액을 말한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험금은 약정에 따라 보험사업자가 가입자에게 지급한다. 정부가 피해 정도에 따라 직접 지급하는 금액이라고 한 ④는 재해지원금과 보험금을 혼동했다.\n\n오답 확인\n보험료는 가입자가 사업자에게 내는 대가, 보험가입금액은 계약상 한도이다. 정부의 보험료 지원·재보험 위험분담이 보험금 지급주체를 정부로 바꾸지는 않는다.\n\n근거·학습주제\n농어업재해보험법 제2조","explanationSections":[{"label":"정답 근거","text":"보험금은 약정에 따라 보험사업자가 가입자에게 지급한다. 정부가 피해 정도에 따라 직접 지급하는 금액이라고 한 ④는 재해지원금과 보험금을 혼동했다.","kind":"reason"},{"label":"오답 확인","text":"보험료는 가입자가 사업자에게 내는 대가, 보험가입금액은 계약상 한도이다. 정부의 보험료 지원·재보험 위험분담이 보험금 지급주체를 정부로 바꾸지는 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제2조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":20,"similarIds":["11-32","9-26","2-27","1-27","10-39","7-26"]},{"id":"3-36","round":3,"year":2017,"number":36,"subject":"농어업재해보험법령","topic":"회계구분의 주체","stem":"농어업재해보험법상 회계구분에 관한 내용이다. ( )에 들어갈 용어는?\n( )은(는) 재해보험사업의 회계를 다른 회계와 구분하여 회계처리함으로써\n손익관계를 명확히 하여야 한다.","options":[{"n":"1","text":"손해평가사"},{"n":"2","text":"농림축산식품부장관"},{"n":"3","text":"재해보험사업자"},{"n":"4","text":"지방자치단체의 장"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n재해보험 회계를 다른 회계와 구분하여 손익을 명확히 해야 하는 자는 그 사업을 운영하는 재해보험사업자이므로 ③이다.\n\n오답 확인\n장관·지자체장은 지원·감독 관련 주체이고 손해평가사는 손해 평가업무를 수행한다. 보험사업 회계의 직접 작성·구분 의무와는 다르다.\n\n근거·학습주제\n농어업재해보험법 제15조","explanationSections":[{"label":"정답 근거","text":"재해보험 회계를 다른 회계와 구분하여 손익을 명확히 해야 하는 자는 그 사업을 운영하는 재해보험사업자이므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"장관·지자체장은 지원·감독 관련 주체이고 손해평가사는 손해 평가업무를 수행한다. 보험사업 회계의 직접 작성·구분 의무와는 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제15조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":21,"similarIds":["10-37"]},{"id":"3-37","round":3,"year":2017,"number":37,"subject":"농어업재해보험법령","topic":"재보험약정과 기금수익","stem":"농어업재해보험법령상 농림축산식품부장관이 재보험에 가입하려는 재해보험사업자와\n재보험 약정체결 시 포함되어야 할 사항으로 옳지 않은 것은?","options":[{"n":"1","text":"재보험수수료"},{"n":"2","text":"정부가 지급하여야 할 보험금"},{"n":"3","text":"농어업재해재보험기금의 운용수익금"},{"n":"4","text":"재해보험사업자가 정부에 내야 할 보험료"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n재보험약정은 사업자가 정부에 낼 재보험료, 정부가 지급할 재보험금, 재보험수수료 등 당사자 간 권리·의무를 정한다. 기금 운용수익금은 기금 재원 문제이므로 ③이 틀리다.\n\n오답 확인\n기금의 조성·운용과 개별 재보험계약의 약정사항을 나눈다. 정부가 원보험 사업자와 약정해 부담하는 금액이 재보험금이라는 점도 확인한다.\n\n근거·학습주제\n농어업재해보험법 제20조·제22조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"재보험약정은 사업자가 정부에 낼 재보험료, 정부가 지급할 재보험금, 재보험수수료 등 당사자 간 권리·의무를 정한다. 기금 운용수익금은 기금 재원 문제이므로 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"기금의 조성·운용과 개별 재보험계약의 약정사항을 나눈다. 정부가 원보험 사업자와 약정해 부담하는 금액이 재보험금이라는 점도 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제20조·제22조(출제 당시)","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":21,"similarIds":["11-37","5-26","6-37"]},{"id":"3-38","round":3,"year":2017,"number":38,"subject":"농어업재해보험법령","topic":"기금관리 사무의 위탁범위","stem":"농어업재해보험법령상 농어업재해재보험기금의 관리ㆍ운용에 관한 설명으로 옳지 않은\n것은?","options":[{"n":"1","text":"기금은 농림축산식품부장관이 해양수산부장관과 협의하여 관리ㆍ운용한다."},{"n":"2","text":"농림축산식품부장관은 기획재정부장관과 협의를 거쳐 기금의 관리ㆍ운용에 관한 사무의\n전부를 농업정책보험금융원에 위탁할 수 있다."},{"n":"3","text":"기금수탁관리자는 회계연도마다 기금결산보고서를 작성하여 다음 회계연도 2월 15일까지\n농림축산식품부장관 및 해양수산부장관에게 제출하여야 한다."},{"n":"4","text":"농림축산식품부장관은 해양수산부장관과 협의하여 기금의 여유자금을 「은행법」에 따른\n은행에의 예치의 방법으로 운용할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n출제 당시 기금 관리·운용 사무는 법령이 정한 범위에서 일부를 위탁할 수 있었다. 사무 전부를 위탁할 수 있다는 ②가 틀리다.\n\n오답 확인\n관계 장관의 협의 관리, 수탁관리자의 다음 회계연도 2월15일 결산보고서 제출, 은행 예치에 의한 여유자금 운용은 해당 규정과 맞는다.\n\n근거·학습주제\n농어업재해보험법 제24조 및 당시 시행령 제18조·제19조·제20조","explanationSections":[{"label":"정답 근거","text":"출제 당시 기금 관리·운용 사무는 법령이 정한 범위에서 일부를 위탁할 수 있었다. 사무 전부를 위탁할 수 있다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"관계 장관의 협의 관리, 수탁관리자의 다음 회계연도 2월15일 결산보고서 제출, 은행 예치에 의한 여유자금 운용은 해당 규정과 맞는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제24조 및 당시 시행령 제18조·제19조·제20조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":22,"similarIds":["11-36","4-35","7-36","8-36","10-36","2-36","4-37","9-36","7-35","10-34","10-35","6-39","9-37","5-27"]},{"id":"3-39","round":3,"year":2017,"number":39,"subject":"농어업재해보험법령","topic":"효율적 추진업무의 범위","stem":"농어업재해보험법상 농림축산식품부장관이 농작물 재해보험사업을 효율적으로 추진하기\n위하여 수행하는 업무로 옳지 않은 것은?","options":[{"n":"1","text":"피해 관련 분쟁조정"},{"n":"2","text":"손해평가인력의 육성"},{"n":"3","text":"재해보험 상품의 연구 및 보급"},{"n":"4","text":"손해평가기법의 연구ㆍ개발 및 보급"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n상품 연구·보급, 평가인력 육성, 평가기법 연구·개발·보급은 장관의 효율적 추진업무에 속한다. 피해 관련 분쟁조정을 이 열거업무로 제시한 ①이 해당하지 않는다.\n\n오답 확인\n분쟁해결이 행정적으로 중요하다는 일반론과 법의 특정 조문에 열거된 업무를 구분한다. 모든 보험 관련 업무가 이 조문에 포함되는 것은 아니다.\n\n근거·학습주제\n농어업재해보험법 제25조의2(출제 당시)","explanationSections":[{"label":"정답 근거","text":"상품 연구·보급, 평가인력 육성, 평가기법 연구·개발·보급은 장관의 효율적 추진업무에 속한다. 피해 관련 분쟁조정을 이 열거업무로 제시한 ①이 해당하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"분쟁해결이 행정적으로 중요하다는 일반론과 법의 특정 조문에 열거된 업무를 구분한다. 모든 보험 관련 업무가 이 조문에 포함되는 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제25조의2(출제 당시)","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":22,"similarIds":["1-37","2-50"]},{"id":"3-40","round":3,"year":2017,"number":40,"subject":"농어업재해보험법령","topic":"재정지원의 임의성과 이중지원 제한","stem":"농어업재해보험법령상 재정지원에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"정부는 재해보험가입자가 부담하는 보험료와 재해보험사업자의 재해보험의 운영 및 관리\n에 필요한 비용을 지원하여야 한다 :"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":24,"similarIds":["1-41","12-41","9-39","8-41","2-43","11-38"]},{"id":"3-44","round":3,"year":2017,"number":44,"subject":"농어업재해보험법령","topic":"위촉취소와 정지·해지의 구별","stem":"농업재해보험 손해평가요령에 따른 손해평가인 위촉의 취소 사유에 해당하지 않는\n것은?","options":[{"n":"1","text":"업무수행과 관련하여「개인정보보호법」을 위반한 경우"},{"n":"2","text":"위촉당시 피성년후견인이었음이 판명된 경우"},{"n":"3","text":"거짓 그 밖의 부정한 방법으로 손해평가인으로 위촉된 경우"},{"n":"4","text":"「농어업재해보험법」제30조에 의하여 벌금이상의 형을 선고받고 그 집행이 종료된 날로\n부터 2년이 경과되지 않은 경우"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n업무 중 개인정보보호법 위반은 업무정지나 위촉해지 사유로 다룬다. 위촉당시 결격·부정 위촉에 따른 취소사유와 달라 ①이다.\n\n오답 확인\n위촉당시 피성년후견인, 부정 위촉, 법 위반 벌금형 집행종료 후 2년 미경과는 취소사유로 제시되어 있다. 모든 제재를 '취소'로 묶지 않는다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제6조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"업무 중 개인정보보호법 위반은 업무정지나 위촉해지 사유로 다룬다. 위촉당시 결격·부정 위촉에 따른 취소사유와 달라 ①이다.","kind":"reason"},{"label":"오답 확인","text":"위촉당시 피성년후견인, 부정 위촉, 법 위반 벌금형 집행종료 후 2년 미경과는 취소사유로 제시되어 있다. 모든 제재를 '취소'로 묶지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제6조(출제 당시)","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":25,"similarIds":["2-44","9-42","12-40","8-42","5-33"]},{"id":"3-45","round":3,"year":2017,"number":45,"subject":"농어업재해보험법령","topic":"농작물의 평가단위","stem":"농업재해보험 손해평가요령에 따른 농작물의 손해평가 단위는?","options":[{"n":"1","text":"농가별"},{"n":"2","text":"농지별"},{"n":"3","text":"필지(지번)별"},{"n":"4","text":"품종별"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n농작물은 농지별로 평가하므로 ②이다. 농지는 재배구역·경계 등을 고려한 평가단위로 농가 전체나 지번과 항상 일치하지 않는다.\n\n오답 확인\n같은 농가라도 농지가 나뉘면 손해·보장조건을 각각 평가한다. 품종별 조사자료를 구분하더라도 최종 평가단위와 동일한 개념은 아니다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제12조","explanationSections":[{"label":"정답 근거","text":"농작물은 농지별로 평가하므로 ②이다. 농지는 재배구역·경계 등을 고려한 평가단위로 농가 전체나 지번과 항상 일치하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"같은 농가라도 농지가 나뉘면 손해·보장조건을 각각 평가한다. 품종별 조사자료를 구분하더라도 최종 평가단위와 동일한 개념은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제12조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":25,"similarIds":["2-38"]},{"id":"3-46","round":3,"year":2017,"number":46,"subject":"농어업재해보험법령","topic":"나무손해의 보험가액","stem":"농업재해보험 손해평가요령에 따른 보험가액 산정에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"농작물의 생산비보장 보험가액은 작물별로 보험가입 당시 정한 보험가액을 기준으로\n산정한다. 다만, 보험가액에 영향을 미치는 가입면적 등이 가입당시와 다를 경우 변경\n할 수 있다."},{"n":"2","text":"나무손해보장 보험가액은 기재된 보험목적물이 나무인 경우로 최초 보험사고 발생 시의\n해당 농지 내에 심어져 있는 과실생산이 가능한 나무에서 피해 나무를 제외한 수에 보험\n가입 당시의 나무당 가입가격을 곱하여 산정한다."},{"n":"3","text":"가축에 대한 보험가액은 보험사고가 발생한 때와 곳에서 평가한 보험목적물의 수량에 적용\n가격을 곱하여 산정한다."},{"n":"4","text":"농업시설물에 대한 보험가액은 보험사고가 발생한 때와 곳에서 평가한 피해목적물의 재조달\n가액에서 내용연수에 따른 감가상각률을 적용하여 계산한 감가상각액을 차감하여 산정한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n최초 사고 시 과실생산 가능한 나무 수에는 피해 나무도 포함한다. 피해 나무를 제외한 수라고 한 ②는 보험가액을 사고손해만큼 줄이는 오류이다.\n\n오답 확인\n가축은 사고 시·곳의 수량×적용가격, 시설은 재조달가액에서 감가상각 차감, 생산비보장은 가입 때 정한 기준가액으로 산정하는 규정과 구별한다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제13조·제14조·제15조","explanationSections":[{"label":"정답 근거","text":"최초 사고 시 과실생산 가능한 나무 수에는 피해 나무도 포함한다. 피해 나무를 제외한 수라고 한 ②는 보험가액을 사고손해만큼 줄이는 오류이다.","kind":"reason"},{"label":"오답 확인","text":"가축은 사고 시·곳의 수량×적용가격, 시설은 재조달가액에서 감가상각 차감, 생산비보장은 가입 때 정한 기준가액으로 산정하는 규정과 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제13조·제14조·제15조","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":["12-47","7-50","1-50","5-48","1-46","2-41","9-48","11-50","5-46","6-48","10-50","8-50"]},{"id":"3-47","round":3,"year":2017,"number":47,"subject":"농어업재해보험법령","topic":"우박 직후의 조사와 수확 전 조사","stem":"농업재해보험 손해평가요령상 농작물의 품목별ㆍ재해별ㆍ시기별 손해수량 조사방법\n중 특정위험방식 상품 “사과”에 관한 기술이다. ( )에 들어갈 내용으로 옳은 것은?\n생육시기 재해 조사시기 조사내용\n적과후 ～ 수확전 우박 사고접수 후 지체없이 ( )","options":[{"n":"1","text":"유과타박율 조사"},{"n":"2","text":"적과후착과수 조사"},{"n":"3","text":"낙과수 조사"},{"n":"4","text":"수확전착과피해 조사"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n해당 표의 '적과후~수확전, 우박, 접수 후 지체 없이'에 해당하는 것은 낙과수 ":[]},{"id":"3-55","round":3,"year":2017,"number":55,"subject":"재배학·원예작물학","topic":"습해와 황산근 비료","stem":"작물재배 시 습해의 대책이 아닌 것은?","options":[{"n":"1","text":"배수"},{"n":"2","text":"토양 개량"},{"n":"3","text":"황산근비료 시용"},{"n":"4","text":"내습성 작물과 품종 선택"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n과습한 환원토양에서는 황산염이 환원되어 황화수소 등 뿌리에 해로운 물질이 생길 수 있어 황산근비료 시용은 습해대책으로 부적절하다. 따라서 ③이다.\n\n오답 확인\n배수는 근권 산소를 회복시키고 토양개량은 물리성을 개선한다. 내습성 작물·품종 선택도 피해를 줄이는 방법이다.\n\n근거·학습주제\n재배학: 습해·토양환원","explanationSections":[{"label":"정답 근거","text":"과습한 환원토양에서는 황산염이 환원되어 황화수소 등 뿌리에 해로운 물질이 생길 수 있어 황산근비료 시용은 습해대책으로 부적절하다. 따라서 ③이다.","kind":"reason"},{"label":"오답 확인","text":"배수는 근권 산소를 회복시키고 토양개량은 물리성을 개선한다. 내습성 작물·품종 선택도 피해를 줄이는 방법이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 습해·토양환원","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":["4-64"]},{"id":"3-56","round":3,"year":2017,"number":56,"subject":"재배학·원예작물학","topic":"건조와 질소 과용","stem":"작물재배 시 건조해의 대책으로 옳지 않은 것은?","options":[{"n":"1","text":"중경제초"},{"n":"2","text":"질소비료 과용"},{"n":"3","text":"내건성 작물 및 품종 선택"},{"n":"4","text":"증발억제제 살포"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n질소 과용은 과번무와 엽면적 증가를 유도해 물 소비를 늘리고 조직을 연약하게 할 수 있으므로 건조해 대책으로 부적절한 ②이다.\n\n오답 확인\n중경제초는 잡초와의 수분 경쟁·표면 증발을 줄이는 관리, 내건성 품종 선택과 증발억제제는 피해 경감 수단이다. 과도한 경운으로 뿌리를 다치게 하는 것과는 구별한다.\n\n근거·학습주제\n재배학: 한해 대책","explanationSections":[{"label":"정답 근거","text":"질소 과용은 과번무와 엽면적 증가를 유도해 물 소비를 늘리고 조직을 연약하게 할 수 있으므로 건조해 대책으로 부적절한 ②이다.","kind":"reason"},{"label":"오답 확인","text":"중경제초는 잡초와의 수분 경쟁·표면 증발을 줄이는 관리, 내건성 품종 선택과 증발억제제는 피해 경감 수단이다. 과도한 경운으로 뿌리를 다치게 하는 것과는 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 한해 대책","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"3-57","round":3,"year":2017,"number":57,"subject":"재배학·원예작물학","topic":"북방형 목초의 하고","stem":"작물재배 시 하고(夏枯)현상으로 옳지 않은 것은?","options":[{"n":"1","text":"화이트클로버는 피해가 크고, 레드클로버는 피해가 경미하다."},{"n":"2","text":"다년생인 북방형 목초에서 여름철에 생장이 현저히 쇠퇴하는 현상이다."},{"n":"3","text":"고온, 건조, 장일, 병충해, 잡초무성의 원인으로 발생한다."},{"n":"4","text":"대책으로는 관개, 혼파, 방목이 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n북방형 다년생 목초가 여름의 고온·건조 등으로 생육이 쇠퇴하는 현상이 하고이다. 화이트클로버가 피해가 크고 레드클로버가 경미하다고 뒤바꾼 ①이 틀리다.\n\n오답 확인\n레드클로버는 하고에 유의하는 초종이다. 관개·혼파·적절한 이용관리 등으로 고온기 경쟁과 스트레스를 줄이며 모든 작물을 같은 내서성으로 취급하지 않는다.\n\n근거·학습주제\n사료작물학: 하고와 초종별 적응","explanationSections":[{"label":"정답 근거","text":"북방형 다년생 목초가 여름의 고온·건조 등으로 생육이 쇠퇴하는 현상이 하고이다. 화이트클로버가 피해가 크고 레드클로버가 경미하다고 뒤바꾼 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"레드클로버는 하고에 유의하는 초종이다. 관개·혼파·적절한 이용관리 등으로 고온기 경쟁과 스트레스를 줄이며 모든 작물을 같은 내서성으로 취급하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"사료작물학: 하고와 초종별 적응","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"3-58","round":3,"year":2017,"number":58,"subject":"재배학·원예작물학","topic":"장해형·병해형 냉해","stem":"다음이 설명하는 냉해는?\nㄱ. 냉온에 대한 저항성이 약한 시기인 감수분열기에 저온에 노출되어 수분수\n정이 안되어 불임현상이 초래되는 냉해를 말한다.\nㄴ. 냉온에 의한 생육부진으로 외부 병균의 침입에 대한 저항성이 저하되어\n병이 발생하는 냉해를 말한다.","options":[{"n":"1","text":"ㄱ: 지연형 냉해, ㄴ: 병해형 냉해"},{"n":"2","text":"ㄱ: 병해형 냉해, ㄴ: 혼합형 냉해"},{"n":"3","text":"ㄱ: 장해형 냉해, ㄴ: 병해형 냉해"},{"n":"4","text":"ㄱ: 혼합형 냉해, ㄴ: 장해형 냉해"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n감수분열기 저온으로 화분 기능·수정이 손상되어 불임이 생기는 것은 장해형, 저온으로 병 저항성이 떨어져 병이 발생하는 것은 병해형이므로 ③이다.\n\n오답 확인\n지연형은 생육·출수·등숙의 지연이 중심이며 혼합형은 여러 냉해 기작이 함께 나타나는 경우이다. 단순히 저온이라는 말보다 피해 양상을 읽는다.\n\n근거·학습주제\n농업기상: 냉해 유형","explanationSections":[{"label":"정답 근거","text":"감수분열기 저온으로 화분 기능·수정이 손상되어 불임이 생기는 것은 장해형, 저온으로 병 저항성이 떨어져 병이 발생하는 것은 병해형이므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"지연형은 생육·출수·등숙의 지연이 중심이며 혼합형은 여러 냉해 기작이 함께 나타나는 경우이다. 단순히 저온이라는 말보다 피해 양상을 읽는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업기상: 냉해 유형","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":["7-55","12-56"]},{"id":"3-59","round":3,"year":2017,"number":59,"subject":"재배학·원예작물학","topic":"안토시아닌과 온도","stem":"작물 외관의 착색에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"작물 재배 시 광이 없을 때에는 에티올린(etiolin)이라는 담황색 색소가 형성되어 황백화\n현상을 일으킨다."},{"n":"2","text":"엽채류에서는 적색광과 청색광에서 엽록소의 형성이 가장 효과적이다."},{"n":"3","text":"작물 재배 시 광이 부족하면 엽록소의 형성이 저해된다."},{"n":"4","text":"과일의 안토시안은 비교적 고온에서 생성이 조장되며 볕이 잘 쬘 때에 착색이 좋아진다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n과실 안토시아닌 생성은 충분한 광과 비교적 서늘한 온도에서 촉진되는 경우가 많아 비교적 고온에서 조장된다고 일반화한 ④가 틀리다.\n\n오답 확인\n고온의 붉은 착색 불량과 차가운 밤의 착색 촉진을 연결한다. 빛이 없으면 엽록소 발달이 억제되어 황백화가 나타나는 현상과 안토시아닌 착색은 구분한다.\n\n근거·학습주제\n원예생리: 색소와 착색","explanationSections":[{"label":"정답 근거","text":"과실 안토시아닌 생성은 충분한 광과 비교적 서늘한 온도에서 촉진되는 경우가 많아 비교적 고온에서 조장된다고 일반화한 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"고온의 붉은 착색 불량과 차가운 밤의 착색 촉진을 연결한다. 빛이 없으면 엽록소 발달이 억제되어 황백화가 나타나는 현상과 안토시아닌 착색은 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예생리: 색소와 착색","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"3-60","round":3,"year":2017,"number":60,"subject":"재배학·원예작물학","topic":"장일성 채소","stem":"장일일장 조건에서 개화가 유도ㆍ촉진되는 작물을 모두 고른 것은?\nㄱ. 상추 ㄴ. 고추 ㄷ. 딸기 ㄹ. 시금치","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n상추와 시금치는 장일에 추대·개화가 촉진되는 대표 작물이므로 ㄱ·ㄹ인 ②이다.\n\n오답 확인\n고추는 대표적 중성식물이고 딸기는 품종·작형에 따라 일장반응이 다르며 일반 단일성 설명과 구별한다. 일장이 생육량에 미치는 영향과 개화유도 분류는 다른 개념이다.\n\n근거·학습주제\n원예학: 일장반응","explanationSections":[{"label":"정답 근거","text":"상추와 시금치는 장일에 추대·개화가 촉진되는 대표 작물이므로 ㄱ·ㄹ인 ②이다.","kind":"reason"},{"label":"오답 확인","text":"고추는 대표적 중성식물이고 딸기는 품종·작형에 따라 일장반응이 다르며 일반 단일성 설명과 구별한다. 일장이 생육량에 미치는 영향과 개화유도 분류는 다른 개념이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학: 일장반응","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"3-61","round":3,"year":2017,"number":61,"subject":"재배학·원예작물학","topic":"과수의 상대적 내한성","stem":"다음에서 내한성(耐寒性)이 가장 강한 작물(A)과 가장 약한 작물(B)은?","options":[{"n":"1","text":"A: 사과, B: 서양배"},{"n":"2","text":"A: 사과, B: 유럽계 포도"},{"n":"3","text":"A: 복숭아, B: 서양배"},{"n":"4","text":"A: 복숭아, B: 유럽계 포도"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n제시된 과수 중 사과가 내한성이 강하고 유럽계 포도가 약한 것으로 비교하므로 ②이다.\n\n오답 확인\n미국계·교잡계 포도의 특성을 유럽계 포도에 일괄 적용하지 않는다. 실제 동해 위험은 품종·대목·휴면단계·순화상태에 따라서도 달라진다.\n\n근거·학습주제\n과수 재해생리: 내한성","explanationSections":[{"label":"정답 근거","text":"제시된 과수 중 사과가 내한성이 강하고 유럽계 포도가 약한 것으로 비교하므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"미국계·교잡계 포도의 특성을 유럽계 포도에 일괄 적용하지 않는다. 실제 동해 위험은 품종·대목·휴면단계·순화상태에 따라서도 달라진다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 재해생리: 내한성","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"3-62","round":3,"year":2017,"number":62,"subject":"재배학·원예작물학","topic":"우박 피해와 이차 병해","stem":"우리나라의 과수 우박피해에 관한 설명으로 옳은 것은?\nㄱ. 피해 시기는 주로 착과기와 성숙기에 해당된다.\nㄴ. 다음해의 안정적인 결실을 위해 피해과원의 모든 과실을 제거한다.\nㄷ. 피해 후 2차적으로 병해를 발생시키는 간접적인 피해를 유발하기도 한다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n착과·성숙기의 우박은 과실·신초에 상처를 주고 이차 병해도 유발하므로 ㄱ·ㄷ인 ②이다.\n\n오답 확인\n모든 과실을 무조건 제거하지는 않는다. 피해 정도와 나무 생육·회복을 살펴 적정 착과량을 유지하고 상처의 이차 감염을 방지한다.\n\n근거·학습주제\n농촌진흥청 과수 우박피해 관리","explanationSections":[{"label":"정답 근거","text":"착과·성숙기의 우박은 과실·신초에 상처를 주고 이차 병해도 유발하므로 ㄱ·ㄷ인 ②이다.","kind":"reason"},{"label":"오답 확인","text":"모든 과실을 무조건 제거하지는 않는다. 피해 정도와 나무 생육·회복을 살펴 적정 착과량을 유지하고 상처의 이차 감염을 방지한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농촌진흥청 과수 우박피해 관리","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":["12-59"]},{"id":"3-63","round":3,"year":2017,"number":63,"subject":"재배학·원예작물학","topic":"방풍효과와 빈 공간","stem":"과수원의 태풍피해 대책으로 옳지 않은 것은?","options":[{"n":"1","text":"방풍림으로 교목과 관목의 혼합 식재가 효과적이다."},{"n":"2","text":"방풍림은 바람의 방향과 직각 방향으로 심는다."},{"n":"3","text":"과수원내의 빈 공간 확보는 태풍피해를 경감시켜 준다."},{"n":"4","text":"왜화도가 높은 대목은 지주 결속으로 피해를 줄여준다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n과수원 내 넓은 빈 공간은 바람의 통로가 되거나 방풍효과를 떨어뜨릴 수 있어 태풍피해를 줄인다고 일반화한 ③이 틀리다.\n\n오답 확인\n교목·관목 혼식은 여러 높이의 바람을 줄이고 주풍향에 직각인 방풍림은 효과적이다. 왜성대목 과수는 지주와 결속으로 지지력을 확보한다.\n\n근거·학습주제\n과수 재해관리: 방풍·지주","explanationSections":[{"label":"정답 근거","text":"과수원 내 넓은 빈 공간은 바람의 통로가 되거나 방풍효과를 떨어뜨릴 수 있어 태풍피해를 줄인다고 일반화한 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"교목·관목 혼식은 여러 높이의 바람을 줄이고 주풍향에 직각인 방풍림은 효과적이다. 왜성대목 과수는 지주와 결속으로 지지력을 확보한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 재해관리: 방풍·지주","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"3-64","round":3,"year":2017,"number":64,"subject":"재배학·원예작물학","topic":"육묘상토의 적정 산도","stem":"작물의 육묘에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"수확기 및 출하기를 앞당길 수 있다."},{"n":"2","text":"육묘용 상토의 pH는 낮을수록 좋다."},{"n":"3","text":"노지정식 전 경화과정(hardening)이 필요하다."},{"n":"4","text":"육묘와 재배의 분업화가 가능하다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n상토 pH는 작물에 맞는 적정 범위가 필요하며 낮을수록 좋지 않다. 지나친 산성은 뿌리·양분 이용에 불리하므로 ②가 틀리다.\n\n오답 확인\n육묘는 재배기간 단축·조기 출하와 분업화를 가능하게 하고, 정식 전에 경화해 노지의 광·온도·수분변화에 적응시킨다.\n\n근거·학습주제\n원예육묘학: 상토·순화","explanationSections":[{"label":"정답 근거","text":"상토 pH는 작물에 맞는 적정 범위가 필요하며 낮을수록 좋지 않다. 지나친 산성은 뿌리·양분 이용에 불리하므로 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"육묘는 재배기간 단축·조기 출하와 분업화를 가능하게 하고, 정식 전에 경화해 노지의 광·온도·수분변화에 적응시킨다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예육묘학: 상토·순화","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"3-65","round":3,"year":2017,"number":65,"subject":"재배학·원예작물학","topic":"고취법에 의한 발근","stem":"다음 설명의 영양번식 방법은?\n○ 양취법(楊取法)이라고도 한다.\n○ 오래된 가지를 발근시켜 떼어낼 때 사용한다.\n○ 발근시키고자 하는 부분에 미리 박피를 해준다.","options":[{"n":"1","text":"성토법(盛土法)"},{"n":"2","text":"선취법(先取法)"},{"n":"3","text":"고취법(高取法)"},{"n":"4","text":"당목취법(撞木取法)"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n고취법은 양취법이라고도 하며 지상부 가지에 환상박피 등의 처리를 하고 보습재로 감싸 발근시킨 뒤 분리한다. 따라서 ③이다.\n\n오답 확인\n땅에 가지를 묻는 선취법·당목취법이나 밑동에 흙을 쌓는 성토법과 다르다. 오래된 가지의 발근부위에서 동화산물 이동을 차단하는 처리가 단서이다.\n\n근거·학습주제\n원예번식학: 취목법","explanationSections":[{"label":"정답 근거","text":"고취법은 양취법이라고도 하며 지상부 가지에 환상박피 등의 처리를 하고 보습재로 감싸 발근시킨 뒤 분리한다. 따라서 ③이다.","kind":"reason"},{"label":"오답 확인","text":"땅에 가지를 묻는 선취법·당목취법이나 밑동에 흙을 쌓는 성토법과 다르다. 오래된 가지의 발근부위에서 동화산물 이동을 차단하는 처리가 단서이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예번식학: 취목법","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":["1-59"]},{"id":"3-66","round":3,"year":2017,"number":66,"subject":"재배학·원예작물학","topic":"청경재배의 특징","stem":"다음의 과수원 토양관리 방법은?\n○ 과수원 관리가 쉽다.\n○ 양분용탈이 발생한다.\n○ 토양침식으로 입단형성이 어렵다.","options":[{"n":"1","text":"초생재배"},{"n":"2","text":"피복재배"},{"n":"3","text":"부초재배"},{"n":"4","text":"청경재배"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n풀을 제거하여 토양표면을 드러내는 청경재배는 관리가 쉽지만 강우에 노출되어 침식·양분유실·입단파괴에 취약하므로 ④이다.\n\n오답 확인\n초생·피복·부초재배는 식생이나 자재로 지표를 덮어 침식과 수분변동을 줄이는 쪽으로 작용한다. 관리 편의와 장기 토양보전은 별개의 평가기준이다.\n\n근거·학습주제\n과수 토양관리: 청경법","explanationSections":[{"label":"정답 근거","text":"풀을 제거하여 토양표면을 드러내는 청경재배는 관리가 쉽지만 강우에 노출되어 침식·양분유실·입단파괴에 취약하므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"초생·피복·부초재배는 식생이나 자재로 지표를 덮어 침식과 수분변동을 줄이는 쪽으로 작용한다. 관리 편의와 장기 토양보전은 별개의 평가기준이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 토양관리: 청경법","kind":"reference"}],"sourcePdf":"2017년 제3회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"3-67","round":3,"year":2017,"number":67,"subject":"재배학·원예작물학","topic":"종합적 병해충관리와 천적","stem":"사과 과원에서 병해충종합관리(IPM)에 해당되지 않는 것은?","options":[{"n":"1","text":"응애류 천적 제거"},{"n":"2","text":"성페로몬 이용"},{"n":"3","text":"초생재배 실시"},{"n":"4","text":"생물농약 활용"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\nIPM은 예찰·경제적 피해수준과 다양한 방제수단을 종합하고 천적을 보존한다. 응애류 천적을 제거한다는 ①은 반대이다.\n\n오답 확인\n성페로몬, 생물농약, 적절한 초생관리는 발생 감시·교미
