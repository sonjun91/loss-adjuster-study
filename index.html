":"정답 근거\n수협중앙회·산림조합중앙회 및 보험업법상 보험회사는 법정 사업자 범위이다.\n\n오답 확인\n새마을금고중앙회는 해당 열거에 없다. 다른 협동조합 금융기관이라는 이유만으로 포함할 수 없다.\n\n근거·학습주제\n농어업재해보험법 제8조","explanationSections":[{"label":"정답 근거","text":"수협중앙회·산림조합중앙회 및 보험업법상 보험회사는 법정 사업자 범위이다.","kind":"reason"},{"label":"오답 확인","text":"새마을금고중앙회는 해당 열거에 없다. 다른 협동조합 금융기관이라는 이유만으로 포함할 수 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제8조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["5-38","12-28","7-27","1-35","5-40","10-32"]},{"id":"10-29","round":10,"year":2024,"number":29,"subject":"농어업재해보험법령","topic":"정기교육 횟수와 시간","stem":"농어업재해보험법령상 손해평가사의 정기교육에 관한 설명이다. ( )에 들어갈\n숫자로 옳은 것은?\n○ 농림축산식품부장관 또는 해양수산부장관은 손해평가인이 공정하고 객관적인\n손해평가를 수행할 수 있도록 연 ( ㄱ )회 이상 정기교육을 실시하여야 한다.\n○ 정기교육의 교육시간은 ( ㄴ )시간 이상으로 한다.","options":[{"n":"1","text":"ㄱ: 1, ㄴ: 4"},{"n":"2","text":"ㄱ: 1, ㄴ: 5"},{"n":"3","text":"ㄱ: 2, ㄴ: 4"},{"n":"4","text":"ㄱ: 2, ㄴ: 6"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n손해평가인 정기교육은 연 1회 이상이며 교육시간은 4시간 이상이다.\n\n오답 확인\n연 2회나 5·6시간은 제시 법정 최소기준과 다르다. 문제 머리말의 손해평가사 표현과 달리 인용 규정의 대상은 손해평가인이다.\n\n근거·학습주제\n농어업재해보험법 제11조·시행령 제12조","explanationSections":[{"label":"정답 근거","text":"손해평가인 정기교육은 연 1회 이상이며 교육시간은 4시간 이상이다.","kind":"reason"},{"label":"오답 확인","text":"연 2회나 5·6시간은 제시 법정 최소기준과 다르다. 문제 머리말의 손해평가사 표현과 달리 인용 규정의 대상은 손해평가인이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조·시행령 제12조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["12-33","5-42","7-29","8-29"]},{"id":"10-30","round":10,"year":2024,"number":30,"subject":"농어업재해보험법령","topic":"자격취소 제재기준","stem":"농어업재해보험법령상 손해평가사의 자격 취소 사유에 해당하는 위반 행위를 한\n경우, 1회 위반 시에는 자격 취소를 하지 않고 시정명령을 하는 경우는?","options":[{"n":"1","text":"손해평가사의 자격을 거짓 또는 부정한 방법으로 취득한 경우"},{"n":"2","text":"거짓으로 손해평가를 한 경우"},{"n":"3","text":"다른 사람에게 손해평가사의 명의를 사용하게 하거나 그 자격증을 대여한 경우"},{"n":"4","text":"업무정지 기간 중에 손해평가 업무를 수행한 경우"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n거짓 손해평가는 제시 제재기준에서 최초 위반 시 시정명령에 해당한다.\n\n오답 확인\n부정취득·명의대여·업무정지 중 업무는 최초 위반부터 자격취소 대상인 사유와 구별한다.\n\n근거·학습주제\n농어업재해보험법 제11조의5·시행령 별표 제재기준","explanationSections":[{"label":"정답 근거","text":"거짓 손해평가는 제시 제재기준에서 최초 위반 시 시정명령에 해당한다.","kind":"reason"},{"label":"오답 확인","text":"부정취득·명의대여·업무정지 중 업무는 최초 위반부터 자격취소 대상인 사유와 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의5·시행령 별표 제재기준","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["9-32","6-33","8-30","3-31","4-28","2-31","1-33","11-31","7-31"]},{"id":"10-31","round":10,"year":2024,"number":31,"subject":"농어업재해보험법령","topic":"보험금 수급권 보호","stem":"농어업재해보험법령상 보험금 수급권 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험의 보험목적물이 담보로 제공된 경우 보험금을 지급받을 권리는 압류할 수\n없다."},{"n":"2","text":"재해보험사업자는 정보통신장애로 보험금을 보험금수급계좌로 이체할 수 없을 때에는\n현금 지급 등 대통령령으로 정하는 바에 따라 보험금을 지급할 수 있다."},{"n":"3","text":"보험금수급전용계좌의 해당 금융기관은 「농어업재해보험법」에 따른 보험금만이 보험금\n수급전용계좌에 입금되도록 관리하여야 한다."},{"n":"4","text":"재해보험가입자가 재해보험에 가입된 보험목적물을 양도하는 경우 그 양수인은 재해\n보험계약에 관한 양도인의 권리 및 의무를 승계한 것으로 추정한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험목적물이 담보로 제공된 경우는 보험금 수급권 압류금지의 예외이다. 이를 무조건 압류할 수 없다고 하면 틀리다.\n\n오답 확인\n통신장애 시 대체 지급, 전용계좌 입금관리, 목적물 양도 시 권리의무 승계 추정은 각각 별개 규정이다.\n\n근거·학습주제\n농어업재해보험법 보험금 수급권·수급계좌·양도 규정","explanationSections":[{"label":"정답 근거","text":"보험목적물이 담보로 제공된 경우는 보험금 수급권 압류금지의 예외이다. 이를 무조건 압류할 수 없다고 하면 틀리다.","kind":"reason"},{"label":"오답 확인","text":"통신장애 시 대체 지급, 전용계좌 입금관리, 목적물 양도 시 권리의무 승계 추정은 각각 별개 규정이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 보험금 수급권·수급계좌·양도 규정","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["12-31","11-29","7-32","9-33","3-33","2-32"]},{"id":"10-32","round":10,"year":2024,"number":32,"subject":"농어업재해보험법령","topic":"재해보험 업무 위탁","stem":"농어업재해보험법령상 재해보험사업자가 재해보험 업무의 일부를 위탁할 수 있는\n자에 해당하지 않는 자는?","options":[{"n":"1","text":"「수산업협동조합법」에 따라 설립된 수산물가공 수산업협동조합"},{"n":"2","text":"「농업협동조합법」에 따라 설립된 품목별ㆍ업종별협동조합"},{"n":"3","text":"「산림조합법」에 따라 설립된 지역산림조합"},{"n":"4","text":"「보험업법」 제83조제1항에 따라 보험을 모집할 수 있는 자"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험업법상 모집할 수 있는 사람이라는 자격만으로 이 법의 재해보험 업무위탁 상대방에 당연히 포함되지 않는다.\n\n오답 확인\n수산물가공수협·품목별업종별 농협·지역산림조합은 법에서 정한 위탁 가능 조합의 범위에 속한다.\n\n근거·학습주제\n농어업재해보험법 제14조","explanationSections":[{"label":"정답 근거","text":"보험업법상 모집할 수 있는 사람이라는 자격만으로 이 법의 재해보험 업무위탁 상대방에 당연히 포함되지 않는다.","kind":"reason"},{"label":"오답 확인","text":"수산물가공수협·품목별업종별 농협·지역산림조합은 법에서 정한 위탁 가능 조합의 범위에 속한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제14조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["1-35","7-33","8-32","6-43","4-32","5-40","7-27","12-30","8-28","5-38","10-28","7-28"]},{"id":"10-33","round":10,"year":2024,"number":33,"subject":"농어업재해보험법령","topic":"보험료 재정지원","stem":"농어업재해보험법령상 재정지원에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"정부는 예산의 범위에서 재해보험가입자가 부담하는 보험료의 전부를 지원할 수 있다."},{"n":"2","text":"지방자치단체는 정부의 재정지원 외에 예산의 범위에서 재해보험사업자의 재해보험의\n운영 및 관리에 필요한 비용 일부를 추가로 지원할 수 있다."},{"n":"3","text":"지방자치단체의 장은 정부의 재정지원 외에 보험료의 일부를 추가 지원하려는 경우\n재해보험 가입현황서와 보험가입자의 기준 등을 확인하여 보험료의 지원금액을 결정\nㆍ지급한다."},{"n":"4","text":"「풍수해ㆍ지진재해보험법」에 따른 풍수해ㆍ지진재해보험에 가입한 자가 동일한 보험\n목적물을 대상으로 재해보험에 가입할 경우에는 정부가 재정지원을 할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n지자체장은 가입현황서와 가입자 기준 등을 확인해 추가 보험료 지원금액을 결정·지급한다.\n\n오답 확인\n정부는 가입자 보험료의 일부를 지원한다. 지자체 추가지원은 보험료에 관한 규정이며, 동일 목적물의 풍수해·지진재해보험 중복가입은 정부지원에서 제외한다.\n\n근거·학습주제\n농어업재해보험법 제19조·시행령 지원절차","explanationSections":[{"label":"정답 근거","text":"지자체장은 가입현황서와 가입자 기준 등을 확인해 추가 보험료 지원금액을 결정·지급한다.","kind":"reason"},{"label":"오답 확인","text":"정부는 가입자 보험료의 일부를 지원한다. 지자체 추가지원은 보험료에 관한 규정이며, 동일 목적물의 풍수해·지진재해보험 중복가입은 정부지원에서 제외한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제19조·시행령 지원절차","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["11-33","7-34","5-43","8-33","12-32","3-40","1-36","6-34","2-33"]},{"id":"10-34","round":10,"year":2024,"number":34,"subject":"농어업재해보험법령","topic":"기금 회계업무 위탁","stem":"농어업재해보험법령상 농림축산식품부장관이 농어업재해재보험기금(이하 ‘기금’)\n의 관리ㆍ운용에 관한 사무를 농업정책보험금융원에 위탁한 경우 기금의 관리ㆍ\n운용에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"농림축산식품부장관은 해양수산부장관과 협의하여 농업정책보험금융원의 임원 중에서\n기금수입담당임원과 기금지출원인행위담당임원을 임명하여야 한다."},{"n":"2","text":"기금수입담당임원은 기금수입징수관의 업무를, 기금지출원인행위담당임원은 기금지출관의\n업무를 담당한다."},{"n":"3","text":"농림축산식품부장관은 해양수산부장관과 협의하여 농업정책보험금융원의 직원 중에서\n기금지출원과 기금출납원을 임명하여야 한다."},{"n":"4","text":"기금출납원은 기금출납공무원의 업무를 수행한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n기금지출원인행위담당임원이 담당하는 것은 기금재무관의 업무이다. 기금지출관과 혼동한 ②가 틀리다.\n\n오답 확인\n수입담당임원은 수입징수관, 지출원은 지출관, 출납원은 출납공무원 업무를 담당한다. 임원·직원의 임명 구분도 함께 확인한다.\n\n근거·학습주제\n농어업재해보험법 기금의 회계기관","explanationSections":[{"label":"정답 근거","text":"기금지출원인행위담당임원이 담당하는 것은 기금재무관의 업무이다. 기금지출관과 혼동한 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"수입담당임원은 수입징수관, 지출원은 지출관, 출납원은 출납공무원 업무를 담당한다. 임원·직원의 임명 구분도 함께 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 기금의 회계기관","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["7-36","4-35","11-36","8-36","6-39","12-35","3-38","7-35","10-36","9-36"]},{"id":"10-35","round":10,"year":2024,"number":35,"subject":"농어업재해보험법령","topic":"보험가입촉진계획","stem":"농어업재해보험법령상 농어업재해보험사업의 관리에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"농림축산식품부장관 또는 해양수산부장관은 보험상품의 운영 및 개발에 필요한 통계\n자료를 수집ㆍ관리하여야 한다."},{"n":"2","text":"농림축산식품부장관 및 해양수산부장관은 보험상품의 운영 및 개발에 필요한 통계의 수집\nㆍ관리, 조사ㆍ연구 등에 관한 업무를 대통령령으로 정하는 자에게 위탁할 수 있다."},{"n":"3","text":"재해보험사업자는 농어업재해보험 가입 촉진을 위하여 보험가입촉진계획을 3년 단위로\n수립하여 농림축산식품부장관 또는 해양수산부장관에게 제출하여야 한다."},{"n":"4","text":"농림축산식품부장관이 손해평가사의 자격 취소를 하려면 청문을 하여야 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험가입촉진계획은 매년 수립하여 제출하는 계획이다. 3년 단위라는 ③이 틀리다.\n\n오답 확인\n상품 통계 수집·관리와 위탁 규정, 손해평가사 자격취소 전 청문은 각각 법정 관리절차이다.\n\n근거·학습주제\n농어업재해보험법 통계·가입촉진·청문 규정","explanationSections":[{"label":"정답 근거","text":"보험가입촉진계획은 매년 수립하여 제출하는 계획이다. 3년 단위라는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"상품 통계 수집·관리와 위탁 규정, 손해평가사 자격취소 전 청문은 각각 법정 관리절차이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 통계·가입촉진·청문 규정","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["9-37","5-42","6-34","6-40","3-38","10-36","5-47","12-33","4-38","8-37","11-36","7-36"]},{"id":"10-36","round":10,"year":2024,"number":36,"subject":"농어업재해보험법령","topic":"재보험기금 계정","stem":"농어업재해보험법령상 재보험사업 및 농어업재해재보험기금(이하 ‘기금’)에 관한\n설명으로 옳지 않은 것은?","options":[{"n":"1","text":"정부는 재해보험에 관한 재보험사업을 할 수 있다."},{"n":"2","text":"농림축산식품부장관은 해양수산부장관과 협의를 거쳐 재보험사업에 관한 업무의 일부를\n농업정책보험금융원에 위탁할 수 있다."},{"n":"3","text":"농림축산식품부장관은 해양수산부장관과 협의하여 공동으로 재보험사업에 필요한\n재원에 충당하기 위하여 기금을 설치한다."},{"n":"4","text":"농림축산식품부장관은 해양수산부장관과 협의하여 기금의 수입과 지출을 명확하게 하기\n위하여 대통령령으로 정하는 시중 은행에 기금계정을 설치하여야 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n기금계정은 한국은행에 설치하는 것이므로 시중은행이라는 ④가 틀리다.\n\n오답 확인\n정부의 재보험사업, 농업정책보험금융원에 대한 일부 업무위탁, 양 부처 협의를 통한 기금 설치는 허용된다.\n\n근거·학습주제\n농어업재해보험법 제20조~기금 회계 규정","explanationSections":[{"label":"정답 근거","text":"기금계정은 한국은행에 설치하는 것이므로 시중은행이라는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"정부의 재보험사업, 농업정책보험금융원에 대한 일부 업무위탁, 양 부처 협의를 통한 기금 설치는 허용된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제20조~기금 회계 규정","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["4-35","7-36","7-35","11-36","8-36","3-38","5-27","5-26","6-39","10-34","10-35","9-36","9-37","5-42"]},{"id":"10-37","round":10,"year":2024,"number":37,"subject":"농어업재해보험법령","topic":"구분회계 위반 벌칙","stem":"농어업재해보험법령상 “재해보험사업자는 재해보험사업의 회계를 다른 회계와 구\n분하여 회계처리함으로써 손익관계를 명확히 하여야 한다.”라는 규정을 위반하여\n회계를 처리한 자에 대한 벌칙은?","options":[{"n":"1","text":"500만원 이하의 과태료"},{"n":"2","text":"500만원 이하의 벌금"},{"n":"3","text":"1,000만원 이하의 벌금"},{"n":"4","text":"1년 이하의 징역"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n다른 회계와 구분해 손익관계를 명 ear":2024,"number":43,"subject":"농어업재해보험법령","topic":"교차손해평가 정의","stem":"농어업재해보험법 및 농업재해보험 손해평가요령상 교차손해평가에 관한 설명으로\n옳지 않은 것을 모두 고른 것은?\nㄱ. 교차손해평가란 공정하고 객관적인 손해평가를 위하여 재해보험사업자\n상호간에 농어업재해로 인한 손해를 교차하여 평가하는 것을 말한다.\nㄴ. 동일 시ㆍ군ㆍ구(자치구를 말한다) 내에서는 교차손해평가를 수행할 수\n없다.\nㄷ. 교차손해평가를 위해 손해평가반을 구성할 때, 거대재해 발생으로 신속한\n손해평가가 불가피하다고 판단되는 경우에는 지역손해평가인을 포함하지\n않을 수 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\nㄱ 교차평가는 보험사업자 상호간 교차라는 정의가 아니다. ㄴ 동일 시·군·구 내부라고 일률적으로 금지하지 않는다. ㄷ 거대재해 등에는 지역손해평가인 포함 예외가 인정된다.\n\n오답 확인\nㄱ·ㄴ만 틀린 조합을 고른다. 선발 지역손해평가인 포함 원칙과 인력부족 등의 예외를 나누어 판단한다.\n\n근거·학습주제\n농어업재해보험법·손해평가요령 제8조의2","explanationSections":[{"label":"정답 근거","text":"ㄱ 교차평가는 보험사업자 상호간 교차라는 정의가 아니다. ㄴ 동일 시·군·구 내부라고 일률적으로 금지하지 않는다. ㄷ 거대재해 등에는 지역손해평가인 포함 예외가 인정된다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ·ㄴ만 틀린 조합을 고른다. 선발 지역손해평가인 포함 원칙과 인력부족 등의 예외를 나누어 판단한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법·손해평가요령 제8조의2","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":22,"similarIds":["9-43","4-44","11-43","12-50","7-43","10-42","6-44","8-29"]},{"id":"10-44","round":10,"year":2024,"number":44,"subject":"농어업재해보험법령","topic":"검증조사와 재조사","stem":"농업재해보험 손해평가요령상 손해평가결과 검증에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"재해보험사업자 이외의 자는 검증조사를 할 수 없다."},{"n":"2","text":"손해평가반이 실시한 손해평가결과를 확인하기 위하여 검증조사를 할 때 손해평가를\n실시한 보험목적물 중에서 일정수를 임의 추출하여 검증조사를 하여서는 아니 된다."},{"n":"3","text":"검증조사결과 현저한 차이가 발생되어 재조사가 불가피하다고 판단될 경우에는 해당\n손해평가반이 조사한 전체 보험목적물에 대하여 재조사를 할 수 있다."},{"n":"4","text":"보험가입자가 정당한 사유없이 검증조사를 거부하는 경우 검증조사반은 검증조사가\n불가능하여 손해평가 결과를 확인할 수 없다는 사실을 재해보험사업자에게 통지한 후\n검증조사결과를 작성하여 농림축산식품부장관에게 제출하여야 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n검증결과 현저한 차이가 있어 재조사가 불가피하면 해당 반이 조사한 전체 목적물에 재조사를 할 수 있다.\n\n오답 확인\n농림축산식품부장관도 검증할 수 있고 표본 임의추출도 가능하다. 정당한 이유 없이 가입자가 거부하면 검증불가 사실을 가입자에게 통지한 후 검증결과를 작성하여 재해보험사업자에게 제출한다.\n\n근거·학습주제\n농업재해 :"2","text":"ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n육묘는 종자 절약, 본포 재배기간 단축에 따른 토지이용 증대, 조기출하에 유리하다.\n\n오답 확인\nㄹ 육묘장은 유묘를 집중 관리해 환경·병해충 관리를 하기 쉽다. 어렵다는 진술은 일반적인 육묘 장점과 반대이다.\n\n근거·학습주제\n채소학 육묘","explanationSections":[{"label":"정답 근거","text":"육묘는 종자 절약, 본포 재배기간 단축에 따른 토지이용 증대, 조기출하에 유리하다.","kind":"reason"},{"label":"오답 확인","text":"ㄹ 육묘장은 유묘를 집중 관리해 환경·병해충 관리를 하기 쉽다. 어렵다는 진술은 일반적인 육묘 장점과 반대이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 육묘","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":["7-64"]},{"id":"10-62","round":10,"year":2024,"number":62,"subject":"재배학·원예작물학","topic":"조파","stem":"파종 방법 중 조파(드릴파)에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"포장 전면에 종자를 흩어 뿌리는 방법이다."},{"n":"2","text":"뿌림 골을 만들고 그곳에 줄지어 종자를 뿌리는 방법이다."},{"n":"3","text":"일정한 간격을 두고 하나 내지 여러 개의 종자를 띄엄띄엄 파종하는 방법이다."},{"n":"4","text":"점파할 때 한 곳에 여러 개의 종자를 파종하는 방법이다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n줄을 만든 다음 줄을 따라 종자를 뿌리는 것이 조파 또는 드릴파이다.\n\n오답 확인\n전면에 흩뿌리는 것은 산파, 일정 간격으로 띄엄뛰엄 뿌리는 것은 점파, 한 곳 여러 알은 다립점파이다.\n\n근거·학습주제\n재배학 파종양식","explanationSections":[{"label":"정답 근거","text":"줄을 만든 다음 줄을 따라 종자를 뿌리는 것이 조파 또는 드릴파이다.","kind":"reason"},{"label":"오답 확인","text":"전면에 흩뿌리는 것은 산파, 일정 간격으로 띄엄뛰엄 뿌리는 것은 점파, 한 곳 여러 알은 다립점파이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 파종양식","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"10-63","round":10,"year":2024,"number":63,"subject":"재배학·원예작물학","topic":"취목 방법","stem":"다음이 설명하는 취목 번식 방법으로 올바르게 짝지어진 것은?\nㄱ. 고무나무와 같은 관상 수목에서 줄기나 가지를 땅속에 휘어 묻을 수 없는\n경우에 높은 곳에서 발근시켜 취목하는 방법\nㄴ. 모식물의 기부에 새로운 측지가 나오게 한 후 끝이 보일 정도로 흙을 덮어\n서 뿌리가 내리면 잘라서 번식시키는 방법","options":[{"n":"1","text":"ㄱ: 고취법, ㄴ: 성토법"},{"n":"2","text":"ㄱ: 보통법, ㄴ: 고취법"},{"n":"3","text":"ㄱ: 고취법, ㄴ: 선취법"},{"n":"4","text":"ㄱ: 선취법, ㄴ: 성토법"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n높은 가지에 발근시키는 것은 고취법, 기부 새 가지에 흙을 북돋아 발근시키는 것은 성토법이다.\n\n오답 확인\n보통취목은 가지 일부를 휘어 묻고, 선취법은 가지 끝을 묻는 방식이므로 두 설명에 맞지 않는다.\n\n근거·학습주제\n원예학 영양번식","explanationSections":[{"label":"정답 근거","text":"높은 가지에 발근시키는 것은 고취법, 기부 새 가지에 흙을 북돋아 발근시키는 것은 성토법이다.","kind":"reason"},{"label":"오답 확인","text":"보통취목은 가지 일부를 휘어 묻고, 선취법은 가지 끝을 묻는 방식이므로 두 설명에 맞지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학 영양번식","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"10-64","round":10,"year":2024,"number":64,"subject":"재배학·원예작물학","topic":"환상박피와 C/N율","stem":"다음은 탄질비(C/N율)에 관한 내용이다. ( )에 들어갈 내용을 순서대로 옳게 나\n열한 것은?\n작물체내의 탄수화물과 질소의 비율을 C/N율이라 하며, 과수재배에서 환상박피\n를 함으로서 환상박피 윗부분의 C/N율이 ( ), ( )이/가 ( )된다.","options":[{"n":"1","text":"높아지면, 영양생장, 촉진"},{"n":"2","text":"낮아지면, 영양생장, 억제"},{"n":"3","text":"높아지면, 꽃눈분화, 촉진"},{"n":"4","text":"낮아지면, 꽃눈분화, 억제"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n체관 수송을 막으면 윗부분에 동화산물이 축적되어 C/N율이 높아지고 꽃눈분화가 촉진될 수 있다.\n\n오답 확인\n환상박피를 질소 증가나 C/N 감소로 설명하지 않는다. 지나친 처리의 수세 약화와 정상적인 꽃눈 유도 원리는 구별한다.\n\n근거·학습주제\n과수학 C/N설·환상박피","explanationSections":[{"label":"정답 근거","text":"체관 수송을 막으면 윗부분에 동화산물이 축적되어 C/N율이 높아지고 꽃눈분화가 촉진될 수 있다.","kind":"reason"},{"label":"오답 확인","text":"환상박피를 질소 증가나 C/N 감소로 설명하지 않는다. 지나친 처리의 수세 약화와 정상적인 꽃눈 유도 원리는 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수학 C/N설·환상박피","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"10-65","round":10,"year":2024,"number":65,"subject":"재배학·원예작물학","topic":"무기태 질소","stem":"질소비료의 유효성분 중 유기태 질소가 아닌 것은?","options":[{"n":"1","text":"단백태 질소"},{"n":"2","text":"시안아미드태 질소"},{"n":"3","text":"질산태 질소"},{"n":"4","text":"아미노태 질소"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n질산태질소는 NO3- 형태의 무기태 질소이다.\n\n오답 확인\n단백태·아미노태는 유기질소이며 문제의 분류에서 시안아미드태도 탄소를 포함한 유기태 질소로 다룬다.\n\n근거·학습주제\n재배학 질소비료 형태","explanationSections":[{"label":"정답 근거","text":"질산태질소는 NO3- 형태의 무기태 질소이다.","kind":"reason"},{"label":"오답 확인","text":"단백태·아미노태는 유기질소이며 문제의 분류에서 시안아미드태도 탄소를 포함한 유기태 질소로 다룬다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 질소비료 형태","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"10-66","round":10,"year":2024,"number":66,"subject":"재배학·원예작물학","topic":"병원체 분류","stem":"채소 작물에서 진균에 의한 병끼리 짝지어진 것은?","options":[{"n":"1","text":"역병, 모잘록병"},{"n":"2","text":"노균병, 무름병"},{"n":"3","text":"균핵병, 궤양병"},{"n":"4","text":"탄저병, 근두암종병"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n출제 분류상 역병과 모잘록병은 진균성 병으로 취급한다. 두 병이 함께 들어 있는 ①을 고른다.\n\n오답 확인\n무름병·궤양병·근두암종병은 세균성 병이므로 각 조합에서 제외된다.\n\n기준·정답 처리 메모\n역병균 등 난균류는 현대 분류에서 참균류와 구별된다. 이 문항은 농업 병해에서 관용적으로 쓰는 진균성 병의 범주에 따른 공식정답이다.\n\n근거·학습주제\n채소학 병해 분류","explanationSections":[{"label":"정답 근거","text":"출제 분류상 역병과 모잘록병은 진균성 병으로 취급한다. 두 병이 함께 들어 있는 ①을 고른다.","kind":"reason"},{"label":"오답 확인","text":"무름병·궤양병·근두암종병은 세균성 병이므로 각 조합에서 제외된다.","kind":"incorrect"},{"label":"기준·정답 처리 메모","text":"역병균 등 난균류는 현대 분류에서 참균류와 구별된다. 이 문항은 농업 병해에서 관용적으로 쓰는 진균성 병의 범주에 따른 공식정답이다.","kind":"note"},{"label":"근거·학습주제","text":"채소학 병해 분류","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":["7-72"]},{"id":"10-67","round":10,"year":2024,"number":67,"subject":"재배학·원예작물학","topic":"화채류","stem":"식용부위에 따른 분류에서 화채류끼리 짝지어진 것은?","options":[{"n":"1","text":"양배추, 시금치"},{"n":"2","text":"죽순, 아스파라거스"},{"n":"3","text":"토마토, 파프리카"},{"n":"4","text":"브로콜리, 콜리플라워"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n브로콜리와 콜리플라워는 꽃봉오리·화뢰를 식용하는 화채류이다.\n\n오답 확인\n양배추·시금치는 엽채, 죽순·아스파라거스는 줄기·어린순, 토마토·파프리카는 과채로 분류한다.\n\n근거·학습주제\n채소학 식용부위 분류","explanationSections":[{"label":"정답 근거","text":"브로콜리와 콜리플라워는 꽃봉오리·화뢰를 식용하는 화채류이다.","kind":"reason"},{"label":"오답 확인","text":"양배추·시금치는 엽채, 죽순·아스파라거스는 줄기·어린순, 토마토·파프리카는 과채로 분류한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 식용부위 분류","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"10-68","round":10,"year":2024,"number":68,"subject":"재배학·원예작물학","topic":"배 화상병","stem":"다음이 설명하는 과수의 병은?\n○ 세균에 의한 병\n○ 전염성이 강하고, 5 ∼ 6월경 주로 발생\n○ 꽃, 잎, 줄기 등이 검게 변하며 서서히 고사","options":[{"n":"1","text":"대추나무 빗자루병"},{"n":"2","text":"포도 갈색무늬병"},{"n":"3","text":"배 화상병"},{"n":"4","text":"사과 부란병"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n전염성이 강한 세균성 병이며 꽃·잎·새순이 불에 탄 듯 검게 마르는 증상은 화상병의 특징이다.\n\n오답 확인\n빗자루병은 파이토플라스마, 갈색무늬병·부란병은 진균성 병과 연관되어 제시 조건과 다르다.\n\n근거·학습주제\n농촌진흥청 과수화상병 병징","explanationSections":[{"label":"정답 근거","text":"전염성이 강한 세균성 병이며 꽃·잎·새순이 불에 탄 듯 검게 마르는 증상은 화상병의 특징이다.","kind":"reason"},{"label":"오답 확인","text":"빗자루병은 파이토플라스마, 갈색무늬병·부란병은 진균성 병과 연관되어 제시 조건과 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농촌진흥청 과수화상병 병징","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"10-69","round":10,"year":2024,"number":69,"subject":"재배학·원예작물학","topic":"블루베리 복수정답","stem":"블루베리 작물에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"과실은 포도와 유사하게 일정기간의 비대정체기를 가진다."},{"n":"2","text":"pH 5 정도의 산성토양에서 생육이 불량하다."},{"n":"3","text":"묘목을 키우는 방법에는 삽목, 취목, 조직배양 등이 있다."},{"n":"4","text":"한줄기 신장지에 작은 꽃자루가 있고 여기에 꽃이 붙는 단일화서이다."}],"answers":["2","4"],"answerLabel":"2·4번 (복수정답)","explanation":"정답 근거\n공식 최종정답은 ②와 ④이다. 블루베리는 pH 4.5~5.5 안팎의 산성토양을 좋아하므로 ②가 틀리며, 꽃차례 설명도 블루베리의 총상화서 특성과 맞지 않는 ④가 인정되었다.\n\n오답 확인\n① 과실 비대는 이중 S자형으로 중간 정체기가 있다. ③ 삽목·취목·조직배양으로 영양번식할 수 있다.\n\n기준·정답 처리 메모\n복수정답 2·4를 그대로 적용한다. 하나만 골라야 한다는 전제로 정답표를 수정하지 않는다.\n\n근거·학습주제\n공식 최종정답, 농촌진흥청 블루베리 재배기술","explanationSections":[{"label":"정답 근거","text":"공식 최종정답은 ②와 ④이다. 블루베리는 pH 4.5~5.5 안팎의 산성토양을 좋아하므로 ②가 틀리며, 꽃차례 설명도 블루베리의 총상화서 특성과 맞지 않는 ④가 인정되었다.","kind":"reason"},{"label":"오답 확인","text":"① 과실 비대는 이중 S자형으로 중간 정체기가 있다. ③ 삽목·취목·조직배양으로 영양번식할 수 있다.","kind":"incorrect"},{"label":"기준·정답 처리 메모","text":"복수정답 2·4를 그대로 적용한다. 하나만 골라야 한다는 전제로 정답표를 수정하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"공식 최종정답, 농촌진흥청 블루베리 재배기술","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"10-70","round":10,"year":2024,"number":70,"subject":"재배학·원예작물학","topic":"호흡급등형 과실","stem":"호흡 급등형 과실인 것은?","options":[{"n":"1","text":"포도"},{"n":"2","text":"딸기"},{"n":"3","text":"사과"},{"n":"4","text":"감귤"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n사과는 성숙·후숙 과정에서 호흡과 에틸렌 생성이 급증하는 대표적 호흡급등형 과실이다.\n\n오답 확인\n포도·딸기·감귤은 호흡비급등형으로 수확 후 후숙특성이 사과와 다르다.\n\n근거·학습주제\n수확후생리 호흡형","explanationSections":[{"label":"정답 근거","text":"사과는 성숙·후숙 과정에서 호흡과 에틸렌 생성이 급증하는 대표적 호흡급등형 과실이다.","kind":"reason"},{"label":"오답 확인","text":"포도·딸기·감귤은 호흡비급등형으로 수확 후 후숙특성이 사과와 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"수확후생리 호흡형","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":["12-68","1-70"]},{"id":"10-71","round":10,"year":2024,"number":71,"subject":"재배학·원예작물학","topic":"절화 보존용 자당","stem":"절화장미의 수명연장을 위해 자당을 사용하는 주된 목적은?","options":[{"n":"1","text":"pH 조절"},{"n":"2","text":"미생물 억제"},{"n":"3","text":"과산화물가(POV) 증가"},{"n":"4","text":"양분 공급"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n자당은 절화의 호흡기질과 에너지원으로 작용하여 꽃의 개화와 관상수명 유지에 필요한 양분을 공급한다.\n\n오답 확인\n산도조절제·살균제의 기능과 당의 기능을 구분한다. 과산화물가 증가는 보존 목적이 아니다.\n\n근거·학습주제\n화훼학 절화 보존","explanationSections":[{"label":"정답 근거","text":"자당은 절화의 호흡기질과 에너지원으로 작용하여 꽃의 개화와 관상수명 유지에 필요한 양분을 공급한다.","kind":"reason"},{"label":"오답 확인","text":"산도조절제·살균제의 기능과 당의 기능을 구분한다. 과산화물가 증가는 보존 목적이 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학 절화 보존","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"10-72","round":10,"year":2024,"number":72,"subject":"재배학·원예작물학","topic":"관목성 화목류","stem":"관목성 화목류끼리 짝지어진 것은?","options":[{"n":"1","text":"철쭉, 목련, 산수유"},{"n":"2","text":"라일락, 배롱나무, 이팝나무"},{"n":"3","text":"장미, 동백나무, 노각나무"},{"n":"4","text":"진달래, 무궁화, 개나리"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n진달래·무궁화·개나리는 관목성 화목류의 대표 조합이다.\n\n오답 확인\n다른 조합은 목련·이팝나무·노각나무 등 교목성 수종을 포함하므로 전부 관목으로 묶을 수 없다.\n\n근거·학습주제\n화훼학 화목류 분류","explanationSections":[{"label":"정답 근거","text":"진달래·무궁화·개나리는 관목성 화목류의 대표 조합이다.","kind":"reason"},{"label":"오답 확인","text":"다른 조합은 목련·이팝나무·노각나무 등 교목성 수종을 포함하므로 전부 관목으로 묶을 수 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학 화목류 분류","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"10-73","round":10,"year":2024,"number":73,"subject":"재배학·원예작물학","topic":"벤로형 온실","stem":"온실의 처마가 높고 폭이 좁은 양지붕형 온실을 연결한 형태의 온실형은?","options":[{"n":"1","text":"둥근지붕형"},{"n":"2","text":"벤로형"},{"n":"3","text":"터널형"},{"n":"4","text":"쓰리쿼터형"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n벤로형은 처마가 비교적 높고 폭이 좁은 양지붕형을 연속 연결한 형태이다.\n\n오답 확인\n둥근지붕·터널은 곡선 지붕, 쓰리쿼터는 지붕 길이가 비대칭인 형태이므로 설명과 다르다.\n\n근거·학습주제\n시설원예 온실 구조","explanationSections":[{"label":"정답 근거","text":"벤로형은 처마가 비교적 높고 폭이 좁은 양지붕형을 연속 연결한 형태이다.","kind":"reason"},{"label":"오답 확인","text":"둥근지붕·터널은 곡선 지붕, 쓰리쿼터는 지붕 길이가 비대칭인 형태이므로 설명과 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 온실 구조","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":["7-73"]},{"id":"10-74","round":10,"year":2024,"number":74,"subject":"재배학·원예작물학","topic":"박막수경","stem":"다음이 설명하는 양액 재배방식은?\n○ 고형배지를 사용하지 않음\n○ 베드의 바닥에 일정한 기울기를 만들어 양액을 흘려보내는 방식\n○ 뿌리의 일부는 공중에 노출하고, 나머지는 양액에 닿게 하여 재배","options":[{"n":"1","text":"담액수경"},{"n":"2","text":"박막수경"},{"n":"3","text":"암면경"},{"n":"4","text":"펄라이트경"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n얕은 양액막을 경사 베드에 흐르게 해 뿌리 일부가 공기와 접촉하는 방식이 NFT 박막수경이다.\n\n오답 확인\n담액수경은 깊은 양액층, 암면·펄라이트경은 고형배지를 이용하므로 조건과 다르다.\n\n근거·학습주제\n시설원예 양액재배","explanationSections":[{"label":"정답 근거","text":"얕은 양액막을 경사 베드에 흐르게 해 뿌리 일부가 공기와 접촉하는 방식이 NFT 박막수경이다.","kind":"reason"},{"label":"오답 확인","text":"담액수경은 깊은 양액층, 암면·펄라이트경은 고형배지를 이용하므로 조건과 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 양액재배","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"10-75","round":10,"year":2024,"number":75,"subject":"재배학·원예작물학","topic":"피복필름의 보온성","stem":"시설원예 피복자재에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"연질필름 중 PVC 필름의 보온성이 가장 낮다."},{"n":"2","text":"PE 필름, PVC 필름, EVA 필름은 모두 연질필름이다."},{"n":"3","text":"반사필름, 부직포는 커튼보온용 추가피복에 사용된다."},{"n":"4","text":"한랭사는 차광피복재로 사용된다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\nPVC는 장파복사 투과가 적어 일반 PE에 비해 보온성이 좋은 편이다. 가장 낮다는 ①이 틀리다.\n\n오답 확인\nPE·PVC·EVA는 연질필름이며 반사필름·부직포는 보온커튼에, 한랭사는 차광에 쓰인다.\n\n근거·학습주제\n시설원예 피복자재","explanationSections":[{"label":"정답 근거","text":"PVC는 장파복사 투과가 적어 일반 PE에 비해 보온성이 좋은 편이다. 가장 낮다는 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"PE·PVC·EVA는 연질필름이며 반사필름·부직포는 보온커튼에, 한랭사는 차광에 쓰인다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 피복자재","kind":"reference"}],"sourcePdf":"2024년 제10회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":35,"similarIds":["4-75","7-74"]},{"id":"11-1","round":11,"year":2025,"number":1,"subject":"상법(보험편)","topic":"보험계약의 성질","stem":"상법상 보험계약의 법적 성질로 옳지 않은 것은?","options":[{"n":"1","text":"낙성ㆍ불요식계약성"},{"n":"2","text":"사행ㆍ선의계약성"},{"n":"3","text":"부합계약성"},{"n":"4","text":"유상ㆍ편무계약성"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험계약은 보험료 지급과 보험급부가 대가관계인 유상·쌍무계약이다. 편무계약이라는 ④가 틀리다.\n\n오답 확인\n합의로 성립하는 낙성·불요식성, 우연한 사고에 의존하는 사행성, 신의성실의 요구 및 약관에 의한 부합성이 인정된다.\n\n근거·학습주제\n상법 제638조, 보험계약의 법적 성질","explanationSections":[{"label":"정답 근거","text":"보험계약은 보험료 지급과 보험급부가 대가관계인 유상·쌍무계약이다. 편무계약이라는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"합의로 성립하는 낙성·불요식성, 우연한 사고에 의존하는 사행성, 신의성실의 요구 및 약관에 의한 부합성이 인정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조, 보험계약의 법적 성질","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["3-1"]},{"id":"11-2","round":11,"year":2025,"number":2,"subject":"상법(보험편)","topic":"타인을 위한 보험","stem":"상법상 타인을 위한 보험에 관한 설명으로 옳지 않은 것을 모두 고른 것은?\nㄱ. 보험계약자는 위임을 받지 아니하고 타인을 위하여 보험계약을 체결할 수\n없다.\nㄴ. 타인을 위한 손해보험계약의 보험계약자가 그 타인에게 보험사고의 발생으로\n생긴 손해의 배상을 한 때에는 보험계약자는 그 타인의 권리를 해하지\n아니하는 범위안에서 보험자에게 보험금액의 지급을 청구할 수 있다.\nㄷ. 보험계약자는 보험자에 대하여 보험료를 지급할 의무가 있다.\nㄹ. 보험계약자가 파산선고를 받은 경우에 그 타인은 자신의 보험상 권리의 포기\n여부에 관계없이 보험료를 지급할 의무가 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\nㄱ 위임 없이도 타인을 위한 보험을 체결할 수 있다. ㄹ 계약자 파산 시 타인은 권리를 포기하지 않는 경우에만 보험료 지급의무를 부담한다.\n\n오답 확인\nㄴ 타인의 손해를 배상한 계약자는 타인의 권리를 해하지 않는 범위에서 급부를 청구한다. ㄷ 보험료 의무는 원칙적으로 계약자에게 있다.\n\n근거·학습주제\n상법 제639조","explanationSections":[{"label":"정답 근거","text":"ㄱ 위임 없이도 타인을 위한 보험을 체결할 수 있다. ㄹ 계약자 파산 시 타인은 권리를 포기하지 않는 경우에만 보험료 지급의무를 부담한다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ 타인의 손해를 배상한 계약자는 타인의 권리를 해하지 않는 범위에서 급부를 청구한다. ㄷ 보험료 의무는 원칙적으로 계약자에게 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["9-2","6-12","7-2","5-3","3-4","5-7","2-17","3-7","12-6","7-5","9-6","12-3","11-7","2-5","2-4"]},{"id":"11-3","round":11,"year":2025,"number":3,"subject":"상법(보험편)","topic":"보험증권","stem":"상법상 보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 최초의 보험료를 지급하지 아니한 때에도 보험자는 보험계약이 성립한\n때에는 지체없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다."},{"n":"2","text":"기존의 보험계약을 변경한 경우 보험자는 그 보험증권에 그 사실을 기재함으로써\n보험증권의 교부에 갈음할 수 있다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날부터 14일 기간내에 한하여 그 증권\n내용의 정부에 관한 이의를 할 수 있음을 약정할 수 있다."},{"n":"4","text":"보험계약자가 보험증권을 현저하게 훼손하여 증권의 재교부를 청구한 경우 그 비용은\n보험자가 부담하여야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n계약을 변경하거나 연장하면 기존 증권에 그 사실을 기재해 새 증권 교부에 갈음할 수 있다.\n\n오답 확인\n① 최초보험료 미지급이면 증권 미교부가 가능하다. ③ 이의기간은 1개월 이상이다. ④ 훼손 재교부 비용은 계약자 부담이다.\n\n근거·학습주제\n상법 제640조~제642조","explanationSections":[{"label":"정답 근거","text":"계약을 변경하거나 연장하면 기존 증권에 그 사실을 기재해 새 증권 교부에 갈음할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"① 최초보험료 미지급이면 증권 미교부가 가능하다. ③ 이의기간은 1개월 이상이다. ④ 훼손 재교부 비용은 계약자 부담이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조~제642조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["9-3","5-4","2-2","8-3","12-1","4-3","10-3","6-13","7-3","10-2","12-3","3-5"]},{"id":"11-4","round":11,"year":2025,"number":4,"subject":"상법(보험편)","topic":"보험사고의 객관적 확정","stem":"상법상 보험사고에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니\n하는 보험의 경우에는 보험계약자가 그 사고발생 후에 보험계약을 해지할 수 없다."},{"n":"2","text":"보험계약 당시에 보험사고가 이미 발생하였음을 보험계약자가 알고 있었다면 그 계약은\n무효로 한다."},{"n":"3","text":"보험계약 당시에 보험사고가 객관적으로 발생할 수 없음을 보험계약자와 보험자가\n몰랐다면, 피보험자가 이를 알았더라도 그 계약은 무효로 볼 수 없다."},{"n":"4","text":"계약전의 어느 시기를 보험기간의 시기(始期)로 한 보험계약은 무효이다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n계약 당시 사고가 이미 발생했고 계약자가 알았다면 보험계약은 무효이다.\n\n오답 확인\n① 보험금 지급으로 금액이 줄지 않는 보험은 사고 후 해지 가능하다. ③ 피보험자까지 모두 몰라야 예외가 적용된다. ④ 소급보험은 허용된다.\n\n근거·학습주제\n상법 제643조·제644조·제649조","explanationSections":[{"label":"정답 근거","text":"계약 당시 사고가 이미 발생했고 계약자가 알았다면 보험계약은 무효이다.","kind":"reason"},{"label":"오답 확인","text":"① 보험금 지급으로 금액이 줄지 않는 보험은 사고 후 해지 가능하다. ③ 피보험자까지 모두 몰라야 예외가 적용된다. ④ 소급보험은 허용된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제643조·제644조·제649조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["10-7","6-14","8-4","4-4","9-4","12-3","3-7","5-5","6-16","2-4","7-5","7-3","12-14"]},{"id":"11-5","round":11,"year":2025,"number":5,"subject":"상법(보험편)","topic":"보험대리상 권한 제한","stem":"상법상 보험대리상 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험대리상은 보험계약자로부터 청약 등의 보험계약에 관한 의사표시를 수령할 수\n있는 권한이 있다."},{"n":"2","text":"보험자는 상법에 정해진 보험대리상의 권한을 제한할 수 없다."},{"n":"3","text":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개\n하는 자는 보험자가 작성한 영수증을 보험계약자에게 교부하는 경우만 보험계약자로\n부터 보험료를 수령할 수 있는 권한이 있다."},{"n":"4","text":"보험대리상은 피보험자가 보험계약에 관한 의사표시를 할 의무가 있는 경우 피보험자의\n의사표시를 수령할 권한이 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험자는 법정 권한을 제한할 수 있으나 그 제한으로 선의의 보험계약자에게 대항할 수 없다. 제한 자체가 불가능하다는 ②가 틀리다.\n\n오답 확인\n청약·고지 등 수령권과 피보험자의 의사표시 수령권이 있다. 설계사의 보험료 수령은 보험자 작성 영수증 교부를 조건으로 한다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"보험자는 법정 권한을 제한할 수 있으나 그 제한으로 선의의 보험계약자에게 대항할 수 없다. 제한 자체가 불가능하다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"청약·고지 등 수령권과 피보험자의 의사표시 수령권이 있다. 설계사의 보험료 수령은 보험자 작성 영수증 교부를 조건으로 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["7-4","12-4","5-6","4-5","8-5","2-3","6-15","12-5","2-21","9-5","8-6","10-4"]},{"id":"11-6","round":11,"year":2025,"number":6,"subject":"상법(보험편)","topic":"위험소멸과 보험료","stem":"상법상 보험료에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약의 일부가 무효인 경우에 보험계약자와 피보험자가 선의이며 중대한 과실이\n없는 때에도 보험자에 대하여 보험료의 일부의 반환을 청구할 수 없다."},{"n":"2","text":"보험계약의 전부가 무효인 경우에 보험계약자와 보험수익자가 선의이며 중대한 과실\n이 없는 때에도 보험자에 대하여 보험료의 반환을 청구할 수 없다."},{"n":"3","text":"보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에 보험기간중\n그 예기한 위험이 소멸한 때에는 보험계약자는 그 후의 보험료의 감액을 청구할 수\n있다."},{"n":"4","text":"보험사고가 발생하기 전에 보험계약자가 보험계약의 전부를 해지한 경우에도 보험\n계약자는 당사자간에 다른 약정이 없으면 미경과보험료의 반환을 청구할 수 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n특별한 위험을 예상해 보험료를 정했으나 그 위험이 소멸하면 그 후 보험료 감액을 청구할 수 있다.\n\n오답 확인\n무효계약의 선의·무중과실 반환요건, 사고 전 해지 시 미경과보험료 반환 원칙을 부정한 선지는 틀리다.\n\n근거·학습주제\n상법 제647조~제649조","explanationSections":[{"label":"정답 근거","text":"특별한 위험을 예상해 보험료를 정했으나 그 위험이 소멸하면 그 후 보험료 감액을 청구할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"무효계약의 선의·무중과실 반환요건, 사고 전 해지 시 미경과보험료 반환 원칙을 부정한 선지는 틀리다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제647조~제649조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["5-7","12-5","2-4","10-5","4-9","1-5","3-7","12-6","4-6","10-7","9-11","9-6","6-16","7-5","8-16"]},{"id":"11-7","round":11,"year":2025,"number":7,"subject":"상법(보험편)","topic":"최초보험료 미지급","stem":"상법상 보험료의 지급에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 계약체결후 지체없이 제1회 보험료를 지급하지 아니하는 경우에는 다른\n약정이 없는 한 계약성립후 2월이 경과하면 그 계약은 해제된 것으로 본다."},{"n":"2","text":"계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 바로 그 계약을 해지할\n수 있다."},{"n":"3","text":"타인을 위한 보험의 경우에 보험계약자가 보험료의 지급을 지체한 때에 보험자가\n계약을 해지하기 위해서 그 타인에게 보험료 지급을 최고할 필요는 없다."},{"n":"4","text":"보험자의 책임은 당사자간에 다른 약정이 없으면 보험계약자의 보험료 지급 여부에\n관계없이 계약이 성립한 때부터 개시한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n최초보험료를 지체하면 다른 약정이 없는 한 계약 성립 후 2개월이 지나 해제된 것으로 본다.\n\n오답 확인\n계속보험료는 상당기간 최고 후 해지 가능하며 특정 타인을 위한 보험은 그 타인에게도 최고해야 한다. 책임개시는 최초보험료 수령 때가 원칙이다.\n\n근거·학습주제\n상법 제650조·제656조","explanationSections":[{"label":"정답 근거","text":"최초보험료를 지체하면 다른 약정이 없는 한 계약 성립 후 2개월이 지나 해제된 것으로 본다.","kind":"reason"},{"label":"오답 확인","text":"계속보험료는 상당기간 최고 후 해지 가능하며 특정 타인을 위한 보험은 그 타인에게도 최고해야 한다. 책임개시는 최초보험료 수령 때가 원칙이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조·제656조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["2-5","12-7","7-6","9-6","1-6","10-5","3-8","4-9","8-6","3-7","8-7","1-10","8-12","12-6","6-18","11-2","2-4","7-2","4-6"]},{"id":"11-8","round":11,"year":2025,"number":8,"subject":"상법(보험편)","topic":"보험계약의 부활","stem":"상법상 보험계약 부활에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약의 해지 사유에 관계없이 보험계약자는 보험계약의 부활을 청구할 수 있다."},{"n":"2","text":"보험계약이 해지된 후 보험계약자가 해지환급금을 지급받은 뒤에도 해지환급금을\n반환한다면 부활을 청구할 수 있다."},{"n":"3","text":"보험계약자가 계약의 부활을 청구하는 경우 보험자는 이를 승낙하여야 한다."},{"n":"4","text":"계속보험료의 연체로 인하여 보험계약이 해지되고 해지환급금이 지급되지 아니한\n경우에 보험계약자는 일정한 기간내에 연체보험료에 약정이자를 붙여 보험자에게\n지급하고 그 계약의 부활을 청구할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계속보험료 연체 해지 후 해지환급금을 받지 않았다면 정해진 기간에 연체보험료와 약정이자를 지급하고 부활을 청구할 수 있다.\n\n오답 확인\n모든 해지사유에 적용되지 않고 환급금 지급 후에는 법정 부활청구 요건이 다르다. 보험자에게 무조건 승낙의무가 생기는 것은 아니다.\n\n근거·학습주제\n상법 제650조의2","explanationSections":[{"label":"정답 근거","text":"계속보험료 연체 해지 후 해지환급금을 받지 않았다면 정해진 기간에 연체보험료와 약정이자를 지급하고 부활을 청구할 수 있다.","kind":"reason"} 현저하게 초과할 때에는 협정보험가액을 보험가액\n으로 한다."},{"n":"3","text":"당사자간에 보험가액을 정하지 아니한 때에는 사고발생시의 가액을 보험가액으로 한다."},{"n":"4","text":"보험가액을 정하지 않은 경우 그 보험계약은 무효로 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험가액을 미리 정하지 않았다면 사고 발생 당시 가액을 보험가액으로 한다.\n\n오답 확인\n기평가액은 사고시 가액으로 정한 것으로 추정한다. 현저한 초과이면 실제 사고시 가액을 적용하며 미평가라고 계약이 무효는 아니다.\n\n근거·학습주제\n상법 제670조·제671조","explanationSections":[{"label":"정답 근거","text":"보험가액을 미리 정하지 않았다면 사고 발생 당시 가액을 보험가액으로 한다.","kind":"reason"},{"label":"오답 확인","text":"기평가액은 사고시 가액으로 정한 것으로 추정한다. 현저한 초과이면 실제 사고시 가액을 적용하며 미평가라고 계약이 무효는 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제670조·제671조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["5-15","9-12","1-16","10-15","12-15","6-25","3-20","2-9","4-17","7-13","8-16","8-15"]},{"id":"11-17","round":11,"year":2025,"number":17,"subject":"상법(보험편)","topic":"중복보험 내부 분담","stem":"甲은 자신이 소유한 건물(보험가액 20억원)에 대하여 A보험자와 15억원의 화재보\n험계약을 체결하고, B보험자와 10억원의 화재보험계약을 체결하였다. 해당 건물이\n화재로 전부 멸실하였을 경우의 법률관계에 관한 설명으로 옳은 것은? (단, 보험\n기간은 동일하고, 보험자의 면책사유는 없으며, 甲의 사기도 없었다고 가정함)","options":[{"n":"1","text":"A보험자는 甲에게 보험금으로 8억원을 지급할 책임이 있다."},{"n":"2","text":"B보험자는 甲에게 보험금으로 6억원을 지급할 책임이 있다."},{"n":"3","text":"B보험자가 보험금을 지급하지 않은 경우 A보험자는 甲에게 보험금으로 12억원을\n지급하여야 한다."},{"n":"4","text":"B보험자가 보험금을 지급하지 않을 경우 자신이 지급해야 할 몫의 보험금을 지급한\nA보험자는 B보험자를 상대로 3억원의 구상권을 행사할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n내부부담은 보험금액비례로 A 12억원, B 8억원이다. A가 자기 보험금액 한도인 15억원을 지급하면 자기 분담 초과액 3억원을 B에게 구상한다.\n\n오답 확인\n각 보험자는 자기 보험금액 한도에서 연대책임을 지므로 A의 대외적 책임이 내부 분담 12억원으로 제한되지는 않는다. ①·② 금액도 산식에 맞지 않는다.\n\n근거·학습주제\n상법 제672조","explanationSections":[{"label":"정답 근거","text":"내부부담은 보험금액비례로 A 12억원, B 8억원이다. A가 자기 보험금액 한도인 15억원을 지급하면 자기 분담 초과액 3억원을 B에게 구상한다.","kind":"reason"},{"label":"오답 확인","text":"각 보험자는 자기 보험금액 한도에서 연대책임을 지므로 A의 대외적 책임이 내부 분담 12억원으로 제한되지는 않는다. ①·② 금액도 산식에 맞지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["12-17","8-19","10-17"]},{"id":"11-18","round":11,"year":2025,"number":18,"subject":"상법(보험편)","topic":"일부보험 가액기준","stem":"상법상 일부보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험금액이 보험가액에 미달하는 보험을 말한다."},{"n":"2","text":"보험가액의 일부를 보험에 붙인 경우에 발생한다."},{"n":"3","text":"보험금액의 보험가액에 대한 비율에 관하여 당사자 사이에 다르게 약정하면 보험자는\n보험금액의 한도내에서 책임을 지게 된다."},{"n":"4","text":"일부보험의 보험가액 산정기준은 언제나 계약 체결시로 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n일부보험이라고 언제나 계약체결시 가액을 쓰지 않는다. 미평가보험 등 보험가액 일반규정에 따라 사고시 가액이 기준이 된다.\n\n오답 확인\n보험금액이 보험가액보다 적은 것이 일부보험이다. 비례보상이 원칙이나 특약으로 보험금액 한도 실손보상을 정할 수 있다.\n\n근거·학습주제\n상법 제671조·제674조","explanationSections":[{"label":"정답 근거","text":"일부보험이라고 언제나 계약체결시 가액을 쓰지 않는다. 미평가보험 등 보험가액 일반규정에 따라 사고시 가액이 기준이 된다.","kind":"reason"},{"label":"오답 확인","text":"보험금액이 보험가액보다 적은 것이 일부보험이다. 비례보상이 원칙이나 특약으로 보험금액 한도 실손보상을 정할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제671조·제674조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["6-3","9-19","3-23","2-11","2-9","4-20"]},{"id":"11-19","round":11,"year":2025,"number":19,"subject":"상법(보험편)","topic":"보험목적 양도","stem":"상법상 보험목적의 양도에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험의 목적의 양도인 또는 양수인은 보험자에 대하여 지체없이 그 사실을 통지하여\n야 한다."},{"n":"2","text":"피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리만을 승계한다."},{"n":"3","text":"피보험자가 보험의 목적을 양도한 때에는 양도인과 양수인이 공동으로 보험자에게\n통지하여야 한다."},{"n":"4","text":"피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 의무를 승계한 것으로\n간주한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n양도인 또는 양수인 중 어느 한쪽이 보험자에게 지체 없이 양도사실을 통지해야 한다.\n\n오답 확인\n승계대상은 권리와 의무 모두이며 승계는 간주가 아니라 추정이다. 공동통지까지 요구하지 않는다.\n\n근거·학습주제\n상법 제679조","explanationSections":[{"label":"정답 근거","text":"양도인 또는 양수인 중 어느 한쪽이 보험자에게 지체 없이 양도사실을 통지해야 한다.","kind":"reason"},{"label":"오답 확인","text":"승계대상은 권리와 의무 모두이며 승계는 간주가 아니라 추정이다. 공동통지까지 요구하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제679조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["6-6","5-21","12-20","4-23","10-18"]},{"id":"11-20","round":11,"year":2025,"number":20,"subject":"상법(보험편)","topic":"손해방지 비용","stem":"상법상 손해방지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 손해방지를 위해 노력해야 한다."},{"n":"2","text":"피보험자는 보험사고가 발생한 경우 손해의 경감을 위해 노력해야 한다."},{"n":"3","text":"보험계약자가 손해방지의무의 이행에 필요했던 비용과 보상액이 보험금액을 초과한\n경우 그 초과부분은 보험계약자가 부담한다."},{"n":"4","text":"손해방지의무의 주체는 보험계약자와 피보험자이다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n필요·유익한 방지비용은 보상액과 합쳐 보험금액을 넘어도 보험자 부담이다. 초과액을 계약자에게 전가한 ③이 틀리다.\n\n오답 확인\n계약자와 피보험자 모두 손해 방지·경감을 위해 노력할 의무를 부담한다.\n\n근거·학습주제\n상법 제680조","explanationSections":[{"label":"정답 근거","text":"필요·유익한 방지비용은 보상액과 합쳐 보험금액을 넘어도 보험자 부담이다. 초과액을 계약자에게 전가한 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"계약자와 피보험자 모두 손해 방지·경감을 위해 노력할 의무를 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제680조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["12-21","8-23","1-21","10-21","5-22","2-10"]},{"id":"11-21","round":11,"year":2025,"number":21,"subject":"상법(보험편)","topic":"잔존물대위 요건","stem":"상법상 보험목적에 관한 보험대위(잔존물대위)의 설명으로 옳은 것은?","options":[{"n":"1","text":"보험목적의 전부가 멸실한 경우에 보험금액 전부를 지급한 보험자는 그 목적에 대한\n피보험자의 권리를 취득한다."},{"n":"2","text":"보험자가 전체 보험금의 일부를 지급한 경우에도 그 지급에 비례하여 보험대위가\n성립한다."},{"n":"3","text":"잔존하는 보험목적에 관한 피보험자의 권리가 보험자에게 이전하는 시점은 보험자가\n보험금을 청구받은 때이다."},{"n":"4","text":"일부보험에서는 잔존물대위가 성립할 여지가 없다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n목적 전부 멸실과 보험금액 전부 지급 시 보험자는 목적에 대한 피보험자의 권리를 취득한다.\n\n오답 확인\n지급청구 시점이나 보험금 일부 지급만으로 잔존물대위가 완성되지 않는다. 일부보험에서도 전액 지급하면 비례대위가 가능하다.\n\n근거·학습주제\n상법 제681조","explanationSections":[{"label":"정답 근거","text":"목적 전부 멸실과 보험금액 전부 지급 시 보험자는 목적에 대한 피보험자의 권리를 취득한다.","kind":"reason"},{"label":"오답 확인","text":"지급청구 시점이나 보험금 일부 지급만으로 잔존물대위가 완성되지 않는다. 일부보험에서도 전액 지급하면 비례대위가 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제681조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["10-22","6-7","7-22","12-22","3-24","1-23","4-24","5-23"]},{"id":"11-22","round":11,"year":2025,"number":22,"subject":"상법(보험편)","topic":"제3자대위의 법률효과","stem":"상법상 손해보험에서 제3자에 대한 보험대위에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해가 제3자의 행위로 인하여 발생한 경우에 보험금을 지급한 보험자는 그 지급한\n금액의 한도에서 그 제3자에 대한 보험계약자 또는 피보험자의 권리를 취득하는 것으\n로 추정한다."},{"n":"2","text":"보험자가 보상할 보험금의 일부를 지급한 경우에 보험자는 피보험자의 권리를 침해하지\n아니하는 범위에서 그 권리를 행사할 수 있다."},{"n":"3","text":"손해가 보험계약자와 생계를 같이 하는 가족의 고의로 인하여 발생한 경우 보험금을\n지급한 보험자는 그 지급한 금액의 한도에서 그 권리를 취득한다."},{"n":"4","text":"제3자에 대한 보험대위의 취지는 이득금지 원칙의 실현과 부당한 면책의 방지에 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n제3자대위는 보험금 지급에 따라 법률상 권리를 취득하는 것이며 단순히 취득을 추정하는 제도가 아니다.\n\n오답 확인\n일부 지급 시 피보험자 권리를 침해할 수 없다. 생계공동 가족이라도 고의이면 대위 예외가 적용되며, 이득금지와 가해자 부당면책 방지가 취지이다.\n\n근거·학습주제\n상법 제682조","explanationSections":[{"label":"정답 근거","text":"제3자대위는 보험금 지급에 따라 법률상 권리를 취득하는 것이며 단순히 취득을 추정하는 제도가 아니다.","kind":"reason"},{"label":"오답 확인","text":"일부 지급 시 피보험자 권리를 침해할 수 없다. 생계공동 가족이라도 고의이면 대위 예외가 적용되며, 이득금지와 가해자 부당면책 방지가 취지이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제682조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["5-23","8-25","12-22","2-17","7-22"]},{"id":"11-23","round":11,"year":2025,"number":23,"subject":"상법(보험편)","topic":"집합보험의 사용인 물건","stem":"상법상 집합보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"집합보험은 경제적으로 보아 독립된 수개의 물건을 마치 하나의 물건(집합물)처럼\n취급하여 보험목적으로 한 것이다."},{"n":"2","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 피보험자의 가족의 물건도 보험\n목적에 포함되는 것으로 한다."},{"n":"3","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 피보험자에게 고용된 사용자의\n물건은 보험목적에 포함되지 않는다."},{"n":"4","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간\n중에 수시로 교체된 경우에도 보험사고의 발생 시에 현존한 물건은 보험의 목적에 포\n함된 것으로 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n집합보험에는 피보험자의 가족과 사용인의 물건도 포함된 것으로 본다. 사용인 물건을 제외한 ③이 틀리다.\n\n오답 확인\n경제적 집합물을 일괄 보험에 붙이고 수시 교체 시 사고 당시 현존물을 기준으로 한다.\n\n근거·학습주제\n상법 제686조·제687조","explanationSections":[{"label":"정답 근거","text":"집합보험에는 피보험자의 가족과 사용인의 물건도 포함된 것으로 본다. 사용인 물건을 제외한 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"경제적 집합물을 일괄 보험에 붙이고 수시 교체 시 사고 당시 현존물을 기준으로 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제686조·제687조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["3-18","10-25","7-25","12-25","9-25","6-10","4-25","5-13","2-17"]},{"id":"11-24","round":11,"year":2025,"number":24,"subject":"상법(보험편)","topic":"재보험 허용","stem":"상법상 손해보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약은 금전으로 산정할 수 없는 이익에 대해서도 보험계약의 목적으로 할 수 있다."},{"n":"2","text":"보험자는 보험사고로 인하여 부담할 책임에 대하여 다른 보험자와 재보험계약을 체결\n할 수 있다."},{"n":"3","text":"화재보험에서 동산을 보험의 목적으로 한 때에는 보험증권에 그 위치한 장소를 기재\n하면 되고 그 상태나 용도까지 기재할 필요는 없다."},{"n":"4","text":"보험자가 보상할 손해액의 산정에 관한 비용은 보험계약자의 부담으로 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험자는 원보험에 따라 부담할 책임을 다른 보험자에게 재보험으로 이전·분산할 수 있다.\n\n오답 확인\n피보험이익은 금전 산정이 가능해야 한다. 동산 존치장소의 상태·용도도 기재하며 손해액 산정비용은 보험자 부담이다.\n\n근거·학습주제\n상법 제661조·제668조·제676조·제685조","explanationSections":[{"label":"정답 근거","text":"보험자는 원보험에 따라 부담할 책임을 다른 보험자에게 재보험으로 이전·분산할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"피보험이익은 금전 산정이 가능해야 한다. 동산 존치장소의 상태·용도도 기재하며 손해액 산정비용은 보험자 부담이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제661조·제668조·제676조·제685조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["9-17","8-15","12-16","10-24"]},{"id":"11-25","round":11,"year":2025,"number":25,"subject":"상법(보험편)","topic":"화재보험증권","stem":"상법상 화재보험증권에 기재해야 할 사항으로 옳은 것을 모두 고른 것은?\nㄱ. 보험계약자의 주소와 성명 및 주민등록번호\nㄴ. 보험기간을 정한 때에는 그 시기와 종기\nㄷ. 건물을 보험의 목적으로 한 때에는 그 소재지, 구조와 용도\nㄹ. 보험가액을 정한 때에는 그 가액\nㅁ. 보험금액과 그 지급방법 및 시기","options":[{"n":"1","text":"ㄱ, ㄴ, ㅁ"},{"n":"2","text":"ㄱ, ㄷ, ㅁ"},{"n":"3","text":"ㄴ, ㄷ, ㄹ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험기간 시기·종기, 건물의 소재지·구조·용도, 정한 보험가액은 기재사항이므로 ㄴ·ㄷ·ㄹ이다.\n\n오답 확인\nㄱ 주민등록번호는 법정 기재사항이 아니다. ㅁ 보험금액은 기재하나 보험금 지급방법·시기를 붙인 문구 전체가 법문과 같지는 않다.\n\n근거·학습주제\n상법 제666조·제685조","explanationSections":[{"label":"정답 근거","text":"보험기간 시기·종기, 건물의 소재지·구조·용도, 정한 보험가액은 기재사항이므로 ㄴ·ㄷ·ㄹ이다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ 주민등록번호는 법정 기재사항이 아니다. ㅁ 보험금액은 기재하나 보험금 지급방법·시기를 붙인 문구 전체가 법문과 같지는 않다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조·제685조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":14,"similarIds":["7-24","3-17","12-24","5-25","10-14"]},{"id":"11-26","round":11,"year":2025,"number":26,"subject":"농어업재해보험법령","topic":"재해보험 발전계획","stem":"농어업재해보험법령상 재해보험 발전 기본계획 및 시행계획의 수립·시행에 관한\n설명으로 옳은 것은?","options":[{"n":"1","text":"농림축산식품부장관과 해양수산부장관은 기본계획을 3년마다 수립ㆍ시행하여야 한다."},{"n":"2","text":"재해보험의 대상 품목에 관한 사항은 기본계획에 포함되지 않는다."},{"n":"3","text":"농림축산식품부장관과 해양수산부장관은 기본계획에 따라 2년마다 시행계획을 수립ㆍ\n시행하여야 한다."},{"n":"4","text":"농림축산식품부장관은 시행계획의 수립ㆍ시행을 위하여 필요한 경우에는 지방자치\n단체의 장에게 관련 정보의 제공을 요청할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n장관은 시행계획 수립·시행에 필요한 때 지자체장 등에게 관련 정보 제공을 요청할 수 있다.\n\n오답 확인\n기본계획은 5년마다, 시행계획은 매년이다. 보험대상품목은 기본계획 내용에 포함된다.\n\n근거·학습주제\n농어업재해보험법 제2조의2","explanationSections":[{"label":"정답 근거","text":"장관은 시행계획 수립·시행에 필요한 때 지자체장 등에게 관련 정보 제공을 요청할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"기본계획은 5년마다, 시행계획은 매년이다. 보험대상품목은 기본계획 내용에 포함된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제2조의2","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":15,"similarIds":["12-26"]},{"id":"11-27","round":11,"year":2025,"number":27,"subject":"농어업재해보험법령","topic":"심의회와 분과위원회","stem":"농어업재해보험법령상 농업재해보험심의회(이하 “심의회”라 한다) 및 분과위원회에\n관한 설명으로 옳은 것은?","options":[{"n":"1","text":"심의회의 위원장은 농림축산식품부장관으로 하고, 부위원장은 위원 중에서 호선(互選)\n한다."},{"n":"2","text":"심의회의 회의는 재적위원 3분의 1의 출석으로 개의(開議)하고, 출석위원 과반수의\n찬성으로 의결한다."},{"n":"3","text":"심의회는 그 심의 사항을 검토ㆍ조정하고, 심의회의 심의를 보조하게 하기 위하여\n심의회에 분과위원회를 둔다."},{"n":"4","text":"분과위원회는 분과위원장 1명을 포함한 5명 이내의 분과위원으로 성별을 고려하여\n구성한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n심의사항 검토·조정과 심의 보조를 위하여 분과위원회를 둔다.\n\n오답 확인\n위원장은 차관, 부위원장은 호선이다. 심의회는 재적 과반수 출석이 필요하고 분과위원회는 위원장 포함 9명 이내이다.\n\n근거·학습주제\n농어업재해보험법 제3조·시행령 심의회 규정","explanationSections":[{"label":"정답 근거","text":"심의사항 검토·조정과 심의 보조를 위하여 분과위원회를 둔다.","kind":"reason"},{"label":"오답 확인","text":"위원장은 차관, 부위원장은 호선이다. 심의회는 재적 과반수 출석이 필요하고 분과위원회는 위원장 포함 9명 이내이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제3조·시행령 심의회 규정","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":15,"similarIds":["9-27","4-33","6-28","10-26","2-26"]},{"id":"11-28","round":11,"year":2025,"number":28,"subject":"농어업재해보험법령","topic":"손해평가인 교육경력","stem":"농어업재해보험법령상 농작물재해보험 손해평가인의 자격요건에 관한 규정의\n일부이다. ( )에 들어갈 숫자는?\n○ 교원으로 고등학교에서 농작물재배 분야 관련 과목을 ( ㄱ )년 이상 교육\n한 경력이 있는 사람\n○ 조교수 이상으로 「고등교육법」 제2조에 따른 학교에서 농작물재배 관련학\n을 ( ㄴ )년 이상 교육한 경력이 있는 사람","options":[{"n":"1","text":"ㄱ: 3, ㄴ: 2"},{"n":"2","text":"ㄱ: 3, ㄴ: 3"},{"n":"3","text":"ㄱ: 5, ㄴ: 3"},{"n":"4","text":"ㄱ: 5, ㄴ: 5"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n고교 교원의 농작물재배 관련 교육경력은 5년 이상, 대학 조교수 이상은 관련학 교육경력 3년 이상이다.\n\n오답 확인\n고교와 대학 경력의 최소기간을 각각 구별해야 하며 둘 다 3년 또는 둘 다 5년으로 맞추지 않는다.\n\n근거·학습주제\n농어업재해보험법 시행령 별표2","explanationSections":[{"label":"정답 근거","text":"고교 교원의 농작물재배 관련 교육경력은 5년 이상, 대학 조교수 이상은 관련학 교육경력 3년 이상이다.","kind":"reason"},{"label":"오답 확인","text":"고교와 대학 경력의 최소기간을 각각 구별해야 하며 둘 다 3년 또는 둘 다 5년으로 맞추지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 시행령 별표2","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["2-30"]},{"id":"11-29","round":11,"year":2025,"number":29,"subject":"농어업재해보험법령","topic":"보험금 전용계좌 압류보호","stem":"농어업재해보험법령상 보험금의 수급 및 보험목적물의 양도에 관한 설명으로 옳지\n않은 것은?","options":[{"n":"1","text":"재해보험사업자는 정보통신장애로 보험금을 보험금수급계좌로 이체할 수 없을 때에는\n현금으로 보험금을 지급할 수 있다."},{"n":"2","text": subject":"재배학·원예작물학","topic":"고온과 수분스트레스","stem":"식물의 고온장해에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"온도가 높으면 상대습도가 높아져서 증산과 증발이 모두 많아 토양수분 부족으로\n작물이 한발의 피해를 받기 쉽다."},{"n":"2","text":"고온에서 물질이 분해될 때 암모니아에 의해 장해를 받을 수 있다."},{"n":"3","text":"고온에서 당이 축적되지 않아 과실과 채소는 단맛이 없어지고 생육이 억제된다."},{"n":"4","text":"고온에서 세포막 지방의 유동성이 커진다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n온도가 오르면 포화수증기압이 올라가 같은 수증기량에서 상대습도는 낮아진다. 상대습도가 높아져 증산이 많다는 ①의 인과관계가 틀리다.\n\n오답 확인\n고온은 호흡·물질분해 증가, 암모니아 독성, 당 축적 저하, 막 유동성 증가를 일으킬 수 있다.\n\n근거·학습주제\n식물생리학 고온장해","explanationSections":[{"label":"정답 근거","text":"온도가 오르면 포화수증기압이 올라가 같은 수증기량에서 상대습도는 낮아진다. 상대습도가 높아져 증산이 많다는 ①의 인과관계가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"고온은 호흡·물질분해 증가, 암모니아 독성, 당 축적 저하, 막 유동성 증가를 일으킬 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"식물생리학 고온장해","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"11-56","round":11,"year":2025,"number":56,"subject":"재배학·원예작물학","topic":"온도적응성","stem":"온도 적응성에 따라 원예작물을 구분할 때 호온성 작물과 호랭성 작물로 올바르게\n연결된 것은?","options":[{"n":"1","text":"가지 - 장미"},{"n":"2","text":"고추 - 국화"},{"n":"3","text":"복숭아 - 백합"},{"n":"4","text":"상추 - 사과"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n고추는 호온성, 국화는 상대적으로 서늘한 조건을 좋아하는 호랭성 작물의 조합이다.\n\n오답 확인\n상추·사과를 호온성으로 분류하거나 복숭아를 고온요구 채소와 동일하게 분류하지 않는다. 장미도 보통 고추와 대비되는 호랭성 대표조합으로 묶지 않는다.\n\n근거·학습주제\n원예학 온도적응 분류","explanationSections":[{"label":"정답 근거","text":"고추는 호온성, 국화는 상대적으로 서늘한 조건을 좋아하는 호랭성 작물의 조합이다.","kind":"reason"},{"label":"오답 확인","text":"상추·사과를 호온성으로 분류하거나 복숭아를 고온요구 채소와 동일하게 분류하지 않는다. 장미도 보통 고추와 대비되는 호랭성 대표조합으로 묶지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학 온도적응 분류","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"11-57","round":11,"year":2025,"number":57,"subject":"재배학·원예작물학","topic":"아브시스산","stem":"다음이 설명하는 식물호르몬은?\n○ 수분스트레스에 대한 방어기능을 조절한다.\n○ 기공폐쇄에 중요한 역할을 한다.\n○ 휴면유도와 탈리를 촉진한다.","options":[{"n":"1","text":"옥신(auxin)"},{"n":"2","text":"시토키닌(cytokinin)"},{"n":"3","text":"아브시스산(abscisic acid)"},{"n":"4","text":"에틸렌(ethylene)"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nABA는 건조 스트레스에 대응해 기공폐쇄를 유도하고 종자·눈의 휴면과 관련된다.\n\n오답 확인\n옥신은 발근·극성수송, 시토키닌은 세포분열, 에틸렌은 과실 후숙·노화가 대표 작용이다.\n\n근거·학습주제\n식물생리학 호르몬","explanationSections":[{"label":"정답 근거","text":"ABA는 건조 스트레스에 대응해 기공폐쇄를 유도하고 종자·눈의 휴면과 관련된다.","kind":"reason"},{"label":"오답 확인","text":"옥신은 발근·극성수송, 시토키닌은 세포분열, 에틸렌은 과실 후숙·노화가 대표 작용이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"식물생리학 호르몬","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":["6-59"]},{"id":"11-58","round":11,"year":2025,"number":58,"subject":"재배학·원예작물학","topic":"광질과 광주기","stem":"식물 생육과 광질에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"청색광은 카르티노이드계의 색소 생성을 촉진한다."},{"n":"2","text":"자외선은 신장을 억제하고 엽육을 두껍게 한다."},{"n":"3","text":"청색광은 광합성·광주기성을 주도한다."},{"n":"4","text":"자외선은 안토시아닌계 색소의 발현을 촉진한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n광주기성의 대표적 광수용은 피토크롬의 적색·원적색광 반응이다. 청색광이 광합성·광주기성을 주도한다고 한 ③이 부정확하다.\n\n오답 확인\n청색광의 색소·형태형성 작용과 자외선의 신장 억제·엽육 비대·안토시아닌 유도를 구별한다.\n\n근거·학습주제\n식물생리학 광질","explanationSections":[{"label":"정답 근거","text":"광주기성의 대표적 광수용은 피토크롬의 적색·원적색광 반응이다. 청색광이 광합성·광주기성을 주도한다고 한 ③이 부정확하다.","kind":"reason"},{"label":"오답 확인","text":"청색광의 색소·형태형성 작용과 자외선의 신장 억제·엽육 비대·안토시아닌 유도를 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"식물생리학 광질","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":[]},{"id":"11-59","round":11,"year":2025,"number":59,"subject":"재배학·원예작물학","topic":"풍해 증상","stem":"풍해에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"작물의 도장을 유발한다."},{"n":"2","text":"작물의 낙과를 발생시킨다."},{"n":"3","text":"작물의 도복 피해가 일어난다."},{"n":"4","text":"벼의 청미, 변색미 발생을 증가시킨다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n바람은 일반적으로 기계적 자극으로 신장·도장을 억제한다. 도장을 유발한다는 ①이 틀리다.\n\n오답 확인\n강풍은 낙과·도복·마찰상을 "similarIds":[]},{"id":"11-67","round":11,"year":2025,"number":67,"subject":"재배학·원예작물학","topic":"녹식물춘화","stem":"저온춘화형 채소작물 중 녹식물춘화형에 속하는 것을 올바르게 나열한 것은?","options":[{"n":"1","text":"양배추, 양파"},{"n":"2","text":"상추, 배추"},{"n":"3","text":"브로콜리, 부추"},{"n":"4","text":"무, 순무"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n양배추·양파는 일정 크기까지 자란 식물체가 저온을 받아 꽃눈분화가 유도되는 녹식물춘화형이다.\n\n오답 확인\n무·순무·배추는 종자춘화형의 대표이다. 보기의 상추 등과 혼합된 조합은 두 작물 모두 해당하지 않는다.\n\n근거·학습주제\n채소학 춘화","explanationSections":[{"label":"정답 근거","text":"양배추·양파는 일정 크기까지 자란 식물체가 저온을 받아 꽃눈분화가 유도되는 녹식물춘화형이다.","kind":"reason"},{"label":"오답 확인","text":"무·순무·배추는 종자춘화형의 대표이다. 보기의 상추 등과 혼합된 조합은 두 작물 모두 해당하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 춘화","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"11-68","round":11,"year":2025,"number":68,"subject":"재배학·원예작물학","topic":"수확 성숙도","stem":"생리적 성숙 시 수확하는 채소류가 아닌 것은?","options":[{"n":"1","text":"토마토"},{"n":"2","text":"브로콜리"},{"n":"3","text":"수박"},{"n":"4","text":"딸기"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n브로콜리는 꽃이 피기 전 미숙한 화뢰를 수확하므로 생리적 성숙 수확에 해당하지 않는다.\n\n오답 확인\n토마토·수박·딸기는 과실 성숙과 상품 수확단계를 연결해 수확한다. 브로콜리의 개화·종자 성숙까지 기다리면 상품성이 낮아진다.\n\n근거·학습주제\n채소학 수확적기","explanationSections":[{"label":"정답 근거","text":"브로콜리는 꽃이 피기 전 미숙한 화뢰를 수확하므로 생리적 성숙 수확에 해당하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"토마토·수박·딸기는 과실 성숙과 상품 수확단계를 연결해 수확한다. 브로콜리의 개화·종자 성숙까지 기다리면 상품성이 낮아진다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소학 수확적기","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"11-69","round":11,"year":2025,"number":69,"subject":"재배학·원예작물학","topic":"순지르기","stem":"다음이 설명하는 과수의 가지 관리방법은?\n○ 신초의 생장을 일시적으로 억제하여 착과율을 높인다.\n○ 그해에 새 가지를 분지시켜 원가지나 곁가지를 구성시킨다.\n○ 웃자람을 방지하기 위해서 실시한다.","options":[{"n":"1","text":"환상박피"},{"n":"2","text":"순지르기"},{"n":"3","text":"가지유인"},{"n":"4","text":"가지비틀기"}],"answers":["2"],"answerLabel":"2번", 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"11-74","round":11,"year":2025,"number":74,"subject":"재배학·원예작물학","topic":"벤로형 투광","stem":"벤로형(Venlo) 온실에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?\n벤로형 온실은 서까래의 간격이 넓어지기 때문에 골조가 적게 들어 ( ㄱ )이\n감소한다. 이에 따라 온실의 ( ㄴ )이 증가한다.","options":[{"n":"1","text":"ㄱ: 골조율, ㄴ: 산란율"},{"n":"2","text":"ㄱ: 골조율, ㄴ: 투광률"},{"n":"3","text":"ㄱ: 투광률, ㄴ: 골조율"},{"n":"4","text":"ㄱ: 투광률, ㄴ: 산란율"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n골조가 차지하는 비율인 골조율이 감소하면 빛을 가리는 면적이 줄어 투광률이 높아진다.\n\n오답 확인\n골조율과 투광률은 같은 방향이 아니다. 산란율은 재료의 광학특성과 관련돼 이 구조적 빈칸을 대신하지 못한다.\n\n근거·학습주제\n시설원예 온실구조","explanationSections":[{"label":"정답 근거","text":"골조가 차지하는 비율인 골조율이 감소하면 빛을 가리는 면적이 줄어 투광률이 높아진다.","kind":"reason"},{"label":"오답 확인","text":"골조율과 투광률은 같은 방향이 아니다. 산란율은 재료의 광학특성과 관련돼 이 구조적 빈칸을 대신하지 못한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 온실구조","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"11-75","round":11,"year":2025,"number":75,"subject":"재배학·원예작물학","topic":"고압나트륨등","stem":"시설원예용 인공조명 중 고압나트륨등에 관한 설명이다. ( )에 들어갈 내용으로\n옳은 것은?\n식물 재배에 고압나트륨등을 단독 사용하면 500 nm 이하의 ( ㄱ )이 적기 때문\n에 ( ㄴ )될 가능성이 있다. 하지만 일반 온실의 보광용으로는 단독 사용해도\n문제가 없다.","options":[{"n":"1","text":"ㄱ: 청색광, ㄴ: 왜화"},{"n":"2","text":"ㄱ: 원적색광, ㄴ: 도장"},{"n":"3","text":"ㄱ: 청색광, ㄴ: 도장"},{"n":"4","text":"ㄱ: 원적색광, ㄴ: 왜화"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n고압나트륨등은 500nm 이하 청색광이 부족하여 단독 재배광으로 쓰면 도장 가능성이 있다.\n\n오답 확인\n원적색광 부족과 혼동하지 않는다. 자연광이 있는 온실 보광에서는 자연광의 청색광을 함께 받으므로 단독 광원 재배와 조건이 다르다.\n\n근거·학습주제\n시설원예 인공광","explanationSections":[{"label":"정답 근거","text":"고압나트륨등은 500nm 이하 청색광이 부족하여 단독 재배광으로 쓰면 도장 가능성이 있다.","kind":"reason"},{"label":"오답 확인","text":"원적색광 부족과 혼동하지 않는다. 자연광이 있는 온실 보광에서는 자연광의 청색광을 함께 받으므로 단독 광원 재배와 조건이 다르다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 인공광","kind":"reference"}],"sourcePdf":"2025년 제11회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"12-1","round":1 kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":[]},{"id":"12-3","round":12,"year":2026,"number":3,"subject":"상법(보험편)","topic":"기발생 보험사고","stem":"상법상 보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 그 계약전의 어느 시기를 보험기간의 시기로 할 수 있다."},{"n":"2","text":"보험계약당시에 보험사고가 이미 발생한 때에는 그 계약은 취소할 수 있다."},{"n":"3","text":"보험계약자는 불특정의 타인을 위하여 보험계약을 체결할 수 있다."},{"n":"4","text":"보험자는 보험계약자가 최초의 보험료를 지급하지 아니한 때에는 보험증권을 교부하\n지 않을 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n계약 당시 이미 발생했거나 발생불능인 사고는 계약 무효가 원칙이다. 취소할 수 있다고 한 ②는 효과를 바꿨다.\n\n오답 확인\n소급보험, 불특정 타인을 위한 보험, 최초보험료 미지급 시 증권 미교부는 허용된다. 다만 사고의 확정사실을 모두 몰랐을 때 무효의 예외를 별도로 본다.\n\n근거·학습주제\n상법 제639조·제640조·제643조·제644조","explanationSections":[{"label":"정답 근거","text":"계약 당시 이미 발생했거나 발생불능인 사고는 계약 무효가 원칙이다. 취소할 수 있다고 한 ②는 효과를 바꿨다.","kind":"reason"},{"label":"오답 확인","text":"소급보험, 불특정 타인을 위한 보험, 최초보험료 미지급 시 증권 미교부는 허용된다. 다만 사고의 확정사실을 모두 몰랐을 때 무효의 예외를 별도로 본다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조·제640조·제643조·제644조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["5-5","4-4","11-4","9-4","10-7","3-5","2-24","8-3","3-7","9-6","7-6","12-5","11-3","5-7","2-5","5-4","12-6","10-5","7-5","12-7","6-12","2-2","10-3","11-2","5-3","2-4","4-9","8-4","9-11","9-2","7-2","11-15"]},{"id":"12-4","round":12,"year":2026,"number":4,"subject":"상법(보험편)","topic":"보험대리상의 권한 제한","stem":"상법상 보험대리상 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험대리상은 보험계약자로부터 청약의 의사표시를 수령할 수 있는 권한을 갖는다."},{"n":"2","text":"보험대리상은 보험계약자에게 보험계약의 체결의 의사표시를 할 수 있는 권한을 갖는다."},{"n":"3","text":"보험자는 보험계약의 해지의 의사표시를 할 수 있는 보험대리상의 권한을 제한할 수 없다."},{"n":"4","text":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하\n는 자는 보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한이 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험자는 대리상의 법정 권한을 제한할 수 있다. 다만 선의의 보험계약자에게 그 제한으로 대항할 수 없다.\n\n오답 확인\n청약 수령·계약체결 의사표시 권한은 보험대리상 권한이다. 계속 중개자에게 보험자가 작성한 보험증 ?","options":[{"n":"1","text":"보험자가 파산의 선고를 받은 때에는 보험계약자는 계약을 해지할 수 없다."},{"n":"2","text":"보험사고가 발생하기 전에는 보험계약자는 언제든지 계약의 전부를 해지할 수 있다."},{"n":"3","text":"타인을 위한 보험계약의 경우에는 보험계약자는 그 타인의 동의를 얻고 보험증권을\n소지한 때에만 계약을 해지할 수 있다."},{"n":"4","text":"보험계약을 임의해지한 경우 보험계약자는 당사자간에 다른 약정이 없으면 미경과\n보험료의 반환을 청구할 수 없다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n사고 전 계약자는 원칙적으로 언제든 계약 전부·일부를 해지할 수 있다.\n\n오답 확인\n보험자 파산 시에도 해지 가능하다. 타인을 위한 보험은 동의 또는 증권소지이고 둘 모두를 요구하지 않는다. 미경과보험료 반환은 다른 약정 없으면 가능하다.\n\n근거·학습주제\n상법 제649조·제654조","explanationSections":[{"label":"정답 근거","text":"사고 전 계약자는 원칙적으로 언제든 계약 전부·일부를 해지할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"보험자 파산 시에도 해지 가능하다. 타인을 위한 보험은 동의 또는 증권소지이고 둘 모두를 요구하지 않는다. 미경과보험료 반환은 다른 약정 없으면 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제649조·제654조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["3-7","7-5","6-16","2-4","5-7","9-6","4-9","10-7","11-6","8-11","9-16","5-9","6-12","11-9","12-3","9-11","2-5","11-2","3-11","11-7","12-5","7-7","9-4","8-3","10-5"]},{"id":"12-7","round":12,"year":2026,"number":7,"subject":"상법(보험편)","topic":"계속보험료 지체","stem":"보험계약자가 보험료 지급을 지체한 경우의 효력에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 계약체결후 지체없이 제1회 보험료를 지급하지 아니하는 경우에는 다른\n약정이 없는 한 계약성립후 15일이 경과하면 그 계약은 해제된 것으로 본다."},{"n":"2","text":"계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 상당한 기간을 정하여\n보험계약자에게 최고하고 그 기간내에 지급되지 아니한 때에는 그 계약을 취소할 수\n있다."},{"n":"3","text":"보험사고가 발생한 후에 보험자가 계속보험료 미지급을 이유로 계약을 해지하였을 때\n에는 보험금을 지급할 책임이 있다."},{"n":"4","text":"특정한 타인을 위한 보험의 경우에 보험계약자가 계속보험료의 지급을 지체한 때에는\n보험자는 그 타인에게도 상당한 기간을 정하여 보험료의 지급을 최고한 후가 아니면\n그 계약을 해지하지 못한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n특정 타인을 위한 계약은 그 타인에게도 상당기간을 정해 최고해야 해지할 수 있다.\n\n오답 확인\n최초보험료 미지급의 법정기간은 2개월이다. 계속보험료 미지급 효과는 취소가 아니라 해지이고 사고 후 유효한 연체해지도 보험금 면책과 연결될 수 있다.\n\n근거·학습주제\n상법 제650조·제655조","explanationSections":[{"label":"정답 근거","text":"특정 타인을 위한 계약은 그 타인에게도 상당기간을 정해 최고해야 해지할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"최초보험료 미지급의 법정기간은 2개월이다. 계속보험료 미지급 효과는 취소가 아니라 해지이고 사고 후 유효한 연체해지도 보험금 면책과 연결될 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조·제655조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["7-6","2-5","9-6","11-7","3-8","10-5","1-6","4-9","8-6","8-7","3-7","6-18","3-11","12-3","4-6","5-7","10-11"]},{"id":"12-8","round":12,"year":2026,"number":8,"subject":"상법(보험편)","topic":"고지의무 해지기간","stem":"상법상 보험계약에서의 고지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약당시에 피보험자가 중대한 과실로 인하여 중요한 사항을 고지하지 아니한 때\n에는 보험자는 그 사실을 안 날로부터 1년이 지난 후 계약을 해지할 수 있다."},{"n":"2","text":"보험자가 서면으로 질문한 사항은 중요한 사항으로 추정한다."},{"n":"3","text":"고지의무를 위반한 사실이 보험사고 발생에 영향을 미치지 아니하였음이 증명된 경우\n보험자는 보험금을 지급할 책임이 있다."},{"n":"4","text":"생명보험의 보험수익자는 고지의무자에 해당하지 않는다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n고지의무위반 해지는 안 날부터 1개월, 계약일부터 3년 이내이다. 안 날 1년 후 해지한다는 ①이 틀리다.\n\n오답 확인\n서면질문은 중요사항 추정이다. 사고와 위반사항의 인과관계가 없으면 급부책임은 유지되며 수익자는 법정 고지의무자가 아니다.\n\n근거·학습주제\n상법 제651조·제651조의2·제655조","explanationSections":[{"label":"정답 근거","text":"고지의무위반 해지는 안 날부터 1개월, 계약일부터 3년 이내이다. 안 날 1년 후 해지한다는 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"서면질문은 중요사항 추정이다. 사고와 위반사항의 인과관계가 없으면 급부책임은 유지되며 수익자는 법정 고지의무자가 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제651조·제651조의2·제655조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["9-8","4-7","8-9","1-13","11-9","2-13","7-7","7-11","3-11","5-8","3-9","1-8","10-6"]},{"id":"12-9","round":12,"year":2026,"number":9,"subject":"상법(보험편)","topic":"위험증가 후 보험자 권리","stem":"보험기간 중 사고발생의 위험이 현저하게 증가된 경우 보험계약관계에 관한 설명으\n로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 위험이 증가된 사실을 안 때에는 보험자에게 통지할 의무가 없다."},{"n":"2","text":"보험자가 피보험자로부터 위험이 증가된 사실을 통지받은 때에는 1월내에 계약을 해\n지할 수 있다."},{"n":"3","text":"보험계약자의 중과실로 인하여 위험이 증가된 때에는 보험자는 계약을 해지할 수 없\n다."},{"n":"4","text":"피보험자의 고의로 인하여 위험이 증가된 때에는 계약은 해지된 것으로 본다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n현저한 위험증가를 통지받으면 보험자는 1개월 내 증액청구 또는 해지를 할 수 있다.\n\n오답 확인\n계약자·피보험자는 알면 통지의무가 있다. 고의·중과실 위험증가도 해지사유이고 해지는 의사표시가 필요해 자동해지가 아니다.\n\n근거·학습주제\n상법 제652조·제653조","explanationSections":[{"label":"정답 근거","text":"현저한 위험증가를 통지받으면 보험자는 1개월 내 증액청구 또는 해지를 할 수 있다.","kind":"reason"},{"label":"오답 확인","text":"계약자·피보험자는 알면 통지의무가 있다. 고의·중과실 위험증가도 해지사유이고 해지는 의사표시가 필요해 자동해지가 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조·제653조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["3-10","11-10","9-15","7-10","10-9","8-10","7-9","4-10","2-14","6-19","5-9","9-16","8-11"]},{"id":"12-10","round":12,"year":2026,"number":10,"subject":"상법(보험편)","topic":"사고발생 통지의무","stem":"손해보험에서 보험사고발생의 통지의무와 보험자의 보험금액의 지급에 관한 설명으\n로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 보험금액의 지급에 관하여 약정기간이 없는 경우에는 보험사고 발생을 통지\n받은 후 지체없이 지급할 보험금액을 정하고, 그 정하여진 날부터 10일내에 피보험자\n에게 보험금액을 지급하여야 한다."},{"n":"2","text":"보험사고가 보험계약자의 고의 또는 중대한 과실로 인하여 생긴 때에는 보험자는 보험\n금액을 지급할 책임이 없다."},{"n":"3","text":"보험사고가 전쟁 기타의 변란으로 인하여 생긴 때에는 당사자간에 다른 약정이 없으면\n보험자는 보험금액을 지급할 책임이 없다."},{"n":"4","text":"보험계약자는 보험사고의 발생을 안 때라도 보험자에게 그 통지를 발송할 의무가 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험계약자는 보험사고를 알면 지체 없이 보험자에게 통지를 발송해야 한다. 의무가 없다는 ④가 틀리다.\n\n오답 확인\n지급기간 약정이 없으면 금액 확정일부터 10일 내 지급한다. 고의·중과실 및 전쟁 기타 변란에 따른 면책규정도 구별한다.\n\n근거·학습주제\n상법 제657조~제660조","explanationSections":[{"label":"정답 근거","text":"보험계약자는 보험사고를 알면 지체 없이 보험자에게 통지를 발송해야 한다. 의무가 없다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"지급기간 약정이 없으면 금액 확정일부터 10일 내 지급한다. 고의·중과실 및 전쟁 기타 변란에 따른 면책규정도 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제657조~제660조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["3-12","2-18","9-13","4-12","10-11","8-12","11-12","7-14","11-11","12-18","5-9","7-12","10-10","3-11","1-11","4-11","7-11","8-1","2-11","8-20"]},{"id":"12-11","round":12,"year":2026,"number":11,"subjec ,"text":"보험료와 그 지급방법"},{"n":"4","text":"보험계약자의 기명날인 또는 서명"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험증권에는 보험자의 기명날인 또는 서명이 요구된다. 계약자의 기명날인·서명을 법정 증권기재사항이라고 한 ④가 틀리다.\n\n오답 확인\n보험목적, 사고 성질, 보험료와 지급방법은 기재사항이다.\n\n근거·학습주제\n상법 제666조","explanationSections":[{"label":"정답 근거","text":"보험증권에는 보험자의 기명날인 또는 서명이 요구된다. 계약자의 기명날인·서명을 법정 증권기재사항이라고 한 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"보험목적, 사고 성질, 보험료와 지급방법은 기재사항이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["2-19"]},{"id":"12-14","round":12,"year":2026,"number":14,"subject":"상법(보험편)","topic":"보험기간 중 가액 감소","stem":"보험금액이 보험가액을 현저하게 초과하는 보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"계약이 보험계약자의 사기로 인하여 체결된 것이 아닌 때에는 보험자는 보험료와 보험\n금액의 감액을 청구할 수 있다."},{"n":"2","text":"계약 당시의 보험가액을 기준으로 하여 초과보험 여부를 판단한다."},{"n":"3","text":"보험기간 중에 보험가액이 현저하게 감소된 때에는 보험자는 보험료와 보험금액의\n감액을 청구할 수 없다."},{"n":"4","text":"계약이 보험계약자의 사기로 인하여 체결된 때에는 그 계약은 무효로 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험기간 중 가액이 현저히 감소해도 보험료·보험금액 감액을 청구할 수 있으므로 ③이 틀리다.\n\n오답 확인\n비사기 초과보험의 감액, 체결 당시 가액에 따른 초과판단, 사기 초과보험의 무효는 법문 내용이다.\n\n근거·학습주제\n상법 제669조","explanationSections":[{"label":"정답 근거","text":"보험기간 중 가액이 현저히 감소해도 보험료·보험금액 감액을 청구할 수 있으므로 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"비사기 초과보험의 감액, 체결 당시 가액에 따른 초과판단, 사기 초과보험의 무효는 법문 내용이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["11-15","8-16","10-16","6-24","9-11","3-22","5-14","4-16","2-11","11-4"]},{"id":"12-15","round":12,"year":2026,"number":15,"subject":"상법(보험편)","topic":"미평가보험의 가액","stem":"상법상 보험계약의 목적의 가액(보험가액)에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 당사자간에 보험가액을 정하지 아니한 때에는 계약체결시의 가액을 보험가액\n으로 한다."},{"n":"2","text":"보험계약 당사자간에 보험가액을 정한 때에는 그 가액은 사고발생시의 가액으로 정한\n것으로 추정한다."},{"n":"3","text":"보험계약 당 현상이 나타나는 냉해이다."},{"n":"4","text":"대책으로는 객토로 누수답을 개량하고 암거배수로 습답을 개량하는 방법이 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n저온에서 규산 흡수가 감소하고 조직이 연약해져 병 발생에 취약해진다. 규산 흡수 증가·충분한 규질화라는 ①은 반대이다.\n\n오답 확인\n지연형은 생육지연·등숙불량, 장해형은 생식생장기의 불임과 관련된다. 누수답·습답 개량도 저온피해 대책이다.\n\n근거·학습주제\n재배학 벼 냉해","explanationSections":[{"label":"정답 근거","text":"저온에서 규산 흡수가 감소하고 조직이 연약해져 병 발생에 취약해진다. 규산 흡수 증가·충분한 규질화라는 ①은 반대이다.","kind":"reason"},{"label":"오답 확인","text":"지연형은 생육지연·등숙불량, 장해형은 생식생장기의 불임과 관련된다. 누수답·습답 개량도 저온피해 대책이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 벼 냉해","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":["3-58","7-55"]},{"id":"12-57","round":12,"year":2026,"number":57,"subject":"재배학·원예작물학","topic":"일장반응","stem":"장일형 작물에 해당하는 것을 모두 고른 것은?\nㄱ. 상추 ㄴ. 감자 ㄷ. 담배 ㄹ. 콩","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n출제 분류상 상추와 감자는 장일형 작물이다.\n\n오답 확인\n담배·콩은 대표적인 단일형이다. 감자는 개화의 일장반응과 괴경형성의 단일촉진을 구별해야 한다.\n\n기준·정답 처리 메모\n감자의 장일형 분류는 개화 기준이다. 식용 괴경 형성은 단일조건에서 촉진되므로 두 생리현상을 혼동하지 않는다.\n\n근거·학습주제\n재배학 광주기성","explanationSections":[{"label":"정답 근거","text":"출제 분류상 상추와 감자는 장일형 작물이다.","kind":"reason"},{"label":"오답 확인","text":"담배·콩은 대표적인 단일형이다. 감자는 개화의 일장반응과 괴경형성의 단일촉진을 구별해야 한다.","kind":"incorrect"},{"label":"기준·정답 처리 메모","text":"감자의 장일형 분류는 개화 기준이다. 식용 괴경 형성은 단일조건에서 촉진되므로 두 생리현상을 혼동하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"재배학 광주기성","kind":"reference"}],"sourcePdf":"2026년 제12회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"12-58","round":12,"year":2026,"number":58,"subject":"재배학·원예작물학","topic":"벼 기상생태형","stem":"벼의 기상생태형에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"기본영양생장형은 기본영양생장성이 크고 감광성과 감온성이 작아서 기본영양생장에\n지배되는 통일형 품종 벼가 여기에 해당한다."},{"n":"2","text":"감온형은 기본영양생장성과 감광성이 작고 감온성이 커서 생육기간이 주로 감온성에\n지배되며 조생종 벼가 여기에 해당한다."},{"n":"3","text":"감광형은 기본영양생장성과 감온성이 작고 감광성이 커서 생육기
