<script type="application/json" id="question-data">[{"id":"1-1","round":1,"year":2015,"number":1,"subject":"상법(보험편)","stem":"보험계약의 선의성을 유지하기 위한 제도로 옳지 않은 것은?","options":[{"n":"1","text":"보험자의 보험약관설명의무"},{"n":"2","text":"보험계약자의 손해방지의무"},{"n":"3","text":"보험계약자의 중요사항 고지의무"},{"n":"4","text":"인위적 보험사고에 대한 보험자면책"}],"answers":["1"],"answerLabel":"1번","explanation":"保\u0000契約者の損害防지의무, 고지의무 및 고의사고 면책은 도덕적 위험을 줄이고 선의성을 지키는 제도다. 약관 설명의무는\n계약자의 합리적 선택을 돕는 제도이므로 ①이 해당하지 않는다.","similarIds":[]},{"id":"1-2","round":1,"year":2015,"number":2,"subject":"상법(보험편)","stem":"타인을 위한 보험계약의 보험계약자가 피보험자의 동의를 얻어야 할 수 있는 것은?","options":[{"n":"1","text":"보험증권교부청구권"},{"n":"2","text":"보험사고 발생 전 보험계약해지권"},{"n":"3","text":"특별위험 소멸에 따른 보험료감액청구권"},{"n":"4","text":"보험계약 무효에 따른 보험료반환청구권"}],"answers":["2"],"answerLabel":"2번","explanation":"타인을 위한 보험계약에서 계약자가 보험계약을 해지하려면 원칙적으로 피보험자의 동의를 얻어야 한다.","similarIds":["2-15"]},{"id":"1-3","round":1,"year":2015,"number":3,"subject":"상법(보험편)","stem":"보험약관의 조항 중 그 효력이 인정되지 않는 것은?","options":[{"n":"1","text":"보험계약체결일 기준 1월 전부터 보험기간이 시작되기로 하는 조항"},{"n":"2","text":"보험증권교부일로부터 2월 이내에 증권내용에 이의를 할 수 있도록 하는 조항"},{"n":"3","text":"약관설명의무 위반 시 보험계약자가 1월 이내에 계약을 취소할 수 있도록 하는 조항"},{"n":"4","text":"보험계약자의 보험료 반환청구권의 소멸시효기간을 3년으로 하는 조항"}],"answers":["3"],"answerLabel":"3번","explanation":"약관 설명의무 위반 시 취소권 행사기간은 계약 성립일부터 3개월 이내다. 1개월만 허용하는 ③ 조항은 법정 권리를 줄여\n효력이 인정되지 않는다.","similarIds":["5-12","10-13"]},{"id":"1-4","round":1,"year":2015,"number":4,"subject":"상법(보험편)","stem":"보험대리상이 갖는 권한으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자 명의의 보험계약체결권"},{"n":"2","text":"보험계약자에 대한 위험변경증가권"},{"n":"3","text":"보험계약자에 대한 보험증권교부권"},{"n":"4","text":"보험계약자로부터의 보험료수령권"}],"answers":["2"],"answerLabel":"2번","explanation":"보험대리상은 보험계약 체결, 보험증권 교부, 보험료 수령 등의 권한을 가질 수 있지만 계약자에게 위험변경을 요구하는 권한은\n없다.","similarIds":["12-5","2-3","4-5","12-4"]},{"id":"1-5","round":1,"year":2015,"number":5,"subject":"상법(보험편)","stem":"보험계약자가 보험료의 감액을 청구할 수 있는 경우에 해당하는 것은?","options":[{"n":"1","text":"보험계약 무효 시 보험계약자와 피보험자가 선의이며 중대한 과실이 없는 경우"},{"n":"2","text":"보험계약 무효 시 보험계약자와 보험수익자가 선의이며 중대한 과실이 없는 경우"},{"n":"3","text":"특별한 위험의 예기로 보험료를 정한 때에 그 위험이 보험기간 중 소멸한 경우"},{"n":"4","text":"보험사고 발생 전의 임의해지 시 미경과보험료에 대해 다른 약정이 없는 경우"}],"answers":["3"],"answerLabel":"3번","explanation":"보험료를 특별한 위험을 예상하여 정한 뒤 그 위험이 보험기간 중 소멸하면 계약자는 이후 보험료의 감액을 청구할 수 있다.","similarIds":["11-6","12-5","5-7","10-5"]},{"id":"1-6","round":1,"year":2015,"number":6,"subject":"상법(보험편)","stem":"보험료에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 계약체결 후 지체없이 보험료의 전부 또는 최초보험료를 지급하여야 한다."},{"n":"2","text":"보험계약자의 최초보험료 미지급시 다른 약정이 없는 한 계약성립 후 2월의 경과로 그\n계약은 해제된 것으로 본다."},{"n":"3","text":"계속보험료 미지급으로 보험자가 계약을 해지하기 위해서는 보험계약자에게 상당기간을\n정하여 그 기간 내에 지급할 것을 최고하여야 한다."},{"n":"4","text":"타인을 위한 보험의 경우 보험계약자의 보험료지급 지체시 보험자는 그 타인에게 보험료\n지급을 최고하지 않아도 계약을 해지할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"타인을 위한 보험에서 계약자가 보험료 지급을 지체하면 보험자는 그 타인에게도 상당한 기간을 정해 지급을 최고해야 계약을\n해지할 수 있다. ④가 옳지 않다.","similarIds":["7-6","12-7","11-7","2-5","9-6","10-5","1-7","3-8","4-9","8-7","8-6","3-7"]},{"id":"1-7","round":1,"year":2015,"number":7,"subject":"상법(보험편)","stem":"보험계약 부활에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자의 고지의무위반으로 보험자가 보험계약을 해지하여야 한다."},{"n":"2","text":"보험계약자의 최초보험료 미지급으로 보험자가 보험계약을 해지하여야 한다."},{"n":"3","text":"보험계약자가 연체보험료에 법정이자를 더하여 보험자에게 지급하여야 한다."},{"n":"4","text":"보험자가 보험계약을 해지하고 해지환급금을 지급하지 않았어야 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"해지환급금이 지급되지 않은 상태로 계약이 해지된 경우 보험계약자는 법정기간 내 연체보험료와 약정이자를 지급하고 부활을\n청구할 수 있다. 이 요건을 말한 ④가 옳다.","similarIds":["11-8","1-6","2-6","4-9","11-9","8-8","5-8","3-11","9-6","3-7","8-7","9-7"]},{"id":"1-8","round":1,"year":2015,"number":8,"subject":"상법(보험편)","stem":"보험계약자의 고지의무위반으로 인한 보험자의 계약해지권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"고지의무위반 사실이 보험사고의 발생에 영향을 미치지 않은 경우 보험자는 계약을 해지\n하더라도 보험금을 지급할 책임이 있다."},{"n":"2","text":"보험자는 보험사고 발생 전에 한하여 해지권을 행사할 수 있다."},{"n":"3","text":"보험자가 계약을 해지한 경우 보험금을 지급할 책임이 없으며 이미 지급한 보험금에 대해\n서는 반환을 청구할 수 없다."},{"n":"4","text":"보험자는 고지의무위반사실을 안 날로부터 3월내에 해지권을 행사할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"고지의무 위반이 사고 발생에 영향을 미치지 않았음이 증명되면 보험자는 보험금을 지급해야 한다. ①이 옳다.","similarIds":["3-11","5-8","6-17","11-9","9-8","7-11","12-8","2-13","7-7"]},{"id":"1-9","round":1,"year":2015,"number":9,"subject":"상법(보험편)","stem":"위험의 변경증가에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 위험변경증가통지의무는 보험계약자 또는 피보험자가 부담한다.\nㄴ. 보험계약자의 위험변경증가통지의무는 피보험자의 행위로 인한 위험변경의\n경우에 한한다.\nㄷ. 보험자는 위험변경증가통지를 받은 때로부터 1월 이내에 보험료의 증액을\n청구할 수 있다.\nㄹ. 보험자는 위험변경증가의 사실을 안 날로부터 6월 이내에 한하여 계약을\n해지할 수 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"ㄱ은 계약자 또는 피보험자가 부담하고, ㄷ은 통지 후 1개월 내 보험료 증액 등을 청구할 수 있다. ㄴ과 ㄹ은 의무 및\n해지기간을 잘못 설명했다. ㄱ·ㄷ이므로 ②다.","similarIds":["4-10","2-14","7-9","6-19","11-10","10-9","8-10"]},{"id":"1-10","round":1,"year":2015,"number":10,"subject":"상법(보험편)","stem":"보험료의 지급과 보험자의 책임개시에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험설계사는 보험자가 작성한 영수증을 보험계약자에게 교부하는 경우에만 보험료수령권이\n있다."},{"n":"2","text":"보험자의 책임은 당사자 간에 다른 약정이 없으면 최초 보험료를 지급 받은 때로부터 개시\n한다."},{"n":"3","text":"보험료불가분의 원칙에 의해 보험계약자는 다른 약정이 있더라도 일시에 보험료를 지급\n하여야 한다."},{"n":"4","text":"보험자의 보험료청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다."}],"answers":["3"],"answerLabel":"3번","explanation":"보험료 불가분 원칙은 보험료를 기간에 따라 나누지 않는다는 뜻이지, 분납 약정을 금지하는 것이 아니다. ③이 틀리다.","similarIds":["2-5","3-6","11-7","8-12"]},{"id":"1-11","round":1,"year":2015,"number":11,"subject":"상법(보험편)","stem":"보험자의 보험금 지급과 면책사유에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험금은 당사자 간에 특약이 있는 경우라도 금전이외의 현물로 지급할 수 없다."},{"n":"2","text":"보험자의 보험금 지급은 보험사고발생의 통지를 받은 후 10일 이내에 지급할 보험금액을\n정하고 10일 이후에 이를 지급하여야 한다."},{"n":"3","text":"보험의 목적인 과일의 자연 부패로 인하여 발생한 손해에 대해서 보험자는 보험금을 지급\n하여야 한다."},{"n":"4","text":"건물을 특약 없는 화재보험에 가입한 보험계약에서 홍수로 건물이 멸실된 경우 보험자는\n보험금을 지급하지 않아도 된다."}],"answers":["4"],"answerLabel":"4번","explanation":"특약 없는 화재보험에서 건물이 홍수로 멸실되면 화재 위험이 아니므로 보험자는 보상하지 않는다. ④가 옳다.","similarIds":["3-12","4-12","9-13","12-10"  ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"우박 피해는 과실 손상뿐 아니라 상처를 통한 병 발생 등 2차 피해를 일으킬 수 있다. ㄱ·ㄷ이 옳다.","similarIds":["12-59"]},{"id":"3-63","round":3,"year":2017,"number":63,"subject":"재배학·원예작물학","stem":"과수원의 태풍피해 대책으로 옳지 않은 것은?","options":[{"n":"1","text":"방풍림으로 교목과 관목의 혼합 식재가 효과적이다."},{"n":"2","text":"방풍림은 바람의 방향과 직각 방향으로 심는다."},{"n":"3","text":"과수원내의 빈 공간 확보는 태풍피해를 경감시켜 준다."},{"n":"4","text":"왜화도가 높은 대목은 지주 결속으로 피해를 줄여준다."}],"answers":["3"],"answerLabel":"3번","explanation":"과수원 빈 공간은 바람길을 만들어 태풍 피해를 키울 수 있으므로 확보하는 것이 대책이라는 ③은 틀리다.","similarIds":[]},{"id":"3-64","round":3,"year":2017,"number":64,"subject":"재배학·원예작물학","stem":"작물의 육묘에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"수확기 및 출하기를 앞당길 수 있다."},{"n":"2","text":"육묘용 상토의 pH는 낮을수록 좋다."},{"n":"3","text":"노지정식 전 경화과정(hardening)이 필요하다."},{"n":"4","text":"육묘와 재배의 분업화가 가능하다."}],"answers":["2"],"answerLabel":"2번","explanation":"육묘용 상토는 작물에 맞는 적정 pH가 필요하며 무조건 낮을수록 좋은 것은 아니다.","similarIds":[]},{"id":"3-65","round":3,"year":2017,"number":65,"subject":"재배학·원예작물학","stem":"다음 설명의 영양번식 방법은?\n○ 양취법(楊取法)이라고도 한다.\n○ 오래된 가지를 발근시켜 떼어낼 때 사용한다.\n○ 발근시키고자 하는 부분에 미리 박피를 해준다.","options":[{"n":"1","text":"성토법(盛土法)"},{"n":"2","text":"선취법(先取法)"},{"n":"3","text":"고취법(高取法)"},{"n":"4","text":"당목취법(撞木取法)"}],"answers":["3"],"answerLabel":"3번","explanation":"고취법은 가지의 일부를 박피해 발근시킨 뒤 잘라내는 취목 방법이며 양취법이라고도 한다.","similarIds":["1-59"]},{"id":"3-66","round":3,"year":2017,"number":66,"subject":"재배학·원예작물학","stem":"다음의 과수원 토양관리 방법은?\n○ 과수원 관리가 쉽다.\n○ 양분용탈이 발생한다.\n○ 토양침식으로 입단형성이 어렵다.","options":[{"n":"1","text":"초생재배"},{"n":"2","text":"피복재배"},{"n":"3","text":"부초재배"},{"n":"4","text":"청경재배"}],"answers":["4"],"answerLabel":"4번","explanation":"청경재배는 잡초를 제거해 관리가 쉽지만 토양이 노출되어 침식과 양분용탈이 발생하기 쉽다.","similarIds":[]},{"id":"3-67","round":3,"year":2017,"number":67,"subject":"재배학·원예작물학","stem":"사과 과원에서 병해충종합관리(IPM)에 해당되지 않는 것은?","options":[{"n":"1","text":"응애류 천적 제거"},{"n":"2","text":"성페로몬 이용"},{"n":"3","text":"초생재배 실시"},{"n":"4","text":"생물농약 활용"}],"answers":["1"],"answerLabel":"1번","explanation":"응애류 천적을 제거하면 천적을 활용하는 IPM 원칙에 반한다. 성페로몬·초생재배·생물농약은 종합관리 수단이다.","similarIds":[]},{"id":"3-68","round":3,"year":2017,"number":68,"subject":"재배학·원예작물학","stem":"호냉성 채소작물은?","options":[{"n":"1","text":"상추, 가지"},{"n":"2","text":"시금치, 고추"},{"n":"3","text":"오이, 토마토"},{"n":"4","text":"양배추, 딸기"}],"answers":["4"],"answerLabel":"4번","explanation":"호냉성 채소에는 양배추와 딸기가 포함된다. 고추·오이·가지·토마토는 상대적으로 고온성이다.","similarIds":[]},{"id":"3-69","round":3,"year":2017,"number":69,"subject":"재배학·원예작물학","stem":"작물의 생육과정에서 칼슘결핍에 의해 나타나는 증상으로만 짝지어진 것은?","options":[{"n":"1","text":"배추 잎끝마름증상, 토마토 배꼽썩음증상"},{"n":"2","text":"토마토 배꼽썩음증상, 장미 로제트증상"},{"n":"3","text":"장미 로제트증상, 고추 청고증상"},{"n":"4","text":"고추 청고증상, 배추 잎끝마름증상"}],"answers":["1"],"answerLabel":"1번","explanation":"배추 잎끝마름과 토마토 배꼽썩음은 모두 칼슘 결핍과 관련된다.","similarIds":["12-67"]},{"id":"3-70","round":3,"year":2017,"number":70,"subject":"재배학·원예작물학","stem":"채소작물 재배 시 에틸렌에 의한 현상이 아닌 것은?","options":[{"n":"1","text":"토마토 열매의 엽록소 분해를 촉진한다."},{"n":"2","text":"가지의 꼭지에서 이층(離層)형성을 촉진한다."},{"n":"3","text":"아스파라거스의 육질 연화를 촉진한다."},{"n":"4","text":"상추의 갈색 반점을 유발한다."}],"answers":["3"],"answerLabel":"3번","explanation":"에틸렌은 토마토 착색, 가지 꼭지의 이층 형성 및 아스파라거스 연화를 촉진할 수 있다. 상추 갈색반점은 에틸렌의 대표 증상이\n아니다.","similarIds":[]},{"id":"3-71","round":3,"year":2017,"number":71,"subject":"재배학·원예작물학","stem":"다음 과수 접목법의 분류기준은?\n절접, 아접, 할접, 혀접, 호접","options":[{"n":"1","text":"접목부위에 따른 분류"},{"n":"2","text":"접목장소에 따른 분류"},{"n":"3","text":"접목시기에 따른 분류"},{"n":"4","text":"접목방법에 따른 분류"}],"answers":["4"],"answerLabel":"4번","explanation":"절접·아접·할접·혀접·호접은 접목 방식에 따른 분류다.","similarIds":[]},{"id":"3-72","round":3,"year":2017,"number":72,"subject":"재배학·원예작물학","stem":"화훼작물의 플러그묘 생산에 관한 옳은 설명을 모두 고른 것은?\nㄱ. 좁은 면적에서 대량육묘가 가능하다.\nㄴ. 최적의 생육조건으로 다양한 규격묘 생산이 가능하다.\nㄷ. 노동집약적이며 관리가 용이하다.\nㄹ. 정밀기술이 요구된다.","options":[{"n":"1","text":"ㄱ, ㄴ, ㄷ"},{"n":"2","text":"ㄱ, ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄷ, ㄹ"},{ 상법(보험편)","stem":"보험약관의 교부ㆍ설명의무에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면\n판례에 따름)\nㄱ. 고객이 약관의 내용을 충분히 잘 알고 있는 경우에는 보험자가 고객에게 그 약관\n의 내용을 따로 설명하지 않아도 되나, 그러한 따로 설명할 필요가 없는 특별한\n사정은 이를 주장하는 보험자가 입증하여야 한다.\nㄴ. 약관에 정하여진 중요한 사항이라면 설사 거래상 일반적이고 공통된 것이어서\n보험계약자가 별도의 설명 없이도 충분히 예상할 수 있었던 사항이라 할지라도\n보험자는 설명의무를 부담한다.\nㄷ. 약관의 내용이 이미 법령에 의하여 정하여진 것을 되풀이 하는 것에 불과한 경우\n에는 고객에게 이를 따로 설명하지 않아도 된다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄱ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["3"],"answerLabel":"3번","explanation":"ㄱ은 약관 내용을 이미 충분히 아는 경우의 설명 예외와 그 입증책임을 말해 옳다. ㄴ은 거래상 예상 가능한 보통\n사항까지 설명해야 한다고 하여 틀리고, ㄷ은 법령을 그대로 옮긴 조항은 별도 설명 대상에서 제외된다는 취지로 옳다.","similarIds":["2-1","7-8"]},{"id":"4-3","round":4,"year":2018,"number":3,"subject":"상법(보험편)","stem":"보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험기간을 정한 때에는 그 시기와 종기는 상법상 손해보험증권의 기재사항에 해당하지 않는다."},{"n":"2","text":"기존의 보험계약을 연장하는 경우에 보험자는 그 보험증권에 그 사실을 기재함으로써 보험\n증권의 교부에 갈음할 수 있다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날로부터 2주간내에 한하여 그 증권내용의\n정부에 관한 이의를 할 수 있음을 약정할 수 있다."},{"n":"4","text":"보험증권을 현저하게 훼손한 때에는 보험계약자는 보험자에 대하여 증권의 재교부를 청구\n할 수 있는데 그 증권작성의 비용은 보험자의 부담으로 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"보험계약 연장 시 보험증권에 연장 사실을 기재하면 증권 교부를 대신할 수 있다. 정답은 ③이다.","similarIds":["12-1","5-4","11-3","2-2","9-3","10-3","6-13","8-3","7-3","10-2","3-5"]},{"id":"4-4","round":4,"year":2018,"number":4,"subject":"상법(보험편)","stem":"보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 당사자 쌍방과 피보험자가 보험계약 당시 보험사고가 발행할 수 없는 것임을 알고\n있었던 때에는 그 계약은 무효로 한다."},{"n":"2","text":"대리인에 의하여 보험계약을 체결한 경우에 대리인이 안 사유는 그 본인이 안 것과 동일\n한 것으로 한다."},{"n":"3","text":"보험계약은 그 계약전의 어느 시기를 보험기간의 시기로 할 수 있다."},{"n":"4","text":"보험계약당시에 보험사고가 이미 발생한 때에는 당사자 쌍방과 피보험자가 이를 알지 못한\n때에도 그 계약은 무효이다."}],"answers":["3"],"answerLabel":"3번","explanation":"보험사고가 계약 당시 이미 발생했더라도 쌍방과 피보험자가 이를 몰랐다면 계약은 무효가 아니다. 따라서 ④가 틀리다.","similarIds":["5-5","11-4","2-24","9-4","6-14","10-7","12-3","3-5","9-17","8-4","7-3"]},{"id":"4-5","round":4,"year":2018,"number":5,"subject":"상법(보험편)","stem":"보험대리상 등의 권한에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자로부터 청약, 고지, 통지, 해지, 취소 등 보험계약에 관한 의사표시를 수령할 수\n있는 보험대리상의 권한을 보험자가 제한한 경우 보험자는 그 제한을 이유로 선의의 보험\n계약자에게 대항하지 못한다."},{"n":"2","text":"보험자는 보험계약자로부터 보험료를 수령할 수 있는 보험대리상의 권한을 제한할 수 없다."},{"n":"3","text":"특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하는 자라 할지라도 보험대리\n상이 아니면 보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한이 없다."},{"n":"4","text":"보험대리상은 보험계약자에게 보험계약의 체결, 변경, 해지 등 보험계약에 관한 의사표시\n를 할 수 있는 권한이 없다."}],"answers":["1"],"answerLabel":"1번","explanation":"보험대리상은 보험계약 관련 의사표시를 수령할 권한이 있고, 제한을 선의의 계약자에게 대항하지 못하는 경우가 있다.\n따라서 ①이 옳다.","similarIds":["12-4","11-5","5-6","7-4","8-5","2-3","6-15","9-5","12-5","2-21","8-6","10-4","1-4"]},{"id":"4-6","round":4,"year":2018,"number":6,"subject":"상법(보험편)","stem":"상법(보험편)에 관한 설명이다. 옳지 않은 것은 몇 개인가?\n○ 계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 다른 절차 없이\n바로 그 계약을 해지할 수 있다.\n○ 보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에 보험기\n간 중 그 예기한 위험이 소멸한 때에는 보험계약자는 그 후의 보험료의 감액을\n청구할 수 있다.\n○ 보험기간 중에 보험계약자 또는 피보험자가 사고발생의 위험이 현저하게 변경\n또는 증가된 사실을 안 때에는 지체없이 보험자에게 통지하여야 한다.","options":[{"n":"1","text":"0개"},{"n":"2","text":"1개"},{"n":"3","text":"2개"},{"n":"4","text":"3개"}],"answers":["2"],"answerLabel":"2번","explanation":"첫 진술은 계속보험료 미납만으로 즉시 해지할 수 있다고 하여 틀리다. 해지 전 상당한 기간을 정한 최고가 필요하다.\n나머지 위험 소멸 시 감액청구와 위험증가 통지의무 진술은 옳다.","similarIds":["10-5","12-5","5-7","2-4","7-9","3-10","11-6","9-15","11-10","2-14","4-10","10-9","7-6","12-7","9-6","2-5","7-10","8-10"]},{"id":"4-7","round":4,"year":2018,"number":7,"subject":"상법(보험편)","stem":"고지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약당시에 보험계약자 또는 피보험자가 고의 또는 중대한 과실로 인하여 중요한 사항을\n부실의 고지를 한 때에는 보험자는 그 사실을 안 날로부터 3년내에 계약을 해지할 수 있다."},{"n":"2","text":"보험자가 서면으로 질문한 사항은 중요한 사항으로 추정한다."},{"n":"3","text":"손해보험의 피보험자는 고지의무자에 해당한다."},{"n":"4","text":"보험자가 계약당시에 고지의무 위반의 사실을 알았거나 중대한 과실로 인하여 알지 못한\n때에는 보험자는 그 계약을 해지할 수 없다."}],"answers":["1","4"],"answerLabel":"1·4번 (복수정답)","explanation":"정답표는 ①·④를 복수 정답으로 제시한다. ①의 해지권 행사기간을 안 날부터 3년이라고 한 점이 틀리고, "3","text":"중복보험의 경우 보험자 1인에 대한 피보험자의 권리의 포기는 다른 보험자의 권리의무에\n영향을 미친다."},{"n":"4","text":"보험자는 보험가액의 한도에서 연대책임을 진다."}],"answers":["2"],"answerLabel":"2번","explanation":"중복보험은 동일 목적·동일 사고에 복수 계약이 체결된 경우다. 보험자는 보험가액 범위에서 각자 부담부분에 따라 책임지며\n보험계약자는 계약 내용을 보험자에게 통지해야 한다.","similarIds":["4-19","9-18","8-18","7-17","3-19","1-17","6-20","2-11"]},{"id":"5-19","round":5,"year":2019,"number":19,"subject":"상법(보험편)","stem":"다음 ( )에 들어갈 용어로 옳은 것은?\n( ㄱ )의 일부를 보험에 붙인 경우에는 보험자는 ( ㄴ )의 ( ㄷ )에 대한 비율에 따라\n보상할 책임을 진다. 그러나 당사자간에 다른 약정이 있는 때에는 보험자는 ( ㄹ )의\n한도 내에서 그 손해를 보상할 책임을 진다.","options":[{"n":"1","text":"ㄱ: 보험금액 ㄴ: 보험가액 ㄷ: 보험금액 ㄹ: 보험금액"},{"n":"2","text":"ㄱ: 보험금액 ㄴ: 보험금액 ㄷ: 보험가액 ㄹ: 보험가액"},{"n":"3","text":"ㄱ: 보험가액 ㄴ: 보험가액 ㄷ: 보험금액 ㄹ: 보험가액"},{"n":"4","text":"ㄱ: 보험가액 ㄴ: 보험금액 ㄷ: 보험가액 ㄹ: 보험금액"}],"answers":["4"],"answerLabel":"4번","explanation":"일부보험의 비례보상은 보험가액 중 보험금액이 차지하는 비율을 손해액에 적용한다. 별도 약정이 있어도 보험금액 한도를\n넘을 수 없다.","similarIds":["6-20","8-24"]},{"id":"5-20","round":5,"year":2019,"number":20,"subject":"상법(보험편)","stem":"손해액의 산정기준 등에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험의 목적에 관하여 보험자가 부담할 손해가 생긴 경우에는 그 후 그 목적이 보험자가\n부담하지 아니하는 보험사고의 발생으로 인하여 멸실된 때에도 보험자는 이미 생긴 손해\n를 보상할 책임을 면하지 못한다."},{"n":"2","text":"당사자간에 다른 약정이 있는 때에도 이득금지의 원칙상 신품가액에 의하여 손해액을 산\n정할 수는 없다."},{"n":"3","text":"보험자가 보상할 손해액은 보험계약이 체결된 때와 곳의 가액에 의하여 산정한다."},{"n":"4","text":"손해액의 산정에 관한 비용은 보험계약자의 부담으로 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"보험자가 부담하는 사고로 이미 손해가 생긴 뒤 비담보 사고로 목적물이 멸실돼도 앞서 발생한 손해의 보상책임은 없어지지\n않는다. 손해액은 사고 당시·장소의 가액을 기준으로 한다.","similarIds":["10-19","9-20","3-25","12-19","6-4","8-21","1-19","4-21","12-18","2-22","10-18","7-21","7-20","8-20","8-15"]},{"id":"5-21","round":5,"year":2019,"number":21,"subject":"상법(보험편)","stem":"다음 ( )에 들어갈 상법 규정으로 옳은 것은?\n상법 제679조(보험목적의 양도)","options":[{"n":"1","text":"피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리와 의무를\n승계한 것으로 추정한다."},{"n":"2","text":"제1항의 경우에 보험의 목적의 ( )은 보험자에 대하여 지체없이 그 사실을 통\n지하여야 한다."},{"n":"3","text":"양도인"},{"n":"4","text":"양수인"}],"answers":["4"],"answerLabel":"4번","explanation":"보험목적 양도 시 보험계약상 권리·의무 승계가 추정되고, 양도인 또는 양수인은 그 양도 사실을 지체 없이 보험자에게\n통지한다.","similarIds":["11-19","12-20","6-6","4-23"]},{"id":"5-22","round":5,"year":2019,"number":22,"subject":"상법(보험편)","stem":"손해방지의무 등에 관한 상법 규정의 설명으로 옳은 것은?","options":[{"n":"1","text":"피보험자뿐만 아니라 보험계약자도 손해방지의무를 부담한다."},{"n":"2","text":"손해방지비용과 보상액의 합계액이 보험금액을 초과한 때에는 보험자의 지시에 의한 경우\n에만 보험자가 이를 부담한다."},{"n":"3","text":"상법은 피보험자는 보험자에 대하여 손해방지비용의 선급을 청구할 수 있다고 규정한다."},{"n":"4","text":"손해의 방지와 경감을 위하여 유익하였던 비용은 보험자가 이를 부담하지 않는다."}],"answers":["1"],"answerLabel":"1번","explanation":"피보험자는 손해 방지·경감 의무를 부담하고, 필요·유익한 손해방지비용은 보험자가 부담한다. 보상액과 비용 합계가\n보험금액을 넘어도 약정 요건에 따라 부담할 수 있다.","similarIds":["1-21","12-21","8-23","10-21","2-10","11-20"]},{"id":"5-23","round":5,"year":2019,"number":23,"subject":"상법(보험편)","stem":"제3자에 대한 보험자대위에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해가 제3자의 행위로 인하여 발생한 경우에 보험금을 지급한 보험자는 그 지급한 금액\n의 한도에서 그 제3자에 대한 보험계약자 또는 피보험자의 권리를 취득한다."},{"n":"2","text":"보험자가 보상할 보험금의 일부를 지급한 경우에는 피보험자의 권리를 침해하지 아니하는\n범위에서 그 권리를 행사할 수 있다."},{"n":"3","text":"보험계약자나 피보험자의 제3자에 대한 권리가 그와 생계를 같이 하는 가족에 대한 것인\n경우 보험자는 그 권리를 취득하지 못한다. 다만, 손해가 그 가족의 과실로 인하여 발생한\n경우에는 그러하지 아니하다."},{"n":"4","text":"보험계약에서 담보하지 아니하는 손해에 해당하여 보험금지급의무가 없음에도 보험자가\n피보험자에게 보험금을 지급한 경우라면, 보험자대위가 인정되지 않는다."}],"answers":["3"],"answerLabel":"3번","explanation":"제3자에 대한 보험자대위는 보험자가 보험금을 지급한 범위에서 인정된다. 일부 지급이면 피보험자의 잔여 권리를 해치지\n않는 범위에서 행사한다. 동거가족에 대한 대위 제한의 예외는 단순 과실만으로 넓혀 적용하지 않는다.","similarIds":["11-22","12-22","8-25","7-22","2-17","11-21"]},{"id":"5-24","round":5,"year":2019,"number":24,"subject":"상법(보험편)","stem":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있는 경우, 상법\n규정으로 옳은 것은?","options":[{"n":"1","text":"보상할 금액을 전액 지급한 후 그 지급기일이 도래한 때 보험자는 잔액의 상환을 청구할\n수 있다."},{"n":"2","text":"그 지급기일이 도래하지 아니한 때라도 보상할 금액에서 이를 공제할 수 있다."},{"n":"3","text":"그 지급기일이 도래하지 아니한 때라면 보상할 금액에서 이를 공제할 수 없다."},{"n":"4","text":"상법은 보험소비자의 보호를 위하여 어떠한 경우에도 보상할 금액에서 이를 공제할 수 없\n다고 규정한다."}],"answers":["2"],"answerLabel":"2번","explanation":"보험료 잔액의 지급기일이 아직 오지 않았더라도 보험자는 보상할 보험금에서 그 잔액을 공제할 수 있다.","similarIds":["10-20","6-5","8-21","7-21"]},{"id":"5-25","round":5,"year":2019,"number":25,"subject":"상법(보험편)","stem":"화재보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"건물을 보험의 목적으로 한 때에는 그 소재지, 구조와 용도를 화재보험증권에 기재하여야\n한다."},{"n":"2","text":"동산을 보험의 목적으로 한 때에는 그 존치한 장소의 상태와 용도를 화재보험증권에 기재\n하여야 한다."},{"n":"3","text":"보험가액을 정한 때에는 그 가액을 화재보험증권에 기재하여야 한다."},{"n":"4","text":"보험계약자의 주소와 성명 또는 상호는 화재보험증권의 기재사항이 아니다.\n2019년도 제5회 손해평가사 1차 1교시 A형 ( 17 - 7 )\n농어업재해보험법령"}],"answers":["4"],"answerLabel":"4번","explanation":"화재보험증권에는 보험계약자 주소·성명(상호) 등 법정 사항을 기재한다. 이를 기재사항이 아니라고 한 선택지가 틀린다.","similarIds":["10-24","12-24","6-9","2-25","7-24","4-25","4-22","3-17","11-25"]},{"id":"5-26","round":5,"year":2019,"number":26,"subject":"농어업재해보험법령","stem":"농어업재해보험법령상 재보험사업에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"정부는 재해보험에 관한 재보험사업을 할 수 없다."},{"n":"2","text":"재보험수수료 등 재보험 약정에 포함되어야 할 사항은 농림축산식품부령에서 정하고 있다."},{"n":"3","text":"재보험약정서에는 재보험금의 지급에 관한 사항뿐 아니라 분쟁에 관한 사항도 포함되어야 한다."},{"n":"4","text":"농림축산식품부장관이 재보험사업에 관한 업무의 일부를 농업정책보험금융원에 위탁하는\n경우에는 해양수산부장관과의 협의를 요하지 않는다."}],"answers":["3"],"answerLabel":"3번","explanation":"정부는 농어업재해 재보험사업을 수행할 수 있다. 재보험약정에는 재보험료·재보험금 및 분쟁 관련 사항 등 법령이 정한\n내용을 포함한다.","similarIds":["3-37","10-36","9-34"]},{"id":"5-27","round":5,"year":2019,"number":27,"subject":"농어업재해보험법령","stem":"농어업재해보험법령상 농어업재해재보험기금에 관한 설명이다. ( )에 들어갈 내용을\n순서대로 옳게 나열한 것은?\n농림축산식품부장관은 ( ㄱ )과 협의하여 법 제21조에 따른 농어업재해재보험기금의\n수입과 지출을 명확히 하기 위하여 한국은행에 ( ㄴ )을 설치하여야 한다.","options":[{"n":"1","text":"ㄱ: 기획재정부장관, ㄴ: 보험계정"},{"n":"2","text":"ㄱ: 기획재정부장관, ㄴ: 기금계정"},{"n":"3","text":"ㄱ: 해양수산부장관, ㄴ: 보험계정"},{"n":"4","text":"ㄱ: 해양수산부장관, ㄴ: 기금계정"}],"answers":["4"],"answerLabel":"4번","explanation":"재보험기금의 수입·지출 관리를 위해 기획재정부장관과 협의하여 한국은행에 기금계정을 설치한다.","similarIds":["4-35","10-36","7-35","12-35","8-36","11-36","3-38"]},{"id":"5-28","round":5,"year":2019,"number":28,"subject":"농어업재해보험법령","stem":"농어업재해보험법 시행령에서 정하고 있는 다음 사항에 대한 과태료 부과기준액을 모\n두 합한 금액은?\n ":"5-67","round":5,"year":2019,"number":67,"subject":"재배학·원예작물학","stem":"담배모자이크바이러스의 주요 피해작물이 아닌 것은?","options":[{"n":"1","text":"가지"},{"n":"2","text":"사과"},{"n":"3","text":"고추"},{"n":"4","text":"배추"}],"answers":["4"],"answerLabel":"4번","explanation":"담배모자이크바이러스는 가지과 작물(고추·가지 등)에 피해를 준다. 사과는 주요 기주작물이 아니다.","similarIds":[]},{"id":"5-68","round":5,"year":2019,"number":68,"subject":"재배학·원예작물학","stem":"식용부위에 따른 분류에서 엽경채류가 아닌 것은?","options":[{"n":"1","text":"시금치"},{"n":"2","text":"미나리"},{"n":"3","text":"마늘"},{"n":"4","text":"오이\n2019년도 제5회 손해평가사 1차 1교시 A형 ( 17 - 16 )"}],"answers":["4"],"answerLabel":"4번","explanation":"엽경채류는 잎·잎자루·줄기 등을 먹는 채소다. 오이는 열매를 식용하는 과채류다.","similarIds":[]},{"id":"5-69","round":5,"year":2019,"number":69,"subject":"재배학·원예작물학","stem":"다음 ( )의 내용을 순서대로 옳게 나열한 것은?\n저온에 의하여 꽃눈형성이 유기되는 것을 ( )라 말하며, 당근ㆍ양배추 등은 ( )\n으로 식물체가 일정한 크기에 도달해야만 저온에 감응하여 화아분화가 이루어진다.","options":[{"n":"1","text":"춘화, 종자춘화형"},{"n":"2","text":"이춘화, 종자춘화형"},{"n":"3","text":"춘화, 녹식물춘화형"},{"n":"4","text":"이춘화, 녹식물춘화형"}],"answers":["3"],"answerLabel":"3번","explanation":"저온에 의해 화아분화가 유도되는 것은 춘화다. 당근·양배추는 일정 크기로 자란 식물체가 저온에 감응하는\n녹식물춘화형이다.","similarIds":[]},{"id":"5-70","round":5,"year":2019,"number":70,"subject":"재배학·원예작물학","stem":"다음 두 농가가 재배하고 있는 품목은?\nA농가: 과실이 자람에 따라 서서히 호흡이 저하되다 성숙기를 지나 완숙이 진행되\n는 전환기에 호흡이 일시적으로 상승하는 과실\nB농가: 성숙기가 되어도 특정한 변화가 일어나지 않는 과실","options":[{"n":"1","text":"A농가: 사과, B농가: 블루베리"},{"n":"2","text":"A농가: 살구, B농가: 키위"},{"n":"3","text":"A농가: 포도, B농가: 바나나"},{"n":"4","text":"A농가: 자두, B농가: 복숭아"}],"answers":["1"],"answerLabel":"1번","explanation":"성숙기에 호흡량이 일시 상승하는 과실은 호흡급등형(클라이맥테릭)이다. 사과가 이에 해당하고 블루베리는\n비호흡급등형으로 분류된다.","similarIds":[]},{"id":"5-71","round":5,"year":2019,"number":71,"subject":"재배학·원예작물학","stem":"도로건설로 야간 조명이 늘어나는 지역에서 개화 지연에 대한 대책이 필요한 화훼작물은?","options":[{"n":"1","text":"국화, 시클라멘"},{"n":"2","text":"장미, 페튜니아"},{"n":"3","text":"금어초, 제라늄"},{"n":"4","text":"칼랑코에, 포인세티아"}],"answers":["4"],"answerLabel":"4번","explanation":"국화와 포인세티아 등 단일성 화훼는 야간 조명으로 암기가 끊기면 개화 larIds":["3-2","9-1","10-2","5-11","8-1"]},{"id":"6-12","round":6,"year":2020,"number":12,"subject":"상법(보험편)","stem":"타인을 위한 보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자는 위임을 받아야만 특정한 타인을 위하여 보험계약을 체결할 수 있다."},{"n":"2","text":"타인을 위한 손해보험계약의 경우에 보험계약자는 그 타인의 서면위임을 받아야만 보험자와\n계약을 체결할 수 있다."},{"n":"3","text":"타인을 위한 손해보험계약의 경우에 보험계약자가 그 타인에게 보험사고의 발생으로 생긴\n손해의 배상을 한 때에는 타인의 권리를 해하지 않는 범위 내에서 보험자에게 보험금액의\n지급을 청구할 수 있다."},{"n":"4","text":"타인을 위해서 보험계약을 체결한 보험계약자는 보험자에게 보험료를 지급할 의무가 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"계약 당시 사고가 이미 발생했거나 발생할 수 없으면 원칙적으로 무효다. 쌍방 및 피보험자가 몰랐던 경우의 예외를 확인한다.","similarIds":["11-2","7-2","5-3","9-2","3-4","7-5","3-7","2-17","12-6","5-7","12-3","2-4","9-6","8-7"]},{"id":"6-13","round":6,"year":2020,"number":13,"subject":"상법(보험편)","stem":"보험증권의 교부에 관한 내용으로 옳은 것을 모두 고른 것은?\nㄱ. 보험계약이 성립하고 보험계약자가 최초의 보험료를 지급했다면 보험자는 지체\n없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다.\nㄴ. 보험증권을 현저하게 훼손한 때에는 보험계약자는 보험증권의 재교부를 청구할\n수 있다. 이 경우에 증권작성비용은 보험자의 부담으로 한다.\nㄷ. 기존의 보험계약을 연장한 경우에는 보험자는 그 사실을 보험증권에 기재하여\n보험증권의 교부에 갈음할 수 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"보험자는 계약 성립 후 증권을 작성·교부한다. 훼손 증권 재교부와 계약 연장 시 증권 기재로 갈음하는 요건을 구분한다.","similarIds":["11-3","8-3","5-4","12-1","9-3","4-3","10-3","2-2","10-2","7-3"]},{"id":"6-14","round":6,"year":2020,"number":14,"subject":"상법(보험편)","stem":"보험사고의 객관적 확정의 효과에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약당시에 보험사고가 이미 발생하였더라도 그 계약은 무효로 하지 않는다."},{"n":"2","text":"보험계약당시에 보험사고가 발생할 수 없는 것이라도 그 계약은 무효로 하지 않는다."},{"n":"3","text":"보험계약당시에 보험사고가 이미 발생하였지만 보험수익자가 이를 알지 못한 때에는 그\n계약은 무효로 하지 않는다."},{"n":"4","text":"보험계약당시에 보험사고가 발생할 수 없는 것이었지만 당사자 쌍방과 피보험자가 그 사\n실을 몰랐다면 그 계약은 무효로 하지 않는다."}],"answers":["4"],"answerLabel":"4번","explanation":"타인의 위임 없이도 타인을 위한 보험계약을 체결할 수 있다. 계약자가 타인에게 손해를 배상한 경우 그 타인의 권리를 해치지 않\n는 범위에서 청구할 수 있다.","similarIds":["10-7","11-4","4-4","8-4","9-4","5-5"]},{"id":"6-15","round":6,"year":2020,"number":15,"subject":"상법(보험편)","stem":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하\n는 자의 권한을 모두 고른 것은?\nㄱ. 보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한\nㄴ. 보험자가 작성한 영수증 교부를 조건으로 보험계약자로부터 보험료를 수령할 수\n있는 권한\nㄷ. 보험계약자로부터 보험계약의 취소의 의사표시를 수령할 수 있는 권한\nㄹ. 보험계약자에게 보험계약의 체결에 관한 의사표시를 할 수 있는 권한","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ\n2020년도 제6회 손해평가사 1차 1교시 A형 ( 18 - 4 )"}],"answers":["1"],"answerLabel":"1번","explanation":"보험대리상이 아닌 중개자는 제한된 권한만 가진다. 증권 전달·영수증을 조건으로 한 보험료 수령은 가능하지만 계약해지 통지\n수령 등은 다르다.","similarIds":["2-3","2-21","10-4","12-4","4-5","11-5","9-5","7-4","8-5","5-6","12-5","8-6","10-8"]},{"id":"6-16","round":6,"year":2020,"number":16,"subject":"상법(보험편)","stem":"임의해지에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 원칙적으로 보험사고가 발생하기 전에는 언제든지 계약의 전부 또는 일부를\n해지할 수 있다."},{"n":"2","text":"보험사고가 발생하기 전이라도 타인을 위한 보험의 경우에 보험계약자는 그 타인의 동의\n를 얻지 못하거나 보험증권을 소지하지 않은 경우에는 계약의 전부 또는 일부를 해지할\n수 없다."},{"n":"3","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니하는\n보험의 경우에는 보험계약자는 그 사고발생후에도 보험계약을 해지할 수 없다."},{"n":"4","text":"보험사고 발생 전에 보험계약자가 계약을 해지하는 경우, 당사자 사이의 특약으로 미경과\n보험료의 반환을 제한할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"보험계약자는 사고 발생 전 원칙적으로 해지할 수 있다. 보험금 지급 후에도 보험금액이 감액되지 않는 계약의 해지 가능성을 따\n진다.","similarIds":["3-7","2-4","7-5","12-6","10-7","5-7","4-9","11-4","9-4","9-6","11-6","3-11","10-5","9-16"]},{"id":"6-17","round":6,"year":2020,"number":17,"subject":"상법(보험편)","stem":"보험계약자 甲은 보험자 乙과 손해보험계약을 체결하면서 계약에 관한 사항을 고지하지\n않았다. 이에 대한 보험자 乙의 상법상 계약해지권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"甲의 고지의무위반 사실에 대한 乙의 계약해지권은 계약체결일로부터 최대 1년 내에 한하여\n행사할 수 있다."},{"n":"2","text":"乙은 甲의 중과실을 이유로 상법상 보험계약해지권을 행사할 수 없다."},{"n":"3","text":"乙의 계약해지권은 甲이 고지의무를 위반했다는 사실을 계약당시에 乙이 알 수 있었는지\n여부와 상관없이 행사할 수 있다."},{"n":"4","text":"甲이 고지하지 않은 사실이 계약과 관련하여 중요하지 않은 것이라면 乙은 상법상 고지\n의무위반을 이유로 보험계약을 해지할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"중요사항의 고지의무 위반에 한해 보험자가 해지할 수 있다. 보험자가 이미 알았거나 중대한 과실로 몰랐던 경우 등 법정 제한 도\n적용된다.","similarIds":["5-8","1-8","11-9","7-7"]},{"id":"6-18","round":6,"year":2020,"number":18,"subject":"상법(보험편)","stem":"보험계약자 甲은 보험자 乙과 보험계약을 체결하면서 일정한 보험료를 매월 균등하게\n10년간 지급하기로 약정하였다. 이에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"甲은 약정한 최초의 보험료를 계약체결 후 지체없이 납부하여야 한다."},{"n":"2","text":"甲이 계약이 성립한 후에 2월이 경과하도록 최초의 보험료를 지급하지 아니하면, 그 계약\n은 법률에 의거해 효력을 상실한다. 이에 관한 당사자 간의 특약은 계약의 효력에 영향을\n미치지 않는다."},{"n":"3","text":"甲이 계속보험료를 약정한 시기에 지급하지 아니하여 乙이 보험계약을 해지하려면 상당한\n기간을 정하여 甲에게 최고하여야 한다."},{"n":"4","text":"甲이 계속보험료를 지급하지 않아서 乙이 계약해지권을 적법하게 행사하였더라도 해지환\n급금이 지급되지 않았다면 甲은 일정한 기간 내에 연체보험료에 약정이자를 붙여 乙에게\n지급하고 그 계약의 부활을 청구할 수 있다.\n2020년도 제6회 손해평가사 1차 1교시 A형 ( 18 - 5 )"}],"answers":["2"],"answerLabel":"2번","explanation":"최초보험료 미납과 계속보험료 연체는 효과가 다르다. 계속보험료 연체 시 최고 절차가 필요하고 해지 후 일정 요건에서 부활 을\n청구할 수 있다.","similarIds":["7-6","12-7","4-9","2-5","11-7","9-6"]},{"id":"6-19","round":6,"year":2020,"number":19,"subject":"상법(보험편)","stem":"위험변경증가와 계약해지에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 위험변경증가의 통지를 해태한 때에는 보험자는 그 사실을 안 날부터 1월내에\n보험료의 증액을 청구하거나 계약을 해지할 수 있다.\nㄴ. 보험계약자 등의 고의나 중과실로 인하여 위험이 현저하게 변경 또는 증가된 때\n에는 보험자는 그 사실을 안 날부터 1월내에 보험료의 증액을 청구하거나 계약\n을 해지할 수 있다.\nㄷ. 보험사고가 발생한 후라도 보험사가 위험변경증가에 따라 계약을 해지하였을 때\n에는 보험금을 지급할 책임이 없고 이미 지급한 보험금의 반환을 청구할 수 있\n다. 다만, 위험이 현저하게 변경되거나 증가된 사실이 보험사고 발생에 영향을\n미치지 아니하였음이 증명된 경우에는 보험금을 지급할 책임이 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["3"],"answerLabel":"3번","explanation":"현저한 위험변경·증가 시 통지의무와 보험자의 증액청구·해지권이 문제된다. 고의·중과실, 통지 지체, 사고와 위험증가의 인과관\n계를 나눠 판단한다.","similarIds":["4-10","11-10","10-9","3-11","3-10","9-15","7-11","7-9","7-10","2-14","1-9","8-10","12-9","10-10"]},{"id":"6-20","round":6,"year":2020,"number":20,"subject":"상법(보험편)","stem":"다음은 중복보험에 관한 설명이다. ( )에 들어갈 용어로 옳은 것은?\n동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이 동시에 또는\n순차로 체결된 경우에 그 ( ㄱ )의 총액이 ( ㄴ )을 초과한 때에는 보험자는 각자의\n( ㄷ )의 한도에서 연대책임을 진다.","options":[{"n":"1","text":"ㄱ: 보험금액, ㄴ: 보험가액, ㄷ: 보험금액"},{"n":"2","text":"ㄱ: 보험금액, ㄴ: 보험가액, ㄷ: 보험가액"},{"n":"3","text":"ㄱ: 보험료, ㄴ: 보험가액, ㄷ: 보험금액"},{"n":"4","text":"ㄱ: 보험료, ㄴ: 보험금액, ㄷ: 보험금액"}],"answers":["1"],"answerLabel":"1번","explanation":"동일 목적·사고의 보험금액 합계가 보험가액을 넘으면 중복보험이다. 각 보험자는 보험금액 한도에서 연대책임을 지며 내부 분\n담은 별도 산식에 따른다.","similarIds":["5-19","5-18","4-19","9-18","8-24"]},{"id":"6-21","round":6,"year":2020,"number":21,"subject":"상법(보험편)","stem":"청구권에 관한 소멸시효 기간으로 옳지 않은 것은?","options":[{"n":"1","text":"보험금청구권: 3년"},{"n":"2","text":"보험료청구권: 3년"},{"n":"3","text":"적립금반환청구권: 3년"},{"n":"4","text":"보험료반환청구권: 3년"}],"answers":["2"],"answerLabel":"2번","explanation":"보험료청구권은 보험금청구권 등과 시효기간이 다르며 상법상 2년이다. 3년으로 본 선택지가 틀린다.","similarIds":["9-9","2-15","12-11","5-10"]},{"id":"6-22","round":6,"year":2020,"number":22,"subject":"상법(보험편)","stem":"손해보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 보험사고로 인하여 생길 보험계약자의 재산상의 손해를 보상할 책임이 있다."},{"n":"2","text":"금전으로 산정할 수 있는 이익에 한하여 보험계약의 목적으로 할 수 있다."},{"n":"3","text":"보험계약의 목적은 상법 보험편 손해보험 장에서 규정하고 있으나 인보험 장에서는 그러\n하지 아니하다."},{"n":"4","text":"중복보험의 경우에 보험자 1인에 대한 권리의 포기는 다른 보험자의 권리의무에 영향을\n미치지 아니한다.\n2020년도 제6회 손해평가사 1차 1교시 A형 ( 18 - 6 )"}],"answers":["1"],"answerLabel":"1번","explanation":"손해보험은 피보험자의 재산상 손해를 보상하며 금전으로 산정할 수 있는 이익을 목적으로 한다. 반드시 계약자 소유 재산일 필\n요는 없다.","similarIds":["9-17","7-17","10-18","4-19","9-18"]},{"id":"6-23","round":6,"year":2020,"number":23,"subject":"상법(보험편)","stem":"손해보험증권의 법정기재사항이 아닌 것은?","options":[{"n":"1","text":"보험의 목적"},{"n":"2","text":"보험금액"},{"n":"3","text":"보험료의 산출방법"},{"n":"4","text":"무효와 실권의 사유"}],"answers":["3"],"answerLabel":"3번","explanation":"보험목적·보험금액·보험료·기간 등 법정사항을 기재한다. 보험료 산출방법은 법정 기재사항과 구분한다.","similarIds":["2-19"]},{"id":"6-24","round":6,"year":2020,"number":24,"subject":"상법(보험편)","stem":"초과보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험금액이 보험계약의 목적의 가액을 현저하게 초과한 경우에 성립한다."},{"n":"2","text":"보험가액이 보험기간 중 현저하게 감소된 때에도 초과보험에 관한 규정이 적용된다."},{"n":"3","text":"보험계약자 또는 보험자는 보험료와 보험금액의 감액을 청구할 수 있으나 보험료의 감액\n은 장래에 대하여서만 그 효력이 있다."},{"n":"4 ":7,"subject":"상법(보험편)","stem":"고지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"고지의무를 부담하는 자는 보험계약상의 보험계약자 또는 보험수익자이다."},{"n":"2","text":"보험계약자가 고의로 중요한 사항을 고지하지 아니한 경우, 보험자는 계약 체결일로\n부터 1월이 된 시점에는 계약을 해지할 수 있다."},{"n":"3","text":"보험자가 계약당시에 보험계약자의 고지의무위반 사실을 알았을 때에는 계약을 해지\n할 수 없다."},{"n":"4","text":"보험계약자가 중대한 과실로 중요한 사항을 고지하지 아니한 경우, 보험자는 계약\n체결일로부터 5년이 경과한 시점에는 계약을 해지할 수 없다.\n2021년도 제7회 손해평가사 1차 1교시 A형 ( 18 - 2 )"}],"answers":["1"],"answerLabel":"1번","explanation":"고지의무자는 계약자와 피보험자이고 보험수익자는 당연한 의무자가 아니다. 위반을 안 날부터 1개월, 계약 체결일부터 3년이\n해지권 행사기간이며 보험자가 이미 알았으면 해지할 수 없다.","similarIds":["11-9","5-8","8-9","4-7","12-8","9-8","3-9","12-6","6-17","1-13","5-9","1-8"]},{"id":"7-8","round":7,"year":2021,"number":8,"subject":"상법(보험편)","stem":"보험약관에 관한 설명으로 옳은 것을 모두 고른 것은? (다툼이 있으면 판례에 따름)\nㄱ. 보통보험약관이 계약당사자에 대하여 구속력을 가지는 것은 보험계약 당사자\n사이에서 계약내용에 포함시키기로 합의하였기 때문이다.\nㄴ. 보험자가 약관의 교부ㆍ설명 의무를 위반한 경우에 보험계약이 성립한 날부터\n3개월 이내에는 피보험자 또는 보험수익자도 그 계약을 해지할 수 있다.\nㄷ. 약관의 내용이 이미 법령에 의하여 정하여진 것을 되풀이 하는 정도에 불과한\n경우, 보험자는 고객에게 이를 따로 설명하지 않아도 된다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"ㄱ·ㄷ이 옳다. 약관은 계약에 편입하기로 한 합의에 따라 구속력을 가지며, 법령을 되풀이하는 내용은 별도 설명 대상에서 제외\n될 수 있다. 교부·설명의무 위반 시 취소권자는 보험계약자이다.","similarIds":["5-2","4-2","2-16","3-3"]},{"id":"7-9","round":7,"year":2021,"number":9,"subject":"상법(보험편)","stem":"위험변경증가의 통지와 계약해지에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험기간 중에 피보험자가 사고발생의 위험이 현저하게 변경 또는 증가된 사실을 안\n때에는 지체없이 보험자에게 통지하여야 한다."},{"n":"2","text":"보험계약체결 직전에 보험계약자가 사고발생의 위험이 변경 또는 증가된 사실을 안\n때에는 지체없이 보험자에게 통지하여야 한다."},{"n":"3","text":"보험기간 중에 위험변경증가의 통지를 받은 때에는 보험자는 3개월 내에 보험료의\n증액을 청구할 수 있다."},{"n":"4","text":"보험기간 중에 위험변경증가의 통지를 받은 때에는 보험자는 3개월 내에 계약을 해지\n할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"위험변경 증가 사실을 안 계약자 또는 피보험자는 보험자에게 지체 없이 통지해야 한다. 보험자가 통지를 받은 후 해지권 행사\n기간은 1개월이다.","similarIds":["4-10","2-14","3-10","11-10","9-15","10-9","6-19","1-9","7-10","4-6","12-9","8-10","10-10","5-9","11-11","7-12"]},{"id":"7-10","round":7,"year":2021,"number":10,"subject":"상법(보험편)","stem":"보험계약자 등의 고의나 중과실로 인한 위험증가와 계약해지에 관한 설명으로 옳지\n않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험기간 중에 보험계약자의 중대한 과실로 인하여 사고발생의 위험이 현저하게 증가\n된 때에는 보험자는 그 사실을 안 날부터 1월내에 보험료의 증액을 청구할 수 있다."},{"n":"2","text":"위험의 현저한 변경이나 증가된 사실과 보험사고 발생과의 사이에 인과관계가 부존재\n한다는 점에 관한 주장ㆍ입증책임은 보험자 측에 있다."},{"n":"3","text":"보험기간 중에 피보험자의 고의로 인하여 사고발생의 위험이 현저하게 증가된 때에는\n보험자는 그 사실을 안 날부터 1월내에 계약을 해지할 수 있다."},{"n":"4","text":"사고 발생의 위험이 현저하게 변경 또는 증가된 사실이라 함은 그 변경 또는 증가된\n위험이 보험계약의 체결 당시에 존재하고 있었다면 보험자가 보험계약을 체결하지 않\n았거나 적어도 그 보험료로는 보험을 인수하지 않았을 것으로 인정되는 정도의 것을\n말한다.\n2021년도 제7회 손해평가사 1차 1교시 A형 ( 18 - 3 )"}],"answers":["2"],"answerLabel":"2번","explanation":"보험계약자 또는 피보험자의 고의·중과실로 위험이 현저히 증가하면 보험자는 1개월 내 해지 또는 보험료 증액을 청구할 수 있\n다. 인과관계 부존재의 입증은 보험자 측 책임이다.","similarIds":["3-10","11-10","9-15","10-9","12-9","6-19","7-9","4-10","8-10","2-14","5-9","8-11","4-6"]},{"id":"7-11","round":7,"year":2021,"number":11,"subject":"상법(보험편)","stem":"보험자의 계약해지와 보험금청구권에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험사고 발생 후라도 보험계약자의 계속보험료 지급지체를 이유로 보험자가\n계약을 해지하였을 때에는 보험금을 지급할 책임이 있다.\nㄴ. 보험사고 발생 후에 보험계약자가 고지의무를 위반한 사실이 보험사고 발\n생에 영향을 미치지 아니하였음이 증명된 경우에는 보험자는 보험금을 지\n급할 책임이 있다.\nㄷ. 보험수익자의 중과실로 인하여 사고발생의 위험이 현저하게 변경되거나 증\n가된 사실이 보험사고 발생에 영향을 미치지 아니하였음이 증명된 경우에는\n보험자는 보험금을 지급할 책임이 있다.","options":[{"n":"1","text":"ㄷ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["3"],"answerLabel":"3번","explanation":"ㄴ만 옳다. 고지의무 위반이 사고 발생에 영향을 주지 않았음이 증명되면 보험자는 보상책임을 진다. 계속보험료 연체에 따른\n적법한 해지 후에는 책임이 없고, 위험변경 통지의무자도 수익자가 아니라 계약자·피보험자이다.","similarIds":["3-11","6-19","12-8","1-8","10-11","9-8","2-18","11-12","12-10","10-10"]},{"id":"7-12","round":7,"year":2021,"number":12,"subject":"상법(보험편)","stem":"보험사고발생의 통지의무에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"상법은 보험사고발생의 통지의무위반 시 보험자의 계약해지권을 규정하고 있다."},{"n":"2","text":"보험계약자는 보험사고의 발생을 안 때에는 상당한 기간 내에 보험자에게 그 통지를\n발송하여야 한다."},{"n":"3","text":"피보험자가 보험사고발생의 통지의무를 해태함으로 인하여 손해가 증가된 때에는\n보험자는 그 증가된 손해를 보상할 책임이 없다."},{"n":"4","text":"보험수익자는 보험사고발생의 통지의무자에 포함되지 않는다."}],"answers":["3"],"answerLabel":"3번","explanation":"사고를 안 계약자·피보험자·보험수익자는 지체 없이 통지해야 한다. 통지 지연으로 손해가 증가한 부분은 보험자가 보상하지 않\n을 수 있으나, 상법상 통지의무 위반만으로 계약을 해지하는 규정은 없다.","similarIds":["4-11","11-11","9-16","2-14","12-10","2-18","9-15","10-10","7-9","4-10"]},{"id":"7-13","round":7,"year":2021,"number":13,"subject":"상법(보험편)","stem":"손해보험에 관한 설명으로 옳지 않은 것은? (단, 다른 약정이 없음을 전제로 함)","options":[{"n":"1","text":"보험사고로 인하여 상실된 피보험자가 얻을 보수는 보험자가 보상할 손해액에 산입\n하여야 한다."},{"n":"2","text":"보험계약은 금전으로 산정할 수 있는 이익에 한하여 보험계약의 목적으로 할 수 있다."},{"n":"3","text":"무효와 실권의 사유는 손해보험증권의 기재사항이다."},{"n":"4","text":"당사자간에 보험가액을 정하지 아니한 때에는 사고발생시의 가액을 보험가액으로 한다.\n2021년도 제7회 손해평가사 1차 1교시 A형 ( 18 - 4 )"}],"answers":["1"],"answerLabel":"1번","explanation":"상실된 피보험자의 보수는 별도 약정이 있을 때 손해액에 산입할 수 있다. 보험목적은 금전으로 산정할 수 있는 이익이며, 약정\n없으면 사고 당시 가액을 보험가액으로 한다.","similarIds":["8-15","12-15","9-17","10-19","10-15","7-20","9-12","5-13","6-25","11-16","5-15"]},{"id":"7-14","round":7,"year":2021,"number":14,"subject":"상법(보험편)","stem":"보험금액의 지급에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험금액의 지급에 관하여 약정기간이 있는 경우, 보험자는 그 기간 내에 보험금액을\n지급하여야 한다."},{"n":"2","text":"보험금액의 지급에 관하여 약정기간이 없는 경우, 보험자는 보험사고발생의 통지를\n받은 후 지체없이 지급할 보험금액을 정하여야 한다."},{"n":"3","text":"보험금액의 지급에 관하여 약정기간이 없는 경우, 보험금액이 정하여진 날부터 1월내에\n보험수익자에게 보험금액을 지급하여야 한다."},{"n":"4","text":"보험계약자의 동의없이 보험자와 피보험자 사이에 한 보험금 지급기한 유예의 합의\n는 유효하다."}],"answers":["3"],"answerLabel":"3번","explanation":"지급기한 약정이 없으면 보험자는 사고 통지를 받은 후 지체 없이 보험금을 정하고, 보험금액 확정일로부터 10일 내 지급한다.\n보험계약자의 동의 없는 지급기한 유예 합의는 피보험자에게 불리하면 효력이 문제된다.","similarIds":["9-13","3-12","12-10","10-11","2-18","4-12","8-12","11-12","5-9","1-11"]},{"id":"7-15","round":7,"year":2021,"number":15,"subject":"상법(보험편)","stem":"상법 제662조(소멸시효)에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험금청구권은 2년간 행사하지 아니하면 시효의 완성으로 소멸한다."},{"n":"2","text":"보험료의 반환청구권은 3년간 행사하지 아니하면 시효의 완성 umber":19,"subject":"상법(보험편)","stem":"일부보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"계약체결의 시점에 의도적으로 보험가액보다 낮게 보험금액을 약정하는 것은 허용되지\n않는다."},{"n":"2","text":"일부보험에 관한 상법의 규정은 강행규정이다."},{"n":"3","text":"일부보험의 경우에는 잔존물 대위가 인정되지 않는다."},{"n":"4","text":"일부보험에 있어서 일부손해가 발생하여 비례보상원칙을 적용하면 손해액은 보상액보다\n크다."}],"answers":["4"],"answerLabel":"4번","explanation":"일부보험은 보험금액/보험가액 비율로 비례보상한다. 보험금액을 보험가액보다 낮게 정할 수 있고, 일부보험에도 잔존물대위\n가 인정될 수 있다.","similarIds":["2-20","3-23"]},{"id":"7-20","round":7,"year":2021,"number":20,"subject":"상법(보험편)","stem":"손해액 산정에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험사고로 인하여 상실된 피보험자가 얻을 이익은 당사자간에 다른 약정이 없으면\n보험자가 보상할 손해액에 산입하지 아니한다."},{"n":"2","text":"당사자간에 다른 약정이 있는 때에는 신품가액에 의하여 보험자가 보상할 손해액을\n산정할 수 있다."},{"n":"3","text":"손해액 산정에 필요한 비용은 보험자와 보험계약자 및 보험수익자가 공동으로 부담한다."},{"n":"4","text":"손해보상은 원칙적으로 금전으로 하지만 당사자의 합의로 손해의 전부 또는 일부를\n현물로 보상할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"손해액 산정비용은 보험자가 부담한다. 상실된 이익의 보상은 특약으로 가능하고, 신품가액 약정 및 현물보상 합의도 가능하다.","similarIds":["4-21","6-4","10-19","2-22","1-19","9-20","3-25","5-20","12-19","8-15","8-21","2-12","7-13","9-17"]},{"id":"7-21","round":7,"year":2021,"number":21,"subject":"상법(보험편)","stem":"손해보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있으면 그 지급\n기일이 도래하지 아니한 때라도 보상할 금액에서 이를 공제할 수 있다."},{"n":"2","text":"보험계약자가 손해의 방지와 경감을 위하여 필요 또는 유익하였던 비용과 보상액이\n보험금액을 초과한 경우에는 보험자는 보험금액의 한도내에서 이를 부담한다."},{"n":"3","text":"보험의 목적에 관하여 보험자가 부담할 손해가 생긴 경우에는 그 후 그 목적이 보험\n자가 부담하지 아니하는 보험사고의 발생으로 인하여 멸실된 때에도 보험자는 이미\n생긴 손해를 보상할 책임을 면하지 못한다."},{"n":"4","text":"보험의 목적의 자연소모로 인한 손해는 보험자가 이를 보상할 책임이 없다.\n2021년도 제7회 손해평가사 1차 1교시 A형 ( 18 - 6 )"}],"answers":["2"],"answerLabel":"2번","explanation":"손해방지비용과 보상액 합계가 보험금액을 넘더라도 손해방지비용에는 보험금액 한도가 그대로 적용되지 않는 특례가 있다.\n나머지 문장은 상법 원칙에 부합한다.\n2021 제7회 손해평가사 1차 | 최종정답 대조 2","similarIds":["12-18","10-18","5-20","5-24","8-20","4-23","8-21","2-10","10-20","6-5","4-21","1-21","2-24","10-11"]},{"id":"7-22","round":7,"year":2021,"number":22,"subject":"상법(보험편)","stem":"보험대위에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"손해가 제3자의 행위로 인하여 발생한 경우에 보험금을 지급하기 전이라도 보험자는\n그 제3자에 대한 보험계약자의 권리를 취득한다."},{"n":"2","text":"잔존물대위가 성립하기 위해서는 보험목적의 전부가 멸실하여야 한다."},{"n":"3","text":"잔존물에 대한 권리가 보험자에게 이전되는 시점은 보험자가 보험금액을 전부 지급하고,\n물권변동 절차를 마무리한 때이다."},{"n":"4","text":"재보험에 대하여는 제3자에 대한 보험자대위가 적용되지 않는다."}],"answers":["2"],"answerLabel":"2번","explanation":"제3자 대위는 보험금 지급 후 지급액 한도에서 취득한다. 잔존물대위는 보험목적 전부 멸실 시 보험가액 전부를 지급한 경우에\n성립한다. 재보험은 대위 적용이 배제된다.","similarIds":["6-7","11-21","5-23","8-25","12-22","10-22","11-22","1-23"]},{"id":"7-23","round":7,"year":2021,"number":23,"subject":"상법(보험편)","stem":"화재보험에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"화재가 발생한 건물을 수리하면서 지출한 철거비와 폐기물처리비는 화재와 상당인과\n관계가 있는 건물수리비에는 포함되지 않는다."},{"n":"2","text":"피보험자가 화재 진화를 위해 살포한 물로 보험목적이 훼손된 손해는 보상하지 않는다."},{"n":"3","text":"불에 탈 수 있는 목조교량은 화재보험의 목적이 될 수 없다."},{"n":"4","text":"보험자가 손해를 보상함에 있어서 화재와 손해 간에 상당인과관계가 필요하다."}],"answers":["4"],"answerLabel":"4번","explanation":"화재로 인한 손해에는 화재와 손해 사이의 상당인과관계가 필요하다. 소방·손해경감 과정에서 생긴 손해도 보상 대상이 될 수\n있고, 가연성 물건도 보험목적이 될 수 있다.","similarIds":["12-23","6-8","1-25"]},{"id":"7-24","round":7,"year":2021,"number":24,"subject":"상법(보험편)","stem":"건물을 화재보험의 목적으로 한 경우 화재보험증권의 법정기재사항이 아닌 것은?","options":[{"n":"1","text":"건물의 소재지, 구조와 용도"},{"n":"2","text":"보험가액을 정한 때에는 그 가액"},{"n":"3","text":"보험기간을 정한 때에는 그 시기와 종기"},{"n":"4","text":"설계감리법인의 주소와 성명 또는 상호"}],"answers":["4"],"answerLabel":"4번","explanation":"화재보험증권의 법정기재사항에 건물 소재지·구조·용도, 보험가액, 보험기간 등이 포함되나 설계감리법인의 주소·성명은 포함되\n지 않는다.","similarIds":["12-24","5-25","11-25","6-9"]},{"id":"7-25","round":7,"year":2021,"number":25,"subject":"상법(보험편)","stem":"집합보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"피보험자의 가족의 물건은 보험의 목적에 포함되지 않는 것으로 한다."},{"n":"2","text":"피보험자의 사용인의 물건은 보험의 목적에 포함되지 않는 것으로 한다."},{"n":"3","text":"보험의 목적에 속한 물건이 보험기간중에 수시로 교체된 경우에는 보험사고의 발생\n시에 현존한 물건이라도 보험의 목적에 포함되지 않는 것으로 한다."},{"n":"4","text":"집합보험이란 경제적으로 독립한 여러 물건의 집합물을 보 "round":8,"year":2022,"number":2,"subject":"상법(보험편)","stem":"甲보험회사의 화재보험 약관에는 보험계약자에게 설명해야 하는 중요한 내용을\n포함하고 있으나 甲회사가 이를 설명하지 않고 보험계약을 체결하였다. 이에 관한\n설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험계약이 성립한 날로부터 1개월이 된 시점이라면 보험계약자는 보험계약을 취소할\n수 있다."},{"n":"2","text":"甲보험회사는 화재보험약관을 보험계약자에게 교부해야 한다."},{"n":"3","text":"보험계약이 성립한 날로부터 4개월이 된 시점이라면 보험계약자는 보험계약을 취소할\n수 없다."},{"n":"4","text":"보험계약자가 보험계약을 취소하지 않았다면 甲보험회사는 중요한 약관조항을 계약의\n내용으로 주장할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"해설: 중요 약관을 설명하지 않으면 그 조항은 계약 내용으로 주장할 수 없다. 설명의무 위반 취소기간과 약관 교부의무를 구별\n한다.","similarIds":["2-16","5-2"]},{"id":"8-3","round":8,"year":2022,"number":3,"subject":"상법(보험편)","stem":"상법상 보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 보험증권을 멸실한 경우에는 보험자에 대하여 증권의 재교부를 청구할\n수 있으며, 그 증권 작성의 비용은 보험계약자가 부담한다."},{"n":"2","text":"기존의 보험계약을 변경한 경우 보험자는 그 보험증권에 그 사실을 기재함으로써\n보험증권의 교부에 갈음할 수 없다."},{"n":"3","text":"타인을 위한 보험계약이 성립된 경우에는 보험자는 그 타인에게 보험증권을 교부해야\n한다."},{"n":"4","text":"보험계약자가 최초의 보험료를 지급하지 아니한 경우에도 보험계약이 성립한 때에는\n보험자는 지체없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다.\n2022년도 제8회 손해평가사 1차 1교시 A형 ( 18 - 1 )"}],"answers":["1"],"answerLabel":"1번","explanation":"해설: 보험증권을 멸실한 경우 재교부를 청구할 수 있고 작성 비용은 청구자가 부담한다. 기존 계약 변경은 증권 기재로 교부를\n갈음할 수 있다.","similarIds":["11-3","9-3","5-4","10-3","6-13","2-2","12-1","4-3","10-2","12-3","7-3","12-6"]},{"id":"8-4","round":8,"year":2022,"number":4,"subject":"상법(보험편)","stem":"타인을 위한 손해보험계약(보험회사 A, 보험계약자 B, 타인 C)에서 보험사고의\n객관적 확정이 있는 경우 그 보험계약의 효력에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 당시에 보험사고가 이미 발생하였음을 B가 알고서 보험계약을 체결하였다면\n그 계약은 무효이다."},{"n":"2","text":"보험계약 당시에 보험사고가 이미 발생하였음을 A와 B가 알았을지라도 C가 알지\n못했다면 그 계약은 유효하다."},{"n":"3","text":"보험계약 당시에 보험사고가 발생할 수 없음을 A가 알면서도 보험계약을 체결하였다면\n그 계약은 무효이다."},{"n":"4","text":"보험계약 당시에 보험사고가 발생할 수 없음을 A, B, C가 알지 못한 때에는 그 계약은\n유효하다."}],"answers":["2"],"answerLabel":"2번","explanation":"해설: 보험사고 발생이 객관적으로 확정되어도 보험계약 당사자(보험자·보험계약자)가 이를 알지 못한 경우 계약 효력은 계약당\n사자의 인식 여부에 따라 판단한다. 타인을 위한 계약에서 수익자의 선의만으로 ,"subject":"재배학·원예작물학","stem":"화훼작물에 있어 진균에 의한 병이 아닌 것은?","options":[{"n":"1","text":"잘록병"},{"n":"2","text":"역병"},{"n":"3","text":"잿빛곰팡이병"},{"n":"4","text":"무름병"}],"answers":["4"],"answerLabel":"4번","explanation":"해설: 잘록병·잿빛곰팡이병·무름병 등은 병원체 종류가 다르다. 화훼에서 무름병은 세균성으로 분류돼 진균병이 아니다.","similarIds":[]},{"id":"8-68","round":8,"year":2022,"number":68,"subject":"재배학·원예작물학","stem":"‘잎들깨’를 생산하는 농가에서 생산량 증대를 위해 야간 인공조명을 설치하였다.\n이 야간 조명으로 인하여 옆 농가에서 피해가 있을 법한 작물은?","options":[{"n":"1","text":"장미"},{"n":"2","text":"칼랑코에"},{"n":"3","text":"페튜니아"},{"n":"4","text":"금잔화"}],"answers":["2"],"answerLabel":"2번","explanation":"해설: 잎들깨의 야간조명은 장일 반응 작물의 개화를 지연시킬 수 있다. 단일성인 국화류가 피해 가능 작물이며 보기의 작물 중\n페튜니아가 해당한다.","similarIds":[]},{"id":"8-69","round":8,"year":2022,"number":69,"subject":"재배학·원예작물학","stem":"오이의 암꽃 수를 증가시킬 수 있는 육묘 관리법은?","options":[{"n":"1","text":"지베렐린 처리"},{"n":"2","text":"질산은 처리"},{"n":"3","text":"저온 단일 조건"},{"n":"4","text":"고온 장일 조건\n2022년도 제8회 손해평가사 1차 1교시 A형 ( 18 - 17 )"}],"answers":["3"],"answerLabel":"3번","explanation":"해설: 오이는 저온·단일 조건에서 암꽃 분화가 촉진된다.","similarIds":[]},{"id":"8-70","round":8,"year":2022,"number":70,"subject":"재배학·원예작물학","stem":"다음의 해충 방제법은?\n친환경농산물을 생산하는 농가가 최근 엽채류에 해충이 발생하여 제충국에서\n살충성분(‘피레트린’)을 추출 및 살포하여 진딧물 해충을 방제하였다.","options":[{"n":"1","text":"화학적 방제법"},{"n":"2","text":"물리적 방제법"},{"n":"3","text":"페로몬 방제법"},{"n":"4","text":"생물적 방제법"}],"answers":["1"],"answerLabel":"1번","explanation":"해설: 제충국에서 얻는 피레트린은 식물 유래 천연 살충성분으로, 문제의 분류에서는 생물적 방제에 해당한다.","similarIds":[]},{"id":"8-71","round":8,"year":2022,"number":71,"subject":"재배학·원예작물학","stem":"다음이 설명하는 과수의 병은?\n○ 기공이나 상처 및 표피를 뚫고 작물 내 침입\n○ 일정 기간 또는 일생을 기생하면서 병 유발\n○ 시들음, 부패 등의 병징 발견","options":[{"n":"1","text":"포도 근두암종병"},{"n":"2","text":"사과 탄저병"},{"n":"3","text":"감귤 궤양병"},{"n":"4","text":"대추나무 빗자루병"}],"answers":["2"],"answerLabel":"2번","explanation":"해설: 과실 침입·기생으로 시들음·부패를 일으키는 대표 병은 사과 탄저병이다.","similarIds":[]},{"id":"8-72","round":8,"year":2022,"number":72,"subject":"재배학·원예작물학","stem":"과수의 결실에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"타가수분을 위해 수분수는 20% 내외로 혼식한다."},{"n":"2","text":"탄질비(C/N ratio)가 높을수록 결실률이 높아진다."},{"n":"3","text":"꽃가루관의 신장은 저온조건에서 빨라지므로 착과율이 높아진다."},{"n":"4","text":"엽과비(leaf/fruit ratio)가 높을수록 과실의 크기가 커진다."}],"answers":["3"],"answerLabel":"3번","explanation":"해설: 저온은 꽃가루관 신장을 늦추므로 저온에서 빨라진다는 ③이 틀렸다. 수분수·C/N·엽과비 관련 나머지 설명을 함께 검토한\n다.","similarIds":[]},{"id":"8-73","round":8,"year":2022,"number":73,"subject":"재배학·원예작물학","stem":"종자춘화형에 속하는 작물은?","options":[{"n":"1","text":"양파, 당근"},{"n":"2","text":"당근, 배추"},{"n":"3","text":"양파, 무"},{"n":"4","text":"배추, 무"}],"answers":["4"],"answerLabel":"4번","explanation":"해설: 양파·당근은 저온을 받아 화아분화하는 종자춘화형 작물이다.","similarIds":[]},{"id":"8-74","round":8,"year":2022,"number":74,"subject":"재배학·원예작물학","stem":"A농가가 선택한 피복재는?\nA농가는 재배시설의 피복재에 물방울이 맺혀 광투과율의 저하와 병해 발생이\n증가하였다. 그래서 계면활성제가 처리된 필름을 선택하여 필름의 표면장력을\n낮춤으로써 물방울의 맺힘 문제를 해결하였다.","options":[{"n":"1","text":"광파장변환 필름"},{"n":"2","text":"폴리에틸렌 필름"},{"n":"3","text":"해충기피 필름"},{"n":"4","text":"무적 필름"}],"answers":["4"],"answerLabel":"4번","explanation":"해설: 계면활성 처리로 물방울이 퍼져 투광 저하를 막는 필름은 무적필름이다.","similarIds":[]},{"id":"8-75","round":8,"year":2022,"number":75,"subject":"재배학·원예작물학","stem":"다음이 설명하는 재배법은?\n○ 양액재배 베드를 허리높이까지 설치\n○ 딸기 ‘설향’ 재배에 널리 활용\n○ 재배 농가의 노동환경 개선 및 청정재배사 관리","options":[{"n":"1","text":"고설 재배"},{"n":"2","text":"토경 재배"},{"n":"3","text":"고랭지 재배"},{"n":"4","text":"NFT 재배\n2022년도 제8회 손해평가사 1차 1교시 A형 ( 18 - 18 )"}],"answers":["1"],"answerLabel":"1번","explanation":"해설: 허리 높이 베드에서 딸기를 재배하는 고설재배는 작업 자세와 청정 관리에 유리하다.\n2022 제8회 손해평가사 1차 | A형 최종정답 기준 4\n정정 및 보충 설명 (본문 해설보다 우선)\n정답 번호는 원본 최종정답표를 따릅니다. 다음 본문 해설의 일부 문장은 정답과 불일치하여 아래와 같이 바로잡습니다.\n문제 22 보험자 면책사유\n손해보험의 목적의 성질·하자·자연소모로 생긴 손해와 보험계약자·피보험자 등의 고의 또는 중대한 과실로 발생한 사고는 이\n문항의 법정 면책사유에 해당합니다. 따라서 ㄱ·ㄴ·ㄷ·ㄹ 모두이며 정답 ④입니다. 본문에서 중대한 과실을 면책이 아니라고 한\n설명은 정정합니다.\n문제 31 압류금지 보험금액\n재생산에 직접 소요되는 비용을 보장하는 전용계좌 입금 보험금은 전액, 그 밖의 목적 보험금은 3분의 2가 압류금지액입니다.\n정답 ④(ㄱ 전액, ㄴ 3분의 2)입니다. 본문 해설의 3분의 1 표기는 오기입니다.\n문제 38 무자격 명의사용·자격증 대여\n최종정답표의 정답 "2-11","1-24"]},{"id":"9-20","round":9,"year":2023,"number":20,"subject":"상법(보험편)","stem":"상법상 손해보험에서 손해액의 산정기준 등에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액의 산정에 관한 비용은 보험자의 부담으로 한다."},{"n":"2","text":"당사자간에 다른 약정이 없는 경우 보험자가 보상할 손해액은 그 손해가 발생한 때의\n보험계약 체결지의 가액에 의하여 산정한다."},{"n":"3","text":"당사자간의 약정에 의하여 보험의 목적의 신품가액에 의하여 손해액을 산정할 수 있다."},{"n":"4","text":"보험의 목적의 성질, 하자 또는 자연소모로 인한 손해는 보험자가 이를 보상할 책임이\n없다."}],"answers":["2"],"answerLabel":"2번","explanation":"해설: 손해액은 손해 발생 당시 및 장소의 가액으로 정한다.\n2023 제9회 손해평가사 1차 | A형 최종정답 기준 1","similarIds":["10-19","12-19","3-25","5-20","8-21","1-19","4-21","6-4","2-22","7-20","12-18","8-15","10-18"]},{"id":"9-21","round":9,"year":2023,"number":21,"subject":"상법(보험편)","stem":"甲이 자기 소유 건물에 대하여 A보험회사와 화재보험을 체결한 경우에 관한 설명으로\n옳지 않은 것은?","options":[{"n":"1","text":"A보험회사가 甲으로부터 보험료의 지급을 받지 아니한 잔액이 있더라도 그 지급기일이\n아직 도래하지 아니한 때에는, A보험회사는 甲에게 손해를 보상할 경우에 보상할 금액\n에서 그 잔액을 공제하여서는 아니된다."},{"n":"2","text":"A보험회사는 보험사고로 인하여 부담할 책임에 대하여 다른 보험자와 재보험계약을\n체결할 수 있다."},{"n":"3","text":"甲이 보험의 목적인 건물을 乙에게 양도한 때에는 乙은 보험계약상의 권리와 의무를\n승계한 것으로 추정한다."},{"n":"4","text":"甲이 보험의 목적인 건물을 乙에게 양도한 경우 甲 또는 乙은 A보험회사에 대하여\n지체없이 그 사실을 통지하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"해설: 보험목적 양도 시 계약승계 추정 및 통지의무가 있고 미도래 보험료를 공제할 수 없다.","similarIds":["10-12","10-6"]},{"id":"9-22","round":9,"year":2023,"number":22,"subject":"상법(보험편)","stem":"다음 사례와 관련하여 손해방지의무 등에 관한 설명으로 옳지 않은 것은?\n甲은 乙이 소유한 창고(시가 1억원)에 대하여 A보험회사와 화재보험계약(보험\n금액 1억원)을 체결하였다. 이후 보험기간 중 해당 창고에 화재가 발생하였는데\n화재사고 당시 甲은 창고의 연소로 인한 손해방지를 위한 비용을 1천만원 지출\n하였고, 乙은 창고의 연소로 인한 손해의 경감을 위하여 비용을 3천만원 지출\n하였다.","options":[{"n":"1","text":"甲과 乙 모두 손해의 방지와 경감을 위하여 노력하여야 한다."},{"n":"2","text":"甲이 지출한 1천만원이 손해방지를 위하여 필요하였던 비용일 경우 A보험회사는 甲이\n지출한 1천만원의 비용을 부담한다."},{"n":"3","text":"乙이 지출한 3천만원이 손해경감을 위하여 유익하였던 비용일 경우 A보험회사는 乙이\n지출한 3천만원의 비용을 부담한다."},{"n":"4","text":"위 사고로 인하여 乙에 대한 보상액이 8천만원으로 책정될 경우 A보험회사는 甲 및\n乙이 지출한 비용과 보상액을 합쳐서 1억원의 한도에서 부담한다.\n2023년도 제9회 손해평가사 1차 1교시 A형 ( 18 - 6 )"}],"answers":["4"],"answerLabel":"4번","explanation":"해설: 손해방지비용의 부담은 보험금액 한도와 별도 취급되는 법정 규정이 있다.","similarIds":[]},{"id":"9-23","round":9,"year":2023,"number":23,"subject":"상법(보험편)","stem":"다음 사례와 관련하여 보험자대위에 관한 설명으로 옳은 것은?\n보리 농사를 대규모로 영위하는 甲은 금년에 수확하여 팔고남은 보리를 자신의\n창고에 보관하면서, 해당 보리 재고를 보험목적으로 하고 자신을 피보험자로\n하는 화재보험계약을 A보험회사와 체결하였다. 그런데 甲의 창고를 방문한 乙\n이 화재를 일으켰고 그 결과 위 보리 재고가 전소되었다. 이에 A보험회사는 甲\n에게 보험금을 전액 지급하였다.","options":[{"n":"1","text":"중과실로 화재를 일으킨 乙이 甲의 이웃집 친구일 경우, A보험회사는 乙에게 보험금\n지급사실의 통지를 발송하는 시점에 乙에 대한 甲의 권리를 취득한다."},{"n":"2","text":"경과실로 화재를 일으킨 乙이 甲의 거래처 지인일 경우, A보험회사는 그 지급한 금액의\n한도에서 乙에 대한 甲의 권리를 취득한다."},{"n":"3","text":"중과실로 화재를 일으킨 乙이 甲과 생계를 달리 하는 자녀일 경우, A보험회사는 乙에\n대한 甲의 권리를 취득하지 못한다."},{"n":"4","text":"고의로 방화한 乙이 甲과 생계를 같이 하는 배우자일 경우, A보험회사는 乙에 대한\n甲의 권리를 취득하지 못한다."}],"answers":["2"],"answerLabel":"2번","explanation":"해설: 보험자대위는 보험금 지급에 따라 취득하며 가족의 고의사고는 예외가 될 수 있다.","similarIds":[]},{"id":"9-24","round":9,"year":2023,"number":24,"subject":"상법(보험편)","stem":"상법상 화재보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 화재와 상당인과관계에 있는 손해를 보상하여야 한다."},{"n":"2","text":"보험자는 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해를 보상할\n책임이 있다."},{"n":"3","text":"동일한 건물에 관한 화재보험계약일 경우 그 소유자와 담보권자가 갖는 피보험이익은\n같다."},{"n":"4","text":"연소 작용이 아닌 열의 작용으로 발생한 손해는 보험자가 보상하지 아니한다."}],"answers":["3"],"answerLabel":"3번","explanation":"해설: 건물 소유자와 담보권자의 피보험이익은 서로 다르다.","similarIds":["3-16","12-23","1-25","6-8","2-25","4-22","8-15"]},{"id":"9-25","round":9,"year":2023,"number":25,"subject":"상법(보험편)","stem":"상법상 집합된 물건을 일괄하여 화재보험의 목적으로 한 경우 해당 화재보험에\n관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 집합된 물건에 피보험자의 가족의 물건이 있는 경우 해당 물건도 보험의 목\n적에 포함된 것으로 한다.\nㄴ. 집합된 물건에 피보험자의 사용인의 물건이 있는 경우 그 보험은 그 사용인\n을 위하여서도 체결한 것으로 본다.\nㄷ. 보험의 목적에 속한 물건이 보험기간중에 수시로 교체된 경우 보험계약의\n체결 시에 현존한 물건은 그 보험의 목적에 포함된 것으로 한다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ\n2023년도 제9회 손해평가사 1차 1교시 A형 ( 18 - 7 )\n농어업재해보험법령"}],"answers":["1"],"answerLabel":"1번","explanation":"해설: 집합물 보험의 가족· ","12-5"]},{"id":"10-5","round":10,"year":2024,"number":5,"subject":"상법(보험편)","stem":"상법상 보험료에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에\n보험기간중 그 예기한 위험이 소멸한 때에는 보험계약자는 그 후의 보험료\n의 감액을 청구할 수 있다.\nㄴ. 보험계약의 전부 또는 일부가 무효인 경우에 보험계약자와 피보험자가 선\n의이며 중대한 과실이 없는 때에는 보험자에 대하여 보험료의 전부 또는\n일부의 반환을 청구할 수 있다.\nㄷ. 보험계약자는 계약체결후 지체없이 보험료의 전부 또는 제1회 보험료를 지\n급하여야 하며, 이를 지급하지 아니하는 경우에는 보험자는 다른 약정이 없\n는 한 계약성립후 2월이 경과하면 그 계약을 해제할 수 있다.\nㄹ. 계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 상당한 기\n간을 정하여 보험계약자에게 최고하고 그 기간내에 지급되지 아니한 때에\n는 그 계약은 해지된 것으로 본다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"ㄱ은 특별위험이 소멸하면 장래 보험료 감액을 청구할 수 있다는 내용이고, ㄴ은 선의·무중과실의 경우 무효 부분의 보험료 반환\n을 청구할 수 있다는 내용이다. ㄷ의 해제 가능 시점과 ㄹ의 계속보험료 미지급 효과가 틀린 설명이다.","similarIds":["5-7","7-6","4-9","11-6","2-5","12-5","12-7","4-6","9-6","2-4","11-7","1-6","3-8","1-5","3-7","8-6","9-11","10-16","12-3","6-16","2-6","11-15"]},{"id":"10-6","round":10,"year":2024,"number":6,"subject":"상법(보험편)","stem":"甲이 乙 소유의 농장에 대해 乙의 허락 없이 乙을 피보험자로 하여 A보험회사와\n화재보험계약을 체결한 경우, 그 법률관계에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 체결시 A보험회사가 서면으로 질문한 사항은 중요한 사항으로 추정한다."},{"n":"2","text":"보험사고가 발생하기 전에는 甲은 언제든지 계약의 전부 또는 일부를 해지할 수 있다."},{"n":"3","text":"甲이 乙의 위임이 없음을 A보험회사에게 고지하지 않은 때에는 乙이 그 보험계약이\n체결된 사실을 알지 못하였다는 사유로 A보험회사에게 대항하지 못한다."},{"n":"4","text":"보험계약당시에 甲 또는 乙이 고의 또는 중대한 과실로 인하여 중요한 사항을 고지\n하지 아니하거나 부실의 고지를 한 때에는 A보험회사는 그 사실을 안 날로부터 1월\n내에, 계약을 체결한 날로부터 3년내에 한하여 계약을 해지할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"타인을 위한 보험계약에서 보험계약자는 보험사고 발생 전 계약을 해지할 수 있고, 타인의 위임이 없다는 사실은 보험자에게 고\n지해야 한다. 고지의무 위반 해지기간은 안 날부터 1개월, 계약일부터 3년으로 제시된 선택지가 법정기간과 일치하지 않는다.","similarIds":["10-12","4-7","9-21","12-8"]},{"id":"10-7","round":10,"year":2024,"number":7,"subject":"상법(보험편)","stem":"상법상 보험사고에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약당시에 보험사고가 이미 발생하였거나 또는 발생할 수 없는 것인 때에는 그\n계약은 무효로 한다."},{"n":"2","text":"보험 s":["12-18","7-21","6-6","4-23","5-20","8-20","11-19","8-15","6-22","9-20","12-20"]},{"id":"10-19","round":10,"year":2024,"number":19,"subject":"상법(보험편)","stem":"손해보험에서 손해액의 산정에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액은 보험계약을 체결한 때와 곳의 가액에 의하여 산정한다."},{"n":"2","text":"보험사고로 인하여 상실된 피보험자가 얻을 이익이나 보수는 보험자가 보상할 손해액에\n산입하여야 한다."},{"n":"3","text":"손해액의 산정에 관한 비용은 보험계약자의 부담으로 한다."},{"n":"4","text":"당사자간에 다른 약정이 있는 때에는 그 신품가액에 의하여 손해액을 산정할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"당사자 사이에 약정이 있으면 신품가액 기준으로 손해액을 산정할 수 있다. 기본은 사고 당시 손해액이며, 상실한 장래 이익이나\n보수는 원칙적으로 손해액에 포함하지 않는다.","similarIds":["6-4","12-19","1-19","3-25","2-22","9-20","5-20","7-20","4-21","8-21","8-15","9-17","7-13","5-13","2-12"]},{"id":"10-20","round":10,"year":2024,"number":20,"subject":"상법(보험편)","stem":"보험자가 손해를 보상할 때에 보험료의 지급을 받지 아니한 잔액이 있는 경우에\n관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자는 보험료의 지급을 받지 아니한 잔액이 있으면 보험계약을 즉시 해지할 수 있다."},{"n":"2","text":"보험자는 지급기일이 도래하였으나 지급받지 않은 보험료 잔액을 보상할 금액에서\n공제하여야 한다."},{"n":"3","text":"보험자는 지급받지 않은 보험료 잔액이 있으면 그 지급기일이 도래하지 아니한 때라도\n보상할 금액에서 이를 공제할 수 있다."},{"n":"4","text":"보험자는 지급기일이 도래한 보험료 잔액의 지급이 있을 때까지 그 손해보상을 전부\n거절할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"지급기일이 도래하지 않은 잔여보험료도 상법상 요건에 해당하면 보험자는 보상액에서 공제할 수 있다. 즉 보험료 전액 납부 전\n까지 보상을 모두 거절하는 방식은 아니다.","similarIds":["5-24","6-5","8-21","7-21","2-24"]},{"id":"10-21","round":10,"year":2024,"number":21,"subject":"상법(보험편)","stem":"상법상 손해방지의무에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"손해방지의무는 보험계약자는 부담하지 않고 피보험자만 부담하는 의무이다."},{"n":"2","text":"손해방지의무의 이행을 위하여 필요 또는 유익하였던 비용과 보상액이 보험금액을\n초과한 경우라도 보험자가 이를 부담한다."},{"n":"3","text":"손해방지의무는 보험사고가 발생하기 이전에 부담하는 의무이다."},{"n":"4","text":"손해방지의무의 이행을 위하여 필요 또는 유익하였던 비용은 실제로 손해의 방지와\n경감에 유효하게 영향을 준 경우에만 보험자가 이를 부담한다."}],"answers":["2"],"answerLabel":"2번","explanation":"손해방지의무 이행을 위해 필요하거나 유익한 비용은 그 비용과 보험금 합계가 보험금액을 넘더라도 보험자가 부담한다. 비용이\n실제로 효과를 냈는지만으로 지급 여부를 제한하지 않는다.","similarIds":["12-21","8-23","1-21","5-22","2-10","11-20"]},{"id":"10-22","round":10,"year":2024,"number":22,"subject":"상법(보험편)","stem":"보험목적에 관한 보험대위(잔존물대위)의 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험의 목적의 전부가 멸실한 경우에 보험대위가 인정된다."},{"n":"2","text":"피보험자가 보험자로부터 보험금액의 전부를 지급받은 후에는 잔존물을 임의로 처분할\n수 없다."},{"n":"3","text":"일부보험의 경우에는 잔존물대위가 인정되지 않는다."},{"n":"4","text":"보험자가 보험금액의 전부를 지급한 때 잔존물에 대한 권리는 물권변동절차 없이\n보험자에게 이전된다.\n2024년도 제10회 손해평가사 1차 1교시 A형 ( 18 - 6 )"}],"answers":["3"],"answerLabel":"3번","explanation":"잔존물대위는 보험목적의 전부 멸실 및 보험금 전액 지급 등 법정 요건에서 인정된다. 일부보험이라고 하여 언제나 잔존물대위\n가 배제되는 것은 아니므로 그 선택지가 옳지 않다.","similarIds":["6-7","1-23","11-21","3-24","7-22"]},{"id":"10-23","round":10,"year":2024,"number":23,"subject":"상법(보험편)","stem":"화재보험자가 보상할 손해에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 화재가 발생한 건물의 철거비와 폐기물처리비\nㄴ. 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해\nㄷ. 화재로 인하여 다른 곳에 옮겨놓은 물건의 도난으로 인한 손해","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"화재의 소방 또는 손해 감소 조치로 생긴 손해는 화재보험에서 보상 범위에 포함된다. 철거·폐기물 비용은 약관이나 법정 손해\n범위에 따라 별도 판단되며, 다른 곳으로 옮긴 물건의 도난이 당연히 화재손해가 되는 것은 아니다.","similarIds":["6-8","12-23","3-16"]},{"id":"10-24","round":10,"year":2024,"number":24,"subject":"상법(보험편)","stem":"화재보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"건물을 보험의 목적으로 한 때에는 그 소재지, 구조와 용도를 화재보험증권에 기재\n하여야 한다."},{"n":"2","text":"동산을 보험의 목적으로 한 때에는 그 존치한 장소의 상태와 용도를 화재보험증권에\n기재하여야 한다."},{"n":"3","text":"동일한 건물에 대하여 소유권자와 저당권자는 각각 다른 피보험이익을 가지므로,\n각자는 독립한 화재보험계약을 체결할 수 있다."},{"n":"4","text":"건물을 보험의 목적으로 한 때 그 보험가액의 일부를 보험에 붙인 경우, 당사자간에\n다른 약정이 없다면 보험자는 보험금액의 한도내에서 그 손해를 보상할 책임을 진다."}],"answers":["4"],"answerLabel":"4번","explanation":"건물 보험가액의 일부만 보험에 붙인 일부보험은 당사자 간 다른 약정이 없다면 보험금액 한도 내에서 손해를 비례 보상한다. 전\n액 보상이라고 한 설명이 틀리다.","similarIds":["5-25","12-24","2-25","4-22","6-9","4-25","11-24"]},{"id":"10-25","round":10,"year":2024,"number":25,"subject":"상법(보험편)","stem":"집합보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"집합보험은 집합된 물건을 일괄하여 보험의 s":["4"],"answerLabel":"4번","explanation":"벌마늘은 월동 후 이상고온, 잦은 강우, 일조 부족 등 생육환경 불균형과 관련된다. 흰가루병의 조기 발생은 일반적인 벌마늘 발\n생 원인으로 보기 어렵다.","similarIds":[]},{"id":"10-59","round":10,"year":2024,"number":59,"subject":"재배학·원예작물학","stem":"다음이 설명하는 식물호르몬은?\n○ 극성수송 물질이다.\n○ 합성물질로 4-CPA, 2,4-D 등이 있다.\n○ 측근 및 부정근의 형성을 촉진한다.","options":[{"n":"1","text":"옥신"},{"n":"2","text":"지베렐린"},{"n":"3","text":"시토키닌"},{"n":"4","text":"아브시스산"}],"answers":["1"],"answerLabel":"1번","explanation":"옥신은 극성 수송을 하고 측근·부정근 형성을 촉진한다. 4-CPA와 2,4-D는 합성 옥신에 해당한다.","similarIds":[]},{"id":"10-60","round":10,"year":2024,"number":60,"subject":"재배학·원예작물학","stem":"공기의 조성성분 중 광합성의 주원료이며 호흡에 의해 발생되는 것은?","options":[{"n":"1","text":"이산화탄소"},{"n":"2","text":"질소"},{"n":"3","text":"산소"},{"n":"4","text":"오존"}],"answers":["1"],"answerLabel":"1번","explanation":"이산화탄소는 광합성의 탄소 원료이며 식물의 호흡 과정에서 발생한다. 질소·산소·오존은 이 설명에 해당하지 않는다.","similarIds":[]},{"id":"10-61","round":10,"year":2024,"number":61,"subject":"재배학·원예작물학","stem":"채소 육묘에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 직파에 비해 종자가 절약된다.\nㄴ. 토지이용도가 높아진다.\nㄷ. 수확기 및 출하기를 앞당길 수 있다.\nㄹ. 유묘기의 환경관리 및 병해충 방지가 어렵다.","options":[{"n":"1","text":"ㄱ, ㄷ"},{"n":"2","text":"ㄴ, ㄹ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"육묘는 종자를 절약하고 토지 이용률을 높이며 수확·출하를 앞당길 수 있다. 육묘는 초기 생육을 집중 관리하므로 환경 및 병해\n충 방지가 직파보다 어렵다는 ㄹ은 틀리다.","similarIds":["7-64"]},{"id":"10-62","round":10,"year":2024,"number":62,"subject":"재배학·원예작물학","stem":"파종 방법 중 조파(드릴파)에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"포장 전면에 종자를 흩어 뿌리는 방법이다."},{"n":"2","text":"뿌림 골을 만들고 그곳에 줄지어 종자를 뿌리는 방법이다."},{"n":"3","text":"일정한 간격을 두고 하나 내지 여러 개의 종자를 띄엄띄엄 파종하는 방법이다."},{"n":"4","text":"점파할 때 한 곳에 여러 개의 종자를 파종하는 방법이다.\n2024년도 제10회 손해평가사 1차 1교시 A형 ( 18 - 16 )"}],"answers":["2"],"answerLabel":"2번","explanation":"조파(드릴파)는 일정한 골을 만든 뒤 그 골을 따라 줄지어 종자를 파종한다. 포장 전체에 흩뿌리는 방식은 산파다.","similarIds":[]},{"id":"10-63","round":10,"year":2024,"number":63,"subject":"재배학·원예작물학","stem":"다음이 설명하는 취목 번식 방법으로 올바르게 짝지어진 것은?\nㄱ. 고무나무와 같은 관상 수목에서 줄기나 가지를 땅속에 휘어 묻을 수 없는\n경우에 높은 곳에서 발근시켜 취목하는 방법\nㄴ. 모식물의 기부에 새로운 측지가 나오게 한 후 끝이 보일 정도로 흙을 덮어\n서 뿌리가 내리면 잘라서 번식시키는 방법","options":[{"n":"1","text":"ㄱ: 고취법, ㄴ: 성토법"},{"n":"2","text":"ㄱ: 보통법, ㄴ: 고취법"},{"n":"3","text":"ㄱ: 고취법, ㄴ: 선취법"},{"n":"4","text":"ㄱ: 선취법, ㄴ: 성토법"}],"answers":["1"],"answerLabel":"1번","explanation":"고취법은 땅에 묻기 어려운 가지를 높은 위치에서 발근시키는 방법이다. 모식물 기부에서 새 가지를 내고 흙을 북돋워 발근시키\n는 방법은 성토법이다.","similarIds":[]},{"id":"10-64","round":10,"year":2024,"number":64,"subject":"재배학·원예작물학","stem":"다음은 탄질비(C/N율)에 관한 내용이다. ( )에 들어갈 내용을 순서대로 옳게 나\n열한 것은?\n작물체내의 탄수화물과 질소의 비율을 C/N율이라 하며, 과수재배에서 환상박피\n를 함으로서 환상박피 윗부분의 C/N율이 ( ), ( )이/가 ( )된다.","options":[{"n":"1","text":"높아지면, 영양생장, 촉진"},{"n":"2","text":"낮아지면, 영양생장, 억제"},{"n":"3","text":"높아지면, 꽃눈분화, 촉진"},{"n":"4","text":"낮아지면, 꽃눈분화, 억제"}],"answers":["3"],"answerLabel":"3번","explanation":"환상박피는 잎에서 만들어진 탄수화물이 아래로 이동하는 것을 제한해 박피 윗부분의 C/N율을 높인다. 높은 C/N율은 꽃눈 분화\n를 촉진한다.","similarIds":[]},{"id":"10-65","round":10,"year":2024,"number":65,"subject":"재배학·원예작물학","stem":"질소비료의 유효성분 중 유기태 질소가 아닌 것은?","options":[{"n":"1","text":"단백태 질소"},{"n":"2","text":"시안아미드태 질소"},{"n":"3","text":"질산태 질소"},{"n":"4","text":"아미노태 질소"}],"answers":["3"],"answerLabel":"3번","explanation":"질산태 질소는 이미 무기태 형태인 질소다. 단백태, 시안아미드태, 아미노태는 유기태 질소에 속한다.","similarIds":[]},{"id":"10-66","round":10,"year":2024,"number":66,"subject":"재배학·원예작물학","stem":"채소 작물에서 진균에 의한 병끼리 짝지어진 것은?","options":[{"n":"1","text":"역병, 모잘록병"},{"n":"2","text":"노균병, 무름병"},{"n":"3","text":"균핵병, 궤양병"},{"n":"4","text":"탄저병, 근두암종병"}],"answers":["1"],"answerLabel":"1번","explanation":"역병과 모잘록병은 모두 진균성 병해로 분류되는 대표 사례다. 나머지 짝은 세균성 병해가 섞여 있다.","similarIds":["7-72"]},{"id":"10-67","round":10,"year":2024,"number":67,"subject":"재배학·원예작물학","stem":"식용부위에 따른 분류에서 화채류끼리 짝지어진 것은?","options":[{"n":"1","text":"양배추, 시금치"},{"n":"2","text":"죽순, 아스파라거스"},{"n":"3","text":"토마토, 파프리카"},{"n":"4","text":"브로콜리, 콜리플라워"}],"answers":["4"],"answerLabel":"4번","explanation":"브로콜리와 콜리플라워는 꽃봉오리 또는 화뢰를 식용하는 화채류다. 다른 선택지는 잎·줄기·열매 등 식용 부위가 다르다.\n2024년 제10회 손해평가사 1차 | A형 최종정답 기준 5","similarIds":[]},{"id":"10-68","round":10,"year":2024,"number":68,"subject":"재배학·원예작물학","stem":"다음이 설명하는 과수의 병은?\n○ 세균에 의한 병\n○ 전염성이 강하고, 5 ∼ 6월경 주로 발생\n○ 꽃, 잎, 줄기 등이 검게 변하며 서서히 고사","options":[{"n":"1","text":"대추나무 빗자루병"},{"n":"2","text":"포도 갈색무늬병"},{"n":"3","text":"배 화상병"},{"n":"4","text":"사과 부란병\n2024년도 제10회 손해평가사 1차 1교시 A형 ( 18 - 17 )"}],"answers":["3"],"answerLabel":"3번","explanation":"배 화상병은 세균성 병해로 꽃과 새순이 검게 변하고 급속히 마르는 증상이 나타나며, 봄철 전염성이 강하다.","similarIds":[]},{"id":"10-69","round":10,"year":2024,"number":69,"subject":"재배학·원예작물학","stem":"블루베리 작물에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"과실은 포도와 유사하게 일정기간의 비대정체기를 가진다."},{"n":"2","text":"pH 5 정도의 산성토양에서 생육이 불량하다."},{"n":"3","text":"묘목을 키우는 방법에는 삽목, 취목, 조직배양 등이 있다."},{"n":"4","text":"한줄기 신장지에 작은 꽃자루가 있고 여기에 꽃이 붙는 단일화서이다."}],"answers":["2","4"],"answerLabel":"2·4번 (복수정답)","explanation":"블루베리는 강산성 토양을 선호하며 pH 5 전후는 재배에 적합한 범위다. 따라서 pH 5에서 생육이 불량하다는 ②가 틀리다. 최종\n정답표는 ④도 복수정답으로 표시하므로, 꽃차례 설명 또한 단일화서라는 표현이 적절하지 않은 것으로 처리한다.","similarIds":[]},{"id":"10-70","round":10,"year":2024,"number":70,"subject":"재배학·원예작물학","stem":"호흡 급등형 과실인 것은?","options":[{"n":"1","text":"포도"},{"n":"2","text":"딸기"},{"n":"3","text":"사과"},{"n":"4","text":"감귤"}],"answers":["3"],"answerLabel":"3번","explanation":"사과는 호흡 급등형(클라이맥터릭) 과실이다. 포도, 딸기, 감귤은 일반적으로 비급등형으로 분류된다.","similarIds":["12-68","1-70"]},{"id":"10-71","round":10,"year":2024,"number":71,"subject":"재배학·원예작물학","stem":"절화장미의 수명연장을 위해 자당을 사용하는 주된 목적은?","options":[{"n":"1","text":"pH 조절"},{"n":"2","text":"미생물 억제"},{"n":"3","text":"과산화물가(POV) 증가"},{"n":"4","text":"양분 공급"}],"answers":["4"],"answerLabel":"4번","explanation":"절화 장미의 수명 연장에 쓰는 자당은 절화에 호흡 기질과 에너지를 공급해 개화와 생리 기능을 유지하는 양분 역할을 한다.","similarIds":[]},{"id":"10-72","round":10,"year":2024,"number":72,"subject":"재배학·원예작물학","stem":"관목성 화목류끼리 짝지어진 것은?","options":[{"n":"1","text":"철쭉, 목련, 산수유"},{"n":"2","text":"라일락, 배롱나무, 이팝나무"},{"n":"3","text":"장미, 동백나무, 노각나무"},{"n":"4","text":"진달래, 무궁화, 개나리"}],"answers":["4"],"answerLabel":"4번","explanation":"진달래, 무궁화, 개나리는 관목성 화목류에 해당한다. 다른 선택지에는 교목성 수종이 포함되어 있다.","similarIds":[]},{"id":"10-73","round":10,"year":2024,"number":73,"subject":"재배학·원예작물학","stem":"온실의 처마가 높고 폭이 좁은 양지붕형 온실을 연결한 형태의 온실형은?","options":[{"n":"1","text":"둥근지붕형"},{"n":"2","text":"벤로형"},{"n":"3","text":"터널형"},{"n":"4","text":"쓰리쿼터형"}],"answers":["2"],"answerLabel":"2번","explanation":"벤로형 온실은 처마가 높고 폭이 비교적 좁은 양지붕형 온실을 연결한 구조다. 대규모 연동 유리온실에 널리 쓰인다.","similarIds":["7-73"]},{"id":"10-74","round":10,"year":2024,"number":74,"subject":"재배학·원예작물학","stem":"다음이 설명하는 양액 재배방식은?\n○ 고형배지를 사용하지 않음\n○ 베드의 바닥에 일정한 기울기를 만들어 양액을 흘려보내는 방식\n○ 뿌리의 일부는 공중에 노출하고, 나머지는 양액에 닿게 하여 재배","options":[{"n":"1","text":"담액수경"},{"n":"2","text":"박막수경"},{"n":"3","text":"암면경"},{"n":"4","text":"펄라이트경"}],"answers":["2"],"answerLabel":"2번","explanation":"박막수경(NFT)은 배지를 쓰지 않고 경사진 베드에 얕은 양액 흐름을 만들어 뿌리 일부가 양액에 닿고 일부는 공기에 노출되도록\n하는 방식이다.","similarIds":[]},{"id":"10-75","round":10,"year":2024,"number":75,"subject":"재배학·원예작물학","stem":"시설원예 피복자재에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"연질필름 중 PVC 필름의 보온성이 가장 낮다."},{"n":"2","text":"PE 필름, PVC 필름, EVA 필름은 모두 연질필름이다."},{"n":"3","text":"반사필름, 부직포는 커튼보온용 추가피복에 사용된다."},{"n":"4","text":"한랭사는 차광피복재로 사용된다.\n2024년도 제10회 손해평가사 1차 1교시 A형 ( 18 - 18 )"}],"answers":["1"],"answerLabel":"1번","explanation":"PVC 연질필름은 일반적으로 PE보다 보온성이 높다. PVC의 보온성이 가장 낮다고 한 ①이 틀리다.\n참고 자료\n1. 2024년 제10회 손해평가사 1차 시험 문제지(A형).\n2. 2024년 제10회 손해평가사 1차 시험 최종정답(A형).\n정답표는 공식 최종정답 파일의 1교시 A형 표를 판독해 옮겼습니다. 일부 법령 문항의 세부 문구는 시험 당시 적용 법령 및 최종정답을 기\n준으로 확인하세요.\n2024년 제10회 손해평가사 1차 | A형 최종정답 기준 6","similarIds":["4-75","7-74"]},{"id":"11-1","round":11,"year":2025,"number":1,"subject":"상법(보험편)","stem":"상법상 보험계약의 법적 성질로 옳지 않은 것은?","options":[{"n":"1","text":"낙성ㆍ불요식계약성"},{"n":"2","text":"사행ㆍ선의계약성"},{"n":"3","text":"부합계약성"},{"n":"4","text":"유상ㆍ편무계약성"}],"answers":["4"],"answerLabel":"4번","explanation":"보험계약은 보험료 지급과 보험금 지급이 대가관계인 유상·쌍무계약이다. 편무계약이라고 한 ④가 틀리다.","similarIds":["3-1"]},{"id":"11-2","round":11,"year":2025,"number":2,"subject":"상법(보험편)","stem":"상법상 타인을 위한 보험에 관한 설명으로 옳지 않은 것을 모두 고른 것은?\nㄱ. 보험계약자는 위임을 받지 아니하고 타인을 위하여 보험계약을 체결할 수\n없다.\nㄴ. 타인을 위한 손해보험계약의 보험계약자가 그 타인에게 보험사고의 발생으로\n생긴 손해의 배상을 한 때에는 보험계약자는 그 타인의 권리를 해하지\n아니하는 범위안에서 보험자에게 보험금액의 지급을 청구할 수 있다.\nㄷ. 보험계약자는 보험자에 대하여 보험료를 지급할 의무가 있다.\nㄹ. 보험계약자가 파산선고를 받은 경우에 그 타인은 자신의 보험상 권리의 포기\n여부에 관계없이 보험료를 지급할 의무가 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"위임 없이도 타인을 위한 보험계약을 체결할 수 있어 ㄱ은 틀리다. 계약자 파산 시 제3자의 보험료 의무는 보험상 권리를\n포기하면 발생하지 않으므로 ㄹ도 틀리다.","similarIds":["9-2","6-12","7-2","5-3","3-4","5-7","3-7","2-17","7-5","9-6","12-6","2-5","2-4","12-3"]},{"id":"11-3","round":11,"year":2025,"number":3,"subject":"상법(보험편)","stem":"상법상 보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 최초의 보험료를 지급하지 아니한 때에도 보험자는 보험계약이 성립한\n때에는 지체없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다."},{"n":"2","text":"기존의 보험계약을 변경한 경우 보험자는 그 보험증권에 그 사실을 기재함으로써\n보험증권의 교부에 갈음할 수 있다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날부터 14일 기간내에 한하여 그 증권\n내용의 정부에 관한 이의를 할 수 있음을 약정할 수 있다."},{"n":"4","text":"보험계약자가 보험증권을 현저하게 훼손하여 증권의 재교부를 청구한 경우 그 비용은\n보험자가 부담하여야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"보험증권을 받은 날부터 14일 안에 증권 내용에 이의를 제기할 수 있도록 약정할 수 있다. 이를 진술한 ②가 옳다.","similarIds":["5-4","9-3","2-2","12-1","8-3","4-3","10-3","6-13","7-3","10-2","3-5","12-3"]},{"id":"11-4","round":11,"year":2025,"number":4,"subject":"상법(보험편)","stem":"상법상 보험사고에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니\n하는 보험의 경우에는 보험계약자가 그 사고발생 후에 보험계약을 해지할 수 없다."},{"n":"2","text":"보험계약 당시에 보험사고가 이미 발생하였음을 보험계약자가 알고 있었다면 그 계약은\n무효로 한다."},{"n":"3","text":"보험계약 당시에 보험사고가 객관적으로 발생할 수 없음을 보험계약자와 보험자가\n몰랐다면, 피보험자가 이를 알았더라도 그 계약은 무효로 볼 수 없다."},{"n":"4","text":"계약전의 어느 시기를 보험기간의 시기(始期)로 한 보험계약은 무효이다.\n2025년도 제11회 손해평가사 1차 1교시 A형 ( 18 - 1 )"}],"answers":["2"],"answerLabel":"2번","explanation":"계약 당시 보험사고 function explanation(q){var label=q.answerLabel||q.answers.map(answerGlyph).join("·");var text=q.explanation||"별도 해설이 준비되지 않았습니다. 정답은 최종정답표 기준입니다.";return '<div class="ex-head"><h3>정답 및 해설</h3><span class="pill">'+esc(q.subject)+'</span></div><p class="answerline">정답: '+esc(label)+'</p><div class="ex-body">'+esc(text)+'</div>'}
function render(){
 var q=current();$("wrongCount").textContent=basePool().filter(function(x){return wrong.has(x.id)}).length;$("markedCount").textContent=marked.size;$("scopeLabel").textContent=pool.length.toLocaleString()+"문항";var done=pool.filter(function(x){return saved[x.id]}).length;$("answeredLabel").textContent=done.toLocaleString()+" / "+pool.length.toLocaleString();$("progressBar").style.width=pool.length?(done/pool.length*100)+"%":"0%";drawNav();
 if(!q){var emptyTitle=mode==="marked"?"표시된 중요문제가 없습니다":(mode==="similar"?"유사문제 추천이 없습니다":"복습할 오답이 없습니다");var emptyText=mode==="marked"?"문제 화면에서 중요 표시를 누르면 이곳에서 모든 회차의 중요문제를 함께 학습할 수 있습니다.":(mode==="similar"?"비슷한 지문이나 보기 구성이 있는 다른 문항을 찾지 못했습니다.":"전체 문제를 풀고 채점하면 틀린 문항이 이 목록에 모입니다.");$("roundPill").textContent=mode==="marked"?"중요문제":(mode==="similar"?"유사문제":"오답 복습");$("subjectPill").textContent=subjectSel.value==="all"?"전체 과목":subjectSel.value;$("counter").textContent="";$("questionArea").innerHTML='<div class="empty"><h2>'+emptyTitle+'</h2><p>'+emptyText+'</p><button class="action primary" id="emptyAll">전체 문제 풀기</button></div>';$("emptyAll").onclick=function(){mode="all";updatePool()};return}

 var optionHtml=opts.map(function(o){var n=String(o.n),selected=picked===n,correct=q.answers.indexOf(n)>=0,cls="choice"+(selected?" selected":"");if(graded&&correct)cls+=" is-right";if(graded&&selected&&!correct)cls+=" is-wrong";return '<label class="'+cls+'"><input type="radio" name="answer" value="'+n+'" '+(selected?"checked":"")+'><span class="num">'+answerGlyph(n)+'</span><span class="ctext">'+esc(o.text)+'</span></label>'}).join("");
 var html='<div class="content"><h2 class="qtitle">'+esc(q.stem||"문항 내용을 확인해 주세요.")+'</h2><div class="choices">'+optionHtml+'</div></div>';

 $("questionArea").innerHTML=html;document.querySelectorAll('input[name="answer"]').forEach(function(el){el.addEventListener("change",function(ev){saved[q.id]=ev.target.value;persist();renderProgressOnly()})});
 $("prevBtn").onclick=function(){go(-1)};$("nextBtn").onclick=function(){go(1)};$("gradeBtn").onclick=grade;$("markBtn").onclick=function(){if(marked.has(q.id))marked.delete(q.id);else marked.add(q.id);persist();render()};var unflagWrongBtn=$("unflagWrongBtn");if(unflagWrongBtn)unflagWrongBtn.onclick=function(){wrong.delete(q.id);persist();updatePool(false);toast("이 문제를 오답 목록에서 해제했습니다.")};$("similarBtn").onclick=function(){var ids=q.similarIds||[],nextPool=ids.map(function(id){return questions.find(function(x){return x.id===id})}).filter(Boolean);if(!nextPool.length){toast("유사문제 추천 자료가 없습니다.");return}similarReturn.push({pool:pool.slice(),index:index,mode:mode,round:roundSel.value,subject:subjectSel.value,graded:graded,summaryClass:$("summary").className,summaryHTML:$("summary").innerHTML});pool=nextPool;mode="similar";index=0;graded=false;$("summary").classList.remove("show");render()};var returnBtn=$("returnBtn");if(returnBtn)returnBtn.onclick=function(){var prev=similarReturn.pop();if(!prev)return;pool=prev.pool;index=prev.index;mode=prev.mode;roundSel.value=prev.round;subjectSel.value=prev.subject;graded=prev.graded;$("summary").className=prev.summaryClass;$("summary").innerHTML=prev.summaryHTML;render()};$("showExplain").onclick=function(){$("explainBox").hidden=!$("explainBox").hidden};if(graded)$("explainBox").hidden=false
}
function renderProgressOnly(){var done=pool.filter(function(x){return saved[x.id]}).length;$("answeredLabel").textContent=done.toLocaleString()+" / "+pool.length.toLocaleString();$("progressBar").style.width=pool.length?(done/pool.length*100)+"%":"0%";drawNav()}
function go(delta){var t=index+delta;if(t<0||t>=pool.length)return;index=t;graded=false;$("summary").classList.remove("show");render()}
function grade(){if(!pool.length)return;var correct=0,unanswered=0;pool.forEach(function(q){var v=saved[q.id];if(!v){unanswered++;wrong.add(q.id)}else if(q.answers.indexOf(v)>=0){correct++;wrong.delete(q.id)}else wrong.add(q.id)});persist();graded=true;var score=$("summary");score.classList.add("show");score.innerHTML='<strong>'+correct+' / '+pool.length+' 정답</strong><span>정답률 '+Math.round(correct/pool.length*100)+'% · 미응답 '+unanswered+' · 오답 누적 '+basePool().filter(function(q){return wrong.has(q.id)}).length+'</span><button class="action soft" id="reviewNow">틀린 문제 복습</button>';$("reviewNow").onclick=function(){mode="wrong";updatePool()};render();toast("채점이 완료되었습니다. 틀린 문제는 오답 목록에 저장했습니다.")}

})();
