und":1,"year":2015,"number":47,"subject":"농어업재해보험법령","topic":"손해평가결과의 검증","stem":"농업재해보험 손해평가요령에 따른 손해평가결과 검증에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"재해보험사업자 및 재해보험사업의 재보험사업자는 손해평가반이 실시한 손해평가결과를 확인\n하고자 하는 경우에는 손해평가를 실시한 전체 보험목적물에 대하여 검증조사를 하여야 한다."},{"n":"2","text":"농림축산식품부장관은 재해보험사업자로 하여금 검증조사를 하게 할 수 있으며, 재해보험\n사업자는 특별한 사유가 없는 한 이에 응하여야 한다."},{"n":"3","text":"재해보험사업자는 검증조사결과 현저한 차이가 발생되어 재조사가 불가피하다고 판단될\n경우라도 해당 손해평가반이 조사한 전체 보험목적물에 대하여 재조사를 할 수 없다."},{"n":"4","text":"보험가입자가 정당한 사유없이 검증조사를 거부하는 경우 검증조사반은 검증조사결과\n작성을 생략하고 재해보험사업자에게 제출하지 않아도 된다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n장관은 사업자에게 검증조사를 하게 할 수 있고 사업자는 특별한 사유가 없으면 이에 응해야 한다. 따라서 ②가 옳다. 검증은 평가의 정확성·공정성을 확인하기 위한 절차이다.\n\n오답 확인\n① 반드시 전체 목적물 모두를 검증하는 것은 아니다. ③ 현저한 차이 등 사유가 있으면 재조사가 가능하다. ④ 가입자의 거부가 있더라도 경위와 관련 결과를 작성·보고하는 절차를 임의로 생략할 수 없다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제11조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"장관은 사업자에게 검증조사를 하게 할 수 있고 사업자는 특별한 사유가 없으면 이에 응해야 한다. 따라서 ②가 옳다. 검증은 평가의 정확성·공정성을 확인하기 위한 절차이다.","kind":"reason"},{"label":"오답 확인","text":"① 반드시 전체 목적물 모두를 검증하는 것은 아니다. ③ 현저한 차이 등 사유가 있으면 재조사가 가능하다. ④ 가입자의 거부가 있더라도 경위와 관련 결과를 작성·보고하는 절차를 임의로 생략할 수 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제11조(출제 당시)","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":23,"similarIds":["9-44","2-46","7-44","10-44","12-43","8-45","11-42","6-44","5-44","3-49","8-44"]},{"id":"1-48","round":1,"year":2015,"number":48,"subject":"농어업재해보험법령","topic":"손해평가 위탁 시 계약사항 통보","stem":"농업재해보험 손해평가요령에 따른 피해사실 확인 내용으로 옳은 것은?","options":[{"n":"1","text":"손해평가반은 보험책임기간에 관계없이 발생한 피해에 대해서는 재해보험사업자에게 피해\n발생을 통지하여야 한다."},{"n":"2","text":"재해보험사업자는 손해평가반으로 하여금 일정기간을 정하여 보험목적물의 피해사실을\n확인하게 하여야 한다."},{"n":"3","text":"재해보험사업자는 손해평가반으로 하여금 일정기간을 정하여 보험목적물의 손해평가를\n실시하게 하여야 한다."},{"n":"4","text":"재해보험사업자가 손해평가반에게 손해평가를 위탁할 때에는 해당 보험가입자의 보험계약\n사항 중 손해평가와 관련된 사항을 통보하여야 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n사업자가 평가를 맡길 때에는 보험기간, 목적물, 보장조건 등 손해평가에 필요한 계약사항을 평가반에 통보해야 한다. 따라서 ④가 옳다. 보장범위를 모르면 피해를 확인해도 보험손해를 정확히 평가할 수 없기 때문이다.\n\n오답 확인\n① 보험책임기간과 관계없이 모든 피해를 보험사고처럼 통지한다는 표현은 틀리다. ②·③ 평가 착수를 임의의 일정기간 뒤로 미루는 방식이 아니라 피해 확인·평가는 신속하게 실시하는 것이 원칙이다.\n\n근거·학습주제\n농업재해보험 손해평가요령 피해사실 확인·평가 조항","explanationSections":[{"label":"정답 근거","text":"사업자가 평가를 맡길 때에는 보험기간, 목적물, 보장조건 등 손해평가에 필요한 계약사항을 평가반에 통보해야 한다. 따라서 ④가 옳다. 보장범위를 모르면 피해를 확인해도 보험손해를 정확히 평가할 수 없기 때문이다.","kind":"reason"},{"label":"오답 확인","text":"① 보험책임기간과 관계없이 모든 피해를 보험사고처럼 통지한다는 표현은 틀리다. ②·③ 평가 착수를 임의의 일정기간 뒤로 미루는 방식이 아니라 피해 확인·평가는 신속하게 실시하는 것이 원칙이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 피해사실 확인·평가 조항","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":23,"similarIds":["10-42","7-43","8-44","5-44","3-49","6-44","10-40","9-38","1-41","2-43","11-38","8-45","2-45"]},{"id":"1-49","round":1,"year":2015,"number":49,"subject":"농어업재해보험법령","topic":"보험목적물별 손해평가 단위","stem":"농업재해보험 손해평가요령에 따른 보험목적물별 손해평가 단위로 옳지 않은 것은?","options":[{"n":"1","text":"벼 - 농가별"},{"n":"2","text":"사과 - 농지별"},{"n":"3","text":"돼지 - 개별가축별"},{"n":"4","text":"비닐하우스 - 보험가입 목적물별"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n농작물의 손해평가 단위는 농지별이다. 벼를 농가별이라고 한 ①이 틀리다. 같은 농가가 경작해도 농지별 피해·계약조건이 다르면 각각 평가해야 한다.\n\n오답 확인\n사과도 농지별, 돼지는 개별가축별, 비닐하우스 같은 시설은 보험가입 목적물별이다. 농가·농지·가입 목적물이라는 단위를 구분한다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제12조","explanationSections":[{"label":"정답 근거","text":"농작물의 손해평가 단위는 농지별이다. 벼를 농가별이라고 한 ①이 틀리다. 같은 농가가 경작해도 농지별 피해·계약조건이 다르면 각각 평가해야 한다.","kind":"reason"},{"label":"오답 확인","text":"사과도 농지별, 돼지는 개별가축별, 비닐하우스 같은 시설은 보험가입 목적물별이다. 농가·농지·가입 목적물이라는 단위를 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제12조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":24,"similarIds":["12-44","2-38","5-45","4-45"]},{"id":"1-50","round":1,"year":2015,"number":50,"subject":"농어업재해보험법령","topic":"시설 보험가액·손해액의 약정","stem":"농업재해보험 손해평가요령에 따른 농업시설물의 보험가액 및 손해액 산정과 관련하여\n옳지 않은 것은?","options":[{"n":"1","text":"보험가액은 보험사고가 발생한 때와 곳에서 평가한다."},{"n":"2","text":"보험가액은 피해목적물의 재조달가액에서 내용연수에 따른 감가상각률을 적용하여 계산한\n감가상각액을 차감하여 산정한다."},{"n":"3","text":"손해액은 보험사고가 발생한 때와 곳에서 산정한 피해목적물의 원상복구비용을 말한다."},{"n":"4","text":"보험가입당시 보험가액 및 손해액 산정방식에 대해서는 보험가입자와 재해보험사업자가\n별도로 정할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n가입자와 사업자가 가입 때 보험가액·손해액 산정방식을 별도로 정한 경우에는 그 방법에 따를 수 있다. 별도로 정할 수 없다는 ④가 틀리다.\n\n오답 확인\n①·② 시설 보험가액은 원칙적으로 사고 시·곳의 재조달가액에서 감가상각을 차감한다. ③ 손해액은 원상복구비용이다. 원칙적 평가방법과 별도 약정에 따른 평가방법을 구분한다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제15조","explanationSections":[{"label":"정답 근거","text":"가입자와 사업자가 가입 때 보험가액·손해액 산정방식을 별도로 정한 경우에는 그 방법에 따를 수 있다. 별도로 정할 수 없다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"①·② 시설 보험가액은 원칙적으로 사고 시·곳의 재조달가액에서 감가상각을 차감한다. ③ 손해액은 원상복구비용이다. 원칙적 평가방법과 별도 약정에 따른 평가방법을 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제15조","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":24,"similarIds":["12-47","5-48","7-50","10-50","3-46","11-50","8-50","9-48","2-41","9-50"]},{"id":"1-51","round":1,"year":2015,"number":51,"subject":"재배학·원예작물학","topic":"용도에 따른 작물 분류","stem":"농업상 용도에 의한 작물의 분류로 옳지 않은 것은?","options":[{"n":"1","text":"공예작물"},{"n":"2","text":"사료작물"},{"n":"3","text":"주형작물"},{"n":"4","text":"녹비작물"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n주형작물은 키가 큰 작물 등 작물의 형태·재배적 특성에 관한 분류로, 공예·사료·녹비처럼 이용 목적에 따른 분류가 아니다. 따라서 ③이다.\n\n오답 확인\n① 공예작물은 섬유·기름 등 원료, ② 사료작물은 가축 먹이, ④ 녹비작물은 토양에 환원하여 비료로 이용하는 작물이다. 분류 기준을 먼저 고정해야 한다.\n\n근거·학습주제\n재배학: 작물의 분류","explanationSections":[{"label":"정답 근거","text":"주형작물은 키가 큰 작물 등 작물의 형태·재배적 특성에 관한 분류로, 공예·사료·녹비처럼 이용 목적에 따른 분류가 아니다. 따라서 ③이다.","kind":"reason"},{"label":"오답 확인","text":"① 공예작물은 섬유·기름 등 원료, ② 사료작물은 가축 먹이, ④ 녹비작물은 토양에 환원하여 비료로 이용하는 작물이다. 분류 기준을 먼저 고정해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 작물의 분류","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":25,"similarIds":[]},{"id":"1-52","round":1,"year":2015,"number":52,"subject":"재배학·원예작물학","topic":"토양의 물리성과 화학성","stem":"토양의 물리적 특성이 아닌 것은?","options":[{"n":"1","text":"보수성"},{"n":"2","text":"환원성"},{"n":"3","text":"통기성"},{"n":"4","text":"배수성"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n환원성은 산화·환원 반응과 관련한 화학적 성질이다. 보기 중 물리적 특성이 아닌 것은 ②이다. 물리성은 토양의 구조·공극과 물·공기의 이동 등과 연관된다.\n\n오답 확인\n① 보수성은 물을 보유하는 능력, ③ 통기성은 공기 교환, ④ 배수성은 과잉수의 이동·배출 특성으로 물리성에 해당한다.\n\n근거·학습주제\n재배학: 토양의 물리·화학적 성질","explanationSections":[{"label":"정답 근거","text":"환원성은 산화·환원 반응과 관련한 화학적 성질이다. 보기 중 물리적 특성이 아닌 것은 ②이다. 물리성은 토양의 구조·공극과 물·공기의 이동 등과 연관된다.","kind":"reason"},{"label":"오답 확인","text":"① 보수성은 물을 보유하는 능력, ③ 통기성은 공기 교환, ④ 배수성은 과잉수의 이동·배출 특성으로 물리성에 해당한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 토양의 물리·화학적 성질","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":25,"similarIds":[]},{"id":"1-53","round":1,"year":2015,"number":53,"subject":"재배학·원예작물학","topic":"토양 입단의 파괴","stem":"토양의 입단파괴 요인은?","options":[{"n":"1","text":"경운 및 쇄토"},{"n":"2","text":"유기물 시용"},{"n":"3","text":"토양 피복"},{"n":"4","text":"두과작물 재배"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n지나친 경운·쇄토는 입단을 물리적으로 부수고 유기물 분해를 촉진하여 입단 안정성을 낮출 수 있다. 따라서 입단파괴 요인으로 ①을 고른다.\n\n오답 확인\n② 유기물은 입자 결합을 돕고, ③ 피복은 빗방울 충격과 침식을 줄인다. ④ 두과작물 뿌리·유기물 공급은 입단 형성을 돕는다. 모든 경운이 항상 나쁘다는 뜻은 아니며 과도한 쇄토가 핵심이다.\n\n근거·학습주제\n재배학: 입단구조 형성과 파괴","explanationSections":[{"label":"정답 근거","text":"지나친 경운·쇄토는 입단을 물리적으로 부수고 유기물 분해를 촉진하여 입단 안정성을 낮출 수 있다. 따라서 입단파괴 요인으로 ①을 고른다.","kind":"reason"},{"label":"오답 확인","text":"② 유기물은 입자 결합을 돕고, ③ 피복은 빗방울 충격과 침식을 줄인다. ④ 두과작물 뿌리·유기물 공급은 입단 형성을 돕는다. 모든 경운이 항상 나쁘다는 뜻은 아니며 과도한 쇄토가 핵심이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 입단구조 형성과 파괴","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":25,"similarIds":["4-66"]},{"id":"1-54","round":1,"year":2015,"number":54,"subject":"재배학·원예작물학","topic":"토양수분과 pF","stem":"토양수분에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"결합수는 식물이 흡수ㆍ이용할 수 없다."},{"n":"2","text":"물은 수분포텐셜(water potential)이 높은 곳에서 낮은 곳으로 이동한다."},{"n":"3","text":"중력수는 pF 7.0 정도로 중력에 의해 지하로 흡수되는 수분이다."},{"n":"4","text":"토양수분장력은 토양입자가 수분을 흡착하여 유지하려는 힘이다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n중력수는 중력에 따라 쉽게 배수되는 물로 수분장력이 낮은 영역의 물이다. pF 7.0처럼 장력이 매우 큰 수분이라고 한 ③이 틀리다. pF가 커질수록 토양이 물을 더 강하게 붙잡는다.\n\n오답 확인\n① 결합수는 식물이 이용하기 어렵다. ② 물은 수분포텐셜이 높은 쪽에서 낮은 쪽으로 이동한다. ④ 토양수분장력은 토양이 물을 유지하려는 힘이다. 중력수·모관수·흡습수의 이용성을 구분한다.\n\n근거·학습주제\n재배학: 토양수분의 형태·pF","explanationSections":[{"label":"정답 근거","text":"중력수는 중력에 따라 쉽게 배수되는 물로 수분장력이 낮은 영역의 물이다. pF 7.0처럼 장력이 매우 큰 수분이라고 한 ③이 틀리다. pF가 커질수록 토양이 물을 더 강하게 붙잡는다.","kind":"reason"},{"label":"오답 확인","text":"① 결합수는 식물이 이용하기 어렵다. ② 물은 수분포텐셜이 높은 쪽에서 낮은 쪽으로 이동한다. ④ 토양수분장력은 토양이 물을 유지하려는 힘이다. 중력수·모관수·흡습수의 이용성을 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 토양수분의 형태·pF","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":[]},{"id":"1-55","round":1,"year":2015,"number":55,"subject":"재배학·원예작물학","topic":"생육온도와 꽃눈분화","stem":"다음 ( )안에 들어갈 내용을 순서대로 옳게 나열한 것은?\n식물의 생육이 가능한 온도를 ( )(이)라고 한다. 배추, 양배추, 상추는\n( )채소로 분류되고, ( )는 종자 때부터 저온에 감응하여 화아분화가\n되며, ( )는 고온에 의해 화아분화가 이루어진다.","options":[{"n":"1","text":"생육적온, 호온성, 배추, 상추"},{"n":"2","text":"유효온도, 호냉성, 배추, 상추"},{"n":"3","text":"생육적온, 호냉성, 상추, 양배추"},{"n":"4","text":"유효온도, 호온성, 상추, 배추"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n차례대로 유효온도, 호냉성, 배추, 상추이므로 ②이다. 유효온도는 생육이 가능한 온도 범위를 뜻하고, 호냉성 채소는 비교적 서늘한 조건에 적응한다. 배추는 종자 때부터 저온에 감응할 수 있고 상추는 고온에서 꽃눈분화·추대가 촉진된다.\n\n오답 확인\n생육적온은 생육이 가장 잘되는 온도여서 생육가능온도 전체와 다르다. 배추·양배추·상추를 호온성 채소로 묶은 보기 또한 틀리다.\n\n근거·학습주제\n원예학: 온도반응·종자춘화","explanationSections":[{"label":"정답 근거","text":"차례대로 유효온도, 호냉성, 배추, 상추이므로 ②이다. 유효온도는 생육이 가능한 온도 범위를 뜻하고, 호냉성 채소는 비교적 서늘한 조건에 적응한다. 배추는 종자 때부터 저온에 감응할 수 있고 상추는 고온에서 꽃눈분화·추대가 촉진된다.","kind":"reason"},{"label":"오답 확인","text":"생육적온은 생육이 가장 잘되는 온도여서 생육가능온도 전체와 다르다. 배추·양배추·상추를 호온성 채소로 묶은 보기 또한 틀리다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학: 온도반응·종자춘화","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":[]},{"id":"1-56","round":1,"year":2015,"number":56,"subject":"재배학·원예작물학","topic":"중성식물","stem":"한계일장이 없어 일장조건에 관계없이 개화하는 중성식물은?","options":[{"n":"1","text":"상추"},{"n":"2","text":"국화"},{"n":"3","text":"딸기"},{"n":"4","text":"고추"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n고추는 대표적인 중성식물로, 개화에 특정 한계일장을 요구하지 않는 것으로 분류한다. 따라서 ④이다. 중성은 생육 전반이 빛의 양과 무관하다는 뜻이 아니라 개화의 일장반응 분류이다.\n\n오답 확인\n상추는 장일에 추대·개화가 촉진되고 국화는 대표적인 단일식물이다. 딸기는 품종에 따라 반응 차이가 있으나 본 문항의 일반적인 분류에서는 고추와 구별한다.\n\n근거·학습주제\n원예학: 일장반응","explanationSections":[{"label":"정답 근거","text":"고추는 대표적인 중성식물로, 개화에 특정 한계일장을 요구하지 않는 것으로 분류한다. 따라서 ④이다. 중성은 생육 전반이 빛의 양과 무관하다는 뜻이 아니라 개화의 일장반응 분류이다.","kind":"reason"},{"label":"오답 확인","text":"상추는 장일에 추대·개화가 촉진되고 국화는 대표적인 단일식물이다. 딸기는 품종에 따라 반응 차이가 있으나 본 문항의 일반적인 분류에서는 고추와 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학: 일장반응","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":[]},{"id":"1-57","round":1,"year":2015,"number":57,"subject":"재배학·원예작물학","topic":"춘화현상","stem":"식물의 종자가 발아한 후 또는 줄기의 생장점이 발육하고 있을 때 일정기간의 저온을\n거침으로써 화아가 형성되는 현상은?","options":[{"n":"1","text":"휴지"},{"n":"2","text":"춘화"},{"n":"3","text":"경화"},{"n":"4","text":"좌지"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n종자 또는 생장점이 일정한 저온을 겪어 이후 화아형성이 가능해지는 현상은 춘화이다. 저온감응이라는 단어가 풀이의 핵심이므로 ②이다.\n\n오답 확인\n휴지는 일시적 생장 정지, 경화는 불리한 환경에 대한 저항성 증가와 관련한 개념이다. 저온을 겪었다는 공통점만으로 저온순화·내한성 증가와 춘화를 같은 현상으로 보지 않는다.\n\n근거·학습주제\n재배학: 춘화와 생식생장","explanationSections":[{"label":"정답 근거","text":"종자 또는 생장점이 일정한 저온을 겪어 이후 화아형성이 가능해지는 현상은 춘화이다. 저온감응이라는 단어가 풀이의 핵심이므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"휴지는 일시적 생장 정지, 경화는 불리한 환경에 대한 저항성 증가와 관련한 개념이다. 저온을 겪었다는 공통점만으로 저온순화·내한성 증가와 춘화를 같은 현상으로 보지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 춘화와 생식생장","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":[]},{"id":"1-58","round":1,"year":2015,"number":58,"subject":"재배학·원예작물학","topic":"벼 조기재배와 만식재배","stem":"이앙 및 수확시기에 따른 벼의 재배양식에 관한 설명이다. ( )안에 들어갈 내용으로\n옳은 것은?\n○ ( )는 조생종을 가능한 한 일찍 파종, 육묘하고 조기에 이앙하여\n조기에 벼를 수확하는 재배형이다.\n○ ( )는 앞작물이 있거나 병충해회피 등의 이유로 보통기재배에 비해\n모내기가 현저히 늦은 재배형이다.","options":[{"n":"1","text":"조생재배, 만생재배"},{"n":"2","text":"조식재배, 만기재배"},{"n":"3","text":"조생재배, 만기재배"},{"n":"4","text":"조기재배, 만식재배"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n조생종을 일찍 파종·이앙하여 조기에 수확하는 방식은 조기재배이다. 앞작물이나 병해충 회피 등으로 이앙이 현저히 늦는 방식은 만식재배이므로 ④이다.\n\n오답 확인\n조생·만생은 주로 품종의 생육기간·숙기 특성, 조식·만식은 이앙시기의 이르고 늦음을 가리킨다. 조기 수확을 목표로 전체 작기를 앞당기는 조기재배와 용어를 구별한다.\n\n근거·학습주제\n벼 재배학: 재배양식","explanationSections":[{"label":"정답 근거","text":"조생종을 일찍 파종·이앙하여 조기에 수확하는 방식은 조기재배이다. 앞작물이나 병해충 회피 등으로 이앙이 현저히 늦는 방식은 만식재배이므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"조생·만생은 주로 품종의 생육기간·숙기 특성, 조식·만식은 이앙시기의 이르고 늦음을 가리킨다. 조기 수확을 목표로 전체 작기를 앞당기는 조기재배와 용어를 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"벼 재배학: 재배양식","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":[]},{"id":"1-59","round":1,"year":2015,"number":59,"subject":"재배학·원예작물학","topic":"취목번식의 선취법","stem":"작물의 취목번식 방법 중에서 가지의 선단부를 휘어서 묻는 방법은?","options":[{"n":"1","text":"선취법"},{"n":"2","text":"성토법"},{"n":"3","text":"당목취법"},{"n":"4","text":"고취법"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n모체에 붙은 가지의 끝부분을 휘어 땅에 묻어 발근시키는 방법은 선취법이다. 뿌리가 내린 후 모체와 분리해 새로운 개체로 만든다.\n\n오답 확인\n성토법은 포기 밑부분 등에 흙을 쌓아 발근시키며, 고취법은 땅 위의 가지에 상처를 내고 보습재 등으로 감싸 발근시킨다. 묻는 위치와 가지 형태를 비교한다.\n\n근거·학습주제\n원예학: 영양번식·취목","explanationSections":[{"label":"정답 근거","text":"모체에 붙은 가지의 끝부분을 휘어 땅에 묻어 발근시키는 방법은 선취법이다. 뿌리가 내린 후 모체와 분리해 새로운 개체로 만든다.","kind":"reason"},{"label":"오답 확인","text":"성토법은 포기 밑부분 등에 흙을 쌓아 발근시키며, 고취법은 땅 위의 가지에 상처를 내고 보습재 등으로 감싸 발근시킨다. 묻는 위치와 가지 형태를 비교한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학: 영양번식·취목","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":["3-65"]},{"id":"1-60","round":1,"year":2015,"number":60,"subject":"재배학·원예작물학","topic":"경종적 병해충 방제","stem":"작물의 병해충 방제법 중 경종적 방제에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"적극적인 방제기술이다."},{"n":"2","text":"윤작과 무병종묘재배가 포함된다."},{"n":"3","text":"친환경농업에는 적용되지 않는다."},{"n":"4","text":"병이 발생한 후에 더욱 효과적인 방제기술이다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n윤작과 건전한 종묘 사용은 재배체계·재배환경을 개선하여 병해충의 침입·증식을 억제하는 경종적 방제이다. 따라서 ②이다.\n\n오답 확인\n예방적 성격이 강하므로 발생 후 직접 살포하는 적극적 방제기술과 구별한다. 친환경농업에도 널리 이용하며, 병이 퍼진 뒤보다 재배 전·재배관리 단계의 예방에 의미가 크다.\n\n근거·학습주제\n재배학: 병해충의 경종적 방제","explanationSections":[{"label":"정답 근거","text":"윤작과 건전한 종묘 사용은 재배체계·재배환경을 개선하여 병해충의 침입·증식을 억제하는 경종적 방제이다. 따라서 ②이다.","kind":"reason"},{"label":"오답 확인","text":"예방적 성격이 강하므로 발생 후 직접 살포하는 적극적 방제기술과 구별한다. 친환경농업에도 널리 이용하며, 병이 퍼진 뒤보다 재배 전·재배관리 단계의 예방에 의미가 크다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 병해충의 경종적 방제","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"1-61","round":1,"year":2015,"number":61,"subject":"재배학·원예작물학","topic":"사과혹진딧물","stem":"다음 설명에 해당되는 해충은?\n○ 알상태로눈기부에서월동하고 연(年)10세대정도발생하며 잎뒷면에서가해한다.\n○ 사과나무에서 잎을 뒤로 말리게 하고 심하면 조기낙엽을 발생시킨다.","options":[{"n":"1","text":"사과혹진딧물"},{"n":"2","text":"복숭아심식나방"},{"n":"3","text":"사과굴나방"},{"n":"4","text":"조팝나무진딧물"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n사과혹진딧물은 눈 기부 등에서 알로 겨울을 나고 잎 뒷면을 가해하여 잎이 뒤쪽으로 말리는 증상을 낸다. 제시한 월동 형태·가해부위·잎말림 증상을 종합하면 ①이다.\n\n오답 확인\n복숭아심식나방은 주로 과실 내부를 먹는 해충이고, 사과굴나방은 잎 조직 안에 굴을 만든다. 조팝나무진딧물도 잎을 가해할 수 있으나 이 문항의 뒤로 심하게 말리는 특징은 사과혹진딧물을 가리킨다.\n\n근거·학습주제\n과수 병해충: 사과혹진딧물","explanationSections":[{"label":"정답 근거","text":"사과혹진딧물은 눈 기부 등에서 알로 겨울을 나고 잎 뒷면을 가해하여 잎이 뒤쪽으로 말리는 증상을 낸다. 제시한 월동 형태·가해부위·잎말림 증상을 종합하면 ①이다.","kind":"reason"},{"label":"오답 확인","text":"복숭아심식나방은 주로 과실 내부를 먹는 해충이고, 사과굴나방은 잎 조직 안에 굴을 만든다. 조팝나무진딧물도 잎을 가해할 수 있으나 이 문항의 뒤로 심하게 말리는 특징은 사과혹진딧물을 가리킨다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 병해충: 사과혹진딧물","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"1-62","round":1,"year":2015,"number":62,"subject":"재배학·원예작물학","topic":"일소 피해의 경감","stem":"일소현상에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"시설재배 시 차광막을 설치하여 일소를 경감시킬 수 있다."},{"n":"2","text":"겨울철 직사광선에 의해 원줄기나 원가지의 남쪽수피 부위에 피해를 주는 경우는 일소로\n진단하지 않는다."},{"n":"3","text":"개심자연형 나무에서는 배상형 나무에 비해 더 많이 발생한다."},{"n":"4","text":"과수원이 평지에 위치할 때 동향의 과수원이 서향의 과수원보다 일소가 더 많이 발생한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n차광막은 강한 직사광과 과실·조직의 과도한 온도 상승을 줄여 일소 피해를 경감할 수 있다. 따라서 ①이다.\n\n오답 확인\n② 겨울철 줄기 남쪽 수피의 강한 햇빛·온도 변화 피해도 일소의 범주에서 다룬다. ③ 배상형처럼 주지 내부가 강하게 노출되면 피해가 커질 수 있다. ④ 서향은 오후의 강한 햇빛과 고온으로 피해가 커지기 쉬우므로 방향을 반대로 단정했다.\n\n근거·학습주제\n과수 재해관리: 일소","explanationSections":[{"label":"정답 근거","text":"차광막은 강한 직사광과 과실·조직의 과도한 온도 상승을 줄여 일소 피해를 경감할 수 있다. 따라서 ①이다.","kind":"reason"},{"label":"오답 확인","text":"② 겨울철 줄기 남쪽 수피의 강한 햇빛·온도 변화 피해도 일소의 범주에서 다룬다. ③ 배상형처럼 주지 내부가 강하게 노출되면 피해가 커질 수 있다. ④ 서향은 오후의 강한 햇빛과 고온으로 피해가 커지기 쉬우므로 방향을 반대로 단정했다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 재해관리: 일소","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":[]},{"id":"1-63","round":1,"year":2015,"number":63,"subject":"재배학·원예작물학","topic":"벼 풍수해 예방","stem":"벼 재배시 풍수해의 예방 및 경감 대책으로 옳지 않은 것은?","options":[{"n":"1","text":"내도복성 품종으로 재배한다."},{"n":"2","text":"밀식재배를 한다."},{"n":"3","text":"태풍이 지나간 후 살균제를 살포한다."},{"n":"4","text":"침ㆍ관수된 논은 신속히 배수시킨다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n밀식은 과번무와 통풍 불량, 줄기 연약화 등을 초래해 도복과 병해 위험을 높일 수 있으므로 예방대책으로 적합하지 않다. 따라서 ②이다.\n\n오답 확인\n내도복성 품종 이용은 도복을 줄이고, 태풍 뒤 적절한 방제는 상처·침수 후 병해 확산을 줄인다. 침관수된 논의 신속한 배수는 뿌리의 산소 부족과 부패를 줄이는 대책이다.\n\n근거·학습주제\n벼 재해관리: 풍수해·도복","explanationSections":[{"label":"정답 근거","text":"밀식은 과번무와 통풍 불량, 줄기 연약화 등을 초래해 도복과 병해 위험을 높일 수 있으므로 예방대책으로 적합하지 않다. 따라서 ②이다.","kind":"reason"},{"label":"오답 확인","text":"내도복성 품종 이용은 도복을 줄이고, 태풍 뒤 적절한 방제는 상처·침수 후 병해 확산을 줄인다. 침관수된 논의 신속한 배수는 뿌리의 산소 부족과 부패를 줄이는 대책이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"벼 재해관리: 풍수해·도복","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":["12-60"]},{"id":"1-64","round":1,"year":2015,"number":64,"subject":"재배학·원예작물학","topic":"꽃눈과 잎눈의 내한성","stem":"과수작물의 동해 및 상해(서리피해)에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"배나무의 경우 꽃이 일찍 피는 따뜻한 지역에서 늦서리 피해가 많이 일어난다."},{"n":"2","text":"핵과류에서 늦서리 피해에 민감하다."},{"n":"3","text":"꽃눈이 잎눈보다 내한성이 강하다."},{"n":"4","text":"서리를 방지하는 방법에는 방상팬 이용, 톱밥 및 왕겨 태우기 등이 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일반적으로 꽃눈은 잎눈보다 저온에 민감하므로 꽃눈의 내한성이 더 강하다는 ③이 틀리다. 특히 발아·개화가 진행되면 내한성이 빠르게 떨어진다.\n\n오답 확인\n개화가 이른 지역·품종은 늦서리를 만날 위험이 커지고 핵과류도 개화기의 피해가 크다. 방상팬은 복사냉각 때의 역전층 공기를 섞는 등으로 서리 피해를 줄일 수 있다.\n\n근거·학습주제\n과수 재해관리: 동해·상해","explanationSections":[{"label":"정답 근거","text":"일반적으로 꽃눈은 잎눈보다 저온에 민감하므로 꽃눈의 내한성이 더 강하다는 ③이 틀리다. 특히 발아·개화가 진행되면 내한성이 빠르게 떨어진다.","kind":"reason"},{"label":"오답 확인","text":"개화가 이른 지역·품종은 늦서리를 만날 위험이 커지고 핵과류도 개화기의 피해가 크다. 방상팬은 복사냉각 때의 역전층 공기를 섞는 등으로 서리 피해를 줄일 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 재해관리: 동해·상해","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":29,"similarIds":["5-57"]},{"id":"1-65","round":1,"year":2015,"number":65,"subject":"재배학·원예작물학","topic":"벼의 도복 경감","stem":"벼 담수표면산파 재배시 도복에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"벼 무논골뿌림재배에 비해 도복이 경감된다."},{"n":"2","text":"도복경감제를 살포하면 벼의 하위절간장이 짧아져서 도복이 경감된다."},{"n":"3","text":"질소질 비료를 다량 시비하면 도복이 경감된다."},{"n":"4","text":"파종직후에 1회 낙수를 강하게 해 주면 도복이 경감된다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n도복경감제는 하위절간의 신장을 억제하는 등의 효과로 줄기의 지지력을 높여 도복을 줄이므로 ②이다.\n\n오답 확인\n담수표면산파는 뿌리 지지력이 약해 도복에 유의해야 한다. 질소 과다 시비는 과번무·줄기 연약화로 도복을 늘린다. 파종 직후 1회 강한 낙수만을 일반적인 경감대책으로 제시한 ④보다 생육단계에 맞춘 물관리가 중요하다.\n\n근거·학습주제\n벼 재배학: 담수직파와 도복","explanationSections":[{"label":"정답 근거","text":"도복경감제는 하위절간의 신장을 억제하는 등의 효과로 줄기의 지지력을 높여 도복을 줄이므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"담수표면산파는 뿌리 지지력이 약해 도복에 유의해야 한다. 질소 과다 시비는 과번무·줄기 연약화로 도복을 늘린다. 파종 직후 1회 강한 낙수만을 일반적인 경감대책으로 제시한 ④보다 생육단계에 맞춘 물관리가 중요하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"벼 재배학: 담수직파와 도복","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"1-66","round":1,"year":2015,"number":66,"subject":"재배학·원예작물학","topic":"우리나라 우박의 발생시기","stem":"우리나라 우박피해에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"전국적으로 7∼8월에 집중적으로 발생한다."},{"n":"2","text":"과실 또는 새가지에 타박상이나 열상 등을 일으킨다."},{"n":"3","text":"비교적 단시간에 많은 피해를 일으키고, 피해지역이 국지적인 경우가 많다."},{"n":"4","text":"그물(방포망)을 나무에 씌워 피해를 경감시킬 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n우리나라 우박은 주로 봄에서 여름으로 넘어가는 5~6월, 여름에서 가을로 넘어가는 시기 등에 잘 발생한다. 전국적으로 7~8월에 집중된다고 한 ①은 틀리다.\n\n오답 확인\n우박은 과실·새가지 등에 타박상·열상을 내는 기계적 피해이며 짧은 시간 국지적으로 큰 손해를 준다. 방포망 등 망 피복은 우박의 직접 충격을 줄일 수 있다.\n\n근거·학습주제\n농촌진흥청 농작물 자연재해대응 매뉴얼: 우박","explanationSections":[{"label":"정답 근거","text":"우리나라 우박은 주로 봄에서 여름으로 넘어가는 5~6월, 여름에서 가을로 넘어가는 시기 등에 잘 발생한다. 전국적으로 7~8월에 집중된다고 한 ①은 틀리다.","kind":"reason"},{"label":"오답 확인","text":"우박은 과실·새가지 등에 타박상·열상을 내는 기계적 피해이며 짧은 시간 국지적으로 큰 손해를 준다. 방포망 등 망 피복은 우박의 직접 충격을 줄일 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농촌진흥청 농작물 자연재해대응 매뉴얼: 우박","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"1-67","round":1,"year":2015,"number":67,"subject":"재배학·원예작물학","topic":"무병주 생산과 조직배양","stem":"일반적으로 딸기와 감자의 무병주 생산을 위한 방법은?","options":[{"n":"1","text":"자가수정"},{"n":"2","text":"종자번식"},{"n":"3","text":"타가수정"},{"n":"4","text":"조직배양"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n딸기·감자는 영양번식을 반복하면 바이러스 등이 축적될 수 있어 생장점 배양 등 조직배양을 이용해 무병주를 생산한다. 생장점 부근의 감염 정도가 낮다는 점을 이용한다.\n\n오답 확인\n단순한 자가수정·타가수정이나 종자번식만으로 우량 품종의 유전적 특성을 유지한 무병 영양번식체 생산을 동일하게 달성하는 것은 아니다. 조직배양 후에도 바이러스 검정과 위생적 증식이 필요하다.\n\n근거·학습주제\n원예학: 생장점배양과 무병묘","explanationSections":[{"label":"정답 근거","text":"딸기·감자는 영양번식을 반복하면 바이러스 등이 축적될 수 있어 생장점 배양 등 조직배양을 이용해 무병주를 생산한다. 생장점 부근의 감염 정도가 낮다는 점을 이용한다.","kind":"reason"},{"label":"오답 확인","text":"단순한 자가수정·타가수정이나 종자번식만으로 우량 품종의 유전적 특성을 유지한 무병 영양번식체 생산을 동일하게 달성하는 것은 아니다. 조직배양 후에도 바이러스 검정과 위생적 증식이 필요하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학: 생장점배양과 무병묘","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"1-68","round":1,"year":2015,"number":68,"subject":"재배학·원예작물학","topic":"과채류의 결실조절","stem":"과채류의 결실 조절방법으로 모두 고른 것은?\nㄱ. 적과 ㄴ. 적화 ㄷ. 인공수분","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n적과는 남길 과실 수, 적화는 꽃 수를 조절하며 인공수분은 착과를 돕는다. 모두 과실의 수와 착과상태를 조절하는 방법이므로 ㄱ·ㄴ·ㄷ을 포함한 ④이다.\n\n오답 확인\n결실조절은 과실을 줄이는 작업만 뜻하지 않는다. 수분 불량 조건에서 착과를 확보하는 작업도 포함한다. 적과·적화는 남은 과실의 비대와 품질 향상에도 이용한다.\n\n근거·학습주제\n원예학: 결실관리","explanationSections":[{"label":"정답 근거","text":"적과는 남길 과실 수, 적화는 꽃 수를 조절하며 인공수분은 착과를 돕는다. 모두 과실의 수와 착과상태를 조절하는 방법이므로 ㄱ·ㄴ·ㄷ을 포함한 ④이다.","kind":"reason"},{"label":"오답 확인","text":"결실조절은 과실을 줄이는 작업만 뜻하지 않는다. 수분 불량 조건에서 착과를 확보하는 작업도 포함한다. 적과·적화는 남은 과실의 비대와 품질 향상에도 이용한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예학: 결실관리","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"1-69","round":1,"year":2015,"number":69,"subject":"재배학·원예작물학","topic":"에틸렌과 AVG","stem":"다음은 식물호르몬인 에틸렌에 관한 설명이다. 옳은 것을 모두 고른 것은?\nㄱ. 원예작물의 숙성호르몬이다.\nㄴ. 무색 무취의 가스형태이다.\nㄷ. 에테폰이 분해될 때 발생된다.\nㄹ. AVG (aminoethoxyvinyl glycine)처리에 의해 발생이 촉진된다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄱ, ㄴ, ㄷ"},{"n":"4","text":"ㄴ, ㄷ, ㄹ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nㄱ·ㄴ·ㄷ이 옳아 ③이다. 에틸렌은 성숙·노화 등을 조절하는 기체 호르몬이며, 에테폰은 분해되어 에틸렌을 방출한다. 원예학에서는 무색의 기체로 설명한다.\n\n오답 확인\nㄹ의 AVG는 에틸렌 생합성을 억제하는 물질이다. 따라서 처리가 에틸렌 발생을 촉진한다는 표현이 반대이다. 에틸렌 발생제와 생합성억제제, 작용억제제를 구별한다.\n\n근거·학습주제\n농촌진흥청 과수 낙과방지 자료: AVG","explanationSections":[{"label":"정답 근거","text":"ㄱ·ㄴ·ㄷ이 옳아 ③이다. 에틸렌은 성숙·노화 등을 조절하는 기체 호르몬이며, 에테폰은 분해되어 에틸렌을 방출한다. 원예학에서는 무색의 기체로 설명한다.","kind":"reason"},{"label":"오답 확인","text":"ㄹ의 AVG는 에틸렌 생합성을 억제하는 물질이다. 따라서 처리가 에틸렌 발생을 촉진한다는 표현이 반대이다. 에틸렌 발생제와 생합성억제제, 작용억제제를 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농촌진흥청 과수 낙과방지 자료: AVG","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"1-70","round":1,"year":2015,"number":70,"subject":"재배학·원예작물학","topic":"호흡 비급등형 과실","stem":"호흡 비급등형 과실인 것은?","options":[{"n":"1","text":"사과"},{"n":"2","text":"자두"},{"n":"3","text":"포도"},{"n":"4","text":"복숭아"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n포도는 성숙 과정에서 뚜렷한 호흡급등·자가촉진적 에틸렌 증가가 나타나지 않는 비급등형 과실이다. 따라서 ③이다. 수확 후 충분히 익혀 당도를 크게 올리기 어려워 적숙 수확이 중요하다.\n\n오답 확인\n사과·자두·복숭아는 대표적인 호흡급등형으로 분류한다. 호흡급등 여부와 단순히 저장 중 호흡을 전혀 하지 않는지는 다른 문제이다.\n\n근거·학습주제\n수확후생리: 호흡급등형·비급등형","explanationSections":[{"label":"정답 근거","text":"포도는 성숙 과정에서 뚜렷한 호흡급등·자가촉진적 에틸렌 증가가 나타나지 않는 비급등형 과실이다. 따라서 ③이다. 수확 후 충분히 익혀 당도를 크게 올리기 어려워 적숙 수확이 중요하다.","kind":"reason"},{"label":"오답 확인","text":"사과·자두·복숭아는 대표적인 호흡급등형으로 분류한다. 호흡급등 여부와 단순히 저장 중 호흡을 전혀 하지 않는지는 다른 문제이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"수확후생리: 호흡급등형·비급등형","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":["10-70","12-68"]},{"id":"1-71","round":1,"year":2015,"number":71,"subject":"재배학·원예작물학","topic":"블루베리와 산성토양","stem":"다음 중 생육에 적합한 토양 pH 가 가장 낮은 것은?","options":[{"n":"1","text":"블루베리나무"},{"n":"2","text":"무화과나무"},{"n":"3","text":"감나무"},{"n":"4","text":"포도나무"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n블루베리는 보기의 다른 과수보다 강한 산성토양에 적응하며 보통 pH 4.0~5.2 정도의 산성 범위에서 관리한다. 따라서 생육 적합 pH가 가장 낮은 것은 ①이다.\n\n오답 확인\n무화과·감·포도는 블루베리보다 대체로 높은 약산성 부근에서 관리한다. 블루베리에 다른 과수의 석회 시용 기준을 그대로 적용하면 pH가 지나치게 높아질 수 있다.\n\n근거·학습주제\n과수 재배: 블루베리 토양관리","explanationSections":[{"label":"정답 근거","text":"블루베리는 보기의 다른 과수보다 강한 산성토양에 적응하며 보통 pH 4.0~5.2 정도의 산성 범위에서 관리한다. 따라서 생육 적합 pH가 가장 낮은 것은 ①이다.","kind":"reason"},{"label":"오답 확인","text":"무화과·감·포도는 블루베리보다 대체로 높은 약산성 부근에서 관리한다. 블루베리에 다른 과수의 석회 시용 기준을 그대로 적용하면 pH가 지나치게 높아질 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 재배: 블루베리 토양관리","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"1-72","round":1,"year":2015,"number":72,"subject":"재배학·원예작물학","topic":"초생법과 양수분 경합","stem":"과수원의 토양표면 관리법 중 초생법의 장점이 아닌 것은?","options":[{"n":"1","text":"토양의 입단화가 촉진된다."},{"n":"2","text":"지력유지에 도움이 된다."},{"n":"3","text":"토양침식과 양분유실을 방지한다."},{"n":"4","text":"유목기에 양분 경합이 일어나지 않는다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n초생법에서는 풀과 과수가 물·양분을 두고 경쟁할 수 있고, 뿌리가 덜 발달한 유목에서 특히 문제가 된다. 유목기에 양분 경합이 없다는 ④는 장점이 아니다.\n\n오답 확인\n풀 뿌리와 유기물은 입단화를 돕고 지력을 유지한다. 지표를 덮어 토양침식·양분 유실도 줄인다. 장점은 살리되 예초·피복폭·비배관리로 경합을 조절해야 한다.\n\n근거·학습주제\n과수원 토양관리: 초생법","explanationSections":[{"label":"정답 근거","text":"초생법에서는 풀과 과수가 물·양분을 두고 경쟁할 수 있고, 뿌리가 덜 발달한 유목에서 특히 문제가 된다. 유목기에 양분 경합이 없다는 ④는 장점이 아니다.","kind":"reason"},{"label":"오답 확인","text":"풀 뿌리와 유기물은 입단화를 돕고 지력을 유지한다. 지표를 덮어 토양침식·양분 유실도 줄인다. 장점은 살리되 예초·피복폭·비배관리로 경합을 조절해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수원 토양관리: 초생법","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"1-73","round":1,"year":2015,"number":73,"subject":"재배학·원예작물학","topic":"절화수명과 에틸렌","stem":"절화의 수명연장방법으로 옳지 않은 것은?","options":[{"n":"1","text":"화병의 물에 살균제와 당을 첨가한다."},{"n":"2","text":"산성물(pH 3.2∼3.5)에 침지한다."},{"n":"3","text":"에틸렌을 엽면살포한다."},{"n":"4","text":"줄기 절단부를 수초간 열탕처리한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n에틸렌은 민감한 절화에서 노화·낙화·꽃잎 위축을 촉진할 수 있으므로 수명 연장을 위해 살포한다는 ③이 틀리다. 오히려 에틸렌 노출과 작용을 줄이는 관리가 필요하다.\n\n오답 확인\n살균제는 물관의 미생물 막힘을 줄이고 당은 에너지를 공급한다. 약산성 용액은 흡수를 돕는다. 열탕처리는 일부 절화의 수분흡수 회복에 쓰지만 작물별 적정 조건을 지켜야 하므로 모든 꽃에 무조건 적용하는 것은 아니다.\n\n근거·학습주제\n화훼 수확후관리: 절화 보존","explanationSections":[{"label":"정답 근거","text":"에틸렌은 민감한 절화에서 노화·낙화·꽃잎 위축을 촉진할 수 있으므로 수명 연장을 위해 살포한다는 ③이 틀리다. 오히려 에틸렌 노출과 작용을 줄이는 관리가 필요하다.","kind":"reason"},{"label":"오답 확인","text":"살균제는 물관의 미생물 막힘을 줄이고 당은 에너지를 공급한다. 약산성 용액은 흡수를 돕는다. 열탕처리는 일부 절화의 수분흡수 회복에 쓰지만 작물별 적정 조건을 지켜야 하므로 모든 꽃에 무조건 적용하는 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼 수확후관리: 절화 보존","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"1-74","round":1,"year":2015,"number":74,"subject":"재배학·원예작물학","topic":"시설의 연질 피복재","stem":"작물의 시설재배에서 연질 피복재만을 고른 것은?\nㄱ. 폴리에틸렌필름 ㄴ. 에틸렌아세트산필름\nㄷ. 폴리에스테르필름 ㄹ. 불소수지필름","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄹ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n전통적인 원예시설 피복재 분류에서 폴리에틸렌(PE)과 에틸렌아세트산(EVA) 필름을 연질 피복재로 분류하므로 ㄱ·ㄴ의 ①이다. 시험에서는 재료의 명칭과 해당 교재의 분류를 함께 확인한다.\n\n오답 확인\n폴리에스테르(PET)와 불소수지 필름은 이 문항의 연질 피복재 묶음에서 제외된다. 모두 '필름'이라고 표기되었다는 이유만으로 모든 피복재를 같은 분류에 넣지 않는다.\n\n근거·학습주제\n시설원예학: 피복재의 분류","explanationSections":[{"label":"정답 근거","text":"전통적인 원예시설 피복재 분류에서 폴리에틸렌(PE)과 에틸렌아세트산(EVA) 필름을 연질 피복재로 분류하므로 ㄱ·ㄴ의 ①이다. 시험에서는 재료의 명칭과 해당 교재의 분류를 함께 확인한다.","kind":"reason"},{"label":"오답 확인","text":"폴리에스테르(PET)와 불소수지 필름은 이 문항의 연질 피복재 묶음에서 제외된다. 모두 '필름'이라고 표기되었다는 이유만으로 모든 피복재를 같은 분류에 넣지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예학: 피복재의 분류","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":["5-75","4-75","7-74","3-75"]},{"id":"1-75","round":1,"year":2015,"number":75,"subject":"재배학·원예작물학","topic":"기화냉방과 공기순환","stem":"작물의 시설재배에 사용되는 기화냉방법이 아닌 것은?","options":[{"n":"1","text":"팬앤드패드(fan & pad)"},{"n":"2","text":"팬앤드미스트(fan & mist)"},{"n":"3","text":"팬앤드포그(fan & fog)"},{"n":"4","text":"팬앤드덕트(fan & duct)"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n팬앤드패드·미스트·포그는 물의 증발잠열을 이용해 열을 빼앗는 기화냉방 방식이다. 팬앤드덕트는 주로 덕트로 공기를 보내 순환·분배하는 방식이므로 보기 중 ④가 해당하지 않는다.\n\n오답 확인\n패드는 젖은 재료를 통과하는 공기를 냉각하며, 미스트·포그는 물방울을 분무한다. 팬이 있다는 공통점이 아니라 실제로 물을 증발시켜 냉각하는 장치인지로 구분한다.\n\n근거·학습주제\n시설원예학: 온실의 냉방","explanationSections":[{"label":"정답 근거","text":"팬앤드패드·미스트·포그는 물의 증발잠열을 이용해 열을 빼앗는 기화냉방 방식이다. 팬앤드덕트는 주로 덕트로 공기를 보내 순환·분배하는 방식이므로 보기 중 ④가 해당하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"패드는 젖은 재료를 통과하는 공기를 냉각하며, 미스트·포그는 물방울을 분무한다. 팬이 있다는 공통점이 아니라 실제로 물을 증발시켜 냉각하는 장치인지로 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예학: 온실의 냉방","kind":"reference"}],"sourcePdf":"2015년 제1회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"2-1","round":2,"year":2016,"number":1,"subject":"상법(보험편)","topic":"약관설명의무의 예외","stem":"보험약관의 중요한 내용에 대한 보험자의 설명의무가 발생하지 않는 경우를 모두 고른\n것은? (다툼이 있으면 판례에 따름)\nㄱ. 설명의무의 이행 여부가 보험계약의 체결 여부에 영향을 미치지 않는 경우\nㄴ. 보험약관에 정하여진 사항이 거래상 일반적이고 공통된 것이어서 보험\n계약자가 별도의 설명 없이도 충분히 예상할 수 있었던 사항인 경우\nㄷ. 보험계약자의 대리인이 그 약관의 내용을 충분히 잘 알고 있는 경우","options":[{"n":"1","text":"ㄷ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\nㄱ·ㄴ·ㄷ 모두 설명의무 예외로 인정되는 경우이므로 ④이다. 계약체결 여부에 영향을 미치지 않는 사항, 거래상 일반적·공통적이어서 충분히 예상 가능한 사항, 계약자 측 대리인이 이미 충분히 아는 사항에는 설명의 실질적 필요성이 없다.\n\n오답 확인\n중요한 약관이라는 표제만 보고 예외를 전부 배제하지 않는다. 예외 여부는 계약자의 구체적 인식과 거래상 예상 가능성을 살핀다.\n\n근거·학습주제\n상법 제638조의3 및 설명의무 판례","explanationSections":[{"label":"정답 근거","text":"ㄱ·ㄴ·ㄷ 모두 설명의무 예외로 인정되는 경우이므로 ④이다. 계약체결 여부에 영향을 미치지 않는 사항, 거래상 일반적·공통적이어서 충분히 예상 가능한 사항, 계약자 측 대리인이 이미 충분히 아는 사항에는 설명의 실질적 필요성이 없다.","kind":"reason"},{"label":"오답 확인","text":"중요한 약관이라는 표제만 보고 예외를 전부 배제하지 않는다. 예외 여부는 계약자의 구체적 인식과 거래상 예상 가능성을 살핀다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3 및 설명의무 판례","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["4-2"]},{"id":"2-2","round":2,"year":2016,"number":2,"subject":"상법(보험편)","topic":"보험증권의 이의기간","stem":"보험증권에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자가 보험료의 전부 또는 최초의 보험료를 지급하지 아니한 때에는 보험자의 보험\n증권교부의무가 발생하지 않는다."},{"n":"2","text":"기존의 보험계약을 변경한 경우에는 보험자는 그 보험증권에 그 사실을 기재함으로써\n보험증권의 교부에 갈음할 수 있다."},{"n":"3","text":"보험계약의 당사자는 보험증권의 교부가 있은 날로부터 10일내에 한하여 그 증권내용의\n정부에 관한 이의를 할 수 있음을 약정할 수 있다."},{"n":"4","text":"보험계약자의 청구에 의하여 보험증권을 재교부하는 경우 그 증권작성의 비용은 보험계약자가\n부담한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험증권 내용에 대한 이의기간은 교부일부터 일정한 기간으로 약정할 수 있으나 1개월보다 짧게 정하지 못한다. 10일로 제한한 ③은 옳지 않다.\n\n오답 확인\n보험료 미지급 때 증권교부를 유보하는 것과 약관 교부·설명의무는 별개다. 계약변경의 증권 기재, 계약자 요청으로 재교부할 때의 작성비용 부담은 다른 보기의 내용이다.\n\n근거·학습주제\n상법 제640조·제641조·제642조","explanationSections":[{"label":"정답 근거","text":"보험증권 내용에 대한 이의기간은 교부일부터 일정한 기간으로 약정할 수 있으나 1개월보다 짧게 정하지 못한다. 10일로 제한한 ③은 옳지 않다.","kind":"reason"},{"label":"오답 확인","text":"보험료 미지급 때 증권교부를 유보하는 것과 약관 교부·설명의무는 별개다. 계약변경의 증권 기재, 계약자 요청으로 재교부할 때의 작성비용 부담은 다른 보기의 내용이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제641조·제642조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["11-3","9-3","5-4","12-1","4-3","8-3","10-3","6-13","7-3","10-2","12-3"]},{"id":"2-3","round":2,"year":2016,"number":3,"subject":"상법(보험편)","topic":"보험설계사의 권한","stem":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하는\n자가 행사할 수 있는 권한으로 옳은 것은?","options":[{"n":"1","text":"보험자가 작성한 영수증을 보험계약자에게 교부하지 않고 보험계약자로부터 보험료를\n수령할 수 있는 권한"},{"n":"2","text":"보험계약자로부터 보험계약의 청약에 관한 의사표시를 수령할 수 있는 권한"},{"n":"3","text":"보험계약자에게 보험계약의 체결에 관한 의사표시를 할 수 있는 권한"},{"n":"4","text":"보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계속적으로 보험체결을 중개하는 자는 보험설계사에 해당한다. 보험자가 작성한 보험증권을 계약자에게 교부할 권한은 인정되므로 ④이다.\n\n오답 확인\n보험료는 보험자 작성 영수증 교부 조건과 구별해야 한다. 청약 수령, 계약 체결 의사표시 같은 법정 대리상의 권한을 설계사에게 포괄적으로 인정하지 않는다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"계속적으로 보험체결을 중개하는 자는 보험설계사에 해당한다. 보험자가 작성한 보험증권을 계약자에게 교부할 권한은 인정되므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"보험료는 보험자 작성 영수증 교부 조건과 구별해야 한다. 청약 수령, 계약 체결 의사표시 같은 법정 대리상의 권한을 설계사에게 포괄적으로 인정하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["6-15","10-4","2-21","11-5","12-4","4-5","9-5","12-5","8-5","7-4","5-6","8-6","1-4"]},{"id":"2-4","round":2,"year":2016,"number":4,"subject":"상법(보험편)","topic":"사고 후 임의해지","stem":"보험계약의 해지와 특별위험의 소멸에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"타인을 위한 보험계약의 경우 보험증권을 소지하지 않은 보험계약자는 그 타인의 동의를 얻지\n않은 경우에도 보험사고가 발생하기 전에는 언제든지 계약의 전부 또는 일부를 해지할 수 있다."},{"n":"2","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니하는\n보험의 경우에는 보험계약자는 그 사고발생 후에도 보험계약을 해지할 수 있다."},{"n":"3","text":"보험사고가 발생하기 전에 보험계약의 전부 또는 일부를 해지하는 경우에 보험계약자는\n당사자 간에 다른 약정이 없으면 미경과보험료의 반환을 청구할 수 없다."},{"n":"4","text":"보험계약의 당사자가 특별한 위험을 예기하여 보험료의 액을 정한 경우에 보험기간 중 그 예기한\n위험이 소멸한 때에도 보험계약자는 그 후의 보험료의 감액을 청구할 수 없다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n사고 발생으로 보험금을 지급해도 보험금액이 줄지 않는 보험이면 사고 후에도 계약자의 임의해지가 가능하므로 ②이다. 보험금 지급으로 보장금액이 소진되는 계약과 구별한다.\n\n오답 확인\n① 타인을 위한 보험은 그 타인의 동의 또는 증권 소지가 필요하다. ③ 사고 전 해지의 미경과보험료는 다른 약정이 없으면 반환 청구 가능하다. ④ 특별위험 소멸 시 보험료감액을 청구할 수 있다.\n\n근거·학습주제\n상법 제647조·제649조","explanationSections":[{"label":"정답 근거","text":"사고 발생으로 보험금을 지급해도 보험금액이 줄지 않는 보험이면 사고 후에도 계약자의 임의해지가 가능하므로 ②이다. 보험금 지급으로 보장금액이 소진되는 계약과 구별한다.","kind":"reason"},{"label":"오답 확인","text":"① 타인을 위한 보험은 그 타인의 동의 또는 증권 소지가 필요하다. ③ 사고 전 해지의 미경과보험료는 다른 약정이 없으면 반환 청구 가능하다. ④ 특별위험 소멸 시 보험료감액을 청구할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제647조·제649조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["3-7","6-16","5-7","7-5","11-6","12-6","10-7","10-5","12-5","4-9","4-6","9-6","9-11","11-4","9-4","8-16","2-5","3-11","12-3","6-12","11-7","11-2","11-15","10-16","1-5","7-6"]},{"id":"2-5","round":2,"year":2016,"number":5,"subject":"상법(보험편)","topic":"타인을 위한 보험의 최고","stem":"보험료의 지급과 지체에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험료는 보험계약자만이 지급의무를 부담하므로 특정한 타인을 위한 보험의 경우에\n보험계약자가 보험료의 지급을 지체한 때에는 보험자는 그 타인에 대한 최고 없이도\n그 계약을 해지할 수 있다."},{"n":"2","text":"보험자의 책임은 당사자 간에 다른 약정이 없으면 최초의 보험료의 지급을 받은 때로부터\n개시한다."},{"n":"3","text":"보험계약자가 보험료를 지급하지 아니하는 경우에는 다른 약정이 없는 한 계약성립 후\n2월이 경과하면 그 계약은 해제된 것으로 본다."},{"n":"4","text":"계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 상당한 기간을 정하여 보험\n계약자에게 최고하고 그 기간 내에 지급되지 아니한 때에는 그 계약을 해지할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n특정한 타인을 위한 보험에서 보험료 연체로 해지하려면 그 타인에게도 상당한 기간을 정하여 최고해야 한다. 최고 없이 해지할 수 있다는 ①이 틀리다.\n\n오답 확인\n② 책임개시는 다른 약정이 없으면 최초보험료 수령 때이다. ③ 최초보험료 미지급은 원칙적으로 계약 성립 후 2개월에 해제 간주, ④ 계속보험료 미지급은 최고 후 해지가 원칙이다.\n\n근거·학습주제\n상법 제650조·제656조","explanationSections":[{"label":"정답 근거","text":"특정한 타인을 위한 보험에서 보험료 연체로 해지하려면 그 타인에게도 상당한 기간을 정하여 최고해야 한다. 최고 없이 해지할 수 있다는 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"② 책임개시는 다른 약정이 없으면 최초보험료 수령 때이다. ③ 최초보험료 미지급은 원칙적으로 계약 성립 후 2개월에 해제 간주, ④ 계속보험료 미지급은 최고 후 해지가 원칙이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조·제656조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["7-6","12-7","11-7","9-6","10-5","3-8","1-6","4-9","3-7","1-10","8-6","12-3","8-12","6-18","12-6","5-17","8-7","2-4","4-6","5-7","7-5","11-2"]},{"id":"2-6","round":2,"year":2016,"number":6,"subject":"상법(보험편)","topic":"보험계약 부활의 대상","stem":"보험계약의 부활에 관하여 ( )에 들어갈 내용으로 옳은 것은?\n( )되고 해지환급금이 지급되지 아니한 경우에 보험계약자는 일정한 기간\n내에 연체보험료에 약정이자를 붙여 보험자에게 지급하고 그 계약의 부활을\n청구할 수 있다.","options":[{"n":"1","text":"위험변경증가의 통지의무 위반으로 인하여 보험계약이 해지"},{"n":"2","text":"고지의무위반으로 인하여 보험계약이 해지"},{"n":"3","text":"계속보험료의 불지급으로 인하여 보험계약이 해지"},{"n":"4","text":"보험계약의 전부가 무효로"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n계속보험료 불지급으로 해지되고 해지환급금이 지급되지 않은 계약이 부활 청구 대상이므로 ③이다. 연체보험료에 약정이자를 붙여 지급하고 부활을 청구한다.\n\n오답 확인\n위험변경 통지 위반, 고지의무 위반으로 해지된 계약 또는 무효 계약까지 이 부활 규정의 대상으로 확대하지 않는다. 최초보험료 연체 해제와 계속보험료 연체 해지도 구별한다.\n\n근거·학습주제\n상법 제650조의2","explanationSections":[{"label":"정답 근거","text":"계속보험료 불지급으로 해지되고 해지환급금이 지급되지 않은 계약이 부활 청구 대상이므로 ③이다. 연체보험료에 약정이자를 붙여 지급하고 부활을 청구한다.","kind":"reason"},{"label":"오답 확인","text":"위험변경 통지 위반, 고지의무 위반으로 해지된 계약 또는 무효 계약까지 이 부활 규정의 대상으로 확대하지 않는다. 최초보험료 연체 해제와 계속보험료 연체 해지도 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조의2","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["11-8","8-8","4-9","1-7","10-5"]},{"id":"2-7","round":2,"year":2016,"number":7,"subject":"상법(보험편)","topic":"유상계약인 보험","stem":"보험계약의 성질이 아닌 것은?","options":[{"n":"1","text":"낙성계약"},{"n":"2","text":"무상계약"},{"n":"3","text":"불요식계약"},{"n":"4","text":"선의계약"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험은 보험료를 지급하는 대가로 위험보장을 받는 유상계약이다. 따라서 무상계약이라는 ②는 보험계약의 성질이 아니다.\n\n오답 확인\n낙성은 청약·승낙의 합치로 성립함을, 불요식은 증권 작성이 계약성립의 필수 형식이 아님을 뜻한다. 선의계약이라는 성질은 고지의무 등과 연결된다.\n\n근거·학습주제\n상법 제638조 및 보험계약의 법적 성질","explanationSections":[{"label":"정답 근거","text":"보험은 보험료를 지급하는 대가로 위험보장을 받는 유상계약이다. 따라서 무상계약이라는 ②는 보험계약의 성질이 아니다.","kind":"reason"},{"label":"오답 확인","text":"낙성은 청약·승낙의 합치로 성립함을, 불요식은 증권 작성이 계약성립의 필수 형식이 아님을 뜻한다. 선의계약이라는 성질은 고지의무 등과 연결된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조 및 보험계약의 법적 성질","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":[]},{"id":"2-8","round":2,"year":2016,"number":8,"subject":"상법(보험편)","topic":"승낙통지·취소·증권교부","stem":"( )에 들어갈 내용이 순서대로 올바르게 연결된 것은?\nㄱ. 보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의 전부\n또는 일부의 지급을 받은 때에는 다른 약정이 없으면 ( ) 그 상대방에\n대하여 낙부의 통지를 발송하여야 한다.\nㄴ. 보험자가 보험약관의 교부ㆍ설명 의무를 위반한 경우 보험계약자는 보험\n계약이 성립한 날부터 ( ) 그 계약을 취소할 수 있다.\nㄷ. 보험자는 보험계약이 성립한 때에는 ( ) 보험증권을 작성하여 보험계약\n자에게 교부하여야 한다.","options":[{"n":"1","text":"30일내에 - 3개월 이내에 - 지체없이"},{"n":"2","text":"30일내에 - 30일내에 - 지체없이"},{"n":"3","text":"지체없이 - 3개월 이내에 - 30일내에"},{"n":"4","text":"지체없이 - 30일내에 - 30일내에"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n청약과 함께 보험료 상당액을 받은 경우 원칙적으로 30일 내 낙부 통지를 발송한다. 교부·설명의무 위반 취소는 계약 성립일부터 3개월 이내이고 증권은 지체 없이 교부하므로 ①이다.\n\n오답 확인\n30일은 청약에 대한 낙부 통지, 3개월은 약관의무 위반 취소기간이다. 두 기간과 증권교부의 '지체 없이'를 서로 바꾸지 않는다.\n\n근거·학습주제\n상법 제638조의2·제638조의3·제640조","explanationSections":[{"label":"정답 근거","text":"청약과 함께 보험료 상당액을 받은 경우 원칙적으로 30일 내 낙부 통지를 발송한다. 교부·설명의무 위반 취소는 계약 성립일부터 3개월 이내이고 증권은 지체 없이 교부하므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"30일은 청약에 대한 낙부 통지, 3개월은 약관의무 위반 취소기간이다. 두 기간과 증권교부의 '지체 없이'를 서로 바꾸지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의2·제638조의3·제640조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["3-2","9-1"]},{"id":"2-9","round":2,"year":2016,"number":9,"subject":"상법(보험편)","topic":"협정보험가액의 현저한 초과","stem":"손해보험계약에서의 보험가액에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"초과보험에서 보험가액은 계약당시의 가액에 의하여 정한다."},{"n":"2","text":"일부보험이란 보험가액의 일부를 보험에 붙인 경우를 말한다."},{"n":"3","text":"당사자 간에 보험가액을 정하지 아니한 때에는 사고발생시의 가액을 보험가액으로 한다."},{"n":"4","text":"기평가보험에서의 보험가액이 사고발생시의 가액을 현저하게 초과할 때에는 계약당시에 정\n한 보험가액으로 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n협정한 가액이 사고 시 실제 가액을 현저하게 초과하면 실제 사고 시 가액이 기준이다. 계약 당시 협정액을 그대로 적용한다는 ④가 틀리다.\n\n오답 확인\n초과보험은 계약 당시 가액으로 판단하는 규정이 있다. 미평가보험은 사고 시 가액이 원칙이다. 보험가액을 언제 평가하는지와 협정액의 효력을 구별한다.\n\n근거·학습주제\n상법 제669조·제670조·제671조","explanationSections":[{"label":"정답 근거","text":"협정한 가액이 사고 시 실제 가액을 현저하게 초과하면 실제 사고 시 가액이 기준이다. 계약 당시 협정액을 그대로 적용한다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"초과보험은 계약 당시 가액으로 판단하는 규정이 있다. 미평가보험은 사고 시 가액이 원칙이다. 보험가액을 언제 평가하는지와 협정액의 효력을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조·제670조·제671조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["9-12","6-25","12-15","11-16","3-20","5-15","10-15","1-16","4-17","8-16","11-18","7-13"]},{"id":"2-10","round":2,"year":2016,"number":10,"subject":"상법(보험편)","topic":"보험목적 양도의 통지","stem":"손해보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"피보험자도 손해방지의무를 부담한다."},{"n":"2","text":"보험자는 손해의 방지와 경감을 위하여 필요 또는 유익하였던 비용과 보상액이 보험금액을\n초과하는 경우에도 이를 부담한다."},{"n":"3","text":"보험목적의 양도 사실의 통지의무는 양도인만이 부담한다."},{"n":"4","text":"보험자는 보험목적의 하자로 인한 손해를 보상할 책임이 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험목적을 양도하면 양도인 또는 양수인이 지체 없이 보험자에게 통지해야 한다. 양도인만 의무를 진다는 ③이 틀리다.\n\n오답 확인\n피보험자도 손해방지의무를 부담한다. 필요·유익한 방지비용은 보상액과 합쳐 가입금액을 넘더라도 보상될 수 있다. 보험목적의 하자에 의한 손해는 원칙적 면책이다.\n\n근거·학습주제\n상법 제679조·제680조·제678조","explanationSections":[{"label":"정답 근거","text":"보험목적을 양도하면 양도인 또는 양수인이 지체 없이 보험자에게 통지해야 한다. 양도인만 의무를 진다는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"피보험자도 손해방지의무를 부담한다. 필요·유익한 방지비용은 보상액과 합쳐 가입금액을 넘더라도 보상될 수 있다. 보험목적의 하자에 의한 손해는 원칙적 면책이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제679조·제680조·제678조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["1-21","12-21","4-23","5-22","10-21","8-23","7-21","11-20"]},{"id":"2-11","round":2,"year":2016,"number":11,"subject":"상법(보험편)","topic":"초과보험의 감액","stem":"손해보험에서 보험가액과 보험금액과의 관계에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험금액이 보험계약의 목적의 가액을 현저하게 초과한 때에 보험자는 보험금액의 감액을\n청구할 수 있지만, 보험계약자는 보험료의 감액을 청구할 수 없다."},{"n":"2","text":"일부보험의 경우에 보험계약의 당사자들은 보험자가 보험금액의 보험가액에 대한 비율과\n상관없이 보험금액의 한도 내에서 그 손해를 보상할 책임이 있다는 약정을 할 수 있다."},{"n":"3","text":"중복보험에서 수인의 보험자 중 1인에 대하여 피보험자가 권리를 포기하여도 다른 보험자의\n권리의무에 영향을 미치지 않는다."},{"n":"4","text":"중복보험에서 보험자가 각자의 보험금액의 한도에서 연대책임을 지는 경우 각 보험자의\n보상책임은 각자의 보험금액의 비율에 따른다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험금액이 목적 가액을 현저하게 초과하면 보험자는 보험금액의, 계약자는 보험료의 감액을 청구할 수 있다. 계약자에게 감액청구권이 없다고 한 ①이 틀리다.\n\n오답 확인\n② 일부보험의 비례보상은 다른 약정으로 배제할 수 있다. ③ 중복보험의 권리포기는 다른 보험자에게 영향을 주지 않는다. ④ 대외적 연대책임과 보험자들 사이의 분담비율을 구별한다.\n\n근거·학습주제\n상법 제669조·제672조·제673조·제674조","explanationSections":[{"label":"정답 근거","text":"보험금액이 목적 가액을 현저하게 초과하면 보험자는 보험금액의, 계약자는 보험료의 감액을 청구할 수 있다. 계약자에게 감액청구권이 없다고 한 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"② 일부보험의 비례보상은 다른 약정으로 배제할 수 있다. ③ 중복보험의 권리포기는 다른 보험자에게 영향을 주지 않는다. ④ 대외적 연대책임과 보험자들 사이의 분담비율을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제669조·제672조·제673조·제674조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["9-18","4-19","7-17","3-19","8-16","10-16","5-18","11-15","5-14","11-18","12-14","9-19","12-18","3-22","1-17","6-24","10-11","3-12","9-11","6-3","11-12","9-13","12-10","4-12"]},{"id":"2-12","round":2,"year":2016,"number":12,"subject":"상법(보험편)","topic":"자연소모에 대한 면책","stem":"손해보험계약에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"피보험이익은 반드시 금전으로 산정할 수 있어야 하는 것은 아니다."},{"n":"2","text":"보험사고로 인하여 상실된 피보험자가 얻을 이익은 당사자 간에 다른 약정이 없으면 보험자가\n보상할 손해액에 산입한다."},{"n":"3","text":"피보험이익은 보험의 목적을 의미한다."},{"n":"4","text":"보험자는 보험의 목적인 기계의 자연적 소모로 인한 손해에 대하여는 보상책임이 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n기계의 자연적 소모는 보험목적 자체의 성질·하자·자연소모에 의한 손해로서 원칙적 면책이므로 ④이다.\n\n오답 확인\n피보험이익은 금전 평가가 가능해야 한다. 특약이 없으면 일실이익을 산입하지 않는다. 보험목적은 물건 등의 대상, 피보험이익은 그 물건에 대해 갖는 경제적 이해관계이다.\n\n근거·학습주제\n상법 제668조·제676조·제678조","explanationSections":[{"label":"정답 근거","text":"기계의 자연적 소모는 보험목적 자체의 성질·하자·자연소모에 의한 손해로서 원칙적 면책이므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"피보험이익은 금전 평가가 가능해야 한다. 특약이 없으면 일실이익을 산입하지 않는다. 보험목적은 물건 등의 대상, 피보험이익은 그 물건에 대해 갖는 경제적 이해관계이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제668조·제676조·제678조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["7-20","9-17","8-15","10-19","7-13"]},{"id":"2-13","round":2,"year":2016,"number":13,"subject":"상법(보험편)","topic":"고지의무자와 중요사항의 추정","stem":"고지의무에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험자는 보험대리상의 고지수령권을 제한할 수 없다."},{"n":"2","text":"보험자가 서면으로 질문한 사항은 중요한 고지사항으로 간주된다."},{"n":"3","text":"보험계약자는 고지의무가 있다."},{"n":"4","text":"보험자는 보험사고 발생 전에 한하여 고지의무 위반을 이유로 하여 해지할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n계약자는 계약 체결 시 중요한 사항에 대한 고지의무를 부담하므로 ③이 옳다. 피보험자도 고지의무자이다.\n\n오답 확인\n① 보험대리상의 권한을 제한할 수 있으나 선의의 계약자에게 그 제한을 주장하지 못한다는 규정과 구별한다. ② 서면질문 사항은 '간주'가 아니라 '추정'한다. ④ 사고 후 해지도 가능하다.\n\n근거·학습주제\n상법 제646조의2·제651조·제651조의2","explanationSections":[{"label":"정답 근거","text":"계약자는 계약 체결 시 중요한 사항에 대한 고지의무를 부담하므로 ③이 옳다. 피보험자도 고지의무자이다.","kind":"reason"},{"label":"오답 확인","text":"① 보험대리상의 권한을 제한할 수 있으나 선의의 계약자에게 그 제한을 주장하지 못한다는 규정과 구별한다. ② 서면질문 사항은 '간주'가 아니라 '추정'한다. ④ 사고 후 해지도 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2·제651조·제651조의2","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["1-13","9-8","12-8","4-7","3-9","8-9","11-9","1-8","7-7"]},{"id":"2-14","round":2,"year":2016,"number":14,"subject":"상법(보험편)","topic":"위험변경 통지의무의 귀책요건","stem":"위험변경증가의 통지의무에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자는 보험계약자 또는 피보험자가 위험변경증가의 통지의무를 고의 또는 중과실로\n해태한 경우에만 그 통지의무 위반을 이유로 계약을 해지할 수 있다."},{"n":"2","text":"보험기간 중에 보험계약자는 사고발생의 위험의 현저한 증가 사실을 안 때에는 지체없이\n보험자에게 통지하여야 한다."},{"n":"3","text":"보험기간 중에 피보험자는 사고발생의 위험의 현저한 변경 사실을 안 때에는 지체없이\n보험자에게 통지하여야 한다."},{"n":"4","text":"보험자가 피보험자로부터 위험변경증가의 통지를 받은 때에는 1월내에 보험료의 증액을\n청구하거나 계약을 해지할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n위험변경·증가 통지의무 위반에 따른 해지에 고의·중과실만을 요구하는 ①이 틀리다. 고지의무 위반의 귀책요건을 통지의무에 그대로 옮겨 놓은 보기이다.\n\n오답 확인\n계약자와 피보험자는 현저한 위험변경·증가를 알면 지체 없이 알려야 한다. 통지를 받은 보험자는 1개월 내 증액청구 또는 해지를 할 수 있다.\n\n근거·학습주제\n상법 제652조","explanationSections":[{"label":"정답 근거","text":"위험변경·증가 통지의무 위반에 따른 해지에 고의·중과실만을 요구하는 ①이 틀리다. 고지의무 위반의 귀책요건을 통지의무에 그대로 옮겨 놓은 보기이다.","kind":"reason"},{"label":"오답 확인","text":"계약자와 피보험자는 현저한 위험변경·증가를 알면 지체 없이 알려야 한다. 통지를 받은 보험자는 1개월 내 증액청구 또는 해지를 할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["4-10","7-9","11-10","9-15","3-10","10-9","1-9","6-19","11-11","8-10","7-12","4-11","12-9","10-10","4-6","7-10","5-9","3-11","9-16"]},{"id":"2-15","round":2,"year":2016,"number":15,"subject":"상법(보험편)","topic":"보험료청구권의 2년 시효","stem":"소멸시효기간이 다른 하나는?","options":[{"n":"1","text":"보험금청구권"},{"n":"2","text":"보험료청구권"},{"n":"3","text":"보험료의 반환청구권"},{"n":"4","text":"적립금의 반환청구권"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험료청구권만 2년이고 보험금청구권, 보험료·적립금 반환청구권은 3년이므로 ②이다. 보험료를 '내라는 청구'와 '돌려달라는 청구'의 방향을 구분한다.\n\n오답 확인\n반환청구권을 보험료청구권과 같은 2년으로 외우면 틀린다. 보험금청구권도 2015년 시행 개정에 따라 이미 3년이 적용되는 시기의 문제이다.\n\n근거·학습주제\n상법 제662조","explanationSections":[{"label":"정답 근거","text":"보험료청구권만 2년이고 보험금청구권, 보험료·적립금 반환청구권은 3년이므로 ②이다. 보험료를 '내라는 청구'와 '돌려달라는 청구'의 방향을 구분한다.","kind":"reason"},{"label":"오답 확인","text":"반환청구권을 보험료청구권과 같은 2년으로 외우면 틀린다. 보험금청구권도 2015년 시행 개정에 따라 이미 3년이 적용되는 시기의 문제이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제662조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["5-10","9-9","6-21","12-11","1-2","11-13"]},{"id":"2-16","round":2,"year":2016,"number":16,"subject":"상법(보험편)","topic":"약관 교부와 증권 교부의 구분","stem":"보험약관의 교부ㆍ설명의무에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험약관에 기재되어 있는 보험료와 그 지급방법, 보험자의 면책사유는\n보험자가 보험계약을 체결할 때 보험계약자에게 설명하여야 하는 중요한\n내용에 해당한다.\nㄴ. 보험자는 보험계약이 성립하면 지체없이 보험약관을 보험계약자에게 교부\n하여야 하나, 그 보험계약자가 보험료의 전부나 최초 보험료를 지급하지\n아니한 때에는 보험약관을 교부하지 않아도 된다.\nㄷ. 보험계약이 성립한 날로부터 2개월이 경과한 시점이라면 보험자가 상법상\n보험약관의 교부ㆍ설명의무를 위반한 경우에도 그 계약을 취소할 수 없다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄷ"},{"n":"3","text":"ㄱ, ㄴ"},{"n":"4","text":"ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험료와 지급방법, 면책사유 등은 중요한 설명대상이므로 ㄱ만 옳아 ①이다. 약관 교부·설명의무는 계약 체결 때 이행해야 한다.\n\n오답 확인\nㄴ은 보험료 미지급 때 유보할 수 있는 '보험증권 교부'와 약관 교부를 혼동했다. ㄷ의 취소기간은 2개월이 아니라 성립일부터 3개월이다.\n\n근거·학습주제\n상법 제638조의3·제640조","explanationSections":[{"label":"정답 근거","text":"보험료와 지급방법, 면책사유 등은 중요한 설명대상이므로 ㄱ만 옳아 ①이다. 약관 교부·설명의무는 계약 체결 때 이행해야 한다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ은 보험료 미지급 때 유보할 수 있는 '보험증권 교부'와 약관 교부를 혼동했다. ㄷ의 취소기간은 2개월이 아니라 성립일부터 3개월이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·제640조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["3-3","8-2","5-2","10-2","7-8","8-3","6-13"]},{"id":"2-17","round":2,"year":2016,"number":17,"subject":"상법(보험편)","topic":"집합보험과 보험대위","stem":"손해보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간 중\n수시로 교체된 경우에도 보험사고의 발생 시에 현존하는 물건은 보험의 목적에 포함된 것\n으로 한다."},{"n":"2","text":"보험계약자는 불특정의 타인을 위하여는 보험계약을 체결할 수 없다."},{"n":"3","text":"손해가 피보험자와 생계를 같이 하는 가족의 고의로 인하여 발생한 경우에 보험금의 전부를\n지급한 보험자는 그 지급한 금액의 한도에서 그 가족에 대한 피보험자의 권리를 취득하지\n못한다."},{"n":"4","text":"타인을 위한 보험에서 보험계약자가 보험료의 지급을 지체한 때에는 그 타인이 그 권리를\n포기하여도 그 타인은 보험료를 지급하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n집합물건의 구성품이 기간 중 교체되어도 사고 시 현존하는 물건을 보험목적에 포함하므로 ①이다. 재고자산처럼 내용이 수시로 바뀌는 집합보험의 특성이다.\n\n오답 확인\n② 불특정 타인을 위한 보험도 가능하다. ③ 생계를 같이하는 가족에 대한 대위 제한은 고의사고에는 예외가 있다. ④ 타인이 보험상 권리를 포기한 경우와 보험료 지급의무를 구별한다.\n\n근거·학습주제\n상법 제639조·제682조·제686조","explanationSections":[{"label":"정답 근거","text":"집합물건의 구성품이 기간 중 교체되어도 사고 시 현존하는 물건을 보험목적에 포함하므로 ①이다. 재고자산처럼 내용이 수시로 바뀌는 집합보험의 특성이다.","kind":"reason"},{"label":"오답 확인","text":"② 불특정 타인을 위한 보험도 가능하다. ③ 생계를 같이하는 가족에 대한 대위 제한은 고의사고에는 예외가 있다. ④ 타인이 보험상 권리를 포기한 경우와 보험료 지급의무를 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조·제682조·제686조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["12-25","10-25","12-22","3-18","7-2","11-23","11-22","5-23","9-25","5-13","7-25","6-12","4-25","11-2","9-2","6-10","3-4","5-3"]},{"id":"2-18","round":2,"year":2016,"number":18,"subject":"상법(보험편)","topic":"보험금 지급기간의 기산점","stem":"손해보험에 있어서 보험사고와 보험금지급에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"피보험자는 보험사고의 발생을 안 때에는 지체없이 보험자에게 그 통지를 발송하여야 한다."},{"n":"2","text":"보험자는 보험금액의 지급에 관하여 약정기간이 없는 경우는 보험사고 발생의 통지를 받은\n날로부터 10일내에 피보험자 또는 보험수익자에게 보험금액을 지급하여야 한다."},{"n":"3","text":"보험사고가 보험계약자의 중대한 과실로 인하여 생긴 때에는 보험자는 보험금액을 지급할\n책임이 없다."},{"n":"4","text":"보험사고가 전쟁으로 인하여 생긴 때에는 당사자 간에 다른 약정이 없으면 보험자는 보험\n금액을 지급할 책임이 없다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n지급기간 약정이 없으면 보험자는 지급보험금을 지체 없이 정하고, 정한 날부터 10일 이내 지급한다. 사고통지를 받은 날부터 무조건 10일이라는 ②가 틀리다.\n\n오답 확인\n① 사고발생을 안 피보험자는 지체 없이 통지해야 한다. ③ 계약자의 중과실, ④ 별도 약정 없는 전쟁위험은 원칙적 면책사유이다.\n\n근거·학습주제\n상법 제657조·제658조·제659조·제660조","explanationSections":[{"label":"정답 근거","text":"지급기간 약정이 없으면 보험자는 지급보험금을 지체 없이 정하고, 정한 날부터 10일 이내 지급한다. 사고통지를 받은 날부터 무조건 10일이라는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 사고발생을 안 피보험자는 지체 없이 통지해야 한다. ③ 계약자의 중과실, ④ 별도 약정 없는 전쟁위험은 원칙적 면책사유이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제657조·제658조·제659조·제660조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["12-10","3-12","9-13","10-11","4-12","8-12","11-12","7-14","11-11","12-18","10-10","5-9","7-12","3-11","1-11","4-11","8-20","7-11","8-1","9-16"]},{"id":"2-19","round":2,"year":2016,"number":19,"subject":"상법(보험편)","topic":"손해보험증권의 기재사항","stem":"손해보험증권에 반드시 기재해야 하는 사항이 아닌 것은?","options":[{"n":"1","text":"보험의 목적"},{"n":"2","text":"보험자의 설립년월일"},{"n":"3","text":"보험료와 그 지급방법"},{"n":"4","text":"무효와 실권의 사유"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n보험자의 설립년월일은 손해보험증권의 법정 필수 기재사항이 아니므로 ②이다. 보험자를 특정하는 명칭 등과 설립일을 구별한다.\n\n오답 확인\n보험목적, 보험료·지급방법, 무효·실권사유는 증권에 기재할 사항이다. 보험업자의 회사정보 전부가 증권의 법정 필수사항이 되는 것은 아니다.\n\n근거·학습주제\n상법 제666조","explanationSections":[{"label":"정답 근거","text":"보험자의 설립년월일은 손해보험증권의 법정 필수 기재사항이 아니므로 ②이다. 보험자를 특정하는 명칭 등과 설립일을 구별한다.","kind":"reason"},{"label":"오답 확인","text":"보험목적, 보험료·지급방법, 무효·실권사유는 증권에 기재할 사항이다. 보험업자의 회사정보 전부가 증권의 법정 필수사항이 되는 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["6-23","10-14","12-13"]},{"id":"2-20","round":2,"year":2016,"number":20,"subject":"상법(보험편)","topic":"일부보험의 금액관계","stem":"일부보험에 있어서 일부손해가 발생하여 비례보상원칙을 적용한 결과에 관한 설명으로\n옳지 않은 것은?","options":[{"n":"1","text":"손해액은 보험가액보다 적다."},{"n":"2","text":"보험가액은 보상액보다 크다."},{"n":"3","text":"보상액은 손해액보다 적다."},{"n":"4","text":"보험금액은 보험가액보다 크다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n일부보험은 보험금액이 보험가액보다 작은 경우이므로 반대로 설명한 ④가 틀리다. 일부손해에서는 손해액도 보험가액보다 작다.\n\n오답 확인\n비례보상액=손해액×보험금액/보험가액이다. 이 비율이 1 미만이므로 보상액은 손해액보다 작고 보험가액보  손해액에 산입한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n손해액은 별도 약정이 없으면 손해가 발생한 때와 장소의 가액을 기준으로 산정하므로 ①이다.\n\n오답 확인\n② 신품가액 보상은 이를 적용하는 약정과 구별한다. ③ 손해액 산정비용은 보험자 부담이다. ④ 별도 약정이 없으면 일실 보수·이익은 손해액에 산입하지 않는다.\n\n근거·학습주제\n상법 제676조","explanationSections":[{"label":"정답 근거","text":"손해액은 별도 약정이 없으면 손해가 발생한 때와 장소의 가액을 기준으로 산정하므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"② 신품가액 보상은 이를 적용하는 약정과 구별한다. ③ 손해액 산정비용은 보험자 부담이다. ④ 별도 약정이 없으면 일실 보수·이익은 손해액에 산입하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["10-19","1-19","6-4","7-20","3-25","12-19","9-20","4-21","8-21","5-20","7-13"]},{"id":"2-23","round":2,"year":2016,"number":23,"subject":"상법(보험편)","topic":"잔존물대위의 요건","stem":"상법 제681조(보험목적에 관한 보험대위)의 내용이다. ( )에 들어갈 내용을 순서대로\n올바르게 연결된 것은?\n보험의 목적의 ( )가 멸실한 경우에 보험금액의 ( )를 지급한 보험자는\n그 목적에 대한 피보험자의 권리를 취득한다. 그러나 보험가액의 ( )를\n보험에 붙인 경우에는 보험자가 취득할 권리는 보험금액의 보험가액에 대한\n비율에 따라 이를 정한다.","options":[{"n":"1","text":"전부 또는 일부 - 일부 - 전부"},{"n":"2","text":"전부 - 일부 - 일부"},{"n":"3","text":"전부 또는 일부 - 일부 - 일부"},{"n":"4","text":"전부 - 전부 - 일부"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험목적 '전부'가 멸실하고 보험금액 '전부'를 지급한 경우 법정 잔존물대위가 성립한다. 보험가액의 '일부'만 가입한 경우 취득비율이 달라지므로 ④이다.\n\n오답 확인\n전부멸실 요건과 보험금액 전액 지급 요건을 각각 충족해야 한다. 일부보험이라고 해서 대위가 전혀 성립하지 않는 것은 아니고 권리취득 비율이 가입금액/가액으로 조정된다.\n\n근거·학습주제\n상법 제681조","explanationSections":[{"label":"정답 근거","text":"보험목적 '전부'가 멸실하고 보험금액 '전부'를 지급한 경우 법정 잔존물대위가 성립한다. 보험가액의 '일부'만 가입한 경우 취득비율이 달라지므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"전부멸실 요건과 보험금액 전액 지급 요건을 각각 충족해야 한다. 일부보험이라고 해서 대위가 전혀 성립하지 않는 것은 아니고 권리취득 비율이 가입금액/가액으로 조정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제681조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":13,"similarIds":["4-24"]},{"id":"2-24","round":2,"year":2016,"number":24,"subject":"상법(보험편)","topic":"미지급 보험료의 공제","stem":"보험계약에 관한 설명으로 옳지 않은 실제 지급금액을 구별한다.","kind":"reason"},{"label":"오답 확인","text":"보험료는 가입자가 보험자에게 지급하는 대가이다. 손해평가액은 평가한 손해액으로, 자기부담금·지급한도 등 때문에 보험금과 다를 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제2조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":15,"similarIds":["3-35","1-27","10-39","11-32","9-26"]},{"id":"2-28","round":2,"year":2016,"number":28,"subject":"농어업재해보험법령","topic":"법정 보험종류의 명칭","stem":"농어업재해보험법상 재해보험의 종류와 보험목적물로 옳지 않은 것은?","options":[{"n":"1","text":"농작물재해보험: 농작물 및 농업용 시설물"},{"n":"2","text":"임산물재해보험: 임산물 및 임업용 시설물"},{"n":"3","text":"축산물재해보험: 축산물 및 축산시설물"},{"n":"4","text":"양식수산물재해보험: 양식수산물 및 양식시설물"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n법은 '가축재해보험'을 규정하고 보험목적은 가축과 축산시설물이다. '축산물재해보험: 축산물'이라는 ③은 법정 명칭과 대상이 모두 어긋난다.\n\n오답 확인\n농작물·농업용 시설, 임산물·임업용 시설, 양식수산물·양식시설의 대응은 옳다. 가축 자체와 도축·가공 후 축산물을 혼동하지 않는다.\n\n근거·학습주제\n농어업재해보험법 제4조·제5조","explanationSections":[{"label":"정답 근거","text":"법은 '가축재해보험'을 규정하고 보험목적은 가축과 축산시설물이다. '축산물재해보험: 축산물'이라는 ③은 법정 명칭과 대상이 모두 어긋난다.","kind":"reason"},{"label":"오답 확인","text":"농작물·농업용 시설, 임산물·임업용 시설, 양식수산물·양식시설의 대응은 옳다. 가축 자체와 도축·가공 후 축산물을 혼동하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제4조·제5조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["9-40","10-27","1-28","12-27","4-42"]},{"id":"2-29","round":2,"year":2016,"number":29,"subject":"농어업재해보험법령","topic":"손해평가와 보험금 산정의 구별","stem":"농업재해보험 손해평가요령에 따른 손해평가인의 업무에 해당하는 것을 모두 고른 것은?\nㄱ. 보험가액 평가 ㄴ. 손해액 평가 ㄷ. 보험금 산정","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄱ, ㄷ"},{"n":"4","text":"ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n손해평가인은 보험가액과 손해액을 평가하므로 ㄱ·ㄴ인 ②이다. 평가결과를 바탕으로 약관의 자기부담금·한도 등을 적용해 최종 보험금을 정하는 단계와 구별한다.\n\n오답 확인\n피해사실 확인·가액 및 손해액 평가는 손해평가의 중심이다. 보험금 지급 여부와 최종 금액의 결정까지 평가인의 법정 평가 업무와 동일시하지 않는다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제2조","explanationSections":[{"label":"정답 근거","text":"손해평가인은 보험가액과 손해액을 평가하므로 ㄱ·ㄴ인 ②이다. 평 법이 정한 취소사유를 추가할 수 없다. 자격증 대여는 타인에게 자기 명의로 업무를 하게 하는 행위와 함께 금지되는 사항이다.\n\n근거·학습주제\n농어업재해보험법 제11조의5(출제 당시)","explanationSections":[{"label":"정답 근거","text":"부정한 자격취득, 거짓 손해평가, 자격증 대여는 자격취소 사유이므로 ㄱ·ㄴ·ㄹ인 ③이다.","kind":"reason"},{"label":"오답 확인","text":"직무 중 부적절했다는 추상적 평가만으로 법이 정한 취소사유를 추가할 수 없다. 자격증 대여는 타인에게 자기 명의로 업무를 하게 하는 행위와 함께 금지되는 사항이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의5(출제 당시)","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["1-33","6-33","4-28","3-31","7-31","10-30","11-31","9-32","8-30"]},{"id":"2-32","round":2,"year":2016,"number":32,"subject":"농어업재해보험법령","topic":"보험목적 양도의 효과","stem":"농어업재해보험법령상 내용으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험가입자가 재해보험에 가입된 보험목적물을 양도하는 경우 그 양수인은 재해보험\n계약에 관한 양도인의 권리 및 의무를 승계한 것으로 추정하지 않는다."},{"n":"2","text":"재해보험의 보험금을 지급받을 권리는 압류할 수 없다. 다만, 보험목적물이 담보로 제공된\n경우에는 그러하지 아니하다."},{"n":"3","text":"재해보험사업자는 재해보험사업을 원활히 수행하기 위하여 필요한 경우에는 보험모집 및\n손해평가 등 재해보험 업무의 일부를 대통령령으로 정하는 자에게 위탁할 수 있다."},{"n":"4","text":"농림축산식품부장관은 손해평가사의 손해평가 능력 및 자질 향상을 위하여 교육을 실시할\n수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n가입된 목적물을 양도한 경우 양수인이 계약상 권리·의무를 승계한 것으로 추정하는 규정이 있다. 추정하지 않는다고 부정한 ①이 틀리다.\n\n오답 확인\n보험금 수급권의 압류 제한에는 담보제공 목적물의 예외가 있다. 모집·평가업무 일부의 위탁, 손해평가사 교육에 관한 권한도 각각 법이 인정한다.\n\n근거·학습주제\n농어업재해보험법 목적물 양도·수급권 보호 조항","explanationSections":[{"label":"정답 근거","text":"가입된 목적물을 양도한 경우 양수인이 계약상 권리·의무를 승계한 것으로 추정하는 규정이 있다. 추정하지 않는다고 부정한 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"보험금 수급권의 압류 제한에는 담보제공 목적물의 예외가 있다. 모집·평가업무 일부의 위탁, 손해평가사 교육에 관한 권한도 각각 법이 인정한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 목적물 양도·수급권 보호 조항","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["3-33","9-33","10-31","7-32"]},{"id":"2-33","round":2,"year":2016,"number":33,"subject":"농어업재해보험법령","topic":"국가·지자체의 지원항목","stem":"농어업재해보험법상 재정지원에 관한 내용이다. ( )에 들어갈 용어를 순서대로 나열한 것은?\n정부는 예산의 범위에서 재해보험가입자가 부담하는 ( )의 일 :"농어업재해보험법 제10조(출제 당시)","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["8-28","5-40","7-28"]},{"id":"2-35","round":2,"year":2016,"number":35,"subject":"농어업재해보험법령","topic":"재보험기금의 용도","stem":"농어업재해보험법상 농어업재해재보험기금의 용도에 해당하지 않는 것은?","options":[{"n":"1","text":"재해보험가입자가 부담하는 보험료의 일부 지원"},{"n":"2","text":"제20조제2항제2호에 따른 재보험금의 지급"},{"n":"3","text":"제22조제2항에 따른 차입금의 원리금 상환"},{"n":"4","text":"기금의 관리ㆍ운용에 필요한 경비(위탁경비를 포함한다)의 지출"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n가입자 보험료 일부 지원은 일반 재정지원 항목이며 재보험기금의 법정 용도로 열거된 것이 아니므로 ①이다.\n\n오답 확인\n재보험금 지급, 차입금 원리금 상환, 기금 관리·운용 경비는 기금의 용도이다. 보험료 지원과 재보험을 통한 대규모 위험 분담을 구별한다.\n\n근거·학습주제\n농어업재해보험법 제19조·제23조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"가입자 보험료 일부 지원은 일반 재정지원 항목이며 재보험기금의 법정 용도로 열거된 것이 아니므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"재보험금 지급, 차입금 원리금 상환, 기금 관리·운용 경비는 기금의 용도이다. 보험료 지원과 재보험을 통한 대규모 위험 분담을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제19조·제23조(출제 당시)","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["12-34"]},{"id":"2-36","round":2,"year":2016,"number":36,"subject":"농어업재해보험법령","topic":"기금 결산보고의 제출경로","stem":"농어업재해보험법령상 기금의 관리ㆍ운용 등에 관한 내용으로 옳은 것을 모두 고른 것은?\nㄱ. 기금수탁관리자는 기금의 관리 및 운용을 명확히 하기 위하여 기금을 다른\n회계와 구분하여 회계처리하여야 한다.\nㄴ. 기금수탁관리자는 회계연도마다 기금결산보고서를 작성하여 다음 회계연도\n2월 말일까지 농림축산식품부장관 및 해양수산부장관에게 제출하여야 한다.\nㄷ. 기금수탁관리자는회계연도마다 기금결산보고서를 작성한후 심의회의심의를\n거쳐 다음 회계연도 2월 말일까지 기획재정부장관에게 제출하여야 한다.","options":[{"n":"1","text":"ㄱ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄱ, ㄷ"},{"n":"4","text":"ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\nㄱ만 옳아 ①이다. 수탁관리자는 기금을 다른 회계와 구분하여 처리하고 결산보고서는 다음 회계연도 2월 15일까지 관계 장관에게 제출한다.\n\n오답 확인\nㄴ은 2월 말일까지라고 하여 수탁관리자의 제출기한을 바꿨다. ㄷ의 심의회 심의를 거쳐 기획재정부장관에게 제출하는 주체는 관계 장관이지 수탁관리자가 아니다.\n\n기준 변경 메모\n2026 기본서의 개정 반영본에는 후속 제출 상대 기관의 명칭 변경이 있으므로, 수탁관리자→관계장관의 2월15일과 그 다음 단계의 월말 제출을 나누어 학습한다.\n\n근거·학습주제\n농어업재해보험법 시행령 제18조·제19조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"ㄱ만 옳아 ①이다. 수탁관리자는 기금을 다른 회계와 구분하여 처리하고 결산보고서는 다음 회계연도 2월 15일까지 관계 장관에게 제출한다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ은 2월 말일까지라고 하여 수탁관리자의 제출기한을 바꿨다. ㄷ의 심의회 심의를 거쳐 기획재정부장관에게 제출하는 주체는 관계 장관이지 수탁관리자가 아니다.","kind":"incorrect"},{"label":"기준 변경 메모","text":"2026 기본서의 개정 반영본에는 후속 제출 상대 기관의 명칭 변경이 있으므로, 수탁관리자→관계장관의 2월15일과 그 다음 단계의 월말 제출을 나누어 학습한다.","kind":"note"},{"label":"근거·학습주제","text":"농어업재해보험법 시행령 제18조·제19조(출제 당시)","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["4-37","3-38"]},{"id":"2-37","round":2,"year":2016,"number":37,"subject":"농어업재해보험법령","topic":"재보험사업 위탁기관","stem":"농어업재해보험법령상 농림축산식품부장관으로부터 재보험사업에 관한 업무의 위탁을\n받을 수 있는 자는?","options":[{"n":"1","text":"「보험업법」에 따른 보험회사"},{"n":"2","text":"「농업ㆍ농촌 및 식품산업기본법」제63조의2제1항에 따라 설립된 농업정책보험금융원"},{"n":"3","text":"「정부출연연구기관 등의 설립ㆍ운영 및 육성에 관한 법률」 제8조에 따라 설립된 연구기관"},{"n":"4","text":"「공익법인의 설립ㆍ운영에 관한 법률」 제4조에 따라 농림축산식품부장관 또는 해양수산부\n장관의 허가를 받아 설립된 공익법인"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n장관의 재보험사업 관련 업무를 위탁받는 기관으로 농업정책보험금융원을 정하므로 ②이다.\n\n오답 확인\n일반 보험회사·연구기관·공익법인이 다른 통계·연구 또는 보험업무의 위탁대상일 수 있어도, 이 재보험사업 위탁기관과 동일한 것은 아니다. 위탁하는 업무의 종류부터 구별한다.\n\n근거·학습주제\n농어업재해보험법 제20조 및 당시 시행령","explanationSections":[{"label":"정답 근거","text":"장관의 재보험사업 관련 업무를 위탁받는 기관으로 농업정책보험금융원을 정하므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"일반 보험회사·연구기관·공익법인이 다른 통계·연구 또는 보험업무의 위탁대상일 수 있어도, 이 재보험사업 위탁기관과 동일한 것은 아니다. 위탁하는 업무의 종류부터 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제20조 및 당시 시행령","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":20,"similarIds":["7-33"]},{"id":"2-38","round":2,"year":2016,"number":38,"subject":"농어업재해보험법령","topic":"손해평가 단위","stem":"농업재해보험 손해평가요령에 따른 보험목적물별 손해평가 단위로 옳은 것은?","options":[{"n":"1","text":"사과: 농지별"},{"n":"2","text":"벼: 필지별"},{"n":"3","text":"가축: 개별축사별"},{"n":"4","text":"농업시설물: 지번별"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 ":2016,"number":42,"subject":"농어업재해보험법령","topic":"손해평가의 정의","stem":"농업재해보험 손해평가요령에 관한 내용이다. ( )에 들어갈 용어는?\n( )라 함은 「농어업재해보험법」제2조제1호에 따른 피해가 발생한 경우 법\n제11조 및 제11조의3에 따라 손해평가인, 손해평가사 또는 손해사정사가 그\n피해사실을 확인하고 평가하는 일련의 과정을 말한다.","options":[{"n":"1","text":"피해조사"},{"n":"2","text":"손해평가"},{"n":"3","text":"검증조사"},{"n":"4","text":"현지조사"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n피해 발생 후 손해평가인·손해평가사·손해사정사가 피해사실을 확인하고 평가하는 일련의 과정이 손해평가이므로 ②이다.\n\n오답 확인\n피해조사·현지조사는 절차 중의 행위나 조사방식을 가리키는 표현이다. 검증조사는 이미 실시한 평가의 적정성을 확인하는 별도 절차이다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제2조","explanationSections":[{"label":"정답 근거","text":"피해 발생 후 손해평가인·손해평가사·손해사정사가 피해사실을 확인하고 평가하는 일련의 과정이 손해평가이므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"피해조사·현지조사는 절차 중의 행위나 조사방식을 가리키는 표현이다. 검증조사는 이미 실시한 평가의 적정성을 확인하는 별도 절차이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 제2조","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":22,"similarIds":["1-39","6-36","8-39"]},{"id":"2-43","round":2,"year":2016,"number":43,"subject":"농어업재해보험법령","topic":"손해평가인 보수교육","stem":"농업재해보험 손해평가요령에 따른 손해평가인의 위촉 및 교육에 관한 설명으로 옳지\n않은 것은?","options":[{"n":"1","text":"재해보험사업자는 손해평가인으로 위촉된 자를 대상으로 2년마다 1회 이상의 보수교육을\n실시하여야 한다."},{"n":"2","text":"재해보험사업자는 농어업재해보험이 실시되는 시ㆍ군ㆍ자치구별 보험가입자의 수 등을 고려\n하여 적정 규모의 손해평가인을 위촉하여야 한다."},{"n":"3","text":"재해보험사업자는 손해평가인을 위촉한 경우에는 실무교육을 거쳐 그 자격을 표시할 수\n있는 손해평가인증을 발급하여야 한다."},{"n":"4","text":"재해보험사업자 및 재해보험사업자의 업무를 위탁받은 자는 손해평가보조인을 운용할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n출제 당시 보수교육은 3년마다 1회 이상이므로 2년마다라고 한 ①이 틀리다. 최초 위촉 시 실무교육과 정기 보수교육을 구별한다.\n\n오답 확인\n보험가입자 수 등을 고려한 적정 인력 위촉, 실무교육 후 인증 발급, 사업자·수탁자의 보조인 운용은 요령상 허용·요구되는 내용이다.\n\n근거·학습주제\n농업재해보험 손해평가요령 제3조·제4조(출제 당시)","explanationSections":[{"label":"정답 근거","text":"출제 당시 보수교육은 3년마다 1회 이상이므로 2년마다라고 한 ①이 틀리다. 최초 위촉 시 실무교육과 정기 보수교육을 구별한다.","kind":"reason"},{"label":"오답 확인","text":"보험가입자 수 등을 고려한 적정 인력 위촉, 실무교육 후 인증 발급, 사업자·수탁자의 보조인 운용은 요령상 허용·요구되는 내용이다.","kind":"incorrect"},{"l ":"3","text":"광순화점"},{"n":"4","text":"광포화점"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n광합성에 의한 CO₂ 흡수량과 호흡의 CO₂ 방출량이 같아 순광합성량이 0인 광도가 광보상점이므로 ②이다.\n\n오답 확인\n광포화점은 빛을 더 강하게 해도 광합성량이 거의 늘지 않는 광도이다. 광보상점과 광포화점 사이에서는 빛 증가에 따라 순광합성이 증가할 수 있다.\n\n근거·학습주제\n작물생리: 광합성과 호흡","explanationSections":[{"label":"정답 근거","text":"광합성에 의한 CO₂ 흡수량과 호흡의 CO₂ 방출량이 같아 순광합성량이 0인 광도가 광보상점이므로 ②이다.","kind":"reason"},{"label":"오답 확인","text":"광포화점은 빛을 더 강하게 해도 광합성량이 거의 늘지 않는 광도이다. 광보상점과 광포화점 사이에서는 빛 증가에 따라 순광합성이 증가할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"작물생리: 광합성과 호흡","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":["8-58","5-59"]},{"id":"2-54","round":2,"year":2016,"number":54,"subject":"재배학·원예작물학","topic":"국화의 야간전조","stem":"단일일장(short day length) 조건에서 개화 억제를 위해 야간에 보광을 실시하는 작물은?","options":[{"n":"1","text":"장미"},{"n":"2","text":"가지"},{"n":"3","text":"국화"},{"n":"4","text":"토마토"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n국화는 대표적 단일식물이다. 밤중에 보광해 암기를 끊으면 단일 조건에서의 화아분화가 억제되어 출하시기를 늦출 수 있으므로 ③이다.\n\n오답 확인\n전조는 단순히 하루의 광합성량을 늘리는 목적만 있는 것이 아니다. 이 문항은 밤 길이의 인식을 바꾸는 일장조절 효과를 묻는다.\n\n근거·학습주제\n화훼학: 국화의 일장조절","explanationSections":[{"label":"정답 근거","text":"국화는 대표적 단일식물이다. 밤중에 보광해 암기를 끊으면 단일 조건에서의 화아분화가 억제되어 출하시기를 늦출 수 있으므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"전조는 단순히 하루의 광합성량을 늘리는 목적만 있는 것이 아니다. 이 문항은 밤 길이의 인식을 바꾸는 일장조절 효과를 묻는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학: 국화의 일장조절","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":27,"similarIds":[]},{"id":"2-55","round":2,"year":2016,"number":55,"subject":"재배학·원예작물학","topic":"작물별 요수량","stem":"건물 1 g을 생산하는 데 필요한 수분량인 요수량(要水量)이 가장 높은 작물은?","options":[{"n":"1","text":"기장"},{"n":"2","text":"옥수수"},{"n":"3","text":"밀"},{"n":"4","text":"호박"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보기 중 호박의 요수량이 가장 높아 ④이다. 요수량은 건물 1g 생산에 소비한 물의 양으로, 값이 클수록 같은 건물 생산에 더 많은 물이 필요하다는 뜻이다.\n\n오답 확인\n기장·옥수수  방사한다.","kind":"reason"},{"label":"오답 확인","text":"윤작은 경종적 방제, 멀칭·차단필름과 태양열 소독은 물리적 방제에 해당한다. 농약을 사용하지 않는 방법이 모두 생물적 방제인 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"병해충관리: 방제법 분류","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":[]},{"id":"2-58","round":2,"year":2016,"number":58,"subject":"재배학·원예작물학","topic":"해충과 천적","stem":"해충과 천적의 관계가 바르게 짝지어지지 않은 것은?","options":[{"n":"1","text":"잎응애류 - 칠레이리응애"},{"n":"2","text":"진딧물류 - 온실가루이"},{"n":"3","text":"총채벌레류 - 애꽃노린재"},{"n":"4","text":"굴파리류 - 굴파리좀벌"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n온실가루이는 진딧물의 천적이 아니라 식물의 즙을 빨아 먹는 해충이므로 ②의 짝이 틀리다.\n\n오답 확인\n칠레이리응애는 잎응애류의 포식성 천적, 애꽃노린재는 총채벌레 등을 잡아먹는 천적, 굴파리좀벌은 굴파리류의 기생성 천적이다.\n\n근거·학습주제\n원예해충: 천적 이용","explanationSections":[{"label":"정답 근거","text":"온실가루이는 진딧물의 천적이 아니라 식물의 즙을 빨아 먹는 해충이므로 ②의 짝이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"칠레이리응애는 잎응애류의 포식성 천적, 애꽃노린재는 총채벌레 등을 잡아먹는 천적, 굴파리좀벌은 굴파리류의 기생성 천적이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"원예해충: 천적 이용","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":28,"similarIds":["4-72"]},{"id":"2-59","round":2,"year":2016,"number":59,"subject":"재배학·원예작물학","topic":"배토와 멀칭","stem":"( )에 들어갈 내용을 순서대로 바르게 나열한 것은?\n○ 작물이 생육하고 있는 중에 이랑 사이의 흙을 그루 밑에 긁어모아 주는 것을\n( )(이)라고 한다.\n○ 짚이나 건초를 깔아 작물이 생육하고 있는 토양 표면을 피복해 주는 것을\n( )(이)라고 한다.","options":[{"n":"1","text":"중경, 멀칭"},{"n":"2","text":"배토, 복토"},{"n":"3","text":"배토, 멀칭"},{"n":"4","text":"중경, 복토"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n그루 밑으로 흙을 모아 주는 작업은 배토, 짚·건초 등으로 토양 표면을 덮는 작업은 멀칭이므로 ③이다.\n\n오답 확인\n중경은 작물 사이의 표토를 갈아 통기·잡초관리 등을 하는 작업이고, 복토는 파종 종자 등을 흙으로 덮는 작업이다. 흙을 움직이는 위치와 목적을 구분한다.\n\n근거·학습주제\n재배학: 관리작업","explanationSections":[{"label":"정답 근거","text":"그루 밑으로 흙을 모아 주는 작업은 배토, 짚·건초 등으로 토양 표면을 덮는 작업은 멀칭이므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"중경은 작물 사이의 표토를 갈아 통기·잡초관리 등을 하는 작업이고, 복토는 파종 종자 등을 흙으로 덮는 작업이다. 흙을 움직이는 위치와 목적을 구분한다.","kind":"in ourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"2-64","round":2,"year":2016,"number":64,"subject":"재배학·원예작물학","topic":"토양습해의 예방","stem":"토양습해 예방 대책으로 옳은 것은?","options":[{"n":"1","text":"내습성 품종 선택"},{"n":"2","text":"고랑 파종"},{"n":"3","text":"미숙 유기물 사용"},{"n":"4","text":"밀식 재배"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n내습성 품종은 산소 부족과 과습 조건을 상대적으로 잘 견디므로 ①이 맞다. 배수 개선과 적정 재식밀도 등의 관리도 병행한다.\n\n오답 확인\n고랑은 물이 모이기 쉬우며 미숙 유기물 분해는 산소를 소비할 수 있다. 밀식은 통풍을 악화시키므로 일반적 습해 예방대책으로 적합하지 않다.\n\n근거·학습주제\n재배학: 과습·습해","explanationSections":[{"label":"정답 근거","text":"내습성 품종은 산소 부족과 과습 조건을 상대적으로 잘 견디므로 ①이 맞다. 배수 개선과 적정 재식밀도 등의 관리도 병행한다.","kind":"reason"},{"label":"오답 확인","text":"고랑은 물이 모이기 쉬우며 미숙 유기물 분해는 산소를 소비할 수 있다. 밀식은 통풍을 악화시키므로 일반적 습해 예방대책으로 적합하지 않다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학: 과습·습해","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"2-65","round":2,"year":2016,"number":65,"subject":"재배학·원예작물학","topic":"CO₂와 전형적 대기오염 피해","stem":"작물 피해를 발생시키는 대기오염 물질이 아닌 것은?","options":[{"n":"1","text":"아황산가스"},{"n":"2","text":"이산화탄소"},{"n":"3","text":"오존"},{"n":"4","text":"불화수소"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n통상적인 재배학 분류에서 이산화탄소는 광합성 원료이므로 이 보기의 전형적 대기오염 피해물질이 아닌 것으로 ②를 고른다.\n\n오답 확인\n아황산가스·오존·불화수소는 잎 손상 등을 일으키는 대표적 오염물질이다. 정답은 정상적인 재배농도·교재 분류에 따른 것이며 CO₂가 어떤 농도에서도 무해하다는 뜻은 아니다.\n\n근거·학습주제\n재배환경: 대기오염","explanationSections":[{"label":"정답 근거","text":"통상적인 재배학 분류에서 이산화탄소는 광합성 원료이므로 이 보기의 전형적 대기오염 피해물질이 아닌 것으로 ②를 고른다.","kind":"reason"},{"label":"오답 확인","text":"아황산가스·오존·불화수소는 잎 손상 등을 일으키는 대표적 오염물질이다. 정답은 정상적인 재배농도·교재 분류에 따른 것이며 CO₂가 어떤 농도에서도 무해하다는 뜻은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배환경: 대기오염","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":30,"similarIds":[]},{"id":"2-66","round":2,"year":2016,"number":66,"subject":"재배학·원예작물학","topic":"염류와 수분포텐셜","stem":"염해(salt stress)에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"토양수분의 증발량이 강수량보다 많을 때 발생할 수 있다."},{"n":"2","text":"시설재배 시 비료의 과용으로 생기게 된다."},{"n":"3","text":"토양의 수분포텐셜이 높아진다."},{"n":"4","text":"토양수분 흡수가 어려워지고 작물의 영양소 불균형을 초래한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n토양 염류농도가 높아지면 삼투포텐셜이 더 낮아져 물이 있어도 뿌리가 흡수하기 어렵다. 수분포텐셜이 높아진다는 ③은 방향이 반대이다.\n\n오답 확인\n증발이 많거나 시설에서 비료·염류가 축적되면 발생하기 쉽다. 염해는 수분흡수 저해뿐 아니라 이온 독성 및 양분 불균형도 일으킨다.\n\n근거·학습주제\n토양학: 염류집적·삼투포텐셜","explanationSections":[{"label":"정답 근거","text":"토양 염류농도가 높아지면 삼투포텐셜이 더 낮아져 물이 있어도 뿌리가 흡수하기 어렵다. 수분포텐셜이 높아진다는 ③은 방향이 반대이다.","kind":"reason"},{"label":"오답 확인","text":"증발이 많거나 시설에서 비료·염류가 축적되면 발생하기 쉽다. 염해는 수분흡수 저해뿐 아니라 이온 독성 및 양분 불균형도 일으킨다.","kind":"incorrect"},{"label":"근거·학습주제","text":"토양학: 염류집적·삼투포텐셜","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":["5-61"]},{"id":"2-67","round":2,"year":2016,"number":67,"subject":"재배학·원예작물학","topic":"강풍과 병해충 피해","stem":"강풍이 작물에 미치는 영향으로 옳지 않은 것은?","options":[{"n":"1","text":"상처로 인한 호흡률 증가"},{"n":"2","text":"매개곤충의 활동저하로 인한 수정률 감소"},{"n":"3","text":"기공폐쇄로 인한 광합성률 감소"},{"n":"4","text":"병원균 감소로 인한 병해충 피해 약화"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n강풍은 상처를 내고 병원체를 퍼뜨려 이차 병해를 늘릴 수 있다. 병원균을 줄여 피해를 약화시킨다는 ④는 일반적 설명으로 틀리다.\n\n오답 확인\n상처에 따른 호흡 증가, 매개곤충 활동저하에 따른 수분 불량, 기공폐쇄에 따른 광합성 감소는 강풍의 피해기작이다.\n\n근거·학습주제\n농업기상: 풍해","explanationSections":[{"label":"정답 근거","text":"강풍은 상처를 내고 병원체를 퍼뜨려 이차 병해를 늘릴 수 있다. 병원균을 줄여 피해를 약화시킨다는 ④는 일반적 설명으로 틀리다.","kind":"reason"},{"label":"오답 확인","text":"상처에 따른 호흡 증가, 매개곤충 활동저하에 따른 수분 불량, 기공폐쇄에 따른 광합성 감소는 강풍의 피해기작이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업기상: 풍해","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"2-68","round":2,"year":2016,"number":68,"subject":"재배학·원예작물학","topic":"조미채소와 엽채류","stem":"채소작물 중 조미채소류가 아닌 것은?","options":[{"n":"1","text":"마늘"},{"n":"2","text":"고추"},{"n":"3","text":"생강"},{"n":"4","text":"배추"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n배추는 잎을 주로 이용하는 엽채류로, 조미채소류가 아니므로 ④이다.\n\n오답 확인\n마늘·고추·생강은 음식의 맛·향을 내는 데 이용하는 대표적인 조미채소이다. 이용 부위 분류와 식품의 용도 분류를 함께 구분한다.\n\n근거·학습주제\n채소원예학: 채소의 분류","explanationSections":[{"label":"정답 근거","text":"배추는 잎을 주로 이용하는 엽채류로, 조미채소류가 아니므로 ④이다.","kind":"reason"},{"label":"오답 확인","text":"마늘·고추·생강은 음식의 맛·향을 내는 데 이용하는 대표적인 조미채소이다. 이용 부위 분류와 식품의 용도 분류를 함께 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"채소원예학: 채소의 분류","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"2-69","round":2,"year":2016,"number":69,"subject":"재배학·원예작물학","topic":"고온기 엽면시비의 주의점","stem":"과수의 엽면시비에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"뿌리가 병충해 또는 침수 피해를 받았을 때 실시할 수 있다."},{"n":"2","text":"비료의 흡수율을 높이기 위해 전착제를 첨가하여 살포한다."},{"n":"3","text":"잎의 윗면보다는 아랫면에 살포하여 흡수율을 높게 한다."},{"n":"4","text":"고온기에는 살포농도를 높여 흡수율을 높게 한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n고온기에 농도를 높이면 잎의 염류·약해 위험이 커진다. ④가 틀리며 적정 저농도와 서늘한 시간대를 선택하는 것이 원칙이다.\n\n오답 확인\n뿌리의 흡수기능이 떨어졌을 때 보완적으로 실시할 수 있다. 전착제와 잎 뒷면 살포는 용액의 부착·흡수를 도울 수 있지만 작물·제제별 적정조건을 지켜야 한다.\n\n근거·학습주제\n과수 영양관리: 엽면시비","explanationSections":[{"label":"정답 근거","text":"고온기에 농도를 높이면 잎의 염류·약해 위험이 커진다. ④가 틀리며 적정 저농도와 서늘한 시간대를 선택하는 것이 원칙이다.","kind":"reason"},{"label":"오답 확인","text":"뿌리의 흡수기능이 떨어졌을 때 보완적으로 실시할 수 있다. 전착제와 잎 뒷면 살포는 용액의 부착·흡수를 도울 수 있지만 작물·제제별 적정조건을 지켜야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수 영양관리: 엽면시비","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":32,"similarIds":[]},{"id":"2-70","round":2,"year":2016,"number":70,"subject":"재배학·원예작물학","topic":"참다래의 과수 분류","stem":"과수와 그 생육특성이 바르게 짝지어지지 않은 것은?","options":[{"n":"1","text":"사과나무 - 교목성 온대과수"},{"n":"2","text":"블루베리나무 - 관목성 온대과수"},{"n":"3","text":"참다래나무 - 덩굴성 아열대과수"},{"n":"4","text":"온주밀감나무 - 상록성 아열대과수"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n참다래는 덩굴성 온대 낙엽과수로 분류하므로 아열대과수라고 한 ③이 틀리다. 따뜻한 지역에서 재배된다는 이유만으로 데 생산비를 절감하고 해거리를 유도한다는 ②는 목적이 아니다.\n\n오답 확인\n병해충·농약의 직접 부착을 줄이고 과피를 보호할 수 있다. 착색 개선은 품종·봉지 종류·벗기는 시기 등에 좌우되며 해거리는 오히려 적정 결실량 관리로 줄이는 것이 일반적이다.\n\n근거·학습주제\n과수원예학: 과실 봉지씌우기","explanationSections":[{"label":"정답 근거","text":"봉지씌우기는 과실을 보호하고 외관·상품성을 높이는 작업이다. 추가 노동과 자재가 드는데 생산비를 절감하고 해거리를 유도한다는 ②는 목적이 아니다.","kind":"reason"},{"label":"오답 확인","text":"병해충·농약의 직접 부착을 줄이고 과피를 보호할 수 있다. 착색 개선은 품종·봉지 종류·벗기는 시기 등에 좌우되며 해거리는 오히려 적정 결실량 관리로 줄이는 것이 일반적이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과수원예학: 과실 봉지씌우기","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"2-73","round":2,"year":2016,"number":73,"subject":"재배학·원예작물학","topic":"생장조절물질의 작용","stem":"화훼재배에 이용되는 생장조절물질에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"루톤(rootone)은 옥신(auxin)계 생장조절물질로 발근을 촉진한다."},{"n":"2","text":"에테폰(ethephon)은 에틸렌 발생을 위한 기체 화합물로 아나나스류의 화아분화를 억제한다."},{"n":"3","text":"지베렐린(gibberellin) 처리는 국화의 줄기신장을 억제한다."},{"n":"4","text":"시토키닌(cytokinin)은 옥신류와 상보작용을 통해 측지발생을 억제한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n루톤은 옥신계 발근촉진제로 삽목 등에서 뿌리 발생을 돕기 때문에 ①이 맞다.\n\n오답 확인\n에테폰은 에틸렌을 방출해 아나나스류 화아분화를 촉진한다. 지베렐린은 일반적으로 줄기신장을 촉진하고, 시토키닌은 측지발생을 촉진하는 쪽으로 작용한다.\n\n근거·학습주제\n화훼학: 생장조절제","explanationSections":[{"label":"정답 근거","text":"루톤은 옥신계 발근촉진제로 삽목 등에서 뿌리 발생을 돕기 때문에 ①이 맞다.","kind":"reason"},{"label":"오답 확인","text":"에테폰은 에틸렌을 방출해 아나나스류 화아분화를 촉진한다. 지베렐린은 일반적으로 줄기신장을 촉진하고, 시토키닌은 측지발생을 촉진하는 쪽으로 작용한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼학: 생장조절제","kind":"reference"}],"sourcePdf":"2016년 제2회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"2-74","round":2,"year":2016,"number":74,"subject":"재배학·원예작물학","topic":"조직배양의 전형성능","stem":"( )에 들어갈 내용으로 옳은 것은?\n조직배양은 식물의 세포, 조직, 또는 기관이 완전한 식물체로 만들어질 수\n있다는 ( )에 기반을 둔 것이다.","options":[{"n":"1","text":"전형성능"},{"n":"2","text":"유성번식"},{"n":"3","text":"발아세"},{"n":"4","text":"결실률"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n한 세포나 조직이 적절한 조건에서 완전한 식물체로 재생할 수 있는
