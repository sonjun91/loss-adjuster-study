,"options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄴ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n사업계획에는 사업지역·기간 및 보험상품 사항이 포함되므로 ㄱ·ㄴ, ①이다.\n\n오답 확인\nㄷ 전반적인 운영실적은 사업결과보고서 사항이다. ㄹ은 필요사항을 정하는 주체를 금융감독원장으로 바꾸어 틀렸다.\n\n근거·학습주제\n농어업재해보험법 제27조·시행령 제22조","explanationSections":[{"label":"정답 근거","text":"사업계획에는 사업지역·기간 및 보험상품 사항이 포함되므로 ㄱ·ㄴ, ①이다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ 전반적인 운영실적은 사업결과보고서 사항이다. ㄹ은 필요사항을 정하는 주체를 금융감독원장으로 바꾸어 틀렸다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제27조·시행령 제22조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":[]},{"id":"5-31","round":5,"year":2019,"number":31,"subject":"농어업재해보험법령","topic":"손해평가인 업무","stem":"농업재해보험 손해평가요령상 손해평가인의 업무가 아닌 것은?","options":[{"n":"1","text":"손해액 평가"},{"n":"2","text":"보험가액 평가"},{"n":"3","text":"보험료의 평가"},{"n":"4","text":"피해사실 확인"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n피해사실 확인, 보험가액 평가, 손해액 평가는 손해평가인 업무이다. 보험료의 평가라는 ③은 해당하지 않는다.\n\n오답 확인\n보험료율·보험료 산출과 사고 후 피해평가를 구별한다. 보험가액과 보험료는 별개 개념이다.\n\n근거·학습주제\n손해평가요령 제3조","explanationSections":[{"label":"정답 근거","text":"피해사실 확인, 보험가액 평가, 손해액 평가는 손해평가인 업무이다. 보험료의 평가라는 ③은 해당하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"보험료율·보험료 산출과 사고 후 피해평가를 구별한다. 보험가액과 보험료는 별개 개념이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"손해평가요령 제3조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["8-40","3-41","1-34","2-29","12-39","11-38","10-40","9-41"]},{"id":"5-32","round":5,"year":2019,"number":32,"subject":"농어업재해보험법령","topic":"교육비","stem":"농업재해보험 손해평가요령상 손해평가인의 교육에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험사업자는 위촉된 손해평가인을 대상으로 농업재해보험에 관한 손해평가의 방법\n및 절차의 실무교육을 실시하여야 한다."},{"n":"2","text":"피해유형별 현지조사표 작성실습은 손해평가인 정기교육의 내용이다."},{"n":"3","text":"손해평가인 정기교육 시 농업재해보험에 관한 기초지식의 교육내용에는 농어업재해보험법\n제정 배경 및 조문별 주요내용 등이 포함된다."},{"n":"4","text":"위촉된 손해평가인의 실무교육 시 재해보험사업자에 대하여 손해평가인은 교육비를 지급한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n사업자는 교육대상 손해평가인에게 소정의 교육비를 지급할 수 있다. 반대로 손해평가인이 사업자에게 교육비를 내야 한다는 ④는 규정과 다르다.\n\n오답 확인\n실무교육 실시, 현지조사표 작성실습, 법의 제정배경·조문 교육은 교육체계에 포함된다.\n\n근거·학습주제\n시행령 제12조·손해평가요령 제5조·제5조의2","explanationSections":[{"label":"정답 근거","text":"사업자는 교육대상 손해평가인에게 소정의 교육비를 지급할 수 있다. 반대로 손해평가인이 사업자에게 교육비를 내야 한다는 ④는 규정과 다르다.","kind":"reason"},{"label":"오답 확인","text":"실무교육 실시, 현지조사표 작성실습, 법의 제정배경·조문 교육은 교육체계에 포함된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시행령 제12조·손해평가요령 제5조·제5조의2","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["8-41","10-40","2-43","12-33","9-39","6-49","4-43","11-40","7-40","1-41"]},{"id":"5-33","round":5,"year":2019,"number":33,"subject":"농어업재해보험법령","topic":"위촉 취소와 해지","stem":"농업재해보험 손해평가요령상 재해보험사업자가 손해평가인 업무의 정지나 위촉의 해\n지를 할 수 있는 사항에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해평가인이 농업재해보험 손해평가요령의 규정을 위반한 경우 위촉을 해지할 수 있다."},{"n":"2","text":"손해평가인이 농어업재해보험법에 따른 명령을 위반한 때 3개월간 업무의 정지를 명할 수 있다."},{"n":"3","text":"부정한 방법으로 손해평가인으로 위촉된 경우 위촉을 해지할 수 있다."},{"n":"4","text":"업무수행과 관련하여 동의를 받지 않고 개인정보를 수집하여 개인정보보호법을 위반한 경\n우 3개월간 업무의 정지를 명할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n부정한 방법으로 위촉된 사람은 위촉취소 사유이다. 이를 단순히 임의적 위촉해지 대상으로 쓴 ③이 출제 당시 정답이다.\n\n오답 확인\n요령 위반·명령위반·정보보호법령 위반은 당시 업무정지·해지 등의 제재대상이었다. 취소의 기속성과 정지·해지 재량을 구분한다.\n\n기준·변경 메모\n현재 별표에는 명령위반 1차 업무정지 6개월, 정보보호법 위반 위촉해지 등이 제시된다. ②·④의 3개월을 현재 처분기준으로 암기하지 않는다.\n\n근거·학습주제\n출제 당시 손해평가요령 제6조","explanationSections":[{"label":"정답 근거","text":"부정한 방법으로 위촉된 사람은 위촉취소 사유이다. 이를 단순히 임의적 위촉해지 대상으로 쓴 ③이 출제 당시 정답이다.","kind":"reason"},{"label":"오답 확인","text":"요령 위반·명령위반·정보보호법령 위반은 당시 업무정지·해지 등의 제재대상이었다. 취소의 기속성과 정지·해지 재량을 구분한다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"현재 별표에는 명령위반 1차 업무정지 6개월, 정보보호법 위반 위촉해지 등이 제시된다. ②·④의 3개월을 현재 처분기준으로 암기하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"출제 당시 손해평가요령 제6조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["1-40","9-42","3-44"]},{"id":"5-34","round":5,"year":2019,"number":34,"subject":"농어업재해보험법령","topic":"평가반 이해충돌","stem":"농업재해보험 손해평가요령상 손해평가반 구성에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"손해평가인은 법에 따른 손해평가를 하는 경우 손해평가반을 구성하고 손해평가반별로 평\n가일정계획을 수립하여야 한다."},{"n":"2","text":"자기가 모집하지 않았더라도 자기와 생계를 같이하는 친족이 모집한 보험계약이라면 해당\n자는 그 보험계약에 관한 손해평가의 손해평가반 구성에서 배제되어야 한다."},{"n":"3","text":"자기가 가입하였어도 자기가 모집하지 않은 보험계약이라면 해당자는 그 보험 계약에 관\n한 손해평가의 손해평가반 구성에 참여할 수 있다."},{"n":"4","text":"손해평가반에는 손해평가인, 손해평가사, 손해사정사에 해당하는 자를 2인 이상 포함시켜\n야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n생계를 같이하는 친족이 모집한 보험계약 등 이해관계가 있는 경우 해당자를 평가반 구성에서 배제한다. ②이다.\n\n오답 확인\n① 평가반 구성·일정 수립 주체는 사업자이다. ③ 본인이 가입한 계약도 배제 대상이다. ④ 자격인력 2인 이상이라는 문구는 당시 최소 포함기준과 다르다.\n\n기준·변경 메모\n2024.3.29 개정(해당 조항 시행 유예 후 적용)된 평가반 5인 이내 구성 등 현행 체계와 구분한다.\n\n근거·학습주제\n출제 당시 손해평가요령 평가반 구성 규정","explanationSections":[{"label":"정답 근거","text":"생계를 같이하는 친족이 모집한 보험계약 등 이해관계가 있는 경우 해당자를 평가반 구성에서 배제한다. ②이다.","kind":"reason"},{"label":"오답 확인","text":"① 평가반 구성·일정 수립 주체는 사업자이다. ③ 본인이 가입한 계약도 배제 대상이다. ④ 자격인력 2인 이상이라는 문구는 당시 최소 포함기준과 다르다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"2024.3.29 개정(해당 조항 시행 유예 후 적용)된 평가반 5인 이내 구성 등 현행 체계와 구분한다.","kind":"note"},{"label":"근거·학습주제","text":"출제 당시 손해평가요령 평가반 구성 규정","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["8-43","11-41","9-38","10-42","7-43","9-43","8-44","7-42"]},{"id":"5-35","round":5,"year":2019,"number":35,"subject":"농어업재해보험법령","topic":"농어업재해의 대상","stem":"농어업재해보험법상 농어업재해에 해당하지 않는 것은?","options":[{"n":"1","text":"농작물에 발생하는 자연재해"},{"n":"2","text":"임산물에 발생하는 병충해"},{"n":"3","text":"농업용 시설물에 발생하는 화재"},{"n":"4","text":"농어촌 주민의 주택에 발생하는 화재"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n농어촌 주민의 주택화재는 농어업재해보험법상 농어업재해의 대상에 포함되지 않는다. ④이다.\n\n오답 확인\n농작물 자연재해, 임산물 병충해, 농업용 시설물 화재는 법의 대상물과 재해유형에 해당한다. 거주지역만으로 보험대상이 되지는 않는다.\n\n근거·학습주제\n농어업재해보험법 제2조","explanationSections":[{"label":"정답 근거","text":"농어촌 주민의 주택화재는 농어업재해보험법상 농어업재해의 대상에 포함되지 않는다. ④이다.","kind":"reason"},{"label":"오답 확인","text":"농작물 자연재해, 임산물 병충해, 농업용 시설물 화재는 법의 대상물과 재해유형에 해당한다. 거주지역만으로 보험대상이 되지는 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제2조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":20,"similarIds":["7-26"]},{"id":"5-36","round":5,"year":2019,"number":36,"subject":"농어업재해보험법령","topic":"심의사항","stem":"농어업재해보험법령상 농업재해보험심의회의 심의사항에 해당하는 것을 모두 고른 것은?\nㄱ. 재해보험목적물의 선정에 관한 사항\nㄴ. 재해보험사업에 대한 재정지원에 관한 사항\nㄷ. 손해평가의 방법과 절차에 관한 사항","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험목적물 선정, 사업 재정지원, 손해평가 방법·절차는 모두 농업재해보험심의회의 심의사항이다. ㄱ·ㄴ·ㄷ, ④이다.\n\n오답 확인\n보험대상·사업지원·평가기준이라는 세 축을 함께 심의한다. 특정 하나만 제외하는 조합은 맞지 않는다.\n\n기준·변경 메모\n출제 당시 농어업재해보험심의회와 2026년 현재 농업·어업별 심의기구 체계를 구분한다.\n\n근거·학습주제\n출제 당시 농어업재해보험법 제3조","explanationSections":[{"label":"정답 근거","text":"보험목적물 선정, 사업 재정지원, 손해평가 방법·절차는 모두 농업재해보험심의회의 심의사항이다. ㄱ·ㄴ·ㄷ, ④이다.","kind":"reason"},{"label":"오답 확인","text":"보험대상·사업지원·평가기준이라는 세 축을 함께 심의한다. 특정 하나만 제외하는 조합은 맞지 않는다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"출제 당시 농어업재해보험심의회와 2026년 현재 농업·어업별 심의기구 체계를 구분한다.","kind":"note"},{"label":"근거·학습주제","text":"출제 당시 농어업재해보험법 제3조","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":20,"similarIds":["8-27","9-34","1-26"]},{"id":"5-37","round":5,"year":2019,"number":37,"subject":"농어업재해보험법령","topic":"사업 약정권자","stem":"농어업재해보험법령상 재해보험사업에 관한 내용으로 옳지 않은 것은?","options":[{"n":"1","text":"재해보험사업을 하려는 자는 기획재정부장관과 재해보험사업의 약정을 체결하여야 한다."},{"n":"2","text":"재해보험의 종류는 농작물재해보험, 임산물재해보험, 가축재해보험 및 양식수산물재해보험\n으로 한다."},{"n":"3","text":"재해보험에 가입할 수 있는 자는 농림업, 축산업, 양식수산업에 종사하는 개인 또는 법인\n으로 한다."},{"n":"4","text":"재해보험에서 보상하는 재해의 범위는 해당 재해의 발생 빈도, 피해 정도 및 객관적인 손\n해평가방법 등을 고려하여 재해보험의 종류별로 대통령령으로 정한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근 은?\nA농가: 과실이 자람에 따라 서서히 호흡이 저하되다 성숙기를 지나 완숙이 진행되\n는 전환기에 호흡이 일시적으로 상승하는 과실\nB농가: 성숙기가 되어도 특정한 변화가 일어나지 않는 과실","options":[{"n":"1","text":"A농가: 사과, B농가: 블루베리"},{"n":"2","text":"A농가: 살구, B농가: 키위"},{"n":"3","text":"A농가: 포도, B농가: 바나나"},{"n":"4","text":"A농가: 자두, B농가: 복숭아"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n사과는 성숙·후숙 과정에 호흡급등을 보이는 과실, 블루베리는 이 문항의 비급등형 분류에 해당한다. ①이다.\n\n오답 확인\n키위·바나나·복숭아 등은 호흡급등형으로 B에 놓기 어렵고 포도는 비급등형이므로 A에 놓기 어렵다.\n\n근거·학습주제\n과실 후숙·호흡형","explanationSections":[{"label":"정답 근거","text":"사과는 성숙·후숙 과정에 호흡급등을 보이는 과실, 블루베리는 이 문항의 비급등형 분류에 해당한다. ①이다.","kind":"reason"},{"label":"오답 확인","text":"키위·바나나·복숭아 등은 호흡급등형으로 B에 놓기 어렵고 포도는 비급등형이므로 A에 놓기 어렵다.","kind":"incorrect"},{"label":"근거·학습주제","text":"과실 후숙·호흡형","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"5-71","round":5,"year":2019,"number":71,"subject":"재배학·원예작물학","topic":"야간조명과 개화","stem":"도로건설로 야간 조명이 늘어나는 지역에서 개화 지연에 대한 대책이 필요한 화훼작물은?","options":[{"n":"1","text":"국화, 시클라멘"},{"n":"2","text":"장미, 페튜니아"},{"n":"3","text":"금어초, 제라늄"},{"n":"4","text":"칼랑코에, 포인세티아"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n칼랑코에와 포인세티아는 단일성 화훼로 야간 빛이 암기를 끊으면 꽃눈분화·개화가 지연될 수 있다. ④이다.\n\n오답 확인\n국화 역시 단일성이지만 ①의 시클라멘까지 같은 조건으로 묶는 선택지는 적절하지 않다. 두 작물 모두 조건에 맞아야 한다.\n\n근거·학습주제\n화훼 광주기 반응","explanationSections":[{"label":"정답 근거","text":"칼랑코에와 포인세티아는 단일성 화훼로 야간 빛이 암기를 끊으면 꽃눈분화·개화가 지연될 수 있다. ④이다.","kind":"reason"},{"label":"오답 확인","text":"국화 역시 단일성이지만 ①의 시클라멘까지 같은 조건으로 묶는 선택지는 적절하지 않다. 두 작물 모두 조건에 맞아야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"화훼 광주기 반응","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"5-72","round":5,"year":2019,"number":72,"subject":"재배학·원예작물학","topic":"열대 절화 저온장해","stem":"A농가에서 실수로 2℃ 에 저장하여 저온장해를 받게 될 품목은?","options":[{"n":"1","text":"장미"},{"n":"2","text":"백합"},{"n":"3","text":"극락조화"},{"n":"4","text":"국화"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n극락조화는 저온에 민감하여 2℃ 저장에서 장해가 우려된다. ③이다.\n\n오답 확인\n장미·백합·국화는 일반적인 저온유통에 활용되는 품목이다. 열대성 절화는 더 높은 적정온도를 적용한다.\n\n근거·학습주제\n절화 저장온도","explanationSections":[{"label":"정답 근거","text":"극락조화는 저온에 민감하여 2℃ 저장에서 장해가 우려된다. ③이다.","kind":"reason"},{"label":"오답 확인","text":"장미·백합·국화는 일반적인 저온유통에 활용되는 품목이다. 열대성 절화는 더 높은 적정온도를 적용한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"절화 저장온도","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"5-73","round":5,"year":2019,"number":73,"subject":"재배학·원예작물학","topic":"오이 낙과와 일조","stem":"A농가의 하우스 오이재배 시 낙과가 발생하였다. B손해평가사가 주요 원인으로 조사할 항\n목은?","options":[{"n":"1","text":"유인끈"},{"n":"2","text":"재배방식"},{"n":"3","text":"일조량"},{"n":"4","text":"탄산시비"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n일조가 부족하면 광합성·동화산물 공급이 줄어 어린 과실이 낙과하기 쉽다. 핵심 조사항목은 ③ 일조량이다.\n\n오답 확인\n유인끈·재배방식·탄산시비도 관리요소지만 제시된 주요 생리원인을 가장 직접적으로 설명하는 것은 광 부족이다.\n\n근거·학습주제\n박과채소 광 부족·낙과","explanationSections":[{"label":"정답 근거","text":"일조가 부족하면 광합성·동화산물 공급이 줄어 어린 과실이 낙과하기 쉽다. 핵심 조사항목은 ③ 일조량이다.","kind":"reason"},{"label":"오답 확인","text":"유인끈·재배방식·탄산시비도 관리요소지만 제시된 주요 생리원인을 가장 직접적으로 설명하는 것은 광 부족이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"박과채소 광 부족·낙과","kind":"reference"}],"sourcePdf":"2019년 제5회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"5-74","round":5,"year":2019,"number":74,"subject":"재배학·원예작물학","topic":"수경재배 원수","stem":"수경재배에 사용 가능한 원수는?","options":[{"n":"1","text":"철분 함량이 높은 물"},{"n":"2","text":"나트륨, 염소의 함량이 100ppm이상인 물"},{"n":"3","text":"산도가 pH 7에 가까운 물"},{"n":"4","text":"중탄산 함량이 100ppm 이상인 물"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n제시항목 중 pH 7에 가까운 물이 가장 적합하므로 ③이다. 실제로는 알칼리도·EC·이온분석 후 양액 pH를 조정한다.\n\n오답 확인\n높은 철은 침전·배관 문제, 높은 Na·Cl은 염류장해, 높은 중탄산은 pH 상승과 양분침전을 일으킬 수 있다.\n\n기준·변경 메모\npH만으로 원수 적합성이 완전히 결정되는 것은 아니다.\n\n근거·학습주제\n수경재배 수질","explanationSections":[{"label":"정답 근거","text":"제시항목 중 pH 7에 가까운 물이 가장 적합하므로 ③이다. 실제로는 알칼리도·EC·이온분석 후 양액 pH를 조정한다." 근거·학습주제","text":"상법 제674조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["3-23","9-19","11-18","4-20","1-24","2-11"]},{"id":"6-4","round":6,"year":2020,"number":4,"subject":"상법(보험편)","topic":"손해액 산정비용","stem":"손해액의 산정에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험자가 보상할 손해액은 그 손해가 발생한 때와 곳의 가액에 의하여 산정하는 것이\n원칙이다."},{"n":"2","text":"손해액 산정에 관하여 당사자간에 다른 약정이 있는 때에는 신품가액에 의하여 산정할 수\n있다."},{"n":"3","text":"특약이 없는 한 보험자가 보상할 손해액에는 보험사고로 인하여 상실된 피보험자가 얻을\n이익이나 보수를 산입하지 않는다."},{"n":"4","text":"손해액 산정에 필요한 비용은 보험자와 보험계약자가 공동으로 부담한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n손해액 산정에 관한 비용은 보험자가 부담한다. 보험계약자와 공동 부담한다는 ④가 틀리다.\n\n오답 확인\n사고 때·곳의 가액이 원칙이고 신품가액 특약도 가능하다. 상실 이익·보수는 다른 약정이 없으면 산입하지 않는다.\n\n근거·학습주제\n상법 제676조","explanationSections":[{"label":"정답 근거","text":"손해액 산정에 관한 비용은 보험자가 부담한다. 보험계약자와 공동 부담한다는 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"사고 때·곳의 가액이 원칙이고 신품가액 특약도 가능하다. 상실 이익·보수는 다른 약정이 없으면 산입하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제676조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["10-19","3-25","7-20","1-19","2-22","8-21","12-19","9-20","4-21","5-20","8-15","7-13"]},{"id":"6-5","round":6,"year":2020,"number":5,"subject":"상법(보험편)","topic":"미납보험료 공제","stem":"보험자가 손해를 보상할 경우에 보험료의 지급을 받지 아니한 잔액이 있을 경우와\n관련하여 상법 제677조(보험료체납과 보상액의 공제)의 내용으로 옳은 것은?","options":[{"n":"1","text":"보험자는 보험계약에 대한 납입최고 및 해지예고 통보를 하지 않고도 보험계약을 해지할\n수 있다."},{"n":"2","text":"보험자는 보상할 금액에서 지급기일이 도래하지 않은 보험료는 공제할 수 없다."},{"n":"3","text":"보험자는 보험금 전부에 대한 지급을 거절할 수 있다."},{"n":"4","text":"보험자는 보상할 금액에서 지급기일이 도래한 보험료를 공제할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험자는 보상액에서 미납보험료를 공제할 수 있다. 지급기일이 도래한 보험료 공제를 인정한 ④가 옳다.\n\n오답 확인\n② 기일이 아직 도래하지 않은 잔액도 공제할 수 있다. 이 특칙이 최고 없이 바로 해지하거나 보험금 전부를 거절할 권한까지 주는 것은 아니므로 ①·③은 틀리다.\n\n근거·학습주제\n상법 제677조","explanationSections":[{"label":"정답 근거","text":"보험자는 보상액에서 미납보험료를 공제할 수 있다. 지급기일이 도래한 보험료 공제를 인정한 ④가 옳다.","kind":"reason"},{"label":"오답 확인","text":"② 기일이 아직 도래하지 않은 잔액도 공제할 수 있다. 이 특칙이 최고 없이 바로 해지하거나 보험금 전부를 거절할 권한까지 주는 것은 아니므로 ①·③은 틀리다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제677조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["10-20","5-24","7-21","2-24","8-21"]},{"id":"6-6","round":6,"year":2020,"number":6,"subject":"상법(보험편)","topic":"자연소모와 양도","stem":"보험계약에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험의 목적의 성질, 하자 또는 자연소모로 인한 손해는 보험자가 보상할 책임이 없다."},{"n":"2","text":"피보험자가 보험의 목적을 양도한 때에는 양수인은 보험계약상의 권리와 의무를 승계한\n것으로 간주한다."},{"n":"3","text":"손해방지의무는 보험계약자에게만 부과되는 의무이다."},{"n":"4","text":"보험의 목적이 양도된 경우 보험의 목적의 양도인 또는 양수인은 보험자에 대하여 30일\n이내에 그 사실을 통지하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험목적의 성질·하자·자연소모 손해는 원칙적으로 보험자가 보상하지 않으므로 ①이다.\n\n오답 확인\n② 양수인 승계는 간주가 아니라 추정이다. ③ 계약자와 피보험자 모두 손해방지의무를 진다. ④ 양도통지는 30일이 아니라 지체 없이 한다.\n\n근거·학습주제\n상법 제678조·제679조·제680조","explanationSections":[{"label":"정답 근거","text":"보험목적의 성질·하자·자연소모 손해는 원칙적으로 보험자가 보상하지 않으므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"② 양수인 승계는 간주가 아니라 추정이다. ③ 계약자와 피보험자 모두 손해방지의무를 진다. ④ 양도통지는 30일이 아니라 지체 없이 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제678조·제679조·제680조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["11-19","4-23","12-20","10-18","5-21"]},{"id":"6-7","round":6,"year":2020,"number":7,"subject":"상법(보험편)","topic":"잔존물 권리이전","stem":"보험목적에 관한 보험대위(잔존물대위)의 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"일부보험에서도 보험금액의 보험가액에 대한 비율에 따라 잔존물대위권을 취득할 수 있다."},{"n":"2","text":"잔존물대위가 성립하기 위해서는 보험목적의 전부가 멸실하여야 한다."},{"n":"3","text":"피보험자는 보험자로부터 보험금을 지급받기 전에는 잔존물을 임의로 처분할 수 있다."},{"n":"4","text":"잔존물에 대한 권리가 보험자에게 이전되는 시점은 보험자가 보험금액을 전부 지급하고,\n물권변동 절차를 마무리한 때이다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n보험금액 전부를 지급하면 법률상 잔존물 권리가 이전되며 별도 물권변동 절차가 필요하지 않다. 그 절차 완료까지 요구한 ④가 틀리다.\n\n오답 확인\n① 일부보험은 금액비율에 따른 대위가 가능하고 ② 전손 및 ③ 지급 전 피보험자의 잔존물 처분에 관한 설명은 잔존물대위의 법리와 맞는다.\n\n근거·학습주제\n상법 제681조","explanationSections":[{"label":"정답 근거","text":"보험금액 전부를 지급하면 법률상 잔존물 권리가 이전되며 별도 물권변동 절차가 필요하지 않다. 그 절차 완료까지 요구한 ④가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"① 일부보험은 금액비율에 따른 대위가 가능하고 ② 전손 및 ③ 지급 전 피보험자의 잔존물 처분에 관한 설명은 잔존물대위의 법리와 맞는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제681조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["10-22","1-23","7-22","11-21","3-24"]},{"id":"6-8","round":6,"year":2020,"number":8,"subject":"상법(보험편)","topic":"화재보험의 위험","stem":"화재보험에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"화재보험에서는 일반적으로 위험개별의 원칙이 적용된다."},{"n":"2","text":"화재가 발생한 건물의 철거비와 폐기물처리비는 화재와 상당인과관계가 있는 건물수리비에\n포함된다."},{"n":"3","text":"화재보험계약의 보험자는 화재로 인하여 생긴 손해를 보상할 책임이 있다."},{"n":"4","text":"보험자는 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴 손해에 대해서도\n보상할 책임이 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n화재보험에는 일반적으로 위험보편의 원칙이 적용된다. 위험개별 원칙이 일반적이라고 한 ①이 틀리다.\n\n오답 확인\n철거·폐기물 처리비도 화재와 상당인과관계가 있는 수리비에 포함될 수 있다. 화재 직접손해와 소방·손해감소조치에 따른 손해도 보상범위이다.\n\n근거·학습주제\n상법 제683조·제684조·화재보험 판례 법리","explanationSections":[{"label":"정답 근거","text":"화재보험에는 일반적으로 위험보편의 원칙이 적용된다. 위험개별 원칙이 일반적이라고 한 ①이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"철거·폐기물 처리비도 화재와 상당인과관계가 있는 수리비에 포함될 수 있다. 화재 직접손해와 소방·손해감소조치에 따른 손해도 보상범위이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제683조·제684조·화재보험 판례 법리","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["12-23","3-16","4-22","7-23","10-23","2-25","9-24","1-25","8-15"]},{"id":"6-9","round":6,"year":2020,"number":9,"subject":"상법(보험편)","topic":"화재보험증권 기재","stem":"화재보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"화재보험증권의 교부는 화재보험계약의 성립요건이다."},{"n":"2","text":"화재보험증권은 불요식증권의 성질을 가진다."},{"n":"3","text":"화재보험계약에서 보험가액을 정했다면 이를 화재보험증권에 기재하여야 한다."},{"n":"4","text":"건물을 화재보험의 목적으로 한 경우에는 건물의 소재지, 구조와 용도는 화재보험증권의\n법정기재사항이 아니다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험가액을 약정했다면 화재보험증권에 기재해야 하므로 ③이다.\n\n오답 확인\n보험계약은 낙성계약이라 증권교부가 성립요건은 아니다. 증권은 법정기재사항이 있는 요식증권이며 건물의 소재지·구조·용도도 기재사항이다.\n\n근거·학습주제\n상법 제640조·제666조·제685조","explanationSections":[{"label":"정답 근거","text":"보험가액을 약정했다면 화재보험증권에 기재해야 하므로 ③이다.","kind":"reason"},{"label":"오답 확인","text":"보험계약은 낙성계약이라 증권교부가 성립요건은 아니다. 증권은 법정기재사항이 있는 요식증권이며 건물의 소재지·구조·용도도 기재사항이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제666조·제685조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["5-25","4-25","2-25","4-22","10-24","7-24"]},{"id":"6-10","round":6,"year":2020,"number":10,"subject":"상법(보험편)","topic":"집합보험","stem":"집합보험에 관한 설명으로 옳은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"집합보험에서는 피보험자의 가족과 사용인의 물건도 보험의 목적에 포함된다."},{"n":"2","text":"집합보험 중에서 보험의 목적이 특정되어 있는 것을 담보하는 보험을 총괄보험이라고 하\n며, 보험목적의 일부 또는 전부가 수시로 교체될 것을 예정하고 있는 보험을 특정보험이라\n한다."},{"n":"3","text":"집합된 물건을 일괄하여 보험의 목적으로 한 때에는 그 목적에 속한 물건이 보험기간 중\n에 수시로 교체된 경우에 보험사고의 발생 시에 현존한 물건에 대해서는 보험의 목적에서\n제외된 것으로 한다."},{"n":"4","text":"집합보험에서 보험목적의 일부에 대해서 고지의무 위반이 있는 경우, 보험자는 원칙적으로\n계약 전체를 해지할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n집합보험에는 피보험자의 가족과 사용인의 물건도 포함하므로 ①이다.\n\n오답 확인\n② 특정보험과 총괄보험을 거꾸로 설명하였다. ③ 교체목적물은 사고시 현존 물건이 포함된다. ④ 일부 목적의 고지위반만으로 언제나 전체 계약을 해지하는 것은 아니다.\n\n근거·학습주제\n상법 제686조·집합보험의 분할성과 고지","explanationSections":[{"label":"정답 근거","text":"집합보험에는 피보험자의 가족과 사용인의 물건도 포함하므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"② 특정보험과 총괄보험을 거꾸로 설명하였다. ③ 교체목적물은 사고시 현존 물건이 포함된다. ④ 일부 목적의 고지위반만으로 언제나 전체 계약을 해지하는 것은 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제686조·집합보험의 분할성과 고지","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["3-18","11-23","10-25","7-25","12-25","9-25","4-25","5-13","2-17"]},{"id":"6-11","round":6,"year":2020,"number":11,"subject":"상법(보험편)","topic":"낙부통지 적용요건","stem":"보험계약의 성립에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 보험계약자의 청약과 이에 대한 보험자의 승낙으로 성립한다."},{"n":"2","text":"보험계약자로부터 청약을 받은 보험자는 보험료 지급여부와 상관없이 청약일로부터 30일\n이내에 승낙의사표시를 발송하여야 한다."},{"n":"3","text":"보험자의 승낙의사표시는 반드시 서면으로 할 필요는 없다."},{"n":"4","text":"보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의 전부 또는 일부를\n받은 경우에 그 청약을 승낙하기 전에 보험계약에서 정한 보험사고가 생긴 때에는 그 청\n약을 거절할 사유가 없는 한 보험자는 보험계약상의 책임을 진다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n법정 낙부통지는 청약과 함께 보험료 상당액 전부 또는 일부를 받은 경우에 적용하며 다른 약정이 없으면 30일이다. 보험료 지급과 무관하게 청약일부터 반드시 승낙해야 한다는 ②는 틀리다.\n\n오답 확인\n청약·승낙으로 성립하고 승낙은 꼭 서면일 필요가 없다. 보험료 상당액을 받은 뒤 승낙 전 사고라도 거절사유가 없으면 책임진다는 ④도 옳다.\n\n근거·학습주제\n상법 제638조의2","explanationSections":[{"label":"정답 근거","text":"법정 낙부통지는 청약과 함께 보험료 상당액 전부 또는 일부를 받은 경우에 적용하며 다른 약정이 없으면 30일이다. 보험료 지급과 무관하게 청약일부터 반드시 승낙해야 한다는 ②는 틀리다.","kind":"reason"},{"label":"오답 확인","text":"청약·승낙으로 성립하고 승낙은 꼭 서면일 필요가 없다. 보험료 상당액을 받은 뒤 승낙 전 사고라도 거절사유가 없으면 책임진다는 ④도 옳다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의2","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["3-2","9-1","10-2","5-11","8-1"]},{"id":"6-12","round":6,"year":2020,"number":12,"subject":"상법(보험편)","topic":"타인을 위한 보험금","stem":"타인을 위한 보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자는 위임을 받아야만 특정한 타인을 위하여 보험계약을 체결할 수 있다."},{"n":"2","text":"타인을 위한 손해보험계약의 경우에 보험계약자는 그 타인의 서면위임을 받아야만 보험자와\n계약을 체결할 수 있다."},{"n":"3","text":"타인을 위한 손해보험계약의 경우에 보험계약자가 그 타인에게 보험사고의 발생으로 생긴\n손해의 배상을 한 때에는 타인의 권리를 해하지 않는 범위 내에서 보험자에게 보험금액의\n지급을 청구할 수 있다."},{"n":"4","text":"타인을 위해서 보험계약을 체결한 보험계약자는 보험자에게 보험료를 지급할 의무가 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험계약자가 타인의 손해를 배상했다면 타인의 권리를 해치지 않는 범위에서 보험자에게 지급을 청구할 수 있다. ③이다.\n\n오답 확인\n위임이 없어도 타인을 위한 보험체결이 가능하며 서면위임이 성립요건은 아니다. 보험료 지급의무는 보험계약자가 부담한다.\n\n근거·학습주제\n상법 제639조","explanationSections":[{"label":"정답 근거","text":"보험계약자가 타인의 손해를 배상했다면 타인의 권리를 해치지 않는 범위에서 보험자에게 지급을 청구할 수 있다. ③이다.","kind":"reason"},{"label":"오답 확인","text":"위임이 없어도 타인을 위한 보험체결이 가능하며 서면위임이 성립요건은 아니다. 보험료 지급의무는 보험계약자가 부담한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["11-2","5-3","7-2","9-2","3-4","7-5","2-17","3-7","12-6","12-3","5-7","9-6","2-4","8-7"]},{"id":"6-13","round":6,"year":2020,"number":13,"subject":"상법(보험편)","topic":"증권 교부·재교부","stem":"보험증권의 교부에 관한 내용으로 옳은 것을 모두 고른 것은?\nㄱ. 보험계약이 성립하고 보험계약자가 최초의 보험료를 지급했다면 보험자는 지체\n없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다.\nㄴ. 보험증권을 현저하게 훼손한 때에는 보험계약자는 보험증권의 재교부를 청구할\n수 있다. 이 경우에 증권작성비용은 보험자의 부담으로 한다.\nㄷ. 기존의 보험계약을 연장한 경우에는 보험자는 그 사실을 보험증권에 기재하여\n보험증권의 교부에 갈음할 수 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n최초보험료 납입 후 지체 없는 증권교부와 기존 증권에 연장사실 기재로 갈음하는 ㄱ·ㄷ이 옳아 ②이다.\n\n오답 확인\nㄴ 재교부 작성비용은 보험자가 아니라 보험계약자 부담이다. 증권을 처음 발행할 의무와 멸실·훼손 후 재교부 비용을 구분한다.\n\n근거·학습주제\n상법 제640조·제642조","explanationSections":[{"label":"정답 근거","text":"최초보험료 납입 후 지체 없는 증권교부와 기존 증권에 연장사실 기재로 갈음하는 ㄱ·ㄷ이 옳아 ②이다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ 재교부 작성비용은 보험자가 아니라 보험계약자 부담이다. 증권을 처음 발행할 의무와 멸실·훼손 후 재교부 비용을 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제642조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["8-3","11-3","5-4","12-1","9-3","4-3","10-3","2-2","10-2","7-3","2-16"]},{"id":"6-14","round":6,"year":2020,"number":14,"subject":"상법(보험편)","topic":"주관적 불확정 예외","stem":"보험사고의 객관적 확정의 효과에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약당시에 보험사고가 이미 발생하였더라도 그 계약은 무효로 하지 않는다."},{"n":"2","text":"보험계약당시에 보험사고가 발생할 수 없는 것이라도 그 계약은 무효로 하지 않는다."},{"n":"3","text":"보험계약당시에 보험사고가 이미 발생하였지만 보험수익자가 이를 알지 못한 때에는 그\n계약은 무효로 하지 않는다."},{"n":"4","text":"보험계약당시에 보험사고가 발생할 수 없는 것이었지만 당사자 쌍방과 피보험자가 그 사\n실을 몰랐다면 그 계약은 무효로 하지 않는다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n사고가 이미 발생했거나 불가능하여도 계약 당사자 쌍방과 피보험자가 모두 몰랐다면 무효의 예외가 인정된다. 이 요건을 갖춘 ④가 옳다.\n\n오답 확인\n①·②는 원칙적 무효를 부정한다. ③은 보험수익자 한 사람의 선의만으로 예외를 인정하므로 요건이 부족하다.\n\n근거·학습주제\n상법 제644조","explanationSections":[{"label":"정답 근거","text":"사고가 이미 발생했거나 불가능하여도 계약 당사자 쌍방과 피보험자가 모두 몰랐다면 무효의 예외가 인정된다. 이 요건을 갖춘 ④가 옳다.","kind":"reason"},{"label":"오답 확인","text":"①·②는 원칙적 무효를 부정한다. ③은 보험수익자 한 사람의 선의만으로 예외를 인정하므로 요건이 부족하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제644조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["10-7","11-4","4-4","8-4","9-4","5-5"]},{"id":"6-15","round":6,"year":2020,"number":15,"subject":"상법(보험편)","topic":"계속적 중개자의 권한","stem":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하\n는 자의 권한을 모두 고른 것은?\nㄱ. 보험자가 작성한 보험증권을 보험계약자에게 교부할 수 있는 권한\nㄴ. 보험자가 작성한 영수증 교부를 조건으로 보험계약자로부터 보험료를 수령할 수\n있는 권한\nㄷ. 보험계약자로부터 보험계약의 취소의 의사표시를 수령할 수 있는 권한\nㄹ. 보험계약자에게 보험계약의 체결에 관한 의사표시를 할 수 있는 권한","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험대리상이 아닌 계속적 중개자는 증권교부 및 보험자 작성 영수증 교부를 조건으로 한 보험료 수령권한을 가진다. ㄱ·ㄴ, ①이다.\n\n오답 확인\n취소 등 일반 의사표시 수령이나 계약체결 의사표시를 할 권한까지 당연히 주어지는 것은 아니다. 보험대리상의 포괄적 권한과 구분한다.\n\n근거·학습주제\n상법 제646조의2 제3항","explanationSections":[{"label":"정답 근거","text":"보험대리상이 아닌 계속적 중개자는 증권교부 및 보험자 작성 영수증 교부를 조건으로 한 보험료 수령권한을 가진다. ㄱ·ㄴ, ①이다.","kind":"reason"},{"label":"오답 확인","text":"취소 등 일반 의사표시 수령이나 계약체결 의사표시를 할 권한까지 당연히 주어지는 것은 아니다. 보험대리상의 포괄적 권한과 구분한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2 제3항","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["2-3","2-21","10-4","12-4","4-5","11-5","9-5","7-4","8-5","12-5","5-6","8-6","10-8"]},{"id":"6-16","round":6,"year":2020,"number":16,"subject":"상법(보험편)","topic":"사고 후 임의해지","stem":"임의해지에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자는 원칙적으로 보험사고가 발생하기 전에는 언제든지 계약의 전부 또는 일부를\n해지할 수 있다."},{"n":"2","text":"보험사고가 발생하기 전이라도 타인을 위한 보험의 경우에 보험계약자는 그 타인의 동의\n를 얻지 못하거나 보험증권을 소지하지 않은 경우에는 계약의 전부 또는 일부를 해지할\n수 없다."},{"n":"3","text":"보험사고의 발생으로 보험자가 보험금액을 지급한 때에도 보험금액이 감액되지 아니하는\n보험의 경우에는 보험계약자는 그 사고발생후에도 보험계약을 해지할 수 없다."},{"n":"4","text":"보험사고 발생 전에 보험계약자가 계약을 해지하는 경우, 당사자 사이의 특약으로 미경과\n보험료의 반환을 제한할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n사고로 보험금을 지급해도 보험금액이 감액되지 않는 보험은 그 사고 후에도 임의해지가 가능하다. 불가능하다는 ③이 틀리다.\n\n오답 확인\n사고 전 임의해지가 원칙이고 타인을 위한 보험은 타인 동의 또는 증권소지가 필요하다. 미경과보험료 반환은 다른 약정으로 제한할 수 있다.\n\n근거·학습주제\n상법 제649조","explanationSections":[{"label":"정답 근거","text":"사고로 보험금을 지급해도 보험금액이 감액되지 않는 보험은 그 사고 후에도 임의해지가 가능하다. 불가능하다는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"사고 전 임의해지가 원칙이고 타인을 위한 보험은 타인 동의 또는 증권소지가 필요하다. 미경과보험료 반환은 다른 약정으로 제한할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제649조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":10,"similarIds":["3-7","2-4","7-5","12-6","10-7","5-7","11-4","4-9","9-6","9-4","11-6","3-11","10-11","10-5","9-16"]},{"id":"6-17","round":6,"year":2020,"number":17,"subject":"상법(보험편)","topic":"중요사항의 고지","stem":"보험계약자 甲은 보험자 乙과 손해보험계약을 체결하면서 계약에 관한 사항을 고지하지\n않았다. 이에 대한 보험자 乙의 상법상 계약해지권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"甲의 고지의무위반 사실에 대한 乙의 계약해지권은 계약체결일로부터 최대 1년 내에 한하여\n행사할 수 있다."},{"n":"2","text":"乙은 甲의 중과실을 이유로 상법상 보험계약해지권을 행사할 수 없다."},{"n":"3","text":"乙의 계약해지권은 甲이 고지의무를 위반했다는 사실을 계약당시에 乙이 알 수 있었는지\n여부와 상관없이 행사할 수 있다."},{"n":"4","text":"甲이 고지하지 않은 사실이 계약과 관련하여 중요하지 않은 것이라면 乙은 상법상 고지\n의무위반을 이유로 보험계약을 해지할 수 없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n고지의무 위반 해지는 중요사항에 관한 고의 또는 중과실 위반이 전제이다. 중요하지 않은 사실은 해지사유가 아니라는 ④가 옳다.\n\n오답 확인\n해지기간은 안 날부터 1월·체결일부터 3년이다. 계약자의 중과실도 사유가 되지만 보험자가 알았거나 중과실로 몰랐으면 해지하지 못한다.\n\n근거·학습주제\n상법 제651조","explanationSections":[{"label":"정답 근거","text":"고지의무 위반 해지는 중요사항에 관한 고의 또는 중과실 위반이 전제이다. 중요하지 않은 사실은 해지사유가 아니라는 ④가 옳다.","kind":"reason"},{"label":"오답 확인","text":"해지기간은 안 날부터 1월·체결일부터 3년이다. 계약자의 중과실도 사유가 되지만 보험자가 알았거나 중과실로 몰랐으면 해지하지 못한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제651조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["5-8","1-8","11-9","7-7"]},{"id":"6-18","round":6,"year":2020,"number":18,"subject":"상법(보험편)","topic":"최초보험료 특약","stem":"보험계약자 甲은 보험자 乙과 보험계약을 체결하면서 일정한 보험료를 매월 균등하게\n10년간 지급하기로 약정하였다. 이에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"甲은 약정한 최초의 보험료를 계약체결 후 지체없이 납부하여야 한다."},{"n":"2","text":"甲이 계약이 성립한 후에 2월이 경과하도록 최초의 보험료를 지급하지 아니하면, 그 계약\n은 법률에 의거해 효력을 상실한다. 이에 관한 당사자 간의 특약은 계약의 효력에 영향을\n미치지 않는다."},{"n":"3","text":"甲이 계속보험료를 약정한 시기에 지급하지 아니하여 乙이 보험계약을 해지하려면 상당한\n기간을 정하여 甲에게 최고하여야 한다."},{"n":"4","text":"甲이 계속보험료를 지급하지 않아서 乙이 계약해지권을 적법하게 행사하였더라도 해지환\n급금이 지급되지 않았다면 甲은 일정한 기간 내에 연체보험료에 약정이자를 붙여 乙에게\n지급하고 그 계약의 부활을 청구할 수 있다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n최초보험료를 2월 동안 미납하면 다른 약정이 없는 한 해제된 것으로 본다. 특약이 효력에 영향을 못 미친다는 ②가 틀리다.\n\n오답 확인\n최초보험료의 지체 없는 지급, 계속보험료 연체 시 상당기간 최고, 해지환급금 미지급 시 요건을 갖춘 부활청구는 조문에 맞는다.\n\n근거·학습주제\n상법 제650조·제650조의2","explanationSections":[{"label":"정답 근거","text":"최초보험료를 2월 동안 미납하면 다른 약정이 없는 한 해제된 것으로 본다. 특약이 효력에 영향을 못 미친다는 ②가 틀리다.","kind":"reason"},{"label":"오답 확인","text":"최초보험료의 지체 없는 지급, 계속보험료 연체 시 상당기간 최고, 해지환급금 미지급 시 요건을 갖춘 부활청구는 조문에 맞는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제650조·제650조의2","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":11,"similarIds":["7-6","12-7","4-9","2-5","11-7","9-6"]},{"id":"6-19","round":6,"year":2020,"number":19,"subject":"상법(보험편)","topic":"위험증가 조치","stem":"위험변경증가와 계약해지에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 위험변경증가의 통지를 해태한 때에는 보험자는 그 사실을 안 날부터 1월내에\n보험료의 증액을 청구하거나 계약을 해지할 수 있다.\nㄴ. 보험계약자 등의 고의나 중과실로 인하여 위험이 현저하게 변경 또는 증가된 때\n에는 보험자는 그 사실을 안 날부터 1월내에 보험료의 증액을 청구하거나 계약\n을 해지할 수 있다.\nㄷ. 보험사고가 발생한 후라도 보험사가 위험변경증가에 따라 계약을 해지하였을 때\n에는 보험금을 지급할 책임이 없고 이미 지급한 보험금의 반환을 청구할 수 있\n다. 다만, 위험이 현저하게 변경되거나 증가된 사실이 보험사고 발생에 영향을\n미치지 아니하였음이 증명된 경우에는 보험금을 지급할 책임이 있다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n고의·중과실에 의한 현저한 위험증가 시 안 날부터 1월 내 증액 또는 해지가 가능하고, 사고 후 해지라도 무인과성이 증명되면 보험금 책임이 남는다. ㄴ·ㄷ, ③이다.\n\n오답 확인\nㄱ 통지해태를 안 경우 제652조 제1항은 1월 내 해지권을 규정한다. 통지를 받은 경우의 증액청구까지 섞어 쓴 문장이다.\n\n근거·학습주제\n상법 제652조·제653조·제655조","explanationSections":[{"label":"정답 근거","text":"고의·중과실에 의한 현저한 위험증가 시 안 날부터 1월 내 증액 또는 해지가 가능하고, 사고 후 해지라도 무인과성이 증명되면 보험금 책임이 남는다. ㄴ·ㄷ, ③이다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ 통지해태를 안 경우 제652조 제1항은 1월 내 해지권을 규정한다. 통지를 받은 경우의 증액청구까지 섞어 쓴 문장이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조·제653조·제655조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["4-10","11-10","10-9","3-11","9-15","3-10","7-11","7-10","7-9","2-14","1-9","8-10","12-9","10-10"]},{"id":"6-20","round":6,"year":2020,"number":20,"subject":"상법(보험편)","topic":"중복보험 금액관계","stem":"다음은 중복보험에 관한 설명이다. ( )에 들어갈 용어로 옳은 것은?\n동일한 보험계약의 목적과 동일한 사고에 관하여 수개의 보험계약이 동시에 또는\n순차로 체결된 경우에 그 ( ㄱ )의 총액이 ( ㄴ )을 초과한 때에는 보험자는 각자의\n( ㄷ )의 한도에서 연대책임을 진다.","options":[{"n":"1","text":"ㄱ: 보험금액, ㄴ: 보험가액, ㄷ: 보험금액"},{"n":"2","text":"ㄱ: 보험금액, ㄴ: 보험가액, ㄷ: 보험가액"},{"n":"3","text":"ㄱ: 보험료, ㄴ: 보험가액, ㄷ: 보험금액"},{"n":"4","text":"ㄱ: 보험료, ㄴ: 보험금액, ㄷ: 보험금액"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n여러 계약의 보험금액 합계가 보험가액을 초과하면 각 보험자는 각자의 보험금액 한도에서 연대책임을 진다. ①이다.\n\n오답 확인\n보험료는 계약자가 내는 대가로 중복보험 판단의 합산대상이 아니다. 보험가액은 피보험이익의 가치이고 보험금액은 각 계약의 보상한도이다.\n\n근거·학습주제\n상법 제672조","explanationSections":[{"label":"정답 근거","text":"여러 계약의 보험금액 합계가 보험가액을 초과하면 각 보험자는 각자의 보험금액 한도에서 연대책임을 진다. ①이다.","kind":"reason"},{"label":"오답 확인","text":"보험료는 계약자가 내는 대가로 중복보험 판단의 합산대상이 아니다. 보험가액은 피보험이익의 가치이고 보험금액은 각 계약의 보상한도이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제672조","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":12,"similarIds":["5-19","5-18","4-19","9-18","8-24"]},{"id":"6-21","round":6,"year":2020,"number":21,"subject":"상법(보험편)","topic":"보험료청구권 시효","stem":"청구권에 관한  일부를 지원할 수 있다."},{"n":"2","text":"풍수해보험법 에 따른 풍수해보험에 가입한 자가 동일한 보험목적물을 대상으로 재해\n보험에 가입할 경우에는 정부가 재정지원을 하여야 한다."},{"n":"3","text":"재해보험의 운영에 필요한 지원금액을 지급받으려는 재해보험사업자는 농림축산식품부장관\n또는 해양수산부장관이 정하는 바에 따라 재해보험 가입현황서나 운영비 사용계획서를 농\n림축산식품부장관 또는 해양수산부장관에게 제출하여야 한다."},{"n":"4","text":"농림축산식품부장관ㆍ해양수산부장관이 예산의 범위에서 지원하는 재정지원의 경우 그\n지원 금액을 재해보험가입자에게 지급하여야 한다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n지원을 받으려는 사업자는 가입현황서 또는 운영비 사용계획서를 소관 장관에게 제출한다. ③이다.\n\n오답 확인\n정부지원은 가입자 보험료·사업 운영관리비에 대한 제도이며 보험금의 직접 지원과 다르다. 동일목적 풍수해보험 중복지원은 제한되며 지원금 지급상대는 규정에 따른 사업자이다.\n\n근거·학습주제\n농어업재해보험법 제19조·시행령 재정지원 규정","explanationSections":[{"label":"정답 근거","text":"지원을 받으려는 사업자는 가입현황서 또는 운영비 사용계획서를 소관 장관에게 제출한다. ③이다.","kind":"reason"},{"label":"오답 확인","text":"정부지원은 가입자 보험료·사업 운영관리비에 대한 제도이며 보험금의 직접 지원과 다르다. 동일목적 풍수해보험 중복지원은 제한되며 지원금 지급상대는 규정에 따른 사업자이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제19조·시행령 재정지원 규정","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["7-34","3-40","5-47","5-43","11-33","10-33","8-33","1-36","12-32","10-35"]},{"id":"6-35","round":6,"year":2020,"number":35,"subject":"농어업재해보험법령","topic":"분쟁조정 근거법","stem":"농어업재해보험법상 분쟁조정에 관한 내용이다. ( )에 들어갈 법률로 옳은 것은?\n재해보험과 관련된 분쟁의 조정(調停)은 ( ) 제51조부터 제57조까지의 규정에\n따른다.","options":[{"n":"1","text":"보험업법"},{"n":"2","text":"풍수해보험법"},{"n":"3","text":"금융위원회의 설치 등에 관한 법률"},{"n":"4","text":"화재로 인한 재해보상과 보험가입에 관한 법률"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n2020년 출제 당시에는 금융위원회의 설치 등에 관한 법률 제51조~제57조를 준용하였다. ③이 공식정답이다.\n\n오답 확인\n보험업법·풍수해보험법·화재보험 관련 법률의 조문을 직접 준용한 구조가 아니다. 인용 법률명과 조문 범위를 함께 확인한다.\n\n기준·변경 메모\n현재는 금융소비자 보호에 관한 법률 제33조~제43조에 따른다. 현행 법률명으로 과거 정답 ③을 바꾸지 않는다.\n\n근거·학습주제\n출제 당시 농어업재해보험법 제17조","explanationSections":[{"label":"정답 근거","text":"2020년 출제 당시에는 금융위원회의 설치 등에 관한 법률 제51조~제57조를 준용하였다. ③이 공식정답이다.","kind":"reason"},{"label":"오답 확인","text":"보험업법·풍수해보험법·화재보험 관련 법률의 조문을 직접 준용한 구조가 아니다. 인용 법률명과 조문 범위를 함께 확인한다.","kind":"incorrect"},{"label":"기준· :["2"],"answerLabel":"2번","explanation":"정답 근거\n애꽃노린재·콜레마니진디벌·칠레이리응애는 천적으로 이용된다. ㄱ·ㄴ·ㄷ, ②이다.\n\n오답 확인\n점박이응애는 작물의 즙을 빨아 피해를 주는 해충이다. 같은 응애류라도 포식성 천적과 식식성 해충을 구별한다.\n\n근거·학습주제\n생물적 방제 천적","explanationSections":[{"label":"정답 근거","text":"애꽃노린재·콜레마니진디벌·칠레이리응애는 천적으로 이용된다. ㄱ·ㄴ·ㄷ, ②이다.","kind":"reason"},{"label":"오답 확인","text":"점박이응애는 작물의 즙을 빨아 피해를 주는 해충이다. 같은 응애류라도 포식성 천적과 식식성 해충을 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"생물적 방제 천적","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":33,"similarIds":[]},{"id":"6-68","round":6,"year":2020,"number":68,"subject":"재배학·원예작물학","topic":"세균병","stem":"세균에 의해 작물에 발생하는 병해는?","options":[{"n":"1","text":"궤양병"},{"n":"2","text":"탄저병"},{"n":"3","text":"역병"},{"n":"4","text":"노균병"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n제시된 병명 중 궤양병은 세균성 병의 대표로 묻는 항목이므로 ①이다.\n\n오답 확인\n탄저병은 진균성, 역병·노균병은 난균류에 의한 병이다. 병원체군을 구별하여 방제수단을 선택한다.\n\n기준·변경 메모\n궤양이라는 증상 명칭이 모든 작물에서 동일 병원체를 뜻하는 것은 아니다. 이 문항의 대표 병해 분류로 해석한다.\n\n근거·학습주제\n작물 병원체 분류","explanationSections":[{"label":"정답 근거","text":"제시된 병명 중 궤양병은 세균성 병의 대표로 묻는 항목이므로 ①이다.","kind":"reason"},{"label":"오답 확인","text":"탄저병은 진균성, 역병·노균병은 난균류에 의한 병이다. 병원체군을 구별하여 방제수단을 선택한다.","kind":"incorrect"},{"label":"기준·변경 메모","text":"궤양이라는 증상 명칭이 모든 작물에서 동일 병원체를 뜻하는 것은 아니다. 이 문항의 대표 병해 분류로 해석한다.","kind":"note"},{"label":"근거·학습주제","text":"작물 병원체 분류","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":34,"similarIds":[]},{"id":"6-69","round":6,"year":2020,"number":69,"subject":"재배학·원예작물학","topic":"광 부족과 낙화·낙과","stem":"시설 내에서 광 부족이 지속될 때 나타날 수 있는 박과 채소 작물의 생육 반응은?","options":[{"n":"1","text":"낙화 또는 낙과의 발생이 많아진다."},{"n":"2","text":"잎이 짙은 녹색을 띤다."},{"n":"3","text":"잎이 작고 두꺼워진다."},{"n":"4","text":"줄기의 마디 사이가 짧고 굵어진다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n박과채소에서 광 부족은 동화산물 공급을 줄여 꽃·어린 과실의 유지가 어려워져 낙화·낙과를 증가시키므로 ①이다.\n\n오답 확인\n낮은 광에서는 일반적으로 줄기가 웃자라고 잎이 얇아지는 방향이다. 두껍고 작은 잎·짧고 굵은 절간은 충분한 광 조건의 형태와 더 가깝다.\n\n근거·학 ,"similarIds":[]},{"id":"6-74","round":6,"year":2020,"number":74,"subject":"재배학·원예작물학","topic":"무토양재배 완충력","stem":"토양 재배에 비해 무토양 재배의 장점이 아닌 것은?","options":[{"n":"1","text":"배지의 완충능이 높다."},{"n":"2","text":"연작 재배가 가능하다."},{"n":"3","text":"자동화가 용이하다."},{"n":"4","text":"청정 재배가 가능하다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n무토양재배는 대체로 토양보다 양분·pH 완충력이 작아 정밀관리가 필요하다. 완충능이 높다는 ①은 장점이 아니다.\n\n오답 확인\n배지·양액을 적절히 관리하면 연작장해 회피, 자동화, 청정 생산 등이 가능하다. 배지종류와 소독·양액관리가 전제된다.\n\n근거·학습주제\n수경·무토양재배","explanationSections":[{"label":"정답 근거","text":"무토양재배는 대체로 토양보다 양분·pH 완충력이 작아 정밀관리가 필요하다. 완충능이 높다는 ①은 장점이 아니다.","kind":"reason"},{"label":"오답 확인","text":"배지·양액을 적절히 관리하면 연작장해 회피, 자동화, 청정 생산 등이 가능하다. 배지종류와 소독·양액관리가 전제된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"수경·무토양재배","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":[]},{"id":"6-75","round":6,"year":2020,"number":75,"subject":"재배학·원예작물학","topic":"시설 토양 염류","stem":"시설 내의 환경 특이성에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"위치에 따라 온도 분포가 다르다."},{"n":"2","text":"위치에 따라 광 분포가 불균일하다."},{"n":"3","text":"노지에 비해 토양의 염류 농도가 낮아지기 쉽다."},{"n":"4","text":"노지에 비해 토양이 건조해지기 쉽다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n시설은 강우용탈이 적고 비료가 집적되어 노지보다 염류농도가 높아지기 쉽다. 낮아지기 쉽다는 ③이 틀리다.\n\n오답 확인\n위치별 온도·광의 불균일, 강우차단에 따른 토양건조 경향은 시설의 환경특성이다. 관수량·환기·재식밀도를 조정한다.\n\n근거·학습주제\n시설환경·염류집적","explanationSections":[{"label":"정답 근거","text":"시설은 강우용탈이 적고 비료가 집적되어 노지보다 염류농도가 높아지기 쉽다. 낮아지기 쉽다는 ③이 틀리다.","kind":"reason"},{"label":"오답 확인","text":"위치별 온도·광의 불균일, 강우차단에 따른 토양건조 경향은 시설의 환경특성이다. 관수량·환기·재식밀도를 조정한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설환경·염류집적","kind":"reference"}],"sourcePdf":"2020년 제6회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":36,"similarIds":[]},{"id":"7-1","round":7,"year":2021,"number":1,"subject":"상법(보험편)","topic":"보험계약의 성립","stem":"보험계약에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약은 유상ㆍ쌍무계약이다."},{"n":"2","text":"보험계약은 보험자의 청약에 대하여 보험계약자가 승낙함으로써 성립한다."},{"n":"3","text":"보험계약은 보험자의 보험금 지급책임이 우연한 사고의 발생에 달려 있으므로 사행\n계약의 성질을 갖는다."},{"n":"4","text":"보험계약은 부합계약이다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n청약자는 통상 보험계약자이고 승낙자는 보험자다. ②는 두 당사자의 지위를 거꾸로 설명했다.\n\n오답 확인\n① 유상·쌍무, ③ 우연한 사고에 의존하는 사행성, ④ 정형약관에 따르는 부합성은 보험계약의 성질이다.\n\n근거·학습주제\n상법 제638조·제638조의2","explanationSections":[{"label":"정답 근거","text":"청약자는 통상 보험계약자이고 승낙자는 보험자다. ②는 두 당사자의 지위를 거꾸로 설명했다.","kind":"reason"},{"label":"오답 확인","text":"① 유상·쌍무, ③ 우연한 사고에 의존하는 사행성, ④ 정형약관에 따르는 부합성은 보험계약의 성질이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조·제638조의2","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["4-1","5-1"]},{"id":"7-2","round":7,"year":2021,"number":2,"subject":"상법(보험편)","topic":"타인을 위한 보험","stem":"타인을 위한 보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자는 위임을 받지 아니하면 특정의 타인을 위하여 보험계약을 체결할 수 없다."},{"n":"2","text":"타인을 위한 보험계약의 경우에 그 타인은 수익의 의사표시를 하여야 그 계약의 이익을\n받을 수 있다."},{"n":"3","text":"보험계약자가 불특정의 타인을 위한 보험을 그 타인의 위임 없이 체결할 경우에는 이를\n보험자에게 고지할 필요가 없다."},{"n":"4","text":"타인을 위한 보험계약의 경우 보험계약자가 보험료의 지급을 지체한 때에는 그 타인이\n그 권리를 포기하지 아니하는 한 그 타인도 보험료를 지급할 의무가 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n계약자의 보험료 지급지체 시 타인이 권리를 포기하지 않는 한 타인도 지급의무를 진다.\n\n오답 확인\n① 위임 없이도 체결 가능하다. ② 수익 의사표시는 불필요하다. ③ 위임 없는 불특정 타인 보험도 그 사실을 보험자에게 고지해야 한다.\n\n근거·학습주제\n상법 제639조","explanationSections":[{"label":"정답 근거","text":"계약자의 보험료 지급지체 시 타인이 권리를 포기하지 않는 한 타인도 지급의무를 진다.","kind":"reason"},{"label":"오답 확인","text":"① 위임 없이도 체결 가능하다. ② 수익 의사표시는 불필요하다. ③ 위임 없는 불특정 타인 보험도 그 사실을 보험자에게 고지해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["5-3","9-2","6-12","3-4","11-2","2-17","7-5","3-7","12-3","11-7","9-6"]},{"id":"7-3","round":7,"year":2021,"number":3,"subject":"상법(보험편)","topic":"보험증권과 소급보험","stem":"상법상 보험에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험증권의 멸실로 보험계약자가 증권의 재교부를 청구한 경우 증권의 작성비용은\n보험자의 부담으로 한다."},{"n":"2","text":"보험기간의 시기는 보험계약 이후로만 하여야 한다."},{"n":"3","text":"보험계약당시에 보험사고가 이미 발생하였을 경우 당사자 쌍방과 피보험자가 이를 알지\n못하였어도 그 계약은 무효이다."},{"n":"4","text":"보험계약의 당사자는 보험증권의 교부가 있은 날로부터 일정한 기간내에 한하여 그\n증권내용의 정부(正否)에 관한 이의를 할 수 있음을 약정할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n증권 교부 후 일정 기간 내에만 증권 내용의 옳고 그름에 이의하도록 약정할 수 있다. 그 기간은 1개월 이상이어야 한다.\n\n오답 확인\n① 재교부 비용은 계약자 부담이다. ② 소급보험도 가능하다. ③ 당사자 쌍방과 피보험자 모두 사고 발생을 몰랐다면 객관적 확정의 무효 원칙의 예외다.\n\n근거·학습주제\n상법 제641조~제644조","explanationSections":[{"label":"정답 근거","text":"증권 교부 후 일정 기간 내에만 증권 내용의 옳고 그름에 이의하도록 약정할 수 있다. 그 기간은 1개월 이상이어야 한다.","kind":"reason"},{"label":"오답 확인","text":"① 재교부 비용은 계약자 부담이다. ② 소급보험도 가능하다. ③ 당사자 쌍방과 피보험자 모두 사고 발생을 몰랐다면 객관적 확정의 무효 원칙의 예외다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제641조~제644조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["10-3","4-3","9-3","11-3","5-4","12-1","2-2","6-13","3-5","8-3","4-4","11-4"]},{"id":"7-4","round":7,"year":2021,"number":4,"subject":"상법(보험편)","topic":"보험대리상의 권한","stem":"보험대리상 등의 권한에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험대리상은 보험계약자로부터 보험계약에 관한 청약의 의사표시를 수령할 수 있다."},{"n":"2","text":"보험자는 보험계약자로부터 보험료를 수령할 수 있는 보험대리상의 권한을 제한할 수 있다."},{"n":"3","text":"보험대리상은 보험계약자에게 보험계약에 관한 해지의 의사표시를 할 수 없다."},{"n":"4","text":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개\n하는 자는 보험계약자로부터 보험계약에 관한 취소의 의사표시를 수령할 수 없다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험대리상은 보험계약의 체결·변경·해지 등 의사표시를 할 법정 권한을 갖는다. ③의 전면 부정이 틀렸다.\n\n오답 확인\n① 청약 수령, ② 권한 제한은 가능하다. 다만 제한은 선의의 계약자에게 대항하지 못한다. ④ 단순 중개자의 법정 권한은 제한적이다.\n\n근거·학습주제\n상법 제646조의2","explanationSections":[{"label":"정답 근거","text":"보험대리상은 보험계약의 체결·변경·해지 등 의사표시를 할 법정 권한을 갖는다. ③의 전면 부정이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"① 청약 수령, ② 권한 제한은 가능하다. 다만 제한은 선의의 계약자에게 대항하지 못한다. ④ 단순 중개자의 법정 권한은 제한적이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["11-5","12-4","4-5","5-6","8-5","6-15","2-3","2-21","12-5","8-6","9-5","10-4"]},{"id":"7-5","round":7,"year":2021,"number":5,"subject":"상법(보험편)","topic":"임의해지와 보험료 반환","stem":"보험계약의 해지에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약자가 보험계약을 전부 해지했을 때에는 언제든지 미경과보험료의 반환을 청\n구할 수 있다."},{"n":"2","text":"타인을 위한 보험의 경우를 제외하고, 보험사고가 발생하기 전에는 보험계약자는\n언제든지 보험계약의 전부를 해지할 수 있다."},{"n":"3","text":"타인을 위한 보험계약의 경우 보험사고가 발생하기 전에는 그 타인의 동의를 얻으면\n그 계약을 해지할 수 있다."},{"n":"4","text":"보험금액이 지급된 때에도 보험금액이 감액되지 아니하는 보험의 경우에는 보험계약\n자는 그 사고발생후에도 보험계약을 해지할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n전부 해지 시 미경과보험료 반환은 언제나 인정되는 것이 아니라 당사자 사이에 다른 약정이 없는 경우의 원칙이다.\n\n오답 확인\n② 사고 전 임의해지, ③ 타인 동의를 얻은 해지, ④ 지급 후에도 보험금액이 감액되지 않는 보험의 사고 후 해지는 인정된다.\n\n근거·학습주제\n상법 제649조","explanationSections":[{"label":"정답 근거","text":"전부 해지 시 미경과보험료 반환은 언제나 인정되는 것이 아니라 당사자 사이에 다른 약정이 없는 경우의 원칙이다.","kind":"reason"},{"label":"오답 확인","text":"② 사고 전 임의해지, ③ 타인 동의를 얻은 해지, ④ 지급 후에도 보험금액이 감액되지 않는 보험의 사고 후 해지는 인정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제649조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["3-7","6-16","12-6","2-4","5-7","10-7","9-6","6-12","4-9","7-2","9-4","11-6","11-4","9-11","5-3","3-11","12-3","3-4","11-2","2-5"]},{"id":"7-6","round":7,"year":2021,"number":6,"subject":"상법(보험편)","topic":"보험료 지급과 지체","stem":"보험료의 지급과 지체의 효과에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자는 계약체결후 지체없이 보험료의 전부 또는 제1회 보험료를 지급하여야\n한다."},{"n":"2","text":"계속보험료가 약정한 시기에 지급되지 아니한 때에는 보험자는 상당한 기간을 정하여\n보험계약자에게 최고하고 그 기간내에 지급되지 아니한 때에는 그 계약은 해지된 것\n으로 본다."},{"n":"3","text":"특정한 타인을 위한 보험의 경우에 보험계약자가 보험료의 지급을 지체한 때에는\n보험자는 그 계약을 해제 또는 해지할 수 있다."},{"n":"4","text":"보험계약자가 최초보험료를 지급하지 아니한 경우에는 다른 약정이 없는 한 계약성립\n후 1월이 경과하면 그 계약은 해제된 것으로 본다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n계약자는 계약 체결 후 지체 없이 보험료 전부 또는 제1회 보험료를 지급한다.\n\n오답 확인\n② 최고기간 경과로 자 \nㄷ. 약관의 내용이 이미 법령에 의하여 정하여진 것을 되풀이 하는 정도에 불과한\n경우, 보험자는 고객에게 이를 따로 설명하지 않아도 된다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\nㄱ은 합의에 따른 약관 편입 원리, ㄷ은 법령을 반복하는 조항의 설명의무 면제에 관한 판례 법리다.\n\n오답 확인\nㄴ은 취소권자를 피보험자·수익자로 확대하고 취소를 해지로 바꾼 점이 틀렸다. 법정 취소권자는 보험계약자이고 기간은 3개월이다.\n\n근거·학습주제\n상법 제638조의3·약관 설명의무 판례","explanationSections":[{"label":"정답 근거","text":"ㄱ은 합의에 따른 약관 편입 원리, ㄷ은 법령을 반복하는 조항의 설명의무 면제에 관한 판례 법리다.","kind":"reason"},{"label":"오답 확인","text":"ㄴ은 취소권자를 피보험자·수익자로 확대하고 취소를 해지로 바꾼 점이 틀렸다. 법정 취소권자는 보험계약자이고 기간은 3개월이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·약관 설명의무 판례","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["5-2","4-2","2-16","3-3"]},{"id":"7-9","round":7,"year":2021,"number":9,"subject":"상법(보험편)","topic":"위험변경의 통지","stem":"위험변경증가의 통지와 계약해지에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험기간 중에 피보험자가 사고발생의 위험이 현저하게 변경 또는 증가된 사실을 안\n때에는 지체없이 보험자에게 통지하여야 한다."},{"n":"2","text":"보험계약체결 직전에 보험계약자가 사고발생의 위험이 변경 또는 증가된 사실을 안\n때에는 지체없이 보험자에게 통지하여야 한다."},{"n":"3","text":"보험기간 중에 위험변경증가의 통지를 받은 때에는 보험자는 3개월 내에 보험료의\n증액을 청구할 수 있다."},{"n":"4","text":"보험기간 중에 위험변경증가의 통지를 받은 때에는 보험자는 3개월 내에 계약을 해지\n할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보험기간 중 계약자 또는 피보험자가 현저한 위험변경·증가를 알면 지체 없이 통지해야 한다.\n\n오답 확인\n② 계약체결 전 사정은 고지의무 문제다. ③④ 보험료 증액 또는 해지권의 행사기간은 통지를 받은 날부터 1개월이다.\n\n근거·학습주제\n상법 제652조","explanationSections":[{"label":"정답 근거","text":"보험기간 중 계약자 또는 피보험자가 현저한 위험변경·증가를 알면 지체 없이 통지해야 한다.","kind":"reason"},{"label":"오답 확인","text":"② 계약체결 전 사정은 고지의무 문제다. ③④ 보험료 증액 또는 해지권의 행사기간은 통지를 받은 날부터 1개월이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["4-10","2-14","3-10","11-10","9-15","10-9","6-19","1-9","7-10","12-9","4-6","8-10","10-10","5-9","11-11","7-12"]},{"id":"7-10","round":7,"year":2021,"number":10,"subject":"상법(보험편)","topic":"위험증가의 인과관계","stem":"보험계약자 등의 고의나 중과실로 인한 위험증가와 계약해지에 관한 설명으로 옳지\n않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험기간 중에 보험계약자의 중대한 과실로 인하여 사고발생의 위험이 현저하게 증가\n된 때에는 보험자는 그 사실을 안 날부터 1월내에 보험료의 증액을 청구할 수 있다."},{"n":"2","text":"위험의 현저한 변경이나 증가된 사실과 보험사고 발생과의 사이에 인과관계가 부존재\n한다는 점에 관한 주장ㆍ입증책임은 보험자 측에 있다."},{"n":"3","text":"보험기간 중에 피보험자의 고의로 인하여 사고발생의 위험이 현저하게 증가된 때에는\n보험자는 그 사실을 안 날부터 1월내에 계약을 해지할 수 있다."},{"n":"4","text":"사고 발생의 위험이 현저하게 변경 또는 증가된 사실이라 함은 그 변경 또는 증가된\n위험이 보험계약의 체결 당시에 존재하고 있었다면 보험자가 보험계약을 체결하지 않\n았거나 적어도 그 보험료로는 보험을 인수하지 않았을 것으로 인정되는 정도의 것을\n말한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n위험증가와 사고 사이에 인과관계가 없다는 사정의 주장·입증책임은 계약자 측에 있다. 보험자 측이라는 ②가 틀렸다.\n\n오답 확인\n①③ 고의·중과실에 의한 현저한 위험증가는 인지 후 1개월 내 증액 또는 해지 사유다. ④ 인수 여부·보험료 판단에 영향을 줄 정도가 현저성 기준이다.\n\n근거·학습주제\n상법 제653조·제655조","explanationSections":[{"label":"정답 근거","text":"위험증가와 사고 사이에 인과관계가 없다는 사정의 주장·입증책임은 계약자 측에 있다. 보험자 측이라는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"①③ 고의·중과실에 의한 현저한 위험증가는 인지 후 1개월 내 증액 또는 해지 사유다. ④ 인수 여부·보험료 판단에 영향을 줄 정도가 현저성 기준이다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제653조·제655조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["3-10","11-10","9-15","10-9","12-9","6-19","7-9","4-10","8-10","2-14","5-9","8-11","4-6"]},{"id":"7-11","round":7,"year":2021,"number":11,"subject":"상법(보험편)","topic":"해지 후 보험금","stem":"보험자의 계약해지와 보험금청구권에 관한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 보험사고 발생 후라도 보험계약자의 계속보험료 지급지체를 이유로 보험자가\n계약을 해지하였을 때에는 보험금을 지급할 책임이 있다.\nㄴ. 보험사고 발생 후에 보험계약자가 고지의무를 위반한 사실이 보험사고 발\n생에 영향을 미치지 아니하였음이 증명된 경우에는 보험자는 보험금을 지\n급할 책임이 있다.\nㄷ. 보험수익자의 중과실로 인하여 사고발생의 위험이 현저하게 변경되거나 증\n가된 사실이 보험사고 발생에 영향을 미치지 아니하였음이 증명된 경우에는\n보험자는 보험금을 지급할 책임이 있다.","options":[{"n":"1","text":"ㄷ"},{"n":"2","text":"ㄱ, ㄴ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\nㄴ과 ㄷ은 고지의무 위반 또는 위험증가와 사고 사이 인과관계가 없음을 증명한 경우의 보험금 지급책임이다.\n\n오답 확인\nㄱ의 계속보험료 지급지체를 이유로 사고 후 해지하면 제655조 본문상 면책이 가능하다. 인과관계 예외는 고지의무·위험변경증가에 관한 경우와 구별한다.\n\n근거·학습주제\n상법 제655조","explanationSections":[{"label":"정답 근거","text":"ㄴ과 ㄷ은 고지의무 위반 또는 위험증가와 사고 사이 인과관계가 없음을 증명한 경우의 보험금 지급책임이다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ의 계속보험료 지급지체를 이유로 사고 후 해지하면 제655조 본문상 면책이 가능하다. 인과관계 예외는 고지의무·위험변경증가에 관한 경우와 구별한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제655조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["3-11","6-19","12-8","10-11","1-8","9-8","2-18","11-12","12-10","10-10"]},{"id":"7-12","round":7,"year":2021,"number":12,"subject":"상법(보험편)","topic":"사고 통지의무","stem":"보험사고발생의 통지의무에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"상법은 보험사고발생의 통지의무위반 시 보험자의 계약해지권을 규정하고 있다."},{"n":"2","text":"보험계약자는 보험사고의 발생을 안 때에는 상당한 기간 내에 보험자에게 그 통지를\n발송하여야 한다."},{"n":"3","text":"피보험자가 보험사고발생의 통지의무를 해태함으로 인하여 손해가 증가된 때에는\n보험자는 그 증가된 손해를 보상할 책임이 없다."},{"n":"4","text":"보험수익자는 보험사고발생의 통지의무자에 포함되지 않는다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n통지를 게을리하여 손해가 증가하면 보험자는 그 증가분을 보상하지 않는다.\n\n오답 확인\n① 통지 지연만으로 법정 해지권이 생기지 않는다. ② 지체 없이 통지해야 한다. ④ 보험수익자도 통지의무자다.\n\n근거·학습주제\n상법 제657조","explanationSections":[{"label":"정답 근거","text":"통지를 게을리하여 손해가 증가하면 보험자는 그 증가분을 보상하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"① 통지 지연만으로 법정 해지권이 생기지 않는다. ② 지체 없이 통지해야 한다. ④ 보험수익자도 통지의무자다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제657조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["4-11","11-11","9-16","9-15","2-14","12-10","2-18","10-10","7-9","4-10"]},{"id":"7-13","round":7,"year":2021,"number":13,"subject":"상법(보험편)","topic":"상실이익과 손해보험","stem":"손해보험에 관한 설명으로 옳지 않은 것은? (단, 다른 약정이 없음을 전제로 함)","options":[{"n":"1","text":"보험사고로 인하여 상실된 피보험자가 얻을 보수는 보험자가 보상할 손해액에 산입\n하여야 한다."},{"n":"2","text":"보험계약은 금전으로 산정할 수 있는 이익에 한하여 보험계약의 목적으로 할 수 있다."},{"n":"3","text":"무효와 실권의 사유는 손해보험증권의 기재사항이다."},{"n":"4","text":"당사자간에 보험가액을 정하지 아니한 때에는 사고발생시의 가액을 보험가액으로 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n다른 약정이 없으면 사고로 상실한 이익이나 보수는 보상 손해액에 산입하지 않는다.\n\n오답 확인\n② 금전 평가 가능한 이익이 피보험이익이다. ③ 무효·실권 사유는 증권 기재사항이다. ④ 미평가보험은 사고발생시 가액을 기준으로 한다.\n\n근거·학습주제\n상법 제666조~제668조·제671조","explanationSections":[{"label":"정답 근거","text":"다른 약정이 없으면 사고로 상실한 이익이나 보수는 보상 손해액에 산입하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"② 금전 평가 가능한 이익이 피보험이익이다. ③ 무효·실권 사유는 증권 기재사항이다. ④ 미평가보험은 사고발생시 가액을 기준으로 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조~제668조·제671조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["8-15","12-15","9-17","10-19","7-20","9-12","11-16","10-15","5-13","6-25","2-9","5-15","6-4","2-22","2-12"]},{"id":"7-14","round":7,"year":2021,"number":14,"subject":"상법(보험편)","topic":"보험금 지급기한","stem":"보험금액의 지급에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험금액의 지급에 관하여 약정기간이 있는 경우, 보험자는 그 기간 내에 보험금액을\n지급하여야 한다."},{"n":"2","text":"보험금액의 지급에 관하여 약정기간이 없는 경우, 보험자는 보험사고발생의 통지를\n받은 후 지체없이 지급할 보험금액을 정하여야 한다."},{"n":"3","text":"보험금액의 지급에 관하여 약정기간이 없는 경우, 보험금액이 정하여진 날부터 1월내에\n보험수익자에게 보험금액을 지급하여야 한다."},{"n":"4","text":"보험계약자의 동의없이 보험자와 피보험자 사이에 한 보험금 지급기한 유예의 합의\n는 유효하다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n약정기간이 없으면 지급보험금이 정해진 날부터 10일 이내에 지급한다. 1개월이라는 ③이 틀렸다.\n\n오답 확인\n① 약정기간 준수, ② 통지 후 지체 없는 금액 결정은 법정 의무다. ④ 피보험자 자신의 보험금 지급기한에 관한 유예합의는 계약자 동의 없이도 가능하다.\n\n근거·학습주제\n상법 제658조","explanationSections":[{"label":"정답 근거","text":"약정기간이 없으면 지급보험금이 정해진 날부터 10일 이내에 지급한다. 1개월이라는 ③이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"① 약정기간 준수, ② 통지 후 지체 없는 금액 결정은 법정 의무다. ④ 피보험자 자신의 보험금 지급기한에 관한 유예합의는 계약자 동의 없이도 가능하다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제658조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["9-13","3-12","12-10","10-11","2-18","4-12","8-12","11-12","5-9","1-11"]},{"id":"7-15","round":7,"year":2021,"num :"2번","explanation":"정답 근거\n손해평가사의 법정 업무는 농작물재해보험과 가축재해보험의 손해평가이며 임산물 피해확인은 여기에 포함되지 않는다.\n\n오답 확인\n① 운영 주체는 농림축산식품부장관이다. ③ 자격취소 후 응시제한은 2년이다. ④ 자격증 대여 알선도 금지된다.\n\n근거·학습주제\n농어업재해보험법 제11조의4","explanationSections":[{"label":"정답 근거","text":"손해평가사의 법정 업무는 농작물재해보험과 가축재해보험의 손해평가이며 임산물 피해확인은 여기에 포함되지 않는다.","kind":"reason"},{"label":"오답 확인","text":"① 운영 주체는 농림축산식품부장관이다. ③ 자격취소 후 응시제한은 2년이다. ④ 자격증 대여 알선도 금지된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의4","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["11-31","5-41","3-30","3-31","7-29"]},{"id":"7-31","round":7,"year":2021,"number":31,"subject":"농어업재해보험법령","topic":"필요적 자격취소","stem":"농어업재해보험법상 농림축산식품부장관이 손해평가사 자격을 취소하여야 하는\n대상을 모두 고른 것은?\nㄱ. 업무정지 기간 중에 손해평가 업무를 수행한 사람\nㄴ. 업무 수행과 관련하여 향응을 제공받은 사람\nㄷ. 손해평가사의 자격을 부정한 방법으로 취득한 사람\nㄹ. 손해평가 요령을 준수하지 않고 손해평가를 한 사람","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄹ"},{"n":"4","text":"ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n부정 자격취득과 업무정지 중 업무수행은 반드시 취소하는 사유로 ㄱ·ㄷ이다.\n\n오답 확인\n향응 제공받음, 요령 위반은 제재사유지만 곧바로 모두 필요적 취소로 분류하지 않는다.\n\n근거·학습주제\n농어업재해보험법 제11조의5","explanationSections":[{"label":"정답 근거","text":"부정 자격취득과 업무정지 중 업무수행은 반드시 취소하는 사유로 ㄱ·ㄷ이다.","kind":"reason"},{"label":"오답 확인","text":"향응 제공받음, 요령 위반은 제재사유지만 곧바로 모두 필요적 취소로 분류하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제11조의5","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":16,"similarIds":["6-33","1-33","2-31","4-28","11-31","9-32","3-31","10-30","8-30"]},{"id":"7-32","round":7,"year":2021,"number":32,"subject":"농어업재해보험법령","topic":"보험금 수급권","stem":"농어업재해보험법령상 보험금 수급권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"재해보험사업자는 보험금을 현금으로 지급하여야 하나, 불가피한 사유가 있을 때에는\n수급권자의 신청이 없더라도 수급권자 명의의 계좌로 입금할 수 있다."},{"n":"2","text":"재해보험가입자가 재해보험에 가입된 보험목적물을 양도하는 경우 그 양수인은 재해\n보험계약에 관한 양도인의 권리 및 의무를 승계한다."},{"n":"3","text":"재해보험의 보험목적물이 담보로 제공된 경우에는 보험금을 지급받을 권리를 압류할\n수 있다."},{"n":"4","text":"농작물의 재생산에 직접적으로 소요되는 비용의 보장을 목적으로 보험금수급전용계좌로\n입금된 보험금의 경우 그 2분의 1에 해당하는 액수 이하의 금액에 관하여는 채권을 압\n류할 수 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험금 청구권은 원칙적으로 압류가 금지되나 보험목적물이 담보 제공된 경우 예외가 있다.\n\n오답 확인\n① 전용계좌 입금은 수급권자 신청을 전제로 한다. ② 법 제13조는 양수인이 권리·의무를 승계한 것으로 추정하는 규정이지, 반증을 허용하지 않는 확정적 승계가 아니다. ④ 전용계좌의 압류금지 범위를 임의로 절반까지 허용할 수 없다.\n\n근거·학습주제\n농어업재해보험법 제12조·제13조","explanationSections":[{"label":"정답 근거","text":"보험금 청구권은 원칙적으로 압류가 금지되나 보험목적물이 담보 제공된 경우 예외가 있다.","kind":"reason"},{"label":"오답 확인","text":"① 전용계좌 입금은 수급권자 신청을 전제로 한다. ② 법 제13조는 양수인이 권리·의무를 승계한 것으로 추정하는 규정이지, 반증을 허용하지 않는 확정적 승계가 아니다. ④ 전용계좌의 압류금지 범위를 임의로 절반까지 허용할 수 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제12조·제13조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["12-31","11-29","10-31","9-33","3-33","2-32"]},{"id":"7-33","round":7,"year":2021,"number":33,"subject":"농어업재해보험법령","topic":"업무 위탁","stem":"농어업재해보험법령상 재해보험사업자가 재해보험 업무의 일부를 위탁할 수 있는\n자가 아닌 것은?","options":[{"n":"1","text":"농업협동조합법 에 따라 설립된 지역축산업협동조합"},{"n":"2","text":"농업ㆍ농촌 및 식품산업 기본법 에 따라 설립된 농업정책보험금융원"},{"n":"3","text":"산림조합법 에 따라 설립된 품목별ㆍ업종별산림조합"},{"n":"4","text":"보험업법 에 따라 손해사정을 업으로 하는 자"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n농업정책보험금융원은 제14조의 재해보험사업자 업무 위탁 대상과 재보험기금 사무 수탁기관을 구별해야 한다. 이 문항의 제외 대상은 ②다.\n\n오답 확인\n지역축협·산림조합과 손해사정업자는 법령이 정하는 위탁 가능 범위에 들어간다.\n\n근거·학습주제\n농어업재해보험법 제14조·시행령 위탁","explanationSections":[{"label":"정답 근거","text":"농업정책보험금융원은 제14조의 재해보험사업자 업무 위탁 대상과 재보험기금 사무 수탁기관을 구별해야 한다. 이 문항의 제외 대상은 ②다.","kind":"reason"},{"label":"오답 확인","text":"지역축협·산림조합과 손해사정업자는 법령이 정하는 위탁 가능 범위에 들어간다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제14조·시행령 위탁","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":17,"similarIds":["1-35","10-32","6-43","8-32","4-32","12-30","7-27","5-40","5-38","8-28","2-37"]},{"id":"7-34","round":7,"year":2021,"number":34,"subject":"농어업재해보험법령","topic":"정부 재정지원","stem":"농어업재해보험법상 재정지원에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"정부는 예산의 범위에서 재해보험가입자가 부담하는 보험료의 전부 또는 일부를 지원\n할 수 있다."},{"n":"2","text":"지방자치단체는 예산의 범위에서 재해보험사업자의 재해보험의 운영 및 관리에 필요\n한 비용의 전부 또는 일부를 지원할 수 있다."},{"n":"3","text":"농림축산식품부장관은 정부의 보험료 지원 금액을 재해보험가입자에게 지급하여야 한다."},{"n":"4","text":"풍수해보험법 에 따른 풍수해보험에 가입한 자가 동일한 보험목적물을 대상으로\n재해보험에 가입할 경우에는 정부가 재정지원을 하지 아니한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n동일 목적물에 풍수해보험을 가입한 경우 중복 지원을 방지하기 위하여 재해보험 재정지원을 하지 않는다.\n\n오답 확인\n① 정부 보험료 지원은 일부다. ② 지자체의 법정 지원은 가입자 부담 보험료 일부다. ③ 지원금은 재해보험사업자에게 지급한다.\n\n기준·해석 메모\n현재 법률명은 풍수해·지진재해보험법으로 변경되었다. 과거 문제의 풍수해보험법 표기는 당시 법명이다.\n\n근거·학습주제\n농어업재해보험법 제19조","explanationSections":[{"label":"정답 근거","text":"동일 목적물에 풍수해보험을 가입한 경우 중복 지원을 방지하기 위하여 재해보험 재정지원을 하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"① 정부 보험료 지원은 일부다. ② 지자체의 법정 지원은 가입자 부담 보험료 일부다. ③ 지원금은 재해보험사업자에게 지급한다.","kind":"incorrect"},{"label":"기준·해석 메모","text":"현재 법률명은 풍수해·지진재해보험법으로 변경되었다. 과거 문제의 풍수해보험법 표기는 당시 법명이다.","kind":"note"},{"label":"근거·학습주제","text":"농어업재해보험법 제19조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["11-33","5-43","10-33","8-33","1-36","12-32","3-40","6-34","2-33"]},{"id":"7-35","round":7,"year":2021,"number":35,"subject":"농어업재해보험법령","topic":"재보험기금 용도","stem":"농어업재해보험법령상 재보험사업 및 농어업재해재보험기금(이하 “기금”이라 함)에\n관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"기금은 기금의 관리ㆍ운용에 필요한 경비의 지출에 사용할 수 없다."},{"n":"2","text":"농림축산식품부장관은 해양수산부장관과 협의하여 기금의 수입과 지출을 명확히 하기\n위하여 한국은행에 기금계정을 설치하여야 한다."},{"n":"3","text":"재보험금의 회수 자금은 기금 조성의 재원에 포함된다."},{"n":"4","text":"정부는 재해보험에 관한 재보험사업을 할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n기금 관리·운용에 필요한 경비도 법정 사용용도에 포함된다. 사용할 수 없다는 ①이 틀렸다.\n\n오답 확인\n② 한국은행 기금계정, ③ 재보험금 회수자금의 재원 포함, ④ 정부 재보험사업은 맞다.\n\n근거·학습주제\n농어업재해보험법 제20조~제25조","explanationSections":[{"label":"정답 근거","text":"기금 관리·운용에 필요한 경비도 법정 사용용도에 포함된다. 사용할 수 없다는 ①이 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"② 한국은행 기금계정, ③ 재보험금 회수자금의 재원 포함, ④ 정부 재보험사업은 맞다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 제20조~제25조","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":18,"similarIds":["4-35","8-36","10-36","11-36","7-36","3-38","9-36","6-39","5-27","10-34","12-35"]},{"id":"7-36","round":7,"year":2021,"number":36,"subject":"농어업재해보험법령","topic":"기금 회계담당자","stem":"농어업재해보험법상 농어업재해재보험기금(이하 “기금”이라 함)에 관한 설명으로\n옳지 않은 것은?","options":[{"n":"1","text":"기금은 농림축산식품부장관이 해양수산부장관과 협의하여 관리ㆍ운용한다."},{"n":"2","text":"농림축산식품부장관은 해양수산부장관과 협의를 거쳐 기금의 관리ㆍ운용에 관한 사무의\n일부를 농업정책보험금융원에 위탁할 수 있다."},{"n":"3","text":"농림축산식품부장관은 해양수산부장관과 협의하여 기금의 수입과 지출에 관한 사무를\n수행하게 하기 위하여 소속 공무원 중에서 기금수입징수관 등을 임명한다."},{"n":"4","text":"농림축산식품부장관이 농업정책보험금융원의 임원 중에서 임명한 기금지출원인행위\n담당임원은 기금지출관의 업무를 수행한다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n기금지출원인행위 담당임원과 실제 기금지출 업무 담당자는 구분한다. 전자가 기금지출관 업무도 수행한다는 ④가 틀렸다.\n\n오답 확인\n관리·운용 주체는 농림축산식품부장관이며 해양수산부장관과 협의한다. 사무 일부의 금융원 위탁과 담당 공무원 임명은 인정된다.\n\n근거·학습주제\n농어업재해보험법 기금 회계","explanationSections":[{"label":"정답 근거","text":"기금지출원인행위 담당임원과 실제 기금지출 업무 담당자는 구분한다. 전자가 기금지출관 업무도 수행한다는 ④가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"관리·운용 주체는 농림축산식품부장관이며 해양수산부장관과 협의한다. 사무 일부의 금융원 위탁과 담당 공무원 임명은 인정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농어업재해보험법 기금 회계","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":19,"similarIds":["11-36","4-35","10-34","8-36","3-38","10-36","6-39","7-35","12-35","9-36","9-37","10-35"]},{"id":"7-37","round":7,"year":2021,"number":37,"subject":"농어업재해보험법령","topic":"보험가입촉진계획","stem":"농어업재해보험법령상 보험가입촉진계획에 포함되어야 하는 사항을 모두 고른 것은?\nㄱ. 전년도의 성과분석 및 해당 연도의 사업계획\nㄴ. 해당 연도의 보험상품 운영계획\nㄷ. 농어업재해보험 교육 및 홍보계획","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n전년도 성과·당해 사업계획, 상품 운영계획, 교육·홍보계획이 모두 포함된다.\n\n오답 확인\n선택지 ①②③은 각 한 항목을 누락했다. 가입촉진은 실적분석·상품·교육홍보를 :"incorrect"},{"label":"기준·해석 메모","text":"2024년 개정 이후 후견 관련 문구가 변경되었다. 당시의 피한정후견인 기준을 현재 규정에 그대로 적용하지 않는다.","kind":"note"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 위촉취소","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":20,"similarIds":["2-49","9-42"]},{"id":"7-42","round":7,"year":2021,"number":42,"subject":"농어업재해보험법령","topic":"손해평가반 배제","stem":"농업재해보험 손해평가요령상 손해평가사 甲을 손해평가반 구성에서 배제하여야\n하는 경우를 모두 고른 것은?\nㄱ. 甲의 이해관계자가 가입한 보험계약에 관한 손해평가\nㄴ. 甲의 이해관계자가 모집한 보험계약에 관한 손해평가\nㄷ. 甲의 이해관계자가 실시한 손해평가에 대한 검증조사","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄱ, ㄷ"},{"n":"3","text":"ㄴ, ㄷ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n이해관계자가 가입하거나 모집한 계약의 평가는 이해충돌 방지를 위해 배제한다. ㄱ·ㄴ이 해당한다.\n\n오답 확인\nㄷ의 이해관계자가 실시한 평가에 대한 검증조사는 해당 배제조항의 열거사항과 같지 않다. 열거된 배제사유를 임의로 확대하지 않는다.\n\n근거·학습주제\n농업재해보험 손해평가요령 손해평가반 구성","explanationSections":[{"label":"정답 근거","text":"이해관계자가 가입하거나 모집한 계약의 평가는 이해충돌 방지를 위해 배제한다. ㄱ·ㄴ이 해당한다.","kind":"reason"},{"label":"오답 확인","text":"ㄷ의 이해관계자가 실시한 평가에 대한 검증조사는 해당 배제조항의 열거사항과 같지 않다. 열거된 배제사유를 임의로 확대하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"농업재해보험 손해평가요령 손해평가반 구성","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":21,"similarIds":["9-38","8-43","5-34"]},{"id":"7-43","round":7,"year":2021,"number":43,"subject":"농어업재해보험법령","topic":"교차손해평가","stem":"농업재해보험 손해평가요령상 손해평가에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"손해평가반은 손해평가인, 손해평가사, 손해사정사 중 어느 하나에 해당하는 자를 1인\n이상 포함하여 5인 이내로 구성한다."},{"n":"2","text":"교차손해평가에 있어서 거대재해 발생 등으로 신속한 손해평가가 불가피하다고 판단\n되는 경우에도 손해평가반 구성에 지역손해평가인을 포함하여야 한다."},{"n":"3","text":"재해보험사업자는 손해평가반이 실시한 손해평가결과를 기록할 수 있도록 현지조사서를\n마련하여야 한다."},{"n":"4","text":"손해평가반이 손해평가를 실시할 때에는 재해보험사업자가 해당 보험가입자의 보험\n계약사항 중 손해평가와 관련된 사항을 손해평가반에게 통보하여야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n거대재해 등 신속한 평가가 불가피한 예외 상황까지 지역손해평가인을 반드시 포함한다는 ②가 틀렸다.\n\n오답 확인\n평가반은 자격자 1명 이상 포함 5명 이내다. 현지조사서와 계약 관련사항 통보도 평가절차의 일부다.\n\n근거· 4","text":"ㄱ: 피해형 냉해, ㄴ: 장기형 냉해"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n민감한 생육단계에서 단기간 저온으로 직접 피해를 받는 것은 장해형, 장기간 저온·일조부족으로 생육·등숙이 늦어지는 것은 지연형이다.\n\n오답 확인\n①은 두 유형이 반대다. 접촉형·감수형 등의 조합은 제시된 표준 분류가 아니다.\n\n근거·학습주제\n재배학 냉해 유형","explanationSections":[{"label":"정답 근거","text":"민감한 생육단계에서 단기간 저온으로 직접 피해를 받는 것은 장해형, 장기간 저온·일조부족으로 생육·등숙이 늦어지는 것은 지연형이다.","kind":"reason"},{"label":"오답 확인","text":"①은 두 유형이 반대다. 접촉형·감수형 등의 조합은 제시된 표준 분류가 아니다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 냉해 유형","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":["3-58","12-56"]},{"id":"7-56","round":7,"year":2021,"number":56,"subject":"재배학·원예작물학","topic":"C3·C4 작물","stem":"C4 작물이 아닌 것은?","options":[{"n":"1","text":"보리"},{"n":"2","text":"사탕수수"},{"n":"3","text":"수수"},{"n":"4","text":"옥수수"}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n보리는 C3 작물이다.\n\n오답 확인\n사탕수수·수수·옥수수는 C4 작물이다. C4는 고온·강광에서 광호흡이 적고 물 이용효율이 높다.\n\n근거·학습주제\n재배학 광합성","explanationSections":[{"label":"정답 근거","text":"보리는 C3 작물이다.","kind":"reason"},{"label":"오답 확인","text":"사탕수수·수수·옥수수는 C4 작물이다. C4는 고온·강광에서 광호흡이 적고 물 이용효율이 높다.","kind":"incorrect"},{"label":"근거·학습주제","text":"재배학 광합성","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":26,"similarIds":["12-54"]},{"id":"7-57","round":7,"year":2021,"number":57,"subject":"재배학·원예작물학","topic":"일장형 복수정답","stem":"작물의 일장형에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보통 16-18시간의 장일조건에서 개화가 유도, 촉진되는 식물을 장일식물이라고 하며\n시금치, 완두, 상추, 양파, 감자 등이 있다."},{"n":"2","text":"보통 8-10시간의 단일조건에서 개화가 유도, 촉진되는 식물을 단일식물이라고 하며\n가지, 콩, 오이, 호박 등이 있다."},{"n":"3","text":"일장의 영향을 받지 않는 식물을 중성식물이라고 하며 토마토, 당근, 강낭콩 등이 있다."},{"n":"4","text":"좁은 범위에서만 화성이 유도, 촉진되는 식물을 정일식물 또는 중간식물이라고 한다."}],"answers":["2","3"],"answerLabel":"2·3번 (복수정답)","explanation":"정답 근거\n공식 최종정답은 ②·③ 모두 인정한다. 가지·오이를 일률적으로 단일식물로 묶는 ②와 당근을 중성식물로 넣은 ③ 모두 분류상 문제가 있다.\n\n오답 확인\n① 장일성 작물 예시와 ④ 일정 범위 일장을 요구하는 중간식물 정의는 이 문항에서 오답으로 처리되지 않 n\n근거·학습주제\n시설원예 피복재 광학특성·원논문 성능평가","explanationSections":[{"label":"정답 근거","text":"공식 최종정답은 ④ PE 필름이다. 이 문항에는 파장대·두께·노화·결로 등 측정조건이 없어 공식 정답 이상의 보편적 서열로 확장하지 않는다.","kind":"reason"},{"label":"오답 확인","text":"PVC·ETFE·EVA가 모든 조건에서 PE보다 반드시 낮다고 단정할 수 없다. 광합성 유효광과 적외선 투과율도 구분해야 한다.","kind":"incorrect"},{"label":"기준·해석 메모","text":"공식키는 유지하되 문항의 투과율 조건 불명확성을 표시했다. ETFE·PE의 일사·가시광 투과율은 재료·제품·측정조건에 따라 달라진다.","kind":"note"},{"label":"근거·학습주제","text":"시설원예 피복재 광학특성·원논문 성능평가","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":["4-75","5-75","3-75","10-75","1-74"]},{"id":"7-75","round":7,"year":2021,"number":75,"subject":"재배학·원예작물학","topic":"담액수경","stem":"담액수경의 특징에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"산소 공급 장치를 설치해야 한다."},{"n":"2","text":"베드의 바닥에 일정한 구배를 만들어 양액이 흐르게 해야 한다."},{"n":"3","text":"배지로는 펄라이트와 암면 등이 사용된다."},{"n":"4","text":"베드를 높이 설치하여 작업효율을 높일 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n뿌리가 양액에 잠기는 담액수경은 용존산소 확보를 위한 산소 공급이 필요하다.\n\n오답 확인\n② 얇은 양액 흐름과 구배는 박막수경 특징, ③ 펄라이트·암면은 고형배지경 특징이다. ④ 고설은 담액수경 고유 특징으로 볼 수 없다.\n\n근거·학습주제\n시설원예 수경재배","explanationSections":[{"label":"정답 근거","text":"뿌리가 양액에 잠기는 담액수경은 용존산소 확보를 위한 산소 공급이 필요하다.","kind":"reason"},{"label":"오답 확인","text":"② 얇은 양액 흐름과 구배는 박막수경 특징, ③ 펄라이트·암면은 고형배지경 특징이다. ④ 고설은 담액수경 고유 특징으로 볼 수 없다.","kind":"incorrect"},{"label":"근거·학습주제","text":"시설원예 수경재배","kind":"reference"}],"sourcePdf":"2021년 제7회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":31,"similarIds":[]},{"id":"8-1","round":8,"year":2022,"number":1,"subject":"상법(보험편)","topic":"청약 낙부통지","stem":"상법상 손해보험계약에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"피보험자는 보험계약에서 정한 불확정한 사고가 발생한 경우 보험금의 지급을 보험자\n에게 청구할 수 없다."},{"n":"2","text":"보험자가 보험계약자로부터 보험계약의 청약과 함께 보험료 상당액의 전부 또는 일부의\n지급을 받은 때는 다른 약정이 없으면 30일 이내에 낙부통지를 발송해야 한다."},{"n":"3","text":"보험자는 보험사고가 발생한 경우 보험금이 아닌 형태의 보험급여를 지급할 것을\n약정할 수 없다."},{"n":"4","text":"보험기간의 시기(始期)는 보험계약 체결시점과 같아야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n청약과 함께 보험료 상당액을 전부 또는 일부 받으면 다른 약정이 없는 한 30일 내 낙부통지를 발송한다.\n\n오답 확인\n① 피보험자는 보험금을 청구할 수 있다. ③ 금전 외 급여도 약정 가능하다. ④ 소급보험 등 보험기간과 체결시점이 다를 수 있다.\n\n근거·학습주제\n상법 제638조·제638조의2","explanationSections":[{"label":"정답 근거","text":"청약과 함께 보험료 상당액을 전부 또는 일부 받으면 다른 약정이 없는 한 30일 내 낙부통지를 발송한다.","kind":"reason"},{"label":"오답 확인","text":"① 피보험자는 보험금을 청구할 수 있다. ③ 금전 외 급여도 약정 가능하다. ④ 소급보험 등 보험기간과 체결시점이 다를 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조·제638조의2","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["3-2","5-11","9-1","6-11","2-18","8-12","10-2","4-9","12-10"]},{"id":"8-2","round":8,"year":2022,"number":2,"subject":"상법(보험편)","topic":"약관 설명의무 위반","stem":"甲보험회사의 화재보험 약관에는 보험계약자에게 설명해야 하는 중요한 내용을\n포함하고 있으나 甲회사가 이를 설명하지 않고 보험계약을 체결하였다. 이에 관한\n설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험계약이 성립한 날로부터 1개월이 된 시점이라면 보험계약자는 보험계약을 취소할\n수 있다."},{"n":"2","text":"甲보험회사는 화재보험약관을 보험계약자에게 교부해야 한다."},{"n":"3","text":"보험계약이 성립한 날로부터 4개월이 된 시점이라면 보험계약자는 보험계약을 취소할\n수 없다."},{"n":"4","text":"보험계약자가 보험계약을 취소하지 않았다면 甲보험회사는 중요한 약관조항을 계약의\n내용으로 주장할 수 있다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n설명하지 않은 중요한 약관조항은 계약자가 취소하지 않았더라도 보험자가 계약내용으로 주장할 수 없다.\n\n오답 확인\n상법상 계약자의 취소기간은 성립일부터 3개월이다. 약관 교부와 중요한 내용 설명은 각각 의무다.\n\n근거·학습주제\n상법 제638조의3·약관규제법 제3조","explanationSections":[{"label":"정답 근거","text":"설명하지 않은 중요한 약관조항은 계약자가 취소하지 않았더라도 보험자가 계약내용으로 주장할 수 없다.","kind":"reason"},{"label":"오답 확인","text":"상법상 계약자의 취소기간은 성립일부터 3개월이다. 약관 교부와 중요한 내용 설명은 각각 의무다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제638조의3·약관규제법 제3조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":3,"similarIds":["2-16","5-2"]},{"id":"8-3","round":8,"year":2022,"number":3,"subject":"상법(보험편)","topic":"보험증권 재교부","stem":"상법상 보험증권에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험계약자가 보험증권을 멸실한 경우에는 보험자에 대하여 증권의 재교부를 청구할\n수 있으며, 그 증권 작성의 비용은 보험계약자가 부담한다."},{"n":"2","text":"기존의 보험계약을 변경한 경우 보험자는 그 보험증권에 그 사실을 기재함으로써\n보험증권의 교부에 갈음할 수 없다."},{"n":"3","text":"타인을 위한 보험계약이 성립된 경우에는 보험자는 그 타인에게 보험증권을 교부해야\n한다."},{"n":"4","text":"보험계약자가 최초의 보험료를 지급하지 아니한 경우에도 보험계약이 성립한 때에는\n보험자는 지체없이 보험증권을 작성하여 보험계약자에게 교부하여야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n분실한 증권은 재교부를 청구할 수 있고 작성비용은 계약자가 부담한다.\n\n오답 확인\n② 변경사항 기재로 교부에 갈음할 수 있다. ③ 교부 상대방은 계약자다. ④ 최초보험료 미지급이면 증권 교부의 예외가 된다.\n\n근거·학습주제\n상법 제640조·제642조","explanationSections":[{"label":"정답 근거","text":"분실한 증권은 재교부를 청구할 수 있고 작성비용은 계약자가 부담한다.","kind":"reason"},{"label":"오답 확인","text":"② 변경사항 기재로 교부에 갈음할 수 있다. ③ 교부 상대방은 계약자다. ④ 최초보험료 미지급이면 증권 교부의 예외가 된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제640조·제642조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["11-3","9-3","5-4","10-3","6-13","2-2","12-1","4-3","10-2","7-3","12-3","2-16","12-6","5-7","3-7"]},{"id":"8-4","round":8,"year":2022,"number":4,"subject":"상법(보험편)","topic":"보험사고의 객관적 확정","stem":"타인을 위한 손해보험계약(보험회사 A, 보험계약자 B, 타인 C)에서 보험사고의\n객관적 확정이 있는 경우 그 보험계약의 효력에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"보험계약 당시에 보험사고가 이미 발생하였음을 B가 알고서 보험계약을 체결하였다면\n그 계약은 무효이다."},{"n":"2","text":"보험계약 당시에 보험사고가 이미 발생하였음을 A와 B가 알았을지라도 C가 알지\n못했다면 그 계약은 유효하다."},{"n":"3","text":"보험계약 당시에 보험사고가 발생할 수 없음을 A가 알면서도 보험계약을 체결하였다면\n그 계약은 무효이다."},{"n":"4","text":"보험계약 당시에 보험사고가 발생할 수 없음을 A, B, C가 알지 못한 때에는 그 계약은\n유효하다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n사고 발생 또는 발생 불가능이 확정된 계약은 원칙적으로 무효이며 당사자 쌍방과 피보험자 모두 몰랐을 때만 예외다.\n\n오답 확인\n②는 보험자와 계약자가 알았는데도 피보험자가 몰랐다는 이유만으로 유효라고 하여 틀렸다. ①③은 무효, ④는 전원 부지의 예외다.\n\n근거·학습주제\n상법 제644조","explanationSections":[{"label":"정답 근거","text":"사고 발생 또는 발생 불가능이 확정된 계약은 원칙적으로 무효이며 당사자 쌍방과 피보험자 모두 몰랐을 때만 예외다.","kind":"reason"},{"label":"오답 확인","text":"②는 보험자와 계약자가 알았는데도 피보험자가 몰랐다는 이유만으로 유효라고 하여 틀렸다. ①③은 무효, ④는 전원 부지의 예외다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제644조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":4,"similarIds":["11-4","6-14","10-7","4-4","12-3"]},{"id":"8-5","round":8,"year":2022,"number":5,"subject":"상법(보험편)","topic":"보험대리상 권한","stem":"상법상 보험대리상 등에 관한 설명으로 옳은 것은 모두 몇 개인가?\n○ 보험대리상은 보험계약자로부터 보험료를 수령할 수 있는 권한을 갖는다.\n○ 보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결\n을 중개하는 자는 보험자가 작성한 보험증권을 보험계약자에게 교부할 수\n있는 권한을 갖는다.\n○ 대리인에 의하여 보험계약을 체결한 경우 대리인이 안 사유는 그 본인이 안\n것과 동일한 것으로 한다.\n○ 보험자는 보험대리상이 보험계약자로부터 청약, 고지, 통지 등 보험계약에 관\n한 의사표시를 수령할 수 있는 권한을 제한할 수 없다.","options":[{"n":"1","text":"1개"},{"n":"2","text":"2개"},{"n":"3","text":"3개"},{"n":"4","text":"4개"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n보험료 수령, 중개자의 증권 교부, 대리인 인식의 본인 귀속이라는 앞의 세 명제가 맞아 3개다.\n\n오답 확인\n보험자는 대리상 권한을 제한할 수 있으나 선의의 계약자에게 대항하지 못한다. 제한 자체가 불가능하다는 마지막 문장이 틀렸다.\n\n근거·학습주제\n상법 제646조·제646조의2","explanationSections":[{"label":"정답 근거","text":"보험료 수령, 중개자의 증권 교부, 대리인 인식의 본인 귀속이라는 앞의 세 명제가 맞아 3개다.","kind":"reason"},{"label":"오답 확인","text":"보험자는 대리상 권한을 제한할 수 있으나 선의의 계약자에게 대항하지 못한다. 제한 자체가 불가능하다는 마지막 문장이 틀렸다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조·제646조의2","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["12-4","4-5","11-5","7-4","5-6","2-3","6-15","2-21","12-5","9-5","8-6","10-4","9-17","2-24"]},{"id":"8-6","round":8,"year":2022,"number":6,"subject":"상법(보험편)","topic":"보험료 분납","stem":"상법상 보험계약자가 보험자와 보험료를 분납하기로 약정한 경우에 관한 설명으로\n옳지 않은 것은?","options":[{"n":"1","text":"보험계약 체결 후 보험계약자가 제1회 보험료를 지급하지 아니한 경우, 다른 약정이\n없는 한 계약 성립 후 2월이 경과하면 보험계약은 해제된 것으로 본다."},{"n":"2","text":"계속보험료가 연체된 경우 보험자는 즉시 그 계약을 해지할 수는 없다."},{"n":"3","text":"계속보험료가 연체된 경우 보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로\n보험계약의 체결을 중개하는 자는 보험계약자에 대해 해지의 의사표시를 할 수 있는\n권한이 있다."},{"n":"4","text":"보험대리상이 아니면서 특정한 보험자를 위하여 계속적으로 보험계약의 체결을 중개하\n는 자는 보험자가 작성한 영수증을 보험계약자에게 교부하는 경우에 한하여 보험료를\n수령할 권한이 있다."}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n단순 보험중개자에게 계약해지의 의사표시를 할 법정 권한은 없다.\n\n오답 확인\n최초보험료 미지급의 해제간주는 2개월, 계속보험료 지체는 최고 후 해지한다. 보험자 영수증 교부를 조건으로 한 중개자의 보험료 수령권은 인정된다.\n\n근거·학습주제\n상법 제646조의2·제650조","explanationSections":[{"label":"정답 근거","text":"단순 보험중개자에게 계약해지의 의사표시를 할 법정 권한은 없다.","kind":"reason"},{"label":"오답 확인","text":"최초보험료 미지급의 해제간주는 2개월, 계속보험료 지체는 최고 후 해지한다. 보험자 영수증 교부를 조건으로 한 중개자의 보험료 수령권은 인정된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제646조의2·제650조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":5,"similarIds":["12-5","11-5","2-3","6-15","5-6","12-4","4-5","7-4","8-5","9-5","7-6","9-6","4-9","11-7","12-7","10-5","2-5","1-6","8-8"]},{"id":"8-7","round":8,"year":2022,"number":7,"subject":"상법(보험편)","topic":"타인을 위한 보험의 해지","stem":"상법상 특정한 타인(이하 “A”라고 함)을 위한 손해보험계약에 관한 설명으로 옳\n은 것은?","options":[{"n":"1","text":"보험계약자는 A의 동의를 얻지 아니하거나 보험증권을 소지하지 아니하면 그 계약을\n해지하지 못한다."},{"n":"2","text":"A가 보험계약에 따른 이익을 받기 위해서는 이익을 받겠다는 의사표시를 하여야 한다."},{"n":"3","text":"보험계약자가 계속보험료의 지급을 지체한 때에는 보험자는 A에게 보험료 지급을\n최고하지 않아도 보험계약을 해지할 수 있다."},{"n":"4","text":"보험계약자가 A를 위해 보험계약을 체결하려면 A의 위임을 받아야 한다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n타인을 위한 보험은 타인의 동의를 얻거나 보험증권을 소지하는 요건 없이 임의로 해지할 수 없다.\n\n오답 확인\n타인의 수익 의사표시·위임은 불필요하다. 특정 타인의 계약에서는 그 타인에게도 보험료 지급을 최고해야 한다.\n\n근거·학습주제\n상법 제639조·제649조·제650조","explanationSections":[{"label":"정답 근거","text":"타인을 위한 보험은 타인의 동의를 얻거나 보험증권을 소지하는 요건 없이 임의로 해지할 수 없다.","kind":"reason"},{"label":"오답 확인","text":"타인의 수익 의사표시·위임은 불필요하다. 특정 타인의 계약에서는 그 타인에게도 보험료 지급을 최고해야 한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제639조·제649조·제650조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":6,"similarIds":["3-7","9-6","12-7","11-7","5-7","1-6","2-5","6-12","1-7"]},{"id":"8-8","round":8,"year":2022,"number":8,"subject":"상법(보험편)","topic":"계약 부활","stem":"상법상 손해보험계약의 부활에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"제1회 보험료의 지급이 이루어지지 않아 보험계약이 해제된 경우 보험계약자는 보험\n계약의 부활을 청구할 수 있다."},{"n":"2","text":"계속보험료의 연체로 인하여 보험계약이 해지되고 해지환급금이 지급되지 아니한\n경우 보험계약자는 보험계약의 부활을 청구할 수 있다."},{"n":"3","text":"계속보험료의 연체로 인하여 보험계약이 해지된 c":"위험변경증가","stem":"보험기간 중 사고발생의 위험이 현저하게 변경된 경우에 관한 설명으로 옳은 것\n을 모두 고른 것은?\nㄱ. 보험수익자가 이 사실을 안 때에는 지체없이 보험자에게 통지하여야 한다.\nㄴ. 보험자가 보험계약자로부터 위험변경의 통지를 받은 때로부터 2월이 경과\n하면 계약을 해지할 수 없다.\nㄷ. 보험수익자의 고의로 인하여 위험이 현저하게 변경된 때에는 보험자는\n보험료의 증액을 청구할 수 있다.\nㄹ. 피보험자의 중대한 과실로 인하여 위험이 현저하게 변경된 때에는 보험자는\n계약을 해지할 수 없다.","options":[{"n":"1","text":"ㄱ, ㄴ"},{"n":"2","text":"ㄴ, ㄷ"},{"n":"3","text":"ㄷ, ㄹ"},{"n":"4","text":"ㄱ, ㄴ, ㄷ, ㄹ"}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\nㄴ은 통지 수령 후 1개월의 해지기간 경과에 관한 설명, ㄷ은 수익자의 고의 위험증가에 대한 증액청구로 옳다.\n\n오답 확인\nㄱ 통지의무자는 계약자·피보험자다. ㄹ 피보험자의 중과실로 현저히 위험이 증가하면 보험자는 해지할 수 있다.\n\n근거·학습주제\n상법 제652조·제653조","explanationSections":[{"label":"정답 근거","text":"ㄴ은 통지 수령 후 1개월의 해지기간 경과에 관한 설명, ㄷ은 수익자의 고의 위험증가에 대한 증액청구로 옳다.","kind":"reason"},{"label":"오답 확인","text":"ㄱ 통지의무자는 계약자·피보험자다. ㄹ 피보험자의 중과실로 현저히 위험이 증가하면 보험자는 해지할 수 있다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제652조·제653조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":7,"similarIds":["11-10","9-15","3-10","10-9","12-9","7-9","6-19","4-10","2-14","7-10","5-9","8-11","10-10","1-9","4-6"]},{"id":"8-11","round":8,"year":2022,"number":11,"subject":"상법(보험편)","topic":"계약 해지와 보험금","stem":"보험계약의 해지에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"보험자가 파산의 선고를 받은 때에는 보험계약자는 계약을 해지할 수 있다."},{"n":"2","text":"보험자가 보험기간 중에 사고발생의 위험이 현저하게 증가하여 보험계약을 해지한\n경우 이미 지급한 보험금의 반환을 청구할 수 없다."},{"n":"3","text":"보험자가 파산의 선고를 받은 경우 해지하지 아니한 보험계약은 파산선고 후 3월을\n경과한 때에는 그 효력을 잃는다."},{"n":"4","text":"보험자가 보험기간중 사고발생의 위험이 현저하게 변경되었음을 이유로 계약을 해지\n하려는 경우 그 사실을 입증하여야 한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n현저한 위험증가를 이유로 사고 후 해지하면 법정 요건에 따라 이미 지급한 보험금 반환도 청구할 수 있다. 언제나 불가능하다는 ②가 틀렸다.\n\n오답 확인\n파산시 계약자 해지권, 미해지 계약의 3개월 후 실효, 위험변경 사실에 대한 보험자의 입증은 인정된다. 인과관계 부존재 예외를 별도로 확인한다.\n\n근거·학습주제\n상법 제654조·제655조","explanationSections":[{"label":"정답 근거","text":"현저한 위험증가를 이유로 사고 후 해지하면 법정 요건에 따라 이미 지급한 보험금 반환도 청구할 수 있다. 언제나 불가능하다는 ②가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"파산시 계약자 해지권, 미해지 계약의 3개월 후 실효, 위험변경 사실에 대한 보험자의 입증은 인정된다. 인과관계 부존재 예외를 별도로 확인한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제654조·제655조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["9-16","6-2","5-9","12-6","3-10","9-15","4-10","3-11","8-10","11-10","7-10","9-7","12-9"]},{"id":"8-12","round":8,"year":2022,"number":12,"subject":"상법(보험편)","topic":"보험자 면책과 책임개시","stem":"상법상 보험사고의 발생에 따른 보험자의 책임에 관한 설명으로 옳은 것은?","options":[{"n":"1","text":"보험수익자가 보험사고의 발생을 안 때에는 보험자에게 그 통지를 할 의무가 없다."},{"n":"2","text":"보험사고가 보험계약자의 고의로 인하여 생긴 때에는 보험자는 보험금액을 지급할\n책임이 없다."},{"n":"3","text":"보험자는 보험금액의 지급에 관하여 약정기간이 없는 경우 지급할 보험금액이 정하여진\n날로부터 5일내에 지급하여야 한다."},{"n":"4","text":"보험자의 책임은 당사자간에 다른 약정이 없으면 보험계약자가 보험계약의 체결을\n청약한 때로부터 개시한다."}],"answers":["2"],"answerLabel":"2번","explanation":"정답 근거\n계약자의 고의로 사고가 생긴 경우 보험자는 원칙적으로 보험금 지급책임이 없다.\n\n오답 확인\n① 수익자도 통지의무를 진다. ③ 금액 결정 후 10일 내 지급한다. ④ 원칙적으로 최초보험료를 받은 때 책임이 개시된다.\n\n근거·학습주제\n상법 제656조~제659조","explanationSections":[{"label":"정답 근거","text":"계약자의 고의로 사고가 생긴 경우 보험자는 원칙적으로 보험금 지급책임이 없다.","kind":"reason"},{"label":"오답 확인","text":"① 수익자도 통지의무를 진다. ③ 금액 결정 후 10일 내 지급한다. ④ 원칙적으로 최초보험료를 받은 때 책임이 개시된다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제656조~제659조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":8,"similarIds":["12-10","2-18","9-13","3-12","10-11","4-12","11-12","7-14","10-10","12-18","11-11","5-9","2-5","3-6","11-7","1-10","8-1","3-11","9-16"]},{"id":"8-13","round":8,"year":2022,"number":13,"subject":"상법(보험편)","topic":"불이익변경금지","stem":"상법 보험편에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)","options":[{"n":"1","text":"재보험에서는 당사자간의 특약에 의하여 상법 보험편의 규정을 보험계약자의 불이익\n으로 변경할 수 있다."},{"n":"2","text":"보험계약자 등의 불이익변경 금지원칙은 보험계약자와 보험자가 서로 대등한 경제적\n지위에서 계약조건을 정하는 기업보험에 있어서는 그 적용이 배제된다."},{"n":"3","text":"상법 보험편의 규정은 그 성질에 반하지 아니하는 범위에서 공제에도 준용된다."},{"n":"4","text":"상법 보험편의 규정은 약관에 의하여 피보험자나 보험수익자의 이익으로 변경할 수\n없다."}],"answers":["4"],"answerLabel":"4번","explanation":"정답 근거\n이익으로 변경하는 특약은 가능하므로 ④가 틀렸다.\n\n오답 확인\n재보험과 대등한 당사자의 기업보험에는 불이익변경금지 예외가 있다. 보험편은 성질에 반하지 않는 범위에서 공제에도 준용한다.\n\n근거·학습주제\n상법 제663조·제664조","explanationSections":[{"label":"정답 근거","text":"이익으로 변경하는 특약은 가능하므로 ④가 틀렸다.","kind":"reason"},{"label":"오답 확인","text":"재보험과 대등한 당사자의 기업보험에는 불이익변경금지 예외가 있다. 보험편은 성질에 반하지 않는 범위에서 공제에도 준용한다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제663조·제664조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":["4-14","3-15","7-16","12-12"]},{"id":"8-14","round":8,"year":2022,"number":14,"subject":"상법(보험편)","topic":"손해보험증권 기재","stem":"상법상 손해보험증권에 기재되어야 하는 사항으로 옳은 것은 모두 몇 개인가?\n○ 보험수익자의 주소, 성명 또는 상호\n○ 무효의 사유\n○ 보험사고의 성질\n○ 보험금액","options":[{"n":"1","text":"1개"},{"n":"2","text":"2개"},{"n":"3","text":"3개"},{"n":"4","text":"4개"}],"answers":["3"],"answerLabel":"3번","explanation":"정답 근거\n무효 사유, 보험사고 성질, 보험금액의 세 항목이 법정 기재사항이다.\n\n오답 확인\n손해보험증권은 보험계약자·피보험자의 인적사항을 규정한다. 보기의 보험수익자 인적사항과 혼동하지 않는다.\n\n근거·학습주제\n상법 제666조","explanationSections":[{"label":"정답 근거","text":"무효 사유, 보험사고 성질, 보험금액의 세 항목이 법정 기재사항이다.","kind":"reason"},{"label":"오답 확인","text":"손해보험증권은 보험계약자·피보험자의 인적사항을 규정한다. 보기의 보험수익자 인적사항과 혼동하지 않는다.","kind":"incorrect"},{"label":"근거·학습주제","text":"상법 제666조","kind":"reference"}],"sourcePdf":"2022년 제8회 손해평가사 1차 A형 정답 및 해설_재작성.pdf","sourcePdfPage":9,"similarIds":[]},{"id":"8-15","round":8,"year":2022,"number":15,"subject":"상법(보험편)","topic":"기평가보험","stem":"상법상 손해보험에 관한 설명으로 옳지 않은 것은?","options":[{"n":"1","text":"당사자간에 보험가액을 정한 때에는 그 가액은 사고발생시의 가액으로 정한 것으로\n본다."},{"n":"2","text":"당사자는 약정에 의하여 보험사고로 인하여 상실된 피보험자가 얻을 보수를 보험자가\n보상할 손해액에 산입할 수 있다."},{"n":"3","text":"화재보험의 보험자는 화재의 소방 또는 손해의 감소에 필요한 조치로 인하여 생긴\n손해를 보상할 책임이 있다."},{"n":"4","text":"보험계약은 금전으로 산정할 수 있는 이익에 한하여 보험계약의 목적으로 할 수 있다."}],"answers":["1"],"answerLabel":"1번","explanation":"정답 근거\n미리 정한 보험가액은 계약 당시 가액으로 추정한다. 사고시 가액으로 본다는 ①이 틀렸다.\n\n오답 확인\n상실보수의 약정보상, 소방조치로 생긴 손해 보상, 금전평가 가능한 피보험이익의 요구는 맞다.\
